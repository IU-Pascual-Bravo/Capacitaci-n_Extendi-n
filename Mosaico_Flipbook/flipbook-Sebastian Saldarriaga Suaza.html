<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Flipbook</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1714;min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-family:Georgia,'Times New Roman',serif;
  color:#e8dfd0;padding:12px;overflow:hidden;
}
#stage{
  display:flex;align-items:center;
  gap:clamp(5px,1.5vw,16px);
  width:100%;justify-content:center;flex-shrink:0;
}
.nav-arrow{
  width:clamp(30px,5vw,44px);height:clamp(30px,5vw,44px);
  border-radius:50%;background:#2a2520;border:1px solid #4a4035;
  color:#c8b89a;font-size:clamp(13px,3vw,20px);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.15s;flex-shrink:0;user-select:none;
}
.nav-arrow:hover{background:#3a3025;}
.nav-arrow:disabled{opacity:0.25;cursor:default;}

/* ── Libro 3D ── */
#book-wrap{
  position:relative;flex-shrink:0;
  perspective:2500px;
}
#book-scene{
  position:relative;
  width:calc(var(--pw,200px)*2 + var(--spw,10px));
  height:var(--ph,267px);
  filter:drop-shadow(0 8px 32px rgba(0,0,0,0.7));
}

.page-container{
  width:var(--pw,200px);
  height:var(--ph,267px);
  position:absolute;
  top:0;
  left:calc(var(--pw,200px) + var(--spw,10px));
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform 0.85s cubic-bezier(0.645,0.045,0.355,1.000);
  z-index:1;
}
.page-container.flipped{
  transform:rotateY(-180deg);
}

.page-face{
  width:100%;height:100%;
  position:absolute;top:0;left:0;
  backface-visibility:hidden;
  overflow:hidden;
  background:#f5f0e8;
}
.page-face.front{
  border-radius:0 6px 6px 0;
  box-shadow:inset 6px 0 12px rgba(0,0,0,0.08);
}
.page-face.front::after{
  content:'';position:absolute;top:0;bottom:0;left:0;width:56px;
  background:linear-gradient(to right,
    rgba(0,0,0,0.45) 0%,
    rgba(0,0,0,0.22) 20%,
    rgba(0,0,0,0.08) 55%,
    transparent 100%
  );
  pointer-events:none;
}
.page-face.back{
  transform:rotateY(180deg);
  border-radius:6px 0 0 6px;
  box-shadow:inset -6px 0 12px rgba(0,0,0,0.12);
}
.page-face.back::after{
  content:'';position:absolute;top:0;bottom:0;right:0;width:56px;
  background:linear-gradient(to left,
    rgba(0,0,0,0.40) 0%,
    rgba(0,0,0,0.20) 20%,
    rgba(0,0,0,0.07) 55%,
    transparent 100%
  );
  pointer-events:none;
}
.page-face img{
  width:100%;height:100%;object-fit:contain;display:block;
  pointer-events:auto;user-select:none;cursor:zoom-in;
}
.empty-page{
  width:100%;height:100%;background:#f0ece0;
  display:flex;align-items:center;justify-content:center;
}
.empty-page span{font-size:28px;color:rgba(0,0,0,0.07);}

#solo-wrap{
  display:none;
  position:relative;
  width:var(--pw,200px);
  height:var(--ph,267px);
  filter:drop-shadow(0 8px 32px rgba(0,0,0,0.7));
}
#solo-page{
  width:100%;height:100%;
  background:#f5f0e8;
  border-radius:6px;
  overflow:hidden;
}
#solo-page img{width:100%;height:100%;object-fit:contain;display:block;}

#page-info{
  font-size:clamp(10px,1.5vw,13px);color:#7a6e60;
  letter-spacing:0.05em;text-align:center;
  margin:clamp(6px,1vh,12px) 0 clamp(4px,0.8vh,8px);flex-shrink:0;
}
#dot-row{
  display:flex;gap:7px;justify-content:center;
  flex-wrap:wrap;margin-bottom:clamp(6px,1vh,12px);flex-shrink:0;
}
.dot{width:8px;height:8px;border-radius:50%;background:#4a4035;cursor:pointer;transition:background 0.2s,transform 0.15s;}
.dot.active{background:#c8b89a;transform:scale(1.35);}

/* ── Lightbox con zoom/pan ── */
#lightbox{
  display:none;position:fixed;inset:0;z-index:1000;
  background:rgba(10,8,6,0.92);
  align-items:center;justify-content:center;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  animation:lbIn 0.22s cubic-bezier(0.4,0,0.2,1);
}
#lightbox.open{display:flex;}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
#lightbox-img-wrap{
  width:90vw;height:88vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;cursor:grab;border-radius:6px;position:relative;
}
#lightbox-img-wrap.grabbing{cursor:grabbing;}
#lightbox-img{
  display:block;border-radius:6px;
  box-shadow:0 24px 80px rgba(0,0,0,0.8);
  animation:lbImgIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
  max-width:100%;max-height:100%;
  object-fit:contain;user-select:none;-webkit-user-select:none;
  pointer-events:none;
}
@keyframes lbImgIn{from{transform:scale(0.88);opacity:0}to{transform:scale(1);opacity:1}}
#lightbox-close{
  position:fixed;top:18px;right:22px;
  width:40px;height:40px;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:50%;
  color:#e8dfd0;font-size:20px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background 0.15s,transform 0.15s;
  z-index:1001;
}
#lightbox-close:hover{background:rgba(255,255,255,0.2);transform:scale(1.1);}
.page-face img,.page-face-solo{cursor:zoom-in;}
</style>
</head>
<body>
<div id="lightbox" onclick="closeLightbox()">
  <button id="lightbox-close" onclick="event.stopPropagation();closeLightbox()" title="Cerrar">&#10005;</button>
  <div id="lightbox-img-wrap" onclick="event.stopPropagation()">
    <img id="lightbox-img" draggable="false" alt=""/>
  </div>
</div>
<div id="stage">
  <button class="nav-arrow" id="btn-prev" onclick="go(-1)">&#8592;</button>
  <div id="book-wrap">
    <div id="book-scene">
      <!-- Las hojas (.page-container) se generan por JS -->
    </div>
    <div id="solo-wrap">
      <div id="solo-page"></div>
    </div>
  </div>
  <button class="nav-arrow" id="btn-next" onclick="go(1)">&#8594;</button>
</div>
<div id="page-info"></div>
<div id="dot-row"></div>

var PAGE_RATIO=[4,3];
var animating=false;
var pages=[];
var spreadIndex=0;

/* ── Tamaño responsive ── */
function calcSize(){
  var vw=window.innerWidth,vh=window.innerHeight;
  var rw=PAGE_RATIO[0],rh=PAGE_RATIO[1];
  var usedV=80;
  var availH=Math.max(120,vh-usedV);
  var arrowW=Math.min(44,Math.max(30,vw*0.05));
  var arrowGap=Math.min(16,Math.max(5,vw*0.015));
  var sidePad=Math.min(32,vw*0.03);
  var availW=vw-(arrowW+arrowGap)*2-sidePad*2;
  var spw=Math.max(6,Math.round(availW*0.018));
  var pw=Math.floor((availW-spw)/2);
  pw=Math.max(80,Math.round(pw));
  var ph=Math.round(pw*rh/rw);
  if(ph>availH){ph=Math.max(100,Math.round(availH));pw=Math.max(80,Math.round(ph*rw/rh));}
  spw=Math.max(6,Math.round(pw*0.05));
  document.documentElement.style.setProperty('--pw',pw+'px');
  document.documentElement.style.setProperty('--ph',ph+'px');
  document.documentElement.style.setProperty('--spw',spw+'px');
  var scene=document.getElementById('book-scene');
  if(scene){scene.style.width=(pw*2+spw)+'px';scene.style.height=ph+'px';}
}

/* ── Construcción del DOM ── */
function buildDOM(){
  var scene=document.getElementById('book-scene');
  scene.querySelectorAll('.page-container').forEach(function(el){el.remove();});
  pages=[];
  var numSheets=Math.ceil(IMGS.length/2);
  for(var i=0;i<numSheets;i++){
    var frontSrc=IMGS[2*i]||null;
    var backSrc =IMGS[2*i+1]||null;
    var pc=document.createElement('div');
    pc.className='page-container';
    pc.style.zIndex=numSheets-i;

    var front=document.createElement('div');
    front.className='page-face front';
    if(frontSrc){var img=document.createElement('img');img.src=frontSrc;img.draggable=false;front.appendChild(img);}
    else{front.innerHTML='<div class="empty-page"><span>\xb7</span></div>';}

    var back=document.createElement('div');
    back.className='page-face back';
    if(backSrc){var img2=document.createElement('img');img2.src=backSrc;img2.draggable=false;back.appendChild(img2);}
    else{back.innerHTML='<div class="empty-page"><span>\xb7</span></div>';}

    pc.appendChild(front);
    pc.appendChild(back);
    scene.appendChild(pc);
    pages.push(pc);
  }
}

function totalSpreads(){
  return IMGS.length?1+Math.ceil((IMGS.length-1)/2):0;
}

function showSpread(idx,instant){
  var t=totalSpreads();
  if(idx<0||idx>=t)return;
  var prev=spreadIndex;
  spreadIndex=idx;
  var numSheets=pages.length;

  var scene=document.getElementById('book-scene');
  var soloWrap=document.getElementById('solo-wrap');
  var comingFromCover=(prev===0 && idx>0 && !instant && scene.style.display==='none');

  if(!comingFromCover){
    for(var i=0;i<numSheets;i++){
      var shouldFlip=i<spreadIndex;
      if(instant){
        pages[i].style.transition='none';
        pages[i].classList.toggle('flipped',shouldFlip);
        pages[i].style.zIndex=shouldFlip ? i+1 : numSheets-i+10;
      }else{
        if(!shouldFlip && pages[i].classList.contains('flipped')){
          pages[i].style.zIndex=numSheets+50;
        } else if(shouldFlip && !pages[i].classList.contains('flipped')){
          pages[i].style.zIndex=numSheets+50;
        } else {
          pages[i].style.zIndex=shouldFlip ? i+1 : numSheets-i+10;
        }
        pages[i].style.transition='';
        pages[i].classList.toggle('flipped',shouldFlip);
        (function(el,flipped,idx2){
          setTimeout(function(){
            el.style.zIndex=flipped ? idx2+1 : numSheets-idx2+10;
          },900);
        })(pages[i],shouldFlip,i);
      }
    }
  }

  /* Portada vs doble página */
  var isSolo=(spreadIndex===0);
  if(isSolo){
    scene.style.display='none';
    soloWrap.style.display='block';
    var sp=document.getElementById('solo-page');
    sp.innerHTML='';
    if(IMGS[0]){var si=document.createElement('img');si.src=IMGS[0];si.draggable=false;sp.appendChild(si);}
  } else if(comingFromCover){
    soloWrap.style.display='none';
    scene.style.display='block';
    scene.getBoundingClientRect();
    requestAnimationFrame(function(){
      for(var k=0;k<numSheets;k++){
        var sf=k<spreadIndex;
        pages[k].style.zIndex=sf ? numSheets+50 : numSheets-k+10;
        pages[k].style.transition='';
        pages[k].classList.toggle('flipped',sf);
        (function(el,flipped,idx2){
          setTimeout(function(){
            el.style.zIndex=flipped ? idx2+1 : numSheets-idx2+10;
          },900);
        })(pages[k],sf,k);
      }
      setTimeout(function(){animating=false;},900);
    });
  } else {
    soloWrap.style.display='none';
    scene.style.display='block';
  }

  /* Botones */
  document.getElementById('btn-prev').disabled=(spreadIndex<=0);
  document.getElementById('btn-next').disabled=(spreadIndex>=t-1);

  setTimeout(function(){addPageClickListeners();},50);

  /* Info */
  var info=document.getElementById('page-info');
  if(isSolo){
    info.textContent='Portada \xb7 P\xe1gina 1 de '+IMGS.length;
  }else{
    var li=2*spreadIndex-1,ri=li+1;
    info.textContent='P\xe1ginas '+(li+1)+'\u2013'+Math.min(ri+1,IMGS.length)+' de '+IMGS.length;
  }

  /* Dots */
  var dots=document.getElementById('dot-row');
  dots.innerHTML='';
  var t2=totalSpreads();
  for(var j=0;j<t2;j++){
    (function(jj){
      var d=document.createElement('div');
      d.className='dot'+(jj===spreadIndex?' active':'');
      d.onclick=function(){window.go(jj-spreadIndex);};
      dots.appendChild(d);
    })(j);
  }
}

window.go=function(delta){
  if(animating)return;
  var next=spreadIndex+delta;
  if(next<0||next>=totalSpreads())return;
  animating=true;
  showSpread(next,false);
  setTimeout(function(){animating=false;},900);
};

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')window.go(-1);
  if(e.key==='ArrowRight'||e.key==='ArrowDown')window.go(1);
});

function bindButtons(){
  var bp=document.getElementById('btn-prev');
  var bn=document.getElementById('btn-next');
  if(bp)bp.addEventListener('click',function(){window.go(-1);});
  if(bn)bn.addEventListener('click',function(){window.go(1);});
}

/* ── Lightbox con zoom/pan ── */
var lbScale=1,lbTX=0,lbTY=0,lbDragging=false,lbStartMX=0,lbStartMY=0,lbStartTX=0,lbStartTY=0,lbDist=0;

function applyLbTransform(){
  var img=document.getElementById('lightbox-img');
  img.style.transform='translate('+lbTX+'px,'+lbTY+'px) scale('+lbScale+')';
}

function openLightbox(src){
  var lb=document.getElementById('lightbox');
  var lbImg=document.getElementById('lightbox-img');
  lbScale=1;lbTX=0;lbTY=0;
  lbImg.style.transform='';
  lbImg.src=src;
  lb.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  var lb=document.getElementById('lightbox');
  lb.classList.remove('open');
  document.body.style.overflow='';
  setTimeout(function(){document.getElementById('lightbox-img').src='';document.getElementById('lightbox-img').style.transform='';},250);
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeLightbox();
});

document.getElementById('lightbox-img-wrap').addEventListener('wheel',function(e){
  e.preventDefault();
  var delta=e.deltaY>0?-0.08:0.08;
  lbScale=Math.max(0.25,Math.min(6,lbScale+delta));
  applyLbTransform();
},{passive:false});

document.getElementById('lightbox-img-wrap').addEventListener('mousedown',function(e){
  e.preventDefault();
  lbDragging=true;lbStartMX=e.clientX;lbStartMY=e.clientY;lbStartTX=lbTX;lbStartTY=lbTY;
  this.classList.add('grabbing');
});
document.addEventListener('mousemove',function(e){
  if(!lbDragging)return;
  lbTX=lbStartTX+(e.clientX-lbStartMX)/lbScale;
  lbTY=lbStartTY+(e.clientY-lbStartMY)/lbScale;
  applyLbTransform();
});
document.addEventListener('mouseup',function(){
  if(!lbDragging)return;
  lbDragging=false;
  var w=document.getElementById('lightbox-img-wrap');
  if(w)w.classList.remove('grabbing');
});

document.getElementById('lightbox-img-wrap').addEventListener('touchstart',function(e){
  if(e.touches.length===1){
    lbDragging=true;lbStartMX=e.touches[0].clientX;lbStartMY=e.touches[0].clientY;lbStartTX=lbTX;lbStartTY=lbTY;
  }else if(e.touches.length===2){
    lbDragging=false;
    var dx=e.touches[0].clientX-e.touches[1].clientX;
    var dy=e.touches[0].clientY-e.touches[1].clientY;
    lbDist=Math.sqrt(dx*dx+dy*dy);
  }
});
document.getElementById('lightbox-img-wrap').addEventListener('touchmove',function(e){
  e.preventDefault();
  if(e.touches.length===1 && lbDragging){
    lbTX=lbStartTX+(e.touches[0].clientX-lbStartMX)/lbScale;
    lbTY=lbStartTY+(e.touches[0].clientY-lbStartMY)/lbScale;
    applyLbTransform();
  }else if(e.touches.length===2){
    var dx=e.touches[0].clientX-e.touches[1].clientX;
    var dy=e.touches[0].clientY-e.touches[1].clientY;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(lbDist>0){
      lbScale=Math.max(0.25,Math.min(6,lbScale*(dist/lbDist)));
      applyLbTransform();
    }
    lbDist=dist;
  }
},{passive:false});
document.getElementById('lightbox-img-wrap').addEventListener('touchend',function(){lbDragging=false;});

function addPageClickListeners(){
  document.querySelectorAll('.page-face img').forEach(function(img){
    img.style.cursor='zoom-in';
    img.addEventListener('click',function(e){
      e.stopPropagation();
      if(!animating)openLightbox(img.src);
    });
  });
  var spImg=document.querySelector('#solo-page img');
  if(spImg){
    spImg.style.cursor='zoom-in';
    spImg.addEventListener('click',function(e){
      e.stopPropagation();
      openLightbox(spImg.src);
    });
  }
}

function init(){
  calcSize();
  buildDOM();
  bindButtons();
  showSpread(0,true);
  addPageClickListeners();
}

window.addEventListener('resize',function(){calcSize();});
window.addEventListener('orientationchange',function(){setTimeout(function(){calcSize();},150);});
window.addEventListener('DOMContentLoaded',init);
</script>
