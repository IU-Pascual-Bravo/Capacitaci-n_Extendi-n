<script>
    const PDF_TEXT = "\nEl    análisis  DAFO ,  también  conocido  como    matriz  SWOT,  DOFA   o  FODA , es una  herramienta de análisis estratégica multidimensional  que  permite, por un lado, distinguir los factores internos de una organización  (fortalezas  y  debilidades)  y  los  factores  externos  relacionados  con  su  entorno (oportunidades y amenazas) y, por otro, seleccionar los factores  identificados  en  función  del  impacto  esperado,  pudiendo  ser  positivo  o  negativo.  Gracias al análisis DAFO lograrás detectar los puntos fuertes y débiles no  solo  a  nivel  de  funcionamiento  interno  (en  términos  de  competitividad-  coste,  red  y  capacidad  de  distribución,    marketing   y  ventas,  medios  financieros,  recursos  humanos,  etc.),  sino  también  a  nivel  del  entorno  externo (clima económico, grandes tendencias de los consumidores, entorno  competitivo,  etc.),  mejorando  así  la    planificación    estratégica   y  fortaleciendo tu negocio.  Te ofrecemos las claves para:  exprimir al máximo los puntos fuertes de tu empresa;  diseñar  un  plan  de  acción  estratégico  para  incrementar  el  rendimiento;  detectar las debilidades de tu organización;  esquivar las amenazas a las que se enfrenta tu empresa;  etc. \nChristophe Speth  El análisis DAFO Los secretos para fortalecer su negocio  En 50 minutos    Economía y empresa - 0  ePub r1.0  Titivillus  02-06-2020 \nChristophe Speth, 2018  Traducción: Marina Martín Serra     Editor digital: Titivillus  ePub base r2.1 \nEL ANÁLISIS DAFO  Datos clave  ¿Denominaciones?  Análisis DAFO, FODA, DOFA o SWOT, matriz  SWOT.    Sus    siglas    corresponden    a    los    conceptos    Debilidades,  Amenazas,  Fortalezas  y  Oportunidades  (traducción  de  las  palabras  que en inglés forman las siglas de SWOT).  ¿Utilidad?   Este  modelo  permite  a  una  organización  (empresa,  administración  pública  o  asociación)  identificar  rápidamente  los  factores  tanto  internos,  vinculados  a  su  funcionamiento  interno,  como  externos,  que  dependen  del  entorno  en  el  que  opera.  Es  una  herramienta  para  ayudar  a  la  toma  de  decisiones  y  facilita  la  elaboración de un plan estratégico.  ¿Por qué es eficaz?   El  gran  poder  del  análisis  DAFO  reside  en  su  simplicidad.    Además    de    ser    fácil    de    utilizar,    permite    extraer  resultados que pueden comunicarse a un público no especializado sin  grandes dificultades.  ¿Palabras clave?  Factor    externo :    elemento    ligado    al    entorno    en    el    que  evoluciona una organización, sobre el que esta no puede tener  un impacto directo.  Factor  interno :  elemento  sobre  el  que  una  organización  tiene  un impacto. Así, puede influenciarlo y/o modificarlo.  Debilidades : factores internos que debilitan el posicionamiento  competitivo de una organización.  Amenazas :  factores  externos  que  influyen  negativamente  al  entorno externo de una organización.  Fortalezas :  factores  internos  en  poder  de  la  empresa  que  refuerzan el posicionamiento competitivo de una organización. \nOportunidades :    factores    externos    que    influyen    o    podrían  influir    positivamente    en    la    posición    competitiva    de    una  organización.  Introducción  Historia  El  análisis  DAFO  tiene  sus  orígenes  en  la  obra    Business Policy. Text and  Cases  (1965), escrita por cuatro profesores de la Universidad de Harvard —  Edmund    Philip    Learned    (1900-1991),     Roland    Chris    Christensen    (1919-1999),  Kenneth Richmond Andrews  (1916-2005)  y William D. Guth  —.  Este  análisis  es  uno  de  los  primeros  modelos  que  se  interesan  por  el  entorno  externo  de  una  organización.  Hasta  entonces,  los  modelos  de  estrategia  tenían  tendencia  a  limitarse  a  la  planificación  estratégica,  sin  tener en cuenta realmente su entorno.  Hoy en día, el análisis DAFO se usa principalmente en los departamentos  de  marketing  de las grandes empresas, pero también hay muchas pymes que  lo emplean como herramienta de ayuda a la toma de decisiones.  Es interesante remarcar que muchas consultorías recurren al análisis DAFO,  ya  que  este  les  permite  analizar  rápidamente  y  presentar  de  manera  esquemática  y  simplificada  la  situación  a  sus  clientes.  Otras  consultorías,  como BCG y McKinsey, tienen su propio modelo de análisis.  Definición  El    análisis    DAFO    es    una    herramienta    de    análisis    estratégico  multidimensional:  por    un    lado,    permite    distinguir    los    factores    internos    de    una  organización    (fortalezas    y    debilidades)    y    los    factores    externos  relacionados con su entorno (oportunidades y amenazas); \npor el otro, permite seleccionar los factores identificados en función  del    impacto    esperado,    pudiendo    ser    positivo    (fortalezas    y  oportunidades) o negativo (debilidades y amenazas).  Un  análisis  DAFO  no  tiene  ningún  valor  intrínseco.  Su  uso  solo  está  justificado en el marco de una visión estratégica. \nTEORÍA Y PRESENTACIÓN DEL  CONCEPTO  El  análisis  DAFO  permite  hacer  un  balance  de  la  situación  de  una  organización en un momento dado, con una óptica más prospectiva que  retrospectiva.  Se  trata  pues  de  analizar  la  situación  de  una  estructura  teniendo en mente sus perspectivas de futuro. El análisis DAFO se centra a  la  vez  en  el  funcionamiento  interno  (fortalezas  y  debilidades)  y  en  el  entorno externo (oportunidades y amenazas) de una organización. \nLas  fortalezas   son  factores  específicos  en  una  organización  que  influyen positivamente en su evolución y su posición competitiva.  De  forma  general,  consideramos  que  las  fortalezas  son  particularmente importantes ya que no caracterizan a la competencia.  Así,  el  uso  del  análisis  DAFO  permite  señalar  las  ventajas  competitivas que tiene una empresa con respecto a sus competidores.  Las  debilidades   están  igualmente  vinculadas  al  funcionamiento  interno  de  una  organización,  pero  en  general  tienen  un  impacto  negativo  sobre  su  evolución  y  su  posición  competitiva.  Es  muy  importante determinar de manera precisa las debilidades internas de  una organización: esto permite trabajar en la mejora de los puntos  afectados  y  reorientar  las  actividades  para  que  sean  menos  vulnerables.  Las  oportunidades   dependen  del  entorno  externo  de  una  organización. Se pueden explotar para mejorar su evolución y su  posición competitiva. Tan pronto como esto se hace, se convierten en  fortalezas  que  influyen  favorablemente  en  el  desarrollo  de  la  organización.  Las amenazas  se encuentran también en el entorno externo de una  organización. Su identificación es a menudo fruto de un trabajo de  vigilancia estratégica. Cuando se detectan a tiempo, la organización  puede  anticiparse  mejor  a  ellas  y  el  impacto  que  tienen  en  el  rendimiento se puede reducir o invertir.  En algunos casos, hay amenazas que pueden convertirse en fortalezas, del  mismo  modo  en  que  hay  oportunidades  que  pueden  convertirse  en  debilidades. Como la organización no está sola en su entorno, su futuro  depende igualmente de las decisiones que toma la competencia.  Los factores que influyen en el desarrollo de  una organización  A nivel del funcionamiento interno, hay varias características que hay que  tener en cuenta para hacer una lista de las fortalezas y debilidades de una \norganización, entre las que destacan:  la competitividad-coste . Uno de los primeros aspectos que permite  que  una  empresa  sea  competitiva  es  su  capacidad  de  reducir  sus  gastos.  Para  controlar  sus  gastos,  tiene  que  vigilar  sobre  todo  la  eficacia de la técnica de producción (¿sería posible producir más con  menos?) y la de la asignación de recursos (¿hay que sustituir capital  en el trabajo?). No hace falta decir que puede existir un conflicto  entre  competitividad-coste  y  protección  del  derecho  de  los  trabajadores. Por ejemplo, si el grado de aplicación de las normas  sociales y medioambientales es bajo, esto puede permitir reducir los  gastos, pero tendrá un impacto (negativo) en los trabajadores;  la red y la capacidad de distribución . ¿La estructura dispone de un  circuito de distribución eficiente? En particular, ¿puede garantizar un  suministro de calidad (un alto porcentaje de productos que llegan a  tiempo,  un  porcentaje  bajo  de  objetos  rotos  y  de  errores,  etc.)?  ¿Llega  a  racionalizar  los  costes  de  distribución  (coste  global  del  almacenamiento y del transporte de mercancías lo suficientemente  bajo)? En las últimas décadas ha aparecido un elemento de respuesta  para el problema del compromiso entre la calidad de los productos,  el  plazo  de  entrega  y  los  costes  de  distribución,  que  consiste  en  preconizar una disminución de los niveles de almacenamiento. Esta  estrategia  a  menudo  está  fundada  en  un  uso  más  elevado  de  las  nuevas tecnologías de la información y de la comunicación (TIC).  En  este  contexto,  hablamos  a  veces  de  «producción  en  flujo  tendido», lo que significa que producimos un bien cuando lo pide el  cliente  y  que  se  distribuye  en  un  plazo  muy  corto  gracias  a  un  circuito de distribución eficiente;  el  marketing  y las ventas . El departamento de  marketing  también  desempeña un papel vital en el éxito de una empresa. ¿Es capaz de  anticipar las necesidades de los consumidores? ¿Es capaz de lanzar  campañas  de  publicidad  para  atraerlos?  Una  buena  estrategia  de  marketing  es innegablemente una fortaleza para la empresa;  los  medios  financieros .  La  solidez  financiera  suficiente  es  una  verdadera ventaja para toda organización. La capacidad de reunir  liquidez también tiene un papel fundamental, ya que es indispensable  para poner en marcha cualquier proyecto de expansión; \nlos recursos humanos . Finalmente, la gestión de recursos humanos  es un aspecto al que a menudo no prestan atención muchas empresas,  administraciones  públicas  y  asociaciones.  Sin  embargo,  es  importante que cada estructura disponga de una serie de habilidades  clave. De esta forma, puede ser preferible que una organización pase  un  poco  más  de  tiempo  buscando  a  la  persona  adecuada  a  que  contrate urgentemente a un candidato que no encaje en la vacante.  De forma más general, es crucial que las empresas implanten un  sistema de comunicación que permita una relación de trabajo óptima  entre empleados;  la  política  de  innovación .  A  nivel  más  estratégico,  y  en  una  economía como la nuestra, cada vez más empresas —y universidades  — se esfuerzan ahora por patentar un máximo de innovaciones. La  posesión de patentes debe ir acompañada de una visión estratégica  que permitirá a sus ingenieros comprender el valor y la utilidad de  sus innovaciones, argumentos de peso durante las negociaciones de  explotación de sus procesos patentados con otras empresas.  A  nivel  del  entorno  externo,  varios  factores  influyen  igualmente  en  las  oportunidades  y  amenazas  a  las  que  se  enfrenta  una  organización,  en  especial:  el  clima  económico .  La  presencia  o  ausencia  de  un  fuerte  crecimiento económico tiene un impacto evidente en la situación de  las  diversas  organizaciones.  Una  actividad  económica  intensa  permite a menudo acelerar el crecimiento de una empresa con un  buen rendimiento. De forma similar, una empresa con dificultades  que pierde cuota de mercado puede a veces evitar la quiebra si tiene  un  rápido  crecimiento  económico,  ya  que  esto  puede  compensar  parcialmente  las  debilidades  de  la  empresa.  Podemos  extraer  conclusiones inversas en caso de recesión económica;  las grandes tendencias de los consumidores.  Otro aspecto que no  deben pasar por alto las empresas es la evolución de las necesidades  de los consumidores. Si la oferta de valor de estas está en sintonía  con  las  nuevas  necesidades,  la  evolución  es  positiva.  Si,  por  el  contrario, las necesidades se alejan de su oferta de valor, la evolución  es  negativa.  Para  evitar  el  segundo  posible  escenario,  el \ndepartamento de  marketing  puede intentar prever estas evoluciones  gracias  al  uso  de  varias  herramientas,  como  el  ciclo  de  vida  del  producto que articula las diferentes fases de un producto (desarrollo,  lanzamiento, crecimiento, madurez y declive);  el  entorno  competitivo .  La  evolución  del  entorno  competitivo  también tiene un papel clave. Algunos competidores más eficientes,  más numerosos o más dispuestos a entablar una guerra de precios  pueden tener un impacto negativo en la rentabilidad de una empresa;  el  entorno  reglamentario .  La  evolución  del  reglamento  puede  constituir también una amenaza si una estructura no está preparada  para hacerle frente. En algunos casos, sin embargo, permite que las  empresas se reafirmen ante sus competidores, si estos están menos  preparados para hacerle frente.  Ahora  que  ya  dispone  de  los  fundamentos  teóricos  del  análisis  DAFO,  puede  divertirse  estructurando  su  propio  análisis  como  estudiante  o  trabajador.  Si  está  estudiando,  por  ejemplo,  es  posible  que  su  nivel  de  cultura general sea muy alto (fortaleza), pero que a veces le cueste expresar  sus ideas por escrito (debilidad). Como estudiante, tiene igualmente acceso  a un gran número de oportunidades (estancia Erasmus, implicación en una  asociación, etc.). No obstante, la evolución del coste de la vida puede serle  perjudicial (amenaza). \nLÍMITES DEL MODELO Y  EXTENSIONES  Críticas  Los  teóricos  y  los  especialistas  están  generalmente  de  acuerdo  en  que  los  resultados  de  un  análisis  DAFO  se  deben  interpretar  con  precaución.  Aunque el uso de este modelo permite analizar rápidamente la situación, su  resultado  es  incompleto  e  impreciso.  Además,  las  múltiples  facetas  del  análisis no se excluyen necesariamente entre sí.  Como ejemplo, una empresa puede percibir un nuevo reglamento como una  amenaza y una oportunidad al mismo tiempo. Los consultores Terry Hill y  Roy  Westbrook  publicaron  un  artículo  seminal  que  se  titula  «SWOT  Analysis:    It’s   Time  for  a  Product  Recall»  que  pone  de  manifiesto  las  limitaciones inherentes a un análisis DAFO:  En  primer  lugar,  es  esencialmente  descriptivo,  y  se  ha  demostrado  que  en  algunos  casos  esto  hace  que  resulte  ineficaz  ya  que  no  permite guiar un proceso de toma de decisiones en ningún sentido. El  diagnóstico  de  un  análisis  DAFO  puede  ser  excelente,  pero  si  las  decisiones  tomadas  con  antelación  no  son  buenas  o  no  se  aplican  correctamente  no  sirve  para  nada.  Así  pues,  vemos  que  el  análisis  DAFO no es realmente una fuente de ventaja competitiva.  Por otra parte, no se pueden ignorar los costes de un análisis DAFO:  para  llevarlo  a  cabo  hay  que  pagar  a  consultores  internos  y/o  externos.  Por  lo  tanto,  a  veces  es  mejor  no  encerrarse  en  un  paradigma de gestión que limite en cambio la creatividad.  Otro  riesgo  se  encuentra  en  el  hecho  de  no  jerarquizar  los  factores  identificados por el análisis DAFO en función de su importancia, y \nde centrarse en detalles de poco interés. Además del tiempo perdido,  esto puede tener un impacto catastrófico en una organización si esta  gasta todavía más recursos para eliminar problemas marginales.  Otros modelos  Existen otros modelos que parecen igual de eficaces que el análisis DAFO y  que también facilitan la toma de decisiones. Por ejemplo, el modelo de las  cinco fuerzas de Michael E. Porter (universitario estadounidense, nacido en  1947)  evalúa  las  restricciones  a  las  que  una  empresa  está  sujeta.  Otros  permiten  centrarse  en  la  interacción  estratégica  entre  competidores  (por  ejemplo,  las  decisiones  relacionadas  con  la  cantidad  producida  y  con  la  fijación  de  los  precios).  Aunque  su  enfoque  es  menos  global,  tienen  un  poder  inusual  para  evaluar  la  fuerza  de  la  competencia  en  las  industrias  analizadas.  Las cinco fuerzas de Porter  El modelo de las cinco fuerzas de Porter permite a una empresa analizar su  entorno  competitivo.  Se  centra  también  en  cinco  fuentes  susceptibles  de  influenciar el paisaje competitivo de una industria.  La limitación más obvia a la que tiene que enfrentarse una empresa  son    los  competidores  directos .  Sin  embargo,  la  intensidad  de  la  rivalidad    entre    las    empresas    no    depende    sistemáticamente    del  número  de  empresas  que  se  hacen  la  competencia:  es  totalmente  posible que dos empresas de una industria A entablen una guerra de  precios mientras que cuatro empresas de una industria B formen un  cártel estable y rentable.  La amenaza de nuevos competidores  puede disuadir igualmente a  una  empresa  de  fijar  precios  demasiado  altos,  incluso  en  caso  de  monopolio.  Sin  embargo,  esta  amenaza  no  es  creíble  si  las  barreras  de entrada y de salida de una industria son demasiado importantes en  relación  con  el  beneficio  obtenido.  Algunas  empresas  invierten  en \nuna    capacidad    excedentaria    para    producir    más    si    aparece    un  competidor (lo que tiene como efecto disminuir los precios y reducir  el  beneficio  de  los  nuevos  competidores).  Puesto  que  los  nuevos  competidores  normalmente  están  al  corriente  de  esta  capacidad  excedentaria, tienen menos tendencia a lanzarse.  Además,  las  empresas  deben  estar  atentas  a  los    productos  y  servicios que pueden sustituir a su oferta.  Si tomamos el ejemplo  de los transportes de media y larga distancia (entre 300 y  1000 km),  vemos que durante las últimas décadas los trenes de alta velocidad se  han  convertido  en  Europa  occidental  en  un  importante  sustituto  del  avión (lo que contribuyó a la racionalización del sector aéreo con la  aparición de operadores  low cost  como easyJet y Ryanair).  Finalmente,  el poder de negociación de los proveedores y de los  clientes   puede  tener  un  impacto  decisivo  en  la  rentabilidad  de  una  empresa.  Sin  extendernos  mucho,  podemos  decir  que  los  clientes  y  los proveedores pueden obtener un mejor precio cuando son menos  numerosos  y  cuando  son  nuevos  competidores  potenciales  en  el  mercado de la empresa con la que tratan. \nCompetencia oligopolística y presencia de cárteles  Algunos  modelos  económicos  permiten  interesarse  por  la  interacción  estratégica entre empresas.  El modelo de Antoine Augustin Cournot   (matemático  y  filósofo  francés,  1801-1877)  está concebido para analizar la competencia de  tipo  oligopolística  (propia  de  un  mercado  caracterizado  por  un  pequeño    número    de    vendedores    para    un    gran    número    de  compradores). Generalmente se utiliza cuando las empresas deciden  las  cantidades  que  van  a  producir,  en  función  de  la  influencia  que  podrían  tener  en  la  política  de  precios.  Las  empresas  activas  en  la \nindustria automovilística, por ejemplo, pueden difícilmente aumentar  su capacidad de producción a corto plazo (construir una fábrica lleva  tiempo).    Para    un    número    de    competidores    dado,    la    presión  competitiva  en  una  industria  a  la  manera  de  Cournot  se  considera  generalmente media y limitada.  Por  el  contrario,    el modelo de Joseph Louis François Bertrand  (matemático y economista francés,  1822-1900)  se utiliza cuando las  empresas  deciden  niveles  de  precios  y  luego  pueden  aumentar  o  disminuir la cantidad producida fácilmente. Cuando hay competencia  a  la  manera  del  modelo  de  Bertrand,  bastan  dos  empresas  para  que  los  beneficios  sean  nulos,  ya  que  entrarán  inevitablemente  en  una  verdadera    guerra    de    precios.    Por    regla    general,    las    empresas  afectadas  por  este  tipo  de  competencia  son  las  activas  en  industrias  en las que es fácil modificar la cantidad producida a corto plazo (por  ejemplo, la industria textil). En general, siempre que haya al menos  dos  competidores,  la  presión  competitiva  en  una  industria  del  tipo  Bertrand  es  muy  fuerte.  Por  eso,  tales  industrias  causan  más  bien  rechazo en una primera impresión.  También  existe  la  posibilidad  para  las  empresas  activas  en  una  industria    —aunque    sea    ilegal—    de    ponerse    de    acuerdo  explícitamente  para  limitar  la  competencia.  Es  lo  que  llamamos  un  cártel organizado . Por el contrario, un acuerdo tácito no es ilegal y  por definición resulta imposible de demostrar. Si un cártel es estable,  el  beneficio  conjunto  de  las  empresas  implicadas  será  igual  que  el  beneficio  del  poseedor  del  monopolio.  Sin  extendernos  mucho,  podemos decir que las condiciones siguientes facilitan la formación  de un cártel:  bajo número de empresas;  capacidad  para  detectar  y  castigar  rápidamente  a  los  que  no  respetan el acuerdo;  paciencia  suficiente  por  parte  de  las  empresas  que  participan  en el acuerdo. \nAPLICACIÓN DEL CONCEPTO  Las cinco etapas para realizar con éxito el  análisis DAFO  1 .  Identificar  las  fortalezas .  Para  empezar,  hay  que  identificar  los  elementos que tienen una influencia positiva en el rendimiento de  una  organización  y  que  están  vinculados  a  su  funcionamiento  interno.  Tal  y  como  se  ha  expuesto  en  la  sección  dedicada  a  la  presentación del modelo, conviene hacer esta lista rigurosamente,  examinando  minuciosamente  lo  que  caracteriza  la  situación  financiera  de  la  organización,  el  rendimiento  de  su  circuito  de  distribución, su  branding , etc.  2 .  Identificar las debilidades . A continuación hay que identificar los  elementos  que  influyen  negativamente  en  el  rendimiento  de  una  organización y que están vinculados a su funcionamiento interno.  Una baja capacidad de innovación, una mala comunicación y una  incapacidad para reducir los costes del mismo modo que lo hace la  competencia  son  debilidades  que  afectan  negativamente  al  rendimiento de una organización.  3 .  Identificar las oportunidades . Cuando decidimos interesarnos por  las oportunidades que ofrece un entorno definido, hay que identificar  los  factores  externos  a  una  organización  que  podrían  tener  una  influencia positiva sobre esta. Los aspectos en los que hay que fijarse  son más o menos específicos para las organizaciones (competencia,  contexto económico, legal y demográfico, etc.).  4 .  Identificar las amenazas . Cuando queremos encontrar las amenazas  existentes  en  un  entorno  definido,  es  conveniente  analizar  los  factores  externos  de  una  organización  que  podrían  tener  una  influencia negativa sobre esta. Una vez más, los elementos que hay  que observar dependen de la naturaleza de cada organización. \n5 .  Establecer  un  plan  de  acción  estratégico .  Una  vez  se  han  identificado  todos  los  factores  internos  y  externos  vinculados  al  marco en el que evoluciona una organización, se puede abordar la  fase de la toma de decisiones. Algunas veces esto se hará en forma  de  una  planificación  estratégica  a  largo  plazo.  En  otros  casos,  el  análisis DAFO permitirá simplemente acelerar la toma de decisiones  teniendo en cuenta el contexto en el que evoluciona la organización.  Recomendaciones  Es esencial fundamentar su razonamiento con cifras, datos y hechos.  Un diagnóstico demasiado rápido y descuidado es la mejor forma de  tomar malas decisiones.  Si  es  posible,  hay  que  intentar  darle  un  peso  a  cada  fortaleza,  debilidad, oportunidad y amenaza. Esto permite evitar que algunos  factores  insignificantes  influyan  inútilmente  en  la  toma  de  decisiones.  El análisis DAFO solamente es válido si se explota. Por lo tanto es  primordial asegurarse de que las decisiones tomadas se implementan  correctamente.  Cuando  se  toman  decisiones  motivadas  por  los  resultados  de  un  análisis DAFO, hay que concentrar los esfuerzos y las decisiones en  aquello que la organización puede implementar o controlar.  Estudio de caso — Estructura turística  situada en el sur de Francia  En esta sección desarrollaremos un análisis DAFO ficticio. La organización  estudiada es una pequeña estructura turística gestionada por una pareja que  posee tres habitaciones de huéspedes en el sur de Francia, en la frontera  entre los Alpes y la Provenza. Con el sello de un organismo turístico, atraen  a una clientela mayoritariamente extranjera, principalmente en verano. Uno \nde los mayores problemas a los que se enfrenta esta estructura turística es la  irregularidad de la demanda en función de la estación: aunque la tasa de  ocupación en julio y agosto está cerca del 100 %, no llega al 30 % durante  el resto del año. Este problema de ocupación está directamente relacionado  con el entorno externo de la empresa, ya que es evidente que la pareja que  gestiona las habitaciones de huéspedes no tiene ningún control sobre las  fechas en las que sus clientes se van de vacaciones. No obstante, hay otros  factores  que  pueden  ajustarse  y  controlarse  internamente  que  influyen  igualmente en la elección de los turistas.  Observemos cómo un análisis DAFO puede permitir identificar pistas para  la mejora de la estructura turística estudiada.  Análisis  del  entorno  externo  de  la  empresa  —  Amenazas  y  oportunidades  La evolución del reglamento  ha tenido un impacto considerable en  la situación de esta pequeña estructura turística en los últimos años.  Representa una verdadera presión para ella, ya que a veces tiene que  gastar  elevadas  sumas  de  dinero  para  cumplirlo.  Por  ejemplo  podemos pensar en las nuevas normas de seguridad, que a veces se  aplican de la misma manera que en los grandes hoteles, sin tener en  cuenta que estos se benefician de importantes economías de escala  (el coste medio por habitación disminuye a medida que el número de  habitaciones aumenta) y poseen en general edificios más modernos.  La evolución de la política fiscal   en  un  país  extranjero  a  veces  puede tener un impacto crucial en las operaciones de una empresa, y  esto  puede  ocurrir  de  manera  muy  indirecta.  En  el  caso  de  la  estructura turística estudiada, que acoge a numerosos clientes belgas  que pertenecen a categorías socio-profesionales acomodadas, puede  que la modificación de la fiscalidad belga en los coches de empresa  haya provocado una bajada de la tasa de ocupación. Efectivamente,  parece  que  la  reforma  fiscal  en  cuestión  ha  hecho  que  para  las  empresas  belgas  sea  menos  interesante  recurrir  a  los  coches  de  empresa  que  ofrecen  a  los  empleados  y  que  suelen  contar  con  combustible gratuito. El uso del coche para llegar al sur de Francia \nes particularmente interesante para los belgas, sobre todo para los  que  tienen  niños  pequeños.  También,  en  la  medida  en  que  este  sistema  se  utiliza  menos,  los  clientes  tienden  a  modificar  sus  costumbres y a tener en cuenta a la vez otros sistemas de transporte y  otras destinaciones más lejanas y menos apartadas. Este último punto  coincide con la problemática de los productos y de los servicios de  sustitución desarrollada en el modelo de las cinco fuerzas de Porter  (por ejemplo, los viajes en avión cuyo precio relativo representa una  competencia importante).  La evolución tecnológica  constituye a su vez una oportunidad y una  amenaza  para  la  joven  pareja.  La  aparición  de  páginas  web  que  permiten reservar una habitación directamente —sin pasar por los  propietarios— modifica radicalmente la gestión de las habitaciones  de  huéspedes.  Esta  revolución  tecnológica  constituye  una  oportunidad en la medida en que estas páginas aseguran una mayor  visibilidad y pueden hacer entrar en contacto más fácilmente a los  propietarios y a los turistas. Por desgracia, es más difícil controlar la  reputación digital cuando se utilizan estos servicios. La tendencia de  los turistas, cada vez más sistemática, a recurrir a páginas web para  reservar  tiene  como  efecto  la  casi  desaparición  de  las  guías  en  formato papel, en las que la infraestructura turística contaba con muy  buenas referencias.  El papel de los poderes públicos en la promoción turística de la  región.  Los poderes públicos tienen una influencia considerable en  el atractivo de una región. En el caso del establecimiento turístico  estudiado, el apoyo y la promoción de lugares y/o actividades en los  alrededores (como lugares naturales remarcables, eventos deportivos  puntuales, etc.) de la región, por ejemplo, pueden permitir atraer a  nuevos clientes.  La accesibilidad por vía aérea, ferroviaria o terrestre . En vista de  la dificultad para acceder al establecimiento turístico, se recomienda  a  los  gerentes  que  sigan  la  evolución  de  algunos  proyectos  relacionados con inversiones potenciales en las infraestructuras de  transporte  (por  ejemplo,  autopista,  línea  ferroviaria,  terminal  aeroportuaria, etc.).  El entorno económico  adverso relacionado con la crisis ha tenido  evidentemente un impacto directo y negativo en la tendencia de los \nturistas a irse de vacaciones: el presupuesto previsto para los gastos  parece más bajo que antes de 2008. Por el contrario, el retorno al  crecimiento sostenido que se espera para los próximos años podría  tener un impacto positivo en la situación de la estructura turística  analizada.  Análisis  del  entorno  interno  de  la  organización  —  Fortalezas  y  debilidades  La  satisfacción  de  los  turistas .  El  nivel  de  satisfacción  de  los  turistas es bueno, incluso muy bueno. Esto es signo de una buena  organización previa y es importante, ya que permite atraer a nuevos  clientes gracias al boca a boca y a la fama digital que resulta de ello  (buen    branding   en  línea).  Además,  se  puede  fidelizar  a  muchos  turistas que vuelven de año en año. Algunos se han convertido en  verdaderos  embajadores  de  la  estructura  turística  en  cuestión  y  animan a su entorno a pasar las vacaciones allí.  La  ubicación  de  la  estructura  turística   es  a  la  vez  atractiva  y  desalentadora. El aislamiento geográfico del lugar atrae a algunos  turistas que buscan descanso y calma, lo que hace de él una fortaleza.  Sin  embargo,  esta  característica  del  lugar  puede  constituir  una  debilidad,  ya  que  las  habitaciones  de  huéspedes  son  difícilmente  accesibles  en  transporte  público  y  están  alejadas  de  los  servicios  complementarios  (supermercados,  restaurantes,  etc.).  Además,  la  región no es muy conocida por los turistas.  La proximidad de las actividades y de los servicios turísticos.  La  presencia de actividades deportivas diversificadas y que se practican  en distintas estaciones (senderismo y BTT en verano; esquí alpino en  invierno) cerca del lugar de estancia constituye una fortaleza real  para la organización. Además, organizar mesas de huéspedes permite  que los turistas se relacionen. Muchos de ellos aprecian este tipo de  contacto social, aunque otros prefieren preservar su intimidad.  El tipo de clientes . Actualmente, la organización atrae sobre todo a  particulares. Así pues, podría ser interesante diversificar el público:  contactar con algunas empresas que quieran organizar seminarios y/o  sesiones de  team building  puede ser una solución. Otra posibilidad  sería    colaborar    con    proveedores    de    servicios    turísticos \ncomplementarios, como la organización de excursiones para hacer  senderismo.  La calidad de la conexión a Internet . La conexión a Internet, lenta  a causa del aislamiento geográfico del lugar, representa una debilidad  importante en la era digital actual. \nEl análisis DAFO ha permitido identificar un cierto número de fortalezas,  debilidades,  oportunidades  y  amenazas  de  la  organización.  Observemos \nahora cómo la combinación de estos elementos permite tomar decisiones  estratégicas eficaces. Ahora es posible:  aprovechar  algunas  oportunidades .  La  evolución  del  contexto  tecnológico se tiene que tener en cuenta en relación con la visibilidad  que ofrece Internet. La organización ganaría haciendo aparecer sus  habitaciones de huéspedes en plataformas en las que se encuentran  sus  clientes  potenciales  (personas  en  búsqueda  de  lugares  de  vacaciones  apartados).  Puesto  que  los  consumidores  tienen  un  presupuesto para las vacaciones más ajustado que antes, puede ser  interesante para la empresa adaptar su política tarifaria, en especial  aprovechando las posibilidades que ofrecen las nuevas tecnologías  (ofertas  last minute , por ejemplo);  prever  algunas  amenazas .  Incluso  si  la  evolución  del  marco  normativo  se  puede  considerar  una  amenaza  a  corto  plazo,  es  también un freno al desarrollo de nuevas estructuras. A largo plazo,  estas  forman  una  excelente  barrera  de  entrada  y  permiten  a  los  actores que se adaptan al nuevo marco normativo aprovechar una  cierta estabilidad a nivel competitivo;  consolidar algunas fuerzas . El boca a boca podría ser más rentable  si la organización se comunicara mejor con sus clientes habituales  para atraerlos en otras estaciones. Su fidelización se puede activar  principalmente mediante las redes sociales;  resolver  algunas  debilidades .  Para  diversificar  a  su  clientela,  la  empresa puede proponer algunas estancias a clientes potenciales no  particulares  (organización  de  un  seminario  profesional  en  un  ambiente sereno, o de una estancia temática, ya sea gastronómica,  deportiva o de otro tipo).  Se podrían tomar otras decisiones y considerar otras opciones, pero todo  dependerá finalmente de las prioridades que elegirán los responsables de la  organización. \nEN RESUMEN  El análisis DAFO consiste en un estudio de los factores que influyen  positiva  o  negativamente  en  el  funcionamiento  interno  y  en  el  contexto  externo  de  una  estructura,  ya  se  trate  de  una  empresa,  de  una asociación o de una administración pública.  Las  fortalezas  y  las  debilidades  son  parámetros  específicos  para  las  organizaciones,  que  ejercen  un  control  real  sobre  los  mismos.  La  competitividad-coste  tiene  evidentemente  un  papel  decisivo  en  el  éxito  de  una  empresa.  Sin  embargo,  no  habría  que  olvidar  el  papel  que  desempeña  la  competitividad  excluyendo  los  costes,  y  también  especialmente el de la capacidad de innovar.  En cambio, las oportunidades y las amenazas están relacionadas con  el  entorno  externo  de  las  organizaciones,  y  estas  no  las  pueden  controlar.    A    menudo    pensamos    en    el    contexto    económico  (crecimiento  o  recesión),  pero  no  hay  que  olvidar  otros  aspectos,  generalmente  más  específicos  en  una  industria  (evolución  de  las  necesidades, del entorno competitivo y del reglamento).  El estudio de las fortalezas, de las debilidades, de las oportunidades  y de las amenazas tiene que desembocar en la toma de decisiones o  la adopción de un plan de acción estratégico.  Hay que seguir algunos consejos cuando se hace un análisis DAFO:  en  este  punto  nos  referimos,  entre  otras  cosas,  a  la  necesidad  de  basarse en hechos más que en intuiciones. En este sentido es crucial  sostener el análisis con figuras tangibles (como datos financieros).  El análisis DAFO es un método actualmente muy popular, sobre todo  en los departamentos de  marketing  de las grandes empresas.  Su simplicidad alberga, sin embargo, un arma de doble filo. Algunos  autores  han  demostrado  que  en  algunos  casos  el  uso  del  análisis  DAFO  puede  tener  un  impacto     function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');

    function getLuminance(hex) {

        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;

        pdf2Name = file.name; pdf2NameDisplay.textContent = file.name;
        pdf2StatusDisplay.textContent = 'Procesando...'; pdf2StatusDisplay.style.color = 'var(--warning)';
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(e.target.result) }).promise;
                let text = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const tc = await page.getTextContent();
                    tc.items.forEach(item => text += item.str + ' ');
                    text += '\n';
                }
                pdf2Text = text;
                pdf2StatusDisplay.textContent = '"' + pdf2Name + '" cargado.'; pdf2StatusDisplay.style.color = 'var(--success)';
                addMsg('Segundo documento "' + pdf2Name + '" listo.', 'system');
            } catch(err) { pdf2StatusDisplay.textContent = 'Error al procesar.'; pdf2StatusDisplay.style.color = 'var(--danger)'; pdf2Text = ''; }
        };
        reader.readAsArrayBuffer(file);
    });

    function dismissThinkingAsSystem(text, asError) {
        const el = document.getElementById('thinking-msg');
        if (!el) return;
        el.className = 'system-message' + (asError ? ' error' : '');
        el.textContent = text;
        el.removeAttribute('id');
    }

    function addMsg(message, sender, isThinking = false) {
        const el = document.createElement('div');
        el.classList.add(sender === 'user' ? 'user-message' : sender.includes('system') ? 'system-message' : 'bot-message');
        if (sender.includes('error')) el.classList.add('error');
        if (sender === 'bot' && !isThinking) {
            const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
            const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;">' + html + '</div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else if (sender === 'bot') {
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong> <span class="thinking-animation">' + message + '</span></div></div>';
            el.id = 'thinking-msg';
        } else if (sender === 'user') {
            const userAvatarUrl = getAvatarUrl('user');
            el.innerHTML = '<div class="message user-message"><div class="message-bubble user-bubble"></div><img class="avatar-img" src="' + userAvatarUrl + '" alt=""></div>';
            el.querySelector('.user-bubble').textContent = message;
        } else {
            el.textContent = message;
        }
        chatDisplay.appendChild(el); chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }
    function updateLastMsg(message) {
        const el = document.getElementById('thinking-msg');
        const botAvatarUrl = getAvatarUrl('bot');
        const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
        const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
        if (el) {
            el.className = 'bot-message';
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;">' + html + '</div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            el.removeAttribute('id');
            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else addMsg(message, 'bot');
        chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }
    function escapeHtml(s) {
        if (s === undefined || s === null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getSessionHTML() {
        const clone = chatDisplay.cloneNode(true);
        const exportStyles =
            'body{font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;line-height:1.65;padding:28px;color:#333;max-width:880px;margin:0 auto;background:#fafafa;}' +
            'h1{color:#007bff;font-size:1.45em;margin-bottom:6px;}' +
            '.meta{color:#444;margin:6px 0;font-size:.95em;}' +
            'hr{border:none;border-top:1px solid #dee2e6;margin:22px 0;}' +
            '.chat-export{padding:4px 0;}' +
            '.chat-export .user-message,.chat-export .bot-message,.chat-export .system-message{margin-bottom:18px;}' +
            '.chat-export .system-message{text-align:center;color:#555;font-style:italic;padding:10px 14px;background:#fff3cd;border-radius:10px;border:1px solid #ffeaa7;}' +
            '.chat-export .system-message.error{background:#f8d7da;color:#721c24;border-color:#f5c6cb;}' +
            '.chat-export .message{display:flex;align-items:flex-end;gap:12px;}' +
            '.chat-export .message.user-message{flex-direction:row-reverse;}' +
            '.chat-export .avatar-img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid #e0e0e0;}' +
            '.chat-export .message-bubble{padding:12px 16px;border-radius:18px;max-width:78%;box-shadow:0 1px 2px rgba(0,0,0,.06);}' +
            '.chat-export .user-bubble{background:#007bff;color:#fff;}' +
            '.chat-export .bot-bubble{background:#e9ecef;color:#212529;}' +
            '.chat-export .bot-bubble strong{color:#007bff;}' +
            '.chat-export .bot-bubble p{margin:0 0 10px;}.chat-export .bot-bubble p:last-child{margin:0;}' +
            '.chat-export pre{background:#2d2d2d;color:#f8f8f2;padding:12px;border-radius:8px;overflow-x:auto;font-size:.9em;}' +
            '.chat-export code{background:#eee;padding:2px 6px;border-radius:4px;font-size:.9em;}' +
            '.chat-export ul,.chat-export ol{margin:8px 0;padding-left:22px;}';
        return '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sesión de chat</title><style>' + exportStyles + '</style></head><body>' +
            '<h1>Sesión de chat</h1>' +
            '<p class="meta"><strong>Documento:</strong> ' + escapeHtml(PDF_NAME) + '</p>' +
            '<p class="meta"><strong>Tema del chatbot:</strong> ' + escapeHtml(CHATBOT_THEME) + '</p>' +
            '<p class="meta"><strong>Modelo:</strong> ' + escapeHtml(MODEL) + '</p>' +
            '<hr><div class="chat-export">' + clone.innerHTML + '</div></body></html>';
    }

    function downloadSessionHtml() {
        const blob = new Blob([getSessionHTML()], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Sesion_Chat_' + Date.now() + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
