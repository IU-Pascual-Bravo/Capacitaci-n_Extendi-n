<script>

    const PDF_NAME = "Reglamento de posgrados - Acuerdo Consejo Directivo 021 del 19 de noviembre de 2020 (2) (2).pdf";
    const CHATBOT_THEME = "Consulta sobre el reglamento de Posgrados y procedimiento de trabajo de grado";
    const PDF2_TEXT_EMBEDDED = "PROCEDIMIENTO TRABAJO DE GRADO POSGRADOS   CÓDIGO: GDO-PR-046  PROCEDIMIENTO   VERSIÓN: 2  FECHA: 01/AGO/2025   1. OBJETIVO  Definir las etapas para la formulación, ejecución y aprobación de los trabajos de grado de posgrados.   2. ALCANCE  Inicia con la solicitud de asesor (es) y termina con la aprobación del trabajo de grado.   3. DEFINICIONES  Aprobación:  Conformidad que se dá o sostiene sobre determinada situación o cuestión.  Base de datos:  Recopilación organizada de datos estructurados que normalmente se almacenan de forma electrónica en un sistema  informático.  Codirector:  Persona que coopera a un director.  Director:  Persona que ofrece conocimientos y consejos de un tema a alguien que carece de estos conocimientos o los necesita.  Profesor (a):  Persona que tiene por oficio acciones referentes a la enseñanza.  Estudiante:  Persona que hace sus estudios en una Institución académica.  Evaluación:   Proceso  basado  en  parámetros  específicos  que  permite  analizar  y  emitir  una  conclusión  sobre  una  persona,  aspecto  o  situación.  Modalidad de Trabajo de grado:  Es una alternativa que se le da al estudiante para desarrollar una actividad investigativa y/o de formación  complementaria que le permita optar el título una vez cursado y aprobado el total de las asignaturas previstas.  Monografía:  Modalidad de trabajo de grado en programas de especialización, que presenta un análisis crítico y estructurado sobre un tema  específico, basado en la revisión y aplicación de conocimientos previos.  Propuesta de Trabajo de Grado:  Documento que describe de manera general el problema de estudio, los objetivos a alcanzar y la  metodología a seguir para su desarrollo.  Proyecto Formulado:  Modalidad de trabajo de grado en programas de maestría, orientada al diseño y estructuración de un proyecto que  responda a una necesidad o problema en un contexto determinado.  Trabajo  de  grado:   Estudio  sistemático  desarrollado  en  el  marco  de  un  programa  académico,  orientado  a  abordar  necesidades  o  problemáticas específicas de un área de conocimiento.  Tesis Doctoral:  Modalidad de trabajo de grado en programas de Doctorado, se presenta un documento de investigación original y rigurosa,  que aporta nuevos conocimientos a un campo específico del saber.  Trabajo de Investigación:  Modalidad de trabajo de grado en programas de maestría, enfocada en la generación de conocimiento a través  de un estudio sistemático y metodológico sobre una problemática particular.   4. CONDICIONES GENERALES   5. CONTENIDO  No   Actividad    Responsable    Formato   1  SOLICITUD    DE    DIRECTORES    DE  TRABAJO DE GRADO  2  Inscripción  de  estudiantes  de  trabajo  de  grado  en  el  módulo de SICAU:  El  Departamento  de  Posgrados  verifica  la  inscripción  de  los  estudiantes  de  primer  semestre  y  de  homologación  en  el  módulo  de  trabajos  de  grado  en  el  sistema  de  información  SICAU.  Departamento de  posgrados  3  Socializar profesores (as) directores:  El Profesor (a) a cargo del módulo Seminario de investigación  I,  socializa  a  los  estudiantes  la  base  de  datos  de  los  profesores(as)  que  podrían  ser  directores  y/o  codirectores,  adscritos a los programas de posgrados, así como las áreas de  interés.  Profesores (as) del  módulo: Seminario de  investigación I  4   Seleccionar director y/o Codirector:  El  estudiante  consulta  la  base  de  datos  y  contacta  a  los  profesores(as)  o  investigadores  para  evaluar  la  afinidad  y  pertinencia de sus áreas de interés, con el objetivo de diseñar  la propuesta de trabajo de grado.  Designación de director y/o codirector:  Hasta  la  semana  12  del  semestre  académico  (primer  semestre),  el  estudiante,  con  visto  bueno  del  profesor(a)  propuesto como Director o Codirector, diligencia el formato de  \"SOLICITUD DE DIRECTOR Y CODIRECTOR DE TRABAJO  Estudiante   GDO-FR-158  •SOLICITUD DE DIRECTOR Y  CODIRECTOR TRABAJO DE  GRADO POSGRADOS  COPIA CONTROLADA GDO-PR-046 PROCEDIMIENTO TRABAJO DE GRADO POSGRADOS V2 Pág 1/7 \nDE  GRADO  POSGRADOS\"  y  lo  envía  al  Departamento  de  Posgrados a través del sistema de información SICAU.  En  el  caso  que  un  estudiante  desee  cambiar  director  y/o  codirector  nombrados,  deberá  diligenciar  nuevamente  el  formato  y  adjuntar  una  carta  explicando  los  motivos  del  cambio.  Está  carta  deberá  contener  el  visto  bueno  de  los  directores anteriores y de los nuevos.  5  Aprobación de Director - Codirector trabajo de grado:  El Comité Curricular de Posgrados evalúa el perfil académico e  investigador del director o codirector propuesto, garantizando  que cumpla con el nivel de formación mínimo requerido. Si es  apto, se avala su designación.  De  no  cumplir  los  requisitos,  el  Comité  sugiere  nuevas  opciones, y el estudiante deberá enviar una nueva solicitud con  los candidatos propuestos para su validación.  Departamento de  Posgrados  GDC-FR-015  •HOJA MEMBRETE  COMUNICACION EXTERNA  COLOR  6   PROPUESTA TRABAJO DE GRADO  7  Desarrollar propuesta:  El  estudiante  con  el  acompañamiento  del  director  y/o  Codirector desarrolla su propuesta.  Evaluación de la propuesta:  El director y/o codirector a través de una carta, dan el visto  bueno  de  la  propuesta  del  trabajo  de  grado  de  posgrado  realizada por el estudiante.  El  estudiante,  hasta  la  semana  16  del  semestre  académico  (segundo  semestre),  envía,  a  través  del  sistema  de  información  SICAU,  la  propuesta  y  el  aval  del  director  y  codirector (si aplica) al Departamento de Posgrados para su  evaluación.  Estudiante  GDO-FR-164  GDO-FR-219  •TRAB DE GRADO - PROPUESTA  TRABAJO_GRADO O  TESIS_POSGRADOS  •AVAL DE PROPUESTA DE  TRABAJO DE GRADO POR  DIRECTORES  8  Asignación  de  evaluadores  de  propuesta  de  trabajo  de  grado:  El Departamento de Posgrados, con la asesoría del profesor  (a)  responsable  del  programa,  asignan  el  profesor(a)  o  investigador  evaluador.  Se  notifica  a  las  partes  interesadas  mediante un comunicado oficial.  Es  un  proceso  doble  ciego,  donde  evaluador  y  estudiante  desconocen la identidad del otro y de esta manera se busca  evitar los sesgos en la evaluación.  Departamento de  Posgrados  Profesor (a) responsable  del programa  GDC-FR-015  •HOJA MEMBRETE  COMUNICACION EXTERNA  COLOR  9  Evaluar propuesta de trabajo de grado:  El profesor (a) o investigador cuenta con 20 días calendario  para  diligenciar  el  formato  de  Evaluación  de  propuesta  de  trabajo    de    grado    de    posgrados,    posteriormente,    el  Departamento  de  Posgrados  socializa  el  resultado  de  la  evaluación  ante  el  Comité  Curricular  de  posgrados  para  su  aprobación, y se registra el acta del comité en el sistema de  información SICAU.  Profesor (a) evaluador  Departamento de  Posgrados  GDO-FR-165  GDE-FR-043  •TRAB DE GRADO - REVISIÓN  PROPUESTA  TESIS_PROPUESTA TRABAJO  DE GRADO_POSGRADO  •ACTA  10  Comunicar resultados de evaluación:  El Departamento de Posgrados, comunica a los estudiantes los  resultados de la evaluación.  Departamento de  Posgrados  GDC-FR-015  •HOJA MEMBRETE  COMUNICACION EXTERNA  COLOR  11  Correcciones de la propuesta:  Los  estudiantes  cuya  propuesta  haya  sido  aprobada  con  modificaciones deberán realizar las correcciones y reenviar la  versión ajustada con un nuevo aval de los directores a través  de SICAU.  Quienes  hayan  recibido  una  calificación  de  Rechazado,  deberán presentar una nueva propuesta con el respectivo aval  de los directores mediante el sistema SICAU.  Estudiantes  GDO-FR-164  GDO-FR-219  •TRAB DE GRADO - REVISIÓN  PROPUESTA  TESIS_PROPUESTA TRABAJO  DE GRADO_POSGRADO  •AVAL DE PROPUESTA DE  TRABAJO DE GRADO POR  DIRECTORES  12   EJECUCIÓN TRABAJO DE GRADO  13   Informe de avance del Trabajo de Grado de Posgrado:  Los  estudiantes  deberán  presentar  hasta  la  semana  14  del  semestre  académico  (tercer  semestre),  un  informe  que  dé  cuenta del avance del cumplimiento de los objetivos del trabajo  de  grado,  mismo  que  deberá  estar  avalado  por  director  y  codirector. Este avance será revisado por el profesor(a) que  evaluó la propuesta o en su defecto el designado por el Comité  Curricular de Posgrados. El Comité Curricular de Posgrados  Estudiante   GDO-FR-218  •INFORME DE AVANCE TRABAJO  DE GRADO DE POSGRADO  COPIA CONTROLADA GDO-PR-046 PROCEDIMIENTO TRABAJO DE GRADO POSGRADOS V2 Pág 2/7 \nrevisará la evaluación del informe de avance y de ser el caso  recomendará acciones de mejora.  14   EVALUACIÓN TRABAJO DE GRADO  15  Solicitud de evaluación del trabajo de grado:  El  estudiante  envía,  hasta  la  semana  12  del  semestre  académico (Último semestre según plan de estudios), a través  del sistema de información SICAU, el informe final de trabajo  de grado de acuerdo con los lineamientos de la GUÍA PARA LA  PRESENTACIÓN    DE    TRABAJOS    DE    GRADO    DE  POSGRADO  junto  con  el  AVAL  POR  DIRECTORES  DE  TRABAJO  DE  GRADO  POSGRADOS  PARA  EVALUACIÓN  FINAL.  El cumplimiento de este plazo no garantiza que el proceso de  evaluación se complete dentro del mismo periodo académico,  ya  que  estará  sujeto  a  la  disponibilidad  de  los  jurados  designados y a posibles devoluciones del trabajo para ajustes  o correcciones.  Los estudiantes que entreguen su informe final después de la  semana 12, pero dentro del mismo periodo académico en el  que  tienen  matriculado  el  trabajo  de  grado,  aceptan  que  el  proceso  de  evaluación  podrá  extenderse,  lo  cual  también  afectará el cronograma para la inscripción a los derechos de  grado.  Los  estudiantes  que  no  entreguen  su  informe  final  deberán  matricular  nuevamente  el  curso  de  trabajo  de  grado,  sin  exceder el tiempo máximo de permanencia en el programa.  El Departamento de Posgrados sólo aceptará informes finales  de  estudiantes  con  propuestas  de  trabajo  de  grado  previamente aprobadas.  Estudiante  GDO-GU-012  GDO-FR-220  •Guia Para La Presentación De  Trabajos De Grado De Posgrado  •AVAL POR DIRECTORES DE  TRABAJO DE GRADO  POSGRADOS PARA  EVALUACIÓN FINAL  16  Calificación parcial de la asignatura de trabajo de grado  Una  vez  entregado  el  informe  final,  el  Director  asignará  temporalmente  la  calificación  de  \"Aplazado\"  en  el  curso  correspondiente de Trabajo de Grado en el que el estudiante  se encuentre matriculado.  Director  17  Asignación de jurados:  El  Director  de  trabajo  de  grado,  hasta  la  semana  12  del  semestre  académico  (Último  semestre  según  plan  de  estudios), propone de 3 a 5 jurados. El Comité Curricular de  Posgrados selecciona dos de ellos en el caso de Maestrías o  tres para Doctorados, si es necesario, propone otros, acorde  con los perfiles requeridos.  La asignación de jurados es un proceso doble ciego, donde  evaluador y estudiante desconocen la identidad del otro y de  esta manera se busca evitar los sesgos en la evaluación.  Director  Comité Curricular de  Posgrados  GDO-FR-169  •TRAB DE GRADO -  RECOMENDACIÓN DE  ASIGNACIÓN DE JURADOS  PARA DEFENSA DEL TRABAJO  DE GRADO O TESIS  POSTGRADOS  18  Evaluación de trabajo de grado:  El Departamento de Posgrados envía la invitación a los jurados  seleccionados, incluyendo el título, resumen, y los objetivos del  trabajo de grado, este último tal como fueron planteados por el  estudiante  en  la  propuesta  inicial,  junto  con  el  formato  de  acuerdo de confidencialidad. El Departamento cuenta con un  plazo de hasta diez (10) días hábiles para gestionar el envío de  estas invitaciones y recibir las respectivas respuestas de los  jurados evaluadores.  Si los jurados aceptan su rol, expresado mediante la respuesta  afirmativa  a  la  invitación  y  la  entrega  del  acuerdo  de  confidencialidad firmado, se procede a enviar el documento de  trabajo  de  grado  junto  con  el  formato  de  EVALUACIÓN  INFORME o) para completar la evaluación.  Jurados  GDO-FR-170  GDO-FR-221  •POSGRADO - REVISIÓN TESIS  O TRABAJO DE GRADO  POSGRADO  •AVAL PARA LA DEFENSA  PÚBLICA DEL TRABAJO DE  GRADO POR JURADO  20  Comunicar resultados de evaluación:  El Departamento de Posgrados informa al estudiantes, director  y/o codirector el resultado de la evaluación.  Si  los  jurados  solicitan  modificaciones  (Devuelto  para  correcciones), el estudiante tiene veinte (20) días calendario  para realizar las modificaciones solicitadas por los jurados al  trabajo de grado.  Departamento de  Posgrados  GDC-FR-015  •HOJA MEMBRETE  COMUNICACION EXTERNA  COLOR  21  Estudiante devuelve el trabajo de grado con correcciones:  Aquellos estudiantes que los jurados hayan devuelto el trabajo  de grado, deberán enviar nuevamente el informe final con las  correcciones realizadas, junto con una nueva carta de aval del  director y codirector.  Estudiante  GDO-GU-012  •Guia Para La Presentación De  Trabajos De Grado De Posgrado  22  Jurado  revisa  las  correcciones  realizadas  al  trabajo  de  grado:  Los  jurados  reciben  nuevamente  el  trabajo  de  grado,  tienen  diez (10) días calendario para revisarlo de nuevo y realizar una  segunda  evaluación.  Dado  que  la  evaluación  del  trabajo  de  grado  sea  positiva,  el  jurado  otorgará  el  AVAL  PARA  LA  DEFENSA  PÚBLICA  DEL  TRABAJO  DE  GRADO  POR  JURADO.  Si  el  jurado  considera  que  el  trabajo  de  grado  requiere  correcciones adicionales, regresa el documento y el estudiante  tiene 4 días calendario para realizar las correcciones finales. El  jurado recibe por última vez el documento de trabajo de grado,  tiene  3  días  calendario  para  revisar  el  documento  final  y  realizar la evaluación definitiva.  El  Departamento  de  Posgrados  actúa  como  intermediario,  notificando a las partes involucradas y garantizando el proceso  de doble ciego.  Jurados  GDO-FR-221  •AVAL PARA LA DEFENSA  PÚBLICA DEL TRABAJO DE  GRADO POR JURADO  23  Programar defensa pública:  El Departamento de Posgrados programa la defensa pública y  comunica  a  los  estudiantes  y  jurados  la  fecha,  hora  y  ubicación.  Departamento de  Posgrados  24  Defensa pública y acta de sustentación:  El estudiante presenta el trabajo de grado por 30 minutos, al  final de este tiempo, se realizan preguntas por parte de los  jurados, posteriormente por el público asistente y el estudiante  responde con las aclaraciones necesarias.  Al final de este proceso los jurados realizan la deliberación de  la nota final y posibles menciones de honor. Se levanta un acta  con los resultados de la sustentación de trabajo de grado.  Departamento de  Posgrados  GDO-FR-217  •ACTA DE SUSTENTACIÓN DE  TRABAJO DE GRADO EN  DEFENSA PÚBLICA  COPIA CONTROLADA GDO-PR-046 PROCEDIMIENTO TRABAJO DE GRADO POSGRADOS V2 Pág 4/7 \n25  Aprobación de trabajo de grado:  El Departamento de Posgrados, mediante comunicado oficial,  notifica al Consejo de Facultad respectivo el resultado de la  defensa pública, adjuntando el ACTA DE SUSTENTACIÓN DE  TRABAJO DE GRADO EN DEFENSA PÚBLICA. En caso de  recomendaciones  de  menciones  honoríficas  el  Consejo  de  Facultad evaluará el otorgamiento, de ser aprobado emitirá la  resolución.  GDC-FR-013  GDO-FR-217  •HOJA MEMBRETE  COMUNICACION INTERNA  COLOR  •ACTA DE SUSTENTACIÓN DE  TRABAJO DE GRADO EN  DEFENSA PÚBLICA  26  Documento final para repositorio digital:  El  estudiante  deberá  presentar,  a  través  del  sistema  de  información  SICAU,  el  informe  final  de  su  trabajo  de  grado  mediante la GUÍA PARA LA PRESENTACIÓN DE TRABAJOS  DE  GRADO  DE  POSGRADO,  con  las  correcciones  del  proceso de evaluación, junto el FORMULARIO DE LICENCIA Y  AUTORIZACIÓN  PARA  PUBLICACIÓN  DE  OBRAS  EN  REPOSITORIO DIGITAL.  Estudiante  GDO-GU-012  GDO-FR-095  •Guia Para La Presentación De  Trabajos De Grado De Posgrado  •BIBLIOTECA - FORMULARIO DE  LICENCIA Y AUTORIZACIÓN  27  Aprobación del módulo de trabajo de grado:  El     function extractTextFromBackendResponse(raw) {

        try {
            const j = JSON.parse(s);
            if (Array.isArray(j)) return JSON.stringify(j);
            if (j && typeof j === 'object') {
                const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
                if (typeof c === 'string') return c.trim();
                if (typeof j.content === 'string') return j.content.trim();

            if (typeof j === 'string') return j;
        } catch (e) {}
        return s;
    }

    function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }
    function rgbToHex(r, g, b) {
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');

    function getLuminance(hex) {

    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);
    }
    function getReadableTextColor(bgColor) { return getLuminance(bgColor) > 0.56 ? '#111827' : '#f8fafc'; }
    function generatePalette() {
        const hue = Math.floor(Math.random() * 360);
        const bg = hslToHex(hue, 45 + Math.floor(Math.random() * 20), 16 + Math.floor(Math.random() * 70));
        const text = getReadableTextColor(bg);
        const isDark = getLuminance(bg) < 0.5;
        const accent = hslToHex((hue + 35 + Math.floor(Math.random() * 60)) % 360, 80, isDark ? 55 : 45);
        const card = isDark ? mixColors(bg, '#ffffff', 0.08) : mixColors(bg, '#000000', 0.05);
        const border = isDark ? mixColors(card, '#ffffff', 0.18) : mixColors(card, '#000000', 0.12);
        const input = isDark ? mixColors(card, '#ffffff', 0.07) : mixColors(card, '#000000', 0.04);
        const inputBorder = isDark ? mixColors(border, '#ffffff', 0.12) : mixColors(border, '#000000', 0.1);
        const botBg = isDark ? mixColors(bg, '#ffffff', 0.12) : mixColors(bg, '#000000', 0.06);
        return {
            bgColor: bg,
            textColor: text,
            cardBgColor: card,
            cardBorderColor: border,
            inputBgColor: input,
            inputBorderColor: inputBorder,
            chatBubbleBotBg: botBg,
            chatBubbleBotText: text,
            chatBubbleUserBg: accent,
            chatBubbleUserText: getReadableTextColor(accent),
            primaryColor: accent,
            secondaryColor: isDark ? mixColors(accent, '#ffffff', 0.2) : mixColors(accent, '#000000', 0.2),
            headerBorderColor: border,
            systemMessageBg: isDark ? mixColors(bg, '#fde68a', 0.2) : mixColors(bg, '#fde68a', 0.28),
            systemMessageText: isDark ? '#fef3c7' : '#78350f'
        };
    }
    function buildThemePalette(theme, palette) {
        const base = palette || {
            primaryColor: '#2563eb',
            secondaryColor: '#6b7280',
            bgColor: '#ffffff',
            textColor: '#1f2937',
            cardBgColor: '#ffffff',
            cardBorderColor: '#d1d5db',
            inputBgColor: '#ffffff',
            inputBorderColor: '#cbd5e1',
            chatBubbleBotBg: '#f3f4f6',
            chatBubbleBotText: '#1f2937',
            chatBubbleUserBg: '#2563eb',
            chatBubbleUserText: '#ffffff',
            headerBorderColor: '#e5e7eb',
            systemMessageBg: '#fef3c7',
            systemMessageText: '#92400e'
        };
        const isDark = theme === 'dark';
        const bgColor = isDark ? mixColors(base.bgColor || '#ffffff', '#000000', 0.72) : '#ffffff';
        const textColor = getReadableTextColor(bgColor);
        const cardBgColor = isDark ? mixColors(bgColor, '#ffffff', 0.08) : '#ffffff';
        const cardBorderColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.16) : '#d1d5db';
        const inputBgColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.06) : '#ffffff';
        const inputBorderColor = isDark ? mixColors(cardBorderColor, '#ffffff', 0.12) : '#cbd5e1';
        const chatBubbleBotBg = isDark ? mixColors(bgColor, '#ffffff', 0.12) : '#f3f4f6';
        const chatBubbleBotText = textColor;
        const headerBorderColor = cardBorderColor;
        const systemMessageBg = isDark ? mixColors(bgColor, '#fde68a', 0.2) : '#fef3c7';
        const systemMessageText = isDark ? '#fef3c7' : '#92400e';
        return {
            ...base,
            bgColor,
            textColor,
            cardBgColor,
            cardBorderColor,
            inputBgColor,
            inputBorderColor,
            chatBubbleBotBg,
            chatBubbleBotText,
            headerBorderColor,
            systemMessageBg,
            systemMessageText
        };
    }
    function setPaletteVariables(target, palette) {
        if (!palette) return;
        target.style.setProperty('--primary', palette.primaryColor || '#007bff');
        target.style.setProperty('--secondary', palette.secondaryColor || '#6c757d');
        target.style.setProperty('--bg', palette.bgColor || '#f8f9fa');
        target.style.setProperty('--text', palette.textColor || '#343a40');
        target.style.setProperty('--card', palette.cardBgColor || '#ffffff');
        target.style.setProperty('--border', palette.cardBorderColor || '#dddddd');
        target.style.setProperty('--input', palette.inputBgColor || '#ffffff');
        target.style.setProperty('--iborder', palette.inputBorderColor || '#cccccc');
        target.style.setProperty('--bot-bg', palette.chatBubbleBotBg || '#e9ecef');
        target.style.setProperty('--bot-text', palette.chatBubbleBotText || '#343a40');
        target.style.setProperty('--user-bg', palette.chatBubbleUserBg || '#007bff');
        target.style.setProperty('--user-text', palette.chatBubbleUserText || '#ffffff');
        target.style.setProperty('--sys-bg', palette.systemMessageBg || '#fff3cd');
        target.style.setProperty('--sys-text', palette.systemMessageText || '#856404');
    }
    function applyPalette(palette) {

    function applyTheme(t) {

    pdf2Upload.addEventListener('change', async (ev) => {
        const file = ev.target.files[0]; if (!file) return;
        if (!(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) {
            pdf2StatusDisplay.textContent = 'No es un PDF válido.'; pdf2StatusDisplay.style.color = 'var(--danger)'; return;
        }
        pdf2Name = file.name; pdf2NameDisplay.textContent = file.name;
        pdf2StatusDisplay.textContent = 'Procesando...'; pdf2StatusDisplay.style.color = 'var(--warning)';
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(e.target.result) }).promise;
                let text = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const tc = await page.getTextContent();
                    tc.items.forEach(item => text += item.str + ' ');
                    text += '\n';
                }
                pdf2Text = text;
                pdf2StatusDisplay.textContent = '"' + pdf2Name + '" cargado.'; pdf2StatusDisplay.style.color = 'var(--success)';
                addMsg('Segundo documento "' + pdf2Name + '" listo.', 'system');
            } catch(err) { pdf2StatusDisplay.textContent = 'Error al procesar.'; pdf2StatusDisplay.style.color = 'var(--danger)'; pdf2Text = ''; }
        };
        reader.readAsArrayBuffer(file);
    });

            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }

    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
</body>
</html>
