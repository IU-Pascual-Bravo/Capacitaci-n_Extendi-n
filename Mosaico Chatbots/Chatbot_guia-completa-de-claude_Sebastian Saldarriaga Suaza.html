contenidos   están    en   inglés,   pero   puedes   subtitular   e   incluso   traducir   los   vídeos   de   YouTube   sin    ningún   problema.    En   concreto,   te   recomiendo   dos   cursos   para   aprender   a   usar   Claude   Code:   Claude    Code   101   y   Claude   Code   in   Action .             Miren   Agirregomezkorta   Iza   –   Guía   completa   de   Claude     34   \n   2)     Guía   de   AI   with   Allie .    Allie   K.   Miller   es   una   de   las   voces   más   prominentes   en   divulgación   sobre   IA.    Con   experiencia   previa   en   empresas   como   IBM   y   Amazon,   ahora   se   dedica    a   integrar   sistemas   de   IA   en   el   ámbito   corporativo.    Esta   guía   me   gusta   mucho   porque   procede   de   alguien   con   MUCHA    experiencia   técnica,   pero   está   dirigida   a   gente   que   no   tiene   ninguna    experiencia   técnica.   Es   decir:   profesionales,   directivos   y   emprendedores    como   tú   y   como   yo.          3)     Videotutorial   de   Ángel   Molina       Si   necesitas   ayuda   en   español,   te    recomiendo   a   mi   colega   Ángel   Molina   que,    además   de   ser   muy   majo,   explica   la   IA   de    forma   sencilla   y   accesible,   como   a   mí   me    gusta.   Este   tutorial   te   dará   las   bases   que    necesitas   para   empezar.          Miren   Agirregomezkorta   Iza   –   Guía   completa   de   Claude     35   \n   Claude   Design:   la   herramienta   para   diseñadores    Claude   Design   te   permite   crear   diseños,   prototipos   interactivos,    presentaciones   y   más   con   una   calidad   espectacular .   Igual   que   con   la    programación,   te   confieso   que   yo   no   me   dedico   al   diseño,   por   lo   que   no   soy   la    fuente   más   apta   para   guiarte   en   el   uso   de   esta   nueva   herramienta.      Por   eso,   una   vez   más,   te   comparto   mi   lista   de   recursos   para   aprender   a   usar    Claude   Design :       1)     Guía   oficial   de   Claude   Design ,   de   Anthropic    Empecemos   por   la   fuente   original.   En   este   artículo   aprenderás   cómo   funciona    Claude   Design,   cómo   crear   un   nuevo   proyecto,   cómo   escribir   prompts   efectivos,    cómo   iterar   en   tu   diseño   y   cómo   exportar   y   compartir   los   resultados.   Si   quieres   ir    un   paso   más   allá,   consulta   también   la   guía   para   configurar   tu   sistema   de   diseño    en   Claude   Design .       2)     Artículo   de   Alejandro   Bauer       Alejandro   Bauer   es   un   senior   product   designer   con   especialización   en   AI-native    design   systems   (o   sea:   lleva   muchos   años   trabajando   como   diseñado   y   ahora   se    ha   especializado   en   IA).   En   este   artículo   explora   las   capacidades   y   los   límites   de    Claude   Design   con   ojo   experto   y   con   mucha   honestidad.      Miren   Agirregomezkorta   Iza   –   Guía   completa   de   Claude     36   \nTrucos extra Nivel 3: Avanzado \n   3.   Trucos   extra    Cómo   evitar   quedarte   sin   créditos   en   Claude    Lo   confieso:   Claude   tiene   funcionalidades   muy,   muy   potentes   que   no    encontramos   en   ningún   otro   sitio   y,   poco   a   poco,   se   está   convirtiendo   en   una   de    mis   herramientas   favoritas.       Sin   embargo,   tiene   un   problema   muy   importante:   tiene   límites   de   uso   muy    escasos,   y   es   fácil   quedarte   sin   créditos   enseguida ,   incluso   en   la   cuenta   de    pago.       Anthropic   ofrece   la   posibilidad   de   comprar   créditos   extra   que   suplementen   tu    suscripción   usual.   Por   ejemplo,   yo   pago   el   plan   mensual   de   18   €,   pero   de   vez   en    cuando   compro   “bonos”   de   50   €   que   me   permiten   seguir   chateando   cuando   he    alcanzado   mi   límite.       Para   evitar   llegar   a   ese   límite   y   ahorrar   un   dinero,   sigue   estos   consejos   para   que    tus   créditos   de   Claude   duren   más .    (Nota:   esta   es   una   recopilación   de   trucos   de    Ruben   Hassid   y   Anisha   Jain ).          1.     Convierte   tus   PDFs   a   Markdown .   Ya   sabes   que   puedes   guardar   un   mismo    fichero   en   varios   formatos   (.docx,   .pdf,   .txt,   etc.).   Markdown   es   un   formato    mucho   más   ligero,   por   lo   que   a   Claude   le   cuesta   menos   esfuerzo   leerlo   y   a     ti   te   cuesta   menos   créditos.   Puedes   convertir   tus   PDFs   a   Markdown   en   esta    página   web .          2.     Planifica   en   el   chat,   crea   en   cowork .   A   lo   largo   de   esta   guía   te   he    explicado   que   hay   algunas   funcionalidades   que   solo   están   disponibles   en   el    modo   cowork   de   la   app   de   escritorio   (como   los   plugins,   dispatch,   etc.).   El    cowork   es   mucho   más   costoso   que   el   chat   normal   así   que,   antes   de    ejecutar   ninguna   tarea   avanzada,   planifícalo   todo   en   el   chat.          3.     Haz   que   Claude   te   pregunte .   No   le   envíes   prompts   superlargos   a   Claude.    Es   mejor   darle   un   prompt   breve   y   pedir   que   Claude   te   haga   preguntas   para    recabar   la   información   que   necesita.   Prueba   este   prompt:       Quiero   [TAREA]   para   conseguir   [RESULTADO].   /AskUserQuestions          Miren   Agirregomezkorta   Iza   –   Guía   completa   de   Claude     38   \n   4.     Edita   el   mensaje,   no   envíes   uno   nuevo .   Si   Claude   no   responde   como    querías,   la   reacción   más   frecuente   es   enviar   un   nuevo   mensaje   pidiendo    correcciones.   En   lugar   de   eso,   utiliza   el   simbolo   del   lápiz   para   editar   tu    mensaje   anterior,   que   consume   menos   créditos.          5.     Agrupa   tus   tareas   en   un   solo   mensaje .   Cada   vez   que   le   mandas   un    mensaje,   Claude   relee   toda   la   conversación   desde   el   principio   antes   de    responderte.   Por   tanto,   si   mandas   tres   mensajes   seguidos,   Claude   hace   tres    relecturas   completas.   La   solución   obvia:   pide   varias   cosas   en   un   solo    mensaje.          6.     Abre   un   nuevo   chat   cada   15-20   mensajes .   La   lógica   es   la   misma   que   en   el    punto   5.   Si   Claude   lee   todo   el   hilo   de   conversación   con   cada   nuevo    mensaje,   cuanto   más   larga   sea   la   conversación,   más   créditos   consume.   Así    que,   cuando   lleves   un   rato,   escríbele:   \"Resume   toda   esta   conversación   en    un   briefing   breve.\"   Copia   ese   resumen   →   abre   un   chat   nuevo   →   pégalo   como    primer   mensaje.   Contexto   conservado,   historial   resetado.          7.     Elige   el   modelo   según   la   tarea .   Recuerda   que   tenemos   diferentes   motores    dentro   de   Claude.   Elige   sabiamente:    ●     Haiku   →   el   económico,   para   tareas   simples    ●     Sonnet   →   el   equilibrado,   para   la   mayoría   de   cosas    ●     Opus   →   el   potente   (y   caro),   para   análisis   complejos   y   trabajo   profundo          8.     Usa   Proyectos   para   archivos   que   reutilizas.   Si   subes   el   mismo   documento    a   5   chats   distintos,   Claude   lo   procesa   5   veces.   5x   el   coste.   Si   subes   el   archivo    a   un   proyecto,   se   procesa   una   sola   vez,   y   todos   los   chats   dentro   de   ese    proyecto   lo   leen   sin   volver   a   procesarlo   desde   cero.          9.     Desactiva   lo   que   no   estás   usando .   Claude   tiene   funciones   extra   que    consumen   créditos   aunque   no   las   necesites   para   esa   tarea:   búsqueda   web,    conexiones   con   otras   apps,   modo   de   razonamiento   extendido...   Mantenlo    todo   apagado   por   defecto,   y   enciéndelo   cuando   lo   necesites.       Miren   Agirregomezkorta   Iza   –   Guía   completa   de   Claude     39   \n   Comandos   para   explotar   todo   el   potencial   de   Claude    Los   comandos   de   Claude   son   instrucciones   rápidas   que   cambian   cómo   el    modelo   piensa,   responde   o   actúa,   sin   necesidad   de   escribir   prompts   largos.   Son    interesantes   porque   ahorran   tiempo,   mejoran   la   calidad   del   output   y   dan    control   sobre   el   comportamiento   de   la   IA   con   una   sola   palabra.       Hay   muchísimos   comandos   y   no   pretendo   que   te   los   aprendas   de   memoria,   pero    quiero   compartirte   la   selección   de   mis   comandos   favoritos   (mis   fuentes   han   sido    Ruben   Hassid ,   Yago   Carballo   y   Vivian   Francos ).       #     Comando     ¿Qué   hace?    1     /clear     Borra   toda   la   conversación   y   reinicia   el   contexto   para    empezar   una   tarea   nueva   sin   residuos.    2     /compact     Comprime   el   historial   de   la   sesión   liberando   espacio   de    contexto   sin   perder   lo   esencial.    3     /context     Muestra   cuántos   tokens   llevas   consumidos   para   saber    cuánto   espacio   te   queda.    4     /plan     Activa   el   modo   solo   lectura   para   que   Claude   planifique    cada   paso   antes   de   ejecutar   nada.    5     /model     Cambia   entre   Opus,   Sonnet   o   Haiku   en   mitad   de   una    sesión   según   necesites   profundidad   o   velocidad.    6     /rewind     Deshace   los   últimos   pasos   de   Claude   y   permite   volver   a   un    punto   anterior   de   la   conversación.    7     /resume     Reabre   una   sesión   anterior   por   su   nombre   o   ID   para    continuar   donde   lo   dejaste.    8     /export     Guarda   toda   la   conversación   como   archivo   de   texto   para    documentar   o   reutilizar   el   trabajo.    9     /rename     Pone   nombre   a   la   sesión   actual   para   organizarla   y    encontrarla   fácilmente   después.    10     /cost     Muestra   el   gasto   total   de   tokens   de   la   sesión   para   controlar    el   consumo.    11     /usage     Informa   sobre   tus   límites   actuales   del   plan   y   el   estado   de   la    tasa   de   uso.    Miren   Agirregomezkorta   Iza   –   Guía   completa   de   Claude     40   \n   #     Comando     ¿Qué   hace?    12     /init     Genera   automáticamente   un   archivo   CLAUDE.md   leyendo    tu   proyecto   y   resumiendo   el   contexto   clave.    13     /memory     Edita   los   archivos   de   memoria   y   controla   qué   recuerda    Claude   entre   sesiones.    14     /diff     Abre   un   visor   de   cambios   para   revisar   qué   ha   modificado    Claude   en   tus   archivos.    15     /security-    review    Analiza   los   cambios   pendientes   en   busca   de   posibles    problemas   de   seguridad.    16     /permissions     Gestiona   qué   herramientas   puede   usar   Claude   y   cuáles    debe   pedirte   permiso   antes.    17     /config     Abre   el   panel   de   configuración   para   cambiar   tema,    modelo,   estilo   de   output   y   preferencias.    18     /human     Reescribe   el   texto   generado   para   que   suene   más   natural   y    menos   robótico   —   ideal   para   copies   y   posts.    19     /eli10     Pide   a   Claude   que   explique   cualquier   concepto   como   si    tuvieras   10   años,   sin   jerga   ni   tecnicismos.    20     /alt   three     Genera   tres   alternativas   distintas   ante   cualquier   pregunta    cuando   no   sabes   qué   opción   elegir.    21     /kill   critic     Elimina   la   tendencia   de   Claude   a   ser   complaciente   y   le    fuerza   a   darte   feedback   honesto   y   directo.    22     /ooda     Analiza   el   contexto   y   ayuda   a   tomar   decisiones   difíciles    aplicando   un   marco   de   acción   concreto.    23     /L99     Le   indica   a   Claude   que   trabaje   al   máximo   nivel   de   esfuerzo    y   detalle   posible   en   esa   respuesta.    24     /x10think     Fuerza   al   modelo   a   razonar   mucho   más   antes   de    responder,   sacrificando   velocidad   por   profundidad.    25     /artifacts     Genera   una   mini-app   interactiva   —   gráficos,   dashboards   o    interfaces   —   directamente   dentro   del   chat.          Miren   Agirregomezkorta   Iza   –   Guía   completa   de   Claude     41   \nDerechos de autor: Miren Agirregomezkorta Iza, 2026  hola@mirenagk.com  Web:  mirenagk.com  Newsletter:  https://mirenagk.kit.com/  LinkedIn:  https://www.linkedin.com/in/mirenagk/  Este manual está protegido por la licencia Atribución-NoComercial-  SinDerivadas 4.0 Internacional de Creative Commons. Para más información:  https://creativecommons.org/licenses/by-nc-nd/4.0/    ¡Pues esto es todo!  Espero que lo aprendido en esta guía te ayude a implementar la IA  poco a poco, de forma sencilla y práctica en tu día a día. Si quieres  mantenerte al día de todos los avances de la IA, suscríbete a mi  newsletter y sígueme en LinkedIn.  ¡Un abrazo!  Miren  😊 \n";

    function extractTextFromBackendResponse(raw) {
        if (raw == null) return '';
        const s = String(raw).trim();
        if (!s) return '';
        try {
            const j = JSON.parse(s);
            if (Array.isArray(j)) return JSON.stringify(j);
            if (j && typeof j === 'object') {
                const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
                if (typeof c === 'string') return c.trim();
                if (typeof j.content === 'string') return j.content.trim();
                if (typeof j.text === 'string') return j.text.trim();
            }
            if (typeof j === 'string') return j;
        } catch (e) {}
        return s;
    }
    async function postBackendText(payload) {
        const body = { model: payload.model || 'openai-fast', prompt: payload.prompt };
        if (payload.system) body.system = payload.system;
        if (payload.json) body.json = true;
        const res = await fetch(BACKEND_BASE + '/api/ia/text', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const raw = await res.text();
        if (!res.ok) throw new Error('Error de API: ' + res.status + ' ' + res.statusText + '. ' + raw.substring(0, 200));
        return extractTextFromBackendResponse(raw);
    }

    function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }
    function rgbToHex(r, g, b) {
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
        return '#' + toHex(r) + toHex(g) + toHex(b);
    }
    function mixColors(colorA, colorB, amount) {
        const a = hexToRgb(colorA);
        const b = hexToRgb(colorB);
        return rgbToHex(a.r + (b.r - a.r) * amount, a.g + (b.g - a.g) * amount, a.b + (b.b - a.b) * amount);
    }
    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);
    }
    function getReadableTextColor(bgColor) { return getLuminance(bgColor) > 0.56 ? '#111827' : '#f8fafc'; }
    function generatePalette() {
        const hue = Math.floor(Math.random() * 360);
        const bg = hslToHex(hue, 45 + Math.floor(Math.random() * 20), 16 + Math.floor(Math.random() * 70));
        const text = getReadableTextColor(bg);
        const isDark = getLuminance(bg) < 0.5;
        const accent = hslToHex((hue + 35 + Math.floor(Math.random() * 60)) % 360, 80, isDark ? 55 : 45);
        const card = isDark ? mixColors(bg, '#ffffff', 0.08) : mixColors(bg, '#000000', 0.05);
        const border = isDark ? mixColors(card, '#ffffff', 0.18) : mixColors(card, '#000000', 0.12);
        const input = isDark ? mixColors(card, '#ffffff', 0.07) : mixColors(card, '#000000', 0.04);
        const inputBorder = isDark ? mixColors(border, '#ffffff', 0.12) : mixColors(border, '#000000', 0.1);
        const botBg = isDark ? mixColors(bg, '#ffffff', 0.12) : mixColors(bg, '#000000', 0.06);
        return {
            bgColor: bg,
            textColor: text,
            cardBgColor: card,
            cardBorderColor: border,
            inputBgColor: input,
            inputBorderColor: inputBorder,
            chatBubbleBotBg: botBg,
            chatBubbleBotText: text,
            chatBubbleUserBg: accent,
            chatBubbleUserText: getReadableTextColor(accent),
            primaryColor: accent,
            secondaryColor: isDark ? mixColors(accent, '#ffffff', 0.2) : mixColors(accent, '#000000', 0.2),
            headerBorderColor: border,
            systemMessageBg: isDark ? mixColors(bg, '#fde68a', 0.2) : mixColors(bg, '#fde68a', 0.28),
            systemMessageText: isDark ? '#fef3c7' : '#78350f'
        };
    }
    function buildThemePalette(theme, palette) {
        const base = palette || {
            primaryColor: '#2563eb',
            secondaryColor: '#6b7280',
            bgColor: '#ffffff',
            textColor: '#1f2937',
            cardBgColor: '#ffffff',
            cardBorderColor: '#d1d5db',
            inputBgColor: '#ffffff',
            inputBorderColor: '#cbd5e1',
            chatBubbleBotBg: '#f3f4f6',
            chatBubbleBotText: '#1f2937',
            chatBubbleUserBg: '#2563eb',
            chatBubbleUserText: '#ffffff',
            headerBorderColor: '#e5e7eb',
            systemMessageBg: '#fef3c7',
            systemMessageText: '#92400e'
        };
        const isDark = theme === 'dark';
        const bgColor = isDark ? mixColors(base.bgColor || '#ffffff', '#000000', 0.72) : '#ffffff';
        const textColor = getReadableTextColor(bgColor);
        const cardBgColor = isDark ? mixColors(bgColor, '#ffffff', 0.08) : '#ffffff';
        const cardBorderColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.16) : '#d1d5db';
        const inputBgColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.06) : '#ffffff';
        const inputBorderColor = isDark ? mixColors(cardBorderColor, '#ffffff', 0.12) : '#cbd5e1';
        const chatBubbleBotBg = isDark ? mixColors(bgColor, '#ffffff', 0.12) : '#f3f4f6';
        const chatBubbleBotText = textColor;
        const headerBorderColor = cardBorderColor;
        const systemMessageBg = isDark ? mixColors(bgColor, '#fde68a', 0.2) : '#fef3c7';
        const systemMessageText = isDark ? '#fef3c7' : '#92400e';
        return {
            ...base,
            bgColor,
            textColor,
            cardBgColor,
            cardBorderColor,
            inputBgColor,
            inputBorderColor,
            chatBubbleBotBg,
            chatBubbleBotText,
            headerBorderColor,
            systemMessageBg,
            systemMessageText
        };
    }
    function setPaletteVariables(target, palette) {
        if (!palette) return;
        target.style.setProperty('--primary', palette.primaryColor || '#007bff');
        target.style.setProperty('--secondary', palette.secondaryColor || '#6c757d');
        target.style.setProperty('--bg', palette.bgColor || '#f8f9fa');
        target.style.setProperty('--text', palette.textColor || '#343a40');
        target.style.setProperty('--card', palette.cardBgColor || '#ffffff');
        target.style.setProperty('--border', palette.cardBorderColor || '#dddddd');
        target.style.setProperty('--input', palette.inputBgColor || '#ffffff');
        target.style.setProperty('--iborder', palette.inputBorderColor || '#cccccc');
        target.style.setProperty('--bot-bg', palette.chatBubbleBotBg || '#e9ecef');
        target.style.setProperty('--bot-text', palette.chatBubbleBotText || '#343a40');
        target.style.setProperty('--user-bg', palette.chatBubbleUserBg || '#007bff');
        target.style.setProperty('--user-text', palette.chatBubbleUserText || '#ffffff');
        target.style.setProperty('--sys-bg', palette.systemMessageBg || '#fff3cd');
        target.style.setProperty('--sys-text', palette.systemMessageText || '#856404');
    }
    function applyPalette(palette) {

    function applyTheme(t) {
        currentTheme = t;

        themeBtn.textContent = t === 'dark' ? '☀️ Tema' : '🌙 Tema';
        const effectivePalette = buildThemePalette(t, currentPalette);
        setPaletteVariables(document.body, effectivePalette);
        setPaletteVariables(document.documentElement, effectivePalette);
        document.body.style.backgroundColor = effectivePalette.bgColor;
        document.body.style.color = effectivePalette.textColor;
        localStorage.setItem('theme', t);

    pdf2Upload.addEventListener('change', async (ev) => {
        const file = ev.target.files[0]; if (!file) return;
        if (!(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) {
            pdf2StatusDisplay.textContent = 'No es un PDF válido.'; pdf2StatusDisplay.style.color = 'var(--danger)'; return;
        }
        pdf2Name = file.name; pdf2NameDisplay.textContent = file.name;
        pdf2StatusDisplay.textContent = 'Procesando...'; pdf2StatusDisplay.style.color = 'var(--warning)';
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(e.target.result) }).promise;
                let text = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const tc = await page.getTextContent();
                    tc.items.forEach(item => text += item.str + ' ');
                    text += '\n';
                }
                pdf2Text = text;
                pdf2StatusDisplay.textContent = '"' + pdf2Name + '" cargado.'; pdf2StatusDisplay.style.color = 'var(--success)';
                addMsg('Segundo documento "' + pdf2Name + '" listo.', 'system');
            } catch(err) { pdf2StatusDisplay.textContent = 'Error al procesar.'; pdf2StatusDisplay.style.color = 'var(--danger)'; pdf2Text = ''; }
        };
        reader.readAsArrayBuffer(file);
    });

    function addMsg(message, sender, isThinking = false) {
        const el = document.createElement('div');
        el.classList.add(sender === 'user' ? 'user-message' : sender.includes('system') ? 'system-message' : 'bot-message');
        if (sender.includes('error')) el.classList.add('error');
        if (sender === 'bot' && !isThinking) {
            const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
            const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;">' + html + '</div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else if (sender === 'bot') {
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong> <span class="thinking-animation">' + message + '</span></div></div>';
            el.id = 'thinking-msg';
        } else if (sender === 'user') {
            const userAvatarUrl = getAvatarUrl('user');
            el.innerHTML = '<div class="message user-message"><div class="message-bubble user-bubble"></div><img class="avatar-img" src="' + userAvatarUrl + '" alt=""></div>';
            el.querySelector('.user-bubble').textContent = message;
        } else {
            el.textContent = message;
        }
        chatDisplay.appendChild(el); chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }
    function updateLastMsg(message) {
        const el = document.getElementById('thinking-msg');
        const botAvatarUrl = getAvatarUrl('bot');
        const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
        const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
        if (el) {
            el.className = 'bot-message';
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;">' + html + '</div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            el.removeAttribute('id');

    }

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }

    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
</body>
</html>
