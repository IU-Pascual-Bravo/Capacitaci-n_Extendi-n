us compañeros.   c)    Se produce un fallo en la acción  que de forma impre-   vista  muestra  públicamente  un  aspecto  de  Verónica    menos  desarrollado,  más  torpe,  muy  alejado  de  esa    imagen de «mejor alumna».   A través de la madre todos se enteran de que Verónica se   ha orinado encima.   d) Los  compañeros  (los  avergonzadores)  al  enterarse,  lo    difunden  a  viva  voz,  burlándose   de  su  falta  de  control  de    esfínteres,  y  contrastándolo  con  el  otro  rol:  el  de  mejor    alumna.    e)  Verónica (la avergonzada) no puede integrar esos dos    aspectos:  la  mejor  alumna  y  la  que  se  ha  orinado .  Siente    que  su  acción  aniquila  el  reconocimiento  y  el  cariño  que    había  logrado  entre  sus  compañeros,  que  todo  está    perdido, y quiere desaparecer.    En la mayor parte de los episodios de vergüenza están es-  tos mismos componentes: una  performance  que uno desea   desempeñar  correctamente  y  lograr  así  el  reconocimiento    y  el  afecto.  Un  súbito  fallo  en  esa   performance.    El  o  los      131 \n                    avergonzadores registrando dicho error y burlándose de él re-   marcando  la  distancia  entre  el  deseo  de  destacar  y  lo  que    efectivamente se ha logrado.   Si  pusiéramos  en  palabras  la  actitud  del  avergonzador  o    los  avergonzadores,  sería:  «Ja,  ja...  querías  impresionarnos,    despertar  nuestra  admiración  a  través  de  lo  que  hacías...  y    mira  la  torpeza  que  has  cometido...  No  mereces  nuestro    afecto,  nuestro  reconocimiento  ni  nuestra  admiración;  por    lo tanto, quedas fuera de nuestro círculo.»   La vergüenza y los códigos   Hasta  ahora  hemos  presentado  las  características  centra-    les  de  la  estructura  de  la  vergüenza.  Añadiremos  a  continua-    ción otros matices que también están presentes.   A  la  evaluación  de  la   performance    se  asocian  los  «códi-    gos»  que  los  grupos  construyen,  desde  donde  establecen  «lo    adecuado»  y  lo  «no  adecuado».  Para  los  adolescentes,  por    ejemplo,  ir  a  ciertos  lugares,  llegar  a  la  playa  a  determinada    hora,  vestirse  de  cierta  manera,  etc.,  puede  caer  dentro  de    una  u  otra  categoría.  Quien  va  a  una  reunión  con  la  ropa    «no  adecuada»  siente  entonces  enorme  vergüenza,  pues  se    hará  evidente  que  no  participa  del  código  imperante  y  que-    dará  expuesto  a  la  marginación  y  la  descalificación.  Dentro    de  estos  múltiples  conjuntos  de  pautas  codificadas  existe    uno  que  por  su  rigidez  y  arbitrariedad  causa  mucho  daño  a    las  jóvenes,  y  es  la  que  asocia  ser  bella  con  ser  delgada  y    alta.  Las  muchachas  que  no  responden  a  ese  prototipo  cor-    poral  terminan  sintiendo  vergüenza  de  su  propio  cuerpo ,  y    ya  conocemos  muy  bien  las  relaciones  que  existen  entre    esta  vergüenza  en  relación  con  el  propio  cuerpo  y  los  tras-    132 \n                    tornos alimentarios de diversa índole, en especial la ano-   rexia.   Lo público y lo privado   Otro  matiz  de  la  vergüenza  está  dado  por  la  relación  en-    tre  lo  privado  y  lo  público.  «Me  da  vergüenza  que  esto  que    es privado se haga público...»   El  ejemplo  prototípico  es  la  desnudez  física  y  la  sexuali-    dad,  pero  en  realidad  cada  persona  establece  los  límites  en-    tre  lo  que  está  dispuesto  a  mostrar  en  público  y  aquello  que    sólo  expresará  y  mostrará  en  privado.  En  este  sentido  la  ver-    güenza  es  una  respuesta  funcional  que  aparece  como  una    señal de alerta cuando esos límites son traspasados.   Avergonzador-Avergonzado   La  vergüenza,  como  el  resto  de  las  emociones,  está  cons-    tituida  por  un  vínculo  entre  dos  polos:  el  avergonzador  y  el    avergonzado.   Lo  que  se  hace  más  evidente  es  el  avergonzado,  el  que    siente  vergüenza,  pero  es  importante  reconocer  que  ese    polo  está  producido  por  el  opuesto:  el  avergonzador.  Es  el    avergonzador  el  que  hace  sentir  vergüenza,  y  hace  sentir    vergüenza  en  la  medida  en  que  se  burla,  humilla  y  descali-    fica .   Sin avergonzador no hay avergonzado .     133 \n                    Avergonzador externo-avergonzador interno   En  el  ejemplo  de  Verónica  los  avergonzadores  son  sus    compañeros  de  escuela;  en  general,  durante  la  infancia  la    vergüenza  que  uno  padece  está  producida  por  personas  del    mundo  externo  que  adoptan  la  actitud  de  avergonzadores.    Pero  en  la  medida  en  que  uno  crece  se  internaliza  ese  rol  y    comienza  a  instalarse  el  «avergonzador  interno».  Ya  existe    una  voz  interior  que  imagina  y  da  por  cierta  cuál  será  la  reac-    ción  del  entorno  ante  un  eventual  fallo,  y  entonces  la  ver-    güenza  se  instala  como  sentimiento  habitual,  independien-    temente de las características de cada grupo .   ¿Por qué el avergonzador actúa como lo hace?   Una  vez  que  hemos  caracterizado  el  rol  de  avergonza-    dor,  la  pregunta  que  surge  es:  ¿Por  qué  el  avergonzador  reac-    ciona ante el fallo burlándose y descalificando?   •  Cuando  esto  ocurre  entre  pares,  ya  sea  hermanos,    compañeros  de  escuela  o  amigos,  la  causa  más  frecuente  es    avergonzar  para  diferenciarse .  «Si  yo  me  burlo  y  te  aver-    güenzo  porque  te  has  orinado  (te  has  asustado  o  has  fallado    en  cualquier  sentido)  eso  me  asegura  de  que  a  mí  no  me    pasa  eso  y  que  estoy  muy  lejos  de  ese  estado.  Burlándome    lo circunscribo en ti y yo quedo fuera.»   Es  una  forma  precaria  y  degradada  de  diferenciarse ,  por-    que  se  apoya  en  la  exacerbación  de  la  diferencia  y  en  la  des-    calificación  de  aquello  de  lo  que  nos  diferenciamos.  Cuan-    do  construimos  nuestra  identidad  fundamentalmente  a    partir  del  contraste,  entonces  «cuanto  menos   seas  tú  más    creeré que soy yo».     134 \n                    Es  una  forma  degradada  de  diferenciarse,  porque  en  ese    movimiento  se  pierde,  además,  la  posibilidad  de  disfrutar  la    experiencia del compañerismo y la solidaridad.   Esto nos remite al otro componente presente:   •    La  competencia.  «Cuando  te  avergüenzo  hago  evi-    dente  que  te  he  ganado,  que  yo  soy  más  (en  esto  o  aquello)    que tú.»   •    Cuando  quienes  ejercen  el  rol  de  avergonzador  son    personas  mayores,  ya  sean  padres  o  maestros  del  avergonza-    do,  lo  hacen  atribuyéndole  a  la  vergüenza  una  función  pe-    dagógica.  «¡Colgaré  la  sábana  mojada  para  que  todos  sepan    que  te  has  hecho  pipí...!»  o  «¡Te  quedarás  de  pie  delante  de    tus compañeros para que vean lo que eres!»   Estas  actitudes  se  apoyan  en  la  creencia  según  la  cual,  si    padecemos  intensamente  la  vergüenza,  eso  nos  motivará  a    corregirnos.  Afortunadamente  ya  existe  una  comprensión    suficiente  del  error  de  esta  creencia  y  se  reconoce  que  la  hu-    millación  de  la  vergüenza  deja  mucho  dolor,  retracción  y    resentimiento,  y  que  no  es,  en  ningún  sentido,  un  estímulo    genuino  para  un  aprendizaje  sostenido.  Pero,  de  todos  mo-    dos,  también  es  justo  reconocer  que  aún  perduran  en  nues-    tra  cultura  fuertes  resabios  de  esta  actitud  que  utiliza  a  la    vergüenza como un recurso didáctico.   La parte de razón del avergonzador   Lo  que  hace  al  avergonzador  particularmente  dañino  es    que  en  su  mensaje  están  simultáneamente  presentes  una    parte de razón y una de error.   En  efecto,  el  fallo  que  señala  es  cierto:  Verónica  se  ha  ori-    nado,  la  ropa  del  muchacho  en  la  reunión  no  coincidía  con    135 \n                    la  que  el  código  de  ese  grupo  requería,  etc.  El  error  en  la    performance    efectivamente  existe,  y  ese  fallo  es  lo  que  suele    poner  en  evidencia  un  aspecto  poco  desarrollado  del  aspec-    to avergonzado .   El  problema  es  que  el  avergonzador  lo  señala  de  un    modo  burlón,  humillante  y  descalificador.  Ése  es  su  compo-    nente de error.   Este  doble  contenido  tan  altamente  contradictorio  es  lo    que  confunde  y  paraliza  al  avergonzado.  Es  como  tomar  un    veneno  y  una  medicina  simultáneamente .  Si  es  sólo  veneno    lo  rechazamos  con  contundencia,  si  es  sólo  medicina  lo  re-    cibimos  y  agradecemos,  pero  si  es  ambos  a  la  vez  nos  senti-    mos confusos y paralizados.   Por  esta  razón  es  especialmente  necesario  discriminar  en    el  mensaje  del  avergonzador  (ya  sea  el  interno  o  el  externo)    su componente de razón y de error.   «Esto  que  me  dices  es  cierto,  y  esto  otro  no.»  «Es  verdad    que  me  he  caído  en  el  escenario  y  que  eso  no  está  bien,    tampoco  yo  quiero  hacerlo,  pero  eso  no  significa  que  sea  un    inútil,  que  voy  a  ser  el  motivo  de  la  burla  de  todos  y  lo  mejor    sería que abandonase mi profesión de actor.»   Cuando  se  diferencian  estos  dos  componentes  se  co-    mienza  a  desmontar  la  cualidad  destructiva  del  avergon-    zador.   Vergüenza y autoestima   La  vergüenza  significa  una  pérdida  sorpresiva,  aguda  e    intensa  de  la  autoestima .  Es  por  este  motivo  por  lo  que  es  tan    desorganizadora.   Verónica  sentía:  «Seré  señalada  por  todos...,  lo  único  que    136 \n                    puedo  esperar  es  el  oprobio...,  enfrentar  a  la  maestra  y  a  mis    compañeros me es imposible...»   En  un  instante  todo  cambia:  de  mejor  alumna...  a  nadie.    Es  como  un  tornado  que  no  deja  ningún  apoyo  sobre  el  que    afirmarse.  Así  como  antes  era  la  mejor  alumna,  es  decir,  su    identidad  se  afirmaba  en  ese  rol,  ahora  era  la  que  se  orinaba    encima.  Su  identidad  se  había  asociado  a  su  aspecto  menos    desarrollado.  Ese  contraste  es  muy  fuerte  y  doloroso,  y  resul-    ta  muy  difícil  de  asimilar  tanto  para  un  niño  como  para  un    adulto.   Por  esta  razón  es  que  quien  ha  pasado  por  semejantes  es-    tados  y  no  ha  podido  resolver  la  vergüenza,  destina  mucha    energía  y  cuidados  a  evitar  las  situaciones  en  las  que  podría    quedar  expuesto  a  volver  a  sentirla.  Es  decir,  inhibe  su  ac-    ción .   Ampliaremos  las  relaciones  entre  autoestima  e  identidad    cuando  presentemos  la  significación  del  «sentido  del  hu-    mor» en la curación de la vergüenza.   Protagonismo-perfeccionismo   La  vergüenza  está  íntimamente  relacionada  con  el  perfec-    cionismo  y  se  manifiesta  en  proporción  inversa  al  placer  de    protagonizar.  Si  una  persona  disfruta  mucho  el  protagonismo    y  no  es  perfeccionista,  estará  muy  escasamente  expuesta  a  la    vergüenza  como  factor  inhibitorio,  porque  el  deseo  de  prota-    gonizar  permite  neutralizar  la  vergüenza.  Si  uno  siente  que  lo    que  quiere  es  estar  en  el  escenario  y  que  no  le  importa  mayor-    mente  lo  que  digan  porque  lo  que  quiere  es  estar  ahí,  enton-    ces  el  deseo  de  protagonismo  supera  el  eventual  reclamo  del    perfeccionismo y uno no inhibe su expresión.     137 \n                    Cómo se cura la vergüenza   Hemos  observado  que  la  vergüenza  tiene  muchos  mati-    ces  y  facetas.  En  este  capítulo  nos  centraremos  en  la  resolu-    ción  de  la  vergüenza  que  inhibe  la  acción  de  mostrarse  y  ex-    presarse,  pues  es  la  más  frecuente,  la  que  más  trastornos    produce  y  la  que  más  necesita  ser  comprendida  y  resuelta:    «Me  da  vergüenza  que  me  saquen  fotos;  Me  da  vergüenza    bailar... o cantar... o hablar en público...», etc.   •  Es  importante  revisar  cómo  es  el  avergonzador  interno    de  cada  uno.  El  avergonzador  interno  es  esa  voz  que,  o  bien    imagina  que  los  otros  van  a  burlarse  de  nuestro  deseo  de    mostrarnos  y  de  los  fallos  en  nuestra   performance,    o  bien    esa  misma  voz  lo  hace,  diciéndonos,  por  ejemplo:  «¡Cómo    puede  ser  que  hayas  cometido  semejante  fallo  (desafinado,    tropezado,  tartamudeado,  vacilado...  etc.).  ¡Eres  ridículo!    ¡No  mereces  que  te  tengan  en  consideración  ni  te  quie-    ran...! ¡Mejor desaparece!»   Ese  aspecto  necesita  aprender  que  si  bien  su  función  es  in-    formarnos  de  que  nos  hemos  equivocado,  el  sentido  último    de esa información es ayudarnos a capacitarnos, no destruirnos .   El  aspecto  avergonzador  actúa  como  si  la  vida  fuera  una    serie  ininterrumpida  de  escenas  de  examen,  y  ante  cada  si-    tuación  que  a  uno  le  toca  protagonizar,  él  funciona  como    un  severo  profesor  que  no  enseña,  que  sólo  toma  examen  y    aprueba  o  reprueba .  Reprobar  significa  aquí  burlar,  descali-    ficar y excluir.   Lo  que  el  avergonzador  necesita  incluir  es  el  componen-    te  de  aprendizaje  que  existe  en  la  vida,  en  el  que  cada  uno    ejercita  su  condición  de  aprendiz  que  continuamente  ensa-    ya,  explora,  acierta  y  se  equivoca.  Y  comprender  que  ese    movimiento nunca cesa.     138 \n                    Por  lo  tanto,  cada  error  no  es  la  causa  inexorable  de  un    suspenso  escandaloso,  sino  una  oportunidad  más  entre    otras de seguir aprendiendo.   El  aspecto  avergonzador  necesita  aprender  a  transfor-    marse de «examinador» en «colaborador del aprendizaje».   Esto nos remite a otro punto significativo de este proceso:   •  La  identificación   y  la  desidentificación .  Ahondaremos    en estas ideas.   Verónica  sentía:  «O  soy  la  mejor  alumna  o  soy  la  que  se    orina.»  La  noción  de  «yo»  queda  frecuentemente  asociada  a    algún  aspecto  parcial  de  la  totalidad  de  lo  que  somos.  Ése  es    el  mecanismo  de  identificación .  Y  según  sea  el  aspecto  con    el  cual  identifico  mi  «yo»  será  la  percepción  que  tenga  de    mí  mismo:  «la  mejor  alumna»  o  «la  que  se  orina».  Si  funcio-    no  con  mecanismos  de  identificación  masivos,  intensos  y    excluyentes,  quedo,  entre  otras  cosas,  muy  expuesto  al  sen-    timiento  de  vergüenza  desorganizadora.  Verónica  decía:  «Si    soy  la  que  se  orina,  entonces,  lo  que  me  cabe  es  el  oprobio  y    no  puedo  volver  a  enfrentarme  ni  con  mis  compañeros  ni    con  la  maestra...»  Éste  es  un  excelente  ejemplo  de  identifi-    cación masiva y excluyente.   Si  bien  es  razonable  que  me  identifique  con  aquel  aspec-    to  de  mí  que  está  actuando  en  un  momento  dado,  es  impor-    tante  considerar  cuánto  dura  dicha  identificación,  es  decir,    qué  capacidad  tengo  de  tomar  distancia  e  iniciar  luego  el    movimiento de desidentificación.   Si  ingreso  al  salón  de  un  congreso  en  el  que  haré  una  ex-    posición,  y  mientras  camino  hacia  el  escenario  resbalo  y  me    caigo  y  todos  los  papeles  vuelan  por  el  aire...,  ésa  es  sin    duda otra de las escenas prototípicas de vergüenza.   Mientras  me  caigo  y  cuando  estoy  en  el  suelo,  por  su-    puesto que soy yo quien está ahí y a quien le pasa eso...,     139 \n                    pero  es  interesante  observar  cuánto  tiempo  permanezco  en    esa  actitud  de  identificación.  Si  es  prolongada  y  no  salgo  de    ahí  («¡Qué  torpe  he  sido  al  caerme!  ¡Cómo  ha  podido  ocu-    rrirme!»)  seguramente  mi  ánimo  quedará  afectado  y  tal  vez    no  pueda  concentrarme  en  mi  exposición  ni  sea  capaz  de    realizar  un  buen  trabajo.  Eso  es  «cronificar»  y  padecer  la    identificación con quien se cayó .   La  otra  posibilidad  es  que,  si  bien  reconozco  que  soy  yo    quien  se  ha  caído,  también  puedo  percibir  que  mi  yo  no  se    agota  en  ese  que  ha  resbalado  y  que  por  lo  tanto  puedo  mi-    rar  desde  el  resto  de  mí  a  quien  se  ha  caído  y  en  ese  mo-    mento  me  desidentifico  de  él.  Me  ha  ocurrido  eso,  pero  no    soy  eso .  Cuando  comprendo  esta  realidad,  y  he  desarrolla-    do,  además,  una  actitud  asistencial  hacia  mí  mismo,  puedo    mirar  amorosamente  a  quien  se  ha  caído  y  encontrar  inclu-    so  los  aspectos  graciosos  o  simpáticos  de  ese  suceso,  com-    partirlo con el público y eventualmente reírnos juntos.   Lo  que  se  ha  expuesto  es  una  descripción  muy  resumida    de  los  mecanismos  psicológicos  que  permiten  experimentar    aquello que habitualmente llamamos «sentido del humor».   Esto  implica  también  transformar  la  calidad  del  aspecto    que  en  mí  se  encarga  de  reconocer  el  error  cometido.  Trans-    formarlo  de  avergonzador  humillante  en  testigo  amoroso,    que  puede  aprender  y  eventualmente  divertirse  con  aque-    llo que le toca vivir .   Cuando  esta  transformación  interior  se  instala  y  consoli-    da  ya  no  inhibo  mi  acción  y  comienzo  a  vivir  la  alegría  de    participar,  de  protagonizar,  que  es,  como  se  ha  dicho,  otro    eficaz antídoto de la vergüenza inhibidora.   Todos  estamos  expuestos  a  atravesar  una  situación  que    nos  produzca  vergüenza.  Mientras  actuemos  en  el  mundo    estamos  expuestos  a  tener  fallos  imprevistos  en  una   perfor-    140 \n                    mance,    o  no  acertar  con  el  código  de  pautas  imperante.  La    vergüenza  comienza  a  curarse  cuando  uno  está  dispuesto  a    correr  ese  riesgo  porque  se  siente  con  recursos  para  sobre-    llevar  esa  situación  en  el  caso  de  que  ocurra.  Es  decir,  la  ver-    güenza  se  convierte  en  emoción  conflictiva  cuando  inhibe    la  acción,  cuando  uno  deja  de  expresarse  a  causa  de  la  ver-    güenza.   El deseo de gustar   Además  de  los  motivos  particulares  que  producen  ver-    güenza  (cometer  un  fallo  en  tal  o  cual   performance)    hay  un    motivo  que  es  general  y  que  está  por  encima  de  todos  los  te-    mas  particulares.  Si  pusiéramos  en  palabras  dicha  actitud    sería:  «Tengo  vergüenza  de  que  se  advierta  mi  deseo  de  ex-    presarme,  de  mostrarme  y  de  hacerlo  bien,  para  lograr  que    me acepten, me reconozcan, me quieran o me admiren.»   Este  deseo,  si  no  ha  sido  legitimado  interiormente,  suele    ser el que más vergüenza produce .   La  persona  que  lo  siente  tiende  a  creer  que  a  ella  es  la    única  a  quien  le  sucede,  o  que  le  da  demasiada  importancia    a  su  participación  pública  y  sus  repercusiones,  y  que  a  los    otros  no  les  ocurre  lo  mismo.  Todo  esto  muestra  a  las  claras    que  dicha  persona  no  ha  legitimizado  su  deseo  (universal,    por otra parte) de mostrarse, gustar y ser reconocida.   Es  interesante  revisar  qué  grado  de  legitimidad  interior    tiene en cada uno este deseo.   Durante  el  proceso  de  elaboración  de  su  vergüenza,  Víc-    tor  relató:  «Estaba  por  cantar  (por  primera  vez)  en  público  y    empecé  a  sentir  que  me  ponía  tenso  y  me  ruborizaba;  en-    tonces  me  acordé  de  lo  mucho  que  trabajamos  y  antes  de    141 \n                    que  este  estado  siguiera  creciendo  me  acerqué  al  micrófono    y  dije:  \"La  verdad  es  que  me  siento  muy  nervioso;  tengo  mu-    chas  ganas  de  hacerlo  bien  y  que  a  ustedes  les  guste  lo  que    voy  a  cantar...\"  Después  de  decirlo,  la  vergüenza  que  me    oprimía remitió y desapareció el rubor...»   Una  de  las  señales  físicas  más  frecuentes  de  la  vergüenza    es  ruborizarse.  Luego  uno  teme  no  sólo  la  escena  que  aver-    güenza,  sino  el  ruborizarse  en  sí.  A  este  trastorno  se  lo  ha    denominado «eritrofobia».   El  rubor  es  el  aumento  del  riego  sanguíneo  que  recorre  la    cara  y  la  cabeza.  Dicho  aumento  de  riego  expresa  el  deseo  de    estar  presente .  Si  no  he  legitimado  mi  deseo  de  estar  presente    y  gustar,  entonces,  a  través  del  rubor  se  pierde  el  control  so-    bre  la  manifestación  física  de  ese  deseo  y,  que  se  note,  nos    avergüenza.  Y  eso  fue  lo  que  le  sucedió  a  Víctor:  el  mismo  de-    seo,  cuando  procuraba  ocultarlo  por  ilegítimo,  se  convertía    en  agobiante  motivo  de  vergüenza  y  se  expresaba  ruborizán-    dose.  Cuando  logró  legitimarlo  interiormente  y  pudo  expre-    sarlo  y  compartirlo  se  convirtió  en  un  deseo  más,  y  tanto  la    vergüenza que inhibía su acción como el rubor cesaron.   Si  bien  la  vergüenza  puede  parecer  una  perturbación   menor  en  relación  con  otras  emociones  como  el  miedo,  la    culpa  o  la  ira,  la  vivencia  en  sí  de  vergüenza  es  realmente    desorganizadora  y  muy  dolorosa.  Cuando  uno  la  ha  padeci-    do  y  sabe  que  no  cuenta  con  recursos  para  resolverla  en    caso  de  volver  a  presentarse,  se  convierte  en  un  freno  que    recorta  de  forma  impiadosa  la  posibilidad  de  disfrutar  el  de-    safío de expresarse, improvisar, crear y compartir.   Sentirse  disponible  para  ese  desafío,  y  encararlo,  es,  pre-    cisamente, una de las legítimas fuentes de alegría en la vida.   Bien  vale  la  pena  entonces  recordar  que  la  vergüenza  in-    hibidora se cura, y que existe un camino para ello.     142 \n                    INDAGACIÓN PERSONAL   A  título  de  resumen  se  presentan  a  continuación  los  aspec-    tos  más  significativos  de  la  vergüenza  encauzados  ahora  hacia    la  exploración  personal.  De  modo  que  si  usted  padece  esta    emoción le propongo la siguiente tarea:   Observe  cuál  es  la  escena  (real  o  imaginaria)  que  le  produ-    ce  vergüenza.  Trate  de  describirla  con  la  mayor  precisión  posi-    ble. Como si completara la siguiente frase:   a)  «Lo  que  a  mí  me  avergüenza  es»:  (cantar,  bailar,  ser  el    centro  en  una  reunión,  y  que  mientras  lo  hago  me  mues-    tre  torpe,  desafine,  me  olvide  la  letra,  diga  algo  «inapro-    piado»,  etc.).  Las  situaciones  posibles  son  múltlipes,  re-    pare en cuál es SIJ escena de vergüenza.    b)  «Y  que  quienes  están  conmigo  reaccionen  sintiendo,    pensando o haciendo....»    Esa  reacción  imaginada  de  los  otros  caracterizará  cómo  es    su avergonzador externo.   Una  vez  que  descubra  cuál  es  el  perfil  de  su  avergonzador    externo,  observe  si  reconoce  en  usted  algún  aspecto  propio    que  se  dice  lo  mismo  o  algo  equivalente,  es  decir,  cómo  es  la    voz  de  su  avergonzador  interior.  («¡Mira  el  ridículo  que  has  he-    cho,  qué  torpe  eres,  no  mereces  el  afecto  de  nadie,  mejor  de-    saparece!, etc.)   Lograr  identificar  al  avergonzador  interno  es  muy  impor-    tante,  porque  se  trata  de  la  puerta  de  entrada  que  permite  in-    gresar en la «fábrica personal» de la vergüenza.   Cuando  ha  conseguido  identificar  esa  voz  interior,  imagine    que  usted  es,  por  unos  instantes,  el  avergonzado  y  que  puede    hablarle a esa voz interna que lo avergüenza.     143 \n                      144  a)  «Lo que siento cuando me hablas de ese modo es...»    b)  «La parte de razón que tienes en lo que me dices es...»    c)  «El  modo  en  que  necesito  que  me  hables  y  me  digas  los    errores  que  cometo  para  poder  sentirme  ayudado  en  lu-    gar de avergonzado por ti, es...»    Trate  de  describirlo  con  la  mayor  claridad  y  amplitud  que    pueda,  porque  mientras  lo  haga  activará  otra  alternativa  inte-    rior, generalmente no experimentada ni utilizada.   •    Continúe  el  diálogo  avergonzador-avergonzado  todo  el    tiempo  necesario  hasta  que  ambos  alcancen,  por  comprensión    y  crecimiento,  el  registro  de  que  son  funciones  complementa-    rias y por lo tanto miembros solidarios del mismo equipo.   •    Cuando  esa  actitud  interior  está  establecida  uno  se  halla    en  mejores  condiciones  de  enfrentar  las  inevitables  escenas  de    vergüenza  que  inesperadamente  se  pueden  presentar  en  la    vida cotidiana.   •    Estar  en  mejores  condiciones  significa  que  uno  puede    asumir  con  mejor  naturalidad  el  deseo  de  gustar  y  ser  valorado    y  puede  reconocer  también  que  en  el  curso  de  cualquier  ac-    ción  puede  cometer  errores  o  torpezas  de  distinto  calibre,  has-    ta las más inesperadas e incluso desopilantes.   En  la  medida  en  que  se  alcanza  esa  plataforma  psicológica    básica  queda  más  transitable  el  camino  de  la  desidentifica-    ción:  Cuando  uno  comete  ese  error  tan  temido   puede  percibir    con  relativa  rapidez  que  «me  ocurrió  eso  pero  no  soy  eso».    Y  desde  la  totalidad  más  vasta  que  siento  que  soy  puedo  mirar    a  quien  le  ha  ocurrido  eso.  En  última  instancia,  podré  mirarlo    con  la  misma  calidad  amorosa  y  asistencial  que  haya  alcanza-    do  la  relación  avergonzador-avergonzado  interior.  Y  si  es  sufi-    ciente  y  satisfactoria  podré  encontrar  los  rasgos  simpáticos  de    ese  suceso  y  compartirlos.  Mientras  lo  hago,  esa  escena  tan  te-    mida  dejará  poco  a  poco  de  ser  la  catástrofe  que  desorganiza \n                    para  convertirse  en  un  momento  más,  que,  después  de  un    tiempo  razonable,  permita  pasar  al  próximo,  mientras  recu-    pero  mi  integridad  y  quedo  disponible  para  acompañar  ese    fluir.              145 \n";

        if (raw == null) return '';
        const s = String(raw).trim();
        if (!s) return '';
        try {
            const j = JSON.parse(s);
            if (Array.isArray(j)) return JSON.stringify(j);
            if (j && typeof j === 'object') {
                const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
                if (typeof c === 'string') return c.trim();
                if (typeof j.content === 'string') return j.content.trim();
                if (typeof j.text === 'string') return j.text.trim();
            }
            if (typeof j === 'string') return j;
        } catch (e) {}
        return s;
    }
    async function postBackendText(payload) {

        const res = await fetch(BACKEND_BASE + '/api/ia/text', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const raw = await res.text();
        if (!res.ok) throw new Error('Error de API: ' + res.status + ' ' + res.statusText + '. ' + raw.substring(0, 200));
        return extractTextFromBackendResponse(raw);
    }

    function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }
    function rgbToHex(r, g, b) {
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
        return '#' + toHex(r) + toHex(g) + toHex(b);
    }
    function mixColors(colorA, colorB, amount) {
        const a = hexToRgb(colorA);
        const b = hexToRgb(colorB);
        return rgbToHex(a.r + (b.r - a.r) * amount, a.g + (b.g - a.g) * amount, a.b + (b.b - a.b) * amount);
    }
    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);
    }
    function getReadableTextColor(bgColor) { return getLuminance(bgColor) > 0.56 ? '#111827' : '#f8fafc'; }
    function generatePalette() {
        const hue = Math.floor(Math.random() * 360);
        const bg = hslToHex(hue, 45 + Math.floor(Math.random() * 20), 16 + Math.floor(Math.random() * 70));
        const text = getReadableTextColor(bg);
        const isDark = getLuminance(bg) < 0.5;
        const accent = hslToHex((hue + 35 + Math.floor(Math.random() * 60)) % 360, 80, isDark ? 55 : 45);
        const card = isDark ? mixColors(bg, '#ffffff', 0.08) : mixColors(bg, '#000000', 0.05);
        const border = isDark ? mixColors(card, '#ffffff', 0.18) : mixColors(card, '#000000', 0.12);
        const input = isDark ? mixColors(card, '#ffffff', 0.07) : mixColors(card, '#000000', 0.04);
        const inputBorder = isDark ? mixColors(border, '#ffffff', 0.12) : mixColors(border, '#000000', 0.1);
        const botBg = isDark ? mixColors(bg, '#ffffff', 0.12) : mixColors(bg, '#000000', 0.06);
        return {
            bgColor: bg,
            textColor: text,
            cardBgColor: card,
            cardBorderColor: border,
            inputBgColor: input,
            inputBorderColor: inputBorder,
            chatBubbleBotBg: botBg,
            chatBubbleBotText: text,
            chatBubbleUserBg: accent,
            chatBubbleUserText: getReadableTextColor(accent),
            primaryColor: accent,
            secondaryColor: isDark ? mixColors(accent, '#ffffff', 0.2) : mixColors(accent, '#000000', 0.2),
            headerBorderColor: border,
            systemMessageBg: isDark ? mixColors(bg, '#fde68a', 0.2) : mixColors(bg, '#fde68a', 0.28),
            systemMessageText: isDark ? '#fef3c7' : '#78350f'
        };
    }
    function buildThemePalette(theme, palette) {
        const base = palette || {
            primaryColor: '#2563eb',
            secondaryColor: '#6b7280',
            bgColor: '#ffffff',
            textColor: '#1f2937',
            cardBgColor: '#ffffff',
            cardBorderColor: '#d1d5db',
            inputBgColor: '#ffffff',
            inputBorderColor: '#cbd5e1',
            chatBubbleBotBg: '#f3f4f6',
            chatBubbleBotText: '#1f2937',
            chatBubbleUserBg: '#2563eb',
            chatBubbleUserText: '#ffffff',
            headerBorderColor: '#e5e7eb',
            systemMessageBg: '#fef3c7',
            systemMessageText: '#92400e'
        };
        const isDark = theme === 'dark';
        const bgColor = isDark ? mixColors(base.bgColor || '#ffffff', '#000000', 0.72) : '#ffffff';
        const textColor = getReadableTextColor(bgColor);
        const cardBgColor = isDark ? mixColors(bgColor, '#ffffff', 0.08) : '#ffffff';
        const cardBorderColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.16) : '#d1d5db';
        const inputBgColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.06) : '#ffffff';
        const inputBorderColor = isDark ? mixColors(cardBorderColor, '#ffffff', 0.12) : '#cbd5e1';
        const chatBubbleBotBg = isDark ? mixColors(bgColor, '#ffffff', 0.12) : '#f3f4f6';
        const chatBubbleBotText = textColor;
        const headerBorderColor = cardBorderColor;
        const systemMessageBg = isDark ? mixColors(bgColor, '#fde68a', 0.2) : '#fef3c7';
        const systemMessageText = isDark ? '#fef3c7' : '#92400e';
        return {
            ...base,
            bgColor,
            textColor,
            cardBgColor,
            cardBorderColor,
            inputBgColor,
            inputBorderColor,
            chatBubbleBotBg,
            chatBubbleBotText,
            headerBorderColor,
            systemMessageBg,
            systemMessageText
        };
    }
    function setPaletteVariables(target, palette) {
        if (!palette) return;
        target.style.setProperty('--primary', palette.primaryColor || '#007bff');
        target.style.setProperty('--secondary', palette.secondaryColor || '#6c757d');
        target.style.setProperty('--bg', palette.bgColor || '#f8f9fa');
        target.style.setProperty('--text', palette.textColor || '#343a40');
        target.style.setProperty('--card', palette.cardBgColor || '#ffffff');

        target.style.setProperty('--input', palette.inputBgColor || '#ffffff');

        target.style.setProperty('--bot-bg', palette.chatBubbleBotBg || '#e9ecef');

    }

    pdf2Upload.addEventListener('change', async (ev) => {

                let text = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);

                    tc.items.forEach(item => text += item.str + ' ');

    function addMsg(message, sender, isThinking = false) {
        const el = document.createElement('div');
        el.classList.add(sender === 'user' ? 'user-message' : sender.includes('system') ? 'system-message' : 'bot-message');
        if (sender.includes('error')) el.classList.add('error');

            const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
            const html = marked.parse ? marked.parse(processedMessage) : processedMessage;

            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
