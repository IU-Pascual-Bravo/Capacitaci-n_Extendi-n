    <style>
        :root{--primary:#007bff;--secondary:#6c757d;--light:#f8f9fa;--dark:#343a40;--success:#28a745;--danger:#dc3545;--warning:orange;--radius:8px;--font:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;--bg:var(--light);--text:var(--dark);--card:#fff;--border:#ddd;--input:#fff;--iborder:#ccc;--bot-bg:#e9ecef;--bot-text:var(--dark);--user-bg:var(--primary);--user-text:#fff;--sys-bg:#fff3cd;--sys-text:#856404;}
        body.dark-mode{--bg:#212529;--text:#f8f9fa;--card:#343a40;--border:#495057;--input:#495057;--iborder:#6c757d;--bot-bg:#495057;--bot-text:#f8f9fa;--sys-bg:#332701;--sys-text:#ffeb8f;}
        body{font-family:var(--font);margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s;}
        .container{width:90%;max-width:800px;margin:20px auto;padding:20px;background:var(--card);border-radius:var(--radius);box-shadow:0 4px 12px rgba(0,0,0,.1);flex-grow:1;display:flex;flex-direction:column;gap:15px;}
        header{text-align:center;border-bottom:1px solid var(--border);padding-bottom:15px;}
        header h1{color:var(--primary);margin:0;font-size:1.6em;}
        header p{margin:5px 0 0;font-size:.9em;color:var(--secondary);}
        .toolbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;}
        button{background:var(--primary);color:#fff;border:none;padding:8px 15px;border-radius:var(--radius);cursor:pointer;font-size:.9em;transition:background .2s;}
        button:hover{background:#0056b3;}
        button:disabled{background:var(--secondary)!important;opacity:.65;cursor:not-allowed;}
        #theme-btn{background:var(--secondary);}
        #palette-btn{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
        .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
        .btn-export{background:var(--primary);color:#fff;border:none;padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-size:.85em;transition:background .2s;}
        .btn-export:hover{background:#0056b3;}
        .pdf2-section{padding:10px;border:1px dashed var(--border);border-radius:var(--radius);}
        .pdf2-section label.title{font-size:.85em;font-weight:bold;display:block;margin-bottom:6px;color:var(--secondary);}
        .file-row{display:flex;align-items:center;gap:10px;}
        .file-row input[type=file]{display:none;}
        .file-label{background:var(--secondary);color:#fff;padding:6px 12px;border-radius:var(--radius);cursor:pointer;font-size:.85em;}
        .file-label:hover{background:#545b62;}
        #pdf2-name{font-style:italic;color:var(--secondary);font-size:.85em;}
        #pdf2-status{font-size:.85em;margin-top:4px;font-weight:bold;}
        .suggested-questions-row{display:flex;flex-direction:column;gap:6px;}
        .sq-label{font-size:.85em;font-weight:600;color:var(--secondary);}
        .questions-select{width:100%;padding:8px;border:1px solid var(--iborder);border-radius:var(--radius);background:var(--input);color:var(--text);font-size:.9em;}
        .chat-display{height:360px;overflow-y:auto;border:1px solid var(--iborder);border-radius:var(--radius);padding:10px;background:var(--bg);line-height:1.6;}
        .chat-display .user-message,.chat-display .bot-message,.chat-display .system-message{margin-bottom:10px;word-wrap:break-word;}
        .chat-display .user-message,.chat-display .bot-message{background:transparent;color:inherit;padding:0;border-radius:0;max-width:100%;text-align:inherit;margin-left:0;}
        .message{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px;max-width:100%;}
        .message.user-message{flex-direction:row-reverse;justify-content:flex-start;}
        .avatar-img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #eee;background-color:#f0f0f0;}
        body.dark-mode .avatar-img{border-color:#444;background-color:#555;}
        .message-bubble{padding:10px 15px;border-radius:18px;max-width:85%;word-wrap:break-word;line-height:1.5;display:flex;flex-direction:column;}
        .user-message .message-bubble.user-bubble{background:var(--user-bg);color:var(--user-text);border-bottom-right-radius:5px;margin-left:auto;}
        .bot-message .message-bubble.bot-bubble{background:var(--bot-bg);color:var(--bot-text);border-bottom-left-radius:5px;margin-right:auto;}
        .chat-display .message-bubble strong{color:var(--primary);font-size:.9em;}
        .chat-display .bot-message .message-bubble p{margin:0 0 8px;}.chat-display .bot-message .message-bubble p:last-child{margin:0;}
        .chat-display .bot-message .message-bubble pre{background:var(--dark);color:var(--light);padding:10px;border-radius:5px;overflow-x:auto;}
        .chat-display .bot-message .message-bubble code{background:rgba(0,0,0,.1);padding:2px 4px;border-radius:3px;}
        body.dark-mode .chat-display .bot-message .message-bubble code{background:rgba(255,255,255,.1);}
        .chat-display .system-message{background:var(--sys-bg);color:var(--sys-text);text-align:center;font-style:italic;font-size:.9em;padding:8px 12px;border-radius:var(--radius);}
        .chat-display .system-message.error{background:#f8d7da;color:#721c24;}
        .thinking-animation{opacity:.75;animation:pulseThink 1s ease-in-out infinite;}
        @keyframes pulseThink{50%{opacity:1}}
        .input-area{display:flex;gap:10px;}
        #question-input{flex-grow:1;padding:10px;border:1px solid var(--iborder);border-radius:var(--radius);font-size:1em;resize:none;background:var(--input);color:var(--text);}
        #send-button{background:var(--success);padding:0 20px;display:flex;align-items:center;justify-content:center;gap:8px;}
        #send-button:hover{background:#1e7e34;}
        .loader{border:3px solid #f3f3f3;border-top:3px solid var(--primary);border-radius:50%;width:16px;height:16px;animation:spin 1s linear infinite;display:none;}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        footer{text-align:center;padding:12px;background:var(--dark);color:var(--light);font-size:.8em;margin-top:20px;}
        @media(max-width:600px){.input-area{flex-direction:column;}#send-button{width:100%;padding:12px;}}
    </style>
</head>

<script>
    const PDF_TEXT = "                                La Sabiduría de las emociones        Norberto Levy    \n                    ÍNDICE    INTRODUCCIÓN GENERAL ....................................    UNO.   La dignidad del miedo ....................................    Dos.   El enojo que resuelve .....................................    TRES.   La culpa que tortura y la culpa que repara ......    CUATRO.   Exigencia y excelencia ...................................    CINCO.   Aprender de la envidia      ..............................    SEIS.   La vergüenza y su curación      .......................      2 \n                       INTRODUCCIÓN GENERAL    El  propósito  central  de  este  libro  es  mostrar  hasta  qué    punto  está  presente  en  la  naturaleza  misma  de  las  emocio-    nes categorizadas como conflictivas, su condición de señal.   Del  mismo  modo  que  las  luces  del  tablero  de  mandos  del    automóvil  se  encienden  e  indican  que  ha  subido  la  tempe-    ratura  o  queda  poco  combustible,  cada  emoción  es  una  luz    de  tonalidad  específica  que  se  enciende  e  indica  que  existe    un problema a resolver.   El  miedo,  la  ira,  la  culpa,  la  envidia,  etc.,  son  estupendas    y  refinadísimas  señales,  que  alertan,  cada  una  de  ellas,  acer-    ca  de  un  problema  particular  y  su  función  es  remitir  a  ese    problema .   Por  lo  tanto,  las  emociones  son  aprovechadas  completa-    mente  cuando  uno  aprende  qué  problema  específico  detec-    ta  cada  emoción  y  cuál  es  el  camino  que  resuelve  el  proble-    ma detectado.   Cuando  esto  ocurre,  uno  se  concentra  en  la  resolución    del  problema  y  le  agradece  a  la  emoción  haber  orientado  la    mirada  en  esa  dirección,  por  más  dolorosa  o  inquietante    que dicha emoción pueda haber parecido al comienzo.   Continuando  con  la  metáfora  del  tablero  de  mandos,  las    3 \n                    luces  se  aprovechan  en  toda  su  utilidad  cuando  uno  apren-    de  qué  es  lo  que  indica  cada  una,  y  sabe,  además,  cómo  en-    caminarse  a  resolver  el  problema  que  registra:  sé  que  la  luz    que  se  encendió  indica  que  hay  poco  combustible  y  sé    cómo  dirigirme  hacia  la  próxima  gasolinera.  Cuando  llego    allí  y  cargo  combustible  he  completado  el  circuito  resoluti-    vo que la luz puso en marcha.   Solemos  creer  que  las  emociones  son  el  problema.  Que  el    miedo,  el  enojo,  la  culpa,  etc.,  son  los  problemas  que  nos    acosan.  Y  no  es  así.  Se  convierten  en  problemas  cuando  no    sabemos  cómo  aprovechar  la  información  que  brindan,    cuando  nos  «enredamos»  en  ellas  y  nuestra  ignorancia  emo-    cional  las  convierte  en  un  problema  más.  Entonces  sí,  cada    uno  de  estos  estados  agrega  más  sufrimiento  estéril  a  la  expe-    riencia  que  vivimos.  Pero,  repitámoslo  una  vez  más,  no  es  la    emoción  en  sí  lo  que  perturba  sino  el  no  haber  aprendido    aún cómo leer y aprovechar la información que transmite.   En  esta  obra  presentamos  un  análisis  de  cada  emoción,  des-    cribimos  los  errores  más  habituales  que  cometemos  en  rela-    ción  con  cada  una  de  ellas  y  mostramos,  de  la  forma  más    detallada  posible,  cuál  es  el  problema  que  cada  emoción    señala.   En  este  primer  libro  comenzamos  con  las  tres  emociones    conflictivas  consideradas,  tradicionalmente,  como  las  bási-    cas  y  universales:  el  miedo,  la  ira  y  la  culpa.  Añadimos  a    ellas,  la  envidia,  considerada  habitualmente  como  el  proto-    tipo  de  la  emoción  negativa,  y  la  vergüenza,  que  si  bien  pa-    rece tener un tono menor en relación con las anteriores,     4 \n                    cuando  se  la  padece  inhibe  fuertemente  la  posibilidad  de    expresarse de un modo espontáneo y creativo.   Incluimos  también  un  análisis  de  la  exigencia,  que  no  es    estrictamente  una  emoción,  sino  más  bien  una  actitud,  una    manera  de  intentar  producir  ciertos  resultados.  Lo  hacemos    porque  forma  parte  del  universo  periférico  de  las  emocio-    nes,  y  porque  su  extensión  y  las  confusiones  que  existen    asociadas a ella producen mucho sufrimiento estéril.   Quedan  para  el  próximo  libro  las  emociones  conflictivas    restantes:  los  celos,  la  competencia,  el  resentimiento  y  la    voracidad.   Y  también  el  amor.  El  amor  no  es,  por  cierto,  una  emo-    ción  conflictiva,  sino  una  calidad  de  energía.  Para  ser  más    precisos,  se  trata  de  una  calidad  de  interacción.  Esa  interac-    ción  que  se  manifiesta  en  todos  los  planos  y  que  en  última    instancia  es  la  que  posibilita  la  vida.  La  que  permite  tanto    que  una  célula  exista  y  coopere  con  otra...  como,  en  la  di-    mensión  más  macroscópica,  aquello  a  lo  que  se  refería  Goe-    the  cuando  expresaba:  «He  visto  el  amor  que  mueve  al  sol  y    las demás estrellas...»   Por  más  lejana  y  opacada  que  parezca,  también  es  posi-    ble  reconocer  esa  esencia  amorosa  aun  en  las  emociones    más  conflictivas  y  percibir,  además,  las  vicisitudes  que  dicha    energía  recorrió  hasta  convertirse  en  la  respuesta  destructiva    actual.  Vicisitudes  de  frustraciones,  desorganización,  con-    clusiones  equivocadas,  confusión...,  hasta  el  aparentemente    más completo extravío de sí.   Cuando  se  puede   encontrar  el  amor  allí  donde  parece    que  el  amor  no  está   es  cuando  se  devuelve  a  cada  emoción    su  sentido  más  profundo.  Es  cuando  puede  accederse  a   la   sabiduría de las emociones.      5 \n                    Esta  obra  invita  al  lector  a  explorar  el  modo  en  que  está  pre-    sente  en  sí  mismo  cada  emoción  sobre  la  que  lee.  Por  tal  ra-    zón  se  aprovecha  mejor  la  lectura  cuando  se  destina  un    tiempo  para  observar  cuál  es  la  resonancia  personal  que  le    produce  lo  que  ha  leído,  es  decir,  en  qué  sentido  confirma  o    modifica  tanto  su  modo  de  sentir  esa  emoción  como  aque-    llo que habitualmente piensa de ella.   Es  por  este  motivo  por  lo  que  sugerimos  no  leer  el  libro    de  acuerdo  con  un  orden  corriente,  empezando  por  el  prin-    cipio,  ni  seguir  el  orden  del  índice  temático,  sino  más  bien    abordar  cada  vez  la  emoción  que  al  lector  más  le  interese,    ya  sea  por  la  atracción  que  pueda  producirle  o  sencillamen-    te porque siente que la está padeciendo.     6 \n                    U   N   O       LA DIGNIDAD DEL MIEDO    El miedo es una valiosísima señal que indica una    desproporción entre la amenaza a la que nos    enfrentamos y los recursos con que contamos para    resolverla. Sin embargo, nuestra confusión e    ignorancia lo han convertido en una «emoción    negativa» que debe ser eliminada.      7 \n                       El  miedo  es  la  sensación  de  angustia  que  se  produce  ante    la percepción de una amenaza.   Es  importante  aclarar  que  no  existe  algo  que  sea  en  sí    mismo  una  amenaza.  Siempre  lo  es  para  alguien,  y  depende    de  los  recursos  que  ese  alguien  tenga  para  enfrentarla.  Un    mar  bravío,  por  ejemplo,  puede  ser  una  terrible  amenaza    para  quien  no  sabe  nadar,  y  deja  de  serlo  para  un  experto    nadador  en  aguas  turbulentas.  Esta  observación,  que  puede    parecer  obvia  e  irrelevante,  alcanza  toda  su  significación    cuando se intenta comprender y curar el miedo.   La reacción en cadena    Una  respuesta  interesante  que  los  seres  humanos  produ-    cimos  en  relación  con  las  emociones  en  general  —y  al  mie-    do  en  particular—  es  que  no  sólo  las  sentimos,  sino  que    además  reaccionamos  interiormente  ante  ellas.  Y  esto  gene-    ra una segunda emoción .   Solemos  sentir  miedo  por  algún  motivo  y,  a  continuación    del miedo, podemos experimentar vergüenza, humillación,     8 \n                    rabia,  impotencia,  etc.,  por  tener  miedo .  Es  decir,  siempre    tenemos  una  doble  reacción .  El  miedo,  por  lo  tanto,  no  es    algo  equiparable  a  una  fotografía,  a  un  instante  estático,    sino  que  se  parece  más  a  un  filme  en  el  cual  la  secuencia  es:    a)    registro  de  una  amenaza,   b)    reacción  de  miedo,  y   c)    la   respuesta interior a esa reacción de miedo.   La  respuesta  interior  al  miedo  es  de  gran  importancia,    porque  según  sea  su  calidad  actuará  atenuando  o  agravando    el miedo original .   Veamos  un  ejemplo  que  ilustra  mejor  esta  idea:  Miguel    me  consultó  porque  experimentaba  un  miedo  muy  antiguo    a  mostrarse  en  público  y  participar  en  grupos,  lo  cual  le  pro-    ducía  un  gran  dolor.  Lo  invité  a  que  se  conectara  con  ese  as-    pecto  temeroso,  y  que  luego  lo  imaginara  como  si  estuviera    enfrente  de  él.  Dijo:  «Lo  imagino  sentado  en  una  grada,  en-    tre  otras  personas,  escondiéndose  para  que  nadie  lo  vea;    tenso, pálido y con un sudor frío en la cara...»   Luego  le  pregunté  qué  sentía  al  ver  a  su  aspecto  temeroso    de  esa  manera,  y  respondió:  «Me  produce  mucha  impoten-    cia  y  desesperación...  Me  dan  ganas  de  sacudirlo  y  decirle:    \"¿Por  qué  te  escondes?...  ¡Por  qué  no  te  muestras  y  cuentas    lo  que  tienes  que  contar?...  ¡Estoy  harto  de  verte  en  la  última    fila!...  ¡Te  obligaré  a  ponerte  en  primer  lugar  para  que  te  des    cuenta de que puedes hacerlo...!\".»   Una  vez  que  le  comunicó  a  su  aspecto  temeroso  lo  que    sentía  hacia  él,  se  le  dio  al  aspecto  temeroso  la  oportunidad    de  responder,  para  lo  cual  lo  invité  a  que  ocupara  el  lugar    donde  había  imaginado  a  su  aspecto  temeroso;  le  propuse    que  adoptara  su  postura  corporal,  su  actitud  tensa,  contraí-    da,  asustada...  y  una  vez  que  asumió  ese  papel,  que  ingresó    en  la  piel  del  aspecto  temeroso ,  le  pregunté  qué  sentía  al  es-    cuchar  lo  que  se  le  acababa  de  decir.  Respondió:  «Me  sien-    9 \n                    to  muy  mal.  Tengo  mucho  más  miedo  que  antes.  Ahora  ten-    go  dos  problemas:  el  miedo  que  me  despierta  la  gente,  y  el    miedo  que  me  produces  tú  cuando  quieres  obligarme  a  ha-    cer algo que no puedo hacer...»   Como  podemos  observar,  aquí  se  desplegaron  las  tres  fa-    ses  de  la  secuencia:   a)    la  amenaza  (el  público),   b)    la  res-    puesta  de  miedo  (el  aspecto  temeroso)  y   c)    la  reacción  inte-    rior  hacia  ese  miedo,  que  en  este  caso  actuaba  claramente    agravando el miedo origina l.   Quizá  resulte  extraño  describir  un  diálogo  interior  en  el  que    los  protagonistas  se  hablan  como  si  fueran  dos  personas.  En    el  ejemplo  de  Miguel,  en  lugar  de  hablar  acerca  de  cómo    percibe  a  cada  una  de  esas  dos  partes,  vive  una  experiencia    en  la  que  cada  parte  se  expresa  a  sí  misma  y  le  habla  a  la    otra de un modo directo y sin intermediarios .   Este  recurso  se  está  utilizando  cada  vez  más  en  psicolo-    gía  porque  la  experiencia  clínica  muestra  que  lo  que  una    persona  puede  descubrir  de  cualquier  aspecto  de  sí  misma,    si  lo  encarna,  si  se  convierte  en  él  por  unos  instantes  y  desde    ahí  se  expresa,  es  mucho  más  profundo  y  esencial  que  lo    que puede registrar si meramente habla acerca de él.   Es  por  ello  que  empleo  esta  técnica  desde  hace  más  de    veinticinco  años.  Tanto  en  el  miedo  como  en  el  resto  de  las    emociones  que  se  incluyen  en  el  presente  libro,  esta  forma    psicodramática  de  abordaje  se  halla  presente  como  un  com-    ponente  muy  valioso  de  todo  el  proceso  de  descubrimiento,    aprendizaje y transformación.   De  hecho,  si  Miguel  pudo  percibir  con  claridad  lo  que  su    aspecto  temeroso  sentía  fue  porque  se  convirtió  en  él  y  asu-    mió  temporariamente  esa  identidad.  Si  no  hubiera  realizado    10 \n                    esa  experiencia,  lo  más  probable  es  que  no  registrara  el  ma-    lestar  y  el  agravamiento  del  aspecto  temeroso,  que  siguiera    creyendo  que  la  reacción  que  tenía  hacia  él  era  la  adecuada    y  que  el  aspecto  temeroso  no  cambiaba  sencillamente  por-    que era así y va no tenía arreglo .   Una  vez  formulada  esta  aclaración,  volvamos  al  tema  es-    pecífico del miedo.   Cuando  se  explora  esta  emoción  es  necesario  conocer  la    secuencia  completa  de  reacciones,  porque  para  el  aspecto    temeroso  es  tan  importante  el  trato  o  maltrato  que  reciba  de    las  personas  de  su  mundo  externo  como  el  que  recibe  de  los     otros  aspectos  interiores .  En  Miguel,  el  miedo  crónico  esta-    ba  producido  por  esta  actitud  interior,  ignorante  y  desespe-    rada,  que  intentaba  curar  al  aspecto  temeroso  de  su  miedo    obligándolo  a  hacer  algo  que  el  aspecto  temeroso  no  podía    hace r.   Creencias equivocadas en relación   con el miedo    El  miedo  es,  sin  duda,  una  emoción  universal.  Todos  he-    mos  vivido  esa  experiencia,  y,  sin  embargo,  nos  vinculamos    con él con un alto grado de desconocimiento e ineficacia .   Ese  desconocimiento  se  pone  de  manifiesto  en  la  actitud    de  descalificación  que  las  creencias  culturales  han  generado,    las  cuales  han  convertido  al  miedo  en  una  emoción  indigna .   Cuando  se  dice  de  alguien  que  no  hizo  tal  cosa  «porque  tuvo    miedo»,  suele  hacerse  con  un  tono—más  o  menos  velado—    de descalificación y desprecio hacia esa persona.   Si  resumiéramos  en  pocas  palabras  la  creencia  social    predominante,  sería:  «El  problema  es  el  miedo.   Si  usted  lo-    11 \n                    gra  no  sentir  miedo  hacia  aquello  que  teme,  verá  que  lo    puede  encarar  y  realizar  sin  las  dificultades  que  su  miedo  le    pronosticaba.  El  miedo  es,  por  lo  tanto,  una  emoción  negati-    va.  pura  perturbación ,  y  el  recurso  que  le  permita  no  sentir-    lo será de gran utilidad para que funcione mejor.»   Como  consecuencia,  un  recurso  al  cual  se  apela  frecuen-    temente  para  no  sentir  miedo  es  la  autosugestión:  «Yo  no    siento  miedo,  yo  no  tengo  por  qué  sentir  miedo,  no  permiti-    ré  que  esa  emoción  negativa  me  perturbe  a  la  hora  de  ha-    cer lo que deseo...»   Otras  formas  del  desconocimiento  y  la  descalificación  se    expresan  en  las  populares  frases:   «¡Hay  que  vencer  el  mie-    do!;  ¡No  seas  cobarde,  no  tengas  miedo!;  ¡El  miedo  es  signo    de debilidad!; ¡Los hombres no tienen miedo!»,  etc.   De  todas  ellas,  la  más  descalificadora  es  el   «¡No  seas  co-    barde!».    Equiparar  miedo  con  cobardía   es  una  de  las  confu-    siones  que  más  daño  producen,  como  demostraremos  más    adelante.   Tal  como  se  puede  comprobar,  el  núcleo  de  la  creencia    que  hemos  presentado  es:  el  problema  es  el  miedo.  Todo  co-    mienza  allí.  El  miedo  es  pura  perturbación.  Hay  que  tratar,    por todos los medios, de no sentirlo .   Una nueva mirada    Si  uno  observa  con  detenimiento  y  sin  prejuicios  esta  reac-    ción,  encontrará  que  el  miedo  es  una  señal  que  indica  que    existe  una  desproporción  entre  la  magnitud  de  la  amenaza  a    la  que  nos  enfrentamos  v  los  recursos  que  tenemos  para  re-    solverla .   La  amenaza  puede  ser  física  o  emocional.  Podemos  te-    12 \n                    mer  ser  golpeados,  no  contar  con  el  dinero  suficiente  para    mantenernos,  ser  humillados  y  excluidos  del  afecto  de  quie-    nes  nos  rodean,  etc.  Si  bien  estos  niveles  se  entremezclan,    siempre  alguno  predomina,  y  los  recursos  requeridos  son    aquellos  que  están  relacionados  con  todos  los  componentes    de la amenaza.   Sea  cual  fuere  la  índole  del  peligro,  si  la  amenaza  a  la    que  nos  enfrentamos  tiene  un  valor  diez  y  los  recursos  con    los  que  contamos  para  hacerle  frente  también  tienen  un  va-    lor  diez,  no  va  a  producirse  miedo .  Si  los  recursos  que  tene-    mos  son  de  un  valor  tres,  el  miedo  surgirá  y  será,  precisa-    mente,  el  indicador  de  esa  desproporción.  Por  ejemplo,  si    voy  a  dar  una  clase  —y  todos  sabemos  que  se  trata  de  un  de-    safío  que  debe  ser  resuelto  por  quien  la  da—  es  necesario    que  disponga  de  los  recursos  psicológicos  y  la  información    suficiente  para  enfrentarme  a  esa  clase  con  eficacia.  Si  no    conozco  adecuadamente  el  tema  del  cual  voy  a  hablar  y,    además,  soy  hipercrítico,  entonces,  puedo  imaginar  que  el    público  va  a  reprobar  cualquier  error  o  vacilación  que  yo    tenga.  Ante  esa  perspectiva,  inevitablemente  surgirá  el  mie-    do.  Pero  es  importante  aclarar  que  el  miedo  no  es  el  proble-    ma.  El  miedo  está  indicando  que  existe  un  problema,  lo  cual    es completamente distinto .   Por  lo  tanto,  el  error  que  cometemos  es  convertir  en  el    problema  mismo  lo  que  en  realidad  es  una  señal  que  indica    la  existencia  de  un  problema  —y  que  nos  daría  la  posibili-    dad de resolverlo .   Para  entenderlo  mejor  retomaremos  una  metáfora  ya  pre-    sentada  en  la  introducción:  el  miedo  es  como  la  luz  que  se    enciende  en  el  tablero  de  mandos  del  automóvil  que  indica,    por  ejemplo,  que  hay  poco  combustible  en  el  depósito.  To-    dos  sabemos  que  el  problema  no  es  la  luz  roja,  sino  que  esa    13 \n                    luz  es  un  aliado  extraordinario  que  nos  informa  de  que  hay    poco  combustible  y  necesitamos  resolver  ese  problema.  Por    lo  tanto,  si  hemos  aprendido  a  aprovechar  esa  señal ,  cuando    la  luz  roja  se  enciende,  agradecemos  la  información  que    nos  brinda  y  tratamos  de  resolver  la  situación  que  nos  mues-    tra:  detenemos  el  coche  en  la  primera  gasolinera  y  reposta-    mos.  Aprovechamos  la  luz  roja;  no  la  acusamos  ni  la  des-    truimos  ni  la  convertimos  en  el  problema,  sino  que  la    utilizamos  para  resolver  el  problema .  Imaginemos  que  al-    guien  dijera  cuando  se  enciende  la  luz:  «Estoy  harto  de  esta    luz  roja  que  cada  dos  por  tres  se  enciende  y  no  me  deja  via-    jar  tranquilo!...  No  me  dejaré  amedrentar  por  ella!...»  Ob-    viamente,  nos  quedaríamos  con  el  coche  detenido  a  mitad    de  camino  por  falta  de  combustible.  Y  aunque  este  ejemplo    parezca  casi  risueño  por  lo  absurdo,  es,  sin  embargo,  lo  que    a menudo hacemos con el miedo en el nivel psicológico .   La  pregunta  que  surge  a  partir  de  esta  observación  es:    ¿por  qué  actuamos  así?  Lo  que  ocurre  es  que  se  nos  ha  ex-    plicado,  y  hemos  aprendido,  qué  particular  carencia  señala    la  luz  roja  del  tablero  de  mandos,  y  qué  hacer  para  resol-    verla.  Pero  en  el  plano  psicológico,  en  cambio,  no  sabemos    qué  hacer  con  el  miedo.  No  sabemos  qué  carencia  señala    ni  qué  hacer  para  asistirla .  Es  necesario,  pues,  realizar  un    aprendizaje  a  fin  de  aprovechar  la  emoción  de  miedo  del    mismo  modo  que  lo  hacemos  con  la  luz  roja  del  tablero  de    mandos .   A  continuación  veremos  algunas  de  las  confusiones  más    frecuentes que impiden el aprovechamiento de esta señal.     14 \n                    ¿Existe la cobardía?    La  idea  de  la  cobardía  nace  de  un  supuesto  equivocado:    que  todos  disponemos  de  los  mismos  recursos  para  enfren-    tar  los  peligros,  y  que  algunos,  a  pesar  de  contar  con  ellos,    no los enfrentan. A ésos se los llama cobardes.   Esta  denominación,  además  de  ofensiva,  es  falsa.  Como    también  lo  es  su  opuesta:  la  idea  de  valentía.  En  este  caso  no    es ofensiva sino elogiosa, pero igualmente equivocada.   Todos  los  seres  humanos  disponemos  de  diferentes  ins-    trumentos  para  enfrentarnos  a  amenazas  y  estamos  someti-    dos  a  la  misma  ley  psicológica:  si  la  amenaza  supera  a  los    recursos, surgirá el miedo .   Tarzán  —arquetipo  clásico  del  hombre  valeroso—  puede    hacer  frente  a  un  león  sin  vacilar,  sencillamente  porque  dis-    pone  de  los  instrumentos  para  hacerlo.  El  mismo  Tarzán,    ante  dos  o  diez  leones  enfurecidos,  inevitablemente  sentirá    miedo.   Puedo  disponer  de  recursos  de  un  valor  mil,  y  si  estoy  ro-    deado  continuamente  por  peligros  de  valor  cinco  mil,  viviré    continuamente  con  miedo.  Por  el  contrario,  puedo  contar    con  recursos  de  un  valor  diez,  y  si  estoy  expuesto  regular-    mente  a  peligros  de  un  valor  cinco,  prácticamente  no  cono-    ceré el miedo.   ¿Dónde  quedan  la  cobardía  o  la  valentía  ante  lo  anterior?:    se disuelven como conceptos pues cesan en su validez .   Lo  que  uno  comienza  a  ver  en  cambio  es,  simplemente,    personas  que  disponen,  o  no,  de  recursos  para  enfrentarse  a    la  amenaza  que  se  les  presenta.  También  comprende  que    si  quien  se  retiró  desarrolla  los  recursos  necesarios,  inevi-    tablemente  se  enfrentará  a  la  amenaza  de  la  cual  se  alejó.    Y  su  opuesto:  si  quien  se  enfrentó  a  ella  no  hubiera  tenido    15 \n                    los  recursos  de  que  dispuso,  habría  sentido  miedo  y  se  ha-    bría retirado.   Es  importante  alcanzar  esta  comprensión  porque  quien    es  tachado  de  cobarde,  sobre  todo  si  se  trata  de  un  niño,    queda  injustamente  estigmatizado,  la  valoración  de  sí  mis-    mo  se  ve  seriamente  dañada  y  se  perturba  en  gran  medida    su forma de relacionarse consigo mismo y con los demás.   ¡Yo no tengo miedo!    Puede  ocurrir  que  uno,  efectivamente,  no  sienta  miedo    porque  no  experimenta  situaciones  en  las  que  existe  una  des-    proporción  entre  la  amenaza  y  los  recursos.  Es  una  posibilidad    absolutamente  plausible.  Pero  también  puede  ocurrir  que  si    por  sentir  miedo  uno  ha  sido  rechazado,  descalificado,  tildado    de  cobarde,  etc.,  poco  a  poco  vaya  anestesiando  la  percepción    de  su  miedo.  Ya  no  lo  registra  y  frecuentemente  desemboca  en    el:  «¡No  tengo  miedo!»  Al  no  contar  con  esa  señal,  arremete    contra  el  desafío  que  tiene  delante  sin  reconocer  qué  recursos    son  necesarios  para  hacerlo.  Quien  así  actúa  es  quien  mejor    conoce  el  resultado  final  más  frecuente:  acabar  estrellado    contra los desafíos, con más heridas que logros.   Anestesiar  el  miedo  es  como  cubrir  la  luz  roja  del  tablero    de mandos, para que no se vea...   ¡Yo podía... y creía que no podía!    «Durante  mucho  tiempo  tenía  miedo  de  cantar  en  públi-    co  porque  pensaba  que  no  podía,  hasta  que  lo  hice  y  me  di    cuenta que tenía los recursos para hacerlo.»     16 \n                    Este  ejemplo  muestra  que  no  basta  con  tener  los  recur-    sos, sino que además es necesario saber  que uno los tiene.   Debajo  de  mi  casa  puede  existir  un  enorme  pozo  de  pe-    tróleo, pero si no sé que está, es como si no estuviera.   El  reconocer  que  uno  cuenta  con  los  recursos  forma  par-    te de los recursos necesarios .   ¿Hay miedos injustificados?    A  menudo  oímos  decir:  «Este  miedo  es  injustificado.»    Y  lo  primero  que  es  necesario  afirmar  es  que  no  hay  miedo    injustificado .  Puede  ocurrir  que  sea  un  miedo  cuyas  razones    desconozcamos,  pero  no  por  eso  es  injustificado.  Es  como  si    alguien  le  tuviera  miedo  a  las  cucarachas  y  le  dijéramos:  «Tu    miedo  es  injustificado  porque  a  mí  una  cucaracha  no  me    asusta»,  o  «Una  cucaracha  no  puede  hacerte  nada...».  Si  a    nosotros  no  nos  asustan  es  porque  contamos  con  los  recur-    sos  adecuados  para  enfrentar  esa  experiencia,  pero  eso  no    significa  que  el  otro  necesariamente  deba  tenerlos.  Puede    parecer  absurdo  sentir  miedo  a  una  cucaracha,  pero  cuando    se  explora  con  mayor  detenimiento  ese  miedo,  se  observa    que  la  persona  que  lo  padece,  lo  que  frecuentemente  regis-    tra  al  ver  una  cucaracha  es  la  manera  que  ésta  tiene  de  huir    y  esconderse...  con  ese  ritmo  y  esa  velocidad  que  su  misma    desesperación  le  imprime.  Esa  imagen  suele  evocarle  su    propio  aspecto  temeroso  y  su  manera  desesperada  de  huir    del  mundo  porque  se  siente  indefenso.  Y  lo  que  en  realidad    le  da  miedo  es  percibir  a  su  aspecto  temeroso,  porque  no    sabe  qué  hacer  con  él.  La  cucaracha  es  un  símbolo  que  le    recuerda  ese  aspecto .  Entonces,  el  problema  no  reside  en  lo    que  la  cucaracha  es,  sino  en  lo  que  le  recuerda .  Éste  es,  por    17 \n                    otra  parte,  el  mecanismo  que  subyace  a  todas  las  fobias,  y    asimismo  lo  que  explica  la  intensidad  del  miedo  y  su  apa-    rente despropósito.   Volviendo  al  ejemplo  anterior,  cuando  la  persona  apren-    dió  a  asistir  y  fortalecer  su  «aspecto  cucaracha»,  éste  deja  de    resonar con la cualidad de ese insecto y su miedo cesa.   Algo  similar  ocurre  con  los  otros  miedos  aparentemente    injustificados.  Por  esta  razón,  cuando  digo  que  tal  o  cual    miedo  es  injustificado,  en  realidad  estoy  estrechando  el    Universo al tamaño de mi universo.   Para hacer las cosas no debo escuchar al   miedo, porque si lo escucho no haría nada...    De  ahí  surgen  los  repetidos  consejos:   «¡No  le  des  impor-    tancia  a  ese  miedo!;  ¡Olvídate  del  miedo...!;  ¡El  miedo  es    mal consejero!»,  etc.   Tales  recomendaciones  se  apoyan  en  la  creencia  de  que    el  aspecto  miedoso  «nunca  haría  nada»,  que  es  así  por  natu-    raleza y que no va a cambiar .   Se  trata  de  una  creencia  completamente  errónea  que    hace  mucho  daño  al  aspecto  temeroso.  Por  lo  tanto,  deja  sus    secuelas  perturbadoras:  podemos  «hacer  que  no  lo  escu-    chamos»,  pero  él  sigue  ahí,  cada  vez  más  descalificado  y    asustado  porque  le  sucede  lo  peor  que  puede  ocurrirle  al  as-    pecto  miedoso:  no  ser  escuchado .  Al  no  escucharlo  se  pone    en  marcha  un  círculo  vicioso:  cada  vez  pronostica  situacio-    nes  más  catastróficas,  pero  lo  hace,  en  el  fondo,  para  ser    oído;  y  eso  mismo  es  lo  que  hace  que  lo  escuche  menos  y    pierda  credibilidad  como  consecuencia  de  sus  propias  exa-    geraciones.     18 \n                    Cuando  este  círculo  vicioso  se  instala  quedan  sentadas    las  bases  para  que  el  miedo  se  haga  crónico  y  se  agrave  pro-    gresivamente.   Mientras  nos  hallamos  en  ese  contexto  funcionamos  en    lucha  con  nosotros  mismos,  cargando  sobre  los  hombros    nuestro  propio  aspecto  temeroso,  declarándolo  un  inútil,  un    fardo  pesado  y  tratando  de  mantenerlo  «dormido»  para  que    moleste  lo  menos  posible.  En  las  pequeñas  tareas  de  la  vida    cotidiana  se  puede,  con  algunas  limitaciones,  funcionar  así,    pero  cuando  nos  enfrentamos  a  situaciones  de  mayor  enver-    gadura  que  requieren  nuestra  completa  participación  para    encararlas,  es  cuando  se  nota  más  nuestra  división  y  nuestra    lucha  interior.  La  voz  no  escuchada  del  aspecto  temeroso    adquiere  más  peso,  sentimos  el  miedo  con  mayor  intensidad    y  ya  no  podemos  anestesiarlo.  Es  entonces  cuando  se  pro-    duce  la  retracción.  Esto  confirma  nuestra  creencia  de  que    cuando  escuchamos  la  voz  del  aspecto  temeroso  no  hace-    mos nada y el círculo vicioso crece.   Actualmente  se  producen,  cada  vez  con  mayor  frecuen-    cia,  ataques  de  pánico ,  de  modo  que  vale  la  pena  recordar    que  ese  cuadro  intenso  y  dramático  es  el  resultado  de  este    tipo  de  círculo  vicioso  que  amplifica  y  agrava  el  miedo  has-    ta la vivencia de catástrofe y desorganización.   El  miedo  psicológico  comienza  siendo  pequeño .  Cuan-    do  uno  no  ha  aprendido  a  escucharlo  y  asistirlo,  trata  de  su-    primirlo  como  sea.  En  ese  marco  es  donde  el  miedo  crece  y    se  transforma,  o  bien  en  el  ataque  de  pánico  que  acabamos    de  mencionar  o  bien  en  el  miedo  encapsulado  alrededor  de    un tema, que es lo que llamamos fobia .     19 \n                    Como  dice  el  refrán:   «El  miedo  no  es  tonto.»   Está  detectan-    do  una  desproporción  entre  la  magnitud  de  la  amenaza  y    los recursos con que contamos.   El  aspecto  miedoso  se  calma  cuando  es  escuchado  con    respeto ,  y  cuando  siente  que  lo  que  dice  es  genuinamente    tenido  en  cuenta.  No  es  cierto  que  el  aspecto  miedoso  sea    así  por  naturaleza .  Puede  estar  funcionando  así  desde  hace    mucho  tiempo  y  creer  que  no  hay  otras  posibilidades,  lo    cual  es  muy  posible  y  también  muy  frecuente.  Es  entonces    cuando  parece  que  ya  se  ha  instalado  en  esa  modalidad  te-    merosa  como  su  forma  habitual  de  ser,  como  su  identidad    misma.  Pero  todo  eso  es  superficial.  Cuando  se  ingresa  más    hondo  en  él  se  comprueba  inequívocamente  que  el  aspecto    miedoso  no  quiere  vivir  con  miedo .  Profundamente,  lo  que    más  quiere  es  que  se  lo  ayude  a  desarrollar  sus  capacidades    potenciales,  y  cuánto  más  lo  logra  y  más  puede,  más  expan-    de los desafíos que desea.   Si  escuchamos  lo  que  dice,  tomamos  en  cuenta  en  qué    estado  se  encuentra  y  de  qué  modo  podemos  ayudarlo  a    equilibrar  la  relación  recursos-amenaza,  transformamos  un    lastre  desahuciado  en  un  colaborador  activo  y  vital.  Nos  in-    tegramos,  nos  unificamos.  Restablecemos  la  sociedad  inte-    rior  en  la  que  existe  colaboración.  Pasamos  del  «para  hacer    necesito  no  escuchar»  al  «porque  escuché  todas  las  voces  y    asistí  a  quien  lo  necesitaba  es  que  mi  acción  fue  diseñada  a    la  medida  de  mis  posibilidades  reales  y,  por  lo  tanto,  actué    cada vez con más tranquilidad y confianza».     20 \n                    Qué es curar el miedo    Para  saber  qué  significa  curar  el  miedo   hay  que  introdu-    cir dos nociones: miedo funcional  y miedo disfuncional .   El  miedo  disfuncional   es  aquel  que  angustia,  inhibe,  de-    sorganiza  y  bloquea  la  posibilidad  de  experiencia  y  apren-    dizaje.   Por  el  contrario,  el  miedo  funcional   es  aquel  cuya  angus-    tia  es  utilizada  como  señal  que  muestra  una  desproporción    entre  el  peligro  a  que  nos  enfrentamos  y  los  recursos  de  que    disponemos,  y  que  además  pone  en  marcha  la  tarea  de  ree-    quilibrar tal desproporción .   Curar  el  miedo,  entonces,  es  transformar  el  miedo  disfun-    cional en miedo funcional.   Anteriormente  se  describieron  los  tres  momentos  del    miedo:    a)    contacto  con  la  amenaza;   b)    respuesta  de  miedo;    c)  reacción interior hacia el miedo experimentado.   Como  se  puede  observar  ahora,  la  funcionalidad  o  no  del    miedo  depende  de  cómo  se  lleve  a  cabo  la  fase   c)    de  esta  se-    cuencia,  es  decir,  de  las  respuestas  interiores  que  cada  uno    produzca en relación en el miedo que siente . Si se trata de res-   puestas  inadecuadas,  como  en  el  ejemplo  de  Miguel,  se  pone    en  marcha  el  círculo  vicioso  que  agrava  el  miedo:  el  aspecto    temeroso  se  siente  más  amenazado,  por  lo  que  se  intensifica    su  miedo,  lo  cual  a  su  vez  refuerza  las  reacciones  interiores    habituales inadecuadas, lo que agrava aún más el miedo, etc.   Puede  resultar  extraño  atribuirle  tanta  importancia  a  las    reacciones  interiores  en  relación  con  el  miedo,  y  tal  vez  sea    necesaria  una  explicación  más  detallada.  Para  ello  apelare-    mos  a  un  símil  del  universo  interpersonal  con  el  que  esta-    mos más familiarizados.   Un  niño  está  rindiendo  un  examen  y  sabe  que  si  no    21 \n                    aprueba  sus  padres  lo  castigarán,  como  otras  veces,  y  le  di-    rán:  «¡Eres  un  vago,  un  incapaz.  ¿Dónde  tienes  la  cabeza?    Sólo  sabes  jugar  y  romper  cosas.  Por  un  mes  no  tendrás  más    paga!»  Ese  niño  tiene  dos  problemas:  el  examen  y  el  castigo    de  sus  padres  si  le  va  mal.  En  realidad  el  castigo  de  sus  pa-    dres  es  el  que  convierte  al  examen  en  un  problema  que  cau-    sa  temor.  Por  supuesto,  en  ese  contexto  psicológico  sólo    pondrá de manifiesto una parte mínima de su capacidad.   Pensemos  ahora  en  otro  niño  que  conoce  la  asignatura    más  o  menos  como  el  anterior  y  sabe  que  si  no  aprueba  sus    padres  le  dirán:  «Bueno,  qué  pena;  ¿por  qué  no  nos  cuentas    qué  te  pasó?  Así  tal  vez  podamos  descubrir  algo  que  te  sirva    para  una  próxima  vez,  y  esto  que  ahora  es  doloroso  quizá  se    convierta en una experiencia útil para ti y para nosotros...»   Lo  más  probable  es  que  este  niño  se  enfrente  al  examen    con  más  tranquilidad  y  por  lo  tanto  su  rendimiento  sea  mu-    cho mejor.   El  examen  es  el  mismo.  La  única  diferencia  es  el  trato    ante  un  probable  resultado  negativo.  Uno  da  tranquilidad,    el otro aterroriza.   Esto  es  lo  que  le  sucede  a  un  niño  en  función  del  modo    en  que  es  tratado  por  sus  padres.  Luego,  cuando  ya  es  joven    o  adulto,  esa  clase  de  diálogo  se  produce  dentro  de  sí  mis-    mo  :  ya  existe  en  él  un  evaluador  interior  que  reacciona  ante    todo  lo  que  siente  y  hace .  Ese  evaluador  puede  producir  di-    ferentes  tipos  de  reacciones,  desde  las  más  inadecuadas  y    nocivas  hasta  las  más  sabias  y  curativas.  En  última  instancia    podemos  decir  que  en  la  relación  evaluador-evaluado  se    forja  buena  parte  del  destino  psicológico  de  una  persona .   Puede  ser  tanto  la  fragua  curativa  en  la  que  se  van  resolvien-    do  los  problemas  del  diario  vivir,  como  una  verdadera  fábri-    ca de sufrimiento y enfermedad.     22 \n                    Ésta  es  la  razón  por  la  cual  se  le  atribuye  tanta  importan-    cia  al  papel  de  evaluador  interno,  que  es  quien  lleva  a  cabo    la fase  c)  de la secuencia que antes describimos.   Anteriormente  mencionamos  también,  con  el  ejemplo  de    Miguel,  que  es  un  tipo  de  respuesta  inadecuado.  Veamos    ahora  con  más  detalle  en  qué  consiste  una  reacción  adecua-    da:  en  general  es  aquella  que  escucha  y  respeta  al  aspecto    temeroso,  que  reconoce  que  en  su  reacción  está  poniendo    de  manifiesto  un  desequilibrio  entre  la  amenaza  que  enfren-    ta  y  los  recursos  con  que  cuenta  y  que  sabe  que  si  brinda  al    aspecto  temeroso  un  trato  propicio  crecerá  y  se  fortalecerá    hasta alcanzar la plenitud de sus posibilidades.   En  varias  partes  de  este  capítulo  hemos  hablado  de  escu-    char  y  respetar  al  aspecto  temeroso.  Vale  la  pena  destinar    unos  párrafos  para  aclarar  en  qué  consiste  esa  actitud  cuan-    do  está  dirigida  a  algo  que  se  rechaza,  como  en  este  caso  es    el aspecto temeroso.   Escucharlo  y  respetarlo  no  significa  consentir  en  todo  lo    que el aspecto temeroso diga o haga.   Escucharlo  quiere  decir  reconocer  que  existe  y  tratar  de    conocerlo  lo  mejor  posible,  más  allá  de  que  nos  guste  o  no    lo que percibimos.   Respetarlo  significa  reconocerle  el  derecho  a  estar  como    está.  Saber  que,  dado  el  entorno  psicológico  en  que  existe  y    los  recursos  con  que  cuenta,  la  respuesta  que  está  produ-    ciendo  el  aspecto  miedoso  es  su  mejor  respuesta  posible,  in-    dependientemente  de  cuánto  nos  agrade.  Saber  también    que  tenemos  el  derecho  de  expresarle  todos  nuestros  desa-    cuerdos  pero  sin  imposiciones .  Si  queremos  que  modifique    algo  de  sí,  todo  cuanto  podemos  hacer  es  proponérselo,  ex-    plicarle  por  qué  se  lo  proponemos  y  disponernos  a  escuchar    su  respuesta,  admitiendo  que  es  el  juez  último  que  evaluará    23 \n                    qué  es  lo  más  adecuado  para  él  en  ese  momento.  Sabiendo    asimismo  que  tanto  el  aspecto  temeroso  como  nosotros  (en    este  caso  su  evaluador  interno)  podemos  equivocarnos  mu-    chas  veces,  pero  que  si  mantenemos  ambas  partes  la  actitud    de  una  «sociedad  de  aprendices»,  crearemos  las  condicio-    nes  más  favorables  para  producir  acciones  consensuadas,    en  las  que  cada  uno  se  sentirá  representado,  y  que  serán    también, cada vez más resolutivas y satisfactorias.   Por  supuesto  que  esta  actitud  implica  un  cambio  mental    muy  importante:  de  percibirlo  como  un  pesado  lastre,  pura    negatividad,  al  cual  es  mejor  no  escuchar  porque  todo  lo    que  venga  de  él  complicará  las  cosas  más  y  más,  a  conce-    birlo  como  la  fuente  de  donde  provendrá  buena  parte  de  la    información  necesaria  para  producir  la  solución  anhelada,    momento a momento.   Se  trata  de  un  cambio  radical  en  la  manera  de  evaluar  al    aspecto  temeroso.  Y  ese  mismo  cambio  es  el  que  comienza    a  crear  nuevas  condiciones  para  que  él  también  transforme    su  propia  evaluación  de  sí.  Veamos  cómo  ocurre  este  proce-    so en la práctica a través de la experiencia de Miguel.   Una  vez  que  el  aspecto  temeroso  descubrió  cómo  se  sen-    tía  al  escuchar  a  su  evaluador  interno,  le  propuse  lo  siguien-    te:  «Ya  que  lo  que  te  dijo  te  asusta  todavía  más,  ¿qué  necesi-    tarías recibir para sentirte genuinamente ayudado por él?»   Y  el  aspecto  temeroso  respondió,  habiéndole  a  su  eva-    luador  interno:  «Necesito  que  no  me  fuerces,  que  te  sientes    a  mi  lado,  que  no  me  grites  porque  tengo  miedo,  que  me    acompañes,  que  me  preguntes  si  estoy  en  condiciones  de    ocupar  el  primer  lugar,  y,  si  puedo  avanzar  una  sola  fila,  que    me  acompañes  en  esa  fila,  y  si  necesito  retroceder  que  me    acompañes  también  sin  retarme  ni  humillarme,  y  que  no  de-    cidas por mí sin consultarme...»     24 \n                    En  este  caso,  cuando  volvió  a  tomar  el  lugar  del  evalua-    dor  interno,  dijo,  conmovido:  «Así  que  esto  era  lo  que  nece-    sitabas  de  mí!...  Hace  veinte  años  que  te  vengo  padeciendo    y  no  sabía  que  lo  que  te  hacía  te  ponía  peor...!  Discúlpame,    por  favor  [comienza  a  sollozar].  Si  eso  es  lo  que  te  ocurre  y    lo que necesitas, por supuesto que voy a dártelo...»   Y eso es lo que hizo en el transcurso de la sesión.   Esto  puede  parecer  una  simplificación  excesiva  o  un  idi-    lio  ilusorio,  pero  el  hecho  es  que  al  escuchar  de  verdad  al    aspecto  temeroso  Miguel  pudo  conocerlo  mejor,  es  decir,    saber  que  había  formas  de  tratarlo  que  le  hacían  bien  y  otras    que  le  hacían  mal.  Pudo  reconocer  asimismo  que  dicho  as-    pecto  no  era  un  enemigo  que  estaba  ahí  para  buscarle  la  ruina    sino  que  era  un  aliado,  alguien  que  también  quería  crecer,    pero  que  para  poder  lograrlo  necesitaba  un  trato  adecuado  y    específico,  que  a  su  vez  él  podía  brindarle.  Ese  conjunto    de  factores  contribuyó  a  que  se  activara  una  nueva  actitud  de    confianza  y  respeto  y  la  disposición  a  brindarle  efectiva-    mente lo que él necesitaba y le pedía.   La  evidencia  clínica  fue,  además,  contundente:  ese  te-    mor torturador y crónico disminuyó hasta su cesación.   Cuando  se  describen  los  diálogos  interiores  que  una  per-    sona  realiza  en  una  sesión  resulta  necesario  aclarar  que  una    cosa  son  las  palabras  escritas  (generalmente  simples  y  casi    obvias)  y  otra,  abismalmente  distinta,  el  estado  emocional    profundo  desde  donde  tales  palabras  se  pronuncian.  En  últi-    ma  instancia,  lo  que  produce  un  cambio  interior  y  cura  un    padecimiento  es  acceder  a  dichos  estados,  vivirlos  y  realizar    el  aprendizaje  que  los  transforma.  Lo  que  aquí  se  incluye  es    un  lejano  eco  de  lo  que  ocurrió,  que  intenta  dar  una  idea  de    lo  sucedido,  pero  que  de  ninguna  manera  lo  describe  en  su    totalidad.  Hecha  esta  salvedad,  y  volviendo  al  trabajo  de    25 \n                    Miguel,  es  necesario  destacar  que  no  siempre  el  evaluador    interno  produce  una  transformación  tan  rápida,  intensa  y    profunda.  Para  el  lector  interesado,  en  mi  libro   El  asistente    interior(1)    presento  una  descripción  de  todas  las  alternativas    de  ese  aprendizaje.  Aquí  sólo  lo  incluyo  a  título  de  ejemplo    para  ilustrar  cómo  es  el  proceso  de  resolución  del  círculo  vi-    cioso que subyace al miedo disfuncional crónico.   1. Ed. Nuevo Extremo, 2.a edic.   INDAGACIÓN PERSONAL    Si  usted  siente  un  miedo  disfuncional,  que  lo  angustia  y  pa-    raliza, le sugiero lo siguiente:   a)  Identifique  con  claridad  y  precisión  qué  lo  asusta  (la  so-    ledad, la exclusión, el rechazo, el abandono, la burla, etc.).    b)  Observe  cómo  es  el  aspecto  suyo  que  siente  ese  miedo,    es  decir,  cómo  es  su  aspecto  temeroso.  Si  puede  dibujar,  sobre    un  papel  o  mentalmente,  la  figura  humana  que  mejor  lo  refle-    je,  eso  lo  ayudará  a  percibir  mejor  las  características  de  su  as-    pecto miedoso.    c)  Imagine  que  ese  aspecto  está  delante  de  usted  y  observe    qué  reacción  emocional  tiene  al  verlo  y  qué  opina  de  él.  Y  dí-    gaselo  como  si  iniciara  un  diálogo.  Al  hacerlo  estará  encarnan-    do el papel del evaluador interno del aspecto miedoso.    d)  Una  vez  que  se  ha  expresado  desde  ese  papel,  imagine    que  puede  ponerse,  por  un  instante,  en  la  piel  del  aspecto  te-    meroso  y  vea  cómo  se  siente  al  escuchar  lo  que  el  evaluador    interno le ha dicho.      26 \n                    e)  Fíjese,  además,  qué  es  lo  que  necesitaría  recibir,  en  pala-    bras  y  en  acciones,  de  parte  de  su  evaluador,  para  sentirse  ge-    nuinamente ayudado a  crecer y  fortalecerse.   f)  Continúe  este  diálogo  interior  todo  el  tiempo  que  necesi-    te  hasta  que  ambos  personajes  recuperen  el  vínculo  de  coope-    ración  eficaz  que  les  corresponde  por  ser  miembros  del  mismo    equipo.   g)  Recuerde  que  usted  está  constituido  por  los  dos.  Trate  de    familiarizarse  con  ellos  a  fin  de  reconocerlos  en  su  vida  diaria,    cada  vez  con  más  facilidad  y  rapidez,  en  qué  momento  está    actuando  desde  su  aspecto  temeroso,  cuándo  lo  hace  desde  el    evaluador  interno,  y  cómo  es,  momento  a  momento,  la  rela-    ción entre ambos.   Cuanto  más  solidaria  y  cooperativa  se  hace  esa  relación,    más se disuelve el miedo disfuncional .   Aunque  en  una  situación  evalúen  que  la  amenaza  los  des-    borda y decidan retirarse, esa retracción deja de ser conflictiva.   Si  uno  no  comprende  el  miedo  y  es  impaciente,  suele  creer    que  la  retracción  siempre  significa  fracaso.  Sin  embargo,  cuan-    do  la  retirada  surge  de  un  acuerdo  interior,  no  la  experimenta-    mos  como  fracaso  sino  como  parte  del  derecho  que  nos  asiste    a  elegir  las  condiciones  más  propicias  para  nuestro  desempe-    ño .  El  I  Ching  dice  al  respecto:  «No  es  fácil  entender  las  leyes    de  una  retirada  constructiva.  [...]  Saber  emprender  correcta-    mente la retirada no es signo de debilidad sino de fortaleza.»   En  la  medida  en  que  uno  se  ejercita  cotidianamente  en    el  arte  de  llevar  a  cabo  estas  tareas  psicológicas  interiores,  el    miedo  recupera  su  perdida  dignidad  original  y  vuelve  a  ser  la    valiosísima señal de alarma que e s.             27 \n                    D   O   S       EL ENOJO QUE RESUELVE    El enojo es, en esencia, un remanente de energía que    está destinado a aumentar nuestros recursos para    resolver el problema que nos produce enojo. Sin    embargo, al no saber cómo canalizarlo, termina    convirtiéndose en un factor que daña aún más la    situación a que nos enfrentamos. Por esta razón es    de fundamental importancia conocer de qué está    hecha esta emoción y aprender a transformar    el enojo que destruye en enojo que resuelve.        28 \n                    El  enojo  es,  sin  duda,  una  de  las  emociones  que  más  ha    preocupado  a  la  humanidad.  ¿Cómo  utilizar  adecuadamen-    te esta energía tan particular que es el enojo? De hecho, tan-   to las tradiciones religiosas como las diversas corrientes psi-   cológicas  han  propuesto  diferentes  caminos  —con  variado    éxito— para intentar resolver los vastos problemas que esta   emoción presenta.   Volvamos,  entonces,  una  vez  más  sobre  este  tema  para    explorar  nuevas  facetas  que  permitan  transformar  el  enojo    que  destruye  en  enojo  que  resuelve .  Rara  ello  haremos  un    breve repaso de sus componentes básicos:   a) ¿Qué causa el enojo?    b) ¿Cuál es su sustrato biológico?    c) ¿Cómo  influyen  en  él  nuestras   conclusiones  y  creen-    cias?    Y  luego  nos  centraremos  en  los   aportes  más  novedosos    de esta propuesta:   d)    ¿De qué modo expresamos el  enojo?    29 \n                    Y por último:      e)  ¿Qué  es  lo  que  necesitamos  aprender  para  transfor-    mar  efectivamente  el  enojo  que  destruye  en  enojo  que  re-    suelve?   La causa del enojo   Para  decirlo  de  un  modo  sencillo  y  general,  nos  enojamos    cuando  algo  nos  frustra:  estoy  conduciendo  y  se  produce  un    atasco,  me  han  prometido  algo  y  no  han  cumplido,  esperaba    algo  de  mi  mujer,  mi  marido,  mis  hijos,  o  de  mí  mismo,  y  lo    que  esperaba  no  ocurrió,  etc.  Los  motivos  son  numerosísi-    mos,  desde  los  más  leves  hasta  los  más  intensos  y  amenaza-    dores, pero siempre existe un factor común: la frustración.   Cuando  la  energía  del  deseo  que  se  encamina  hacia  su    realización  encuentra  un  obstáculo,  la  obstrucción  que  éste    produce genera una sobrecarga energética en ese deseo .   Esta sobrecarga es lo que llamamos enojo .   Es  importante  destacar  que  la  función  original  de  esa  so-    brecarga  de  energía  es  asegurar  la  realización  del  deseo  o    necesidad amenazada .   Lo  que  ocurre  es  que  al  no  saber  cómo  implementar  ade-    cuadamente  tal  sobrecarga  de  energía,  en  lugar  de  contri-    buir  a  la  resolución  del  problema  a  menudo  aquélla  se  con-    vierte en un problema más .     30 \n                    Sustrato biológico del enojo   Desde  el  punto  de  vista  químico,  ante  la  presencia  de  un    obstáculo  vivido  como  amenaza,  el  organismo  segrega    adrenalina  y  noradrenalina,  los  neurotransmisores  que  posi-    bilitan  los  comportamientos  de  alerta  y  actividad,  de  con-    frontación y lucha.   En  épocas  primitivas  de  la  humanidad,  cuando  la  amena-    za  a  la  integridad  territorial  se  dirimía  en  una  confrontación    física,  en  una  lucha  cuerpo  a  cuerpo,  esta  respuesta  adre-    nérgica  era,  sin  duda,  la  más  adecuada,  porque  en  tales  ca-    sos  se  imponía  incrementar  la  fuerza  física  para  encarar  la    batalla.  Todos  conocemos,  ya  sea  por  experiencia  personal    o  por  los  innumerables  ejemplos  de  personas  que  así  lo  tes-    timonian,  cómo  en  una  situación  de  ira  se  dispone  de  una    fuerza mucho mayor de la habitual.   El  desajuste  se  produce  cuando  seguimos  utilizando  una    respuesta  biológica  de  ira  generada  en  situaciones  antiguas    para  resolver  situaciones  actuales  que  no  requieren  tanta    respuesta adrenalínica .   En  efecto,  el  enojo  es  útil  para  aumentar  la  fuerza  física,    pero  no  es  útil  para  aumentar  la  capacidad  de  coordinación    necesaria  para  resolver  un  problema.  Imaginemos  a  un  ciru-    jano  que  encuentra  obstáculos  durante  una  operación,  se    enoja  y  mantiene  ese  estado.  Su  ira  entorpecerá,  sin  duda,    su  capacidad  de  resolver  los  problemas  a  que  deberá  en-    frentarse  durante  la  intervención  quirúrgica.  Este  ejemplo    resulta  obvio,  pero  sin  embargo  la  creencia  de  que  el  enojo    da  eficacia  está  bastante  difundida.  Un  conocido  periodista    deportivo,  cuando  retransmitía  los  partidos  de  Gabriela  Sa-    batini,  repetía  frecuentemente:  «Me  gustaría  verla  a  Gaby    más  enojada.  Así  jugaría  mejor.»  Él,  como  representante  de    31 \n                    esta  creencia,  suponía  que  enojándose  con  la  rival  Sabatini    ganaría  en  eficacia.  Y  en  realidad  se  trata  de  lo  contrario:  ¡a    coordinación  y  la  precisión  necesarias  para  un  buen  desem-    peño  en  cualquier  tarea  compleja  encuentran  su  mejor  cal-    do de cultivo en la relajación y la calma .   Influencia de las conclusiones y las creencias   en la producción de enojo   Cuando  la  sobrecarga  energética  del  deseo  se  expresa    como  enojo,  puede  albergar  diferentes  calidades,  más  o  me-    nos  destructivas.  Esto  dependerá,  en  parte,  de  las  conclusio-    nes  que  nuestra  mente  produzca  en  relación  a  la  naturaleza    del  obstáculo .  Si  evaluamos  que  el  obstáculo  está  actuando    «a  propósito»  contra  nosotros,  es  muy  probable  que  nuestra    frustración  se  convierta  en  enojo  destructivo.  Por  lo  tanto,    trataremos  de  hacerle  a  ese  obstáculo  lo  que  imaginamos    que  él  quiere  hacernos  a  nosotros.  Esa  voluntad  de  destruc-    ción recíproca es la esencia de la batalla .   Si  llegamos  a  la  conclusión  que  ese  obstáculo  no  respon-    de  a  ninguna  voluntad  específica  de  perjudicarnos  sino  que,    como  la  lluvia  en  el  día  que  deseamos  ir  a  la  playa,  es  algo    que  ocurre  pero  que  no  se  opone  deliberadamente  a  nues-    tro  deseo,  entonces  nuestra  frustración  seguirá  existiendo,    pero  es  más  difícil  que  evolucione  hacia  el  tipo  de  enojo    destructivo.   Si  le  pedimos  dinero  prestado  a  un  amigo  y  él  nos  dice    que  no,  porque  no  dispone  de  esa  suma,  y  le  creemos,  nues-    tra  frustración  será  frustración,  y  tal  vez  pena,  pero  no  se    hará  enojo  hacia  él.  Si  en  cambio  creemos  que  nos  miente,    que,  tiene  dinero  de  sobra  pero  que   no    nos  lo  quiere  prestar,    32 \n                    entonces  la  frustración  tiene  las  puertas  abiertas  hacia  el    enojo.   Ante  cada  frustración  producimos,  consciente  e  incons-    cientemente,  conclusiones  acerca  de  la  causa  que  la  genera    y  rápidamente  evaluamos  si  existe  una  intención  adversa  o    no.    En  el  marco  de  una  guerra,  de  una  batalla,  de  una  lucha,    todo  obstáculo  es,  efectivamente,  el  resultado  de  una  inten-    ción  adversa .  Precisamente  la  del  rival  de  turno  que  nos    quiere vencer.   El  problema  se  produce  cuando  la  reacción  que  es  ade-    cuada  para  una  batalla  la  extendemos  al  resto  de  las  situa-    ciones  en  las  que  debemos  enfrentarnos  a  un  impedimento    que nos frustra.   Muchas  personas,  efectivamente,  tienen  la  tendencia  psi-    cológica  a  imaginar  que  sus  frustraciones,  de  la  índole  que    sean,  se  deben  a  la  influencia  de  una  voluntad  adversa,  bien    de  una  persona,  o  bien  del  destino  mismo,  que  se  opone  a    sus  propósitos.  Dichas  personas  están  muy  expuestas  a  vivir    crónicamente enojadas y resentidas.   Además  de  las  tendencias  psicológicas  individuales,    existe  otro  factor,  de  naturaleza  filosófica  existencial,  que    consiste  en  la  concepción  —consciente  o  inconsciente—    que  cada  uno  tenga  acerca  del  sentido  último  de  su  vida  y    de  la  vida  misma.  Si  yo  creo  que  la  vida  es,  en  esencia,  una    eterna  batalla   en  la  que  quien  gana  sobrevive  y  triunfa,  y    quien  pierde  es  extinguido,  mi  objetivo  último  será  ganar,    y  viviré  en  esa  atmósfera  emocional  de  guerra  continua.    Desde  esa  perspectiva  mental  cada  obstáculo  que  me  frustre    quedará  fácilmente  convertido  en  una  manifestación  más    de  esa  batalla  y  se  activará,  por  lo  tanto,  la  respuesta  de  eno-    jo que se orienta a identificar al adversario y vencerlo.     33 \n                    Cuando  esta  actitud  se  hace  habitual  termina  por  convertir-    se  en  una  forma  de  organizar  la  experiencia.  Alguien  que  vi-    vía  de  acuerdo  con  este  modelo  me  comentaba  que  al  ini-    ciar  cualquier  relación  con  otras  personas,  lo  primero  que    se  preguntaba  era:  «  ¿Quién  es  mi  enemigo  aquí?  »  Por  su-    puesto  que  tal  actitud  desembocaba  en  la  activación  del    componente  de  pelea  en  cada  uno,  y  el  marco  imaginario    de  la  batalla  que  esta  persona  tenía  se  iba  haciendo  reali-    dad,  lo  cual  reforzaba  su  teoría  inicial  y  consolidaba  el  cir-    cuito de combate permanente.   Si  la  representación  existencial  que  predomina  es  aque-    lla  que  afirma  que  si  bien  la  batalla  existe,  ella  no  es  el  rasgo    esencial  de  la  vida ,  que  lo  esencial,  en  cambio,  es  el  apren-    dizaje  que  nuestra  conciencia  realiza  en  la  solución  de  los    problemas  que  implica  el  vivir  como  individualidades  sepa-    radas,  entonces  cada  frustración  es  vivida  de  manera  distin-    ta:  los  obstáculos  en  curso  tienden  a  ser  evaluados  como    problemas,  como  incógnitas  a  resolver,  que  efectivamente    frustran  y  demoran  los  logros  deseados,  pero  no  generan  re-    flejos inmediatos de enojo bélico-destructivo .   Si  le  pusiéramos  palabras  a  esta  actitud,  en  lugar  de    «  ¿Quién  es  mi  enemigo  aquí?  »,  la  pregunta  primaria  es:    «¿Cuál es el problema que a todos nos beneficiaría resolver?»   En  este  período  en  el  que  los  valores  y  las  modalidades    de  la  cultura  competitiva   están  tan  expandidos,  y  donde    todo  parece  ser  motivo  de  competencia,  estamos  muy  ex-    puestos  a  interpretar  cada  obstáculo  que  surge  en  el  cur-    so  de  una  relación  como  la  manifestación  de  la  voluntad    adversa  del  rival  de  turno.  Este  rival  puede  ser  mi  mujer,    mi  marido,  mi  vecino,  el  portero  del  edificio  en  que  vivo,  mi    compañero  de  trabajo,  etc.,  que  imagino  que  quiere  opo-    nerse  a  mi  propósito  y  vencerme.  No  es  de  extrañar  enton-    34 \n                    ces  que  el  clima  emocional  de  una  incesante  batalla  sea  el    que  fatigue  nuestros  días  y  deje  exánime  a  nuestra  posibili-    dad de cooperación, entusiasmo y alegría.   Cuánto nos enojamos y como nos enojamos   Por  todo  lo  enunciado  anteriormente  queda  claro  que  el    enojo  puede  ocupar  un  lugar  mayor  o  menor  en  la  vida  de    cada  uno.  Que  podemos  enojarnos  más  o  menos  fácilmente    y  que  esta  variable  es  importante  y  merece  ser  observada.    Pero  junto  con  esta  característica  existe  otro  factor,  de  tanta    o  mayor  importancia  aún  que  ésta,  y  es  la  manera  en  que    reaccionamos  cuando  nos  enojamos,  es  decir,  si  nuestro    enojo tiende a destruir o a resolver .   No  sólo  es  importante  entonces  el  cuánto   nos  enojamos,    sino,  y  muy  especialmente,  el  cómo   nos  enojamos  cuando    lo hacemos. Y esto es lo que veremos a continuación.   Los diferentes modos de expresar el enojo   Solemos  creer  que  la  expresión  del  enojo  es  una  conduc-    ta  homogénea,  que  no  tiene  componentes  constitutivos    diferenciales .  Algo  así  como:  «Cuando  uno  se  enoja,  se    enoja  y  todos  los  enojos  son  más  o  menos  parecidos.»    Sin  embargo,  si  miramos  con  mayor  detenimiento  la  reac-    ción  de  enojo,  como  si  ubicáramos  sobre  ella  una  lente  de    aumento  para  verla  con  más  detalle,  encontraremos  cua-    tro  componentes  diferenciables   que  vale  la  pena  discri-    minar:     35 \n                    Primer componente: la descarga.  Veámoslo a través de   un  ejemplo  sencillo:  me  cito  con  un  amigo  y  éste  llega  con    una  hora  de  retraso.  Mi  deseo  de  encontrarme  con  él  a  la    hora  convenida,  que  se  frustra,  acumula  un  excedente  de    energía,  y  ese  excedente  necesita  descargarse.  Observamos    entonces  todas  las  reacciones  propias  de  esa  necesidad:    puedo  moverme,  resoplar,  gritar,  dar  un  golpe  sobre  la    mesa,  soltar  una  patada,  etc.  El  propósito  de  esta  clase  de    reacción  es  descargar  al  sistema  de  la  sobrecarga  a  la  que    está sometido.   La  función  de  la  descarga  es  equivalente  a  abrir  la  válvu-    la  de  escape  en  una  olla  a  presión.  En  efecto,  la  frustración    produce  en  la  sangre  un  intenso  y  brusco  aumento  de  adre-    nalina  que  pone  al  organismo  en  estado  de  alerta,  tenso  y    listo  para  el  combate.  Éste  es  el  componente  químico  del    enojo,  y  debe  ser  tenido  en  cuenta  en  su  especificidad  a  fin    de  poder  asistirlo  y  resolverlo.  La  descarga  de  la  tensión  per-    mite  que  el  sistema  vuelva  a  recuperar  el  estado  más  ade-    cuado  para  su  funcionamiento.  Esta  fase  es  muy  importante    y  permite  encarar  en  mejores  condiciones  las  otras  etapas    del enojo .   No  todas  las  personas  contamos  con  los  canales  disponi-    bles  para  descargar  la  intensidad  que  existe  en  la  ira.  La  tra-    dición  cultural  que  propició  la  supresión  del  enojo  terminó    suprimiendo  sus  canales  de  expresión.  Si  le  pusiéramos  pa-    labras  a  tal  actitud,  serían:  «Expresar  el  enojo  está  mal,  no  es    correcto y es, además, señal de debilidad.»   Esta  actitud  represiva  agrava  el  problema,  porque  la  falta    de  experiencia  en  la  expresión  del  enojo  hace  que  uno  no    cuente  con  la  capacidad  de  graduarla  en  su  justa  medida,    pues  esto  se  alcanza  a  través  de  la  ejercitación  repetida.  Por    lo  tanto,  uno  vive  frecuentemente  la  ira  en  términos  de    36 \n                    «todo  o  nada»   («O  me  callo  o  pierdo  el  control  sobre  mí    mismo»).   Es  interesante  tomar  como  ejemplo  de  esto  lo  que  ocurre    con  los  lobos  y  los  pájaros.  El  que  los  lobos  sean  animales    muy  combativos  permitió  que  a  lo  largo  del  tiempo  pudie-    ran  ritual  izar  la  descarga  y  el  castigo,  y  lograran  rescatar  lo    esencial  del  combate  entre  ellos,  que  es  dirimir  quién  va  a    quedarse  con  el  territorio.  Por  esta  razón,  cuando  en  el    transcurso  de  una  pelea,  el  que  está  perdiendo  ofrece  su    cuello  al  rival,  se  genera  en  el  vencedor  un  reflejo  que  lo    aparta  de  su  contendiente,  le  hace  buscar  el  lugar  más  alto    de  la  región  y  se  instala  allí.  Mientras  hace  eso,  el  otro  se    marcha.  Han  resuelto  el  problema  de  la  distribución  del  te-    rritorio  con  el  menor  daño  posible  de  los  antagonistas.  Éste    es un claro ejemplo de enojo que resuelve.   Los  pájaros,  que  no  tienen  la  experiencia  habitual  de  lu-    cha  porque  apelan  al  vuelo  como  respuesta  al  peligro,  no    cuentan  con  el  recurso  del  enojo  ritualizado  y  calibrado.    Por  lo  tanto,  cuando  combaten  en  una  jaula,  las  luchas  sólo    terminan con la muerte de uno o ambos antagonistas.   La  graduación  de  la  reacción  es  una  conquista  evolutiva    que es, a su vez, producto de la eiercitación .   Cuando  se  ha  aprendido  a  discriminar  el  componente  de    «carga»  que  existe  en  el  enojo  y  la  consiguiente  necesidad    de  descarga,  se  llega  a  comprender  que  una  cosa  es  la  ac-     ción  de  pura  descarga  y  otra,  muy  distinta,  el  ataque  al  pró-    jimo .  La  descarga  es  una  acción  independiente  de  la  presen-    cia  física  del  otro  y  su  función  es,  como  hemos  dicho,    disminuir la tensión adrenalínica acumulada.   Algunas  personas  se  descargan  mejor  a  través  de  los  bra-    zos,  otras  a  través  de  las  piernas,  otras  prefieren  un  movi-    miento  corporal  general,  y  por  último  existe  también  quie-    37 \n                    nes  se  descargan  mejor  utilizando  la  voz.  Cada  una  de  ellas    puede  utilizar  lo  que  más  se  adecua  a  su  modalidad,  ya  sea    golpear  almohadones,  patear  un  balón,  caminar,  bailar  o    sencillamente gritar.   Estamos  habituados  a  reconocer  la  importancia  del  cuar-    to  de  baño  en  una  casa.  Está  diseñado  para  evacuar  los  resi-    duos  del  metabolismo  sin  que  ello  produzca  trastornos.  Con    el  tiempo  ¡remos  reconociendo  también  la  importancia  de    disponer  de  un  lugar,  de  una  habitación  equipada  para  faci-    litar  la  descarga  de  otro  residuo,  en  este  caso  emocional,    que  es  la  intensidad  del  enojo.  Allí  se  podrá  gritar,  golpear,    hacer  todo  lo  que  uno  necesite  para  descargarse  y  volver  así    en  mejores  condiciones  para  intentar  resolver  el  problema    que  ha  provocado  que  uno  se  enoje.  Será  «la  habitación  de    la descarga del enojo».   Otro  elemento  que  ayuda  a  la  descarga  es  el  factor  tiem-    po.  En  la  medida  en  que  el  tiempo  transcurre  y  la  adrenalina    va  disminuyendo  en  el  torrente  sanguíneo,  «las  aguas  co-    mienzan a calmarse».   De  esta  cualidad  frecuentemente  estabilizadora  del  tiem-    po  surge  el  consejo  popular:  «Cuenta  hasta  diez  antes  de    responder»,  o  la  también  habitual  y  recomendable  propues-    ta:  «Mejor  conversemos  mañana  acerca  de  esto  porque  hoy    estoy muy \"cargado\".»   La  descarga  se  convierte  en  algo  destructivo  cuando  que-    da  adherida  al  deseo  de  hacer  sufrir  y  castigar  al  otro  por  lo    que  hizo .  La  descarga  pone  la  intensidad,  el  deseo  de  casti-    gar  pone  el  propósito,  y  la  suma  de  las  dos  produce  la  com-    binación más dañina del enojo.   En  relación  con  este  componente  de  la  descarga,  vale  la    pena  resaltar  tres  observaciones  finales:   a)    la  facilidad,  rapi-    dez  e  intensidad  con  que  se  produce  la  carga  del  enojo  varía    38 \n                    mucho  de  una  persona  a  otra;  algunas  personas  se  «cargan»    rápidamente  ante  cualquier  frustración,  son  las  que  llama-    mos  personas  «coléricas»,  quienes  más  necesitan  arbitrar    las  formas  de  una  descarga  adecuada;   b)    lo  que  hace  daño    del  enojo  es  la  acción  destructiva  sobre  el  otro  o  sobre  uno    mismo,  no  la  descarga  en  sí ,  y   c)    cuando  la  descarga  no  se    realiza  adecuadamente  y  la  carga  adrenalínica  se  acumula,    se  convierte  en  tensiones  musculares  crónicas  y  en  trastor-    nos cardiovasculares.   El segundo componente es hacerle saber al otro el im-   pacto que su acción ha producido en nosotros o, lo que   es  lo  mismo,  qué  sentimos  a  causa  de  lo  que  hizo.   Si   volvemos  al  ejemplo  de  la  cita  con  mi  amigo,  le  diré:  «Estás    retrasándote  una  hora.  Me  siento  irritado,  molesto,    decepcionado,  harto  de  esperar»,  etc.  Éstas  podrían  ser  las    palabras,  pero  la    expresión  global  de  lo  que  siento  también  estará  en  mi  tono    de  voz,  en  mis  gestos,  en  mi  mirada,  etc.  Como  se  puede  ob-    servar,  en  este  caso  no  hay  ningún  enjuiciamiento,  descalifi-    cación  ni  conclusión  acerca  del  otro  ni  del  porqué  de  su    conducta.  Meramente  la  nombro  sin  enjuiciarla  y  transmito    mi reacción ante ella .   La  valiosísima  significación  instrumental  de  este  compo-    nente  de  la  expresión  del  enojo  tiene  dos  pilares:   a)    en  el    acto  de  nombrar  y  expresar  lo  que  sentimos,  realizamos  un    importante  movimiento  de  descarga ,  no  tanto  en  el  sentido    químico  que  describimos  antes,  sino  más  bien  emocional,  y    además  nos  afirmamos,  nos  fortalecemos  y  nos  integramos    al  asumir  lo  que  sentimos;  y   b)    para  que  se  produzca  una    modificación  en  la  conducta  del  otro  es  necesario  que  éste    conozca,  del  modo  más  completo  posible,  el  efecto  que  su    acción produce en nosotros.   Esta  fase  está  también  interferida  por  las  creencias  que    39 \n                    afirman  que  reconocer  el  impacto  que  nos  produce  lo  que    el  otro  hace  es  señal  de  debilidad .  El  ejemplo  que  mejor    ilustra  esta  actitud  se  presenta  cuando  alguien  dice:  «No  voy    a  darle  el  gusto  de  decirle  cómo  me  ha  afectado  lo  que  ha    hecho.»   La  inhibición  en  la  expresión  de  una  o  de  las  dos  fases    que  estamos  describiendo  contribuye  a  que  la  manifesta-    ción  del  enojo  tome  uno  de  los  canales  más  disfuncionales    de  su  espectro:  el  intento  de  suprimir  al  mínimo  la  propia    reacción  y  producir  sobre  el  otro  el  máximo  castigo .  (Volve-    remos sobre esto más adelante.)   El  tercer  componente   necesario  en  la  expresión  del  enojo    para  que  éste  cumpla  adecuadamente  su  función  resolutiva  es    la  formulación  de  una  propuesta  para  reparar  lo    reparable  en    esa  situación  y  la  construcción  de  un  proyecto  que    asegure, en  lo  posible,  que  ese  problema  no  se  repita.    Volviendo  al    ejemplo  anterior,  puedo  decirle  a  mi  amigo,  por  ejemplo:    «Mira,  ahora  no  puedo  hablar  del  tema  por  el  que  te  he  citado,    porque  sigo  muy  molesto.  Caminemos  un  poco,  así  me  descar-    go,  y  luego  podré  hablar  mejor.  Quiero  que  sepas  que  cuando    concertó  una  cita  me  irrita  mucho  esperar,  de  modo  que  qui-    siera que veamos el modo de que esto no vuelva a repetirse.»   En  el  presente  de  esa  situación,  la  reparación  posible   se    produce  proponiendo  un  paseo,  que  es  lo  que  más  me  des-    carga,  en  lugar  de  quedarme  sentado  en  el  bar,  tenso  y  con    todo  mi  malestar.  Y  para  el  futuro ,  proponiendo  y  logrando    efectivamente  diseñar  una  manera  que  garantice  que  esa  es-    pera de una hora no se volverá a repetir.    Recapitulando entonces los tres componentes:   a)     Realizo la catarsis necesaria para descargar mi sistema.   b)   Le doy a conocer, clara y abiertamente, lo que siento,     40 \n                    para  que  él  conozca  el  efecto  que  produce  en  mí  lo  que  él    ha hecho.   c)    Incluyo  una  propuesta  para  reparar  la  situación  pre-    sente para tratar de evitar que se repita en el futuro.   Para  comprender  mejor  la  significación  de  esta  secuencia    es  útil  recordar  que  el  enojo  no  es  un  fin  en  sí  mismo,  sino,    en última instancia, un medio para resolver un problema .   El  enojo  se  convierte  en  un  fin  en  sí  mismo  cuando  nos    olvidamos,  nos  desconectamos  del  tema  que  ha  provocado    nuestro  enojo  y  parece  que  sólo  queremos  herir  a  quien  nos    ha irritado.   Esto  nos  introduce  en   el  cuarto  componente   de  la     expre-   sión del enojo, que es  el deseo de castigar al otro por lo que   hizo.    Aquí  el  centro  está  puesto  en  hacer  sufrir  al  otro.  Lo    hacemos  a  través  de  insultos,  enjuiciamientos  y  descalifica-    ciones.  Y  en  sus  formas  extremas  a  través  del  castigo  físico.    Cuando  mi  amigo  llega  tarde,  le  digo:  «Eres  un  egoísta,  un    irresponsable,  un  desconsiderado,  contigo  no  se  puede  pac-    tar  nada,  es  imposible  confiar  en  ti...  Lo  que  pensaba  hacer    contigo  no  voy  a  hacerlo,  de  modo  que  me  voy.  Adiós.»  Esto    puedo  decirlo  incluso  con  un  tono  de  voz  relativamente    tranquilo,  de  manera  que  la  descarga  en  sí  de  mi  estado    es  mínima  y  simultáneamente  el  efecto  sobre  el  otro  es  má-    ximo.   Aquellas   personas  que  están  habituadas  a  expresar  su    enoio  de  esta  manera  creen  verdaderamente  que  expre-    sar enoio es eso: descalificar, reprochar y castigar .   Si  estamos  atentos  a  las  discusiones  diarias  veremos  que    en  la  mayor  parte  de  ellas  ésta  es  la  modalidad  que  predo-    mina:  «¡No  digas  tonterías!;  ¡Eres  un  resentido!;  ¡Eso  es  una    estupidez!;  ¡Eres  un  hijo  de  p...!;  ¡Eres  un  amargado!;  ¡No    41 \n                    sirves  para  nada!;  ¡Eres  un  pelmazo!;  ¡Eres  una  histéri-    ca!», etc.   Todas  estas  expresiones,  más  la  larga  lista  de  frases  equi-    valentes  que  cada  uno  podrá  recordar,  tienen  en  común  el    hecho  de  utilizar  las  palabras  para  atacar  al  otro ,  en  ese  sen-    tido  son  verdaderas  «trompadas  verbales».  Estas  «trompa-    das»  consisten  en  emitir  un  juicio  descalificatorio  acerca  de    lo que el otro «es». Es decir, agraviar e insultar.   Y,  lo  repetimos  una  vez  más,  muchas  personas  están  sin-    ceramente  convencidas  de  que  enojarse  y  discutir  es  hacer    eso: herir con las palabras .   Cuando  se  les  revela  otra  alternativa  muestran  una  verda-    dera  sorpresa  al  enterarse  de  una  modalidad  que  no  estaba    presente  en  su  forma  habitual  de  vivir  y  expresar  su  ira.  Esta    evidencia  clínica  pone  de  manifiesto  hasta  qué  punto  el    tema  de  la  ira  es  también  un  importante  aprendizaje  que,    como  miembros  de  la  especie  humana  y  protagonistas  de    esta cultura, necesitamos realizar .   La  misma  modalidad  descalificadora  y  castigadora  la  en-    contramos  cuando  al  oír  algo  que  nos  enoja  «damos  un    portazo»  y  nos  vamos.  Aquí  intervienen  acciones  en  lugar    de  palabras,  pero  la  esencia  es  la  misma.  Esta  actitud  tam-    bién  es  muy  frecuente,  y  existen  personas  que  se  recono-    cen  a  sí  mismas  como  expertas  en  «poner  el  dedo  en  la  lla-    ga»,  es  decir,  producir
