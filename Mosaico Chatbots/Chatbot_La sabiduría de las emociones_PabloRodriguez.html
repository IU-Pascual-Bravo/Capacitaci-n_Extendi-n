con  la  mínima  descarga,  el  máximo    daño .   Una  paciente,  Elena,  me  contaba:  «Mi  marido  no  me    consultó  acerca  de  cómo  quería  yo  que  se  hicieran  los  arre-    glos  en  la  casa,  y  aunque  eso  me  irritó  mucho,  no  pude  de-    cirle  nada.  Cuando  me  preguntó  a  qué  hora  iba  a  estar  yo    para  que  recibiese  al  albañil,  le  dije  que  esa  semana  iba  a    estar  muy  ocupada  y  no  me  encontraría  en  casa.  Él  tuvo  que    42 \n                    quedarse  para  recibirlo,  con  las  consiguientes  dificultades    para su propio trabajo, de lo que me alegré muchísimo.»   En  la  medida  en  que  Elena  no  disponía  de  los  recursos    emocionales  para  expresarle  a  su  marido  que  le  disgustaba    el  que  no  la  hubiese  consultado,  y  proponerle  que  la  inclu-    yera  para  emitir  su  opinión,  no  tuvo  más  remedio  que  de-    sembocar  en  la  situación  en  que  expresaba  su  enojo  a  través    de acciones que dañaran a su marido .   Esta  actitud  está  relacionada  con  ese  conjunto  de  res-    puestas  que  intentan  que  el  otro  sienta  lo  que  nosotros  hasta    ese  momento  sentimos  («Si  sufrí  10,  que  él  también  sufra    10»),  y  multiplicado  incluso  («Si  sufrí  10,  que  él  sufra  50»).        El régimen de multiplicación depende de cada uno, y ése es   el  sistema  que  «va  fabricando  la  bomba  atómica».  El  que    dependa  de  cada  uno  significa  que  no  sólo  está  relacionado    con  lo  que  el  otro  hizo  sino  también  con  todas  las  veces  en    que  nos  sentimos  heridos,  con  el  dolor  que  nos  produjo  y    con  las  conclusiones  que  sacamos  sobre  el  motivo  por  el    que  ocurrió .  («Esto  me  sucedió  porque  todo  el  mundo  inten-    ta  sacar  provecho,  a  nadie  le  importa  nada  de  mí,  la  vida  es    una  guerra  sin  cuartel,  por  lo  tanto  no  me  importará  nada  de    nadie, yo atacaré el primero y los destruiré», etc.)   Esta  carga  de  dolor,  enojo  y  escepticismo  acumulado  es    lo que determina el cuántum de la multiplicación.   La  llamada  Ley  del  Talión,  «ojo  por  ojo,  diente  por  dien-    te»,  fue  precisamente  un  intento  de  limitar  y  organizar  el  ré-    gimen de multiplicación de la ira desbordada.   La  actitud  que  estamos  describiendo  es  también  el  sustra-    to  psicológico  de  los  actos  de  venganza.  La  venganza  es,  en    esencia, eso: hacer algo para que el otro padezca lo mismo    que nos_hizo padecer .   A  partir  de  estos  hechos,  la  actitud  de  «lo  que  más  me    43 \n                    descarga  es  que  el  otro  sufra»,  se  revela  como  una  extraordi-    naria  distorsión  en  la  elaboración  del  enojo.  Además,  como    a  su  vez  el  otro  va  a  reaccionar  ante  nuestra  acción,  que  lo    ha  hecho  sufrir,  si  él  tiene  el  mismo  mecanismo  de  causar-    nos  sufrimiento  por  lo  que  le  hicimos,  juntos  ponemos  en    marcha  una  interacción  que  agrava  el  problema  y  multiplica    el  daño .  Ésa  es  «la  bomba  atómica».  Así  es  cómo  se  fabrican    peleas  que  culminan  en  actos  de  violencia  de  una  magnitud    tal  que  resultan,  a  los  ojos  de  un  observador,  altamente  des-    proporcionadas  en  relación  con  el  motivo  que  las  generó.    Son  esas  típicas  discusiones  que  comienzan  con  un  tema    menor  y  terminan  en  peleas  y  distanciamiento,  y  muchas    veces preguntándonos cómo empezó la discusión.   Éstos  son  los  ejemplos  prototípicos  de  las  situaciones  en    las  que  el  enojo,  en  lugar  de  resolver  un  problema,  lo  agrava    y multiplica .   Marco  Aurelio  dijo,  en  el  siglo  II  de  nuestra  era:  «¡Cuánto    más  penosas  son  las  consecuencias  del  enojo  que  las  causas    que  lo  produjeron!»  Y  hoy,  dieciocho  siglos  después,  su  fra-    se  conserva,  lamentablemente,  toda  su  vigencia.  Desde  la    perspectiva  que  brinda  este  análisis  detallado  podemos    comprobar  que  las  consecuencias  penosas  que  tan  bien  ob-    servaba  Marco  Aurelio  no  son  inherentes  al  enojo  en  sí ,  sino    a esta forma particular de sentirlo y procesarlo.   A  modo  de  resumen  podemos  destacar  que  estas  cuatro    categorías  abarcan  todas  las  formas  de  expresión  del  enojo,    es  decir,  siempre  estaremos  expresando  alguno  de  estos    cuatro componentes.   En  cualquier  respuesta  de  ira  podremos  encontrar  una,    varias o todas estas facetas.   Resulta  muy  útil  descubrir  cuáles  están  presentes  en  el    modo  de  enojarse  de  cada  uno.  Volveremos  sobre  este  pun-    44 \n                    to  en  «La  indagación  personal»,  pero  por  ahora  recordemos    que  las  tres  primeras  son  funcionales  en  tanto  contribuyen  a    la  resolución  del  problema,  y  que  la  que  describimos  en  úl-    timo término es la más disfuncional del espectro.   Autoafirmación y enojo   La  autoafirmación  es  un  término  clave  para  comprender    mejor la función resolutiva del enojo.   ¿Y  qué  es  autoafirmarse?  Es,  como  su  nombre  lo  indica,    afirmarse  a  sí  mismo.  Es  expresar  con  claridad  la  propia  nece-    sidad  o  punto  de  vista .  Poder  hacerlo  no  es  sinónimo  de  salud    psicológica,  pues  esta  función  se  puede  ejercer  de  un  modo    maduro  o  inmaduro.  Pensemos,  por  ejemplo,  en  un  vínculo    de  pareja:  la  autoafirmación  es  inmadura  cuando  la  expresa-    mos  de  forma  invasiva  y  desconsiderada,  es  decir,  cuando    presentamos  nuestra  necesidad  sin  tener  en  cuenta  a  quien    nos  escucha.  «¡Yo  quiero  esto,  y  no  estoy  dispuesto  a  dar  el    brazo  a  torcer!»  Esta  modalidad  se  acerca  más  al  mero  ego-    centrismo  despótico.  Es,  en  cambio,  madura,  cuando  no  sólo    presentamos  nuestra  necesidad  claramente  sino  que,  ade-    más,  lo  hacemos  de  un  modo  que  contempla  las  posibilida-    des  de  recepción  del  destinatario  y  asumimos  luego  una  acti-    tud receptiva para escuchar la respuesta.   Resumiendo,  la  autoafirmación  inmadura  pretende  im-    poner, en tanto que la madura tiende a proponer .   La  autoafirmación,  como  se  puede  observar  en  esta  des-    cripción,  está  más  allá  del  enojo;  es  una  función  básica  para    realizar  cualquier  intercambio  y,  sin  embargo,  no  todos  con-    tamos  con  esta  capacidad,  aun  en  las  sencillas  acciones  de    la convivencia diaria.     45 \n                    En  la  situación  de  enojo  la  capacidad  de  autoafirmación    queda  sometida  a  su  mayor  desafío,  a  su  momento  más  ar-    duo.  Si  uno  no  cuenta  con  ella  para  las  situaciones  habitua-    les, más difícil le resultará apelar a ella durante el enojo.   Cuando  uno  ha  aprendido  a  hacerlo,  ese  excedente  de    energía  que  es  el  enojo  se  encauza  fortaleciendo  la  autoafir-    mación,  y  la  autoafirmación  alcanza  su  plenitud  funcional    cuando  apunta  a  la  resolución  del  problema  que  produjo  el    enojo .   Rara  comprender  mejor  esto,  volvamos  al  ejemplo  de    Elena:  ella  se  enojó  con  su  marido  porque   no    la  consultó    acerca  de  los  arreglos  en  su  casa  y  expresó  su  ira  obstruyen-    do la ejecución para perjudicar a su esposo.   De  acuerdo  con  esta  propuesta  ella  hubiera  podido  ex-    presar:  «Tú  has  decidido  los  arreglos  sin  consultarme,  eso    hace  que  me  enoje,  porque  la  casa  es  de  los  dos  y  los  dos  vi-    vimos  en  ella,  y  lo  que  yo  necesito  es  que  me  consultes.  Te    propongo  que  discutamos  ese  proyecto,  que  nos  pongamos    de  acuerdo  en  lo  que  vamos  a  hacer  y  luego  llamemos  a  los    albañiles.»   Esto es autoafirmarse con claridad, firmeza y respeto.   Es  así  en  la  medida  en  que  Elena  nombra,  sin  descalificar,    lo  que  su  marido  hizo  y  a  ella  le  molestó,  dice  por  qué  le    molestó  y  propone  con  claridad  lo  que  necesita  que  ocurra    para que su enojo cese .   Lo  que  ella  hizo,  en  cambio,  fue  quedar  enredada  en  la    pelea  con  su  marido:  se  enfadó  con  él  porque  no  la  consul-    tó, no se lo dijo y luego obstruyó la ejecución para dañarlo.   Se  «olvidó»  del  tema  central  —no  ser  consultada—  y  por    lo  tanto  no  hizo  nada  para  resolverlo,  y  desplazó  el  eje  ha-    cia la venganza sobre su marido.   Dejó  de  tener  un  problema  con  su  marido  y  su  marido    46 \n                    pasó  a  ser  su  adversario  en  una  batalla  que  se  dirimía  para    ver quién quedaba más perjudicado.   Cuando el enojo toma ese camino, todos pierden.   Este  ejemplo  puede  resultar  muy  elemental,  pero  la  ex-    periencia  clínica  muestra  que  la  parte  de  las  discusiones  co-    tidianas  que  no  se  resuelven  y  van  deteriorando  la  relación    son  el  resultado  de  no  saber  cómo  expresar  un  desacuerdo    sin  agraviar  y  cómo  presentar  claramente  la  propuesta  que    intenta resolverlo.    Incluiremos  a  continuación  las  respuestas  a  una  serie  de    preguntas  formuladas  en  seminarios  sobre  el  enojo  que    completan el desarrollo de este tema.   ¿Enojo, ira y odio son lo mismo?   Los  tres  términos  aluden  a  la  misma  emoción  en  diferen-    tes  grados  de  intensidad.  El  enojo  suele  asociarse  al  grado    menos  intenso.  La  ira,  en  esta  escala,  representa  una  forma    intermedia,  y  el  odio,  la  forma  más  intensa  y  destructiva.    Cuando  uno  comprende  que  no  son  emociones  distintas    sino  diferentes  grados  de  lo  mismo,  que  los  límites  son  difu-    sos  y  que  se  puede  pasar  de  un  estado  al  otro  fácilmente,    uno  va  centrando  su  atención  en  la  emoción  en  sí  y  en  su    proceso  de  resolución,  y  los  nombres  dejan  de  tener  tanta    importancia.     47 \n                    ¿Qué relación existe entre enojo y resentimiento?   Si  bien  el  resentimiento  merece  un  análisis  específico  y    detallado,  por  ahora  digamos,  de  forma  resumida,  que  el  re-    sentimiento  es  enojo  enfriado  y  «cronificado»,  producto  de    un  enojo  que  nos  desorganizó  y  que,  por  lo  tanto,  no  pudi-    mos expresar ni resolver en el momento en que lo vivimos.   ¿Qué relación existe entre miedo y enojo?   Las  dos  emociones  tienen  en  común  el  señalar  la  presen-    cia  de  algo  que  es  vivido  como  amenazador ,  tanto  para  la    propia  identidad  como  para  algún  deseo  particular.  Se  acti-    vará  el  predominio  del  miedo  o  del  enojo  según  la  relación    de  proporción  que  exista  entre  la  magnitud  de  la  amenaza  y    los  recursos  con  que  se  cuente  para  resolverla.  Para  utilizar    una  metáfora  sencilla:  si  es  un  mosquito  que  zumba  persis-    tentemente  y  nos  molesta  mucho,  reaccionaremos  con  eno-    jo.  Si,  en  cambio,  es  un  león  suelto   con    el  que  nos  cruzamos    por la calle, nuestra respuesta será el miedo.   Cuando me enojo, insulto, me descontrolo   y creo que para hacer lo que tú propones   hay que ser la Madre Teresa de Calcuta...   Cuando  uno  no  ha  aprendido  a  autoafirmarse  bien  se    descarga  a  través  del  insulto  y  el  escándalo,  y  le  parece  que    no  hacerlo  de  ese  modo  es  propio  de  seres  que  poseen  una    santidad  especial,  pero  si  observamos  bien  veremos  que  no    es  así,  que  todo  eso  que  tú  haces,  a  la  larga  no  resuelve    48 \n                    nada,  y  por  lo  tanto  la  frustración,  el  esfuerzo  y  la  impoten-    cia se multiplican y el malestar se hace crónico.   En  el  aprender  a  enojarse  bien  no     hay  ninguna   renuncia    significativa .  No  es  una  cuestión  de  santidad  sino  de  desa-    rrollar  la  capacidad  de  resolver  problemas,  y  al  hacerlo  to -   dos se benefician.   ¿Enojarse equivale a pelearse?   Ése  es  un  gran  malentendido  que  es  necesario  aclarar.    Enojarse  y  pelearse  no  es  lo  mismo.  Pelear  es  entrar  en  bata-    lla,  y  eso  implica  dos  que  combaten  entre  sí,  cada  uno  con    el  deseo  de  vencer.  En  ese  clima  emocional  frecuentemente    se  agravian,  se  insultan,  se  hieren.  Todo  lo  cual  deja,  casi    siempre, el mismo residuo: heridas, resentimiento y culpa.   El  enojo,  en  esencia,  no  es  necesariamente  pelea.  Es  un    intenso  desacuerdo  que  en  la  mayor  parte  de  los  casos  im-    plica  un  problema  a  resolver .  Y  damos  un  primer  paso  hacia    su  posible  resolución  cuando  describimos  —sin  enjuiciar—    aquello  con  lo  que  estamos  en  desacuerdo,  cómo  nos  ha    afectado  eso,  y  nos  autoafirmamos  con  claridad  y  firmeza    comunicando  qué  es  lo  que  necesitamos  y  proponemos    para resolver la situación que nos causa enojo.   Durante  el  enojo  el  clima  emocional  de  la  situación  es,    por  supuesto,  tenso  e  intenso,  pero  se  trata  de  un  estado    transitorio  que  no  deja  el  residuo  del  resentimiento  por  los    agravios.  Por  el  contrario,  un  buen  enojo  en  una  pareja  o  en-    tre  amigos,  que  ha  conseguido  resolverse,  enriquece  y  tem-    pla la relación.   También  es  cierto  que  hay  algunas  situaciones  en  las  que    efectivamente  existe  una  pelea:  alguien  se  arroja  sobre  mí    49 \n                    para  golpearme  y  robarme.  En  ese  caso  mi  enojo  se  expresa    como  pelea,  porque  ésa  es  la  índole  de  la  situación.  Éste  es    un  ejemplo  extremo,  y  también  existirán  otros  episodios  que    responden  a  la  misma  modalidad  en  las  que  enojo  y  pelea    se  hacen  una  y  la  misma  cosa,  pero  es  importante  recordar    una  vez  más  que,  de  la  totalidad  de  los  enojos  que  vivimos    en  la  vida  diaria,  sólo  una  ínfima  parte  responden  a  ese  prin-    cipio.  Sin  embargo,  la  actitud  de  combate  que  sí  tiene  senti-    do  en  aquellas  situaciones  acotadas  y  específicas,  la  exten-    demos a todos los enojos.   Un  buen  ejemplo  para  mostrar  esa  distorsión  es  el  relato    de  Elena:  tenía  un  problema  con  su  marido  en  relación  con    su  necesidad  de  ser  consultada  sobre  la  clase  de  arreglo  que    se  haría  en  su  casa,  y  que  él  no  había  contemplado.  Ese  pro-    blema  que  tenían  entre  los  dos   se  convirtió  en  una  pelea  de    uno contra el otro .   Este  deslizamiento  suele  ser  muy  rápido,  y  casi  sin  darse    cuenta  uno  se  desplaza,  una     y  otra  vez,  del  enojo  a  la  bata-    lla personal.   Para  quienes  padecen  esta  tendencia  distorsionadora  re-    sulta  muy  útil,  en  el  momento  mismo  de  comenzar  una  dis-    cusión,  tratar  de  responder  a  un  par  de  preguntas.  La  prime-    ra  es:  ¿Qué  tendría  que  ocurrir  aquí  para  que  mi  enojo    pudiera  cesar  lo  antes  posible?   La  segunda  está  muy  relacio-    nada  con  la  primera  y  es,  en  realidad,  otra  faceta  de  lo  mis-    mo. Consiste en preguntarse: «Y esto, ¿cómo se arregla?»    Estas  preguntas  son  como  llaves  que  abren  una  nueva  ac-    titud  mental.  Algunas  personas  utilizan  las  dos.  Otras  se    sienten  más  en  sintonía  con  alguna  de  ellas.  Lo  importante    es  que  comprendamos  en  qué  consiste  su  utilidad:  la  mente,    que  ya  se  estaba  preparando  para  una  nueva  batalla,  al  co-    nectarse  con  estas  preguntas  vuelve  a  recordar  que  existe  un    50 \n                    problema,  que  es  necesario  caracterizarlo  con  precisión,  y    que  el  propósito  prioritario  es  descubrir  cuál  es  el  modo  de    resolverlo.   También  es  útil  recordar  que  el  enojo,  en  su  esencia  mis-    ma,  está  diseñado  para  ser  transitorio,  y  que  por  lo  tanto    cumple  su  función  adecuadamente  cuando  arbitra  los  me-    dios para iniciar el camino de su propia cesación .   Otra  faceta  de  este  tema  podemos  encontrarla  en  las  muy    frecuentes  frases:  « Me     he  peleado  con  mi  novio»  (o  con  mi    novia),    o:    «Nos  peleamos»,   como  una  forma  de  decir:   «Nos   separamos.»    Para  esas  personas  separarse  y  pelearse  son  si-    nónimos,  y  así  expresan,  a  través  del  lenguaje,  una  forma    más de esta profunda y extendida confusión.   Cuando me enojo no quiero   proponer sino exigir...   La  «propuesta»,  en  sentido  genérico,  tiene,  efectivamen-    te,  múltiples  matices  que  es  necesario  discriminar:  pedir,  su-    gerir,  invitar,  proponer,  demandar,  reclamar,  exigir  y,  por  úl-    timo, imponer y ordenar.   La  diferencia  entre  cada  una  de  ellas  depende  del  grado    de  legitimidad  que  le  demos  al  «no»  como  respuesta.  Cuan-    do  pedimos,  sugerimos,  invitamos  o  proponemos  estamos    admitiendo  al  «sí»  y  al  «no»  como  respuestas  igualmente  le-    gítimas.  Cuando  demandamos,  reclamamos,  exigimos  o  fi-    nalmente,  imponemos  u  ordenamos,  estamos  disminuyen-    do  progresivamente  hasta  la  cesación  la  legitimidad  del    «no».  Esto  significa  que  si  en  ese  contexto  la  respuesta  es    «no»,  está  implícito  que  lo  que  sigue  es  la  confrontación  de    una oposición.     51 \n                    La  diferente  calidad  de  cada  forma  de  comunicación  está    dada  no  sólo  en  aquello  que  se  dice,  sino  también  en  cómo    se  dice.  El  tono  con  que  algo  se  dice  es  lo  que  muchas  ve-    ces  define  si  se  trata  de  una  propuesta,  una  demanda  o  una    orden.   Cada  situación  de  enojo,  según  el  contexto  en  que  se  da,    requiere  alguna  forma  específica  de  este  abanico  de  posibi-    lidades.   Existen  situaciones  en  las  que  la  orden  es  pertinente  y  ne-    cesaria.  Por  ejemplo,  soy  el  jefe  de  una  sección,  le  encargo    una  tarea  a  un  empleado  para  que  la  realice  en  las  próximas    horas,  y  al  culminar  ese  tiempo  me  informa  de  que  no  la    hizo. Me enojo con él y le ordeno que la haga de inmediato.   En  general  la  orden  es  pertinente  en  el  marco  de  las  rela-    ciones  jerárquicas  y  vinculadas  a  tareas  previamente  conve-    nidas.  El  problema  surge  cuando  la  actitud  de  dar  órdenes    se  extiende  a  otros  ámbitos  no  regidos  por  esas  mismas  le-    yes, lo que ocurre muy a menudo.   Por  ejemplo,  entre  pares  la  orden  no  tiene  lugar,  como    así  tampoco  en  los  conflictos  del  universo  emocional:  no    podemos  ordenarle  a  alguien  que  nos  quiera,  o  que  nos  ad-    mire o que nos crea, o que se divierta con nosotros, etc.   Las  transformaciones  psicológicas  sólo  se  producen  por    autoconvencimiento.   Si  para  que  cese  nuestro  enojo  con  alguien  necesitamos    que  se  produzca  un  cambio  en  su  actitud  o  en  su  sentimien-    to,  nuestra  única  posibilidad  es  transmitírselo  y  dialogar    todo  el  tiempo  necesario  hasta  que  ese  alguien  se  sienta  de    acuerdo  con  la  propuesta.  Y  ese  diálogo  sólo  puede  darse    cuando  está  muy  claro  para  ambas  partes  que  el  «sí»  y  el    «no»  son  respuestas  igualmente  legítimas,  más  allá  de  que    una pueda gustarnos mucho más que la otra.     52 \n                    Yo le tengo miedo al enojo del otro.   ¿A qué se debe?   En  ello  intervienen  varios  factores.  Nombraremos  los    más  significativos:  si  vivimos  el  enojo  como  algo  masivo,  sin    gradaciones,  tipo  «cero»  o  «cien»,  el  enojo  posible  del  otro    será  para  nosotros,  siempre  «cien».  Si,  además,  no  hemos    aprendido  a  autoafirmamos  de  un  modo  maduro,  sabemos    que  estamos  expuestos  a  quedar  paralizados  o  a  estallar  en    ira,  y  que  nos  embarcaremos  en  una  pelea  descomunal    —entre  «cien»  y  «cien»—  que  terminará  por  destruir  el    vínculo.   Cualquiera  de  estas  derivaciones  inspira  miedo  porque    no  es  resolutiva,  y  ésa  es  una  parte  importante  en  lo  que  sub-    yace en miedo al enojo del otro.   Muchas  personas  dicen:  «No  he  dicho  tal  cosa  por  mie-    do  a  que  se  enojara.»  Esas  personas  imaginan  el  enojo  del    otro  como  el  fin  de  todo,  algo  que  debe  evitarse  a  toda  costa    y  que,  cuando  ocurre,  es  una  catástrofe  sobre  la  cual  nada    se puede hacer.   Lo  que  cura  ese  miedo  es  saber  que  «la  película»  no  aca-    ba  con  el  enojo  del  otro,  que  si  hemos  aprendido  a  autoafir-    mamos  respetuosamente,  luego  de  escuchar  la  ira  del  otro    podemos  seguir  presentando  nuestro  punto  de  vista  de  tan-    tas  maneras  como  sea  necesario.  Que,  por  nuestra  parte,  no    vamos  a  agravar  el  enojo  existente,  y  que,  si  bien  el  tramo    del  enojo  es  tenso  e  intenso,  de  ahí  también  se  puede  volver,    y  cuando  se  resuelve  el  problema  se  retorna  enriquecido.    Por  lo  tanto,  el  enojo  del  otro  no  es  el  punto  final  de  la  dis-    cusión  ni  del  vínculo,  sino  sencillamente  un  momento  más    de esa relación.     53 \n                    A veces estoy muy enojado y no quiero   ver más a la persona que provocó mi enojo.   ¿Es eso un error?   Existen  situaciones  en  las  que  lo  que  ocurrió  es  de  tal  sig-    nificación  que  hace  que  efectivamente  uno  no  quiera  ver    más  a  esa  persona,  sucesos  que  ponen  en  evidencia  en  el    otro  rasgos  que  son  incompatibles  con  nuestra  noción  de  la    amistad,  la  pareja  o  lo  que  sea.  Esa  decisión  es  parte  de    nuestra  libertad  de  elegir  nuestras  relaciones  y  adquiere    toda  su  significación  cuando  sabemos  que  no  reaccionamos    así  ante  cualquier  enojo.  Es  necesario  aclarar  esto  porque    hay  personas  que,  al  no  saber  cómo  enfrentarse  a  las  situa-    ciones  de  enojo,  suelen  cortar  la  relación  como  forma  habi-    tual  de  reacción.  Se  trata  de  la  «modalidad  quirúrgica»  de    resolución  de  conflictos,  y  eso  ya  es  distinto.  El  problema    de  esta  precaria  actitud  es  que  se  dejan  por  el  camino  mu-    chos  vínculos  potencial  mente  valiosos,  y  quien  reacciona    así  vive  con  la  inquietante  sensación  profunda  de  que  no    cuenta con la capacidad de conservar lo que valor a.   Yo me ofendo fácilmente y me cierro;   ¿tiene que ver con esto?   Sí.  Uno  se  ofende  cuando  se  siente  herido  por  algo  que  el    otro  hizo  y  se  apoya  en  la  idea  de  que  el  otro  «¡no  tendría    que  haber  hecho  eso!».  Entonces  se  cierra  y  se  retira.  Uno    no  puede  decirle  que  se  siente  herido  porque  generalmente    ello  implica  mostrar  un  aspecto  propio  especialmente  sensi-    ble  o  vulnerable  que  cuesta  reconocer.  De  ese  nudo  interior    surge la ofensa y el corte.     54 \n                    Cuando uno comienza a legitimar interiormente el pro-   pio aspecto vulnerable se le hace más sencillo reconocerlo    ante el otro y comunicar la herida que ha experimentado. Al   abrir ese estado se hace más fácil aceptar que el otro hizo lo   que  hizo,  uno  no  se  centra  tanto  en  que  «¡no  tendría  que    haberlo  hecho!»  y  orienta  su  energía  en  la  dirección  de:    «Dado que hizo lo que hizo, veamos cómo se resuelve.»   A  partir  de  allí  ha  logrado  salir  de  la  cápsula  «encerrado-    ra»  y  cronificadora  de  la  ofensa  y  ha  ingresado  en  la  tarea  de    resolver un desacuerdo más, que produce enojo.   Yo no puedo enojarme con la gente que quiero,   y  eso me trae problemas...    Cuando  uno  cree  que  enojarse  es  pelearse  y  comenzar    una  escalada  hacia  la  destrucción  del  vínculo,  no  tiene  más    remedio  que  «cerrar  los  ojos  y  dejar  pasar»,  aunque  después    le  traiga  problemas.  A  esta  confusión  se  agregan  algunas    creencias  muy  generalizadas,  que  dicen:  «Si  quieres  a  al-    guien  no  puedes  estar  en  desacuerdo  con  él»,  o  «Si  expresas    el enojo, el afecto se perderá».   Lo  que  tienen  en  común  estas  creencias  es  que  suponen    que  el  afecto  y  el  enojo  se  excluyen  recíprocamente:  o  uno    o  el  otro.  Y,  en  realidad,  es  exactamente  al  revés:  una  de  las    actitudes  que  más  ayuda  a  que  el  enojo  conduzca  a  un  ca-    mino  resolutivo  es  poder  sentir  y  expresar  el  enojo  con  afec-    to .  Quizá  parezca  una  contradicción  insalvable  en  sí  misma,    Pero  no  es  así.  Es,  simplemente,  recordar  (cuando  ésa  es  la    situación)  que  con  quien  estamos  enojados  es  alguien  a    quien  queremos,  ya  sea  nuestra  mujer,  nuestro  amigo,  nues-    tro vecino, etc.     55 \n                    El  enojo  es  la  figura  que  está  en  primer  plano;  el  afecto  es    el  trasfondo  que  completa  el  cuadro .  La  intensidad  inicial    del  enojo  suele  borrar,  transitoriamente,  la  percepción  del    afecto.  Es  por  ello  por  lo  que  es  bueno  darse  tiempo  para  te-    ner  un  registro más equilibrado del conjunto.   Cuando  se  comprenden  todos  los  matices  de  esta  si-    tuación,  lo  que  parecía  un  inconveniente  se  convierte  en    facilitador.  Del  «Yo  no  puedo  enojarme  con  la  gente  a    la  que  quiero»,  se  pasa  al  «Porque  sé  que  la  quiero  es    que  me  resulta  más  fácil  expresarle  mi  enojo  cuando  lo    siento».   Yo quiero que el otro se sienta culpable   por lo que hizo...   Es  una  reacción  muy  corriente.  El  otro  me  ha  dicho  algo    que  me  duele  y  me  enoja,  yo  doy  veladas  señales  de  dolor  y    me alejo.   Si  uno  examina  con  detenimiento  esta  actitud  verá  que,    en  el  fondo,  se  trata  de  una  exageración  distorsionada  de  la    legítima  necesidad  de  hacerle  saber  al  otro  el  impacto  que    nos  ha  producido  lo  que  hizo.  La  pregunta  que  surge  ante    esto  es:  «¿Por  qué  no  se  lo  puede  decir  directamente?»  Trata-    remos de ahondar en ello.   «¡No  tendría  que  haber  hecho  esto!»,  o  «¡Tendría  que  ha-    ber  hecho  tal  cosa!»  implican  priorizar  lo  que  uno  imagina    acerca  de  cómo  debería  ser  el  otro  y  a  qué  modelo  debería    ajustarse.  Por  supuesto  que  uno  se  frustra  y  sufre  mucho    cada vez que el otro no se ajusta a ese modelo y trata de que   él  también  sufra  sintiéndose  culpable  por  lo  que  hizo.  De    ese  modo  uno  intenta,  además,  que  cambie  su  comporta-    56 \n                    miento  sin  necesidad  de  decírselo  de  modo  explícito  y  di-    recto.   En la medida en que uno va creciendo y es genuinamen-   te  autónomo  va  desarrollando  otra  visión  y  otra  actitud.    Puesta  en  palabras  sería:  el  otro  es  el  otro  y  en  última  instan-    cia  está  más  allá  de  todo  modelo  que  yo  tenga  acerca  de  él.    Por  lo  tanto,  le  reconozco  el  derecho  de  actuar  como  actúa.    Eso  no  significa  que  quede  sometido  e  inerme  ante  él.  Si  es-    toy  en  desacuerdo  con  lo  que  hace  se  lo  expresaré  con  toda    claridad  y  firmeza  y  haré  las  propuestas  o  demandas  que    crea  necesarias.  Pero  también  sé  que  allí  termina  mi  juris-    dicción.  Él  puede  decir  que  sí  o  que  no,  y  admito  esas  dos    posibilidades.  En  función  de  su  respuesta  veré  qué  es  lo  que    hago.   Estar  en  condiciones  psicológicas  de  admitir  el  sí  o  el  no    del  otro  es  la  nota  clave  que  permite  pasar  de  la  manipula-    ción subrepticia para crear culpa al desacuerdo abierto.   Yo expreso bien mi enojo y el otro me contesta   mal y sigue haciendo lo que quiere...   Expresar  bien  el  enojo  no  garantiza  que  el  otro  vaya  a    cambiar  de  acuerdo  con  nuestro  deseo.  Sólo  asegura  que    uno  «no  echa  más  leña  al  fuego»  y  que  está  creando  las  con-    diciones  más  propicias  para  que  el  desacuerdo  se  resuelva.    A  menudo  el  cambio  de  actitud  de  uno  se  va  propagando  al    otro,  que  capta  esa  nueva  atmósfera  emocional  y  aprende    otra  forma,  más  respetuosa  y  resolutiva,  de  expresar  el  eno-    jo.  Pero  también  es  probable  que  no  ocurra  así  y  perdure  en    el  otro  su  manera  habitual  y  destructiva  de  enojarse.  En  ese    caso lo que uno sí tiene es la certeza de que ha actuado de     57 \n                    la  forma  adecuada  y  que  las  cosas  están  como  están.  A  par-    tir  de  allí  resulta  más  sencillo  tomar  la  decisión  que  corres-    ponda a ese momento.   Cuando me enojo me desorganizo/   ¿podrías hablar de eso?    Dijimos  que  cuando  el  deseo  encuentra  un  obstáculo  que    amenaza  su  realización,  recibe  un  remanente  de  energía    —el  enojo—  que  está  destinada  precisamente  a  fortalecer    las  posibilidades  de  realización  de  dicho  deseo.  Para  que  el    enojo  actúe  fortaleciendo,  la  persona  necesita  contar   con    re-   cursos  que  puedan  implementar  dicho  remanente.  Si  esos    canales  no  existen,  la  sobrecarga  desorganiza  en  lugar  de    fortalecer,  y  el  modo  en  que  lo  vivimos  es  de  confusión  y  de-    sesperación. Se trata de la desesperación de la impotencia.   Éste  es,  en  realidad,  un  factor  fundamental  en  la  produc-    ción  de  enojo  destructivo.  «Cuando  me  desorganizo  y  no  se    qué  hacer  termino  rompiendo  lo  que  tengo  cerca...»  Esto    permite  comprobar  una  vez  más  que  uno  produce  fuera  la    réplica  del  estado  que  siente  dentro.  Por  esta  razón,  una  per-    sona muy enojada y desorganizada es altamente peligrosa.   Ayudar  a  una  persona  a  utilizar  bien  su  enojo  es  enseñar-    le  nuevos  recursos  que  le  permitan  encauzar  este  remanente    de  energía  hacia  la  solución  del  problema  que  hace  que  se    sienta enojado.     58 \n                    Mi problema es que con quien más me enojo   es conmigo mismo   Tradicional  mente  se  le  ha  dado  mucha  importancia  a  de-    tectar  quién  era  la  persona  del  mundo  externo  que  estaba    involucrada  en  el  enojo  hacia  uno  mismo.  Incluso  los  tera-    peutas  hemos  destinado  mucha  energía  en  tratar  de  descu-    brir  quién  era  esa  persona  y  reorientar  el  enojo  en  esa  direc-    ción.  La  formulación  típica  era:  «El  enojo  que  siente  hacia    usted  es  la  interiorización  del  enojo  que  siente  hacia  su  pa-    dre (madre, jefe, hermano, etc.).»   En  la  medida  en  que  vamos  conociendo  mejor  la  reac-    ción  de  enojo  las  prioridades  cambian  por  completo  y  se    produce  un  cambio  radical  en  la  manera  de  abordar  este    problema .   Ya  no  importa  tanto  con  quién  estoy  enojado  sino  cómo    me he enojado .   Si  he  aprendido  a  enojarme,  es  decir,  si  he  aprendido  a    utilizar  la  energía  del  enojo  para  resolver  el  desacuerdo  que    me  lo  provoca,  entonces  no  importa  dónde  está,  ni  quién  es    el  que  hace  que  me  enoje,  lo  que  importa  es  que  efectiva-    mente implemente la función resolutiva del enojo.   Y  si  aún  no  he  aprendido  a  enojarme  bien,  la  tarea  priori-    taria es aprender a hacerlo.   Si  usted  siente  que  su  enojo  es  contra  usted  mismo,  la    primera  propuesta  que  le  hago  es  que  observe  cuál  es  espe-    cíficamente  la  parte  suya  que  lo  enoja.  El  término  «yo  mis-    mo»  es  muy  amplio  y  poco  diferenciado.  Uno  nunca  se    enoja  con  uno  mismo  sino  con  algún  aspecto,  más  o  menos    abarcador,  de  uno  mismo.  Es  necesario  saber  qué  aspecto  es    (si  se  trata  de  un  aspecto  inseguro  o  miedoso,  etc.)  para  po-    der iniciar la tarea de resolución.     59 \n                    Una  vez  que  el  aspecto  ha  sido  identificado,  el  proceso    es  igual  que  el  que  se  da  con  una  persona  del  mundo  exter-    no,  con  la  salvedad  de  que  cuando  es  un  aspecto  nuestro    (por  ejemplo  el  inseguro)  el  que  nos  enoja,  todos  los  prota-    gonistas  son  interiores.  Tanto  el  aspecto  inseguro  como    quien  se  enoja  con  él.  Esto  significa  que  ambos  están  bajo  la    órbita  de  nuestra  jurisdicción,  y  por  lo  tanto  lo  que  se  apren-    da  en  el  despliegue  de  ese  enojo  para  hacerlo  más  resoluti-    vo llega a ambos antagonistas por igual.   Si  en  una  sesión  estoy  desplegando  mi  enojo  con  mi  mu-    jer,  yo  puedo  hacer  todos  los  aprendizajes  necesarios  para    optimizar  mi  enojo,  pero  eso  no  significa  que  ella  también    lo  esté  haciendo  y  que  su  modo  de  enojarse  conmigo  cam-    bie  de  inmediato.  De  modo  que  los  cambios  en  ese  vínculo    se  realizarán  a  partir  de  un  polo  y  de  la  propagación  que    pueda  hacerse  desde  allí,  reconociendo  la  propia  vida  del    otro polo, con sus leyes y sus tiempos.   Cuando  ambos  antagonistas  son  interiores  no  existe  ese    destiempo  y  el  aprendizaje  es  más  simultáneo.  Por  esta  ra-    zón  el  desacuerdo  interior  es  el  vínculo  preferencial  para    aprender  a  transformar  el  enojo  que  destruye  en  enojo  que    resuelve.   INDAGACIÓN PERSONAL   Le  propongo  ahora  al  lector  que  para  aprovechar  mejor    esta  lectura  trate  de  evocar  alguna  escena  reciente  y  significati-    va  en  la  que  sintió  intenso  enojo.  Trate  de  recordar  quiénes    eran  los  protagonistas,  cuál  era  el  tema  que  motivó  el  enojo,  y    especialmente  cuál  fue  su  reacción.  Es  decir,  de  qué  modo  ex-    presó su enojo . Utilizando el parámetro de los cuatro compo-     60 \n                    nentes,  le  propongo  que  observe  cuáles  estuvieron  presentes.    a)  si  hubo  reacción  de  descarga,   b)  si  dio  a  conocer  lo  que  sen-    tía  ante  lo  que  le  hicieron,   c)  si  formuló  alguna  propuesta  para    resolver la situación, y  d)  si intentó castigar al otro por lo que le hizo.   La  experiencia  clínica  muestra  que  en  la  expresión  del  eno-    jo,  la  mayoría  de  las  personas  sólo  ponen  en  juego  las  accio-    nes  por  las  que  intentan  castigar  al  otro,  bien  con  insultos,  re-    proches  o  descalificaciones .  Sea  cual  fuere  su  caso  en  el    ejemplo  que  ha  evocado,  trate  de  imaginar  que  vuelve  a  esa    escena  y  observe  cómo  sería  para  usted  expresar  su  enojo  in-    cluyendo  los  tres  componentes  funcionales  de  este  análisis .   Considérelo  simplemente  como  un  ensayo  y  observe  cómo  se    siente  al  expresar  su  enojo  de  ese  modo.  Si  le  resulta  satisfacto-    rio,  trate  de  extenderlo  a  otras  escenas  de  enojo  hasta  que  lo    incorpore  como  algo  habitual.  Recuerde  que  si  usted  está  in-    troduciendo  cambios  en  su  manera  de  reaccionar,  dichos  cam-    bios  requerirán  cierto  tiempo  para  consolidarse.  Durante  la    transición,  en  la  medida  en  que  usted  haya  captado  cuál  es    la  función  esencial  del  enojo  y  cuál  es  el  camino  que  mejor  la    cumple,  desde  esa  comprensión  podrá  reconocer  mejor  sus    errores  habituales.  Podrá  reconocerlos  como  la  manifestación    de  una  cierta  inercia  y  por  lo  tanto  no  necesitará  actuarlos.  Los    contemplará  como  se  observa  a  un  vehículo  que  está  lanzado    a alta velocidad y que necesita su tiempo para girar.   Creo  que  la  tarea  vale  la  pena,  porque  cuando  una  persona    ha  aprendido  a  utilizar  la  energía  del  enojo  para  darle  más  de-    terminación  al  intento  de  resolver  el  desacuerdo  que  enoja,  y    eso  se  logra  con  el  mínimo  daño  de  todos  los  protagonistas,  en    la vida de esa persona ha cesado la guerra inútil.                61 \n                    T   R   E   S          LA CULPA QUE TORTURA   Y LA CULPA QUE REPARA       Suele considerarse la culpa como una «emoción   negativa», torturadora, que no deja vivir. Ésa es la    forma disfuncional de la culpa, y es posible    aprender a transformarla en un valiosísimo aliado    que repara sin torturar.        62 \n                    Qué es la culpa   Cuando  uno  dice:  «Me  siento  culpable»,  en  realidad  está    nombrando  una  parte  de  su  realidad  psicológica,  está  iden-    tificándose  con  una  mitad  de  lo  que  le  está  ocurriendo  en    ese  momento.  La  otra  mitad,  que  uno  no  suele  percibir,  es  la    voz    interior  culpadora ,  que  es  justamente  la  que  hace  que    uno se sienta culpable.   Tomemos  un  ejemplo:  «Me  siento  culpable  por  lo  que    hice  y  siento  que  no  merezco  ser  feliz.»  Este  estado  de  áni-    mo  implica  inevitablemente  que  existe  una  voz  interior  que    está  diciendo:  «Eres  culpable  por  lo  que  has  hecho  y  no     me-   reces  ser  feliz.»  Por  lo  tanto,  «el  culpable»  (o  «el  culpado»)  y    «el  culpador»  constituyen  las  dos  caras  de  una  misma  mo-    neda,  conforman  una  unidad  psicológica  indisoluble  de  la    cual  el  «sentirse  culpable»  es  sólo  una  mitad.  Cuando  se  re-    conoce  la  estructura  global  de  esta  vivencia  se  hace  eviden-    te  que  para  comprender  y  resolver  el  sentimiento  de  culpa    es necesario también conocer a fondo quién es el culpador.     63 \n                    El culpador   Las  naciones  se  rigen  por  constituciones  que  ordenan  las    relaciones  entre  sus  habitantes.  En  escala  decreciente,  algo    similar  ocurre  con  las  provincias,  municipios,  asociaciones    barriales,  comunidades  de  vecinos,  etc.  Del  mismo  modo,    cada  individuo  está  regido  por  un  conjunto  de  pautas  que    regulan  su  funcionamiento.  Estas  normas  pueden  ser  distin-    tas  para  cada  uno  y  dependen,  entre  otras  variables,  del  me-    dio  y  la  educación  que  se  haya  recibido;  pero  lo  importante,    en  relación  con  este  tema,  es  que  siempre  existe  ese  conjun-    to  de  normas ,  algunas  de  las  cuales  pueden  ser  conscientes    y otras no.   Los  Diez  Mandamientos  son  un  buen  ejemplo  de  un  con-    junto  de  pautas  morales  muy  extendidas  en  la  cultura  judeo-    cristiana,  pero  también  existen  códigos  más  particulares  y  es-    pecíficos,  propios  de  cada  grupo  social,  de  cada  lugar  y  cada    época.  En  general,  son  los  padres  y  educadores  quienes  tie-    nen  más  influencia  en  la  formación  del  particular  conjunto    de  normas  que  el  niño  va  incorporando  durante  su  creci-    miento. Es lo que Freud conceptualizó como «superyo».   Sea  cual  fuere  el  contenido  del  código  moral  de  cada    uno,  el  hecho  es  que  existe,  y  que  una  vez  que  este  código    se  ha  incorporado,  establece  un  sistema  que  garantiza  su    cumplimiento .  Volviendo  a  la  metáfora  anterior:  así  como    un  país  cuenta  con  la  justicia  y  la  policía  para  asegurar  la  vi-    gencia  de  sus  leyes,  el  código  moral  individual  dispone  de    un  sistema  que  trata  de  asegurar  su  cumplimiento.  El  culpa-    dor  es  el  guardián  del  código ,  y  cada  vez  que  transgredimos    alguna  pauta  de  dicho  código  se  activa  una  señal  que  infor-    ma que el código ha sido transgredido .   Esa señal es el sentimiento de cu lpa.     64 \n                    Culpa funcional y disfuncional   Ante  esta  descripción,  la  pregunta  que  surge  es  si  dicha    señal—tal  como  se  expresa—  ayuda  a  que  se  produzcan  las    correcciones  necesarias  para  restablecer  el  equilibrio  y,  por    lo  tanto,  hacer  cesar  el  sentimiento  de  culpa ,  o  meramente    agrega  más  sufrimiento,  agrava  la  culpa  y  no  conduce  a  nin-    guna resolución.   Ésta  es  sin  duda  la  pregunta  clave  que  permitirá  diferen-    ciar  el  sentimiento  de  culpa  funcional   que  ayuda  a  resolver    un  problema,  de  la  culpa  disfuncional   que  añade  más  sufri-    miento  al  existente,  es  decir,  que  se  convierte  en  un  proble-    ma más.   Acerca de las normas   Para  comprender  mejor  la  diferencia  entre  culpa  funcio-    nal  y  disfuncional  es  necesario  profundizar  en  una  noción    que  ya  hemos  presentado.  Hemos  hablado  del  culpador  y    de  su  función  de  «guardián  del  código».  Vamos  a  referirnos    ahora  al  código  en  sí  .  Los  contenidos  de  ese  código  fueron    incorporados  en  algún  momento  del  pasado  y  rigen  a  la  per-    sona  a  partir  de  ese  momento.  En  la  medida  en  que  estamos    refiriéndonos  a  sucesos  inscritos  en  el  tiempo  y  por  lo  tanto    a  los  cambios  que  en  él  se  producen,  se  abren  nuevos  pro-    blemas:    a)    es  necesario  contar  con  un  conjunto  de  normas,    y    b)   dado  que  las  normas  son  cambiantes,  ¿qué  mecanismos    arbitra cada individuo para cambiar sus   normas?   Un  ejemplo  de  esto  último:  hace  algunas  décadas  era  fre-    cuente  en  nuestra  cultura  que  una  mujer  albergara,  entre    otros,  el  precepto  de  «No  te  irás  de  la  casa  de  tus  padres  an-     65 \n                    tes  de  casarte».  Actualmente,  como  todos  sabemos,  dicho    precepto ha perdido su vigencia por completo.   También  aquí  podemos  encontrar  la  semejanza  con  lo    que  ocurre  en  una  república  en  relación  con  los  caminos  que    arbitra para cambiar su Constitución.   En  relación  con  este  punto,  la  experiencia  clínica  mues-    tra  que  en  numerosas  personas  el  culpador,  en  su  función  de    guardián  del  código,  no  tiene  en  cuenta  que  el  código  que    está custodiando puede cambiar.   Cuando  así  ocurre  actúa  dando  por  sentado  que  el  códi-    go  que  él  defiende  es  definitivo  y  está  más  allá  de  cualquier    cuestionamiento .   En  la  circunstancia  en  que  se  ha  producido  una  transgre-    sión  y  se  despliega  el  diálogo  entre  el  culpador  y  el  culpado,    la  frase  más  frecuente  que  suele  oírse  es:  «Esta  norma  —sea    cual  fuere  su  contenido—  tienes  que  acatarla  porque  así  me    lo  han  enseñado  mis  mayores.  Tu  función  es  cumplirla,  no    cuestionarla,  ¡y  esto  no  se  discute  más!  Si  no  lo  haces,  ten-    drás todo mi rechazo, mi desprecio y mi castigo...!»   Esta  característica  del  culpador  es  precisamente  un  com-    ponente fundamental de la culpa disfuncional .   Lo  repetimos  una  vez  más:  el  culpador  cree  que  la  norma    que  defiende  es  eterna  y  no  le  reconoce  al  culpado  el  dere-    cho  a  estar  en  desacuerdo  con  ella  y  querer  cambiarla.  Siga-    mos  con  el  ejemplo  de  la  hija  mujer  que  quiere  vivir  sola:   s[   dentro  de  ella   la  norma  «No  te  irás  de  la  casa  de  tus  padres    antes  de  casarte»  quedó  cristalizada,  como  consecuencia    de  las  acusaciones  surgidas  de  esa  pauta  interior  que  quiere    perpetuarse sentirá con culpa sus deseos de mudarse.   Lo  que  acabamos  de  presentar  es  la  relación  entre  el  cul-    pador  y  el  culpado  cuando  ambos  no  coinciden  en  la  acep-    tación  del  código  establecido.  En  este  caso  es  un  código  de    66 \n                    normas  cristalizado,  pero  también  existe  la  posibilidad  de    que  el  culpado  no  quiera  aceptar  determinada  norma  —no    necesariamente  arcaica  y  cristalizada—  y  que  luego  de  un    debate  entre  ambos  comprenda  que  su  aceptación  es  bene-    ficiosa.   La  tercera  variante  es  lo  que  ocurre  entre  ellos  cuando    ambos  sí  coinciden  en  la  aceptación  de  las  normas  que  los    rigen, y es lo que veremos a continuación.   Relación culpador-culpado   Cuando  ambos  coinciden  en  la  norma,  comienza  a  ad-    quirir  relevancia  el  modo  en  el  que  el  culpador  le  informa  al    culpado  de  que  la  ha  transgredido.  Lo  interesante  de  esta  si-    tuación  es  que  no  existe  una  sola  forma  de  informar,  sino    que,  por  el  contrario,  existen  varias  maneras  de  hacerlo.    Vamos  a  ilustrar  esta  idea  con  un  ejemplo.  A  fin  de  com-    prenderlo  mejor  es  necesario  aclarar  previamente  que  he    desarrollado  un  método  clínico  para  intentar  resolver  el  sen-    timiento  de  culpa.  Consiste  en  una  serie  de  pasos,  de  donde    se  han  obtenido  precisamente  las  respuestas  que  se  citan  en    este  capítulo.  Al  final  del  mismo  se  incluirá  una  versión    adaptada  de  dicha  propuesta  para  que  el  lector  interesado    pueda realizar su propia indagación personal.   Volviendo  ahora  al  ejemplo  concreto,  digamos  que  exis-    te  la  posibilidad  de  convocar,  a  través  de  consignas  específi-    cas,  al  culpador  y  al  culpado,  y  de  estimular  al  primero  para    que  le  diga  al  segundo  de  qué  lo  culpa  y  de  observar  cómo    lo  hace.  Vamos  a  transcribir  a  continuación  la  experiencia    de  Corina,  de  treinta  y  nueve  años,  que  estaba  atravesando    un proceso de separación matrimonial:     67 \n                    Culpador:    «Yo  te  acuso  de  haber  estado  con  Raúl  mien-    tras  lo  necesitaste  y  ahora  quieres  separarte  aunque  sabes    que  él  te  necesita.  Tú  sabes  que  él  está  sufriendo  y  se  siente    solo  como  un  perro.  Siento  desprecio  y  odio  hacia  ti,  y  lo    que  te  hago,  y  seguiré  haciendo,  es  torturarte  mentalmente    para  que  sepas  que  eres  mala,  indigna,  y  no  te  dejaré  que    seas feliz con ningún otro hombre.»   Cuando  se  le  propuso  al  culpador  que  informara  al  cul-    pado  acerca  de  cuál  era  la  norma  que  había  sido  transgredi-    da,  le  dijo:  «La  norma  que  has  transgredido  es  la  que  dice    que no se debe abandonar a quien te necesita.»   Una  vez  que  el  culpador  se  hubo  expresado,  se  invitó  a    Corina  a  que  tomara  el  lugar  del  aspecto  culpado  y  observa-    ra qué sentía al escucharlo.   Culpado:    «Lo  que  siento  es  un  gran  dolor  que  me  asfixia    y  me  oprime  el  corazón.  Siento  que  me  estoy  muriendo.  Si    no  dejas  de  torturarme  me  volveré  loca.  Ya  no  puedo  distin-    guir  qué  es  lo  adecuado  y  qué  es  lo  me  corresponde,  o  no.    Yo  sé  que  no  está  bien  abandonar  a  Raúl  si  él  me  necesita,    pero  siento  que  me  estás  pidiendo  que  me  inmole,  y  no    quiero  eso.  Haces  que  me  sienta  muy  confusa  y  no  sé  qué    hacer.»   La  vivencia  que  tiene  quien  experimenta  un  tipo  de  cul-    pa  como  el  de  Corina  es  de  intenso  sufrimiento  crónico:  ti-    roneo  interior,  malestar,  agobio,  y  la  certeza  de  que  seguirá    sintiéndose  mal  no  importa  lo  que  haga.  Prueba  un  camino    en  el  que  actúa  como  la  voz  culpadora  le  reclama,  y  enton-    ces  trata  de  continuar  la  convivencia  con  Raúl.  Durante  un    tiempo  la  otra  voz  interior  queda  acallada  y  ella  parece  ha-    ber  encontrado  una  sensación  de  bienestar  y  una  salida  sa-    tisfactoria  para  su  conflicto.  Pero  lo  que  está  acallado  acu-    mula  malestar,  y  un  buen  día  siente  que  ya  no  soporta  que    68 \n                    su  deseo  de  separación  siga  relegado  y  comienza  a  expre-    sarlo  y  actuarlo.  Y  vuelve  a  ocurrir  lo  mismo:  al  principio,    mientras  toda  ella  queda  tomada  por  esa  decisión,  se  siente    satisfecha  e  íntegra.  Hasta  que  la  voz  culpadora,  que  había    estado  silenciada  durante  un  tiempo,  vuelve  a  hacerse  sentir    y nuevamente se instalan el dolor y el no saber qué hacer...   Y  así  la  actitud  pendular  continúa,  confundiéndola  cada    vez más, a ella misma y a quienes la rodean.   Éste  es  el  tipo  de  culpa  que  la  gran  mayoría  de  las  perso-    nas  siente ,  aunque  las  anécdotas  particulares  sean,  obvia-    mente,  distintas  en  cada  caso.  Esto  es  también  lo  que  ali-    menta  la  creencia  generalizada  según  la  cual  la  culpa  es,  en    su  naturaleza  misma,  una  agónica  tortura  sin  remedio,    como una verdadera maldición .   Vale  la  pena,  pues,  repetirlo  una  vez  más:  las  característi-    cas  torturadoras  no  son  inherentes  a  la  culpa  en  sí,  sino  a  su    forma  disfuncional,  de  la  cual  precisamente  el  caso  de  Cori-    na es un ejemplo prototípico.   ¿Y  en  qué  consiste  su  disfuncionalidad?  En  que  el  modo    que  el  culpador  tiene  de  informarle  al  culpado  que  ha  trans-    gredido  una  de  las  normas  que  los  rige  produce  más  dolor,    más  confusión  y,  fundamentalmente,  no  instrumenta  al  cul-    pado  para  producir  una  nueva  conducta  que  repare  la  situa-    ción  y  restablezca  el  equilibrio .  En  este  caso,  restablecer  el    equilibrio  quiere  decir  producir  una  acción  que  contemple,    por  una  parte,  las  necesidades  de  Corina  de  separarse  de    Raúl,  y  por  otra,  las  características  del  código  de  normas    que Corina ha aceptado para sí.     69 \n                    La culpa disfuncional   Para  comprender  a  fondo  la  naturaleza  de  la  culpa  dis-    funcional  y  poder  transformarla  en  funcional  es  necesario    reconocer  un  punto  crucial:  el  propósito  esencial  del  culpa-    dor  no  es  torturar  al  culpado  sino  lograr  que  actúe  de  acuer-    do con las pautas del código interior que los rige .   Las  formas  a  través  de  las  cuales  lo  hace  son  precisamen-    te  eso:  formas.  Algunas  resultan  funcionales  y  otras  dis-    funcionales,  según  las  respuestas  que  provoquen  en  el    culpado.   Las  formas  disfuncionales  más  frecuentes  son  la  descali-    ficación y el castigo.   La  descalificación  significa  que  el  culpador  le  dice  al  cul-    pado  que  él  ha  transgredido  esa  pauta  porque  es  malo   en    cualquiera  de  sus  formas:  egoísta,  desconsiderado,  perver-    so,  brutal,  etc.  Aquí  se  suman  todos  los  agravios  e  insultos    que  uno  pueda  imaginar:  hijo  de  p...,  degenerado,  perverti-    do,  basura,  etc.  El  castigo,  como  su  nombre  lo  indica,  signi-    fica  provocarle  intencionalmente  al  culpado  un  sufrimiento    determinado .  En  el  ejemplo  de  Corina  era:  «Te  torturaré    mentalmente  y  no  dejaré  que  seas  feliz  con  otro  hombre»,    pero  todos  sabemos  que  no  son  las  únicas  formas  de  casti-    go.  Las  que  se  oyen  más  a  menudo  en  la  práctica  clínica    son:  «Te  despreciaré,  no  mereces  vivir,  te  haré  ver  una  y  otra    vez  todos  los  errores  que  has  cometido,  te  dejaré  solo,  nun-    ca te sentirás contento y satisfecho», etc.   Como  uno  puede  imaginar  a  través  de  estos  ejemplos,  los    efectos  psicológicos  de  la  descalificación  y  el  castigo  son    verdaderamente devastadores.   A  modo  de  resumen  podemos  decir  que  éstos  son  los  tres    componentes  básicos  de  la  culpa  disfuncional:   la  cristaliza-    70 \n                    ción  del  código  que  no  se  deja  modificar  por  las  nuevas  cir-    cunstancias  y  la  descalificación  y  el  castigo  como  forma  ha-    bitual  de  tratar  al  aspecto  culpado  cada  vez  que  transgrede    una norma.   El nuevo interrogante que se plantea es:   ¿Por qué el culpador descalifica y castiga   al culpado?   Existen  varias  respuestas  a  esta  pregunta,  y  según  cuál    sea  aquella  que  se  considere  válida  será  también  la  forma    de abordar el sentimiento de culpa.   Algunas  corrientes  psicológicas  afirman  que  la  causa    fundamental  es  la  hostilidad  básica  del  culpador  hacia  el    culpado  porque  cada  uno  representa  fuerzas  en  oposición    natural  (el  culpador,  las  normas,  y  el  culpado,  los  impulsos),    que  entre  ambos  se  libra   un    combate  permanente  porque    cada  uno  está  «luchando  por  su  vida»,  y  aunque  entre  ellos    puedan  producirse  temporarios  momentos  de  síntesis,  la  at-    mósfera  de  antagonismo  profundo,  que  está  en  la  base  de    ese vínculo, se activa una y otra vez.   Otras  corrientes,  en  cambio  (las  psicologías  humanistas    entre  ellas),  afirman  que  la  relación  entre  el  impulso  y  la    norma  es  esencialmente  complementaria  y  que  su  antago-    nismo  es  superficial .  Dicho  antagonismo  se  produce  por  el    desconocimiento  que  cada  uno  experimenta  de  su  condi-    ción  de  complementario  esencial.  Esta  desconexión  es  la    que  los  hace  percibirse  como  exclusivamente  antagónicos,    y  la  tarea  asistencial  consiste  precisamente  en  ayudarlos  a    recuperar  su  percepción  de  socios  desempeñando  funcio-    nes complementarias .     71 \n                    Dentro  de  esta  línea  de  pensamiento  se  inscribe  la  pro-    puesta que estamos presentando.   Además  del  desconocimiento  de  su  carácter  de  com-    plementario,  en  el  culpador  existe  otra  ignorancia  igual-    mente  significativa:  cómo  expresar  sus  desacuerdos  con  el    culpado.   La  descalificación  y  el  castigo  son  dos  manifestaciones    de  esa  ignorancia  emocional  en  el  modo  de  expresar  un  de-    sacuerdo .   La  descalificación  consiste  en  confundir  el  impacto  que    un  estímulo  produce  sobre  mí  con  lo  que  ese  estímulo  es.    Las  frases  que  mejor  resumen  esta  confusión  son:  «Si  me    frustra,  es  malo»;  «Si  me  desagrada,  es  desagradable»;  «Si    estoy  en  desacuerdo  contigo,  no  sirves »,  etc.  Esta  forma  de    inmadurez  psicológica  trasciende  por  completo  el  tema  de  la    culpa  e  impregna,  perturbándolas  en  gran  medida,  nuestras    interacciones cotidianas.   La  otra  creencia  equivocada  del  culpador  es  confundir    enojo  con  castigo  y  utilizarlo,  además,  como  forma  de  ense-    ñanza.   Estamos  tan  habituados  a  considerar  el  enojo  y  el  castigo    como  sinónimos  que  vale  la  pena  destinar  unas  líneas  a  dis-    criminarlos:  Expresar  el  enojo  como  enojo  es  que  el  culpa-    dor  le  diga  al  culpado:  «¡Estoy  muy  enojado  contigo  porque    quieres  separarte  ¡y  te  exijo  que  no  lo  hagas!»  Eso  es  enojo    como tal.   El  castigo  se  centra  en  el  daño  intencional:  «¡Te  torturaré    mentalmente y no te dejaré en paz ni un segundo!»   Cuando,  además,  se  le  atribuye  al  castigo  la  cualidad  de    recurso de enseñanza, se añade el «¡Así aprenderás!».   Esta  sucesión  de  distorsiones  confunde  mucho  al  culpa-    do,  porque  lo  que  recibe  son  ataques  que  lo  dañan  y  sin  em-    72 \n                    bargo  le  dicen  que  están  enseñándole,  lo  cual  produce  en  él    desorganización y resentimiento.   Cuando  el  culpador  y  el  culpado  arrastran  largos  perío-    dos  de  maltrato  recíproco,  van  generando  efectivamente    una  atmósfera  de  antagonismo  entre  ellos.  Ante  cualquier    nueva  transgresión,  el  culpador  maltrata,  una  vez  más,  al    culpado  por  lo  que  hizo,  y  el  culpado  se  opone  y  contraataca    más  allá  del  tema  concreto  que  estén  debatiendo  en  ese  mo-    mento .  Se  instala  entre  ellos  una  lucha  personal  y  el  tema  es    dirimir  quién  se  impone.  Ésta  es  la  causa  psicológica  pro-    funda  de  las  transgresiones  crónicas  y  la  oposición  sistemá-    tica.  Es  lo  que  habitualmente  se  llama  «el  rebelde  sin  causa»    o  «el  rebelde  por  la  rebeldía  misma».  Pero  como  expresa-    mos  anteriormente,  este  antagonismo  no  es  esencial  sino  se-    cundario .   Existe  abundante  evidencia  clínica  que  muestra  que    cuando  el  culpador  realiza  el  aprendizaje  que  le  permite  re-    conocer  el  error  de  la  descalificación  y  el  castigo,  abandona    progresivamente  dichas  reacciones  y  desarrolla  la  capaci-    dad  de  expresar  su  desacuerdo  con  el  culpado  de  un  modo    que  no  lo  agravia  y  que,  además,  lo  instrumenta .  Instrumen-    tarlo  significa  aquí  generar  las  condiciones  que  permitan  al    culpado  producir  una  respuesta  nueva  que,  además  de  satis-    facer  sus  necesidades,  respete  las  pautas  del  código  interior    que ambos han aceptado que los rija.   Esto  puede  ocurrir  porque  la  función  esencial  del  culpa-    dor  no  es  injuriar  y  castigar  al  culpado  cuando  ha  transgredi-    do  una  norma,  sino  restablecer  el  respeto  al  código .  A  partir    del  momento  en  que  aprende  a  hacerlo  sin  dañar  al  culpado,    lo  incorpora  progresivamente,  porque  en  ese  cambio  no  re-    nuncia  a  ninguna  función  esencial   sino  que,  por  el  contrario,    le permite llevarla a cabo de modo más adecuado y eficaz.     73 \n                    Si  resumiéramos  este  proceso  en  una  frase  podríamos  de-    cir  que  el  culpador  aprende  a  dejar  de  ser  un  culpador  que    descalifica  y  castiga  para  convertirse  en  un  culpador  que  en-    seña .   Una  vez  despejada  esta  incógnita,  la  próxima  pregunta    que se desprende es:   ¿Cómo aprende el culpador a enseñar?   Aquí  se  agrega  otro  componente  de  extraordinaria  signi-    ficación  clínica  y  de  equiparable  sencillez:  su  aprendizaje    comienza  cuando  en  el  curso  de  la  indagación  guiada  se  le    propone  que  le  pregunte  al  culpado:  ¿De  qué  modo  necesi-    tas  que  te  informe  que  has  transgredido  el  código  cada  vez    que  lo  haces,  para  sentirte  verdaderamente  ayudado  por  mí?    Y  cuando,  luego  de  formular  la  pregunta,  se  dispone  a  escu-    char  lo  que  el  culpado  descubre  y  le  responde,  y  continúan    con  este  diálogo  todo  el  tiempo  que  sea  necesario,  hasta  al-    canzar un acuerdo que los deje satisfechos a ambos.   Solemos  creer  que  el  diálogo  sólo  existe  entre  dos  o  más    individuos.  Aún  no  estamos  habituados  a  reconocer  y  perci-    bir,  con  la  misma  claridad,  el  diálogo  que  existe  entre  dos    partes  de  la  misma  persona.  Por  lo  tanto,  tampoco  estamos    familiarizados  con  la  importancia  que  tiene  la  pregunta  que    un  aspecto  le  formula  a  otro  como  recurso  facilitador  del    descubrimiento  y  el  aprendizaje .  Tal  vez  estemos  todavía    muy  influidos  por  las  creencias  que  estableció  el  psicoanáli-    sis  en  relación  con  el  autoengaño  y  la  resistencia  como  mo-    dalidades  intrínsecas  de  la  dinámica  psicológica  intraperso-    nal.  Cuando  se  trasciende  la  concepción  que  afirma  que  el    descubrimiento  está  impedido  por  resistencias  y  se  com-    74 \n                    prueba  que  los  factores  más  importantes  que  lo  impiden  son    —tal  como  sostienen  las  corrientes  más  modernas  de  las    psicologías  humanistas—  la  ignorancia,  la  confusión  y  los    «déficits»  en  la  comunicación  intrapersonal,  se  abre  una    nueva  puerta  de  operatoria  psicológica  que  produce  una  ver-    dadera revolución en el campo de la clínica.   En  el  caso  de  Corina,  ante  la  pregunta  del  culpador  acer-    ca  de  qué  necesitaba,  el  aspecto  culpado  respondió:  «Yo  sé    que  no  está  bien  abandonar  a  quien  me  necesita,  que  en    este  caso  es  Raúl,  pero  tal  vez  haya  otras  maneras  de  acom-    pañarlo  y  ayudarlo  sin  tener  que  seguir  conviviendo  con  él,    porque  ya  no  soporto  la  situación  y,  al  final,  terminaría  da-    ñándolo  aún  más.  No  me  digas  que  soy  una  persona  indigna    por  querer  separarme...  Yo  acepto  el  que  me  adviertas  que  es    necesario  hacer  algo,  pero,  por  favor,  no  me  insultes  ni  me    maldigas,  porque  eso  me  desequilibra  todavía  más...  Lo  que    necesito  de  ti  es  que  comprendas  que  yo  también  soy  un  ser    humano,  que  también  tengo  necesidades;  que  me  mires  con    respeto,  con  afecto,  que  me  tengas  en  cuenta  y  me  ayudes  a    ver  qué  puedo  hacer,  a  encontrar  el  modo  de  que  yo  tam-    bién pueda sentirme bien...»   Por  supuesto  que  el  hecho  de  decirlo  no  garantiza  la    transformación  inmediata  del  trato  del  culpador,  pero  es  e|    inevitable  primer  paso ,  y  en  la  medida  en  que  el  diálogo    interior  continúa,  la  experiencia  clínica  muestra  que  las    posiciones  se  van  acercando  hasta  alcanzar,  en  un  tiempo    variable,  un  acuerdo  satisfactorio  para  ambos.  En  nuestro    ejemplo  el  acuerdo  fue  legitimar  el  deseo  de  Corina  de  se-    pararse,  y  también  la  necesidad  de  acompañar  a  Raúl,  pero    hacerlo sin necesidad de convivir con él.   El  tiempo  que  necesitan  para  alcanzar  un  acuerdo  de-    pende de:     75 \n                    a) El  grado  de  rigidez  del  código  y  la  posibilidad  del  cul-    pador  de  aceptar  las  modificaciones  que  se  revelen  como    necesarias sobre dicho código.    b) La  posibilidad  del  culpador  de  comprender  el  error    que  está  presente  en  el  enjuiciar  y  también  en  la  utilización    del castigo como forma de enseñarle algo al culpado.    c) El  tiempo  que  necesiten  ambos  para  reconocer  algo    obvio  y,  sin  embargo,  no  reconocido  por  ellos:  que  no  son    «enemigos  esenciales» ,  que  son    «tripulantes  del  mismo    bote»,  funciones  complementarias  de  la  misma  unidad  cuya    tarea  es  reconocer  la  transgresión  de  alguna  norma  y  poner    en  marcha  la  respuesta  que  lo  reequilibre.  Por  lo  tanto,  un    aspecto no puede sentirse bien si el otro no lo está.    Esta  conciencia  de  ser  partes  de  una  unidad  mayor,  tan    simple,  tan  obvia  y  tan  fundamental,  es  uno  de  los  pilares    sobre  los  que  se  afirma  y  motoriza  el  proceso  de  construc-    ción de acuerdos satisfactorios entre ambos .   El cambio de las normas   En  las  culpas  disfuncionales  es  frecuente  observar  que  la    norma,  tal  como  la  registra  y  presenta  el  culpador,  tiene  algo    de  rígido,  absoluto  y  muy  general.  El  caso  de  Corina  es  muy    útil  para  ilustrarlo:  «No  se  debe  abandonar  a  quien  te  nece-    sita.»  ¿Qué  quiere  decir  exactamente  eso?  Yo  puedo,  por    ejemplo,  convivir  y  sin  embargo  abandonar,  y  también  pue-    do  no  convivir  y  acompañar  muy  de  cerca,  emocionalmen-    te,  a  esa  persona...  entre  otras  tantas  variables  y  matices  di-    ferentes de ese mismo precepto general.     76 \n                    Veamos algunos otros ejemplos:   «Debes  hacer  felices  a  tus  padres;  debes  anteponer  las    necesidades  de  los  otros  a  las  tuyas;  debes  esforzarte  al  má-    ximo  para  ser  perfecto;  debes  continuar  las  tradiciones  fami-    liares;  debes  comportarte  normalmente  y  no  producir  con-    fusión en los demás», etc.   La  tarea  que  el  culpador  y  el  culpado  necesitan  realizar    es  precisamente  contextualizar,  flexibilizar  y  darle  más  pre-    cisión  a  la  norma   en  cuestión.  Cuando  Corina  lo  hizo  com-    prendió  que  es  posible  «no  abandonar  a  quien  te  necesita»    sin tener, por ello, que convivir con él.   En  los  otros  ejemplos  se  puede  intuir  cuál  es  la  contex-    tualización  necesaria:  ¿En  qué  casos  la  norma  es  válida  y    posible  y  en  cuáles  no?  ¿Cuáles  son  sus  excepciones?   ¿Cómo  actuar  ante  cada  excepción?  ¿Cuál  es  la  esencia  de    la  norma  y  cuál  es  la  forma  a  través  de  la  cual  se  la  intenta    aplicar?  ¿Cómo  se  puede  respetar  la  esencia,  adecuando  la    forma a la situación particular que se está viviendo?   Exploraremos  esto  a  través  del  primero  de  los  ejemplos  ci-    tados: «Debes hacer felices a tus padres.»   Esa  formulación  es  inobjetable  como  expresión  de  de-    seos,  pero  ¿es  realizable  como  mandato  de  una  norma?  Dado    su  carácter  masivo  y  absoluto,  lo  más  probable  es  que  no  lo    sea.  Por  lo  tanto,  es  necesario  diferenciar  «norma»,  de  «ex-    presión  de  deseos»,  y  esa  labor  quien  mejor  la  puede  realizar    es  el  culpado,  pues  es  el  encargado  de  llevar  a  cabo  las  tareas    que  permitirán  cumplimentardicha  norma .  Lograr  esa  discri-    minación  termina  siendo  un  aporte  para  el  culpador  pues  lo    ayuda  a  producir  normas  que  verdaderamente  pueden  cum-    plirse, componente fundamental en la eficiencia de una norma.   En  la  medida  en  que  el  culpado  consigue  conectarse    consigo  mismo  puede  dar  información  útil  sobre  cada  nor-    77 \n                    ma  que  se  debate.  En  este  caso  si  lo  pusiéramos  en  una  fra-    se,  ésta  podría  ser:  «Yo  también  deseo  que  mis  padres  sean    felices,  pero  me  doy  cuenta  de  que  lo  sean  o  no  depende  de    múltiples  factores,  muchos  de  los  cuales  están  fuera  de  mi    jurisdicción.  Por  lo  tanto,  te  propongo  que  cambiemos  esa    norma  por  otra  que,  teniendo  en  cuenta  esa  realidad  y  mis    propias  posibilidades,  diga:  \"Harás  todo  lo  que  te  sea  posi-    ble  para  contribuir  a  la  felicidad  de  tus  padres,  hasta  donde    ellos puedan experimentarla.\"»    La  esencia  de  la  norma,  que  es  el  interés  por  la  felicidad    de  los  padres,  se  mantiene;  lo  que  cambia  es  la  forma  a  tra-    vés  de  la  cual  se  la  expresa.  Este  cambio  de  forma  incluye    dos  componentes  fundamentales:   a)    reconoce  la  importan-    cia  de  que  la  norma  pueda  ser  cumplida  por  el  culpado ,  y   b)   desplaza  el  énfasis  puesto  sobre  un  particular  y  único  resul-    tado  final  («Debes  hacer  felices...»),  con  toda  la  rigidez  que    eso  conlleva,  y  lo  ubica  más  cerca  del  «intento  por  alcan-    zarlo»  («Lo  posible  para  contribuir  a...»),  lo  cual  agrega  una    cuota  de  flexibilidad  más  afín  con  la  naturaleza  misma  de  la    experiencia humana.   Esto es contextualizar y flexibilizar la norma.    Cuando  el  culpado  está  en  desacuerdo  con  una  norma,    este  desacuerdo  suele  hallarse  vinculado  con  algún  compo-    nente  rígido  de  dicha  norma.  Por  lo  tanto,  el  desacuerdo  se    resuelve  enriqueciendo  la  norma  anterior  más  que  destru-    yéndola por completo y poniendo otra en su lugar .   La  idea  de  destruirla  y  sustituirla  drásticamente  es  justa-    mente  la  que  tiende  a  activar  el  antagonismo  entre  el  culpa-    dor  y  el  culpado.  En  cambio,  la  comprensión  de  la  posibili-    dad  de  enriquecerla  captando  su  esencia  y  flexibilizando  su    forma  es  lo  que  contribuye  a  la  producción  de  una  nueva    norma aceptada por ambos.     78 \n                    En  estos  tiempos  en  los  que  los  cambios  de  modos  de  vida    ocurren  de  forma  tan  acelerada  es  especialmente  necesario    desarrollar  la  capacidad  psicológica  de  registrar  la  norma    que «hasta ahora regía» y de enriquecerla, actualizándola.   El  logro  de  esta  tarea  significa  la  resolución  de  una  de  las    causas más frecuentes de la culpa disfuncional.   El aprendizaje del culpado   Hasta  ahora  nos  hemos  referido  al  aprendizaje  que  nece-    sita  realizar  el  culpador,  pero  es  obvio  que  el  culpado  no    está  exento  de  dicha  tarea,  y  eso  es  lo  que  describiremos  a    continuación.   Antes  de  presentar  esta  descripción  conviene  aclarar  que    el  aprendizaje  se  realiza  siempre,  en  última  instancia,  en  la    relación  culpador-culpado,  aunque  cada  uno  participe  en    un  grado  variable.  La  presentación  de  cada  protagonista  de    forma  separada  responde  fundamentalmente  a  una  necesi-    dad didáctica.   Hecha  esta  aclaración,  digamos  que  el  aprendizaje  fun-    damental  que  necesita  realizar  el  culpado  es  que  el  código    que  el  culpador  preserva,  si  bien  por  momentos  pone  límite    a  sus  movimientos,  y  puede  resultarle  molesto,  en  lo  profun-    do  también  lo  protege  a  él.  Es  equivalente  a  cualquier  ley  y,    en  su  forma  más  simple,  a  lo  que  ocurre  con  el  sistema  de    semáforos:  si  bien  cuando  se  pone  en  rojo  y  tenemos  prisa    la  espera  resulta  frustrante  y  fastidiosa,  esa  luz  roja  no  es  un    mero  estorbo  que  nos  limita,  sino,  desde  una  perspectiva    más  vasta,  es  precisamente  lo  que  nos  posibilita  desplazar-    nos  en  medio  del  tráfico  y  llegar  a  destino.  Es  decir,  el  semá-    foro, aunque a veces nos demore, también nos protege.     79 \n                    Cuando  el  culpado  ha  comprendido  esto,  reconoce  la    necesidad  del  código  de  normas  y  de  que  exista  una  función    que se ocupe de informarle cada vez que lo ha transgredido .   Tal  comprensión  genera  una  mejor  disposición  hacia  el    culpador,  lo  cual  significa  que  se  torna  más  sensible  a  sus    señales  y,  por  lo  tanto,  puede  hacer  correcciones  con  mayor    anticipación, antes de que «la sangre llegue al río».   Es  un  hecho  reconocido  por  el  sentido  común  y  muy  uti-    lizado  en  medicina  preventiva  que  cuanto  más  rápido  es  el    registro  del  error,  más  sencilla  es  la  corrección  y  menores    los daños a reparar.   El  culpado  tiene  que  aprender  también  que  es  él  mismo    quien  mejor  conoce  el  modo  en  que  necesita  que  el  culpa-    dor  le  informe.  Por  lo  tanto,  se  requiere  que  sea  lo  suficien-    temente  sensible  para  detectar,  momento  a  momento,  cuál    es  ese  modo,  e  informárselo  al  culpador  para  que  éste,  a  su    vez,  pueda  adecuar  su  expresión  al  lenguaje  más  compren-    sible para el culpado.   Conviene  recordar  que  esta  secuencia,  que  quizá  parez-    ca  un  vínculo  idílico  y  utópico  de  ciencia  ficción,  es  lo  que    realizan  las  millones  de  células  en  su  continuo  proceso    de  adecuación  recíproca .  Esta  capacidad  es  la  que  posibili-    ta,  en  última  instancia,  el  funcionamiento  del  organismo    como tal.   La  ley  que  rige  ese  proceso  trasciende  la  voluntad  perso-    nal,  es  lo  que  en  lo  profundo  nos  constituye,  y  es,  sencilla-    mente, la sabiduría del amor.   Cuando  el  culpador  y  el  culpado  reconocen  que  están    impregnados  por  esa  energía  constitutiva  básica,  y  que  en    esencia  son  socios  complementarios,  encuentran  que  Ja    adecuación  recíproca,  más  que  un  vínculo  idílico  utópico,    imposible  de  realizar,  es  un  modo  de  relacionarse  que  le s    80 \n                    corresponde  por  derecho  natural,  que  necesitan  y  pueden    reencontrar, reconstruir y disfrutar.   A  continuación  incluimos  una  serie  de  preguntas  formula-    das  en  seminarios  sobre  la  culpa  que  completan  el  desarro-    llo de este tema.   A mí me hacen sentir culpable los otros,   especialmente mi esposa...   Cuando  una  persona  nos  «culpabiliza»  por  algo,  experi-    mentamos  en  efecto  el  sentimiento  de  culpa  correspondien-    te  sólo  en  la  medida  en  que  esa  acusación  cuente  con  la  voz    interior  culpadora  que  sea  la  réplica  del  culpador  externo,    en este caso tu esposa.   Si  alguien  me  detiene  por  la  calle  y  me  acusa  de  ser  la    causa  de  todas  sus  desdichas,  y  yo  registro  claramente  que    es  la  primera  vez  que  veo  a  esa  persona  y  que,  por  lo  tanto,    no  soy  el  culpable  de  lo  que  me  atribuye,  esa  acusación  no    encontrará  resonancia  en  mí  y  no  me  sentiré  culpable  por  lo    que  se  me  dice.  Si  yo  tuviera,  frente  a  la  acusación  que  me    culpabiliza  por  parte  de  cualquier  persona  del  mundo  exter-    no,  la  misma  claridad  y  certeza  que  tengo  en  relación  con    ese  desconocido  que  se  me  acerca  en  la  calle,  seguramente    no reaccionaría sintiéndome culpable.   De  modo  que  cuando  decimos:  «Fulano  hace  que  me    sienta  culpable»,  en  el  fondo  lo  que  estamos  diciendo  es:    «Fulano  me  acusa  de  lo  mismo  que  me  acusa  mi  culpador    interior.»     81 \n                    ¿Todos sentimos la culpa del mismo modo?   La  señal  que  emite  el  culpador  y  la  reacción  del  culpado    pueden  expresarse  de  muy  diferentes  maneras,  pero  su  di-    versidad  puede  ser  agrupable  en  tres  modos  básicos:  el  físi-    co,  el  emocional  y  el  mental.  Cuando  aparece  exclusiva-    mente  como  sensación  física  lo  hace  a  través  de  algún  dolor    corporal,  sobre  todo  dolor  de  cabeza  y  sensaciones  de  opre-    sión  en  el  pecho.  Cuando  aparece  como  emoción  es  ese    sentimiento  de  dolor,  desasosiego,  arrepentimiento  y  ago-    bio,  que  es  el  típico  «sentimiento  de  culpa»;  y  en  su  forma    mental  se  expresa  a  través  de  las  autoacusaciones  y  los  auto-    rreproches.  Lo  más  frecuente  es  que  estos  modos  se  expre-    sen de forma simultánea o sucesiva.   ¿Todos los autorreproches producen culpa?   El  autorreproche  es  el  sustento  mental  de  la  culpa  disfun-    cional  cuando  lo  que  nos  reprochamos  es  no  haber  cumpli-    do una norma de nuestro código interno.   Pero  hay  autorreproches  producidos  por  otras  causas  no    vinculadas  al  código  moral  personal:  puedo  autorreprochar-    me  por  haber  fallado  en  algo  y  no  haber  logrado  un  deseo:    me  retrasé  y  perdí  el  avión,  me  olvidé  de  un  tema  y  me  re-    probaron  en  un  examen,  me  comporté  de  forma  inadecuada    en  una  cita  y  me  rechazaron,  etc.  Eso  es  simplemente  auto-    rreproche,  y  el  dolor  que  produce  está  vinculado  a  la  sensa-    ción  de  torpeza  o  fracaso,  pero  no  es  el  dolor  de  la  culpa.    82 \n                    ¿La actitud transgresora es un valor?    La  actitud  transgresora  no  es  ni  un  valor  ni  un  disvalor,    sino  una  descripción  incompleta  e  insuficiente  de  una  con-    ducta.   En  tiempo  solía  decirse:  «Es  una  obra  transgresora»  como    sinónimo de comentario elogioso sobre dicha obra.   No  existe  la  transgresión  en  abstracto,  siempre  se  trans-    grede  algo.  Por  lo  tanto,  no  basta  con  decir  que  una  obra  es    transgresora.  Para  saber  si  una  obra  (o  cualquier  otra  con-    ducta)  transgresora  es  valiosa  o  no,  es  necesario  incluir  cuál    es  la  ley  o  la  norma  que  transgrede.  Sólo  cuando  conozca-    mos  la  norma  transgredida  estaremos  en  condiciones  de  sa-    ber si transgredirla es o no un aporte valioso.   Y  una  vez  que  conozcamos  la  norma  nos  centraremos  en    el  modo  en  que  se  la  transgrede.  Por  más  arcaica  que  sea    una  pauta,  el  solo  hecho  de  transgredirla  no  significa   per  se    que la mejore   INDAGACIÓN PERSONAL    Si  usted  está  experimentando  un  sentimiento  de  culpa  tor-    turador  y  crónico,  le  propongo  que  realice  la  siguiente  indaga-    ción personal:   Instálese  cómodamente  y  concédase  unos  minutos  de  inti-    midad  para  formularse  algunas  preguntas  y  disponerse  a    aprender de las respuestas que surjan.   Dirija  su  atención  hacia  su  interior  y  trate  de  completar  la    siguiente  frase:  «La  culpa  que  siento  es  como  si  una  voz  inte-    rior me acusara de...»   Una  vez  que  ha  escuchado  y  reconocido  esa  voz  interior    83 \n                      84  culpadora,  conviértase  en  ella  por  unos  instantes  y,  siendo    esa  voz  culpadora,  déjela  fluir  con  la  mayor  libertad  que  pue-    da  y  dígale  al  aspecto  culpado,  como  si  lo  tuviera  delante  de    usted:   a)  «De lo que te acuso es...»    b)  «Lo que siento hacia ti por lo que has hecho es...»    c)  «Y mi modo de castigarte —en caso de hacerlo— es...»    d) «La norma que has transgredido es la que dice que...»    En  un  gran  número  de  personas  el  mero  hecho  de  poner  en    palabras  la  norma  que  está  rigiendo  comienza  a  ordenar  la  si-    tuación  porque  permite  sacar  a  la  luz  y  ver  con  claridad  cuál    es  el  código  que  está  imperando .  Por  esta  razón  es  importante    que  logre  definir  con  la  mayor  precisión  posible  el  contenido    de la norma en juego.   Una  vez  que  haya  completado  los  cuatro  pasos,  póngase    en  el  lugar  del  aspecto  culpado,  registre  qué  siente  al  oír  lo    que  se  le  ha  dicho  y  observe  desde  allí  si  está  de  acuerdo  o  no    con  esa  norma.  En  caso  de  que  no  lo  esté,  dispóngase  a  debatir    con el culpador acerca de ella hasta que alcancen un acuerdo.   A  menudo  el  culpador  experimenta  algún  sentimiento  de  do-    minación,  autoritarismo  o  poder  sobre  el  culpado,  como  si  se    sintiera  «el  que  manda».  Si  eso  le  ocurre  a  su  culpador,  recuer-    de  que  el  culpado  tiene  derecho  a  proponer  cambios  en  las  nor-    mas,  que  es  un  socio  del  culpador   y  que  cada  uno  cumple  una    función  complementaria;  por  lo  tanto,  este  debate  interior  será    de  «igual  a  igual»,  en  el  que  aquel  lo  que  gravitará  en  la  discusión    serán  los  argumentos  y  razones  de  cada  uno  y  no  algún  principio    de autoridad esgrimido por el culpador.   Procure  que  el  diálogo  continúe  hasta  que  alcancen  un    acuerdo  que  ambos  puedan  suscribir,  lo  que  implica  que  cada    uno  sienta  con  claridad  que  no  hay  sometimiento  en  su  acep- \n                    tación  sino  el  reconocimiento  de  que  la  norma  que  han  cons-    truido es realizable, deseable y necesaria .   Recuerde  que  en  cada  norma  suele  haber  un  núcleo  esen-    cial   que  ambos  comparten  y  que  la  tarea  a  realizar  consiste    muchas  veces  en  actualizar  la  forma   a  través  de  la  cual  trata  de    aplicarse  dicho  núcleo,  como  para  que  dé  cabida  también  a    las  necesidades  presentadas  como  legítimas  por  el  aspecto    culpado.   Cuando  ha  alcanzado  este  acuerdo  interior,  que  siempre  es    posible ,  teniendo  en  cuenta  especialmente  que  se  trata  de  dos    aspectos  de  la  misma  unidad,  de  «dos  tripulantes  del  mismo    bote»,  ya  están  dadas  las  condiciones  para  abordar  el  segundo    tema  de  este  problema,  tarea  que  le  corresponde  iniciar  al  as-    pecto culpado.   Trate  de  ponerse  en  su  lugar,  una  vez  más,  y  convirtiéndose    en  él  comuníquele  al  culpador  de  qué  modo  necesita  que  él  le    informe  de  que  ha  transgredido  una  norma  cada  vez  que  esto    sucede, para sentir verdaderamente que él lo ayuda.   Una  vez  que  lo  ha  descubierto  y  comunicado,  póngase,  otra    vez,  en  el  lugar  del  aspecto  culpador,  escuche  lo  que  el  culpado    acaba  de  decirle,  y  hágalo  tratando  de  recordar  que  su  función    esencial  no  es  torturar  al  culpado  por  sus  transgresiones  sino  ayu-    darlo  a  instrumentarse  para  estar  en  condiciones  de  respetar  las    normas que ambos han convenido que los rijan.   Si  usted  ha
