conseguido  identificar  a  su  aspecto  culpado  y  a    su  aspecto  culpador  y  ha  logrado,  además,  desplegar  el  diálogo    entre  ambos  poniéndose  en  el  lugar  de  cada  uno,  seguramente    encontrará  que  ha  dado  un  paso  importante  y  significativo  en    la  resolución  del  sufrimiento  que  produce  la  autotortura  impo-    tente de la culpa disfuncional.             85 \n                    C   U   A   T   R   O          EXIGENCIA Y EXCELENCIA    ¿La exigencia es una actitud que merece ser alentada    en tanto mueve hacia la excelencia, o por el contrario,    sólo tortura a quien la padece y no conduce a la    excelencia que aspira a promover?        86 \n                    «¡Yo  soy  muy  exigente,  conmigo  mismo  y  con  los  de-    más...!»   Quien  se  expresa  así  suele  hacerlo  en  un  tono  de  orgullo    y  satisfacción,  como  si  estuviera  diciendo  implícitamente:    «Yo  valoro  la  excelencia  y  ésa  es  mi  meta,  para  mí  mismo  y    para con los demás...!»   Esto  significa  que  le  atribuye  a  la  exigencia  la  cualidad    de ser el camino y la garantía de la excelencia.   La  creencia  sobre  la  que  se  apoya  este  tipo  de  afirmación    es:    a)    si  realmente  quiere  lograr  la  excelencia,  entonces    debe ser exigente.   Y  también  su  contrapartida:   b)    si  es  exigente,  entonces  su    resultado será obtener excelencia.   Pero  ¿es  realmente  así?  ¿Es  la  exigencia  un  rasgo  que  me-    rece  ser  alentado  en  tanto  actúa  moviendo  a  la  persona  ha-    cia  la  excelencia,  o,  por  el  contrario,  se  trata  de  una  actitud    inadecuada  que  tortura  a  quien  la  padece  y  no  produce  la    excelencia que aspira a promover?   El  propósito  de  estas  reflexiones  es  precisamente  intentar    aclarar  esa  incógnita  y  presentar  un  análisis  de  la  estructura    de la exigencia y sus implicaciones.     87 \n                    Estructura de la exigencia   En  realidad  la  exigencia  es  el  nombre  de  una  calidad  de    relación:  la  que  existe  entre  un  exigidor  y  un  exigido .  Utili-    zo  el  término  «exigidor»  para  describir  mejor  su  calidad  de    agente  activo  de  ese  vínculo,  pero  la  palabra  que  define  ha-    bitualmente  ese  papel  es  «exigente».  De  modo  que  exigente    y  exigidor  son  presentados  como  sinónimos  y  se  utilizarán    indistintamente.   La  exigencia  puede  manifestarse  en  el  universo  interper-    sonal,  es  decir  en  la  relación  entre  dos  o  más  personas,  o  en    el  espacio  ¡ntrapersonal,  en  la  relación  de  uno  consigo  mis-    mo.  Para  expresar  esta  idea  de  forma  aún  más  precisa,  cuan-    do  la  exigencia  se  presenta  lo  hace  en  ambos  espacios  si-    multáneamente  aunque  la  persona  pueda  percibirlo  con    más claridad en uno solo de ellos.   «¡Yo  soy  exigente  conmigo  mismo,  pero  no  lo  soy  con  los    demás...!»   «¡Él  exige  a  los  otros,  pero  no  se  exige  a  sí  mismo  de    igual modo...!»   Es  frecuente  oír  frases  como  éstas,  pero  es  necesario  re-    conocer  que  la  verdad  que  expresan  es  muy  parcial.  Al  ob-    servar  con  detenimiento  a  la  persona  en  cuestión  se  com-    prueba  que  cuando  la  pauta  de  exigencia  existe,  opera  en    ambas  direcciones  —hacia  los  otros  y  hacia  uno  mismo—    aunque  las  áreas  sobre  las  que  recaiga  no  sean  igualmente    evidentes a simple vista.     88 \n                    Protagonistas   La  estructura  de  la  exigencia  está  constituida  por  tres  pro-    tagonistas.  Dos  ya  han  sido  mencionados:  el  exígidor  y  el    exigido.  El  tercer  componente  está  implícito  en  ese  vínculo,    pero  vale  la  pena  hacerlo  explícito  para  comprender  mejor    la  dinámica  de  esa  relación,  y  es  la  meta   que  el  exigente  le    demanda alcanzar al exigido.   Cuando  en  la  práctica  clínica  se  indaga  esta  actitud  ac-    tuando  sobre  sí  mismo,  una  manera  eficaz  y  rápida  de  iden-    tificar  a  estos  tres  componentes  es  ayudando  al  consultante    a que complete las siguientes frases:   a)  «Yo me exijo ser...»    b)  «Y en cambio me siento...»    Las  respuestas  más  frecuentes  a  la  primera  pregunta  son:    «Yo  me  exijo  ser....  rápido,  brillante,  vital,  simpático,  atracti-    vo,  seguro,  decidido,  perfecto...»  Si  bien  éstas  son  las  res-    puestas  más  habituales,  aquí  caben,  por  supuesto,  todas  las    características  que  la  persona  considere  valiosas  para  sí.  De    este  modo  se  descubre  cuáles  son  las  metas  específicas  que    el aspecto exigente reclama.   Cuando  se  responde  a  la  segunda  pregunta,  surgen  en    general  los  rasgos  opuestos:  «Lento,  torpe,  desvitalizado,  in-    seguro, dependiente, imperfecto», etc.   De  esta  forma  se  logra  descubrir,  con  relativa  sencillez,    las  características  del  aspecto  exigido,  es  decir  del  aspecto    sobre el cual recae la actitud exigente.   Una  vez  que  se  han  alcanzado  estos  descubrimientos,  se    han  sentado  las  bases  para  intentar  conocer  un  aspecto  fun-    damental  de  esta  estructura:  ¿de  qué  modo  el  exigidor  trata    al exigido para alcanzar las metas que demanda ?     89 \n                    Relación exigente-exigido   Una  de  las  características  más  notables  de  este  vínculo  es    que  el  exigidor  no  suele  darse  cuenta  de!  modo  en  que  trata    al  exigido  y,  en  especial  (y  esto  es  tal  vez  lo  más  importante)    del  efecto  que  produce  en  el  aspecto  exigido  el  trato  que  le    brinda .   El  aspecto  exigente  no  lo  advierte  porque  su  percepción    está  completamente  tomada  por  la  meta,  es  decir,  todo  lo    que  él  registra  es  que  hay  que  alcanzarla,  que  «hay  que  lle-    gar  allá  como  sea».  El  estado  en  que  se  encuentra  el  realiza-    dor,  quien  es,  en  última  instancia,  el  encargado  de  hacerla    efectiva, no es percibido por el exigidor.   Una  sencilla  metáfora  que  ilustra  esta  relación  es  la  del    jinete  y  el  caballo.  El  aspecto  exigente  es  como  el  jinete  que    quiere  llegar  hasta  una  colina  que  le  atrae  y  que  se  encuen-    tra  a  unos  kilómetros  de  distancia.  Se  siente  tan  atraído  por    esa  meta  que  deja  de  percibir  a  su  caballo  (que  representa    aquí  el  papel  de  exigido).  El  jinete  no  mira  si  éste  tiene  ham-    bre  o  sed  o  está  cansado.  Inicia  su  galope  dando  por  senta-    do   que  su  caballo  se  halla  en  condiciones  de  llegar  y  que    sólo está esperando sus indicaciones para hacerlo.   La creencia del exigente   El  exigente  cree  que  para  alcanzar  un  resultado  basta  con    desearlo  intensamente  y  demandar  con  fuerza  al  encargado    de  realizarlo  para  que  efectivamente  lo  logre.  Es  lo  que  sue-    le llamarse «voluntarismo».   La  frase  que  mejor  resume  esa  creencia  es:  «Querer  es    poder.»     90 \n                    Esta  conclusión  está  muy  difundida  en  nuestra  cultura  y    llega  a  tal  punto  la  confusión  existente  en  torno  a  ella  que    algunas  corrientes  psicológicas  instan  a  las  personas  a    que  reconozcan  que  si  no  consiguen  algo  no  es  porque  no    pueden sino porque no quieren .   Ante  tal  confusión  puede  resultar  útil  examinar  detalla-    damente cuáles son las diferencias entre querer y poder.   Querer  significa  orientar  la  energía,  la  fuerza,  la  inten-    ción,  en  una  dirección  determinada.  Poder,  en  cambio,  alu-    de  a  la  disponibilidad  de  los  recursos  adecuados  para  reali-    zar esa intención.   El  querer  es  equivalente  al  combustible  del  motor  de  un    automóvil.  El  poder  es  como  el  resto  de  las  piezas  de  dicho    coche  que  permiten  transformar  la  energía  del  combustible    en movimiento.   En  el  caso  del  vehículo  la  diferencia  puede  percibirse    con  mucha  claridad  pero  para  hacer  más  evidente  aún  el    error  del  aspecto  exigente,  es  como  si  éste  creyera  que  es  su-    ficiente  con  llenar  el  depósito  de  gasolina  y  sentarse  al  vo-    lante para poder desplazarse.   Ámbitos de validez de la exigencia   La  mayor  parte  de  las  creencias  equivocadas  suelen  ser  el    resultado  de  una  generalización  de  ciertas  características    que  tienen  validez  en  ámbitos  acotados.  Veamos  en  este    caso en qué áreas funciona el «querer es poder».   Si  deseo  extender  mi  brazo,  girar  la  cabeza  o  pestañear,    etc.,  sólo  bastará  con  que  me  lo  proponga  y  la  orden  mental    estimulará  a  tal  fin  los  músculos  adecuados.  Estamos  tan  ha-    bituados  a  ese  tipo  de  secuencia  que  evaluamos  que  para    91 \n                    los  movimientos  musculares  «querer  es  poder».  Y  en  cierto    sentido  es  así,  pues  de  acuerdo  con  nuestra  experiencia  bas-    ta  con  que  nos  lo  propongamos  para  lograr  hacerlo.  Estamos    tan  acostumbrados  a  que  ocurra  de  ese  modo  que  nos  pare-    ce  algo  natural,  siempre  presente,  que  «viene  con  uno».  Lo    que  necesitamos  recordar  es  que  podemos  girar  la  cabeza,    por  ejemplo,  porque  contamos  con  el  equipo  que  lo  posibi-    lita .  Basta  con  que  exista  alguna  disfunción  neurológica  o    cualquier  alteración  en  la  zona  del  cuello  para  que  no  poda-    mos  hacerlo,  y  nos  recuerde,  a  veces  dolorosa  y  dramática-    mente, este otro componente de la realidad.   Así  como  la  musculatura  suele  estar  disponible  en  la  ma-    yoría  de  las  personas  para  realizar  los  movimientos  que  se  le    indican,  existen  individuos,  ya  sea  dotados  de  nacimiento  o    entrenados  previamente  en  alguna  actividad,  que,  al  contar    con  el  equipo  necesario,  están  en  condiciones  de  efectuar  la    tarea  que  se  les  indica,  a  voluntad .  Puede  tratarse  tanto  de    un  músico  que  toca  y  canta  de  oído  o  un  operario  que  cono-    ce  el  funcionamiento  de  su  máquina  y  puede  realizar  la  ta-    rea  que  se  le  indica,  o  un  deportista  a  quien  se  le  demanda    que  corra  diez  kilómetros  en  determinado  tiempo,  y  lo  lleva    a cabo, etc.   En  cualquiera  de  estos  casos,  basta  con  que  la  persona  se    lo  proponga  para  que  pueda  hacerlo.  Aquí  parecería  que    también se cumple el «querer es poder».   El  problema  surge  cuando,  al  contar  con  un  equipo  que    responde  eficazmente  y  en  forma  habitual  a  las  instruccio-    nes  que  le  damos,  creemos  que  ese  equipo  estará  siempre    disponible   para  realizar  las  instrucciones  recibidas,  y  más    aún  cuando  cualquiera  de  estas  personas  extiende  la  misma    ley  de  «querer  es  poder»  a  otras  áreas  de  su  experiencia  y    actividad  humana.  Cuando  esto  ocurre  se  exige  también  ser    92 \n                    seguro  o  independiente,  por  ejemplo  en  su  relación  de  pare-    ja.  Como  todos  sabemos,  tal  clase  de  vínculo  está  regida  por    otras  leyes:  las  que  corresponden  al  universo  emocional.  No    sólo  puede  exigirse  a  sí  mismo  sino  a  otros:  su  hijo  llega  con    la  libreta  de  calificaciones  y  él  le  dice:  «¡El  próximo  trimes-    tre tienes que mejorar tus notas!»   Y  es  interesante  destacar  que  él  cree  en  ambos  casos  que    esas  demandas  son  recursos  suficientes  para  obtener  el  re-    sultado deseado .   Ampliaremos esta noción.   Ámbitos donde la exigencia no funciona   Para  comprender  mejor  los  errores  de  la  exigencia  pre-    sentaremos  una  breve  recapitulación  de  las  ideas  centrales    de este trabajo.   En  toda  actividad,  por  más  sencilla  que  sea,  existe  un    programador  y  un  realizador.  El  programador  es  quien  dise-    ña  y  coordina  la  acción.  En  la  metáfora  jinete-caballo  es  el    jinete  quien  dice  dónde  ir  y  cómo  hacerlo.  El  realizador,    como  su  nombre  lo  indica,  es  el  encargado  de  llevar  a  cabo    la  acción  encomendada.  En  la  metáfora  jinete-caballo  está    representado  por  el  caballo,  que  transforma  en  movimiento    las instrucciones del jinete.   Existen,  además  de  ésta,  otras  metáforas  que  ilustran  esa    sociedad  fundamental  que  es  la  relación  programador-reali-    zador. Veamos algunas de ellas:   El arquitecto-el obrero.   El entrenador-el jugador.   El jefe-el empleado.     93 \n                    El oficial-el soldado.   El padre-el hijo.   Etc.   Como  puede  comprobarse,  en  todos  los  ejemplos  existe    un  papel  de  estratega  que  dice  qué  y  cómo  hacer  determi-    nada  cosa  y  otro  de  realizador  que  lleva  a  cabo  la  tarea  en-    comendada.   La  relación  exigente-exigido  es  una  forma  particular  de    la  relación  programador-realizador,  y  el  aspecto  exigente    expresa  un  modo  inmaduro  y  disfuncional  del  papel  de  pro-    gramador .   Los  rasgos  que  caracterizan  al  aspecto  exigente  son:   a)   tiene  una  meta,  quiere  alcanzarla  y  da  por  sentado  que  su    propósito  es  legítimo  y  adecuado;   b)    por  lo  tanto  cree  que    no  es  necesario  consultar  al  realizador  acerca  de  si  compar-    te o no esa meta. Es decir, él se siente el amo y percibe al rea-   lizador  como  su  esclavo,  como  alguien  sin  derecho  a  tener    vida  propia  y  cuya  función  es  estar  siempre  en  condiciones    de cumplir las órdenes que él le da, y c) cree que para que el   realizador  alcance  la  meta  que  le  exige  es  suficiente  con    que se lo demande imperiosamente.   Cuando  el  realizador  es  el  músculo  que  hace  girar  la  ca-    beza,  el  papel  del  músculo  se  parece  bastante  a  lo  que  el    programador  exigente  imagina.  Digo  «bastante»  porque,    como  expresamos  anteriormente,  basta  con  que  exista  cual-    quier  alteración  en  la  musculatura  del  cuello  para  que  la  si-    tuación cambie por completo.   Esto,  que  sólo  ocurre  cuando  la  musculatura  está  altera-    da,  es  lo  que  sucede  siempre  cuando  el  papel  de  realizador    lo  cumple  una  estructura  más  compleja  y  con  evidente  vida    propia,  ya  sea  un  aspecto  psicológico  de  sí  mismo,  como  el    94 \n                    aspecto  realizador,  o  una  persona  o  un  grupo  de  personas.    Es  en  estos  casos  cuando  más  se  pone  en  evidencia  lo  ina-    decuado que resulta la actitud exigente.   Exigir y proponer   El  hecho  de  exigir,  como  el  de  «dar  órdenes»  o  «deman-    dar  imperiosamente»,  se  caracteriza  por  excluir  el  «no»    como  posibilidad  legítima  de  respuesta.  Si  digo:  «Te  exijo    que  vengas  de  inmediato»,  estoy  diciéndole,  implícitamen-    te,  a  mi  interlocutor,  que  su  respuesta  debe  ser  «sí  o  sí».  En    caso  de  que  no  lo  haga  y  la  contestación  sea  negativa,  ya  es-    tará iniciando una confrontación de oposición conmigo.   «Proponer»,  al  igual  que  «pedir»  o  «preguntar»,  en  cam-    bio,  señalan  que  le  reconozco  a  mi  interlocutor  el  derecho  a    decir  «no» ,  y  que  el  diálogo  continuará,  si  ésa  fuera  su  res-    puesta, sin la cualidad de desobediencia o antagonismo.   Cuando  el  aspecto  exigido  no  tiene  la  claridad  ni  la  fuer-    za  suficientes  para  oponerse  y  decir  «no»  a  la  demanda  del    exigente,  se  produce  en  él  la  respuesta  de  sometimiento  su-    perficial  y  de  resentimiento  profundo  que,  inevitablemente,    se  manifestará,  de  forma  sutil  al  comienzo  y,  si  no  se  resuel-    ve, de un modo cada vez más ostensible y explosivo.   Ejemplo   La  mejor  forma  de  mostrar  la  intimidad  de  la  exigencia  es    a  través  de  un  ejemplo:  Elena  (cuarenta  y  tres  años)  consulta    por una actitud de autoexigencia que la tortura y paraliza.   Cada  uno  de  nosotros  alberga,  en  mayor  o  menor  medi-    95 \n                    da,  un  vínculo  exigente-exigido  interior  similar  al  de  Elena.    Por  esta  razón  puede  resultar  útil  leer  los  diálogos  que  se    transcribirán  y  confrontarlos  vivencialmente  con  el  propio    vínculo  exigido-exigidor,  para  conocer  mejor  sus  semejan-    zas y diferencias.   Cuando  se  invita  a  Elena  a  que  describa  cómo  se  exige    ser, ella responde:   Elena:    Yo  me  exijo  ser  perfecta,  no  tiene  que  haber  un    gramo  de  equivocación,  tiene  que  ser  todo  muy  maravilloso    para que todo el mundo me admire y aplauda lo que hago...   Terapeuta:  ¿Y cómo te sientes en cambio?   Elena:  Me siento insegura, apocada, lenta, ineficaz...   De  este  modo  ya  están  caracterizados  la  meta  del  aspec-    to  exigente  y  el  estado  del  aspecto  exigido.  Sólo  entonces  es    posible  explorar  cómo  se  relaciona  el  aspecto  exigente  con    el exigido.   Terapeuta:    Imagina  que  esa  Elena  insegura,  lenta,  etc.,  es-    tuviera  enfrente  de  ti...  Toma  contacto  con  ese  aspecto  exi-    gente  que  le  demanda  que  ella  sea  perfecta  y,  siendo  ese  as-    pecto,  hablale.  ¿Cómo  es  tu  modo  de  exigirle?  Si  le  pudieras    hablar ahora, ¿qué le dirías?   Aspecto  exigente:   ¡Me  das  asco!  ¡No  sirves  para  nada!    ¡Ya  he  dicho  muchas  veces  que  tienes  que  ser  perfecta  y  efi-    ciente.  Y  voy  a  hacer  que  espabiles  y  voy  a  repetirte  todo  el    día estas palabras hasta que las entiendas!   Ésta  es  la  típica  actitud  del  aspecto  exigente  sobre  el  exi-    gido.  En  la  medida  en  que  el  propósito  que  lo  absorbe  por    completo  es  alcanzar  la  meta,  no  logra  tener  en  cuenta  el  es-     96 \n                    tado  del  «obrero»  (el  caballo  de  la  metáfora)  que  la  tiene  que    realizar.  Él  percibe  al  realizador  como  un  mero  instrumento    para  alcanzar  la  meta  deseada.  Este  orden  de  prioridades  en    el  que  la  meta  ocupa  un  primerísimo  lugar  y  el  realizador  un    lejano  segundo  plano  es  una  de  las  características  más  espe-    cíficas y prototípicas de la actitud exigente .   Las  frases  populares  que  habitualmente  expresan  esta    modalidad  son:  «¡Hay  que  ganar  como  sea!;  ¡Lo  lograre-    mos, cueste lo que cueste!; ¡El fin justifica los medios!», etc.   Algo  que  ocurre  con  esta  actitud  y  que  suele  confundir  la    evaluación  que  se  hace  de  ella  es  que  da  resultado  a  corto    plazo .  Efectivamente,  el  caballo  llega  a  la  colina,  el  depor-    tista  obtiene  las  marcas  que  le  demandan...  en  suma,  el  exi-    gido  responde  a  las  órdenes  del  exigente,  lo  cual  le  confir-    ma  a  éste  que  su  método  es  adecuado  y  eficaz.  Pero  en  la    medida  en  que  el  estado  de  quien  realiza  la  obra  —en  ese    sentido,  el  obrero—  no  es  contemplado,  su  condición,  ine-    xorablemente,  se  va  deteriorando,  por  lo  que  cada  vez  rinde    menos.  En  esta  secuencia,  el  director  técnico  queda  perple-    jo  al  observar  que  el  rendimiento  de  su  deportista  se  resien-    te,  y  desde  la  creencia  en  la  que  se  apoya  responde  intensifi-    cando  su  exigencia,  es  decir  incrementando  lo  que  hacía    previamente...  ¡y  daba  tan  buenos  resultados!  Así  se  inicia    un  círculo  vicioso  de  desencuentro  y  malestar  que  en  el  me-    jor  de  los  casos  termina  con  esa  relación.  De  mantenerse    ese  vínculo  en  las  mismas  condiciones,  el  deportista  se  verá    seriamente  afectado,  muchas  veces  de  forma  irreversible.    ¿Y  qué  le  ocurre  íntimamente  a  quien  vive  el  papel  de  exigi-    do, ya sea una persona o un aspecto interior?   Lo  que  recibe  son  órdenes  a  las  que  no  puede  cuestionar    abierta  y  libremente.  Por  lo  tanto,  en  lo  externo  se  somete    y en lo interno acumula malestar, enojo y resentimiento.     97 \n                    Dado  que,  además,  no  puede  opinar  y  descubrir,  momento    a  momento,  qué  es  lo  que  necesita,  va  perdiendo  esa  capa-    cidad  por  falta  de  ejercitación  y  por  la  turbulencia  interior    que  genera  en  él  esa  mezcla  tan  particular  y  explosiva  que    es el sometimiento y el enojo acumulado.   «Él  dice  que  no  quiere  recibir  más  órdenes,  pero  cuando    le  pregunto  qué  quiere  hacer,  o  no  sabe  o  dice  vaguedades    sin  sentido.  Entonces  no  tengo  más  remedio  que  seguir  dán-    dole  órdenes...»,  expresa  con  bastante  frecuencia  quien    adopta  el  papel  de  exigente,  ya  sea  desde  la  función  de  pa-    dre,  director  técnico,  jefe,  etc.  Esta  conclusión  es  verdadera-    mente  lapidaria  para  el  exigido  y  se  sostiene  en  la  verdad,    aunque  muy  parcial,  que  encierra,  pues  si  bien  es  cierto  que    el  exigido  no  sabe  o  se  equivoca  más  de  la  cuenta  cuando    decide,  lo  que  el  exigente  no  registra  es  que  el  exigido  está    saliendo  del   knockout.    Está  iniciando  su  fase  de  recupera-    ción y necesita tiempo para recobrar la claridad perdida.   Veamos  ahora  cómo  se  presenta  esto  en  el  aspecto  exigi-    do de Elena.   Terapeuta  a  aspecto  exigido:   ¿Cómo  te  sientes  cuando    oyes  que  eres  una  inútil  y  que  va  a  repetirte  todo  el  día  sus    órdenes hasta que entiendas?   Aspecto exigido:  Me abrumo y me hundo cada vez más...   Esta  respuesta  parece  muy  obvia  y  la  gran  mayoría  de  los    lectores  podría  fácilmente  anticiparla,  pero  sin  embargo,  el    aspecto  exigente  no  suele  darse  cuenta  del  efecto  que  pro-    duce  sobre  el  exigido  el  modo  en  el  que  lo  trata.  Es  por  esta    razón  por  lo  que  es  muy  útil  crear  un  diseño  operativo  en  el    que  el  aspecto  exigido  pueda  autopercibirse,  expresar  su    reacción y lograr que su voz sea escuchada por el exigente .     98 \n                    Terapeuta  a  aspecto  exigido:   Ella  —el  aspecto  exigen-    te—  ha  dicho  que  quiere  que  seas  perfecta...  y  que  todos  te    aplaudan. ¿Tú también quieres ser así?   Aspecto exigido:  Yo ya no sé lo que quiero...   T.: ¿Así como estás te sientes bien, te sientes satisfecha?   A. e.: No, así no me siento bien.   T.:  ¿Y  de  qué  modo  imaginas  que  te  sentirías  mejor,  más    satisfecha contigo misma?   A.  e.:  Por  supuesto  que  me  gustaría  sentirme  más  tranqui-    la,  más  segura  en  lo  que  hago  y,  sobre  todo,  menos  presio-    nada.   Después  de  tantas  órdenes,  reclamos  y  presiones,  el  as-    pecto  exigido  va  perdiendo,  en  efecto,  la  capacidad  de  sa-    ber  qué  quiere,  lo  cual  perturba  seriamente  su  funciona-    miento.  No  obstante,  en  la  mayor  parte  de  los  casos  puede    recuperarla  en  la  medida  en  que  se  le  dé  tiempo  y  estímulo    en  una  atmósfera  psicológica  de  respeto.  Por  esta  razón  es    necesario  preguntar  tantas  veces  como  haga  falta  (como  se    observa  en  Elena)  hasta  que  poco  a  poco  va  recobrando  su    sensibilidad,  su  vitalidad  y  su  posibilidad  de  registrar  su  pro-    pia  meta,  su  propio  deseo,  aunque  al  principio  aparezca  de    una  forma  muy  vaga  y  general.  Pero  es  un  primer  paso    de gran valor para los descubrimientos siguientes.   Terapeuta  a  aspecto  exigido:   ¿Cómo  necesitarías  que  ella    te tratase y te hablase para sentirte así?   Aspecto  exigido:   No  lo  sé;  todo  lo  que  conozco  son  órde-    nes,  desde  siempre,  que  nunca  he  cuestionado...,  y  ahora  ten-    go  mucha  rabia,  quiero  explotar,  quiero  desobedecer,  quiero    portarme  mal,  pero  sé  que  después  voy  a  sentirme  mucho    peor... De modo que no sé qué hacer ni qué necesito...     99 \n                    T.:  Tú  sientes  que  no  sabes  qué  necesitas,  pero  por  lo  me-    nos  sabes  lo  que  no  necesitas,  lo  que  te  daña,  porque  aca-    bas  de  decir  que  cuando  te  repite  una  y  otra  vez  las  mismas    órdenes,  sientes  que  te  hundes  cada  vez  más...  Si  los  sacu-    dones te dañan... ¿qué imaginas que te haría bien recibir?   A.  e.:  Bueno,  para  empezar,  que  no  me  sacuda,  que  me    tenga  en  cuenta,  que  me  mire,  que  sepa  que  existo,  que    me consulte...   Aquí  se  repite  lo  mismo:  el  no  saber  qué  necesita  recibir,    junto  con  el  miedo,  el  resentimiento  y  la  confusión  que  es    su consecuencia.   También  se  puede  comprobar  cómo,  en  la  medida  en    que  se  la  ayuda  por  medio  de  preguntas  orientadoras,  poco    a  poco  va  descubriendo  no  sólo  cómo  quiere  sentirse,  sino    qué trato interior necesita recibir para poder alcanzarlo.   Lo  que  el  aspecto  exigido  de  Elena  descubre  es  el  reflejo    de  lo  que  todos  los  aspectos  exigidos  expresan  que,  en  esen-    cia,  necesitan:  que  se  los  consulte  para  la  elección  de  la    meta, que se los tenga en cuenta en su estado y se los respete    y  comprenda  en  sus  necesidades .  En  suma,  todo  esto  signifi-    ca  ser  reconocido  como  alguien  con  vida  propia,  que  cum-    ple  funciones  específicas  (realizar)  y  a  quien  le  asiste  el  dere-    cho  de  ser  considerado  como  un  socio  igualitario  y  no  como    un  súbdito  cuya  única  función  es  estar  en  condiciones  de    obedecer y cumplir con las órdenes que se le imparten.   Aprendizaje del aspecto exigente   ¿Y  cómo  aprende  el  exigente  la  nueva   actitud  que  el   as-   pecto exigido necesita y le propone?     100 \n                    Primero,  teniendo  la  oportunidad  de  conocer  y  escuchar    al  aspecto  exigido,  lo  cual  le  ayuda  a  reconocer  que,  efecti-    vamente,  existe  como  un  ser  con  vida  propia.  Como  ya  lo  ex-    presamos  más  arriba,  y  vale  la  pena  repetir,  al  quedar  absor-    bido  por  la  meta  el  aspecto  exigente  no  registra  que,  al  igual    que  el  caballo  de  la  metáfora,  el  exigido  existe  y  requiere  que    se lo reconozca y respete.   Segundo,  poder  comprobar  con  la  contundencia  que  la    vivencia  brinda,  el  efecto  devastador  que  producen  sobre  el    aspecto  exigido,  sus  órdenes  y  demandas.  Es  decir,  corrobar    el aspecto ineficaz y destructivo de su actitud.   Tercero,  darse  cuenta  que  el  aspecto  exigido  no  es  su    súbdito  sino  su  socio  igualitario,  y  que  sólo  en  la  medida  en    que  se  encuentre  bien  podrán  realizarse  las  tareas  deseadas.    Por  lo  tanto,  invertir  interés  y  cuidado  en  el  estado  del  obre-    ro,  no  sólo  no  lo  aleja  de  la  meta  sino  que,  por  el  contrario,    es el camino más directo y eficaz para acercarse a ella .   Esto  implica  reconocer  que  ambos  son  «tripulantes  del    mismo  bote»,  compañeros  de  equipo  de  tareas,  y  que,  por    lo  tanto,  «yo  podré  sentirme  bien  sólo  si  tú  lo  estás».  Esa  ca-    lidad  de  comprensión  fue  denominada  por  el  Dalai  Lama    como  «egoísmo  altruista».  Quiere  decir  que  en  la  relación    entre  dos  partes  de  la  misma  unidad  no  existen  el  egoísmo  o    el  altruismo  como  opciones,  pues  el  bienestar  de  la  otra  par-    te,  del  «otro  tripulante»,  es  tan  importante  para  el  «tripulan-    te»  que  soy  como  mi  propio  bienestar.  Un  bienestar  depen-    de del otro y se gestan en la misma fragua .   Cuando  el  aspecto  exigente  llega  a  este  punto,  compren-    de  que  no  pierde  nada  en  el  cambio  que  el  aspecto  exigido    necesita,  que  es  todo  ganancia,  pues  si  bien  tiene  que  adies-    trarse  en  la  actitud  de  consultar,  proponer  y  respetar ,  lo  que    recobra  es  un  socio  cada  vez  más  sano  y  autónomo.  Este    101 \n                    nuevo  estado  posibilita  que  dicho  socio  realice  aportes  a  la    tarea  que  antes  no  podía  realizar.  Recupera  así  a  un  interlo-    cutor  jerarquizado  con  quien  debatir  y  construir  las  accio-    nes  más  adecuadas,  alguien,  además,  en  quien  poder  des-    cansar  y  con  quien  aprender  y  ejercitar  el  disfrute  de  la    cooperación y la solidaridad.   Y  cuarto,  para  este  aprendizaje  que  necesita  realizar  el    aspecto  exigente  resulta  muy  útil  la  presencia  de  un  modelo    que  le  muestre  cómo  es  la  actitud  de  formular  propuestas    respetuosamente,  pues  en  muchos  casos  el  aspecto  exigente    expresa  que  todo  lo  que  sabe  es  dar  órdenes  y  reclamar  re-    sultados .  Por  lo  tanto,  es  necesario  brindarle  toda  la  ayuda    que  requiera  para  que  ingrese  y  se  familiarice  con  esa  nueva    modalidad.   Cualquier  camino  que  facilite  tal  aprendizaje  será  útil  en    esta  tarea,  y,  por  otra  parte,  no  existe  un  solo  camino  para    lograrlo.  Presentaré  a  continuación  una  de  las  formas  posi-    bles;  es  la  que  utilizo  habitualmente  en  la  práctica  clínica  y    que he denominado: el rol de asistente interior .   Para  ello  retomaremos  el  trabajo  de  Elena,  cuando  el  as-    pecto  exigido  ya  ha  comenzado  a  descubrir  el  trato  que  ne-    cesitaría recibir del exigente en lugar del que recibe.   Terapeuta  a  aspecto  exigido:   Acabas  de  decir  que  necesi-    tarías  que  te  tenga  en  cuenta,  que  te  mire,  que  te  consulte...    ¿Podrías  ahondar  un  poco  más  en  eso?  Por  ejemplo,  ¿que  te    hable  y  te  trate  de  qué  modo?  Sé  lo  más  precisa  que  pue-    das...  Imagina  que  tuvieras  al  aspecto  exigente  enfrente  y  se    lo dijeras a él.   Aspecto  exigido:   Bien;  en  primer  lugar,  que  me  consultes    si  también  quiero  hacer  lo  que  tú  quieres  y  si  por  alguna  ra-    zón  no  quiero...  presta  atención  a  lo  que  me  pasa  y  trata  de    102 \n                    entenderme.  Ahora,  por  ejemplo,  estoy  agotada  y  necesito    descansar... No puedo ir a tope como me pides...   Cuando  evalué  que  el  aspecto  exigido  ya  había  alcanza-    do  una  claridad  razonable  en  relación  al  trato  interior  que    necesitaba recibir, le propuse avanzar un paso más...   Terapeuta a aspecto exigido:  Para que el aspecto exigen-   te  entienda  mejor  lo  que  estás  diciéndole,  desplázate  unos    centímetros  a  tu  derecha,  imagina  que  el  exigido  ha  queda-    do  a  la  izquierda  y  conviértete,  en  este  nuevo  lugar,  en  el  ser    que  le  habla  y  trata  al  aspecto  exigido  del  modo  en  que  él  ha    dicho que necesita...   Asistente  interior  a  aspecto  exigido:   Yo  entiendo  tu  dolor    y  tu  rabia  de  tantos  años  y  quiero  ayudarte  y  que  sepas  que    puedes  contar  conmigo.  Voy  a  prestar  atención  a  aquello    que  necesitas  y  voy  a  tratar  de  acompañarte,  no  lo  dudes.    Ten  confianza  en  mí;  yo  entiendo  tu  cansancio  y  sé  que  ne-    cesitas  tiempo  para  reponerte.  Quiero  que  sepas  que  confío    en  ti  y  sé  que  podrás  hacerlo.  Todo  lo  que  hagamos  lo  hare-    mos  de  común  acuerdo,  y  si  me  olvido  de  consultarte  algo,    dímelo, que estoy dispuesta a escucharte...   Terapeuta  a  asistente  interior:   Vuelvo  a  tomar  el  lugar    del  aspecto  exigido  para  saber  cómo  recibe  lo  que  le  has    dicho...   Aspecto  exigido:   Estoy  tan  poco  acostumbrada  a  que  me    hablen  así  que  me  parece  una  fantasía,  que  desaparecerás    de  un  momento  a  otro...  Me  conmueve  profundamente  todo    lo  que  me  dices.  Cuando  me  hablas  así  me  siento  bien  y    vuelvo  a  confiar.  Tengo  ganas  de  tenderme  y  mirar  hacia    arriba,  porque  siempre  estoy  mirando  hacia  abajo.  Me  sien-    to  muy  bien  porque  veo  que  existen  otras  posibilidades  para    103 \n                    mí.  Ya  no  me  siento  desahuciada.  Quisiera  que  estés  siem-    pre  conmigo  y  que  me  digas  «Aquí  estoy»  cada  vez,  que  no    desaparezcas...  Siento  un  alivio  tan  grande  que...,  bien,  me    gustaría que aparecieras más a menudo.   El  rol  de  asistente  interior  es  quien  brinda  aquí  el  modelo    necesitado.  Lo  más  interesante  y  significativo  de  esta  pro-    puesta  es  que  es  el  mismo  aspecto  exigido  quien  gesta  la    forma  específica  del  asistente .  Al  tomar  contacto  con  su  ne-    cesidad,  el  aspecto  exigido  descubre  simultáneamente  las    características  del  ser  que  podría  satisfacerlo.  Cuando  se  le    propone  a  Elena  que  encarne  a  ese  ser  imaginado  por  el  exi-    gido,  comienza  a  darle  realidad  y  a  descubrir  que  efectiva-    mente  existe  en  ella  como  una  actitud  posible  hacia  el  as-    pecto exigido.   Poder  experimentar  el  rol  de  asistente  interior  y  compro-    bar  el  efecto  transformador  que  tiene  sobre  el  aspecto  exigi-    do es profundamente curativo .   Además,  le  da  al  aspecto  exigente  la  posibilidad  de  ob-    servar  otra  respuesta  diferente  de  la  que  habitualmente  pro-    ducía  en  relación  con  el  exigido.  Al  comprobar  también  que    esa  nueva  actitud  produce  sobre  el  exigido  la  transforma-    ción  que  tanto  deseó  y  nunca  pudo  lograr,  se  activa  en  él    una  profunda  conmoción.  Dicha  conmoción  es  la  que  pre-    cede a su proceso de aprendizaje y transformación.   La  convocatoria  del  rol  de  asistente  interior,  la  posibili-    dad  de  cada  persona  de  plasmarlo  efectivamente  y  la  reac-    ción  posterior  del  aspecto  exigente  ante  dicho  rol  ofrece    muchísimas  variedades  y  alternativas  que  van  más  allá  del    tema  específico  de  la  exigencia.  El  lector  interesado  en  co-    nocerlas  puede  consultar  mi  libro   El  asistente  interior.   Aquí   se  presenta  una  de  sus  formas  a  los  efectos  de  mostrar  cómo    104 \n                    es una manera de brindarle al aspecto exigidor un modelo    de actitud no exigente y asistencial .   Exigencia y excelencia   La  excelencia  tiene  un  polo  objetivo  y  otro  subjetivo.  El    primero se refiere a la obra en sí y el segundo a la actitud que   pone  en  juego  quien  realiza  la  obra.  Nos  referiremos  ahora  al    polo subjetivo, a la actitud que tiende hacia la excelencia .   Podríamos  definir  dicha  actitud  como  el  cuidado  y  el  in-    terés en hacer las cosas del mejor modo posible.   Como  se  observa  en  la  definición,  tal  actitud  trasciende  a    cualquier  tarea  en  particular  y  puede  ser  tanto  el  modo  de    preparar  una  sencilla  comida  como  la  realización  de  una  la-    bor artística o científica de alta complejidad.   Una  vez  que  hemos  presentado  suscintamente  la  noción    de  excelencia  podemos  volver  a  formular  la  pregunta  del    comienzo:  ¿es  la  exigencia  un  camino  idóneo  para  alcanzar    la excelencia?   Parafraseando  el  dicho  popular  acerca  de  la  caridad:  la    excelencia bien entendida comienza por casa.   La  casa  más  íntima  es  la  propia  individualidad,  y  ¿cómo    es  la  relación  exigente-exigido  interior?  En  dicha  relación    no  hay,  por  cierto,  excelencia,  pues  si  bien  puede  producir    momentos  de  alto  rendimiento,  esos  momentos  no  se  auto-    sostienen  ni  se  retroalimentan.  Esto  es  así  porque  los  prota-    gonistas  del  vínculo  exigente-exigido  no  experimentan  una    relación  en  la  que  haya  bienestar,  aprendizaje  ni  crecimien-    to.  Por  lo  tanto,  el  alto  rendimiento  que  puedan  producir  se    parece  al  que  detona  una  droga  estimulante  del  tipo  de  la    anfetamina  o  la  cocaína.  Es  un  «latigazo»  fugaz,  que  des-    105 \n                    pués  de  la  acción  deja  a  los  protagonistas  sin  crecimiento  ni    aprendizaje y con un saldo de mayor deterioro.   Otro  efecto  nocivo  de  este  tipo  de  relación  es  que  produ-    ce  en  el  exigido  una  división  excluyente  entre  la  excelencia    y  el  disfrute.  «¡Qué  placer  poder  no  hacer  nada...  pero  ten-    go  que  hacer  este  trabajo  bien!»  Como  consecuencia  del    maltrato  del  exigente,  en  el  aspecto  exigido  queda  la  ima-    gen  del  bienestar  asociada  al  no  hacer  nada  y  la  excelencia    al  penoso  sobreesfuerzo  obligado.  Se  pierde  entonces  la    alegría de la excelencia.   La  relación  exigente-exigido,  por  lo  tanto,  no  puede  ser    la  base  de  una  actitud  que  tiende  hacia  la  excelencia  por-    que  ella  misma  está  caracterizada  por  el  maltrato  y  la  preca-    riedad en el modo en que se intenta lograrla.   Si  los  miembros  de  un  equipo  (interno  o  externo)  se  lle-    van  mal,  están  enemistados  o  albergan  tensiones  sin  resol-    ver,  no  pueden  contar  con  la  disposición  hacia  la  excelencia    en  la  tarea  que  realicen  pues  eso  es  lo  primero  que  se  pierde    cuando sus miembros están insatisfechos.   Resulta  evidente,  entonces,  que  si  la  actitud  hacia  la  ex-    celencia  no  tiene  el  sustento  del  disfrute,  el  aprendizaje  y  el    crecimiento, su fugacidad es inevitable .   La excelencia no es hija de la exigencia.   La  genuina  excelencia  es  resultado  de  un  estado  de  exce-    lencia interior.   La  excelencia  interior  significa  relaciones  internas  armó-    nicas,  respetuosas  y  fértiles.  En  este  caso  es  la  que  se  da    cuando  la  relación  exigente-exigido  se  transforma  en  asis-    tente-asistido con papeles dinámicos y alternativo.   En  este  marco  no  hay  división  entre  el  disfrute  y  la  tarea,    y  por  lo  tanto  el  rendimiento  es  sostenido  y  se  retroalimenta    en la experiencia de su propio disfrute.     106 \n                    Esto  no  significa  que  la  persona  producirá  siempre  el  má-    ximo   y  que  su  rendimiento  se  mantendrá  en  ese  nivel,  sino    que  producirá  su  máximo  posible,  momento  a  momento,  en    una  atmósfera  interior  de  bienestar  con  la  tarea  y  sin  consu-    mirse ni destruirse mientras la realiza.   En  los  últimos  años  se  está  manifestando,  cada  vez  más  a    menudo,  el  estado  de  agotamiento  psicológico   (burn  out)   y   el  síndrome  de  fatiga  crónica.  Es  oportuno  señalar  aquí  que    la  actitud  exigente  está  en  la  base  misma  de  estas  extendidas    y severas perturbaciones.   Cuando  entre  dos  (o  más)  que  se  asocian  para  hacer  algo    se  genera  una  actitud  de  interconsulta,  cooperación  y  reco-    nocimiento  del  aporte  de  cada  uno,  en  el  vínculo  que  se    gesta  se  produce  bienestar .  Dicho  bienestar  es  una  referen-    cia  de  medida  de  la  excelencia  alcanzada  en  el  funciona-    miento  de  ese  equipo.  Es  en  esta  atmósfera  psicológica  donde    crece  el  genuino  motor  de  la  excelencia,  que  es,  sencilla-    mente,  el  amor  hacia  ella .  Si  le  pusiéramos  palabras,  serían:    «Tiendo  a  la  excelencia  porque  la  amo,  y  la  amo  porque  co-    nozco  el  disfrute  que  experimento  cuando  participo  de  esa    cualidad...»   En  ese  disfrute  se  halla  presente  la  sensación  de  estar  sin-    tonizado  con  la  vida  y  reeditar  lo  que  ella  misma  —en  su    sentido  más  amplio—  hace:  crear,  manifestarse  en  obras,  y    desarrollarse, en nombre del Amor.   Es  curioso  y  lamentable  que  para  estimular  la  excelencia    suela  apelarse,  además  de  a  la  exigencia,  a  la  competencia:    «Es  necesario  aprender  a  hacer  las  cosas  de  un  modo  exce-    lente para poder competir, triunfar y ser los mejores.»   Alcanzar la excelencia para vencer.     107 \n                    Parecía  que  aún  no  se  confía  en  que  el  bienestar,  la  satis-    facción  y  la  alegría  que  la  excelencia  misma  produce  sean    un  estímulo  lo  suficientemente  poderoso  como  para  buscar-    la y encontrarla desde allí.   En  esta  distorsión  que  deja  de  lado  el  disfrute  que  existe    en  la  excelencia  y  sobrecarga  el  valor  del  triunfo  en  la  con-    frontación,  no  sólo  está  el  origen  de  muchos  de  los  trastor-    nos  de   stress    que  antes  mencionamos  sino  también  una  se-    ñal  que  nos  muestra  que  algo  importante  de  nuestra  calidad    de vida se está perdiendo...   Un  antiguo  texto  del  budismo  zen  dice  al  respecto:  «El    maestro,  en  el  arte  de  la  vida,  no  distingue  mucho  entre  su    trabajo  y  su  juego,  su  mente  y  su  cuerpo,  su  educación  y  su    recreación,  su  amor  y  su  religión;  apenas  distingue  cuál  es    cuál.  Simplemente  percibe  su  visión  de  la  excelencia  en    todo  lo  que  hace,  dejando  que  otros  decidan  si  él  está  ju-    gando  o  trabajando.  A  sus  propios  ojos  siempre  está  hacien-    do las dos cosas.»               INDAGACIÓN PERSONAL    Si  usted  padece  las  consecuencias  de  la  exigencia,  lo  invito    a  que  utilice  estas  reflexiones  como  una  herramienta  para  ex-    plorar y transformar dicho estado.   Lo  más  importante  es  que  usted  sepa  que  dicha  transforma-    ción es posible.   Los  pasos  de  la  tarea  a  realizar  son,  en  esencia,  los  mismos    que  recorrió  Elena,  porque  como  expresamos  antes,  todos  ex-    perimentamos,  en  grado  variable,  la  relación  interior  exigente-    exigido;  lo  que  cambia  es  la  forma  de  cada  personaje  y  la  cla-    se de relación que ambos establecen entre sí.     108 \n                      109  Realizar  entonces  esta  indagación  es,  precisamente,  descu-    brir  qué  forma  adopta  en  usted  ese  vínculo.    A modo de reseña, la secuencia es:   a)  Descubrir  cómo  se  exige  ser  y  cómo  se  siente,  en  cambio.    «Yo me exijo ser...»   «Y, en cambio, me siento...»   b)  Observar,  luego,  de  qué  modo  el  aspecto  exigente  le  exi-    ge al exigido ser como la meta.   c)    Vivenciar,  siendo  el  exigido,  qué  reacción  le  produce  di-    cho trato.   d)  Cotejar  si  la  meta  que  el  aspecto  exigente  tiene  para  el    exigido  coincide,  o  no,  con  la  que  el  exigido  tiene  para  sí  mis-    mo.  Si  no  coinciden  es  necesario  dialogar  sobre  ese  punto  has-    ta que alcancen un acuerdo.    e)  Cuando  ya  tienen  una  meta  común,  el  aspecto  exigido    necesita  descubrir  cómo  requiere  ser  tratado  por  el  exigente    para  sentirse  verdaderamente  ayudado  a  transformarse  en  la    dirección de la meta que ambos desean.    f)    Una  vez  que  lo  ha  descubierto,  es  muy  útil  que  encarne    el  papel  de  asistente  interior  del  aspecto  exigido   y  ensaye  y  ex-    perimente  esa  nueva  actitud,  y  que  mientras  lo  hace  esté  aten-    to a todas sus reacciones emocionales.   g)    Que  observe  luego  el  efecto  que  produce  sobre  el  aspec-    to  exigido  el  recibir  dicho  trato  y  haga  todos  los  ajustes  sucesi-    vos  hasta  que  el  aspecto  exigido  se  sienta  genuinamente  ayu-    dado.   h)  Cuando  este  estado  ha  sido  efectivamente  alcanzado,  es    el  momento  de  convertirse  nuevamente  en  el  aspecto  exigente    original,  desde  ahí  observar  la  nueva  actitud  asistencial  puesta    en  juego,  descubrir  las  diferencias,  y  en  el  caso  de  desearlo,    comenzar  la  hermosa  tarea  de  aprendizaje  que  significa  trans-    formarse de exigente en asistente.   \n                    Esta  enumeración  de  tareas  quizá  parezca  de  difícil  realiza-    ción,  pero  existe  un  factor  de  gran  importancia  que  facilita  su    logro,  y  es  que  todos  los  personajes  involucrados  son  compo-    nentes de la persona que usted es .   Imagine  que  observara  a  su  mano  derecha  maltratar  y  herir    a  su  mano  izquierda.  La  unidad  que  usted  es  seguramente  con-    templaría  con  horror  esa  escena  y  se  sentiría  con  recursos  más    que  suficientes  para  explicarle  a  su  mano  derecha  que  usted    necesita  de  ambas  y  que  ellas,  en  esencia,  son  colaboradoras    complementarias.  Además,  no  sólo  usted  necesita  a  las  dos    sino que ellas también se necesitan mutuamente.   Entre  el  aspecto  exigente  y  el  exigido  sucede  algo  semejan-    te.  Si  bien  es  un  plano  más  sutil,  pues  se  trata  de  aspectos  psi-    cológicos,  la  realidad  de  que  pertenecen  a  la  misma  unidad    tiene igual contundencia.   Resumiendo, los puntos clave de este proceso son:   a) El  reconocimiento  de  que  el  exigente  y  el  exigido  son,  en    su raíz, funciones complementarias.    b) La  comprobación  vivencial  de  lo  torturador  e  ineficaz  de    la exigencia.    c)  La  verificación  de  los  cambios  beneficiosos  que  se  pro-    ducen cuando se instala la interconsulta respetuosa.    Tal  comprensión  es,  en  última  instancia,  el  sustento  más  só-    lido  sobre  el  que  se  apoya  la  tarea  de  disolución  de  la  exigen-    cia y el aprendizaje de la actitud autoasistencial.                   110 \n                    C   I   N   C   O          APRENDER DE LA ENVIDIA    El primer instante de la envidia es un dolor agudo    ante un contraste que nos remite a nuestros deseos    insatisfechos. Si aprendemos a utilizar esa señal    descubriremos la riqueza potencial de la envidia    y no surgirá la necesidad de destruir los logros    del otro.         111 \n                    La  envidia  es  una  de  las  emociones  socialmente  más  des-    calificadas,  al  punto  de  que  decirle  a  alguien  «¡envidioso!»   se  ha  convertido  en  una  forma  de  insulto  humillante.  Por    esta  razón,  cuando  sentimos  en vidia,  a  menudo  tratamos  de    ocultarla  como  si  se  tratara  de  algo  vergonzante.  Toda  esta    atmósfera  desacreditadora  hace  más  difícil  aún  la  posibili-    dad  de  comprender  la  complejidad  de  esta  emoción  y  la  ri-    queza potencial que alberga.   Para  acceder  al  sentido  profundo  de  la  envidia,  explora-    remos en este capítulo cuatro aspectos básicos:   a) Definición habitual de la envidia.    b) Explicación tradicional de su causa.    c) Una nueva visión de su naturaleza y razón de  ser.    d) Los caminos para resolverla.    a)  Definición habitual de la envidia    Suele  definirse  a  la  envidia  como  la  reacción  de  dolor  y    enoio  que  intenta  destruir  lo  que  el  otro  tiene  cuando  perci -    112 \n                    bimos  que  ese  otro  ha  alcanzado  algo  que  deseamos  y  que    no hemos logrado .   Paula:  «¡Me  siento  tan  contenta!  Conocí  a  Luis  hace  un    mes  en  una  fiesta  y  estoy  fascinada.  La  semana  próxima  nos    vamos de viaje juntos, y... ¡creo que me he enamorado!»   Eve:  «¡Pero  sólo  hace  dos  meses  que  te  separaste  y  ya  has    iniciado  una  relación  nueva!  ¿No  estarás  escapando?  Mira    que  estas  relaciones  que  empiezan  de  forma  tan  abrupta    también acaban muy fácilmente...»   Juan:  «¡Me  han  elegido  para  el  papel  protagonista  de  la    película! ¡Te invito a que comamos juntos para celebrarlo...!»   Pedro:  «Qué  bien...  Yo  creí  que  se  lo  darían  a  alguien  con    más  experiencia  que  tú.  Discúlpame,  pero  he  de  irme.  Será    otro día.»   b)  Explicación tradicional de su causa    Cuando  se  intenta  explicar  la  razón  de  ser  de  esta  emo-    ción,  se  la  considera,  generalmente,  como  una  forma  del    odio .  Melanie  Klein  es  una  de  las  autoras  que  mejor  repre-    senta  a  este  tipo  de  corriente  en  el  campo  de  la  psicología.    Ella  ha  afirmado,  en  efecto,  que  la  envidia  es  una  expresión    de  los  «impulsos  destructivos»  o  «fuerzas  tanáticas»  que    todo  ser  humano  alberga,  en  grado  variable,  dentro  de  sí.    De  modo  que,  según  esta  concepción,  la  destructividad  del    acto  envidioso  es  el  fiel  refleio  de  la  destructividad  esencial    que ese ser humano alberga .     113 \n                    c)  Una nueva visión de su naturaleza y razón de ser    Acerca  de  la  definición  habitual  y  la  explicación    de su causa.   En  la  definición  habitual  de  la  envidia  el  acento  está    puesto  en  «la  destrucción  del  otro  o  de  sus  logros»,  pero  si    observamos  más  atentamente  este  sentimiento  comprobare-    mos  que  el  deseo  de  destrucción  del  otro  o  sus  logros  no  es    el  objetivo  central  de  la  envidia.  El  objetivo  central  es  la  eli-    minación  de  un  contraste  cuya  percepción  produce  un  do-    lor insoportable .   Esta  diferencia  puede  parecer  una  sutileza  mínima  e  irre-    levante,  pero  es  de  extraordinaria  importancia  por  los  cam-    bios  que  introduce  en  el  modo  de  comprender  la  envidia  e    intentar resolverla. Profundizaremos en esto.   Cuando  una  persona  que  me  consulta  está  elaborando    algún  sentimiento  de  envidia,  suelo  preguntarle:  «Si  te  fuera    dada  la  posibilidad  de  realizar  un  deseo  y  tuvieras  que  ele-    gir  entre  dos  alternativas:  uno,  que  la  persona  envidiada  per-    diera  efectivamente  todos  los  logros  que  le  envidias,  o  dos,    que  lograras  alcanzar  tus  deseos  más  queridos  mientras  la    otra  persona  mantiene  todo  lo  que  ahora  le  envidias.  ¿Qué    alternativa  elegirías?»  (Ésta  es  una  buena  ocasión  para  que    usted,  lector,  evoque  alguna  situación  de  envidia  y  se  for-    mule la misma pregunta.)   Hasta  ahora  todas  las  personas  han  respondido  que  ele-    girían  la  segunda  alternativa.  Esta  elección  quiere  decir  que    la  prioridad  de  quien  envidia  es,  en  realidad,  lograr  realizar    lo  que  desea  y  no  puede .  Si  cree  que  eso  es  imposible,  trata    de  eliminar  el  contraste  destruyendo  el  logro  del  otro.  Es  de-    cir,  la  destrucción  del  logro  del  otro  no  es  un  fin  en  sí  mis-    mo, sino un medio para neutralizar un contraste .     114 \n                    Esta  observación  nos  permite  vislumbrar  que  la  envidia    no  es  tanto  una  forma  del  odio  como  una  forma  de  la  nece-    sidad  impotente  y  desesperada   que  trata  de  eliminar  la  per-    cepción de todo lo que le recuerde su carencia.   Quien  envidia  a  menudo  no  se  da  cuenta  de  que  lo  que    quiere  eliminar  es  el  contraste.  Muy  pocas  personas  son    conscientes  de  esa  motivación  profunda.  Más  bien  sienten    que  a  quien  quieren  atacar  es  al  «envidiado».  Es  decir,  per-    ciben  lo  mismo  que  lo  que  sostiene  la  explicación  tradicio-    nal.  Todo  esto  en  el  caso  de  que  sean  conscientes  de  su  en-    vidia.  La  otra  posibilidad  —opuesta  y  frecuente—  es  que  no    registren  estas  reacciones  interiores  y  crean  que  su  enojo  y    su  ataque  hacia  el  envidiado  están  justificados  por  algo  que    éste ha dicho o hecho.   Y  muy  a  menudo,  en  el  curso  de  esos  diálogos  tensos  en    los  que  subyace  la  envidia,  se  producen  desencuentros    progresivos  que  desembocan,  de  parte  de  ambos,  en  «mi-    n¡ofensas»  o  agravios,  que  van  creciendo  y  a  través  de  los    cuales  la  envidia  original,  ahora  multiplicada,  estalla  y  se    descarga.   Volvamos  al  ejemplo  de  Juan  y  Pedro.  Juan,  a  quien  le    dieron  el  papel  protagonista  de  la  película  y  quería  celebrar-    lo,  se  siente  herido  ante  el  comentario  de  Pedro:  «Creí  que    se  lo  darían  a  alguien  con  mayor  experiencia.»  Se  siente  he-    rido,  reacciona  contraatacando  y  le  dice:  «Yo  creo  que  cuan-    do  uno  posee  talento  siempre  consigue  trabajo...»  Pedro,    que  también  es  actor  y  está  sin  trabajo,  ahora  se  siente  agra-    viado  directamente  por  este  nuevo  comentario,  y  el  males-    tar  inicial  generado  por  el  contraste  se  intensifica.  Se  suma    el  malestar  de  las  dos  situaciones  y  se  descarga  a  través  de  la    segunda,  que  es  la  que  presenta  una  forma  más  clara  y  «le-    gítima» para Pedro: «¡Me ha dicho que no tengo talento!»     115 \n                    A  partir  de  este  momento  se  detona  en  Pedro  otra  réplica    más  hiriente...  y  así  es  como  se  van  entrelazando  y  sumando    las heridas y los ataques.   Cuando  se  ha  conseguido  discriminar  esta  secuencia  de    pasos,  que  es  la  que  agranda  la  «bola  de  nieve»,  se  está  en    mejores  condiciones  de  reconocer  que  este  tramo  y  la  even-    tual  explosión  de  enojo  destructivo  posterior  ya  es  un  capí-    tulo  intermedio  en  esta  trama,  y  no  el  primero.  Esto  quiere    decir  que  el  enojo  destructivo  de  la  envidia  es  el  resultado    de  una  inadecuada  elaboración  de  la  reacción  inicial,  y  no    su consecuencia intrínseca, necesaria e inevitable .   Condiciones que generan envidia    De  lo  descrito  anteriormente  se  desprende  que  la  envidia    no  es  un  «defecto»  que  ataque  a  alfiunos  y  a  otros  no,  sino    que  se  trata  de  una  emoción  universal,  es  decir,  que  todos    los  seres  humanos  podemos  sentirla  en  la  medida  en  que  se    den  ciertas  condiciones  de  contrastes  intolerablemente  do-    lorosos .  Lo  que  puede  ser  distinto  en  cada  uno  es  el  umbral    a  partir  del  cual  se  detona,  pero  si  ese  umbral  es  sobrepasa-    do, la reacción de envidia aparecerá inevitablemente .   Describamos  entonces  cuáles  son  las  condiciones  que  la    generan.   1.  Cuando  experimento  ciertas  necesidades  o  deseos  y    percibo a alguien que ha realizado alguno de esos deseos.   2.  Cuando,  además,  creo  que  no  dispongo  ni  dispondré    de los recursos necesarios para lograr realizarlos.   3.  Cuando  tampoco  cuento  con  una  cuota  suficiente  de    deseos  satisfechos  y  disfrutados  como  para  equilibrar  el  do-    lor que me producen los no realizados.     116 \n                    Si  estos  componentes  están  presentes,  el  contraste  entre    la  percepción  del  logro  alcanzado  por  el  otro  y  lo  que  yo    no  estoy  realizando  (o  lo  que  es  lo  mismo:  mis  carencias)  no    puede  percibirse  de  un  modo  crónico  debido  a  la  desorga-    nización  que  produce.  Por  lo  tanto,  o  la  situación  se  equili-    bra  a  través  de  la  realización  de  mis  propios  logros  o  lo  hace    eliminando  la  percepción  de  los  logros  del  otro.  Éste  es  el    componente  funcional  de  la  reacción  de  la  zorra  de  la  fábu-    la  ante  las  uvas  que  ve  todos  los  días  en  su  camino,  que    desea,  y  que  están  demasiado  altas  para  alcanzarlas.  Ella    termina  diciendo  «las  uvas  están  verdes».  Si  bien  en  este    ejemplo  no  hay  un  logro  del  otro,  lo  que  suprime  con  su  reac-    ción  es  su  deseo  de  las  uvas.  Como  expresamos  anterior-    mente,  es  muy  difícil  sentir  de  modo  sostenido  el  deseo  de    las  uvas  y  la  imposibilidad  de  alcanzarlas.  El  sentimiento    crónico  de  impotencia  es  muy  desorganizador  y  se  lo  trata    de  evitar.  Por  esta  razón,  o  la  zorra  «consigue  una  escalera»    o terminará sintiendo que en efecto «las uvas están verdes».   Veamos  ahora  qué  ocurre  cuando  lo  que  se  percibe  es    efectiva y concretamente un logro del otro.   Cuando  deseo  algo  y  no  lo  tengo,  no  estoy  todo  el  tiem-    po  en  contacto  directo  y  en  un  primer  plano  con  ese  deseo    que  no  he  realizado .  Dicho  deseo  permanece  en  un  estado    de  anestesia  parcial.  En  el  momento  en  que  Eve  se  entera  de    la  nueva  relación  de  Paula,  se  conecta  directa  y  abrupta-    mente  con  el  hecho  de  que  ella  también  querría  tener  una    pareja  y  no  la  tiene.  Es  decir,  su  estado  de  anestesia  parcial    cesa abruptamente .   A  este  suceso  puntual  se  agrega  otro  factor  que  agranda    aún  más  el  contraste:  junto  con  el  deseo  de  tener  una  pareja    se  desanestesian  también  —como  en  cascada—  los  otros    deseos  que  no  han  sido  realizados.  Si  son  muchos  y  signifi-    117 \n                    cativos,  el  contraste  es  intenso  y  doloroso.  Y  si,  además,  su-    pera  la  capacidad  de  Eve  de  absorberlo,  el  dolor  se  converti-    rá  en  enojo  hacia  Paula  y  se  expresará  a  través  de  algún  co-    mentario hiriente.   Cuando  Eve  no  tiene  conciencia  de  sus  deseos  no  satisfe-    chos,  puede  incluso  creer  que  Paula,  al  hacerla  partícipe  de    su  logro,  es  la  causante  de  su  dolor,  porque  de  hecho  lo    siente  al  ponerse  en  contacto  con  ella .  Puede  atribuirlo  a  la    forma  en  que  se  lo  ha  contado  o  puede  imaginar  una  actitud    de  ostentación  en  ella,  etc.  Sea  cual  fuere  la  creencia,  real  o    imaginaria,  que  Eve  ponga  en  juego,  esta  situación  suele  ge-    nerar  efectivamente  enojo  en  Eve  hacia   Paula  y  activar  su    reacción de crítica o descalificación.   Tal  sucesión  de  malos  entendidos  es  lo  que  luego  parece    avalar  la  creencia  de  que  lo  que  la  envidia  procura  en  pri-    mer  término   es  dañar  a  quien  ha  logrado  lo  que  deseo  y  no    tengo.   d)  Los caminos para resolverla    La doble reacción    Si  Eve  es  consciente  de  sus  carencias,  al  enterarse  del    nuevo  amor  de  Paula  puede  experimentar  con  mayor  clari-    dad  la  doble  reacción  que  este  suceso  genera  en  ella .  Por    una  parte  puede  alegrarse  genuinamente  por  su  amiga  y,  si-    multáneamente,  sentir  dolor  y  tristeza  al  recordar  su  anhelo    no  realizado  de  tener  una  pareja.  Si  legitimáramos  esta  do-    ble  reacción,  podríamos  transmitirla  y  la  incluiríamos  como    una  respuesta  natural,  normal  e  inevitable .  Por  ejemplo:    «Me  alegro  por  ti  de  que  estés  tan  bien  en  esta  nueva  rela-    ción,  de  verdad  me  alegro...  y  también  quiero  decirte  que    118 \n                    siento  tristeza,  porque  lo  que  me  cuentas  me  recuerda  que  a    mí  también  me  gustaría  estar  enamorada  y  no  me  ocurre  eso    en este momento...»   Así  como  Eve  comparte  la  alegría  por  el  bienestar  de  Pau-    la,  Paula  podrá  reconocer  y  aceptar  la  tristeza  de  Eve  por  no    estar enamorada.   Ante  la  propuesta  de  incluir  su  doble  reacción,  muchas    personas  se  escandalizan  y  suelen  decir:  «¡Cómo  voy  a  con-    tarle mis tristezas en un momento de alegría...!»   En  relación  con  este  punto  crucial,  es  necesario  que  to-    dos  comencemos  a  reconocer  que  es  distinta  la  alegría  de  al-    canzar  un  logro  mientras  otros  no  lo  han  podido  hacer,  de  la    alegría  que  se  produce  cuando  ese  logro  es  efectivamente    compartido.  Al  ser  compartido,  la  alegría  es,  sin  duda,  más    completa  y  mayor.  Y  esto  es,  sencillamente,  genuina  solida-    ridad humana.   En  última  instancia  podríamos  decir  que  si  hemos  alcan-    zado  un  logro,  no  es  justo  que  alberguemos  la  expectativa    de  una  reacción  de  puro  festejo  que  no  reconozca  las  caren-    cias  que  simultáneamente  existen  en  los  otros  miembros  de    nuestro  entorno.  Resulta  oportuno  recordar  aquí  la  sabidu-    ría  de  aquellas  frases  populares  que  ya  alertaron  sobre  esta    realidad:  «No  es  bueno  contar  dinero  en  casa  del  pobre...»    O:  «Uno  no  puede  sentirse  feliz  en  medio  de  personas  que    no lo son...»   Si  Paula  creyera  que  al  suceso  que  está  viviendo  le  co-    rresponde  un  puro  festejo  y  se  sintiera  molesta  con  la  triste-    za  de  Eve,  estaría  poniendo  de  manifiesto  un  aspecto  infan-    til  y  egocéntrico  de  su  personalidad  que  consiste  en  suponer    que  el  estado  de  su  entorno  debe  adecuarse  completamente    a su circunstancia particular.   Y  sin  embargo,  a  pesar  de  lo  casi  obvio  de  esta  reflexión,    119 \n                    es  bastante  frecuente  observar  la  creencia,  extendida  en    nuestra  sociedad,  de  que  ante  una  celebración  la  tristeza    debe acallarse .   A  esta  creencia  suele  asociarse  otro  factor  de  índole  más    estrictamente  psicológica,  y  es  la  confusión  entre  carencia   e    inferioridad .  Para  muchos  de  nosotros,  incluir  que  no  tene-    mos  lo  que  el  otro  ha  logrado  no  es  vivido  como  el  simple  y    eventualmente  doloroso  reconocimiento  de  un  estado  sino    como  el  testimonio  de  nuestra  inferioridad  ante  el  otro  que    nos  hace  sentir  humillados .  Esta  confusión,  cuando  está  pre-    sente,  también  contribuye  a  que  suprima  el  registro  de  nues-    tra carencia y nuestra tristeza.   Sólo  cuando  hemos  conseguido  resolver  ese  malentendi-    do  y  trascenderlo,  estamos  en  condiciones  de  comprobar    que  la  inclusión  de  nuestra  cuota  personal  de  dolor  es  una    manera  legítima  y  funcional  de  darle  una  salida  al  impacto    del contraste insoportable .   De  ese  modo  reconocemos  las  dos  realidades:  la  alegría    por  el  logro  del  otro  y  el  dolor  por  nuestra  carencia.  Ade-    más,  experimentamos  la  sensación  de  integridad  en  el  «aquí    y  ahora»  de  ese  instante  y  no  será  tan  necesario  apelar  a  la    eliminación del logro del otro para equilibrar la diferencia.   Si  no  podemos  hacerlo  y  nos  sentimos  presionados  a  se-    guir  alimentando  exclusivamente  la  atmósfera  de  alegría  por    el  logro  del  otro,  generamos,  de  forma  casi  inevitable,  una    división  en  nosotros  mismos:  por  un  lado  un  aspecto  nues-    tro  en  contacto  con  nuestro  amigo,  que  está  tratando  de    mantener  la  alegría  y  el  festejo  (que  puede  ser  absolutamen-    te  sincero  y  genuino  en  nosotros,  pero  parcial),  y,  por  otro    lado,  un  aspecto  agudamente  dolorido  por  la  cesación  del    estado  de  anestesia  y  el  reconocimiento  de  que  no  hemos    realizado algo que deseamos mucho.     120 \n                    Este aspecto es como un niño que llora de dolor.   Si  no  se  qué  hacer  con  este  niño,  trataré  de  suprimirlo  y    anestesiarlo  de  nuevo.  En  el  momento  agudo  es  muy  difícil    acallarlo,  y  uno,  por  lo  tanto,  suele  sentirse  tironeado  por    ese  intenso  dolor  interior  que  impide  seguir  participando  en    el  diálogo  festivo  de  celebración.  En  ese  mismo  momento,  o    luego,  al  evocar  la  experiencia,  es  muy  frecuente  que  uno    tienda  a  reprochar  a  ese  niño  interno  su  respuesta  tan  inten-    sa.  Las  frases  que  uno  se  dice  a  sí  mismo  suelen  ser:  «Debo    de  ser  muy  malo,  muy  egoísta,  muy  poco  generoso,  pues  no    puedo compartir y vivir esta alegría del otro...»   Ahora  veamos  la  misma  escena  desde  la  perspectiva  del    aspecto  dolorido,  del  niño  que  llora  de  dolor.  Pongámonos    en  su  lugar:  además  de  estar  en  contacto  abrupto  con  lo  que    deseamos  y  no  hemos  realizado,  recibimos  ese  trato  interno    en  el  que  se  nos  reprocha  y  se  nos  dice:  «Malo,  egoísta,  poco    generoso...»  A  esto  se  suma  la  sensación  de  impotencia  e    inutilidad  que  experimentamos  por  estar  percibiendo  lo  que    no hemos logrado...   Este  conjunto  de  vivencias  se  convierte  en  una  catarata    de  estímulos  muy  dolorosos  que  es  completamente  desorga-    nizadora y devastadora.   De  este  estado  de  desorganización  es  de  donde  nace  lo    que llamamos envidia destructiva .   La  envidia  destructiva  consiste  en  tratar  de  hacer  o  decir    algo  para  que  el  envidiado  sienta  algo  equivalente  a  lo  que    yo,  como  «envidiador»  estoy  sintiendo:  dolor,  impotencia  y    desorganización.   De  ahí  la  respuesta  de  Eve:  «¿No  estarás  escapando...?»    O:  «Las  relaciones  que  empiezan  de  forma  tan  abrupta  tam-    bién  acaban  muy  fácilmente.»  O  el  comentario  de  Pedro:    «Creí  que  se  lo  iban  a  dar  a  alguien  con  más  experiencia    121 \n                    que  tú...»,  y  el  resto  de  las  otras  formas  de  envidia  destructi-    va  que  todos  hemos  padecido  de  parte  de  otros  o  experi-    mentado en nosotros mismos.   Y  que,  vale  la  pena  repetirlo  una  vez  más,  es  la  manifes-    tación  de  mi  legítimo  dolor  que  luego  fue  degradado  por  la    asfixia que produce la supresión...    Una  vez  que  la  envidia  destructiva  se  ha  detonado,  ella    misma  pone  en  marcha  una  reacción  interior  de  culpa,  que    si  no  es  bien  procesada  hace  que  nos  sintamos,  además,  no    merecedores   de  alcanzar  los  logros  que  anhelamos.  Por  lo    tanto,  se  van  recreando  las  condiciones   para  que  estemos    expuestos  a  nuevas  situaciones  de  envidia  que,  de  no  ser  re-    sueltas, agravan el círculo vicioso cada vez más.   Envidia sana-envidia destructiva   Estos  dos  conceptos  me  parecen  útiles  en  tanto  que  tra-    tan  de  diferenciar  dos  formas  de  sentir  y  expresar  la  envidia.    Son  útiles  también,  en  la  medida  en  que  ayudan  a  disminuir    el  peso  de  la  sanción  social  que  cae  sobre  la  envidia  y  crean    un espacio de mayor legitimidad para poder sentirla.   La  envidia  sana  consiste  en  poder  reconocer  que  el  otro    ha  alcanzado  algo  que  yo  también  deseo  y  no  he  logrado,    con  la  doble  reacción  que  tal  reconocimiento  implica:  uno,    alegría  y  admiración  hacia  quien  ha  alcanzado,  y,  dos,  dolor    y tristeza por reconocer que yo no lo he hecho.   Es  importante  agregar  que  esta  doble  reacción  puede  ser    comunicada  de  un  modo  explícito,  o  no.  Cuanto  más  clara    y  legitimada  por  mí  mismo  esté  mi  doble  reacción,  más  libre    me  sentiré  para  evaluar  si  están  dadas  las  condiciones  para    compartir, o no, lo que siento.     122 \n                    La  envidia  destructiva  es  aquella  que,  como  su  nombre  lo    indica,  trata  de  destruir  al  otro  y/o  sus  logros,  como  forma  de    eliminar  el  contraste,  y  que,  además,  no  es  consciente  de  ella    misma,  no  se  reconoce  como  envidia  y  suele  explicar  sus  ata-    ques apelando a otros argumentos que los justifiquen.   A  continuación  incluiremos  las  preguntas  más  frecuentes    que surgen en los seminarios sobre este tema.   ¿Por qué es tan dolorosa la envidia?   Como  hemos  dicho,  la  envidia  es  como  un  rayo  que    irrumpe  y  deja  al  descubierto  una  necesidad  o  un  deseo    profundo  insatisfecho.  Además,  ese  deseo  o  necesidad  ha    sido  anestesiado,  en  la  mayoría  de  los  casos,  por  la  cantidad    de  frustración  que  produce.  Y  ahí  es  donde  cae  el  rayo:  sor-    presivamente  cesa  la  anestesia  y  uno  siente  amplificado    todo su dolor.   Uno  queda  «nadificado»  frente  al  logro  del  otro.  ¿Pue-    den  ustedes  evocar  ese  instante  en  el  que  la  identidad  mis-    ma  queda  tomada  por  la  percepción  intensa  de  una  caren-    cia?  Entonces  uno  es  sólo  eso:  el  que  no  tiene,  el  que  no  ha    logrado.   La  percepción  de  lo  que  uno  sí  tiene  o  puede,  cesa  tem-    poralmente.  Y  esta  manera  de  autopercibirse  es  lo  que  hace    tan dolorosa la envidia.     123 \n                    Además de ser una emoción dolorosa,   ¿la envidia cumple alguna función?   El  sentido  más  profundo  de  la  envidia  es  el  de  ser  una  se-    ñal  que  nos  pone  en  contacto  con  un  deseo  no  satisfecho.    Cuando  alcancemos  un  grado  de  conciencia  más  desarro-    llada,  probablemente  preguntaremos  con  naturalidad:  «¿Qué    deseo  no  satisfecho  has  podido  descubrir  a  partir  de  la  envi-    dia  que  acabas  de  sentir?»  Esto  significa  que  aprovechare-    mos esa señal para enriquecernos.   Una  de  las  peores  cosas  que  se  ha  hecho  con  la  envidia    es convertirla en algo que uno no debería sentir .   ¿Hay personas que tratan de hacer   sentir envidia?   Sí.  Cuando  una  persona  tiene  escasa  capacidad  de  perci-    bir  y  disfrutar  de  sus  propios  logros  puede  sentir  la  necesi-    dad  de  generar  un  contraste  a  fin  de  experimentarlos.  «Si  tú    no lo tienes yo percibo mejor que yo lo tengo.»   Lo  mismo  ocurre  cuando  hay  una  atmósfera  de  compe-    tencia.  «Te  cuento  lo  que  he  logrado  para  sentir  que  te  he    ganado.»   En  otros  casos  la  fantasía  es  distinta:  «Te  lo  cuento  así    para  que  me  admires,  me  valores,  me  quieras  y  no  me  aban-    dones.»  Como  esta  actitud  surge  de  la  propia  inseguridad,  lo    que  el  otro  puede  sentir  es  sólo  el  impacto  del  contraste  y  la    sensación de «me lo está refregando por las narices».   Por  supuesto  en  cualquiera  de  estos  casos,  la  consecuen-    cia es el malestar y el deterioro del vínculo.     124 \n                    ¿Qué diferencia existe entre admirar y envidiar?   Al  admirar  reconozco  que  el  admirado  cuenta  con  carac-    terísticas  que  yo  valoro  y  eventualmente  quisiera  tener.  Tam-    bién  aquí  existe  un  contraste  entre  lo  que  percibo  y  cómo    me  siento.  En  la  admiración  el  contraste  no  es  doloroso,  por-    que  el  admirado  funciona  como  modelo  o  estímulo  para    que  yo  también  me  acerque  a  lo  deseado.  Ésa  es  la  diferen-    cia  esencial  con  la  envidia.  En  la  envidia  el  contraste  me  re-    mite  a  lo  que  no  tengo  o  no  soy,  sin  camino  de  crecimiento    o  transformación.  En  la  admiración  ese  sendero  está  presen-    te.  Y  está  presente  en  la  medida  en  que  siento  (consciente  o    inconscientemente)  que  cuento  con  los  recursos  para  acer-    carme o desarrollar lo que deseo.   La  relación  entre  estas  dos  emociones  se  comprueba    también  en  su  etimología:  «envidia»  proviene  del  latín   Eu   video    (yo  veo).  «Admirar»  también  proviene  del  latín   Ad  mi-    rare    (mirar  a).  Ambas  están  referidas  al  mirar.  Expresan  dos    reacciones  que  produce  el  mirar.  Una,  dolorosa;  la  otra,  es-    timulante.   La  admiración  también  es  una  etapa  de  la  transformación    resolutiva  de  la  envidia.  Raso  de  la  envidia  a  la  admiración.    Es  importante  recordar  que  este  pasaje  no  es  una  cuestión    de  voluntad  o  de  admonición  moral  («No  está  bien  que    sientas  envidia»).  Esta  frase  revela  que  no  se  ha  comprendi-    do  la  envidia  y,  además,  complica  más  las  cosas  en  lugar  de    transformarlas.   El  pasaje  de  la  envidia  a  la  admiración  sólo  se  puede  pro-    ducir  cuando  hemos  descubierto  nuestro  deseo  no  logrado    y  los  recursos  que  necesitamos  desarrollar  para  poder  reali-    zarlo    125 \n                      126  INDAGACIÓN PERSONAL    a)  Es  casi  inevitable  que  la  vida  lo  coloque  repetidamente  en    situaciones  en  las  que  experimente  un  contraste  muy  dolo-    roso.    b)  Cuando  sienta  ese  dolor  observe  cuál  es  el  deseo  particular    no  satisfecho  con  el  cual  se  ha  puesto  abruptamente  en    contacto.    c)  Una  vez  que  lo  haya  descubierto,  estará  en  mejores  condi-    ciones  de  comprender  y  legitimar  la  cuota  de  dolor  que    siente.  En  cada  situación  verá  si  es  adecuado  o  no  compar-    tir esa vivencia.    d)  Después  de  que  el  acontecimiento  haya  pasado,  y  ya  como    tarea  personal  de  usted  con  usted  mismo,  le  propongo  que    trate  de  descubrir  qué  piensa  acerca  de  por  qué  no  ha  lo-    grado  realizar  ese  deseo  particular .  Volviendo  al  ejemplo    de  Eve,  ella  puede  pensar:  «No  estoy  enamorada,  tal  vez    porque  aún  no  ha  llegado  mi  momento...  pero  yo  estoy  en    condiciones  de  vivir  una  situación  así,  de  modo  que  cuan-    do  se  presente  siento  que  podré  lograrlo...»  O  puede  pen-    sar:  «No  estoy  enamorada  porque  como  mujer  soy  una  inú-    til,  ningún  hombre  que  valga  la  pena  se  va  a  interesar  en    mí... Mejor me olvido de estos deseos...»    Cuando  descubra  la  opinión  que  tiene  acerca  de  por  qué    no  ha  logrado  lo  que  desea  podrá  reconocer  la  enorme  signifi-    cación que tiene dicha opinión interior .   En  el  ejemplo  de  Eve,  la  carencia  es  la  misma,  pero  una    opinión  interior  esperanzada,  basada  en  recursos  psicológicos    reales, ayuda a disminuir y hacer más soportable el dolor.  \n                    Cuando,  en  cambio,  la  autoevaluación  es  descalificadora,  esa    actitud  es  la  que  multiplica  hasta  el  infinito  el  dolor  del  con-    traste .   e)  Si  usted  piensa  que  no  ha  realizado  lo  que  desea  porque  us-    ted  «no  sirve»,  el  tema  central  entonces  es  comprender  y    resolver  esa  conclusión  sobre  usted  mismo.  La  envidia  ha    sido  el  camino  que  lo  ha  conducido  a  la  situación  en  que  se    encuentra  y  ahora  pasa  a  un  lejano  segundo  plano.  Ha    cumplido  su  función  (es  justo  agradecérselo)  y  la  tarea  psi-    cológica continúa en otro terreno.    f)    Cuando  ha  llegado  a  este  punto  ya  puede  comprender  vi-    vencialmente  que  el  primer  instante  de  la  envidia  es  ese    agudo  dolor  ante  un  contraste,  que  cumple  la  función  de    señal  que  lo  remite  a  explorar  sus  deseos  insatisfechos  y  los    recursos psicológicos con que cuenta para alcanzarlos .    g)  Si  puede  realizar   esa  tarea  interior  tantas  veces  como  sea    necesario  y  se  siente  enriquecido  por  ese  aprendizaje,  no    necesitará  destruir  los  logros  del  otro  para  equilibrar  el  con-    traste.    h)  Puede  ocurrir  también  que  lo  que  se  active  sea  un  deseo    que  ya  no  puede   realizar:  «Deseo  ser  campeón  de   tenis  y    tengo  más  de  cincuenta  años...»,  etc.  En  esta  clase  de  situa-    ciones  lo  que  permite  disminuir  el  dolor  del  contraste  es  la    memoria  de  los  logros  efectivamente  disfrutados  y  la  posi-    bilidad  de  encontrar  los  deseos  accesibles  a  la  circunstan-    cia  actual  y  los  recursos  psicológicos  que  necesita  desarro-    llar para alcanzarlos.   Esto  es  lo  que  permite  incluir  ese  deseo  particular  dentro  de  la    cuota de deseos que admitimos no realizar.             127 \n                    S   E   I   S          LA VERGÜENZA   Y SU CURACIÓN    La palabra «vergüenza» tiene diferentes    connotaciones: el mismo término nombra un    sentimiento necesario, funcional y socialmente    valioso, y también un sentimiento perturbador,    disfuncional, que requiere ser comprendido    y transformado.      128 \n                    Un  juez  ha  actuado  de  un  modo  corrupto,  un  deportista    agrede  intencionadamente  a  su  rival  y  lo  hiere,  un  militar    debe  defender  una  posición  durante  un  combate  y  en  cam-    bio  huye...,  y  ninguno  de  ellos  reconoce  el  error  cometido.    Entonces  surge  la  reacción  pública:  «Deberías  sentirte  aver-    gonzado; ¡Eres un desvergonzado!; No tienes vergüenza...»   En  estos  casos  queda  claro  que  reclamar  vergüenza  es    equivalente  a  demandar  señales  de  reconocimiento  del    error  y  el  arrepentimiento  consiguiente.  Ésta  es  la  vergüenza    necesaria  que  muestra  la  perturbación  que  uno  experimenta    cuando realiza algo incorrecto y lo reconoce .   Pero  no  se  trata  de  la  única  forma  de  vergüenza.  Existe    otra  que,  en  cierto  sentido,  es  una  distorsión  de  la  primera  y    perturba,  muchas  veces  de  forma  intensa,  la  posibilidad  de    expresión libre y espontánea.   Veámoslo  a  través  de  otros  ejemplos:  «Me  da  vergüenza    ir  a  esa  fiesta  porque  estoy  gorda...;  Me  da  vergüenza  hablar    en  público;  Me  da  vergüenza  cantar;  Me  da  vergüenza  bai-    lar  y  que  me  miren;  Me  da  ve rgüenza  dar  esa  charla  y  hacer    el  ridículo;  Me  da  vergüenza  expresar  ternura;  Me  da  ver-    güenza  que  se  note  la  intensidad  de  lo  que  siento...»,  etc.    129 \n                    Una  alumna,  Verónica,  relató  un  episodio  de  su  infancia    que  contiene  la  esencia  de  todos  estos  ejemplos,  y  que  por    haber  sido  vivido  a  sus  cinco  años  tiene  la  frescura  que    nombra  a  los  personajes  y  sus  reacciones  con  la  contunden-    te desnudez propia de las vivencias de una criatura:   «Tenía  cinco  años  y  volvía  en  el  autobús  de  la  escuela  a    casa.  Estaba  sentada  en  el  asiento  de  atrás  con  mis  compa-    ñeros  de  parvulario.  Cuando  ellos  señalaron  el  chorrito  que    caía  del  asiento  al  suelo  les  dije  que  ya  estaba  mojado  de    antes.   «Cuando  llegamos  a  mi  casa,  mi  mamá  me  alzó  y,  sor-    prendida,  dijo:  \"Cariño,  ¡te  has  hecho  pipí!\"  Yo  me  escondí    entre  sus  brazos  como  si  así  pudiera  volverme  invisible,  de-    saparecer,  no  estar  ahí...  mientras  oía  que  la  maestra  decía:    \"De  modo  que  era  ella  quien  se  había  hecho  pipí...;  y  decía    que  el  asiento  estaba  mojado...!\"  Y  los  chicos  riendo  y  can-    tando:  \"Verónica  se  ha  hecho  pipí!  Verónica  se  ha  hecho    pipí! La mejor del curso se ha hecho pipí!\"   »Esos  instantes  para  mí  fueron  siglos.  Parecía  que  el  co-    mentario  de  la  maestra  y  las  burlas  de  mis  compañeros  habían    detenido  el  tiempo...  Ya  en  casa,  todavía  me  acompañaban,    no  podía  dejar  de  oírlos...  Sentía  vergüenza,  humillación.    Me  sentía  descubierta  y  en  falta.  Creía  que  de  ahí  en  adelan-    te  mi  vida  ya  no  sería  la  misma.  Sería  señalada  por  todos  por    ser  la  mejor  alumna  del  curso  y  haberme  orinado  encima.    Dos  situaciones,  para  mí,  absolutamente  opuestas  y  exclu-    yentes. O la una o la otra. Y si se juntaban en una sola perso-   na  (yo)  lo  único  que  se  podía  esperar  era  la  exclusión  y  el    oprobio...  Enfrentar  nuevamente  a  la  maestra  y  mis  compa-    ñeros  me  parecía  imposible.  Recuerdo  que  por  varios  días    no quise volver a la escuela...»   Podríamos  describir  más  ejemplos  de  vergüenza,  pero    130 \n                    éste es uno de los prototípicos pues contiene todos los per-   sonajes que cumplen las funciones básicas del escenario de   la vergüenza. En cada nuevo ejemplo podríamos encontrar   otras  escenas  y  otros  personajes  pero  sus  componentes    funcionales serían los mismos. Veamos cuáles son:   a)    Existe una  performance ,  en el sentido de la habilidad   con que se lleva a cabo una acción o una tarea.   En el ejemplo era la capacidad de Verónica de controlar   sus esfínteres.   b)    Existe una imagen valorada  que la persona siente que   el  grupo  ya  tiene  acerca  de  ella  o  bien  ella  aspira  a    producir.   En este caso Verónica era la mejor alumna, y eso la hacía   sentirse valorada y querida por s
