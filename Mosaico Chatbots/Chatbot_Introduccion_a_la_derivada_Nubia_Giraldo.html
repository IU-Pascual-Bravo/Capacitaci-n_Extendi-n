<script>
    const PDF_TEXT = "Introducción a la derivada  ·  Página  1    INTRODUCCIÓN A LA    DERIVADA    como el límite de una razón de cambio    Guía paso a paso  sobre la Derivada       Lo que vas a poder hacer al terminar    ✔    Explicar con tus palabras qué es una derivada.    ✔    Entender qué significa que algo “tiende a” un valor (límite).    ✔    Calcular una derivada usando la definición con límites.    ✔    Interpretarla como pendiente y como velocidad.        \nIntroducción a la derivada  ·  Página  2    1. Empecemos con una historia    Imagina que vas en un carro y miras el velocímetro. Marca  60 km/h . Piensa en esto: ¿cómo sabe el   carro que en  este preciso instante   vas a 60?    Si lo piensas, la velocidad siempre se mide así:  distancia recorrida ÷ tiempo que tardaste . Pero un   instante dura “cero segundos”... y no puedes dividir entre cero. Entonces, ¿cómo se mide la   velocidad  en un instante ?    Ese problema aparentemente imposible es justamente el que resolvió el  cálculo diferencial , y la   herramienta que lo resuelve se llama  derivada .    La idea central en una frase    La derivada mide  qué tan rápido está cambiando algo en un momento exacto .    Ese “algo” puede ser la posición de un carro, el precio de una acción, la temperatura de una   sopa o la población de una ciudad.       2. Primer ingrediente: la rapidez de cambio promedio    Antes del “instante exacto”, empecemos por algo que ya sabes hacer: calcular un  promedio .    Supón que un carrito se mueve de modo que, después de  t   segundos, ha recorrido  s(t) = t 2   metros.   (Es una regla que nos dice la distancia según el tiempo.)    Tiempo t (s)   0   1   2   3   4    Distancia s(t) = t² (m)   0   1   4   9   16       ¿Qué tan rápido fue entre el segundo 1 y el segundo 3?    1.   Cambio en la distancia: 9 − 1 = 8 metros.    2.   Cambio en el tiempo: 3 − 1 = 2 segundos.    3.   Velocidad promedio: 8 ÷ 2 =  4 metros por segundo .      \nIntroducción a la derivada  ·  Página  3    Fórmula de la rapidez de cambio promedio    rapidez promedio  =  ( f(b) − f(a) ) ÷ ( b − a )    Es simplemente “cuánto cambió la salida” dividido entre “cuánto cambió la entrada”.       Fíjate en algo importante: ese 4 m/s es un  promedio . En el segundo 1 el carrito iba más lento y en el   segundo 3 más rápido. Un promedio no responde lo que queríamos:  ¿qué tan rápido iba   exactamente en t = 1?    3. Segundo ingrediente: la idea de límite    Para acercarnos al “instante exacto” necesitamos una herramienta nueva: el  límite . Es más sencillo   de lo que suena.    ¿Qué es un límite?    Un límite responde esta pregunta:  “¿hacia qué valor se va acercando algo cuando me acerco cada   vez más a cierto punto?”    Ejemplo cotidiano: caminas hacia una puerta dando pasos cada vez más cortos: te quedas a 1 m,   luego a 0,5 m, 0,25 m, 0,125 m... Nunca hace falta que llegues; lo importante es que es  evidente a   dónde te diriges: a la puerta . Esa puerta es el límite.    Un ejemplo con números    Mira qué le pasa a  x 2   cuando  x   se acerca a 3:    x (cada vez más   cerca de 3)    2,9   2,99   2,999   3,001   3,01   3,1    x²   8,41   8,9401   8,994001   9,006001   9,0601   9,61       Por la izquierda y por la derecha, los resultados se pegan cada vez más al número 9. Lo escribimos   así:    lím x→3    x 2    =  9    Se lee:  “el límite de x al cuadrado, cuando x tiende a 3, es 9” .   \nIntroducción a la derivada  ·  Página  4    Atención: el límite NO es “el valor en el punto”    Un límite trata de  hacia dónde se dirige   la función, no de lo que vale  justo en   el punto. Esto es   clave, porque en la derivada vamos a acercarnos a una situación del tipo “0 ÷ 0” que no se   puede calcular directamente, pero sí se puede  acercar   con un límite.       4. Tercer ingrediente: la pendiente de una recta    La  pendiente   dice qué tan inclinada está una recta. Si una carretera sube 3 metros por cada 100   metros horizontales, su pendiente es 3 ÷ 100 = 0,03.    Y aquí está el truco más hermoso del cálculo:  la rapidez de cambio promedio es exactamente la   pendiente de una recta   que une dos puntos de la gráfica. Esa recta se llama  secante   (porque   “corta” la curva en dos puntos).    Ahora imagina que acercas el segundo punto al primero, cada vez más... hasta que los dos casi se   tocan. La secante se convierte en una recta que apenas “roza” la curva: la  tangente .       Figura 1. Al acercar el segundo punto, las pendientes 4 → 3 → 2,5 → ... se acercan a 2.   \nIntroducción a la derivada  ·  Página  5    ¡Esta es la definición geométrica de derivada!    La  derivada   de una función en un punto es la  pendiente de la recta tangente   en ese punto. Y   esa pendiente se obtiene como el  límite   de las pendientes de las secantes cuando el segundo   punto se acerca al primero.       5. Juntando todo: la definición de derivada    Llamemos  a   al punto que nos interesa y  h   a la “distancia” que nos movemos para ubicar el segundo   punto (es decir, el segundo punto está en  a + h ).    La rapidez promedio entre  a   y  a + h   es:    ( f(a + h) − f(a) ) ÷ h    Ahora hacemos que  h   se acerque a cero (el segundo punto se pega al primero). ¡Eso es un límite!    Definición de la derivada en un punto    f′(a)  =  lím h→0    [ f(a + h) − f(a) ] ÷ h    Se lee: “f prima de a es igual al límite, cuando h tiende a cero, de f de (a más h) menos f de a,   todo dividido entre h”.       Traduciendo cada pieza al español    Símbolo   Qué significa   Ejemplo    f(a)   El valor de la función en el punto de   interés    Posición en t = 1    f(a + h)   El valor un poquito más adelante   Posición un instante   después    f(a + h) − f(a)   Cuánto cambió la función   Distancia recorrida    h   Cuánto avanzamos en la entrada   Tiempo transcurrido    lím h→0   “Hazlo cada vez más pequeño”   Del promedio al instante    f′(a)   El resultado: la derivada   Velocidad en ese instante      \nIntroducción a la derivada  ·  Página  6    6. Ejemplo resuelto paso a paso    Problema:   el carrito tiene posición  f(t) = t 2 . ¿Cuál es su velocidad exacta en  t = 1   segundo?    Paso 1: Escribe la definición con a = 1    f′(1)  =  lím h→0    [ (1 + h) 2   − 1 2   ] ÷ h    Paso 2: Desarrolla el cuadrado    Recuerda que (1 + h)² = 1 + 2h + h². Entonces el numerador queda:    (1 + 2h + h 2 ) − 1  =  2h + h 2    Paso 3: Divide entre h    Como  h   aparece en los dos términos, podemos sacarlo como factor común y simplificar:    (2h + h 2 ) ÷ h  =  2 + h    Este era el truco: antes teníamos “0 ÷ 0” cuando h = 0, pero tras simplificar ya no hay división   problemática.    Paso 4: Aplica el límite    Ahora sí, ¿hacia dónde va 2 + h cuando h se acerca a 0? Pues hacia 2.    f′(1)  =  lím h→0   (2 + h)  =  2    Conclusión    En el segundo 1, el carrito iba exactamente a  2 metros por segundo . Y en la Figura 1, la recta   tangente tiene pendiente 2. ¡Todo encaja!       Comprobémoslo con números    Si en vez de hacer álgebra probamos valores de  h   cada vez más pequeños, vemos cómo el promedio   se acerca a 2:    h   1   0,1   0,01   0,001   → 0    Rapidez promedio entre 1 y 1 + h   3   2,1   2,01   2,001   → 2       7. Un segundo ejemplo: una recta    Problema:   halla la derivada de  f(x) = 3x + 2   en  x = 5 .   \nIntroducción a la derivada  ·  Página  7    1.   f(5) = 3·5 + 2 = 17.    2.   f(5 + h) = 3(5 + h) + 2 = 17 + 3h.    3.   Numerador: f(5 + h) − f(5) = 3h.    4.   Dividimos entre h: 3h ÷ h = 3.    5.   Límite: lím h→0   3 =  3 .       Tiene todo el sentido: una recta tiene la  misma inclinación en todos sus puntos , y esa inclinación   (3) es justamente el número que multiplica a  x . La derivada de una recta es su pendiente de   siempre.    8. ¿Qué significa realmente la derivada?    Según el contexto, el mismo número puede interpretarse de varias formas:    Contexto   La función f describe...   La derivada f′ indica...    Geometría   Una curva   La pendiente de la tangente    Física   La posición de un objeto   Su velocidad instantánea    Economía   El costo de producir x unidades   El costo de producir una unidad   extra    Biología   El tamaño de una población   Qué tan rápido crece en ese   momento    Medicina   La concentración de un fármaco   Qué tan rápido se absorbe o   elimina       Además, el  signo   de la derivada cuenta una historia:    •   Derivada positiva   → la función está  subiendo   (crece).    •   Derivada negativa   → la función está  bajando   (decrece).    •   Derivada cero   → la función está “plana” un instante (posible cima o valle).       9. Errores comunes (y cómo evitarlos)    •   Reemplazar h = 0 desde el principio.   Te da 0 ÷ 0, que no tiene sentido. Primero simplifica,   luego aplica el límite.   \nIntroducción a la derivada  ·  Página  8    •   Olvidar el paréntesis.   Es (1 + h)², no 1 + h². El cuadrado afecta a todo el paréntesis.    •   Confundir promedio con instante.   La rapidez promedio usa dos puntos separados; la   derivada es lo que ocurre cuando esa separación se vuelve casi nula.    •   Creer que el límite es “el valor en el punto”.   El límite es hacia dónde se dirige la función.    •   Pensar que h debe ser “muy grande”.   Al contrario: h es un número diminuto que tiende a   cero.       10. Receta resumida    Cómo calcular una derivada con la definición    1.   Escribe  f(a + h) − f(a)  dividido entre  h.    2.   Sustituye la función y desarrolla (potencias, paréntesis).    3.   Simplifica hasta que h se pueda cancelar del denominador.    4.   Ahora sí: haz que h → 0 y obtén el número.       11. Ponte a prueba    Intenta resolver cada ejercicio antes de mirar las respuestas del final.    1.   Para f(x) = x², calcula la rapidez de cambio promedio entre x = 1 y x = 4.    2.   Completa la tabla de x² cuando x se acerca a 2 (prueba con 1,9; 1,99; 2,01; 2,1) y estima   lím x→2   x².    3.   Usa la definición para hallar la derivada de f(x) = x² en a = 2.    4.   Usa la definición para hallar la derivada de f(x) = 5x en cualquier punto a.    5.   ¡Reto! Halla la derivada de f(x) = x³ en a = 1. Pista: (1 + h)³ = 1 + 3h + 3h² + h³.           \nIntroducción a la derivada  ·  Página  9    Respuestas y soluciones    Ejercicio 1.   (16 − 1) ÷ (4 − 1) = 15 ÷ 3 =  5 .    Ejercicio 2.   Los valores son 3,61; 3,9601; 4,0401 y 4,41. Se acercan a 4, así que lím x→2   x² =  4 .    Ejercicio 3.   (2 + h)² − 4 = 4h + h². Dividiendo entre h: 4 + h. Al hacer h → 0:  f′(2) = 4 .    Ejercicio 4.   [5(a + h) − 5a] ÷ h = 5h ÷ h = 5. La derivada es  5   en todos los puntos.    Ejercicio 5.   (1 + h)³ − 1 = 3h + 3h² + h³. Dividiendo entre h: 3 + 3h + h². Al hacer h → 0:  f′(1) = 3 .       Resumen en 5 ideas    1.   La derivada mide qué tan rápido cambia algo en un instante exacto.    2.   Se parte de la rapidez de cambio promedio: (f(a+h) − f(a)) ÷ h.    3.   El límite hace que h se acerque a 0 sin necesidad de dividir entre cero.    4.   Geométricamente, es la pendiente de la recta tangente.    5.   f′(a) = lím h→0   [f(a+h) − f(a)] ÷ h es la definición completa.       ¿Siguiente paso? Calcular derivadas con reglas rápidas (potencias, sumas, productos) que evitan   repetir el límite cada vez.   \n";
    const PDF_NAME = "Introduccion_a_la_derivada.pdf";
    const CHATBOT_THEME = "Introducción a la derivada como límite";
    const PDF2_TEXT_EMBEDDED = "";
    const PDF2_NAME_EMBEDDED = "";
    const MODEL = "openai";
    const PROPOSED_QUESTIONS = ["¿Por qué se dice que la derivada mide qué tan rápido está cambiando algo en un momento exacto?","¿Cómo se calcula la rapidez de cambio promedio cuando una distancia depende del tiempo, por ejemplo con s(t)=t²?","¿Qué significa exactamente que algo “tiende a” un valor (qué es un límite) y cómo se interpreta en un ejemplo como x→3?","¿En qué se diferencia un límite del “valor en el punto” y por qué eso es clave para entender derivadas tipo 0/0?","¿Cómo relaciona el texto la pendiente de una recta con la rapidez de cambio promedio usando dos puntos y una secante?","¿Qué ocurre geométricamente cuando acercas dos puntos de la secante y aparece la tangente en el límite?","¿Cuál es la definición de derivada en un punto f′(a) como límite y qué representan a y h?","En el ejemplo de f(t)=t², ¿cómo se obtiene paso a paso la velocidad exacta en t=1 usando la definición?","Para f(x)=3x+2, ¿cómo se halla f′(5) y por qué el resultado coincide con la pendiente de la recta?","Según el contexto, ¿cómo puede interpretarse el mismo valor de la derivada en geometría, física, economía y biología?","¿Qué errores comunes debes evitar al calcular derivadas (por ejemplo sustituir h=0 antes, olvidar paréntesis o confundir promedio con instante)?","¿Qué pasos sigue la “receta resumida” para calcular una derivada con la definición, y cómo se conectan con las actividades de “ponte a prueba”?"];
    const INITIAL_PALETTE = {"primaryColor":"#3034e8","secondaryColor":"#595ded","bgColor":"#ffffff","textColor":"#111827","cardBgColor":"#ffffff","cardBorderColor":"#d1d5db","inputBgColor":"#ffffff","inputBorderColor":"#cbd5e1","chatBubbleBotBg":"#f3f4f6","chatBubbleBotText":"#111827","chatBubbleUserBg":"#3034e8","chatBubbleUserText":"#f8fafc","headerBorderColor":"#d1d5db","systemMessageBg":"#fef3c7","systemMessageText":"#92400e"};

    let pdf2Text = PDF2_TEXT_EMBEDDED;

    function extractTextFromBackendResponse(raw) {
        if (raw == null) return '';
        const s = String(raw).trim();
        if (!s) return '';
        try {
            const j = JSON.parse(s);
            if (Array.isArray(j)) return JSON.stringify(j);
            if (j && typeof j === 'object') {
                const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
                if (typeof c === 'string') return c.trim();
                if (typeof j.content === 'string') return j.content.trim();
                if (typeof j.text === 'string') return j.text.trim();
            }
            if (typeof j === 'string') return j;
        } catch (e) {}
        return s;
    }
    async function postBackendText(payload) {

        const res = await fetch(BACKEND_BASE + '/api/ia/text', {

        const raw = await res.text();
        if (!res.ok) throw new Error('Error de API: ' + res.status + ' ' + res.statusText + '. ' + raw.substring(0, 200));
        return extractTextFromBackendResponse(raw);

    function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }
    function rgbToHex(r, g, b) {
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
        return '#' + toHex(r) + toHex(g) + toHex(b);
    }
    function mixColors(colorA, colorB, amount) {
        const a = hexToRgb(colorA);
        const b = hexToRgb(colorB);
        return rgbToHex(a.r + (b.r - a.r) * amount, a.g + (b.g - a.g) * amount, a.b + (b.b - a.b) * amount);
    }
    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);
    }
    function getReadableTextColor(bgColor) { return getLuminance(bgColor) > 0.56 ? '#111827' : '#f8fafc'; }
    function generatePalette() {
        const hue = Math.floor(Math.random() * 360);
        const bg = hslToHex(hue, 45 + Math.floor(Math.random() * 20), 16 + Math.floor(Math.random() * 70));
        const text = getReadableTextColor(bg);
        const isDark = getLuminance(bg) < 0.5;
        const accent = hslToHex((hue + 35 + Math.floor(Math.random() * 60)) % 360, 80, isDark ? 55 : 45);
        const card = isDark ? mixColors(bg, '#ffffff', 0.08) : mixColors(bg, '#000000', 0.05);
        const border = isDark ? mixColors(card, '#ffffff', 0.18) : mixColors(card, '#000000', 0.12);
        const input = isDark ? mixColors(card, '#ffffff', 0.07) : mixColors(card, '#000000', 0.04);
        const inputBorder = isDark ? mixColors(border, '#ffffff', 0.12) : mixColors(border, '#000000', 0.1);
        const botBg = isDark ? mixColors(bg, '#ffffff', 0.12) : mixColors(bg, '#000000', 0.06);
        return {
            bgColor: bg,
            textColor: text,
            cardBgColor: card,
            cardBorderColor: border,
            inputBgColor: input,
            inputBorderColor: inputBorder,
            chatBubbleBotBg: botBg,
            chatBubbleBotText: text,
            chatBubbleUserBg: accent,
            chatBubbleUserText: getReadableTextColor(accent),
            primaryColor: accent,
            secondaryColor: isDark ? mixColors(accent, '#ffffff', 0.2) : mixColors(accent, '#000000', 0.2),
            headerBorderColor: border,
            systemMessageBg: isDark ? mixColors(bg, '#fde68a', 0.2) : mixColors(bg, '#fde68a', 0.28),
            systemMessageText: isDark ? '#fef3c7' : '#78350f'
        };
    }
    function buildThemePalette(theme, palette) {
        const base = palette || {
            primaryColor: '#2563eb',
            secondaryColor: '#6b7280',
            bgColor: '#ffffff',
            textColor: '#1f2937',
            cardBgColor: '#ffffff',
            cardBorderColor: '#d1d5db',
            inputBgColor: '#ffffff',
            inputBorderColor: '#cbd5e1',
            chatBubbleBotBg: '#f3f4f6',
            chatBubbleBotText: '#1f2937',
            chatBubbleUserBg: '#2563eb',
            chatBubbleUserText: '#ffffff',
            headerBorderColor: '#e5e7eb',
            systemMessageBg: '#fef3c7',
            systemMessageText: '#92400e'
        };
        const isDark = theme === 'dark';
        const bgColor = isDark ? mixColors(base.bgColor || '#ffffff', '#000000', 0.72) : '#ffffff';
        const textColor = getReadableTextColor(bgColor);
        const cardBgColor = isDark ? mixColors(bgColor, '#ffffff', 0.08) : '#ffffff';
        const cardBorderColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.16) : '#d1d5db';
        const inputBgColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.06) : '#ffffff';
        const inputBorderColor = isDark ? mixColors(cardBorderColor, '#ffffff', 0.12) : '#cbd5e1';
        const chatBubbleBotBg = isDark ? mixColors(bgColor, '#ffffff', 0.12) : '#f3f4f6';
        const chatBubbleBotText = textColor;
        const headerBorderColor = cardBorderColor;
        const systemMessageBg = isDark ? mixColors(bgColor, '#fde68a', 0.2) : '#fef3c7';
        const systemMessageText = isDark ? '#fef3c7' : '#92400e';
        return {
            ...base,
            bgColor,
            textColor,
            cardBgColor,
            cardBorderColor,
            inputBgColor,
            inputBorderColor,
            chatBubbleBotBg,
            chatBubbleBotText,
            headerBorderColor,
            systemMessageBg,
            systemMessageText
        };
    }
    function setPaletteVariables(target, palette) {
        if (!palette) return;
        target.style.setProperty('--primary', palette.primaryColor || '#007bff');
        target.style.setProperty('--secondary', palette.secondaryColor || '#6c757d');
        target.style.setProperty('--bg', palette.bgColor || '#f8f9fa');
        target.style.setProperty('--text', palette.textColor || '#343a40');
        target.style.setProperty('--card', palette.cardBgColor || '#ffffff');
        target.style.setProperty('--border', palette.cardBorderColor || '#dddddd');
        target.style.setProperty('--input', palette.inputBgColor || '#ffffff');
        target.style.setProperty('--iborder', palette.inputBorderColor || '#cccccc');
        target.style.setProperty('--bot-bg', palette.chatBubbleBotBg || '#e9ecef');
        target.style.setProperty('--bot-text', palette.chatBubbleBotText || '#343a40');
        target.style.setProperty('--user-bg', palette.chatBubbleUserBg || '#007bff');

        target.style.setProperty('--sys-bg', palette.systemMessageBg || '#fff3cd');

    }
    function applyPalette(palette) {

    pdf2Upload.addEventListener('change', async (ev) => {

                let text = '';
                for (let i = 1; i <= pdf.numPages; i++) {

    function addMsg(message, sender, isThinking = false) {
        const el = document.createElement('div');
        el.classList.add(sender === 'user' ? 'user-message' : sender.includes('system') ? 'system-message' : 'bot-message');
        if (sender.includes('error')) el.classList.add('error');
        if (sender === 'bot' && !isThinking) {
            const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
            const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
            const botAvatarUrl = getAvatarUrl('bot');

            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else if (sender === 'bot') {
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong> <span class="thinking-animation">' + message + '</span></div></div>';
            el.id = 'thinking-msg';

    function updateLastMsg(message) {
        const el = document.getElementById('thinking-msg');

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
</body>
