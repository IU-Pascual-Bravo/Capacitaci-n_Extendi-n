iones que se reciben de acuerdo con las normas legales.   \n30    Acuerdo Consejo  Directiv o  015    Por medio del cual se expide el Estatuto General de la Institución Universitaria Pascual Bravo                   ARTÍCULO  55.     En  la  elabora ción  del  presupuesto  se  atenderá  el  principio  del   equilibrio  presupuestal  y,  por  lo  tanto,  no  podrán  incluirse  partidas  de  ingresos   inciertos o que provengan de operaciones de crédito no aprobadas definitivamente.       ARTÍCULO  56.     La  ejecución  presupuestal  de berá  hacerse  sobre  la  base  de  los   acuerdos  de  obligaciones  y  de  ordenación  de  gastos  que,  para  el  efecto,  expida  el   Consejo Directivo.             TÍTULO  CUARTO       DEL PERSONAL DOCENTE,   ADMINISTRATIVO   Y   DE LOS ESTUDIANTES       CAPÍTULO I       DEL PERSONAL DOCENTE Y ADMIN ISTRATIVO       ARTÍCULO 57. DEL PERSONAL DOCENTE.   El profesor es la persona nombrada   o contratada como tal para desarrollar actividades de Docencia, de Investigación,   de Extensión y Proyección Social, y de Administración Académica, de acuerdo con   la  distribuci ón  consignada  en  su  plan  de  trabajo,  y  constituye  un  elemento   dinámico  para  la  formación  integral  de  los  estudiantes;  es  un  funcionario  público   comprometido con la solución de los problemas sociales que coadyuva, dentro de   la  autonomía  universitaria,  a  la  prestación  de  un  servicio  público,  cultural  e   inherente  a  la  finalidad  social  del  Estado.    Para  efectos  administrativos  está   adscrito  a  uno  de  los  Departamentos,  Institutos  o  Escuelas  constitutivos  de  una   Facultad, bajo la dependencia del Decano respectivo .         El profesor se constituye en guía para que el estudiante logre su meta educativa;   procura  que  éste  sea  sujeto  activo  en  el  descubrimiento  y  adquisición  de  los   conocimientos; con su trabajo, ejemplo y orientación a los alumnos colabora en la   preservaci ón  de  un  ambiente  que  permita  el  cumplimiento  de  la  función  de  la   Institución.       El  personal  docente  se  regirá  por  el  Estatuto  Docente  que  para  el  efecto  expida  el   Consejo  Directivo,  de  conformidad  con  las  disposiciones  establecidas  en  la  Ley  30   de 1992 y d emás normas aplicables.       PARÁGRAFO .     El  Estatuto  Docente  contendrá,  entre otros aspectos, el  régimen de   vinculación  y  promoción,  las  categorías,  el  retiro  y  las  demás  situaciones   administrativas;  los  derechos,  las  funciones  y  las  obligaciones  correspondient es  a  \n31    Acuerdo Consejo  Directiv o  015    Por medio del cual se expide el Estatuto General de la Institución Universitaria Pascual Bravo                cada  categoría  y  dedicación;  las  inhabilidades  e  incompatibilidades;  un  sistema  de   evaluación  integral  y  periódico  del  desempeño;  el  régimen  disciplinario;  las   distinciones  y  los estímulos académicos  y económicos, en función  de  la excelencia   académica ;  y  las  condiciones  y  los  procedimientos  para  la  renovación  de  la   vinculación del profesor.       ARTÍCULO 58.  Los profesores de la Institución podrán ser de dedicación exclusiva,   tiempo completo, de medio tiempo y de cátedra. La dedicación del tiempo completo   a la Institución será de cuarenta (40) horas laborales semanales.       El  personal  docente  se  regirá  por  el  Estatuto  Docente  que  para  el  efecto  expida  el   Consejo  Directivo,  de  conformidad  con  las  disposiciones  establecidas  en  la  Ley  30   de 1992 y demás normas a plicables.       Ningún  funcionario  del  Estado,  de  tiempo  completo,  podrá  ser  nombrado  como   docente de igual dedicación, salvo las excepciones consagradas en la Ley.       ARTÍCULO  59.     DEL  PERSONAL  ADMINISTRATIVO.  DEFINICIÓN.    El    p ersonal   a dministrativo  está  conforma do  por  quienes  son  nombrados  para  desempeñar   funciones  administrativas  y  demás  labores  requeridas  para  el  funcionamiento   institucional.       De acuerdo con las funciones del cargo, el vínculo del personal administrativo con   la  Institución  podrá  ser:  de  libre  n ombramiento  y  remoción,  de  carrera   administrativa, o trabajadores oficiales.          Son  empleados  de  libre  nombramiento  y  remoción  quienes  desempeñen   cargos de dirección, supervisión, conducción y orientación institucional, cuyo   ejercicio implique adopción de po líticas o directrices.       Son  empleados  de  carrera  aquellos  que  se  encuentren  inscritos  en  ella  de   conformidad con las normas legales vigentes.       Son  trabajadores  oficiales  quienes  desempeñen  labores  de  construcción  y   sostenimiento de obras públicas.       Todo el p ersonal administrativo de la Institución se rige por el Reglamento Interno   de  Trabajo  y  por  toda  la  normativa  que  regula  el  Régimen  Laboral  de  la   Administración Pública.       PARÁGRAFO  PRIMERO .  Lo dispuesto en este artículo se aplicará sin perjuicio de   las sit uaciones jurídicas individuales consolidadas conforme a derecho.       PARÁGRAFO SEGUNDO.   Lo dispuesto en este artículo se aplica sin perjuicio de   los  derechos  individuales  consagrados  en  Convenciones  Colectivas  de  Trabajo  y  \n32    Acuerdo Consejo  Directiv o  015    Por medio del cual se expide el Estatuto General de la Institución Universitaria Pascual Bravo                Laudos  Arbítrales,  siempre  y  cuando  el  servidor  permanezca  vinculado  a  la   Institución en el oficio que ocupe al entrar en vigencia el presente Estatuto.       ARTÍCULO 60. ESTATUTO DEL PERSONAL ADMINISTRATIVO.   El Estatuto del   Personal  Administrativo  será  exped ido  por  el  Consejo  Directivo  y    contie ne,  entre   otros  aspectos,  el  régimen  de  vinculación  y  promoción,  las  categorías,  el  retiro  y   las  demás  situaciones  administrativas;  los  derechos,  las  obligaciones,   inhabilidades  e  incompatibilidades  según  el  tipo  de  vinculación;  y  el  régimen   disciplinario,   de conformidad con las normas vigentes. Está basado en criterios de   selección, de ingreso y de promoción por concurso, y en la evaluación periódica y   sistemática del desempeño.       PARÁGRAFO.     Las  personas  que  presten  sus  servicios  a  la  Institución  en  forma   o casional o por el tiempo de ejecución de una obra o contrato no forman parte del   personal administrativo y su vinculación se hace por contrato de ejecución de obra   o de prestación de servicios.         Sólo  se  podrá  hacer  nombramientos  para  cargos  con  vacancia  temporal  o   definitiva  contemplados  en  la  planta  de   personal.  El  nombramiento  en   contravención de lo dispuesto en este artículo es ilegal y puede ser decl arado nulo   por  la  jurisdicción  c ontencioso    administrativa.    La  autoridad  nominadora  deberá   declarar  la  i nsubsistencia  tan  pronto  tenga  conocimiento  de  la  ilegalidad  de  un   nombramiento, so pena de incurrir en causal de mala conducta.       En todo caso ,   le serán aplicables las normas contenidas en los Decretos 2400 de   1968, 2045 de 1969, 1042 y 1045 de 1978, Ley 6 1 de 1987, Ley 190 de 1995, Ley   200 de 1995, Ley 443 de 1998 y demás normas que los reglamenten, modifiquen   o adicionen.          CAPÍTULO  II       DE LOS ESTUDIANTES       ARTÍCULO  61.    La  Instituci ón  Universitaria  Pascual  Bravo    será  accesible  a  los   estudiantes  que  demuest ren  poseer  las  capacidades  y  calidades  requeridas  y   cumplan  con  las  condiciones  académicas  exigidas;  sin  discriminación  de  sexo,   raza, etnia, condición económica, política y social.       ARTÍCULO  62.    El  estudiante  de  la  Institución  es  la  persona  que  tiene  matr ícula   vigente  en  un  programa  de  educación  para  el  trabajo  y  el  desarrollo  humano,   programa académico de pregrado o de posgrado, ligado al engrandecimiento de la   Institución, mediante una respuesta positiva a su compromiso con el conocimiento,  \n33    Acuerdo Consejo  Directiv o  015    Por medio del cual se expide el Estatuto General de la Institución Universitaria Pascual Bravo                en  el  marco  d e  los  principios  rectores  del  quehacer  institucional.  La  calidad  de   estudiante se pierde o se suspende en casos específicamente determinados.       Al  matricularse,  el  estudiante  se  compromete  por  escrito  a  respetar  y  cumplir  las   normas de la Institución.        La  Institución asegura a sus estudiantes el derecho al estudio y brinda los medios   adecuados para su pleno ejercicio, de acuerdo con las posibilidades económicas y   administrativas, por medio de sus programas académicos y recursos docentes; el   campus  de  la  Ins titución  es  el  espacio  donde  el  estudiante  construye  su  propia   identidad  y  se  ubica  como  individuo  en  un  entorno  físico,  social  y  cultural.  Les   reconoce  el  derecho  de  organizarse  para  participar  en  la  vida  universitaria,  en  el   marco del respeto de la opini ón ajena, de la pluralidad de posiciones y análisis, y   del  ejercicio  de  estos  derechos  en  condiciones  de  acatamiento  a  los   procedimientos de la democracia.       Los  estudiantes  se  regirán  por  el  Reglamento  Estudiantil  expedido  por  el  Consejo   Directivo,  de  conf ormidad  con  las  disposiciones  establecidas  en  la  Ley  30  de  1992   así como por los reglamentos internos que expida el Rector tendientes a procurar el   bienestar general de la Institución.       El Reglamento Estudiantil incluirá como mínimo los siguientes aspectos : requisitos   de  inscripción,  de  admisión  y  de  matrícula;  derechos  y  deberes;  distinciones  e   incentivos; y régimen disciplinario y académico.       ARTÍCULO  63.   Las  sanciones  aplicables  a  los  estudiantes  son  de  carácter   académico  y  disciplinario.  Se  notificarán    de  acuerdo  con  lo  que  se  disponga  en  el   Reglamento Estudiantil.       ARTÍCULO 64.   El recurso de apelación solo procede cuando se trate de la sanción   de  expulsión,  de  acuerdo  con  los  procedimientos  que  establezca  el  Reglamento   Estudiantil.       En  los  demás  casos,    solo  procede  el  recurso  de  reposición.  Si  la  expulsión  es   impuesta por el Rector, la apelación se surtirá ante el Consejo Directivo.          CAPÍTULO  III       DISPOSICIONES VARIAS   Y TRANSITORIAS       ARTÍCULO  65.     El  derecho  a  la  libre  asociación  será  respetado  conforme    a  la  Ley   para todos los estamentos institucionales.   \n34    Acuerdo Consejo  Directiv o  015    Por medio del cual se expide el Estatuto General de la Institución Universitaria Pascual Bravo                   ARTÍCULO 66.   El presente Acuerdo deroga en particular el acuerdo 012 del 22 de   Julio    de  2010  con  sus  modificaciones,  y  todas  las  disposiciones  que  le  sean   contrarias.       ARTÍCULO 67.   El presente Acuerdo ri ge a partir de la fecha de su expedición y una   vez  surtidos  los  trámites  señalados  en  el  parágrafo  del  artículo  29  de  la  Ley  30  de   1992       ARTÍCULO  PRIMERO  TRANSITORIO .   Para los efect os establecidos en el presente   E statuto,  mientras  se  designan  las  autoridad es  y  organismos  que  se  crean  en  el   presente estatuto, continúan en funciones los actuales organismos y autoridades.       ARTÍCULO    SEGUNDO    TRANSITORIO .     El  Consejo  Directivo  deberá  reglamentar   los aspectos que el presente Estatuto General establece en un plazo m áximo de seis   (6) meses contados a partir de su expedición.       PUBLÍQUESE   Y CÚMPLASE       Dado en Medellín,  a los   22  días   de  diciembre   de 2017                         Original firmado         Original firmado    JORGE IVAN RIOS RIVERA     JUAN PABLO ARBOLEDA GAVIRIA    Presidente           Secretario       Pr oyectó : CD   Elaboró: Berta C.   Revisó: JPAG/CD    Firma:   Firma:   Firma:      \n";

    function extractTextFromBackendResponse(raw) {
        if (raw == null) return '';
        const s = String(raw).trim();
        if (!s) return '';
        try {
            const j = JSON.parse(s);
            if (Array.isArray(j)) return JSON.stringify(j);
            if (j && typeof j === 'object') {
                const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
                if (typeof c === 'string') return c.trim();
                if (typeof j.content === 'string') return j.content.trim();
                if (typeof j.text === 'string') return j.text.trim();
            }
            if (typeof j === 'string') return j;
        } catch (e) {}
        return s;
    }
    async function postBackendText(payload) {
        const body = { model: payload.model || 'openai-fast', prompt: payload.prompt };
        if (payload.system) body.system = payload.system;
        if (payload.json) body.json = true;
        const res = await fetch(BACKEND_BASE + '/api/ia/text', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const raw = await res.text();
        if (!res.ok) throw new Error('Error de API: ' + res.status + ' ' + res.statusText + '. ' + raw.substring(0, 200));

    function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }
    function rgbToHex(r, g, b) {
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
        return '#' + toHex(r) + toHex(g) + toHex(b);
    }
    function mixColors(colorA, colorB, amount) {
        const a = hexToRgb(colorA);
        const b = hexToRgb(colorB);
        return rgbToHex(a.r + (b.r - a.r) * amount, a.g + (b.g - a.g) * amount, a.b + (b.b - a.b) * amount);
    }
    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);
    }
    function getReadableTextColor(bgColor) { return getLuminance(bgColor) > 0.56 ? '#111827' : '#f8fafc'; }
    function generatePalette() {
        const hue = Math.floor(Math.random() * 360);
        const bg = hslToHex(hue, 45 + Math.floor(Math.random() * 20), 16 + Math.floor(Math.random() * 70));
        const text = getReadableTextColor(bg);
        const isDark = getLuminance(bg) < 0.5;
        const accent = hslToHex((hue + 35 + Math.floor(Math.random() * 60)) % 360, 80, isDark ? 55 : 45);
        const card = isDark ? mixColors(bg, '#ffffff', 0.08) : mixColors(bg, '#000000', 0.05);
        const border = isDark ? mixColors(card, '#ffffff', 0.18) : mixColors(card, '#000000', 0.12);
        const input = isDark ? mixColors(card, '#ffffff', 0.07) : mixColors(card, '#000000', 0.04);
        const inputBorder = isDark ? mixColors(border, '#ffffff', 0.12) : mixColors(border, '#000000', 0.1);
        const botBg = isDark ? mixColors(bg, '#ffffff', 0.12) : mixColors(bg, '#000000', 0.06);
        return {
            bgColor: bg,
            textColor: text,
            cardBgColor: card,
            cardBorderColor: border,
            inputBgColor: input,
            inputBorderColor: inputBorder,
            chatBubbleBotBg: botBg,
            chatBubbleBotText: text,
            chatBubbleUserBg: accent,
            chatBubbleUserText: getReadableTextColor(accent),
            primaryColor: accent,
            secondaryColor: isDark ? mixColors(accent, '#ffffff', 0.2) : mixColors(accent, '#000000', 0.2),
            headerBorderColor: border,
            systemMessageBg: isDark ? mixColors(bg, '#fde68a', 0.2) : mixColors(bg, '#fde68a', 0.28),
            systemMessageText: isDark ? '#fef3c7' : '#78350f'
        };
    }
    function buildThemePalette(theme, palette) {
        const base = palette || {
            primaryColor: '#2563eb',
            secondaryColor: '#6b7280',
            bgColor: '#ffffff',
            textColor: '#1f2937',
            cardBgColor: '#ffffff',
            cardBorderColor: '#d1d5db',
            inputBgColor: '#ffffff',
            inputBorderColor: '#cbd5e1',
            chatBubbleBotBg: '#f3f4f6',
            chatBubbleBotText: '#1f2937',
            chatBubbleUserBg: '#2563eb',
            chatBubbleUserText: '#ffffff',
            headerBorderColor: '#e5e7eb',
            systemMessageBg: '#fef3c7',
            systemMessageText: '#92400e'
        };
        const isDark = theme === 'dark';
        const bgColor = isDark ? mixColors(base.bgColor || '#ffffff', '#000000', 0.72) : '#ffffff';
        const textColor = getReadableTextColor(bgColor);
        const cardBgColor = isDark ? mixColors(bgColor, '#ffffff', 0.08) : '#ffffff';
        const cardBorderColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.16) : '#d1d5db';
        const inputBgColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.06) : '#ffffff';
        const inputBorderColor = isDark ? mixColors(cardBorderColor, '#ffffff', 0.12) : '#cbd5e1';
        const chatBubbleBotBg = isDark ? mixColors(bgColor, '#ffffff', 0.12) : '#f3f4f6';
        const chatBubbleBotText = textColor;
        const headerBorderColor = cardBorderColor;
        const systemMessageBg = isDark ? mixColors(bgColor, '#fde68a', 0.2) : '#fef3c7';
        const systemMessageText = isDark ? '#fef3c7' : '#92400e';
        return {
            ...base,
            bgColor,
            textColor,
            cardBgColor,
            cardBorderColor,
            inputBgColor,
            inputBorderColor,
            chatBubbleBotBg,
            chatBubbleBotText,
            headerBorderColor,
            systemMessageBg,
            systemMessageText
        };
    }
    function setPaletteVariables(target, palette) {
        if (!palette) return;
        target.style.setProperty('--primary', palette.primaryColor || '#007bff');
        target.style.setProperty('--secondary', palette.secondaryColor || '#6c757d');
        target.style.setProperty('--bg', palette.bgColor || '#f8f9fa');
        target.style.setProperty('--text', palette.textColor || '#343a40');
        target.style.setProperty('--card', palette.cardBgColor || '#ffffff');

        target.style.setProperty('--input', palette.inputBgColor || '#ffffff');
        target.style.setProperty('--iborder', palette.inputBorderColor || '#cccccc');
        target.style.setProperty('--bot-bg', palette.chatBubbleBotBg || '#e9ecef');

        target.style.setProperty('--sys-bg', palette.systemMessageBg || '#fff3cd');

    }
    function applyPalette(palette) {

    function addMsg(message, sender, isThinking = false) {

            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
</body>
