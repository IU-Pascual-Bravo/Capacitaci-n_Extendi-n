<script>
    const PDF_TEXT = "   Efecto de la superficie de la textura en el rendimiento de cojinetes   deslizantes en estado hidrodinámico       El uso de superficies texturizadas con diferentes formas de microcavidades (texturas) y en   diferentes ubicaciones de la zona de textura puede ser    un método eficaz para mejorar el   rendimiento de los rodamientos. El presente estudio examina la influencia de la ubicación   de  la  textura  en  el  rendimiento  de  los  cojinetes  hidrodinámicos.  Los  resultados  teóricos   demuestran  que  las  características  más  impor tantes  pueden  mejorarse  mediante  una   disposición adecuada de las texturas en de la superficie de contacto .    La tribología es una ciencia que abarca el estudio de la fricción, el desgaste, la lubricación   y  la  mecánica  de  contacto,  y  permite  comprender  las  interacciones  de  la  superficie  y   proponer  soluciones  para  los  problemas  esenciales.  La  expansión  de  las  aplic aciones   tribológicas,  habitualmente  desde  la  maquinaria  industrial  hasta  las  aplicaciones   microscópicas, ha reavivado la importancia de la mecánica de contacto,  y  el interés en este   campo. Los cojinetes hidrodinámicos se utilizan con frecuencia en una gama   más amplia   de  aplicaciones  y  mecanismos.  Muchos  trabajos  [1 - 14]  se  han  dedicado  a  estudiar  la   influencia  de  la  rugosidad  en  la  hidrodinámica ,   en  el  rendimiento  de  los  cojinetes   hidrodinámicos  La  conclusión  fue  que  la  rugosidad  influye  en  el  rendimiento  de  los   rodamientos.   La  rugosidad  de  los  rodamientos  hidrodinámicos  puede  deberse  a  la   presencia de polvo, aditivos   en el lubricante y el desgaste, mientras que la rugosidad puede   ser aleatoria o   determinista.    La  rugosidad  determinista  que  se  conoce  como  textura  superficial   se  introdujo   deliberadamente  en  los  rodamientos  con  la  ayuda  de  técnicas  de  microfabricación.     El   texturizado de la superficie reclama cada vez más atención y   s e espera que el tratamiento   de la superficie reciba cada vez más atención y que sea un componente importante en los   futuros rodamientos  estructurados ,   de   la estructura de los cojinetes, tal y como demuestran   los autores  [15,16]. Por  medio de esta  nueva tecnología  (texturización de superf icies por   láser   texturización de la superficie [17], grabado químico [18], nueva técnica de tratamiento    [19], etc.), es posible producir microgeometrías controladas   (texturas) en las superficies de   los rodamientos para mejorar el rendimiento tribológico   global, incluida la reducción de la   fricción, la   mejora de la fiabilidad, el aumento de las condiciones de vida y   el consumo de   energía.  Tonder     [20]  señaló  que,  al  introducir  series  de  espinillas     o  rugosidad  en  la   superficie de deslizamiento, se genera una p resión adicional   y, por tanto, una mayor carga,   lo que también ha sido confirmado por Cupillardetal .   [24]. Kovalchenkoetal. [21] demostró   que  el  texturizado  con  láser     amplía  los  parámetros  de  contacto  en  términos  de  carga  y    Siripuram  y  Stephens  [22]  presentan  un  estudio  numérico  de  los  efectos  de  las   microaspere z as con diferentes   formas en la lubricación de superficies deslizantes cuando   se  encuentran  películas  hidrodinámicas.  El  coeficiente  de  fricción  mínimo  para  todos  los   escapes  que  se  ha  encontrado  en  una  proporción  de  0,2  en  el  caso  de  las  esperanzas   positivas y de 0,7 en el  caso de las esperanzas n egativas.   Algunos otros estudios recientes   [23 - 29] han establecido que  geometrías   y control , como la profundidad, anchura, número   de texturas y ubicación de  estas   influyen en   el rendimiento del rodamiento.   \n   En otros estudios [30 - 33], se han resuelto las ecuaciones de Navier - Stok para el flujo entre   dos superficies paralelas, una lisa y otra lisa.   para el flujo entre dos superficies paralelas,   una  lisa  y  otra  que  tiene  un  hueco  en  la  superficie.     Los  estudios  han  demostrado  que  el   efecto  de  la  presión     efecto  generador  de  presión  en  la  textura  de  la  superficie  en  el   funcionamiento de la película podría ser el resultado de la inercia convectiva.   La viscosidad   piezoeléctrica  puede  desempeñar  un  papel  importante  en    los  contactos  lubricados  con   mucha carga.   Por lo tanto, en las regiones de convergencia local   la presión puede ser mayor   que la caída de presión en las regiones divergentes.   Arghiretal. [30] han demostrado que   las ecuaciones de  N avier - Stokes   son inadecuadas para predecir la presión acumulada con   la presencia de   con la presencia de una mayor rugosidad, ya que los efectos de la inercia   pueden ser más importantes. Este hallazgo fue confirmado posteriormente por Sahlinetal.   [31] también   presentó un estudio sobr e la optimización de la geometría.   Kraker etal. [32], la   utilización de una secuencia de Reynold para estudiar los efectos   de la textura será válida   si  el  espesor  de  la  película  es  mayor  que  el  mínimo     de  la  película  del  lubricante  en  la   lubricación por película líquida.   Cupillard   et al. [33] han comprobado que el mecanismo de   la presión acumulada en una   brecha convergente entre las dos superficies de deslizamiento   y  la textura es     es similar  a la obtenida con la variación de convergencia para  superficies   lis as.   El mismo autor [34] descubrió que existe una profundidad de textura óptima, mayor   que la profundidad crítica, se produce una zona de recirculación global.   Por encima de esta   profundidad, se produce una zona de recirculación global, lo que provoca una pérdida de   capacidad  de  carga.     En  los    contactos  hidrodinámicos  no  cavitados     donde  se  cumple  la   hipótesis de Reynolds, Buscagliaetal. [35,36]   ha demostrado que la textura completa tiene   un impacto negativo tanto en la elevación hidrodinámica como en la viscosidad.   Los efectos   positivos  de  la  textura     observados  en  los  deslizadores  paralelos  de  textura  completa  se   explican mediante dos teorías.   La primera considera los fenómenos de cavitación como la   fuente de estos efectos.   La primera considera que los fenómenos de cavitación son la fuente   de  est os  efectos  positivos     de  hoyuelos  crea  una  alternancia  de  regiones  de  película   convergentes y divergentes   en la que la presión varía entre un valor positivo en las regiones   lubricadas  y  la  presión  de  vaporización  en  las  regiones  cavitadas.     En  consecuencia,  se   obtiene  un  resultado  globalmente  positivo  [37].  Otra  teoría  sugiere  que  la  capacidad  de   carga     generada  en  las  correderas  paralelas  de  textura  fina  se  debe  a  los  efectos  de  la   inercia     (inercia  convectiva)  [30].  Recientemente  se  ha  demostrado  que  esta  teo ría  es   inexacta y que los efectos de la inercia tienen, en general, una   influencia negativa sobre el   rendimiento hidrodinámico [38].   Por consiguiente, la cavitación es el principal mecanismo    que  conduce  al  aumento  de  la  elevación  y  a  la  reducción  de  la  fricción  observados   Recientemente, Dobrica   et   al. [39]    concluyen que:    La  texturización  completa  no  puede  generar  una  elevación  hidrodinámica  en  los   deslizadores  paralelos,   excepto  cuando  los  hoyuelos  se  colocan  en  la  entrada  del   deslizador  (el  levantamiento  generado  es  mínimo).     En  los  deslizadores  convergentes   inclinados hacia el plano, la texturización completa tiene efectos negativos.    En  los  deslizadores  convergentes  inclinados,  la  texturización  completa  tiene  efectos   negativos.   En   los deslizadores paralelos parcialmente texturizados, el efecto positivo de la   textura es   debido al mecanismo de cavitación, el flujo de entrada aumenta y se desarrolla  \nuna  lubricación  completa  a  cierta  distancia  del  borde  principal.  Pero  en  las  correderas   convergentes,  la  cavitación  tiene     l a  influencia  de  la  cavitación  es  mínima  (afecta  a  una   pequeña parte del contacto).    La influencia de la cavitación es mínima (afecta a una pequeña parte del contacto ).   En   los   deslizadores paralelos, el inicio del texturizado parcial en la entrada genera un significativo   levantamiento  dinámico.     En  los  deslizadores  inclinados  hacia  el  plano  con  una  baja   convergencia global de la película, el texturizado parcial proporciona pequeñas mejoras de   rendimiento.   En los deslizadores de alta convergencia, el texturizado parcial tiene un efecto   mínimo.   En los deslizadores de alta convergencia, el texturizado tiene un efecto mínimo.    Diferentes investigadores han adoptado distintos modelos de rugosidad superficial (modelo   de rugosidad aleatoria, modelo sinusoidal, modelo de hoyuelos, etc.) para concluir que la   rugosidad  o  textura  de  la  superficie  mejora  el  rendimiento  del  rodamiento.  E n  varios   estudios se ha intentado determinar los parámetros óptimos de texturización que minimicen   la fricción o maximicen el espesor de la película de fluido (lo que equivale a maximizar la   capacidad de carga). Una de las conclusiones que se desprenden de   estos estudios es que   el texturizado parcial conduce a un mejor rendimiento que el texturizado completo. Por lo   tanto,  en  el  presente  trabajo  se  utiliza  la  textura  superficial  determinista  para  estudiar  la   influencia  de  la  ubicación  de  las  texturas  en  la    superficie  del  cojinete.  El  análisis  de  la   superficie, utilizado en la lubricación hidrodinámica, requiere declaraciones detalladas de la   superficie; una malla refinada de ésta y una importante potencia de cálculo. Se utiliza un   enfoque numérico para dar u na descripción del efecto de la ubicación de las texturas sobre   las  características  más  importantes  en  un  cojinete  hidrodinámico.  Mediante  una  sabia   elección de la disposición de las texturas en una de las superficies del cojinete, se puede   mejorar su rend imiento. La superficie del cojinete está texturizada con hoyuelos cilíndricos.    2. Formulación del problema    En un problema de lubricación hidrodinámica, las ecuaciones de gobierno en una región   de lubricación hidrodinámica completa pueden ser descritas por la conocida ecuación de   Reynolds.   Para las coordenadas cartesianas, cuando   el espesor de la película lubricante h   está en la dirección del eje y   (Fig. 1)    la  presión  en  la  película  lubricante  para  un  gorrón  que    funciona  en  estado  estacionario  se  rige  por  la  siguiente   ecuación   [40]:       En la ecuación (1), P es la presión del lubricante, h es el   espesor de la película. La ecuación (2) describe el espesor   de la película h que puede escribirse como sigue.       Es  un  hecho  conocido  que  el  espesor  de  la  película   lubricante          o  el  rodamiento  liso  (sin    texturas)     depende     de  la  distancia  radial  C,  de  la  relación   \nde excentricidad   ɛ   y la posición angular Ꝋ .   En la ecuación anterior,  es la variación   del espesor de la película debida a la superficie texturizada   (Fig. 1b).  Las condiciones de   contorno, conocidas como condiciones de contorno de   Reynolds,  se  utilizan  para  determinar  la  zona  de   ruptura  de  la  película.  Consisten  en  garantizar  que      en los límites de ruptura de   la película lubricante.    En el caso del presente estudio   el rodamiento funciona   en  condiciones  estables ,  la  fuerza  aplicada  F  es   constante.  Los  parámetros  se  calculan  para  una   excentricidad fija    La  carga  total   W   (soportado  por  el  contacto)  se  calcula   integrando  el  campo  de  presión  a  lo  largo  de  la  superficie  de   contacto  del    cojinete  de  deslizamiento,  entonces  el  ángulo  de   actitud   φ  es obtenido (Fig. ar la región de flui do de película completa. En el caso complejo de un cojinete de   deslizamiento, con zonas convergentes (presión hidrodinámica) y divergentes (cavitación),   el  texturizado  parcial  tiene  un  efecto  positivo  mínimo  y  el  texturizado  completo  tiene  un   efecto negati vo.  El diseño óptimo del área de texturización depende en gran medida de los   parámetros  geométricos  y  de  las  condiciones  de  funcionamiento  del  cojinete  de   deslizamiento.   \n";

    function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }
    function rgbToHex(r, g, b) {
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
        return '#' + toHex(r) + toHex(g) + toHex(b);
    }
    function mixColors(colorA, colorB, amount) {
        const a = hexToRgb(colorA);
        const b = hexToRgb(colorB);
        return rgbToHex(a.r + (b.r - a.r) * amount, a.g + (b.g - a.g) * amount, a.b + (b.b - a.b) * amount);
    }
    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);
    }
    function getReadableTextColor(bgColor) { return getLuminance(bgColor) > 0.56 ? '#111827' : '#f8fafc'; }
    function generatePalette() {
        const hue = Math.floor(Math.random() * 360);
        const bg = hslToHex(hue, 45 + Math.floor(Math.random() * 20), 16 + Math.floor(Math.random() * 70));
        const text = getReadableTextColor(bg);
        const isDark = getLuminance(bg) < 0.5;
        const accent = hslToHex((hue + 35 + Math.floor(Math.random() * 60)) % 360, 80, isDark ? 55 : 45);
        const card = isDark ? mixColors(bg, '#ffffff', 0.08) : mixColors(bg, '#000000', 0.05);
        const border = isDark ? mixColors(card, '#ffffff', 0.18) : mixColors(card, '#000000', 0.12);
        const input = isDark ? mixColors(card, '#ffffff', 0.07) : mixColors(card, '#000000', 0.04);
        const inputBorder = isDark ? mixColors(border, '#ffffff', 0.12) : mixColors(border, '#000000', 0.1);
        const botBg = isDark ? mixColors(bg, '#ffffff', 0.12) : mixColors(bg, '#000000', 0.06);
        return {
            bgColor: bg,
            textColor: text,
            cardBgColor: card,
            cardBorderColor: border,
            inputBgColor: input,
            inputBorderColor: inputBorder,
            chatBubbleBotBg: botBg,

    function buildThemePalette(theme, palette) {

    function addMsg(message, sender, isThinking = false) {
        const el = document.createElement('div');
        el.classList.add(sender === 'user' ? 'user-message' : sender.includes('system') ? 'system-message' : 'bot-message');
        if (sender.includes('error')) el.classList.add('error');

            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else if (sender === 'bot') {

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }

    }

            '<p class="meta"><strong>Documento:</strong> ' + escapeHtml(PDF_NAME) + '</p>' +
            '<p class="meta"><strong>Tema del chatbot:</strong> ' + escapeHtml(CHATBOT_THEME) + '</p>' +
            '<p class="meta"><strong>Modelo:</strong> ' + escapeHtml(MODEL) + '</p>' +
            '<hr><div class="chat-export">' + clone.innerHTML + '</div></body></html>';
    }

    function downloadSessionHtml() {
        const blob = new Blob([getSessionHTML()], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Sesion_Chat_' + Date.now() + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
</body>
</html>
