<script>
    const PDF_TEXT = "Página 1  Walter Rossi Bayardo  Ma. Liliana Santos Vázquez * *  EL COSTEO BASADO EN ACTIVIDADES Aportes y Limitaciones  En un ambiente de  creciente competitividad  y globalización, el análisis tendiente a  buscar  una  mayor  eficiencia  de  las  organizaciones  que  fabrican  bienes  o  prestan  servicios,  y  la  adecuada  diferenciación,  puede  tener  una  herramienta  muy  valiosa  en  el  Costeo  Basado  en  Actividades (ABC), que permite sustentar decisiones estratégicas y tácticas. Este artículo plantea  algunos  aportes  claves  que  esta  herramienta  realiza  para  la  Administración  Estratégica  de  Costos  y  consideraciones  para  que  su  implementación  logre  maximizar  la  relación  costo - beneficio  de  la  información.  Para  ello  inicialmente  presenta  algunos  conceptos  introductorios en torno al tema y realiza una breve reseña de su metodología.  I   ALGUNOS CONCEPTOS INTRODUCTORIOS  1.   El Mercosur y el ABC  Muchas  son  las  finalidades  que  pueden  atribuírsele  a  la  creación  del  Mercosur  o  de  cualquier  mercado  común.  No  obstante  creemos  que  hay  dos,  que  sienten  profundamente  los  agentes  económicos  que  se  mueven en la región y que tienen que ver con el uso del Costeo Basado en Actividades (ABC). Ellas son  la búsqueda de un mercado interno mayor y el aumento de la potencialidad de las unidades productivas  para  competir  en  un  mercado  global.  Sin  duda  para  poder  competir  en  un  nuevo  mercado  ampliado  y  proyectarse al mercado global es necesario que las unidades productivas encuentren formas de mejorar su  gestión, aumentando la eficiencia de las operaciones y reduciendo sus costos.  Este trabajo procura establecer la opinión de los autores sobre en qué medida este método de costeo o de  análisis de costos, proporcionando información para la toma de decisiones, puede contribuir a lograr los  resultados esperados por los agentes económicos en el marco de apertura y globalización de la economía.  2.   El ABC: ¿algo nuevo bajo el sol?  Si bien en la década del 70 aparecen las primeras publicaciones sobre Costeo Basado en Actividades, no  se conocen aplicaciones de este sistema hasta la década del 80, en que el desarrollo de la informática pone                                                             *    Los autores son, respectivamente, profesor titular de Teoría Contable  Superior y  Contabilidad y Contabilidad de  Precios  y  miembro  del  Consejo  Académico  del  Departamento  de  Ciencias  y  Técnicas  Contables,  y  docente  de  las  cátedras de Contabilidad y Cambio de Precios y Teoría Contable Superior, de la Facultad de Ciencias Económicas y  de Administración, Universidad del a República.  Este artículo fue realizado sobre la base del trabajo presentado por los autores en las XVII Jornadas de Ciencias  Económicas del Cono Sur. En él se incorporaron algunas consideraciones adicionales, en especial, en torno a los  aspectos que en tal ocasión suscitaron mayor inquietud entre los participantes. \nPágina 2  a disposición de las empresas los medios para obtener y procesar más fácilmente información clave para  su implementación. Es a partir de 1984 que comienza a proliferar la literatura sobre este tema y en 1985  K.  Williams  y  N.  Vintila  lo  aplican  en  la  fábrica  John  Deere,  para  distribuir  los  gastos  generales  de  fábrica.  Sin embargo la idea central del ABC: identificar los factores que originan el costo y emplearlos para una  determinación más precisa del mismo, es la idea básica de todo sistema de costos y puede observarse ya  en  literatura  contable  de  los  años  40  y  50.  Entonces  ¿el  ABC  es  solo  un  resurgimiento  de  los  criterios  tradicionales o, por el contrario, una revolución en los sistemas de costos?  Si bien la idea motivadora existía ya a mediados de siglo, una cosa eran los modelos académicos y lógicos  desarrollados  y  otra  los  modelos  aplicados  en  la  mayoría  de  las  empresas.  Los  primeros  resultaban  relativamente  complejos  para  las  posibilidades  informáticas  existentes  y  el  costo  del  procesamiento  no  justificaba en muchos casos la utilidad de la información. Por ello tuvieron, en la mayoría de los casos,  que ser simplificados.  En la actualidad un muy alto porcentaje de los sistemas de costos están destinados, fundamentalmente, a  lograr una valuación de los artículos producidos a efectos de su inclusión en los estados contables o con  fines de determinación de impuestos. Raramente se usan esos sistemas con fines de análisis de eficiencia,  para estudiar reducciones de costos y en general no producen información significativa sobre los costos de  ventas o de administración.  El  ABC  retoma  la  idea  motivadora  de  los  modelos  académicos,  trata  de  producir  costos  globales  más  precisos  y,  apoyado  por  los  nuevos  recursos  informáticos,  establece  un  modelo  de  actividades  que  le  permite correlacionar más fuertemente los esfuerzos realizados para producir y vender con cada uno de  los productos, formas de distribución, mercados o cualquier otro elemento que  sea  útil  a  los  efectos  de  tomar  decisiones  estratégicas  u  operativas  relacionadas  con  el  mix  de  producción,  las  formas  de  distribución o la mejora de la eficiencia.  3.   ¿Para qué el cálculo de costos?  3.1.   Objetivos de los sistemas de costos  Los sistemas de costos han adoptado diferentes enfoques, según los requerimientos y recursos disponibles  a lo largo del tiempo. Pero ciertos objetivos se mantienen en esa evolución:  .   analizar la eficiencia,  .   proporcionar información para fijar precios,  .   valorizar los stocks y contribuir a la determinación del resultado del ejercicio,  .   brindar información para decisiones estratégicas.  3.2.   Sistemas de costos rutinizables y análisis de costos  La identificación de los recursos consumidos en cada producción resulta, en general, un proceso complejo  en el que a menudo es necesario introducir simplificaciones. Adicionalmente la información para el costeo  no  se  obtiene  íntegramente  de  la  contabilidad,  dado  que  no  todas  las  variables  están  asociadas  a  transacciones  financieras.  Por  tales  motivos  estructurar  un  sistema  de  costos  involucra  una  erogación \nPágina 3  considerable y es necesario evaluar el alcance del sistema, en función del uso que se dará a la información  que proporciona.  Existen dos modalidades de trabajo para cumplir los objetivos antes mencionados: los sistemas de costos  rutinizables y el análisis de costos.  Los  primeros  son  sistemas  de  ejecución  habitual,  donde  cada  situación  recibe  siempre  el  mismo  tratamiento. La obtención de información se realiza siguiendo mecanismos previamente definidos que no  requieren análisis de situaciones especiales. Para ello todas las situaciones factibles, dentro del alcance del  sistema, se encuentran previstas y su tratamiento ha sido definido. El mantenimiento de sistemas de costos  recogiendo datos sobre una base rutinaria no siempre justifica la relación costo de la información respecto  a la utilidad de la misma cuando esta es usada esporádicamente. Por otra parte es muy difícil concebir a  priori  todas  las  necesidades  que  pueden  surgir  a  lo  largo  del  tiempo  y  desarrollar  un  sistema  que  las  contemple.  Por esa razón puede no resultar económico emplear sistemas rutinizables para situaciones poco frecuentes,  o como fuente de información para decisiones no rutinarias. En tales casos es más apropiado recurrir a  Análisis de costos. Estos suponen la participación de Analistas de Costos, que naturalmente emplearán la  información  obtenida  rutinariamente,  aplicarán  herramientas  informáticas  como  apoyo  a  su  acción,  y  complementarán  los  mecanismos  automáticos  de  obtención  y  procesamiento  de  información  con  un  profundo  conocimiento  de  la  realidad  y  la  experiencia  para  determinar  las  fuentes  de  información  más  apropiadas al caso específico.  II   EL COSTEO BASADO EN ACTIVIDADES  1.   ¿Qué es el costeo basado en actividades?  El    costeo  basado  en  actividades   es  un  nuevo  enfoque  de  los  costos  de  la  empresa,  que  toma  la  información  financiera  y  operacional  existente  y  la  visualiza  a  través  de  un   modelo  de  actividades ,  permitiendo así analizar múltiples visiones del negocio, según las decisiones que la empresa debe tomar.  Puede adoptar la forma de un sistema rutinizable, si la relación costo beneficio lo justifica, o la forma de  un análisis de costos si esto no es así. La forma de análisis de costos se emplea fundamentalmente para  sustentar decisiones estratégicas y puede motivar y facilitar, en algunos casos la introducción de sistemas  rutinizables.  2.   ¿Cómo trabaja el ABC?  El ABC parte de la información contable y la agrupa en  elementos de costo . Estos gastos son asignados a  las actividades de la empresa, y estas a su vez a la visión más adecuada para los temas claves del negocio  que importan a la toma de decisiones.  2.1.   De la información contable a los Elementos de Costo  El Costeo basado en actividades agrupa los rubros contables de gastos en  elementos  de  costo ,  de  modo  que cada elemento de costo refleja el uso de un recurso determinado. \nPágina 4  Para realizar esta agrupación será necesario analizar la información contable, y en algunos casos realizar  ajustes extracontables que permitan adaptar los criterios financieros a los requerimientos de la información  gerencial, aspecto que se analiza en el capítulo IV.  A  vía  de  ejemplo,  veamos  esta  asociación  en  elementos  de  costos  para  un  número  reducido  de  rubros  contables.  Cuenta   Nombre   $   Elemento de Costo  4101   Sueldos   80.500   Mano de obra   195.500  4102   Jornales   65.000  4103   Car g as Sociales   35.000  4104   Gratificaciones   15.000  4111   Servicios de Terceros   32.000   Scios Contratados   44.500  4112   Honorarios   12.500  4121   Amort. Inmuebles   9.500   Edificios   19.800  4131   Gtos. Conservación   10.300  4141   Mats.  p . E q ui p os   25.300   E q ui p os   43.500  4122   Amort. E q ui p os   12.600  4142   Combustibles   5.600  Total   303.300   303.300  2.2.   El Costeo de las actividades  Para determinar los costos por actividad se deben cumplir los siguientes pasos:  • identificar las actividades realizadas;  • ajustar  la  información  contable  para  obtener  el  valor  de  los  recursos  consumidos  (elementos de costo);  • asignar los elementos de costo a las actividades mediante el empleo de trazadores.  Actividad  es lo que se realiza con habitualidad y tiene un objetivo en sí mismo.  La definición de las actividades a considerar es uno de los aspectos claves del proceso de costeo ABC,  especialmente cuando la empresa lo realiza por primera vez. Su nivel de detalle debe ajustarse para lograr  un número de actividades, que permita a la vez:  .   su visualización de conjunto y la identificación de las medidas en que consumen recursos,  .   criterios comunes a lo largo de toda la organización,  .   obtener información cualitativamente útil para conocer y comprender el comportamiento  de  los  costos  de  la  empresa,  sus  orígenes  y  destino,  con  un  nivel  de  apertura  que  se  adapte al requerido para las decisiones que habrá de fundamentar. \nPágina 5  Si  el  número  de  actividades  fuera  excesivo,  el  nivel  de  detalle  impediría  la  visualización  de  conjunto  necesaria  para  comprender  el  comportamiento  de  los  costos  y  adoptar  decisiones  estratégicas.  Adicionalmente dificultaría la visualización independiente de algunas de tales actividades haciendo dudosa  la identificación de las medidas en que consumen recursos.  Por otra parte si tal nivel de detalle fuera muy bajo no proporcionaría información suficiente para poder  actuar sobre el disparador o el consumidor de costos.  Por  tal  motivo  es  fundamental  que  el  equipo  responsable  de  la  implantación,  coordine  la  definición  de  actividades a lo largo de toda la organización, unificando el nivel de apertura entre las diferentes áreas y  con los criterios previamente definidos en función del uso a dar a la información.  A fin de facilitar esta labor puede ser útil contar con listas estándar o listas empleadas previamente por  otras empresas en igual rama de actividad.  En un departamento de compras, podríamos encontrar, a vía de ejemplo, las siguientes actividades:  Desarrollar estrategias de negocio  Administrar contratos  Relacionarse con proveedores  Coordinar con otros sectores  Administrar mercaderías compradas  Participar en capacitación  Pedir cotizaciones  Supervisar empleados  Concretar compras  Identificadas  las  actividades,  y  agrupados  los  gastos  contables  en  elementos  de  costo,  estos  deben  ser  asignados a aquellas. Para ello se deben utilizar criterios que permitan medir el empleo de  los  distintos  recursos, por parte de cada actividad.  Estos criterios o  trazadores  buscan ser medidas más precisas y objetivas para la asignación de gastos, en  sustitución  de  distribuciones  globales  y  simplificadas  de  los  gastos  indirectos,  dado  que,  debido  a  la  incidencia creciente de tales gastos en el total de costos de las organizaciones, una distribución inadecuada  de los mismos puede originar fuertes distorsiones en el costo de los productos.  Veamos algunos trazadores posibles por Elemento de Costo:  _   Mano de obra   horas  hombre  en  cada  actividad  ponderadas  por  su  remuneración  (las  horas  de  una  categoría  superior  se  multiplican  por  un  factor  de  corrección  que  permite  sumarlas con las de la categoría inferior);  _   Edificios   espacio físico de las distintas áreas por las horas hombre cumplidas en cada área;  _   Equipos  horas máquina;  _   Comunicación   Número de llamadas por actividad;  _   Gtos. Adm.   se descompone en sus gastos principales, y se traza cada uno por la medida de su  consumo. Por ejemplo Papelería y útiles se puede trazar por una conjunción de  computadores y horas hombre en cada actividad, en tanto los gastos de movilidad  por el número de viajes por actividad. \nPágina 6  2.3.   Análisis del costo por actividades  Trazando cada Elemento a las actividades, obtenemos el costo de estas. Así la información que el sistema  tradicional  descompone  en  costos  directos  y  gastos  generales,  puede  ser  analizada  con  una  visión  diferente: qué actividades son las que generan mis mayores costos.  Los  sistemas  tradicionales  ubican  los  costos  por  centro  de  responsabilidad,  apuntando  a  un  control  operativo: cada responsable de área debe responder por el exceso de sus costos en relación al presupuesto.  Sin embargo, esta visión brinda información muy limitada para su reducción.  El costeo basado en actividades, en  cambio  ubica  los  costos  por  actividades  identificando  así  en  qué se  gasta. Esta información es la base para los análisis que permitirán a la empresa identificar oportunidades  concretas  de  reducción  de  costos:  actividades  de  alto  costo  que  no  son  necesarias,  o  no  poseen  valor  agregado, o son racionalizables. \nPágina 7  Esto  implica  un  cambio  de  énfasis  que  no  anula  la  visión  anterior,  sino  que  la  enriquece  con  nueva  información.  Si  la  empresa  cuenta  con  información  por  centros  de  costos,  el  trazado  de  gastos  puede  realizarse por áreas de actividad (concepto similar al de centro de costo), manteniendo así información de  gastos  por  responsables.  Esto  permitirá  conocer  el  costo  de  las  distintas  actividades  a  lo  largo  de  la  organización  y  en  particular  en  cada  área  de  responsabilidad.  Si  la  empresa  no  ha  empleado  antes  esa  agrupación  el  trazado  puede  realizarse  sin  la  agrupación  en  áreas,  requerirá  naturalmente  un  mayor  esfuerzo de coordinación.  Esta  información  permite  focalizar  los  esfuerzos  de  racionalización  y  reducción  de  costos  en  aquellos  puntos donde la empresa posee oportunidades reales.  Para  identificar  tales  oportunidades,  es  importante  enriquecer  el  análisis  calificando  a  las  actividades  mediante atributos de interés para las decisiones que la empresa debe tomar. La selección de los atributos  a ser empleados deberá, por lo tanto, ajustarse a las cuestiones de interés para el análisis. Diversidad de  cuestiones  pueden  ser  examinadas  mediante  el  empleo  de  atributos.  Algunos  de  los  más  comúnmente  usados son: valor agregado para el cliente, necesidad de la actividad, posible subcontratación de la misma,  contribución a la calidad.  El análisis que plantea el cuadro que sigue a continuación,  es una primera aproximación al análisis que  podría realizarse al emplear el atributo de valor agregado, discriminando la información incluso a nivel de  las  actividades  individuales.  Esto  permitirá  concentrar  la  búsqueda  de  oportunidades,  por  ejemplo,  en  torno a las actividades que no son percibidas por el cliente o por las que él no está dispuesto a pagar. \nPágina 8  Naturalmente esta información, por sí sola, no es suficiente para sustentar decisiones de racionalización y  reducción de costos. Para ello es necesario emplear los atributos en forma combinada  para  responder  a  interrogantes tales como:  • cuáles son las actividades más costosas y que no agregan valor,  • cuáles las menos costosas y que agregan valor,  • de las primeras, cuáles pueden ser subcontratadas y aún no lo están,  • de estas qué porción de su costo sería subcontratada.  2.4.   Análisis de costos desde diferentes visiones  Costeadas  las  actividades,  estas  pueden  trazarse  a  productos/servicios,  canales  de  distribución,  clientes,  procesos, o áreas funcionales. En cada caso deberá seleccionarse la visión o visiones más relevantes para  los temas claves del negocio que se desea analizar. Veamos algunos análisis posibles para las visiones de  productos, clientes y canales de distribución.  a.   Productos / servicios  El  ABC  costea  los  productos  contemplando  su  ciclo  integral  en  la  organización  -  investigación  y  desarrollo, compra de mercaderías, producción, stockamiento, venta, cobranza -. Incluye así gastos que  los sistemas tradicionales no acumulaban al costo del producto, tales como los de administración y ventas,  en general por atender primordialmente el objetivo de valuación de inventarios.  El  costo  de  las  líneas  de  productos  o  servicios  se  determina  asignándole  cada  una  de  las  actividades,  previamente costeadas, en función del uso que de ellas realiza cada línea de productos/servicios. A vía de  ejemplo algunos trazadores que se podría emplear, según los tipos de actividades, son:  Producción   No. de lotes, No. unidades,  Facturación   renglones de facturación,  Venta   tiempo de venta por producto, por las ventas realizadas,  Compra  renglones  de  orden  de  compra - para  las  materias  primas  comunes  a  varios  productos se pondera por su uso -,  Cobranza   importe de ventas.  El costo de la materia prima se asigna en forma directa al costo de los productos, de acuerdo al consumo  real,  o  al  estándar  si  no  hay  grandes  diferencias.  En  tanto  el  costo  de  las  actividades  que  no  son  relacionables con los productos, como la preparación de información contable, no es trazado.  Esta visión permite analizar  la  rentabilidad  por  línea  de  producto  y  por  lo  tanto  sustentar  decisiones  de  racionalización  de  las  líneas  de  productos/servicios,  brindar  elementos  a  considerar  en  el  ajuste  de  precios, identificar el esfuerzo especial requerido por determinadas líneas. \nPágina 9  Los  resultados  de  esta  visión  seguramente  sorprenderán  en  comparación  con  los  de  sistemas  simplificadores, pero pueden incluso diferir sustancialmente de otros más afinados, básicamente debido a  dos motivos:  a.   los  sistemas  generalmente  aplicados  no  incluyen  los  gastos  de  administración  y  ventas  en  el  cálculo  de  rentabilidad  por  línea  de  producto/servicio;  en  cambio  el  ABC  costea  los  productos  contemplando su ciclo integral en la organización;  b.   la  asignación  de  costos  sigue,  en  muchos  sistemas,  criterios  altamente  simplificadores  que  no  contemplan los costos de complejidad, en tanto el ABC busca identificar medidas más adecuadas  del consumo de recursos.  En  consecuencia  la  porción  de  costos  no  asignada,  o  asignada  en  forma  global,  es  en  el  ABC  sustancialmente menor que en la generalidad de los sistemas tradicionales.  Ambos costos podrían llegar a ser similares, solo en casos en los que se cuente con un sistema afinado de  costos y los elementos no considerados por este sean poco significativos.  b.   Canales de distribución  De igual forma que se realiza el trazado de costos de actividades a productos se puede realizar a canales  de distribución. Este análisis puede responder preguntas tales como:  •   cómo realizar las ventas: ¿directamente a minoristas o a través de distribuidores?,  •   por qué un medio de transporte es más económico que otro para un producto determinado,  •   qué impacto tiene un aumento de los costos de transporte en la rentabilidad,  •   cuál es el verdadero costo de una política de entrega las 24 hs. \nPágina 10  Este análisis puede ser de utilidad en toda empresa con importante actividad de distribución, ya sea propia  o  subcontratada,  y  sin  duda  adquiere  especial  relevancia  en  empresas  cuyo  giro  sustancial  es  la  comercialización.  c.   Clientes / mercados  Esta visión permite identificar los costos de los diferentes tipos de clientes o mercados a fin de analizar  aspectos  tales  como  el  impacto  que  los  pedidos  especiales  de  clientes  tienen  en  los  costos,  el  direccionamiento  hacia  pequeños  o  grandes  clientes.  Para  ello  se  emplean  herramientas  como  la  identificación  de  disparadores  de  costos,  la  modelización  de  la  estrategia  de  fijación  de  precios,  y  el  análisis de rentabilidad por cliente.  III   APORTES DEL COSTEO BASADO EN ACTIVIDADES  1.   La Administración Estratégica de Costos  El aporte esencial del costeo basado en actividades es el uso que se puede realizar de la información que  proporciona. Por eso no se trata solo de obtener más información, sino de emplear esta información en  forma  cualitativamente  distinta;  visualizando  a  la  empresa  desde  otra  óptica,  un   modelo  de  actividades ,  que se incorpora a la  gestión  de  la  empresa.  Los  resultados  del  costeo  basado  en  actividades  adquieren  gran  importancia  cuando  son  empleados  para  una   Administración  Estratégica  de  Costos   (Strategic  Cost  Management - SCM -).  El  SCM  permite  desarrollar  cuatro  aptitudes  esenciales  para  la  continua  identificación  y  resolución  de  problemas que afectan la performance de la empresa.  ¿   Mejor comprensión de los costos y del comportamiento de los mismos, a través de:       • la disponibilidad de múltiples visiones de los costos de la empresa: líneas de productos/servicios,  canales de distribución, clientes, procesos, áreas funcionales;       • una  visión  más  amplia  de  los  costos:  que  abarca  todo  el  ciclo  de  vida  del  producto,  desde  la  investigación  y  desarrollo  de  nuevos  productos,  pasando  por  la  compra  y  almacenamiento  de  materias primas, hasta la cobranza de los créditos originados por la venta.  ¿   Habilidad para la toma de decisiones       • al mejorar el conocimiento de la empresa, permite focalizar los esfuerzos de mejora en  torno  a  aspectos esenciales del negocio;       • la visión de procesos, en sustitución del esquema de divisiones departamentales, facilita la visión  interdisciplinaria de los problemas y el consenso en torno a la solución;       • la información por actividades permite el empleo de herramientas de análisis para la evaluación  cuantitativa de las alternativas existentes;       • el  modelo  de  actividades  permite  medir  los  resultados  logrados  por  una  decisión  específica,  facilitando así la adopción de medidas correctivas, cuando estas son necesarias. \nPágina 11  ¿   Administración de los procesos       • muchas  empresas  reconociendo  la  necesidad  de  un  mejoramiento  continuo,  han  introducido  programas de Calidad Total (Total Quality Management - TQM -). SCM potencia estos esfuerzos  en  TQM  al  aportar  una  visión  fuertemente  orientada  hacia  los  resultados  y  una  dimensión  de  costos, de las que muchos esfuerzos de TQM carecen;       • facilita  la  definición  de  procesos  críticos  y  la  identificación  de  factores  claves  de  desempeño,  permitiendo administrarlo y mejorarlo continuamente.  ¿   Administración de la performance       • mejorar la performance hoy implica desarrollarse en factores que sean valorados no solo por los  clientes sino también por  empleados,  accionistas  y  otros  grupos  de  interés,  desarrollar  un  valor  agregado superior;       • la visión de las actividades, se enriquece con la asignación de atributos (necesario, agrega valor,  subcontratable,  contribuye  a  la  calidad)  que  permiten  determinar  los  factores  críticos  para  la  creación de valor, focalizar los esfuerzos de mejoramiento en las oportunidades más relevantes,  definir  medidas  que  retroalimenten  a  los  distintos  niveles  sobre  su  aporte  al  mejoramiento  del  desempeño en los factores claves;       • finalmente este enfoque permite un seguimiento claro de los avances logrados y por ende el ajuste  de estrategias y la redefinición de factores y medidas para tal mejoramiento.  2.   Información para la Administración Estratégica  2.1.   Areas especialmente fortalecidas  Las  habilidades  expuestas  en  el  numeral  anterior,  contribuyen  conjuntamente  a  una  adecuada  gestión  estratégica de la empresa. Entre las áreas de decisión estratégica que se ven así especialmente fortalecidas  podemos mencionar, a vía de ejemplo:      • mercadeo,  especialmente  en  relación  a  los  elementos  producto,  precio,  canales  de  distribución y clientes;  • producción: comprar o hacer;  • racionalización de la infraestructura organizacional: reestructura y reingeniería.  2.2.   Definición de la estrategia de comercialización  a.   Producto  La  visión  por  productos,  que  proporciona  un  conocimiento  más  profundo  del  costo  de  los  mismos  y  permite  comprender  el  comportamiento  de  tales  costos,  es  un  elemento  esencial  en  la  definición  de  la  mezcla de productos.  Que un producto no sea rentable no implica dejar de hacerlo, pero conocer adecuadamente esa realidad  permitirá  focalizar  la  atención  hacia  los  productos  problemáticos  para  evaluar  su  discontinuación,  su  rediseño hacia formas más estandarizadas, o la modificación de sus precios. \nPágina 12  Tanto  en  la  evaluación  de  nuevos  productos  como  en  el  rediseño  de  los  existentes,  el  costeo  por  actividades  aporta  información  vital.  Conociendo  el  costo  de  las  actividades  y  el  insumo  que  de  estas  deberá realizarse para el nuevo producto, o el producto modificado, se puede estimar en forma razonable  los costos de estos, sustentando así las decisiones en hechos cuantificados.  Finalmente una correcta determinación de los márgenes de utilidad es esencial para el análisis del ciclo de  vida  de  los  productos,  la  toma  de  decisiones  de  hacer/comprar,  y  la  definición  del  mix  comercial  que  permita canalizar los recursos de la empresa hacia aquellas actividades y productos que pueden reportarle  la mejor conjunción de utilidad y ventajas competitivas.  b.   Canales de distribución y clientes  Las visiones de canal de distribución y de clientes, proporcionan información de costos diferenciados por  vía  de  distribución  y  por  clientes  de  destino,  respectivamente,  permitiendo  evaluar  estos  elementos  en  forma cuantificada.  c.   Precio  El conocimiento de costos por producto, canales y clientes, permite calcular la rentabilidad en las distintas  alternativas, proporcionando información útil a considerar en la fijación de precios.  A  vía  de  ejemplo  un  producto  estrella,  con  precios  elevados  puede  atraer  fácilmente  competidores,  causando  la  pérdida  de  una  porción  del  nicho  de  mercado  disponible.  En  ese  caso  el  conocimiento  del  costo  real  permitirá  disminuir  el  precio,  desmotivando  a  los  competidores  pero  manteniendo  una  rentabilidad adecuada.  En el otro extremo, para un producto no rentable, el conocimiento de su costo, y por consiguiente de su  rentabilidad,  permitirá  identificar  un  punto  de  alerta.  Subir  su  precio  puede  ser  algo  que  los  clientes  esperan, o que no aceptarán. En el primer caso mejorará su rentabilidad; en el segundo, en tanto su venta  no condicione la de otros productos rentables, la empresa producirá menos unidades no rentables.  2.3.   Comprar o hacer  Si una empresa desea lograr ventajas competitivas estables, a través de la diferenciación de sus productos  en aquellos factores que el cliente valora, debe ser capaz de concentrar sus esfuerzos adecuadamente.  Para ello será clave conocer las preferencias de los clientes, y cómo cada producto, final o intermedio,  contribuye a lograr tales factores de preferencia.  Si una familia de productos no es, en tal sentido, estratégica deberá evitarse inversiones adicionales en la  misma, pero si estas no fueran necesarias la decisión de hacer o comprar dependerá de los costos propios  y  externos.  En  este  punto  es  donde  el  costeo  por  actividades,  y  las  medidas  de  desempeño  que  de  este  surgen, suministran información clave para la toma de decisiones. \nPágina 13  2.4.   Racionalización de infraestructuras organizacionales  La determinación del costo de los productos por actividades y por elementos de costo permite identificar  los  orígenes  de  los  mismos  y  visualizar  así  las  oportunidades  de  racionalizar  la  infraestructura  de  la  organización.  Ya  sea  que  la  empresa  opte  por  cambiar  su  combinación  comercial  actual  o  por  continuar  con  ella,  buscará  reducir  el  consumo  de  recursos  en  aquellos  puntos  en  que  el  mismo  es  excesivo.  Pero  estas  medidas por sí solas no reducen los costos organizacionales, simplemente generan recursos ociosos. Para  racionalizar  los  costos  es  necesario  redireccionar  tales  recursos  hacia  otra  actividad  o  producto  en  que  puedan generar la rentabilidad adecuada, o prescindir de ellos si lo anterior no es posible.  Así  el  costeo  por  actividades  identifica  los  puntos  donde  la  reingeniería  y  la  reestructura  pueden  racionalizar el empleo de los recursos organizacionales mejorando la rentabilidad.  3.   El análisis estratégico en los mercados actuales  Actualmente  asistimos  a  un  proceso  de  expansión  y  globalización  de  los  mercados,  que  amplía  las  oportunidades de las empresas, pero también la competitividad que deben enfrentar. En este entorno de  negocios  más  complejo  que  nunca,  la  empresa  necesita  mejorar  constantemente  su  performance  y  anticiparse a los cambios del mercado. Por ello la Administración Estratégica adquiere una  importancia  medular  en  la  supervivencia  y  fortalecimiento  de  las  empresas,  y  es  esencial  disponer  de  información  adecuada  para  que  el  posicionamiento  de  la  empresa  y  cualquier  iniciativa  de  mejora  o  cambio  que  emprenda se focalice hacia resultados mensurables.  IV   UN CAMINO PARA MAXIMIZAR LA RELACION COSTO - BENEFICIO EN EL USO  DEL ABC  1.   Costo de la información  Esta visión de costos, a través de un modelo de actividades, proporciona información más apropiada para  la  toma  de  decisiones  que  los  sistemas  que  recurren  a  distribuciones  de  gastos  altamente  simplificadas.  Pero,  para  ello,  emplea  un  número  de  variables  mucho  mayor  que  aquellos:  las  actividades  y  los  trazadores,  (que  pueden  variar  para  cada  recurso,  actividad  y  producto,  cliente,  o  visión  que  se  decida  adoptar) son, en la mayoría de los casos, sensiblemente más numerosas que los  centros  de  costos  y  las  bases de distribución empleadas habitualmente.  La precisión proporciona el beneficio que resulta de una más informada toma de decisiones, pero no se  logra  sin  aumentos  en  la  aplicación  de  recursos  humanos  y  tecnología,  lo  que  obviamente  motiva  aplicación de recursos financieros adicionales.  El  avance  en  materia  de  informática  y    comunicaciones  ha    reducido  este  incremento  de  costos  en  la  captura y procesamiento de información. No obstante ello es necesario analizar en cada caso  el  camino  que se va a seguir para obtener la información, a efectos de maximizar el beneficio de su uso con el costo  más  razonable.  Cambiar  el  sistema  de    costos  de  una  empresa  implica  costos,  que  pueden  llegar  a  ser  cuantiosos, dependiendo de la dimensión de la empresa y de la metodología de cambio. \nPágina 14  2.   La decisión de cambiar el cálculo de costos  En función de lo expuesto anteriormente es necesario estudiar detenidamente  si  es  necesario  cambiar  el  sistema de costos y establecer una metodología que permita obtener resultados rápidos, confiables y que  permitan desarrollar sistemas con aplicación de recursos menores y con un rápido retorno de la inversión.  A efectos de tomar la decisión de cambiar el sistema de costos, Robin Cooper en el artículo \"You need a  new cost system when...\", publicado en Harvard Business Review de enero-febrero de 1989 establece una  serie de cuestiones a analizar entre las que destacamos:  _   los  gerentes  funcionales  quieren  discontinuar  líneas  que  el  sistema  de  costos  determina  como rentables;  _   los márgenes de ganancia no son fáciles de explicar;  _   productos difíciles muestran grandes utilidades;  _   los departamentos han desarrollado sus propios sistemas de costos;  _   la empresa posee un nicho de gran margen de utilidad, según sus costos, que no interesa a  la competencia;  _   los precios de la competencia son extremadamente bajos;  _   los clientes no se sorprenden ante un aumento de precios;  _   los costos informados cambian debido a nuevas normas contables.  El sistema también puede ser obsoleto si la empresa ha experimentado:  _   una automatización creciente o simplificaciones en el proceso de producción;  _   cambios en el uso de las funciones de apoyo;  _   cambios en la estrategia de mercadeo o en los objetivos organizacionales;  _   intensificación de la competencia;  _   desregulación de los mercados.  Además  de  estos  aspectos  entendemos  que  la  empresa  debe  analizar,  en  el  contexto  de  cambios  en  la  economía  que  surgen  de  la  inserción  en  mercados  regionales  o  globalización  de  los  mercados,  con  prioridad  la  necesidad  de  utilizar  información  para  toma  de  decisiones  estratégicas  relacionadas  con  estudios  de  la  línea  de  productos,  la  forma  de  producir  o  adquirir,  la  necesidad  de  reingeniería  de  procesos para aumentar eficiencia, formas de distribución y acceso a los mercados, etc.  Si  estas  necesidades  son  reales,  si  la  información  va  a  ser  utilizada  para  la  toma  de  decisiones  y  si  aparecen  situaciones  como  las  planteadas  más  arriba  en  relación  al  cambio  de  sistemas,  será  necesario  asignarle una alta prioridad al estudio de costos y seguramente será recomendable el uso de un modelo de  actividades en dicho estudio.  El  cambiar  el  sistema  de  costos  rutinizado  puede  llegar  a  insumir  un  largo  período  de  desarrollo  e  implantación que a veces supera los dos años. Los costos de tal cambio, sin obtener resultados rápidos,  imprescindibles por la velocidad con que se mueve el mercado y ante la incertidumbre del éxito que en  todo cambio de sistemas suele estar implícito, son difíciles de justificar.  Por tal razón creemos que lo más razonable es realizar un estudio de costos sobre la base de un modelo de  actividades,  utilizando  la  información  existente  dentro  de  la  empresa  (contable  y  extracontable)  y  adaptándola  a  las  nuevas  necesidades.  Ese  estudio  debe  estar  orientado  a  la  toma  de  decisiones \nPágina 15  estratégicas. Por ello debe ser de corta duración y tener una alta participación de los niveles gerenciales y  directivos de la empresa.  3.   El estudio de costos a efectos estratégicos  Varios  factores  deben  considerarse  especialmente  al  momento  de  evaluar  la  realización,  planificar  y  realizar este estudio estratégico de costos sobre una base ABC:  .   la calidad y adecuación de la información contable existente;  .   la disponibilidad de experiencia suficiente en la aplicación de la metodología;  .   lograr el compromiso de los niveles gerenciales y directivos;  .   formar un equipo de trabajo que posibilite la capacitación del personal en la metodología.  a.   Adecuación de la información contable  Las  normas  legales  y  profesionales  que  debe  cumplir  la  información  contable  están  dirigidas  a  proporcionar  información  razonable  para  los  terceros  interesados.  Adicionalmente,  muchas  veces  se  incorpora a la contabilidad criterios fiscales, para reducir los ajustes extracontables en la liquidación de  impuestos  y  que  incluyen  simplificaciones  razonables  a  los  efectos  de  la  determinación  del  resultado  a  fines  impositivos.  No  obstante,  este  tipo  de  contabilidad  en  muchos  casos  no  proporciona  información  suficiente  para  decisiones  estratégicas  u  operativas  tendientes  a  mejorar  la  eficacia  y  eficiencia  de  la  empresa.  Sin  embargo  la  información  con  que  cuenta  habitualmente  la  empresa  es  la  información  contable.  Ella  surge  de  sistemas  que  aseguran  su  integridad  y  validez.  Por  ello  de  allí  se  debe  partir  si  se  pretende  procesar información financiera, proporcionando resultados que resulten confiables.  Es necesario, entonces, tener presente los criterios en base a los que fue elaborada  la  contabilidad  para  sustituirlos,  extracontablemente,  por  criterios  que  permitan  contemplar  los  requerimientos  de  la  administración estratégica. En la primer oportunidad que se hace un análisis, tales ajustes extracontables  pueden insumir un esfuerzo importante. El grado del mismo dependerá de factores como:    .   la precisión de la información contable;    .   la apertura de los rubros de gastos. Si estos presentan un nivel de desagregación muy bajo puede  requerirse la apertura de algunos de ellos;    .   si los gastos se encuentran agrupados en centros de costo, inciden también:  -   la adaptación de tales centros al análisis por actividades;  -   la  razonable  distribución  de  gastos  generales,  tales  como  energía  eléctrica,  agua,  comunicaciones, amortizaciones, entre los centros de costos;  -   la  existencia  de  criterios  uniformes  de  asignación  de  gastos  de  mantenimiento,  capacitación, etc. a cada centro;  -   la ubicación del gasto en los centros en que tales recursos son consumidos en actividades.  Los datos contables que se usen deben adaptarse, agruparse y distribuirse de acuerdo a la metodología,  pero  a  efectos  de  asegurar  la  calidad  de  los  resultados  deben  conciliar  por  totales  con  los  egresos \nPágina 16  existentes en la contabilidad tradicional. Para ello es conveniente usar software apropiado que contribuya  a lograr este resultado con mayor facilidad.  b.  Experiencia suficiente en el uso de la metodología  Como  en  toda  aplicación  de  técnicas  el  solo  estudio  teórico  de  las  mismas  no  suele  ser  suficiente  para  asegurar el éxito de su implantación. La más alta probabilidad de éxito se produce cuando al conocimiento  teórico se agrega la experiencia en la aplicación.  En este caso la experiencia es imprescindible en tres aspectos fundamentales de la metodología:  .   la definición de los elementos de costos, actividades y trazadores;  .   la  conducción  del  proceso  con  participación  de  los  distintos  niveles  gerenciales  y  operativos;  .   el análisis de la información.  En  el  primer  caso  definiciones  inadecuadas  pueden  llevar  a  cálculos  totalmente  inmanejables,  a  información  desagregada  en  exceso,  a  pérdida  de  significatividad  de  la  información  y  a  tiempos  de  estudios inconvenientes para la toma de decisiones urgentes que normalmente se requieren.  En  el  segundo  caso  la  conducción  inadecuada  del  proceso  puede  llevar  a  no  lograr  la  participación  de  aquellos que conocen la empresa y cuyas percepciones pueden ayudar a producir resultados mucho más  acordes a la realidad.  La  realización  del  análisis  implica  el  uso  de  información  interna  y  externa  que  suele  estar  disponible  a  nivel de los niveles gerenciales. El no disponer de esa capacidad de análisis que está relacionada con el  conocimiento de las características del modelo de actividades, de la realidad de la empresa y del entorno  en  que  esta  se  mueve  puede  llevar  a  lograr  un  estudio  exclusivamente  para  una  biblioteca,  sin  ninguna  aplicación posterior.  c.   La participación de los niveles gerenciales  Lograr  el  compromiso  de  los  involucrados  es  un  factor  clave  para  el  éxito  de  cualquier  cambio.  En  el  costeo  por  actividades  adquiere  fundamental  relevancia  el  compromiso  de  los  niveles  gerenciales,  especialmente  si  el  objetivo  perseguido  es  la  Administración  Estratégica  de  Costos.  Dichos  niveles,  además  de  consustanciar  al  resto  de  la  empresa  con  estos  objetivos,  deberán  modificar  su  sistema  de  conducción, sustentando las decisiones estratégicas en esta nueva visión de la empresa y en la información  que provee la metodología de análisis por actividades.  Por  otro  lado,  todo  cambio  sustancial  en  una  organización  debe  ser  acompañado  de  un  cambio  cultural  equivalente, dado que los valores básicos de una organización, sus creencias y comportamientos pueden  contribuir u obstaculizar al desempeño. En especial el costeo por actividades provee nueva información y  permite  emplear  herramientas  de  análisis  valiosas,  pero  unas  y  otras  no  son  suficientes  para  obtener  resultados. Es necesario que estos elementos se integren al proceso de administración de la empresa. \nPágina 17  d.   Formación  de  un  equipo  de  trabajo  que  facilite  la  capacitación  del  personal  en  la  metodología  En  general  este  tipo  de  cambios  se  introduce  en  las  organizaciones  mediante  el  apoyo  de  profesionales  externos  pero,  en  la  medida  en  que  el  costeo  basado  en  actividades  debe  incorporarse  al  proceso  de  administración, un factor clave en la implementación es la transferencia de la metodología. Para lograrla  adquieren  especial  relevancia:  la  capacitación  a  los  involucrados  y  la  participación  de  un  equipo  de  personal de la empresa en todas las instancias de la ejecución inicial. Esta participación activa facilita la  comprensión del proceso, y del potencial del ABC, propicia el cambio cultural y la identificación con la  metodología  introducida.  Facilita  además  la  realización  de  estudios  subsiguientes  o  el  diseño  e  implantación de un sistema rutinizado de costos sobre la base de actividades.  4.   El diseño e implantación de sistemas rutinizados de costos basados en modelos de actividades  En  nuestra  opinión  la  oportunidad  más  adecuada  de  decidir  el  diseño  e  implantación  de  un  sistema  rutinizado de costos basado en un modelo de actividades es luego de realizar un estudio de costos como el  definido en el numeral 3 anterior.  Al terminar dicho estudio se habrá definido las actividades que deben costearse, los elementos de costos a  utilizar y los trazadores hacia los productos u otras visiones alternativas.  Para  decidir  el  diseño  e  implantación  del  sistema  será  necesario  analizar  el  costo  de  obtener  la  información sobre una base continua y determinar si es razonable en relación a las ventajas del uso del  sistema. En la recolección de información se deberá contemplar el uso de tecnología de punta que permita  capturar los datos en la forma  más automática  posible  (relojes  computarizados  conectados  a  servidores,  lectores ópticos, sensores, etc.).  El  sistema  de  costos  rutinizado  deberá  además  contemplar  las  necesidades  de  la  información  financiera  logrando la valuación de los productos al nivel de producción de forma de contemplar las exigencias de  normas contables vigentes y eventualmente de las normas fiscales aplicables.  El estudio de costos realizado anteriormente habrá permitido formarse opinión sobre las adaptaciones que  será necesario realizar al sistema vigente o a la contabilidad financiera para diseñar el nuevo sistema.  Dada las características de un sistema de costos basados en actividades y la incidencia que los cambios en  las formas de producción, la tecnología y las formas de distribución y administración pueden tener sobre  el  mismo  es  altamente  recomendable  el  diseño  de  un  sistema  computacional  sumamente  flexible  que  permita afrontar las necesidades del futuro.  Las  necesidades  de  diseñar  sistemas  seguros  y  confiables,  de  mantener  los  sistemas  actuales  durante  la  implantación  de  los  nuevos  y  el  acostumbramiento  a  nuevas  formas  de  recolección  de  datos  ubican  el  proceso de desarrollo e implantación en lapsos en general superiores al año, alcanzando en ocasiones a los  dos o tres años.  El  mantenimiento  actualizado  del  sistema  obligará  a  realizar  periódicamente  relevamientos  y  encuestas  para incorporar o eliminar actividades y cambiar los trazadores utilizados. \nPágina 18  En  la  medida  que  el  sistema  rutinizado  servirá  para  proporcionar  información  no  solo  a  los  fines  estratégicos  sino  también  a  los  operativos  será  necesario  dar  más  énfasis  a  aspectos  que  la  información  estratégica puede considerar más globalmente. Ellos se refieren al control más afinado de la materia prima  y  materiales,  a  la  diferenciación  de  costos  fijos  y  variables  y  a  la  información  sobre  los  resultados  financieros e impuestos.  a.   Materia prima, las variaciones en su consumo  El sistema de costeo basado en actividades, determina el costo de las actividades excluyendo la materia  prima. Por su parte el costo de los productos se integra identificando la materia prima y las actividades  necesarias para elaborarlo.  Por lo tanto, en estudios del tipo del explicado en el numeral 3 es necesario obtener los montos de materia  prima consumida por cada línea de productos en forma externa al proceso ABC. Para ello se utilizan, en  general, las fórmulas de producción costeadas. En caso de no estar disponibles pueden sustituirse, por la  información  del  consumo  real  por  tipo  de  producto,  recogida  a  partir  de  informes  de  producción  y  del  sistema de costos rutinizado vigente.  El tratamiento que este enfoque realiza del costo de la materia prima es por naturaleza diferente  al  que  realiza  el  costeo  tradicional.  Este  sistema  se  centra  en  el  análisis  de  costos  por  actividades  y  no  en  el  control de costos unitarios.  Pero si queremos utilizar un sistema rutinizado, que sustituya el sistema de costos preexistente, habrá que  analizar  formas  de  control  de  la  materia  prima  utilizada,  que  proporcionen  información  respecto  a  las  cantidades consumidas y los desvíos en relación a las fórmulas predefinidas.  b.  Diferenciación de costos fijos y variables  En estudios a efectos estratégicos la diferenciación de gastos en fijos y variables pierde algo de relevancia  dado que, como se analiza aún la posibilidad de cambios de estructura, no existen prácticamente gastos  fijos. Son gastos fijos exclusivamente aquellos que no hemos podido variabilizar o eliminar.  Cuando estamos frente a una información a efectos operativos la diferenciación de gastos fijos en relación  a  la  estructura  existente  es  fundamental  pues  permite  analizar  en  forma  discriminada  aquellos  gastos  factibles de reducción por mejoras en los procedimientos y métodos, de aquellos en los que se incurrirá de  cualquier  forma  si  se  mantiene  la  capacidad  operativa  actual,  y  por  ende  escapan  al  ámbito  de  las  decisiones operativas.  Adicionalmente  la  información  con  fines  estratégicos,  suele  cubrir  períodos  más  extensos  que  la  información operativa. Los costos fijos derivados de una capacidad ociosa oscilante en cada mes, tienden  a netear sus efectos si consideramos un período representativo; pero en períodos más breves, tales costos  de  capacidad  ociosa  oscilante  no  deben  ser  asignados  al  producto  pues  implicaría  trasladarles  tal  oscilación: el mismo artículo elaborado de idéntica forma tendría diferente costo según el mes en que se  produzca. Por lo tanto a efectos operativos, frente a situaciones de subutilización de capacidad operativa,  tan comunes en algunos países de la región, es necesario aislar el componente fijo y variabilizarlo antes de  ser considerado para la fijación de precios y el análisis de rentabilidad. \nPágina 19  Pero aún la información para administración estratégica de costos puede requerir la apertura de gastos en  estas dos categorías, si bien no para la determinación del costo del período, sí para analizar el impacto de  decisiones de redimensionamiento y de utilización de la capacidad instalada.  c.   Resultados financieros  Dado  que  este  sistema  de  costeo,  se  sustenta  en  el  concepto  de  actividades,  hay  resultados  que  por  no  responder a tal concepto, no integran el análisis del costo. Es el caso de los  resultados financieros  o  el  impuesto al patrimonio.  Estos  resultados  no  se  originan  en  actividades  concretas,  sino  en  el  mantenimiento  de  ciertos  activos  y  pasivos.  Por  lo  tanto  no  son  asignables  a  una  actividad.  A  su  vez,  dado  que  no  son  originados  directamente por un producto, tampoco son asignables a estos, en un costeo basado en actividades.  Si la empresa posee importantes resultados basados en el mantenimiento de activos y pasivos, el análisis  de  rentabilidad  individual  de  sus  productos  no  resulta  suficiente  para  entender  la  rentabilidad  de  la  empresa.  En  tales  casos  la  información  que  se  proporciona  debe  ser  complementada  con  información  sobre dichos resultados que permitan toma de decisiones estratégicas y operativas. A tal efecto, el análisis  puede enriquecerse con un estudio de los requerimientos, que cada línea de la visión supone, en materia  de mantenimiento de activos y pasivos.  V   RESUMEN  El costeo basado en actividades (ABC) es una técnica sobre las que existen publicaciones desde comienzos  de la década del 70, aunque sus aplicaciones a nivel de los países desarrollados,  especialmente EEUU,  aparecen  a  mediados  de  los  80,  siendo en  los  países  del  Cono  Sur  conocida  y  aplicada  con  una  mayor  generalidad a partir del comienzo de esta década.  En resumen, la técnica tiene tres partes esenciales:  a)   la identificación de Elementos de Costo, agrupaciones de rubros contables que reflejan el empleo  de un recurso común;  b)   la asignación de dichos costos a Actividades, lo que se realiza con habitualidad y tiene un objetivo  en sí mismo;  c)   la  asignación  de  las  Actividades  a  distintas  acumulaciones  de  costos  que  pueden  ser  productos,  canales de distribución, clientes, procesos o áreas funcionales.  Ambas asignaciones se realizan a través de Trazadores, criterios que buscan medir el empleo de recursos  por parte de las actividades, y el de estas últimas por parte de los productos, clientes, mercados, etc.  En relación a los sistemas de costos tradicionales esta técnica da mucha mayor importancia a la asignación  más  precisa  de  costos  indirectos  de  producción,  e  incluye  en  la  asignación  los  gastos  de  ventas  y  administración,  proporcionando  así  una  mejor  información  para  tomar  decisiones  estratégicas  u  operativas. \nPágina 20  La idea motivadora del ABC es la identificación de los factores originadores de costo y su empleo para  una  determinación  más  precisa  del  mismo,  utilizando  para  ello  la  visión  de  actividades  como  eje  de  la  determinación y del análisis de costos. El modelo de actividades facilita el conocimiento de los costos de  la empresa y la comprensión de su comportamiento.  Esta  idea  ya  existía  a  mediados  de  siglo,  a  nivel  de  los  modelos  académicos:  en  la  identificación  de  la  medida  del  gasto  y  el  empleo  de  índices  para  evaluar  la  gestión  de  los  negocios.  Pero  estos  modelos  difícilmente fueron aplicados. Su complejidad y las posibilidades informáticas existentes, muy limitadas,  los  hacían  demasiado  costosos  para  el  empleo  que  se  realizaba  de  tal  información.  Por  lo  tanto,  los  sistemas en aplicación recurrieron en general a importantes simplificaciones.  Indudablemente la nueva técnica de costeo implica mayores costos de preparación de la información pues,  si  bien  los  elementos  de  costos  no  suelen  ser  en  número  mucho  mayores  que  los  conceptos  de  costos  actuales, las actividades son en general mucho mayores que los centros de costos que suelen utilizarse en  la contabilidad de costos tradicional y el criterio para distribuir los costos (trazadores) entre los productos  , canales de distribución, etc. son más variados  que los que se utilizan tradicionalmente. Sin embargo el  avance actual en las tecnologías para recoger y procesar información permiten que estos esfuerzos sean  viables.  Adicionalmente, en la actualidad, el entorno de las empresas se encuentra en un proceso de cambio con  grandes  exigencias:  la  inserción  en  mercados  regionales,  la  apertura  y  globalización  de  la  economía,  generan un mercado con grandes oportunidades, pero a la vez introducen una competitividad mucho más  fuerte. Esto hace necesario el mejoramiento de la gestión, el aumento de la eficiencia, y la diferenciación  en  el  mercado.  En  este  marco  la  mejor  información  de  costos  juega  un  papel  clave  para  lograr  una  adecuada toma de decisiones.  Por  tales  razones  creemos  que  se  justifica  plenamente  el  uso  de  esta  técnica  de  costeo  como  una  herramienta  para  la  Administración  Estratégica  de  Costos  (SCM  -  Strategic  Cost  Management).  Esto  permitirá analizar aspectos tales como:  •   la definición de la estrategia de comercialización:  .   mezcla de productos más conveniente,  .   fijación de precios,  .   formas de distribución,  .   clientes de interés;  •   en el área de producción: comprar o hacer;  •   identificación de problemas a ser solucionados mediante procesos de reingeniería o reestructura.  Analizando su implantación, surge claramente una dificultad: identificar todos los elementos del modelo,  logrando  sistematizar  sus  interrelaciones,  y  al  mismo  tiempo  obtener  resultados  rápidos  que  permitan  enfrentar la exigencia de decisiones estratégicas en un entorno que cambia rápidamente.  Por  ello,  en  nuestra  opinión  la  implantación  del  costeo  por  actividades  debe  comenzar  por  un  estudio  específico que tienda a dar resultados rápidos (plazos menores a tres meses) donde a partir de los datos  contables y extracontables existentes y el uso de software apropiado se realice un costeo por actividades  orientado a un estudio estratégico que permita, junto con otras informaciones del entorno, posicionar a la \nPágina 21  empresa  respecto  a  los  cambios  que  debe  introducir  para  adaptarse  a  las  nuevas  circunstancias  del  mercado.  Este estudio, además de proporcionar datos concretos para la toma de decisiones, generará experiencia y  definirá actividades y trazadores. Todo esto podrá usarse para intentar desarrollar un sistema rutinizable  de costos que permita obtener información periódica tanto con fines estratégicos como operativos. En el  desarrollo de este sistema deberá tenerse en cuenta la relación costo - beneficio de la información a la luz  de la complejidad del sistema y de los medios que se dispongan para obtener la información.  Tanto en estudios específicos como en el desarrollo de sistemas rutinizados, el uso de software apropiado,  la experiencia en la metodología y su transferencia al personal de la empresa, juegan un papel central en  la implantación para asegurar el logro de los resultados esperados y la continuación en su uso.  En el caso que la información sea utilizada con fines operativos será importante introducir la clasificación  de gastos en fijos y variables a efectos de poder analizar los efectos que la variación en los volúmenes de  producción pueden tener sobre los costos totales de la empresa.  Entendemos  que  un  sistema  de  este  tipo  puede  ser  compatible  con  la  utilización  del  mismo  con  fines  contables  o  fiscales,  en  la  medida  que  se  determine  por  separado  el  costo  de  producción  de  los  otros  costos. \nPágina 22  BIBLIOGRAFIA  Robert  S.  Kaplan,  \"The  Evolution  of  Management  Accounting\",  The  Accounting  Review,  Julio  1984,  pp.390-418.  \"O Sistema de Custeio por Atividade - Sistema ABC\", Temática Contábil e Balanços, Febrero 1994.  María  Angela  Jiménez  Montañés,  \"El  ABC:  Nuevo  Sistema  de  Gestión  Empresarial\",  SUMA,  4o.  trimestre 1993, pp.5-7.  Deloitte  Touche  Tohmatsu  International,  \"Strategic  Cost  Management,  A  Systematic  Approach  for  Improving Performance\", 1993.  Robin  Cooper,  \"You  Need  a  New  Cost  System  When...\",  Harvard  Business  Review,  Enero - Febrero  1989, pp.77-82.  Peter  E.  Drucker,  \"The  Emerging  Theory  of  Manufacturing\",  Harvard  Business  Review,  Mayo - Junio  1990, pp.94-102.  James  A.  Brimson,  \"Activity  Accounting:  An  Activity-Based  Costing  Approach\",  Ed.  John  Wiley  &  Sons, Inc. 1991.  James  M.  Reeve,  \"TQM  and  Cost  Management:  New  Definitions  for  Cost  Accounting\",  Survey  of  Business, Verano 1989, pp. 26-30.  Robert  H.  Schaffer,  Harvey  A. Thomson,  \"Successful  Change  Programs  Begin  with  Results\",  Harvard  Business Review, Enero-Febrero 1992, pp.80-89.  Robin Cooper, Robert S. Kaplan, \"Measure Costs Right: Make the Right Decisions\", Harvard Business  Review, Setiembre - Octubre 1988, pp.96-103.  Robin  Cooper,  Robert  S.  Kaplan,  \"Profit  Priorities  from  Activity-Based  Costing\",  Harvard  Business  Review, Mayo - Junio 1991, pp.130-135.  Ravi  Venkatesan,  \"Strategic  Sourcing:  To  Make  or  not  to  Make\",  Harvard  Business  Review,  Noviembre - Diciembre 1992, pp.98-107.  Philippe  Lorino,  \"El  control  de  gestión  estratégico;  la  gestión  por  actividades\",  Marcombo  Boixareu  Editores, Barcelona, 1993.  Michael  D.  Woods,  \"What's  wrong  with  Activity-Based  Costing?\",  APICS  Consultants  Forum,  Abril  1994, p 61. \n";
