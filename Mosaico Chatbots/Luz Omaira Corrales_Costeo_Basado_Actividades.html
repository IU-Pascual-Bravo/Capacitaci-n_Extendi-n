    const PDF2_TEXT_EMBEDDED = "570  V10-N1 (ene-feb) 2025, pp 570-587 | Recibido: 09 de octubre del 2024 - Aceptado: 2 de diciembre del 2024 (2 ronda rev.)  Fundamentos teóricos y prácticos para la  implementación de costos ABC del sector artesanal   Mercedes Elizabeth Cárdenas-Pañi 1 Universidad Católica de Cuenca - Ecuador Mercedes.cardenas@ucacue.edu.ec  Mónica Alexandra Lituma-Yascaribay  2 Universidad Católica de Cuenca - Ecuador mlitumay@ucacue.edu.ec  Mila Valeria Padilla-Pallahzco 3 Universidad Católica de Cuenca - Ecuador mila.padilla@ucacue.edu.ec Theoretical and practical foundations for the  implementation of ABC costs in the artisanal sector   1  ORCID: https://orcid.org/0000-0001-9540-4267  2  ORCID: https://orcid.org/0000-0002-8645-9167  3  ORCID: https://orcid.org/0009-0001-8906-3328   doi.org/10.33386/593dp.2025.1.2843 \n571  El  proceso  productivo  artesanal  actualmente  requiere  la  implementación  de  un  sistema  óptimo  que    permita  a  la  empresa  salvaguardar  los  recursos  disponibles,  distribuir  de  manera  más  eficiente  los  costos productivos y lograr un crecimiento económico. Uno de los sistemas que cumple eficientemente   esta necesidad es el sistema de costos ABC (Activity-Based Costing). El presente estudio muestra los  fundamentos  teóricos  del  sistema  ABC  y  la  manera  práctica  de  su  implementación,  la  metodología   utilizada  fue  con  enfoque  cualitativo  y  cuantitativo,  de  corte  transversal  descriptivo,  lo  cual  permite   determinar  el  costo  real  de  la  producción  a  nivel  artesanal.  Por  tanto  es  vital  conocer  la  estructura  de   los negocios, la naturaleza de las operaciones y el uso de las herramientas tecnológicas para la gestión  de  recursos,  el  control  de  los  costos  y  tiempos  empleados  en  el  proceso  productivo.    Como  resultado   teórico-práctico, se comprende como los costos se distribuyen entre las distintas actividades y productos  por medio de los \"cost drivers\", optimizando el uso de recursos y mejorando la competitividad, previo a   identificar los tres elementos del costo y asignar efectivamente los costos indirectos (CIF), la producción   de  los  artículos  T  y  K  mostró  un  costo  total  y  unitario  que  servirá  para  determinar  precios  de  ventas    confiables para la toma de decisiones.   Palabras claves:  producción, artesanos, gestión de recursos, cost drivers, sistemas de costos ABC. The artisanal production process currently requires the implementation of an optimal system that allows   the company to safeguard available resources, distribute production costs more efficiently and achieve  economic growth. One of the systems that efficiently meets this need is the ABC (Activity-Based Costing)   cost system. The present study shows the theoretical foundations of the ABC system and the practical  way of its implementation. The methodology used was with a qualitative and quantitative approach, with  a descriptive cross-section, which allows determining the real cost of production at the artisanal level.  Therefore,  it  is  vital  to  know  the  structure  of  the  business,  the  nature  of  the  operations  and  the  use  of   technological tools for resource management, control of costs and times used in the production process.    As a theoretical-practical result, it is understood how costs are distributed among the different activities   and products through the \"cost drivers\", optimizing the use of resources and improving competitiveness,   prior to identifying the three elements of the cost and assigning Effectively the indirect costs (CIF), the   production of items T and K showed a total and unit cost that will serve to determine reliable sales prices  for decision making.   Keywords:  production, artisans, resource management, cost drivers, ABC cost systems. RESUMEN ABSTRACT  Cómo citar este artículo en norma APA:A  Cárdenas-Pañi, M., Lituma-Yascaribay, M., & Padilla-Pallahzco, M., (2025). Fundamentos teóricos y prácticos para la implementación de   costos ABC del sector artesanal. 593 Digital Publisher CEIT, 10(1), 570-587, https://doi.org/10.33386/593dp.2025.1.2843 Descargar para Mendeley y Zotero \nV10-N1 (ene-feb) 2025 | https://doi.org/10.33386/593dp.2025.1.2843   572 Fundamentos teóricos y prácticos para la implementación de  costos ABC del sector artesanal   Introducción  Hoy  en  día  la  gestión  de  costos,  retoma   gran  importancia  pues  se  refiere  al  proceso  de   planificación, control y monitoreo de los costos  de  una  empresa  con  el  fin  de  maximizar  la   eficiencia y rentabilidad. Se enfoca en identificar,  analizar  y  minimizar  los  costos  asociados  a  la   producción y operación. Los sistemas de costeo  son  métodos  que  las  empresas  dedicadas  a  la   producción,  utilizan  para  asignar  costos  a  sus   productos  o  servicios.  Cada  sistema  tiene  su   enfoque  particular,  adaptándose  a  la  naturaleza   de  la  producción  y  a  la  información  requerida   por la gerencia (Ochoa et al., 2020). Existen varios tipos de sistemas de costeo  de los cuales se pueden mencionar: Costeo por órdenes: utilizado en entornos  donde los productos son únicos. Se acumulan los  costos  por  cada  orden  de  producción  específica   (Ochoa et al., 2020). Costeo  por  procesos:  Adecuado  para   producciones en serie de productos homogéneos,  acumulando costos por períodos. Costeo  basado  en  actividades  (ABC):   Asigna  los  costos  indirectos  en  función  a  las   actividades que consumen recursos, permitiendo  un análisis más preciso. Costeo  variable:  Solo  considera  los   costos  variables  en  el  cálculo  del  costo  de  los   productos. Costeo  completo:  Incluye  todos  los   costos  (fijos  y  variables)  al  determinar  el  costo   de la producción. Para  Ramos  et  al.  (2020)  la  selección   del  sistema  de  costeo  depende  de  la  estructura   de  costos  de  la  empresa  y  de  la  naturaleza  de   sus  operaciones;  así  mismo  cualquier  sistema  a   implementar analiza los  elementos del costo que  son: a) Materia Prima: se refiere a los materiales  utilizados, es un componente crucial que impacta  directamente en el costo de producción, b) Mano  de  Obra:  incluye  todos  los  costos  relacionados   con  los  salarios  y  beneficios  sociales  de  los   empleados  que  participan  directamente  en  el   proceso  productivo,  y  finalmente  c)  Costos    Indirectos de Fabricación (CIF): son los costos   que  no  se  pueden  asignar  directamente  a  un   producto específico, pero son necesarios para el  proceso de producción.  Uno  de  los  sistemas  que  actualmente   permite  determinar  de  manera  eficiente  los   costos  productivos,  es  el  sistema  de  costos   ABC (Activity-Based Hosting); así lo menciona  Gallegos  y  Quezada  (2020),  ya  que  permite   optimizar  las  ganancias  por  medio  de  la   distribución  de  costos  más  reales  y  actividades   primordiales  para  la  producción.    Este  método   surgió  en  el  siglo  XXI,  respondiendo  a  las   necesidades  de  los  grandes  empresarios  con  el   fin de asignar los costos de manera más precisa,  su  objetivo  principal  es  desarrollar  ventajas   competitivas  en  el  mercado,  mejorando  los   beneficios  y  compensar  las  necesidades  de  los   clientes (Myca, 2023). En Ecuador  existen más  de  trescientos   mil    talleres    artesanales    que  generan  empleo,   lo que aportan de manera directa a la economía  del país, sin embargo el control de su actividad  productiva  lo  hacen  de  manera  empírica  de   acuerdo  a  lo  indicado  por  Lituma  et  al.  (2020),   por esta razón se ve la necesidad de gestionar sus  procesos,  ya  que  al  no  conocer  claramente  los   costos  empleados  en  cada  uno  de  sus  artículos,   no  pueden  fijar  precios  reales  y  competitivos,   bajo lo expuesto los investigadores se interrogan  ¿cuál  es  el  proceso  a  seguir  en  la  producción   artesanal bajo el método ABC? pues de acuerdo  a Quispe et al., (2023) significa la identificación  precisa  de  distribución  de  los  costos,  mediante   los llamados inductores.   Bajo  este  contexto,  este  estudio  centra   su atención en socializar la eficacia de utilizar el  sistema  de  costos ABC  para  el  sector  artesanal,   mostrando una aplicación práctica amigable, ya  que se enfoca en maximizar y gestionar de manera  más eficiente los recursos de la empresa, durante  el proceso productivo; la fundamentación teórica  de este método indica que las empresas pueden  llegar  a  ser  competitivas  y  obtener  rentabilidad   económica,  logrando  obtener  información   \n573 Theoretical  and  practical  foundations  for  the  implementation  of   ABC costs in the artisanal sector  Mercedes Cárdenas-Pañi | Mónica Lituma-Yascaribay | Mila Padilla-Pallahzco | pp  570-587  adecuada, razonable y oportuna, para la toma de  decisiones (Malla et al., 2019).  Método   El presente trabajo de investigación, tuvo  enfoque mixto; en primera instancia cumple con  la  parte  cualitativa  pues  se  hizo  una  revisión   bibliográfica  minuciosa  de  los  últimos  5  años   relacionados al costeo ABC, en lo referente a la  parte cuantitativa se centra en el análisis práctico  sobre  la  metodología  a  seguir  del  sistema  de   costeo antes mencionado; fue de corte transversal  descriptivo  y  de  tipo  no  experimental,  ya  que   la  información  no  sufrió  cambios  por  parte  de   los  investigadores,  lo  que  permitió  conocer   aquellos  aspectos  relevantes  a  considerar  en  la   implementación de un sistema de costos ABC.  Marco Teórico  Definición de costos ABC  El  origen  de  este  sistema  se  remonta   al  año  de  1980  donde  por  primera  vez  fue   introducido  por  Kaplan  y  Cooper,  en  donde  de   materiales  y  mano  de  obra  eran  los  principales   factores  de  producción,  mientras  que  los  costos   indirectos  constituían  una  pequeña  parte  del   costo  total;  bajo  la  denominación  de  sistemas   tradicionales  empezaron  a  mostrar  deficiencias,   ya  que  los  costos  indirectos  aumentaron  con  el   uso  de  la  tecnología;  estos  errores  de  cálculo    en los CIF creo el costeo basado en actividades   (Romero et al., 2019). Para  González  et  al.,  (2019)  mencionan   que  los  sistemas  de  costeo  tradicional  no   permiten  identificar  los  inductores  de  costo   ni  garantizar  la  confiabilidad  de  los  costos   unitarios,  pues  no  reconocen  los  procesos,   actividades  o  áreas  específicas  de  producción;   mientras  que  el  sistema  de  costeo ABC  analiza   las  actividades  e  identifica  las  áreas  donde  se   generan  los  costos. Así,  se  obtiene  información   más  confiable  y  se  pueden  distinguir  entre  las   actividades  que  agregan  valor  y  aquellas  que   resultan innecesarias. El  sistema  de  costos  ABC  (Activity- Based  Costing),  es  utilizado  para  la  gestión   y  análisis  de  costos  que  ayuda  a  las  empresas   a  lograr  estimaciones  más  exactas;  permite   identificar  recursos  subutilizados  y  actividades   que  no  aportan  valor,  dando  como  resultado  a   una  disminución  de  costos  y  un  incremento  en   las ganancias (Gallegos y Quezada, 2020). El sistema ABC ofrece información más  clara, útil y precisa sobre aquellas acciones que  consumen  recursos  y  generan  costos,  en  lugar   de centrarse únicamente en lo que simplemente  consumen  dichas  actividades.  Este  sistema  se   basa  en  fijar  costos  a  las  actividades  clave  de   la  empresa  utilizando  inductores,  y  luego,  esos   costos  se  distribuyen  a  los  objetos  de  costo   mediante  los  mismos  inductores  (Quispe  et  al.,   2023). Según Romero et al. (2019), este sistema  evalúa  los  procesos  y  recursos  involucrados  en   la producción o prestación de servicios mediante  el  análisis  de  áreas  y  actividades  relacionadas,   con el fin de competir en el mercado y eliminar  costos  innecesarios,  lo  que  a  su  vez  incrementa   las utilidades. Además, Kitsantas et al. (2020) en  su  revisión  de  literatura  sobre  la  planificación   de  recursos  empresariales  (ERP),  analizaron  el   sistema ABC en comparación con la contabilidad  de  costos  tradicional  (TCA),  abordando  los   principales  temas  de  investigación,  desafíos,   beneficios y barreras del ABC. Corroborando lo expresando en párrafos  anteriores  demuestra  Ramos  et  al.  (2020)  que   mediante  el  sistema  ABC  es  posible  calcular   costos de manera precisa, lo cual es fundamental  para una gestión eficaz en las actividades de las  empresas y mejorar su rentabilidad, ya que facilita  la planificación futura al identificar ineficiencias  y  desperdicios  que  afectan  los  beneficios  y   la  competitividad.  Asimismo,  Rodríguez  y   Rodríguez  (2019)  propusieron  desarrollar  este   sistema  en  una  pyme  agroalimentaria,  logrando   así un mejor control administrativo.  Teorías  relevantes  que  sustentan  el  uso  de   costos ABC \nV10-N1 (ene-feb) 2025 | https://doi.org/10.33386/593dp.2025.1.2843   574 Fundamentos teóricos y prácticos para la implementación de  costos ABC del sector artesanal   Dentro de las teorías más relevantes que  sustentan el uso de costos ABC están las que se  describen a continuación:   1. Teoría de la Gestión de Costos  Esta teoría se centra en la identificación  y control de los costos durante todas las fases de  un  proceso  productivo.  El ABC  suministra  una   manera  más  sencilla  y  precisa  para  fijar  costos   a  los  productos  y  servicios  al  identificar  las   acciones determinadas que ocasionan costos, en  vez  de  simplemente  distribuir  costos  indirectos   de forma arbitraria. Esto permite a las empresas  comprender  mejor  cómo  se  generan  los  costos   y  cómo  pueden  ser  gestionados  eficientemente   (Contreras Tejada y Del Castillo Calle, 2020).  2. Teoría de la Eficiencia Operativa  La  eficiencia  operativa  implica  que  una   organización use sus recursos de forma efectiva  y mejore sus procesos. El método ABC permite  detectar  actividades  que  no  aportan  valor,  lo   que  facilita  su  eliminación  o  mejora.  Así,  las   empresas pueden elevar su eficiencia y disminuir  gastos  innecesarios  (Rebatta  Choquehuanca,   2022).  3. Teoría del Valor Agregado  Esta teoría sugiere que las empresas deben  centrarse  en  aquellas  acciones  generen  valor  al   cliente.  El  ABC  permite  a  las  organizaciones   analizar  cada  actividad  y  su  contribución  al   valor  percibido  por  el  cliente.  Al  identificar   actividades  que  no  generan  valor,  las  empresas   pueden  eliminarlas  o  rediseñarlas,  mejorando   así su propuesta de valor (Espinosa y Zambrano,  2020).  4. Teoría de la Contabilidad de Gestión  La  contabilidad  de  gestión  se  centra  en   ofrecer  información  relevante  para  decisiones   internas.  El  método  ABC  es  visto  como  una   herramienta clave en este ámbito, ya que ayuda  a  los  gerentes  a  obtener  datos  precisos  sobre   costos, facilitando así la planificación, el control  y  la  toma  de  decisiones  estratégicas  (Villalba   et al., 2021).  5. Teoría de la Innovación en Costos  Esta  teoría  se  centra  en  la  necesidad   de  las  empresas  de  innovar  en  sus  procesos   y  estructuras  de  costos  para  mantenerse   competitivas.  El ABC  fomenta  la  innovación  al   ofrecer  un  marco  para  evaluar  qué  actividades   son  más  rentables  y  cuáles  requieren  mejoras   (Rebatta Choquehuanca, 2022).  6. Teoría de la Competitividad  En  un  entorno  empresarial  competitivo,   las empresas necesitan entender sus costos para  fijar precios adecuados y mantener márgenes de  ganancia.  El  sistema  del  ABC  suministra  una   visión  más  clara  sobre  los  costos  por  actividad,   lo  que  ayuda  a  la  toma  de  decisiones  en  las   empresas sobre precios y estrategias de mercado  (Villalba et al., 2021).  7. Teoría del Costo Total de Propiedad (TCO)  El  TCO  considera  todos  los  costos   asociados a la adquisición y uso de un producto  o servicio. El ABC apoya esta teoría al permitir  un  análisis  detallado  de  costos,  no  solo  en  la   producción, sino en todas las etapas del ciclo de  vida  del  producto,  lo  que  ayuda  a  las  empresas   a  tomar  decisiones  más  informadas  (Contreras   Tejada y Del Castillo Calle, 2020).  Implementación del sistema de costeo ABC  Existen  dos  enfoques  para  implementar   el  costeo  ABC:  la  metodología  de  dos  fases  y   la  de  cuatro  pasos.  La  primera  consta  de  fases   y  etapas,  comenzando  por  la  identificación  de   los  costos  de  las  actividades  de  cada  centro  de   costo, que se divide en seis etapas. En la segunda  fase,  que  incluye  dos  etapas,  se  determinan  los   costos de los productos. Por otro lado, el método  de  los  cuatro  pasos  implica  la  creación  de  un   diccionario  de  actividades,  la  evaluación  de   los  gastos  relacionados  con  cada  actividad,  la   identificación de clientes, servicios, productos, y  el  diseño  de  inductores  de  costos  que  conecten   productos,  servicios  y  acciones  (Gallegos  y   Quezada, 2020). \n575 Theoretical  and  practical  foundations  for  the  implementation  of   ABC costs in the artisanal sector  Mercedes Cárdenas-Pañi | Mónica Lituma-Yascaribay | Mila Padilla-Pallahzco | pp  570-587  El  enfoque  del  ABC  se  basa  en  las   actividades  como  su  principal  concepto,  ya  que   son  ellas  las  que  generan  costos,  los  cuales  son   consumidos  por  productos  o  servicios.  Este   sistema  asigna  costos  a  las  actividades  usando   inductores  de  costos  de  recursos,  dependiendo   de  su  uso.  Posteriormente,  se  asignan  estas   actividades  a  los  objetos  de  costo  mediante   nuevos inductores (Nielsen, 2023). Por  lo  tanto,  es  fundamental  observar   las  actividades  de  la  empresa  desde  una   perspectiva  horizontal  y  en  función  del  flujo   de  los  procesos.  Esto  posibilita  descomponer   los  costos  de  los  productos  en  actividades,  lo   que  ofrece  un  análisis  más  realista  y  detallado   sobre las oportunidades de reducción de costos.  Además,  es  vital  entender  una  actividad  como   el  resultado  de  la  combinación  de  recursos   humanos, materiales, tecnológicos y financieros  utilizados en la producción de bienes y servicios  de la empresa (Morocho Zurita et al., 2022).  Finalmente,  al  implementar  el  ABC,   es  recomendable  comenzar  con  datos  reales,   objetivos  y  documentados,  que  provengan  de   aquellos  sistemas  contables  de  la  empresa.   En  cuanto  a  la  determinación  de  la  cantidad   de  actividades,  hay  varias  teorías  al  respecto   (Campos et al., 2021)  Beneficios  que  aporta  el  sistema  de  costos   ABC a las empresas  Entre  las  ventajas  del  sistema  de  costos   ABC  se  encuentran  un  mejor  control  y  una   reducción de los costos indirectos, ya que facilita  la  identificación  y  eliminación  de  actividades   que  no  generan  valor.  Además,  permite  un   cálculo más preciso de los costos, lo que resulta  beneficioso  durante  la  planificación,  al  ofrecer   información  valiosa  para  diversas  decisiones   (Salazar Huiza, 2020).  Con  el  ABC,  se  puede  obtener  datos   clave para la fijación de precios, el lanzamiento  de  nuevos  productos  y  la  adopción  de  nuevos   diseños o procesos de producción. Esto favorece  una  toma  de  decisiones  estratégicas  informadas   y un análisis de la competitividad en relación al  precio de venta (Huamaní Vajalque, 2022).  La  información  producida  por  el   ABC  contribuye  a  reestructurar  los  procesos   empresariales  al  identificar  productos  que  no   aportan valor, aumentar la rentabilidad y mejorar  decisiones sobre subcontratación, aceptación de  pedidos,  combinaciones  de  ventas  y  desarrollo   de nuevos productos. Morillo y Cardozo (2017)  también destacan que el ABC ayuda a organizar,  listar  y  conceptualizar  cada  actividad  llevada   a  cabo  en  las  distintas  áreas  de  la  organización   (Kissa et al., 2024). Implementar  un  sistema  de  costos   ABC  se  complementa  con  la  aplicación  de   tasas  de  asignación,  en  adelante  (TDABC),   facilitando  una  gestión  más  precisa  de  costos  y   actividades.  Esto  contribuye  significativamente   a  la  optimización  de  recursos  económicos  y  a   una  distribución  adecuada  del  tiempo  en  cada   actividad  del  proceso  productivo. Al  establecer   estrategias  para  gestionar  de  una  forma  más   efectiva y eficiente de los recursos, se logrará una  reducción en el costo del producto (Vedernikova  et al, 2022).  Figura 1  TDABC (Time-Driver Activity-Based Costing)/  Bases de datos o drivers/ Inductores.  Not a: Proceso de distribución los CIF en base a   los TDABC/ Bases de datos o drivers/ Inductores. Sin  embargo,  la  implementación  del   sistema  ABC  presenta  ciertos  inconvenientes   que  se  describen  a  continuación:  1)  La  falta   de  recursos  en  las  empresas  para  llevar  a  cabo   la  implementación  y  contratar  consultorías;   \nV10-N1 (ene-feb) 2025 | https://doi.org/10.33386/593dp.2025.1.2843   576 Fundamentos teóricos y prácticos para la implementación de  costos ABC del sector artesanal   2)  La  resistencia  al  cambio  y  la  necesidad  de   formación  y  actualización  de  conocimientos   entre  contadores  y  directivos;  3)  La  ineficacia   del  sistema  al  gestionar  un  gran  número  de   inductores,  ya  que  su  selección  y  desarrollo   es  un  proceso  complicado  que  requiere  un   entendimiento profundo de la metodología, de la  organización  y  de  sistemas  de  información  que   faciliten la recolección y análisis de datos; 4) La  resistencia que puede surgir si la implementación  se realiza de forma aislada en los departamentos  de contabilidad o informática, sin incluir a toda  la organización (Kissa et al., 2024).  ¿Comó  implementar  el  costeo  ABC  en  una   empresa?  Para  establecer  el  costeo  ABC  es   necesarion  realizar  una  serie  procesos  para   identificar  a  cada  una  de  las  actividades  que   intervienen en la producción tal como se muestra  en la figura 2.  Figura 2  Proceso para establecer costos ABC  En el proceso productivo, es fundamental  identificar de manera exhaustiva las actividades  involucradas,  así  como  los  recursos  y  tiempos   empleados en cada una de ellas. Para las empresas  que implementarán un sistema de costos basado  en  actividades  (ABC),  es  necesario  evaluar   si  cuentan  con  los  recursos  requeridos  para   su  implementación.  Una  vez  identificadas  las   actividades, se deben establecer los inductores de  costos (cost drivers) para distribuir efectivamente   los costos indirectos de fabricación (CIF).  Uso  de  herramientas  tecnológicas  para  la   medición  de  las  actividades  productivas  e   implementación de los costos ABC.  Para Steen (2023) el uso de herramientas  tecnológicas  en  el  método  de  costos  ABC  es   fundamental  para  la  gestión  de  recursos,  ya   que  facilita  la  medición  precisa  de  los  costos   y  tiempos  generados  a  partir  de  las  acciones   realizadas  durante  el  proceso  productivo.  La   integración de la tecnología permite una gestión  de  mayor  eficiencia  de  los  recursos  humanos  y   financieros, contribuyendo a la optimización de  los procesos productivos. Esto, a su vez, mejora  la eficiencia operativa y maximiza los beneficios  para la empresa. Las herramientas tecnológicas permiten a  las empresas gestionar el desempeño de manera  efectiva a través de la contabilidad de gestión y  el  análisis  de  Big  Data,  esta  integración  facilita   la toma de decisiones informadas basadas en un  análisis matemático detallado de la información,  apoyado  por  la  inteligencia  de  negocios.  El   aumento en la importancia de las Tecnologías de  la  Información  (TI)  ofrece  soluciones  prácticas   y eficientes para resolver problemas, mejorando  así  la  competitividad  de  la  empresa,  ya  que  la   tecnología  pasa  a  ser  una  herramienta  de  suma   importancia para optimizar procesos y conseguir  una ventaja competitiva en el mercado.  Paso para aplicación de los costos ABC en las  empresas productoras.  Para  la  implementación  de  los  costos   ABC es necesario: Identificar cual es el giro del negocio y la  estructura orgánica del mismo. \n577 Theoretical  and  practical  foundations  for  the  implementation  of   ABC costs in the artisanal sector  Mercedes Cárdenas-Pañi | Mónica Lituma-Yascaribay | Mila Padilla-Pallahzco | pp  570-587  Figura 3  Relación actividad económica y la estructura  organizacional  Reconocer  todas  las  actividades  que   intervienen en el proceso productivo.  Figura 4   Actividades del proceso productivo  Medir  con  el  uso  de  TI  (Tecnología  de   la  Información),  todas  las  acciones  y  el  tiempo   empleado en cada proceso productivo, asi como  los materiales utilizados.  Corroborar    los  empleados  involucrados   en el proceso productivo, identificando el tiempo  que toma en cada actividad realizada.  Figura 5  Relación personal y actividades    Determinar  el  uso  de  la  Materia  prima   directa  (MPD)  y  Mano  de  obra  directa  (MOD)   que interviene en la producción. Identificar  los  costos  indirectos  de    frabicación  (CIF)  que  son  requeridos  en  el   proceso  productivo  hasta  la  obtención  del   producto final.  Figura 6  Identificación de los CIF y las actividades   Establecer  los  TDABC  o  inductores   en  base  a  la  medición  realizada  en  el  punto  3   y  de  acuerdo  a  la  naturaleza  de  la  actividad  se   establecerá  la  asignación  de  los  costos,  éstos   pueden  ser  por  Horas  Hombre  (HH),  Horas   Máquina  (HM),  metros  cuadrados  utilizados,   entre otros.  Figura 7  Relación de TDABC o inductores y las  actividades  Acumulación de los elementos del costo:  Materia Prima Directa, Mano de Obra Directa y   CIF, en base a lo efectivamente utilizado en cada   proceso productivo.  Figura 8  Acumulación de costos  Comparación con la información histórica  de  producción  con  que  cuenta  la  empresa,  el   mismo  que  servirá  de  parametro  para  gestionar   los TDABC y mejorar el rendimiento de éstos. \nV10-N1 (ene-feb) 2025 | https://doi.org/10.33386/593dp.2025.1.2843   578 Fundamentos teóricos y prácticos para la implementación de  costos ABC del sector artesanal   Gestionar  los  recursos  utilizados  con   ayuda de TI. Evaluación  contínua  de  los  TDABC   obtenidos  en  el  punto  7,  para  así  optimizar  los   recursos y mejorar el proceso productivo.  Aplicación  práctica  de  Costos  ABC  en  una    fábrica  denominada  “EL  TEJIDO”  para  el   mes de junio 2024.  La  fábrica  artesanal  “El  Tejido”,  se   dedica  a  producir  dos  articulos  T  y  K,  en  base   a  la  producción  se  ha  determinado  que  para   la  fabricación  de  los  productos,  debe  realizar   cuatro  actividades  hasta  obtener  los  productos   terminados.  Tabla 1  Activiades del proceso de producción  Actividad   Base de asignación/ Cost Drivers  Departamento de corte   Número Cortes Planta de producción   Horas Máquina Supervisión   Inspecciones Control de calidad   Supervisión  Acabado   Unidades Para la elaboración de los articulos T y K,  es  necesario  los  siguientes  materiales,  para  una   unidad producida:  Tabla 2  Materia prima directa e indirecta  Artículos   Cantidad Materiales Directos utilizada  por unidad Cantidad Materiales  Indirectos utilizada  por unidad   A   B   C   P   O  T   5 metros   7  mililitros(mL) -              2  metros K   4 metros         -   5 metros   40  unidades   La  fábrica  artesanal  “El  Tejido”,  cuenta   con el siguiente personal operario.  Tabla recisa  los  costos  indirectos  de    fabricación (CIF) a los productos. Esto es crucial   en un entorno de producción donde la eficiencia  y  la  rentabilidad  son  claves  para  el  éxito.      Se  identificaron  cinco  actividades  en  el  proceso   productivo,  cada  una  con  su  respectiva  base  de   asignación: •  Departamento de Corte:  Número de cortes . •  Planta de Producción:  Horas máquina . •  Supervisión:  Inspecciones.  •  Control de Calidad:  Supervisión.  •  Acabado:  Unidades.  Este  enfoque  permite  a  la  fábrica  “El   Tejido”  comprender  mejor  cómo  los  costos  se   distribuyen  entre  las  distintas  actividades  y,   por  ende,  entre  los  productos,  proporcionando   información valiosa para la toma de decisiones.   Con  respecto  a  los  tres  elementos  del  costo  a   continuación se detallan: La  materia  prima  directa  e  indirecta   utilizada  por  cada  artículo,  lo  cual  es  esencial   para  el  cálculo  de  costos  de  producción.  Por   ejemplo,  para  producir  una  unidad  del  artículo   T se requieren 5 metros de material A y 7 mL de  material  B  y  2  metros  del  material  O;  mientras   que el artículo K utiliza materiales A, C, P. El personal está bien definido, con roles  claros  que  afectan  la  asignación  de  costos.   La  identificación  de  la  mano  de  obra  directa   (Teresa  operario  producto  T  y  José  operario   de  producto  K),  e  indirecta  (vendedor,  jefe  de   planta, bodeguera) es fundamental para calcular  los costos laborales, que se integran en el total de  costos de fabricación.  Los  Costos  Indirectos  de  Fabricación   incluye  varios  costos  indirectos  que  deben  ser   asignados  adecuadamente  a  los  productos.  Los   costos  de  alquiler,  depreciación,  limpieza  y   seguridad  se  suman  a  los  salarios  del  personal    indirecto.  La  acumulación  total  de  CIF  es  de   $4,597.03,  y  la  correcta  distribución  de  estos   costos entre las actividades productivas es crucial  para reflejar con precisión la rentabilidad de cada  producto,  la  Asignación  de  Costos  Indirectos   se  distribuyen  según  los  “cost  drivers”  de  cada   actividad. El uso de porcentajes asignados a cada  departamento  permite  desglosar  los  costos  de   manera que se refleje el uso real de recursos en  \nV10-N1 (ene-feb) 2025 | https://doi.org/10.33386/593dp.2025.1.2843   584 Fundamentos teóricos y prácticos para la implementación de  costos ABC del sector artesanal   la producción de cada artículo. Por ejemplo, en  el Departamento de Corte, el producto T absorbe  una  parte  proporcional  de  los  costos  indirectos   según el número de cortes realizados. Una vez finalizado el proceso productivo  se realiza el cálculo de Costos Totales y Unitarios,  una vez asignar los costos indirectos, se procede  a acumular todos los costos (materia prima, mano   de obra directa y CIF) en hojas de costos. Para el   artículo  T,  el  costo  total  es  de  $174,437.22,  lo   que resulta en un costo unitario de $25.28. Para  el  artículo  K,  el  costo  total  es  de  $262,424.77,   con un costo unitario de $34.53. Estos resultados  permiten  a  la  fábrica  evaluar  la  rentabilidad  de   cada  producto  y  ajustar  estrategias  de  precios   o  producción  según  sea  necesario.    Con  esta   información  finalmente  la  presente  fábrica   artesanal,  logrará  determinar  de  manera  óptima   el  margen  de  utilidad  y  por  ende  el  precio  de   venta  al  público,  permitiendo  conseguir  réditos   reales.  Conclusiones   Al  aplicar  el  análisis  de  costos  ABC,   la  empresa  pueden  comprender  a  profundidad   su  estructura  de  costos,  permitiendo  mejorar  la   producción  mediante  un  análisis  detallado  de   los  datos.  Este  enfoque  permite  identificar  con    precisión  los  Costos  Indirectos  de  Fabricación   asociados  a  cada  actividad  en  el  proceso   productivo.  De  esta  manera  la  empresa  puede   tomar  decisiones  informadas  sobre  los  precios   de sus productos y así mejorar su competitividad  y rentabilidad.  En un mercado cada vez más desafiante,  el  análisis  de  costos  ABC  ofrece  una  ventaja   significativa en la gestión financiera y operativa.   Facilita  una  toma  de  decisiones  oportuna  y   estratégica, permitiendo determinar el costo real  de  sus  productos.  Esto  brinda  la  oportunidad   de  fijar  precios  alineados  con  la  realidad  del   mercado,  lo  que  a  su  vez  fortalece  la  posición   competitiva de la empresa. Las  razones  para  que  las  empresas   adopten  el  sistema  de  costeo ABC  varían  entre   ellas  y  no  siempre  están  relacionadas  con  la   reducción  de  costos  (Campos  et  al.,  2020;   Morales et al., 2021). A menudo, buscan obtener  información más detallada sobre costos o ajustar  precios ante la competencia.  Es  crucial  definir  el  propósito  de  la   implementación,  especialmente  en  pequeñas   empresas,  para  superar  la  complejidad  en   su  diseño  y  funcionamiento.  Un  exceso   de  actividades  puede  generar  demasiados   inductores,  complicando  el  sistema  (Morillo- Moreno y Cardozo, 2017).  Finalmente se corrobora que la aplicación   práctica en la fábrica artesanal “El Tejido en base  al  sistema  de  costeo  ABC  proporcionó  datos   fiables  y  precisos,  sobre  las  actividades  que   generan costos en la producción del artículo T y  k, se consiguió asignar costos a cinco actividades:  corte,  producción,  supervisión,  control  de   calidad  y  acabado.  Este  enfoque  permite   distribuir  eficientemente  los  costos  indirectos    de    fabricación    (CIF)    mediante    inductores,   identificando y eliminando costos innecesarios en  la producción; para junio de 2024, la producción  de los artículos T y K resultó en un costo total de  $174,437.22 y $262,424.77, con costos unitarios  de  $25.28  y  $34.53,  respectivamente.  Estos   resultados  son  cruciales  para  ajustar  precios,   evaluar             if (temp < 1 / 6) return p + (q - p) * 6 * temp;

            secondaryColor: isDark ? mixColors(accent, '#ffffff', 0.2) : mixColors(accent, '#000000', 0.2),
            headerBorderColor: border,
            systemMessageBg: isDark ? mixColors(bg, '#fde68a', 0.2) : mixColors(bg, '#fde68a', 0.28),
            systemMessageText: isDark ? '#fef3c7' : '#78350f'
        };
    }
    function buildThemePalette(theme, palette) {
        const base = palette || {
            primaryColor: '#2563eb',
            secondaryColor: '#6b7280',
            bgColor: '#ffffff',
            textColor: '#1f2937',
            cardBgColor: '#ffffff',
            cardBorderColor: '#d1d5db',
            inputBgColor: '#ffffff',
            inputBorderColor: '#cbd5e1',
            chatBubbleBotBg: '#f3f4f6',
            chatBubbleBotText: '#1f2937',
            chatBubbleUserBg: '#2563eb',
            chatBubbleUserText: '#ffffff',
            headerBorderColor: '#e5e7eb',
            systemMessageBg: '#fef3c7',
            systemMessageText: '#92400e'
        };
        const isDark = theme === 'dark';
        const bgColor = isDark ? mixColors(base.bgColor || '#ffffff', '#000000', 0.72) : '#ffffff';
        const textColor = getReadableTextColor(bgColor);
        const cardBgColor = isDark ? mixColors(bgColor, '#ffffff', 0.08) : '#ffffff';
        const cardBorderColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.16) : '#d1d5db';
        const inputBgColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.06) : '#ffffff';
        const inputBorderColor = isDark ? mixColors(cardBorderColor, '#ffffff', 0.12) : '#cbd5e1';
        const chatBubbleBotBg = isDark ? mixColors(bgColor, '#ffffff', 0.12) : '#f3f4f6';
        const chatBubbleBotText = textColor;
        const headerBorderColor = cardBorderColor;
        const systemMessageBg = isDark ? mixColors(bgColor, '#fde68a', 0.2) : '#fef3c7';
        const systemMessageText = isDark ? '#fef3c7' : '#92400e';
        return {
            ...base,
            bgColor,
            textColor,
            cardBgColor,
            cardBorderColor,
            inputBgColor,
            inputBorderColor,
            chatBubbleBotBg,
            chatBubbleBotText,
            headerBorderColor,
            systemMessageBg,
            systemMessageText
        };
    }
    function setPaletteVariables(target, palette) {
        if (!palette) return;
        target.style.setProperty('--primary', palette.primaryColor || '#007bff');
        target.style.setProperty('--secondary', palette.secondaryColor || '#6c757d');
        target.style.setProperty('--bg', palette.bgColor || '#f8f9fa');
        target.style.setProperty('--text', palette.textColor || '#343a40');
        target.style.setProperty('--card', palette.cardBgColor || '#ffffff');
        target.style.setProperty('--border', palette.cardBorderColor || '#dddddd');
        target.style.setProperty('--input', palette.inputBgColor || '#ffffff');
        target.style.setProperty('--iborder', palette.inputBorderColor || '#cccccc');
        target.style.setProperty('--bot-bg', palette.chatBubbleBotBg || '#e9ecef');
        target.style.setProperty('--bot-text', palette.chatBubbleBotText || '#343a40');
        target.style.setProperty('--user-bg', palette.chatBubbleUserBg || '#007bff');
        target.style.setProperty('--user-text', palette.chatBubbleUserText || '#ffffff');
        target.style.setProperty('--sys-bg', palette.systemMessageBg || '#fff3cd');
        target.style.setProperty('--sys-text', palette.systemMessageText || '#856404');
    }
    function applyPalette(palette) {
        currentPalette = palette;
        applyTheme(currentTheme);
        localStorage.setItem('downloaded-palette', JSON.stringify(palette));
    }
    function applyTheme(t) {
        currentTheme = t;
        document.body.classList.toggle('dark-mode', t === 'dark');
        themeBtn.textContent = t === 'dark' ? '☀️ Tema' : '🌙 Tema';
        const effectivePalette = buildThemePalette(t, currentPalette);
        setPaletteVariables(document.body, effectivePalette);
        setPaletteVariables(document.documentElement, effectivePalette);
        document.body.style.backgroundColor = effectivePalette.bgColor;
        document.body.style.color = effectivePalette.textColor;
        localStorage.setItem('theme', t);
    }
    themeBtn.addEventListener('click', () => { const n = currentTheme === 'dark' ? 'light' : 'dark'; applyTheme(n); });
    paletteBtn.addEventListener('click', () => { applyPalette(generatePalette()); });
    const savedPalette = JSON.parse(localStorage.getItem('downloaded-palette') || 'null');
    if (savedPalette) { applyPalette(savedPalette); }
    else if (INITIAL_PALETTE) { applyPalette(INITIAL_PALETTE); }
    else { applyPalette(generatePalette()); }
    applyTheme(currentTheme);

    // Second PDF (embedded or user-loaded)
    if (pdf2Text) { pdf2NameDisplay.textContent = pdf2Name + ' (incluido)'; pdf2StatusDisplay.textContent = '"' + pdf2Name + '" ya incluido.'; pdf2StatusDisplay.style.color = 'var(--success)'; }
    pdf2Upload.addEventListener('change', async (ev) => {
        const file = ev.target.files[0]; if (!file) return;
        if (!(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) {
            pdf2StatusDisplay.textContent = 'No es un PDF válido.'; pdf2StatusDisplay.style.color = 'var(--danger)'; return;
        }
        pdf2Name = file.name; pdf2NameDisplay.textContent = file.name;
        pdf2StatusDisplay.textContent = 'Procesando...'; pdf2StatusDisplay.style.color = 'var(--warning)';
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(e.target.result) }).promise;
                let text = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const tc = await page.getTextContent();
                    tc.items.forEach(item => text += item.str + ' ');
                    text += '\n';
                }
                pdf2Text = text;
                pdf2StatusDisplay.textContent = '"' + pdf2Name + '" cargado.'; pdf2StatusDisplay.style.color = 'var(--success)';
                addMsg('Segundo documento "' + pdf2Name + '" listo.', 'system');
            } catch(err) { pdf2StatusDisplay.textContent = 'Error al procesar.'; pdf2StatusDisplay.style.color = 'var(--danger)'; pdf2Text = ''; }
        };
        reader.readAsArrayBuffer(file);
    });

    function dismissThinkingAsSystem(text, asError) {
        const el = document.getElementById('thinking-msg');
        if (!el) return;
        el.className = 'system-message' + (asError ? ' error' : '');
        el.textContent = text;
        el.removeAttribute('id');
    }

    function addMsg(message, sender, isThinking = false) {
        const el = document.createElement('div');
        el.classList.add(sender === 'user' ? 'user-message' : sender.includes('system') ? 'system-message' : 'bot-message');
        if (sender.includes('error')) el.classList.add('error');
        if (sender === 'bot' && !isThinking) {
            const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
            const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;">' + html + '</div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else if (sender === 'bot') {
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong> <span class="thinking-animation">' + message + '</span></div></div>';
            el.id = 'thinking-msg';
        } else if (sender === 'user') {
            const userAvatarUrl = getAvatarUrl('user');
            el.innerHTML = '<div class="message user-message"><div class="message-bubble user-bubble"></div><img class="avatar-img" src="' + userAvatarUrl + '" alt=""></div>';
            el.querySelector('.user-bubble').textContent = message;
        } else {
            el.textContent = message;
        }
        chatDisplay.appendChild(el); chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }
    function updateLastMsg(message) {
        const el = document.getElementById('thinking-msg');
        const botAvatarUrl = getAvatarUrl('bot');
        const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
        const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
        if (el) {
            el.className = 'bot-message';
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;">' + html + '</div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            el.removeAttribute('id');
            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else addMsg(message, 'bot');
        chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }
    function escapeHtml(s) {
        if (s === undefined || s === null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getSessionHTML() {
        const clone = chatDisplay.cloneNode(true);
        const exportStyles =
            'body{font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;line-height:1.65;padding:28px;color:#333;max-width:880px;margin:0 auto;background:#fafafa;}' +
            'h1{color:#007bff;font-size:1.45em;margin-bottom:6px;}' +
            '.meta{color:#444;margin:6px 0;font-size:.95em;}' +
            'hr{border:none;border-top:1px solid #dee2e6;margin:22px 0;}' +
            '.chat-export{padding:4px 0;}' +
            '.chat-export .user-message,.chat-export .bot-message,.chat-export .system-message{margin-bottom:18px;}' +
            '.chat-export .system-message{text-align:center;color:#555;font-style:italic;padding:10px 14px;background:#fff3cd;border-radius:10px;border:1px solid #ffeaa7;}' +
            '.chat-export .system-message.error{background:#f8d7da;color:#721c24;border-color:#f5c6cb;}' +
            '.chat-export .message{display:flex;align-items:flex-end;gap:12px;}' +
            '.chat-export .message.user-message{flex-direction:row-reverse;}' +
            '.chat-export .avatar-img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid #e0e0e0;}' +
            '.chat-export .message-bubble{padding:12px 16px;border-radius:18px;max-width:78%;box-shadow:0 1px 2px rgba(0,0,0,.06);}' +
            '.chat-export .user-bubble{background:#007bff;color:#fff;}' +
            '.chat-export .bot-bubble{background:#e9ecef;color:#212529;}' +
            '.chat-export .bot-bubble strong{color:#007bff;}' +
            '.chat-export .bot-bubble p{margin:0 0 10px;}.chat-export .bot-bubble p:last-child{margin:0;}' +
            '.chat-export pre{background:#2d2d2d;color:#f8f8f2;padding:12px;border-radius:8px;overflow-x:auto;font-size:.9em;}' +
            '.chat-export code{background:#eee;padding:2px 6px;border-radius:4px;font-size:.9em;}' +
            '.chat-export ul,.chat-export ol{margin:8px 0;padding-left:22px;}';
        return '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sesión de chat</title><style>' + exportStyles + '</style></head><body>' +
            '<h1>Sesión de chat</h1>' +
            '<p class="meta"><strong>Documento:</strong> ' + escapeHtml(PDF_NAME) + '</p>' +
            '<p class="meta"><strong>Tema del chatbot:</strong> ' + escapeHtml(CHATBOT_THEME) + '</p>' +
            '<p class="meta"><strong>Modelo:</strong> ' + escapeHtml(MODEL) + '</p>' +
            '<hr><div class="chat-export">' + clone.innerHTML + '</div></body></html>';
    }

    function downloadSessionHtml() {
        const blob = new Blob([getSessionHTML()], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Sesion_Chat_' + Date.now() + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
