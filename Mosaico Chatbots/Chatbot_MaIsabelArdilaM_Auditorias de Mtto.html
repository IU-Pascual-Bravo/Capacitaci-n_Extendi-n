en  ayudar  a  mejorar  la  rentabilidad  del   sistema  de  producción    y  a  disminuir    la  incertidumbre  en  la  toma  de  decisiones  del   proceso  de  gestión  del  mantenimiento .  En  el  siguiente  artículo,      se  des cribe  la   importancia de los procesos de auditoría en el área del mantenimiento y se describen   algunas  de  las    técnicas  más  utilizadas  para  evaluar  el  desempeño  de  la  gestión  del   mantenimiento.            IV.1. CONCEPTOS BÁSICOS SOBRE AUDITORÍAS EN EL ÁR EA DEL MANT ENIMIENTO    Tomando como referencia el Modelo de Gestión de Mantenimient o (MGM) de 8 fases   (ver  Figura  4.1) ,  la  siguiente     sección  relacionada  con  las  técnicas  de  auditoría  de   gestión del mantenimiento forma parte de la Fase 1 del   MGM.   Fase 1:  Definici ó n de  objetivos,   estrategias y   responsabilidades   de  mantenimiento  Fase 2:  Jerarquizaci ó n  de los equipos de   acuerdo con la   importancia de  su funci ó n  Fase 3:  An á lisis de   puntos d é biles  en equipos de  alto impacto  Fase 4:  Dise ñ o de planes   de mantenimiento   preventivo y de los   recursos necesarios  Fase 5:  Programaci ó n del   mantenimiento y  optimizaci ó n en la   asignaci ó n de   recursos  Fase 7:  An á lisis del ciclo  de vida y de la  posible  renovaci ó n de   los equipos  Fase 6:  Evaluaci ó n y   control de la   ejecuci ó n del  mantenimiento  Fase 8:  Implantaci ó n del   proceso de  mejora continua y   adopci ó n de nuevas  tecnolog í as  Evaluaci ó n   Eficiencia  Eficacia  Mejora       Figura 4.1.   Modelo  del proceso de gestión del mantenimiento  (Crespo, 2007 , Parra y Crespo,   2015 )    \nInge Con     Asesoría Integral en  Inge niería de  Con fiabilidad     www.confiabilidadoperacional.com   www.ingeman.net       3    C ertif icación ICOGAM    Miami , Florida,   6 al   8 de Diciembre   del  2 017    https://app.box.com/s/83tyjazjpuixs4fgnaenfo28nvg9v2n2  La  efectividad  de  la  gestión  del  mantenimiento  sólo  puede  ser  evaluada  y   medida  por  el  análisis  exhaustivo  de  una  amplia  variedad  de  factores  que,  en  su   conjunto, constituyen la   aportación del mantenimiento al sistema de producción. Este   procedimiento  de  evaluación    se  denomina  con  el  término  de    auditoría ,    que  puede   definirse  como  una     “ revisión  sistemática  de  una  actividad  o  de  una  situación  para   evaluar  el  cumplimiento  de  las  re glas  o  criterios  objetivos  a  que  aquellas  deben    someterse”   (González, 2004) .       El  proceso  de  implantación  de  una  auditoría  debe  pasar  por  un  conjunto  de   etapas  siguiendo  un  orden  lógico  específico,  en  la  F igura  4. 2,  se  presenta  un   procedimiento  básico  de  i mplantación  de  una  auditoría  (Parra,  2008).  Es  importante   señalar,    que  no  hay  fórmulas  simples  para  \"medir\"  el  mantenimiento,  tampoco  hay   reglas fijas o inmutables con validez para siempre y en todos los casos. Los resultados   de  las  técnicas  de  auditorías   aplicadas  al  diagnóstico  de  la  efectividad  del   mantenimiento, deben ayudar a mejorar la rentabilidad del sistema de producción  y a   disminuir    la  incertidumbre  en  la  toma  de  decisiones  del  proceso  de  gestión  del   mantenimiento (Parra, 2008 y González, 2004 ).              Figura  4. 2.   Procedimiento general de implantación de una auditoría       Las auditorías de mantenimiento, deben tener como objetivo principal el evaluar   los procesos más importantes de la gestión del mantenimiento, de tal forma que uno   de  los  aspectos  d e  mayor  relevancia  en  el  desarrollo  de  una  auditoría  de   mantenimiento,  está  relacionado  con  la  definición  de  los  objetivos  claves  a  ser   auditados. A continuación se citan como ejemplo, algunos de los objetivos claves más   comunes del área del mantenimiento  (Woodhouse, 1996):       Garantizar  valores  aceptables  de  riesgo  operacional  de  los  activos  de   producción,    reduciendo  la  probabilidad  de    presencia  de  fallos  (mejorando  la   fiabilidad),    y/o  minimizando  las  consecuencias  de  los  fallos  sobre  las   operaciones, la s eguridad y el ambiente.   \nInge Con     Asesoría Integral en  Inge niería de  Con fiabilidad     www.confiabilidadoperacional.com   www.ingeman.net          4    C ertif icación ICOGAM    Miami ,   Florida,   6 al   8 de Diciembre   del  2017    https://app.box.com/s/83tyjazjpuixs4fgnaenfo28nvg9v2n2       Recuperar    de  forma  rápida  y  eficiente  la  tolerabilidad    de  los    sistemas,  una   vez  que  se  ha  producido  la  interrupción  de  la  función  (mejorando  la    mantenibilidad).       Optimizar  la  continuidad  operacional  (mejorando  la  disponibilidad),     con  el   objetivo de maximizar el desempeño económico de los activos a lo largo de su   ciclo de vida útil (mejorando el nivel de costes).    Una  vez  determinados  los  objetivos  claves  del  proceso  de  gestión  de   mantenimiento, las organizaciones deben identificar  las áreas de mayor oportunidad a   ser evaluadas dentro de la auditoría desarrollada. En términos generales los factores a   ser  evaluados  dentro  de  una  auditoría  de  mantenimiento  se  citan  a  continuación   (González, 2004):       Recursos Gerenciales       Sistemas de manej o de la información (GMAO)       Tecnologías aplicadas al mantenimiento preventivo y predictivo       Procesos de planificación y estimación       Control de calidad en mantenimiento       Procesos de soporte (logística, inventarios)       Planificación paradas de plantas       Integración e ntre Mantenimiento y Producción         Metodologías de Ingeniería de Fiabilidad       Aspectos de motivación y comunicación, etc.    En  resumen,  las  características  más  importantes  que  debe  tener  una  auditoría   orientada a evaluar los diversos procesos de gestión del mant enimiento, se presentan   a continuación (González, 2004):        Deben ser capaces de permitir que se tomen decisiones con datos cualitativos   y/o datos cuantitativos         Deben  ser  capaces  de  evaluar  los  factores  que  agreguen  el  mayor  valor   agregado al negocio       Deben     combinar  el  lenguaje  de  económico  (finanzas)  con  el  lenguaje  técnico   (ingeniería)        Su aplicación ha de ser rápida y de fácil implantación       Las complicaciones matemáticas han de manejarlas los ordenadores       Los  resultados  del  análisis  de  los  factores  auditado s,  deben    generar  acciones   que  permitan  conseguir  los  objetivos  estratégicos  del  negocio  y  maximizar  la   rentabilidad de los activos de producción     En  las  secciones  siguientes,  se  presentan  los  procedimientos  de  aplicación  de   algunas  de  las  técnicas  de  audi toría  más  utilizadas  para  evaluar  los  diversos  procesos   de  gestión  del  mantenimiento ,  incluyendo  la  auditoría    al  proceso  integral  de  Gestión   del Mantenimiento mostrado en la figura 4.1 .      \nInge Con     Asesoría Integral en  Inge niería de  Con fiabilidad     www.confiabilidadoperacional.com   www.ingeman.net       5    C ertif icación ICOGAM    Miami , Florida,   6 al   8 de Diciembre   del  2 017    https://app.box.com/s/83tyjazjpuixs4fgnaenfo28nvg9v2n2  IV.2.  AUDITORÍA  INTEGRAL DE GESTIÓN DE ACTIVOS, CONFIABILIDAD Y   MANTE NIMIENTO  DENOMINADA: “ ASSET MANAGEMENT, OPERATIONAL   RELIABILITY & MAINTENANCE SURVEY (AMORMS )”    La auditoría denominada AMORMS: ASSET MANAGEMENT, OPERATIONAL RELIABILITY   & MAINTENANCE SURVEY, des arrollada     por Parra y Crespo, 2015, permite evaluar las    8 f ases del modelo de Gestión de Mante nimiento propuestas en la figura 4.1. Las   áreas a ser auditadas con la herramienta  AMORMS  son:        1.   Gestión de Activos, Objetivos del Negocios (KPIS) y organización de soporte    2.   Modelos de Jerarquización basados en Rie sgo (criticidad de equipos)    3.    Análisis de problemas (manejo de fallas)    4.   Procesos de programación y  planificación     5.   Procesos de asignación de recursos, soporte informático y logístico     6.   Procesos de control y análisis de indicadores técnicos RAM    7.   Proceso de análisis de costos de ciclo de vida     8.   Procesos de revisión y mejora continua    El proceso de aplicación de esta auditoría se hará   a partir la línea de supervisión hacia   arriba (nivel de supervisores, ingenieros, superintendentes y gerentes), mín imo de 8   personas.     El  proceso  de  análisis  de    las     8    áreas        a  diagnosticar  se  realiza        a  partir  de  un   cuestionario  guía  de  150  preguntas .  Cada  partici pante  evaluará  cada  uno  de  las   preguntas  propuestas,  asignando     puntuaciones        que    ir án  desde  el  1  hasta  el    5,  en   función de la siguiente escala :      1.  Proceso muy deficiente    2.  Proceso debajo del promedio    3.  Proceso estándar  promedio    4.  Proceso con muy buenas prácticas    5.  Proceso a nivel de  Clase Mundial   \nInge Con     Asesoría Integral en  Inge niería de  Con fiabilidad     www.confiabilidadoperacional.com   www.ingeman.net          6    C ertif icación ICOGAM    Miami ,   Florida,   6 al   8 de Diciembre   del  2017    https://app.box.com/s/83tyjazjpuixs4fgnaenfo28nvg9v2n2       Los resultados de la auditoría se presentan en un format o tipo Radar   (ver figura 4.3.)       Figura 4.3. Ejemplo de resultados de la auditoría: AMORMS       A continuación se presenta el cuestionarío guía para la aplicación de la auditoría   AMORMS:    1.   Gestión de Activos, Objetivos del Negocio ( KPI S) y Organización de Soporte    1.1   Visión Gerencial & Liderazgo     1.1.1   Existen Directrices Corporativas sobre el proceso de Gestión de Activos?    1.1.2   Existe Conciencia de la Gestión de Activos y su Administración?   (Roles/Alcances/Responsabilidades)    1.1.3   Existe  un Control  detallado sobre los objetivos del negocio desde la Gerencia   Corporativa?    1.1.4   Tiene la   matriz  de  5  x  7  (Referencia:  ABS    –     Reliability  and  Risk  Group  JBFA  Training,  Curso:   Reliability  Management). Los ejes d e la matriz se detallan a continuación:       Eje  Horizontal:  corresponde  a  las  5  etapas  de  mejora  del  mantenimiento:   incertidumbre, conciencia, entendimiento, madurez y excelencia       Eje    vertical:  corresponde  a    los  factores  de  gestión  del  mantenimiento  a   evaluar :  aptitud  de  la  alta  gerencia,  status  de  la  organización  mantenimiento,   costes del mantenimiento / costes totales, formas de resolver los problemas en   mantenimiento,  calificación  y  entrenamiento  del  personal  de  mantenimiento,   manejo de la información  y to ma de decisiones,  posición de la organización en    relación al mantenimiento    Las áreas de mantenimiento propuestas a ser evaluadas:       Aptitud de la alta gerencia        Status de la organización mantenimiento       Costes del mantenimiento / costes totales        Formas de res olver los problemas en mantenimiento        Calificación y entrenamiento del personal de mantenimiento        Manejo de la información  y toma de decisiones        Posición de la organización en relación al mantenimiento    El  proceso  de  aplicación  de  esta   auditoría  se   hará  a  nivel  de  personal  de   gerencia,    y  es  común  desarrollarlo  mediante     una  tormenta  de  ideas  (se  recomienda   aplicar el cuestionario de la matriz a la mayor cantidad de participantes posibles para   minimizar la incertidumbre de esta técnica).       El  p roceso  de  cuan tificación  de  las  áreas  de  mantenimiento  a  diagnosticar     se   realiza  tomando    los  resultados  de  cada  una  de  las  evaluaciones  realizadas  por  cada   participante y  promediándolos . Cada participante evaluará cada uno de los 7 factores   propuestos,  las  puntuaciones    irán  desde  el  1  hasta  el  5     ( siendo    1:  Incertidumbre,  2:   Conciencia, 3: Entendimiento, 4: Madurez y 5: Excelencia). Las preguntas desarrolladas   para cada una de las 7 áreas a ser evaluadas se presentan en la Tabla 4.1.                     \nInge Con     Asesoría Integral en  Inge niería de  Con fiabilidad     www.confiabilidadoperacional.com   www.ingeman.net       19    C ertif icación ICOGAM    Miami , Florida,   6 al   8 de Diciembre   del  2 017    https://app.box.com/s/83tyjazjpuixs4fgnaenfo28nvg9v2n2                       Etapas   Criterios    Etapa 1   Incertidumbre    Etapa 2   Conciencia    Etapa 3   Entendimiento    Etapa 4       Madurez    Etapa 5                Excelencia    Aptitud gerencial    No existe el   concepto de   prevención  -   solo se    corrige cuando sea   necesario     Reconoce que el   mantenimiento   podría mejorar pero   esta ren uente a   aceptar     Comienza  a   aprender sobre el   impacto  del   mantenimiento en la   rentabilidad  -   se   interesa y promueve   algunos cambios    Genera propuestas   de mejora hacia el   mantenimiento,   reconoce que el   apoyo de la gerencia   es de vital   importancia para   cons olidar las   mejoras    Incluye al   mantenimiento como   parte integral de los   objetivos del negocio.    Status de la    organización   Mantenimiento       REACTIVA:   trabajar sobre los   equipos cuando   estos fallan de   forma imprevista  -     reparar cuando se   rompa    CONCIENTE: se   m antiene corrigiendo   fallas pero tiene   ahora repuestos y   realiza algunos   mantenimientos   mayores      PREVENTIVA:   aplica rutinas   preventivas por   tiempo  de   inspección,   lubricación, ajustes y   servicios menores   con el fin de   aumentar el TPO de   algunos equipos     PR EDICTIVA:   aplica técnicas de   análisis de   vibración,   termografía,   ultrasonido, etc.,   para monitorear la   condición de   algunos equipos.   Realiza análisis de    fallas repetitivas     PROACTIVA: define y   prioriza las actividades   de mant. (preventivo y   predictivo) en   función   de las consecuencias de   las fallas y desarrolla   modelos de decisión   basados en riesgo    Costes totales de   mantenimiento /   Costes totales de   producción    30+%   20 - 30%   10 - 20%   5 - 10%   Menos del 5%    Formas de   resolver los   problemas    Problemas se   resuelven se gún   como vayan   apareciendo    Se reparan las fallas   en tiempos cortos.   Se inician algunos   análisis de fallas   (solo mantenimiento)    Problemas analizan y   se resuelven con   información   proveniente de   mantenimiento y   operaciones    Problemas se   analizan a partir del   e sfuerzo de equipos   de trabajo   (operaciones,   mantenimiento,   ingeniería, logística,   proyectos,   fabricante, etc.)      Problemas se analizan   por equipos de trabajo,   se evalúan los riesgos  y   se  previenen  los    problemas que afectan   la rentabilidad del   negocio    Calificación y   adiestramiento   del personal de   mantenimiento    Trabajos de baja   calidad son   aceptados,   entrenamiento se   considera   innecesario,   ausencia de   procedimientos,   herramientas en mal   estado    Se reconoce la falta   de adiestramiento, se   identifican las   he rramientas   obsoletas, se   identifican algunos   procedimientos de   trabajo    Se entiende la   importancia de la   calidad en el mant.,   se definen los roles y   procedimientos de   trabajo, se   desarrollan algunas   habilidades críticas,   anualmente se   considera un   presupues to para   adiestramiento     Se definen   procedimientos de   certificación de   calidad en   mantenimiento, se   desarrolla personal   de mant. de   multihabilidades, el   entrenamiento se   define por   rendimiento y   desempeño    Altos estándares de   calidad  en la ejecución   del man t., el   adiestramiento se   visualiza como una   inversión y se planifica   en función del impacto   económico de cada   área, muy alta   flexibilidad para la   ejecución del mant.    Manejo de la   información y   proceso de toma   de decisiones    No se maneja   ningún registro de   mantenimiento va de Excelenci a en Mantenimiento (MCEM)   \nInge Con     Asesoría Integral en  Inge niería de  Con fiabilidad     www.confiabilidadoperacional.com   www.ingeman.net          20    C ertif icación ICOGAM    Miami ,   Florida,   6 al   8 de Diciembre   del  2017    https://app.box.com/s/83tyjazjpuixs4fgnaenfo28nvg9v2n2    IV.3. TÉCNICA DE AUDITORÍA DENOMINADA: “MAINTENANCE EFFECTIVENESS   SURVEY (MES)”    La  auditoria  MES  es  una  auditoria  propuesta  por  el  Instituto  Marshall   ( http://www.marshallinstitute.c om/ )  y  está    basada  en  un    cuestionario  de  evaluación   de  60  preguntas  repartidas  en  5  áreas  del  mantenimiento.  Las  respuestas  a  cada   pregunta,  como  veremos,  se  limitan  a  cinco  posibles  opciones.   Las  áreas  de   mantenimiento evaluadas son:       Recursos Gerenciales         Gerencia de la información (Software de gestión del mantenimiento).        Equipos y técnicas de mantenimiento preventivo       Planificación y ejecución       Soporte, Calidad y Motivación    El  proceso  de  aplicación  de  la  auditoría  es  a  nivel  de  personal  de  gerencia,   super visión, operaciones y mantenimiento, recomendándose pasar el cuestionario a  8   participantes, como mínimo.       El  proceso  de  cuantificación  de  las  áreas  de  mantenimiento  a  diagnosticar  se   realiza  de  la  siguiente  forma:  Las  personas  seleccionadas,  evalúan  la s  12  preguntas   desarrolladas  para  cada  área  (total:  5  áreas  /  60  preguntas)  en  función  de  una escala   del 1 al 5. Para la calificación se puntúa, de acuerdo con la siguiente escala: 1 = no se   cuenta 8muy deficiente), 2 = deficiente, 3 = regular, 4 = bueno y    5 = excelente). Cada   área  a  ser  evaluada  se  considera  con  el  mismo  nivel  de  importancia.  Las  posibles   puntuaciones máximas y mínimas a obtener son:          Puntuación máxima: por área: 60 unidades, por las 5 áreas: 300 unidades.        Puntuación mínima: por área: 12   unidades, po   mantenimiento  están  diseñadas  para   hacer  a  las  compañías  cada  vez  más  rentables  dentro  de  los  escenarios  de  alta   competitividad existentes. Las auditorías identifican de manera detallada y obje tiva el   estado  de  madurez  y  capacidad  de  una  compañía  en  el  manejo  de  sus  activos  físicos   sin importar su tamaño o su actividad económica, convirtiéndose en una ventaja y en   una  herramienta  estratégica  que  define  el  éxito  de  una  empresa.  Las  auditorias   con templan  un  amplio  conjunto  de  elementos  medibles  utilizados  para  evaluar  la   aplicación de las mejores prácticas de gestión, donde se identifican las oportunidades   de mejora y se conforma la línea base para la implementación de técnicas de soporte   de  ingeni ería  de  Mantenimiento  y  Fiabilidad.  Cualquiera  que  sea  el  objetivo  de  la   organización  deberá  auditar  su  nivel  desempeño  en  los  aspectos  claves  de  la  gestión   del mantenimiento soportado en las normas, estándares y mejores prácticas aplicadas   en la industria , que darán como resultado las acciones a seguir y los recursos óptimos   necesarios  para  desarrollarlas  acordes  a  los  objetivos  establecidos.  Este  conjunto  de   acciones  se  deben  priorizar  y  consolidar  en  un  plan  de  trabajo  enmarcado  en  el  ciclo   de  mejoramien to  continuo,  que  trae  además  de  beneficios  económicos,  un  enfoque   que permite a las organizaciones a direccionar sus esfuerzos de mejora en los aspectos   críticos del negocio (Kaplan, 1992).     En términos generales, las organizaciones en las cuales se desarr ollen auditorías   de mantenimiento deben tener en cuenta los siguientes aspectos:       Evitar sobrecargarse con iniciativas simultáneas de procesos de auditoría,  para   esto  es necesario tener bien claro los factores a evaluar (mejorar) .       Tener  presente  que  no  ha y  una  metodología  única  de  auditoría  del   mantenimiento  y  que  tratar  de    tomar  decisiones  sólo  con  una  gran  cantidad   de  datos  cuantitativos,  requiere  de  esfuerzos  muy  grandes  en  tiempo  y   recursos económicos .         Entender  el  factor  de  insensibilidad  del  proceso   de  captura  del  dato.   Normalmente, se recopilan más  datos de los que en realidad se necesitan .       Diseñar  técnicas  de  auditoría  de  mantenimiento    que  permitan  evaluar  tanto   aspectos técnicos como  económicos .       Comprender que las auditorías   cualitativas/cuanti tativas só lo reflejan parte de   la  realidad,  hasta    esto s  momentos,  no  existe  ningún  modelo  de  auditoría  que  \nInge Con     Asesoría Integral en  Inge niería de  Con fiabilidad     www.confiabilidadoperacional.com   www.ingeman.net          32    C ertif icación ICOGAM    Miami ,   Florida,   6 al   8 de Diciembre   del  2017    https://app.box.com/s/83tyjazjpuixs4fgnaenfo28nvg9v2n2    permita    simular  de  forma  perfecta,  la  complejidad  de  los  diversos  procesos   industriales.  Las  auditorías  s ó lo  ayudan  de  forma  parcial  a  disminuir  la   incertidumbre en los procesos de toma de decisiones .       Tener en cuenta, que la falta de dominio de las distintas técnicas de auditoría,   puede  conducir  a  las  organizaciones  a  que  se  abstengan  de  aprovechar   herramientas  útiles,  o  a  que    se  generen  expectativas     poco  fundadas  sob re  el   alcance de las auditorías.       El  éxito  de  la  implantación  de  un  proceso  de  auditoría  depende  en  gran  parte   del recurso humano involucrado en el desarrollo de la misma .         Finalmente,  no  se  debe  limitar  la  justificación  de  aplicación  de    las  auditorías  de   mantenimiento  a  simples    modas  pasajeras,    la  organización  debe  convertir  estas    técnicas  de  control  en  prácticas  normales  de  trabajo,  es  decir ,     en  un  proceso  de   mejora continua que ayude  a optimizar la toma de decisiones dentro del  pro ceso  de    gestión del mantenimiento.          IV.6. REFERENCIAS BIBLIOGRÁFICAS    -   Parra,  C., y Crespo,  A. 2015.  “Ingeniería de Mantenimiento y Fiabilidad Aplicada   en la Gestión de Activos. Desarrollo y aplicación práctica de un Modelo de Gestión   del Mantenimie nto (MGM)” . Segunda Edición. Editado por INGEMAN, Escuela   Superior de Ingenieros Industriales,  Sevilla,  España    -   Crespo  Márquez  A,  2007.  The  maintenance  management  framework.  Models  and   methods for complex systems maintenance.  London: Springer Verlag.     -   Gon zález   Javier,   2004.  Auditoría del Mantenimiento e Indicadores d e Gestión .    Fundación  Confemetal, Madrid, España.    -   Kaplan RS,  Norton DP , 1992.  The Balanced Scorecard  -   measures that drive   performance .  Harvard Business Review , 70(1): 71 - 9.     -   Parra  C    y  Omaña   C, 2001.  Ponencia: Técnica cualitativa de Auditoria de la Gestión   de  Mantenimiento  para  el  sector  Refinación .   VII  Congreso  de  Ingeniería  de   Mantenimiento de Petróleos de Venezuela , Caracas, Venezuela.    -   Parra  C,   2008.  Implantación piloto de la Auditoría ME S: Maintenance Effectiveness   Survey, en el Campo Petrolero Guando   -   Empresas  PETROBAS.  Informe técnico    INGECON : SN - 08 - 10 - COL, Bogotá, Colombia.    -   Woodhouse J, 1996.   Managing Industrial Risk .   Chapman Hill Inc, London.    -   Internet:     MES  (Maintenance  Effectiveness     Survey),  referencia:  Marshall  Institute,   http://www.marshallinstitute.com/    -   Internet:  ABS  –   Reliability  and  Risk  Group  JBFA  Training,  Curso:  Reliability    Management,   http://www.absconsulting.com/reliability - and - maintenance -  management.cfm               \nInge Con     Asesoría Integral en  Inge niería de  Con fiabilidad     www.confiabilidadoperacional.com   www.ingeman.net       33    C ertif icación ICOGAM    Miami , Florida,   6 al   8 de Diciembre   del  2 017    https://app.box.com/s/83tyjazjpuixs4fgnaenfo28nvg9v2n2  Autor correspondiente:     function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }
    function rgbToHex(r, g, b) {
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
        return '#' + toHex(r) + toHex(g) + toHex(b);
    }
    function mixColors(colorA, colorB, amount) {
        const a = hexToRgb(colorA);
        const b = hexToRgb(colorB);
        return rgbToHex(a.r + (b.r - a.r) * amount, a.g + (b.g - a.g) * amount, a.b + (b.b - a.b) * amount);
    }
    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);
    }
    function getReadableTextColor(bgColor) { return getLuminance(bgColor) > 0.56 ? '#111827' : '#f8fafc'; }
    function generatePalette() {
        const hue = Math.floor(Math.random() * 360);
        const bg = hslToHex(hue, 45 + Math.floor(Math.random() * 20), 16 + Math.floor(Math.random() * 70));
        const text = getReadableTextColor(bg);
        const isDark = getLuminance(bg) < 0.5;
        const accent = hslToHex((hue + 35 + Math.floor(Math.random() * 60)) % 360, 80, isDark ? 55 : 45);
        const card = isDark ? mixColors(bg, '#ffffff', 0.08) : mixColors(bg, '#000000', 0.05);
        const border = isDark ? mixColors(card, '#ffffff', 0.18) : mixColors(card, '#000000', 0.12);
        const input = isDark ? mixColors(card, '#ffffff', 0.07) : mixColors(card, '#000000', 0.04);
        const inputBorder = isDark ? mixColors(border, '#ffffff', 0.12) : mixColors(border, '#000000', 0.1);
        const botBg = isDark ? mixColors(bg, '#ffffff', 0.12) : mixColors(bg, '#000000', 0.06);
        return {
            bgColor: bg,
            textColor: text,
            cardBgColor: card,
            cardBorderColor: border,
            inputBgColor: input,
            inputBorderColor: inputBorder,
            chatBubbleBotBg: botBg,
            chatBubbleBotText: text,
            chatBubbleUserBg: accent,
            chatBubbleUserText: getReadableTextColor(accent),
            primaryColor: accent,
            secondaryColor: isDark ? mixColors(accent, '#ffffff', 0.2) : mixColors(accent, '#000000', 0.2),
            headerBorderColor: border,
            systemMessageBg: isDark ? mixColors(bg, '#fde68a', 0.2) : mixColors(bg, '#fde68a', 0.28),
            systemMessageText: isDark ? '#fef3c7' : '#78350f'
        };
    }
    function buildThemePalette(theme, palette) {
        const base = palette || {
            primaryColor: '#2563eb',
            secondaryColor: '#6b7280',
            bgColor: '#ffffff',
            textColor: '#1f2937',
            cardBgColor: '#ffffff',
            cardBorderColor: '#d1d5db',
            inputBgColor: '#ffffff',
            inputBorderColor: '#cbd5e1',
            chatBubbleBotBg: '#f3f4f6',
            chatBubbleBotText: '#1f2937',
            chatBubbleUserBg: '#2563eb',
            chatBubbleUserText: '#ffffff',
            headerBorderColor: '#e5e7eb',
            systemMessageBg: '#fef3c7',
            systemMessageText: '#92400e'
        };
        const isDark = theme === 'dark';
        const bgColor = isDark ? mixColors(base.bgColor || '#ffffff', '#000000', 0.72) : '#ffffff';
        const textColor = getReadableTextColor(bgColor);
        const cardBgColor = isDark ? mixColors(bgColor, '#ffffff', 0.08) : '#ffffff';
        const cardBorderColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.16) : '#d1d5db';
        const inputBgColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.06) : '#ffffff';
        const inputBorderColor = isDark ? mixColors(cardBorderColor, '#ffffff', 0.12) : '#cbd5e1';
        const chatBubbleBotBg = isDark ? mixColors(bgColor, '#ffffff', 0.12) : '#f3f4f6';
        const chatBubbleBotText = textColor;
        const headerBorderColor = cardBorderColor;
        const systemMessageBg = isDark ? mixColors(bgColor, '#fde68a', 0.2) : '#fef3c7';
        const systemMessageText = isDark ? '#fef3c7' : '#92400e';
        return {
            ...base,
            bgColor,
            textColor,
            cardBgColor,
            cardBorderColor,
            inputBgColor,
            inputBorderColor,
            chatBubbleBotBg,
            chatBubbleBotText,
            headerBorderColor,
            systemMessageBg,
            systemMessageText
        };
    }
    function setPaletteVariables(target, palette) {
        if (!palette) return;
        target.style.setProperty('--primary', palette.primaryColor || '#007bff');
        target.style.setProperty('--secondary', palette.secondaryColor || '#6c757d');
        target.style.setProperty('--bg', palette.bgColor || '#f8f9fa');

        target.style.setProperty('--card', palette.cardBgColor || '#ffffff');

        target.style.setProperty('--input', palette.inputBgColor || '#ffffff');
        target.style.setProperty('--iborder', palette.inputBorderColor || '#cccccc');
        target.style.setProperty('--bot-bg', palette.chatBubbleBotBg || '#e9ecef');
        target.style.setProperty('--bot-text', palette.chatBubbleBotText || '#343a40');
        target.style.setProperty('--user-bg', palette.chatBubbleUserBg || '#007bff');

        target.style.setProperty('--sys-bg', palette.systemMessageBg || '#fff3cd');
        target.style.setProperty('--sys-text', palette.systemMessageText || '#856404');
    }

    pdf2Upload.addEventListener('change', async (ev) => {
        const file = ev.target.files[0]; if (!file) return;
        if (!(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) {
            pdf2StatusDisplay.textContent = 'No es un PDF válido.'; pdf2StatusDisplay.style.color = 'var(--danger)'; return;
        }
        pdf2Name = file.name; pdf2NameDisplay.textContent = file.name;
        pdf2StatusDisplay.textContent = 'Procesando...'; pdf2StatusDisplay.style.color = 'var(--warning)';
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(e.target.result) }).promise;
                let text = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const tc = await page.getTextContent();
                    tc.items.forEach(item => text += item.str + ' ');
                    text += '\n';
                }
                pdf2Text = text;
                pdf2StatusDisplay.textContent = '"' + pdf2Name + '" cargado.'; pdf2StatusDisplay.style.color = 'var(--success)';
                addMsg('Segundo documento "' + pdf2Name + '" listo.', 'system');
            } catch(err) { pdf2StatusDisplay.textContent = 'Error al procesar.'; pdf2StatusDisplay.style.color = 'var(--danger)'; pdf2Text = ''; }
        };
        reader.readAsArrayBuffer(file);
    });

        if (sender.includes('error')) el.classList.add('error');
        if (sender === 'bot' && !isThinking) {
            const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
            const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;">' + html + '</div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else if (sender === 'bot') {

            el.id = 'thinking-msg';
        } else if (sender === 'user') {
            const userAvatarUrl = getAvatarUrl('user');

    function updateLastMsg(message) {
        const el = document.getElementById('thinking-msg');
        const botAvatarUrl = getAvatarUrl('bot');
        const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
        const html = marked.parse ? marked.parse(processedMessage) : processedMessage;

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }

    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
</body>
</html>
