<script>
    const PDF_TEXT = "Departamento Administrativo de la Función Pública  Decreto 1860 de 2021   1   EVA - Gestor Normativo  Decreto 1860 de 2021  Los datos publicados tienen propósitos exclusivamente informativos. El Departamento Administrativo de la Función Pública no se  hace responsable de la vigencia de la presente norma. Nos encontramos en un proceso permanente de actualización de los  contenidos.  DECRETO 1860 DE 2021     (Diciembre 24)     \"Por el cual se modifica y adiciona el Decreto  1082  de 2015, Único Reglamentario del Sector Administrativo de Planeación Nacional, con el  fin reglamentar los artículos  30 ,  31 ,  32 ,  34  y  35  de la Ley 2069 de 2020, en lo relativo al sistema de compras públicas y se dictan otras  disposiciones\"     EL PRESIDENTE DE LA REPÚBLICA DE COLOMBIA     En ejercicio de sus atribuciones constitucionales y legales, en particular las que le confiere el numeral 11 del artículo 189 de la Constitución  Política y en desarrollo tanto de los artículos 30, 31, 32, 34 y 35 de la Ley 2069 de 2020, como de la Ley  1150  de 2007, y     CONSIDERANDO     Que la Ley 2069 de 2020, \"Por medio de la cual se impulsa el emprendimiento en Colombia”, establece un marco regulatorio que propicia el  emprendimiento, crecimiento, consolidación y sostenibilidad de las empresas, con el fin de aumentar el bienestar social y generar equidad.     Que conforme a su exposición de motivos, la Ley de Emprendimiento  \"(...) propone facilitar el acceso de las Mipymes a la modalidad de  contratación de mínima cuantía, la limitación de estos procesos a Mipymes, define la posibilidad de establecer criterios diferenciales a favor  de las Mipymes en los procesos de contratación pública, amplía el ámbito de aplicación de las medidas de compras públicas a entidades  que hoy están excluidas, establece la creación de un sistema de información e indicadores para evaluar la efectividad de las medidas  adoptadas y define la inclusión de factores de desempate en los procesos de contratación pública que priorizan este segmento\".     Que en desarrollo de lo anterior, el Capítulo III de la Ley 2069 de 2020, entre otras medidas, crea una serie de incentivos para las Mipyme, y  los emprendimientos y empresas de mujeres interesados en celebrar contratos con el Estado, así como para el fomento en la ejecución de  contratos de la provisión de bienes y servicios por parte de sujetos de especial protección constitucional.     Que el parágrafo 1 del artículo 30 de la Ley 2069 de 2020 dispone que el Gobierno nacional definirá las particularidades del procedimiento  de mínima cuantía, así como la posibilidad que tengan las entidades de realizar estas adquisiciones a Mipyme o establecimientos que  correspondan a la definición de \"gran almacén\" señalada por la Superintendencia de Industria y Comercio. En virtud de lo anterior, es  indispensable reglamentar nuevamente las particularidades de esta modalidad de selección y se hace necesario modificar los artículos  2.2.1.2.1.5.1 al 2.2.1.2.1.5.4 del Decreto 1082 de 2015, Único Reglamentario del Sector Administrativo de Planeación Nacional.     Que a partir de lo establecido en la Ley 2069 de 2020 para la promoción del acceso de las Mipyme al mercado de compras públicas, se  propone crear un catálogo de bienes y servicios ofertados por Mipyme, de manera similar al catálogo de grandes almacenes existente en la  Tienda Virtual del Estado Colombiano, el cual es utilizado incluso por Entidades Estatales de régimen especial.    \nDepartamento Administrativo de la Función Pública  Decreto 1860 de 2021   2   EVA - Gestor Normativo  Que adicionalmente, los artículos 31 y 32 de la Ley 2069 de 2020 ordenan al Gobierno nacional expedir un reglamento para definir los  requisitos diferenciales y los puntajes adicionales para promover y facilitar el acceso de las Mipyme al sistema de compra pública, así como  el concepto de  \"emprendimientos y empresas de mujeres\".     Que el artículo 12 de la Ley 1150 de 2007, modificado por el artículo 34 de la Ley 2069 de 2020, dispone que el Gobierno nacional definirá  las condiciones y los montos para la adopción de convocatorias limitadas a Mipyme, en las que, previo a la resolución de apertura del  proceso respectivo, se haya manifestado el interés de por lo menos dos (2) Mipyme.     Que el inciso cuarto del referido artículo 34 requiere reglamentación para definir, a través de los pliegos de condiciones, mecanismos que  fomenten en la ejecución de los contratos estatales la provisión de bienes y servicios por población en pobreza extrema, desplazados por la  violencia, personas en proceso de reintegración o reincorporación y sujetos de especial protección constitucional.     Que el artículo 35 de la Ley 2069 de 2020 define un nuevo marco jurídico en relación con los criterios de desempate previstos en los  Procesos de Contratación realizados con cargo a recursos públicos, los Procesos de Contratación realizados por las Entidades Estatales  indistintamente de su régimen de contratación, así como los Procesos de Contratación adelantados por patrimonios autónomos constituidos  por Entidades Estatales. Al respecto, es necesario reglamentar la forma de acreditar las circunstancias a las que se refiere cada uno de los  numerales del citado artículo, permitiendo la debida aplicación de los factores de desempate previstos para garantizar la selección objetiva  de los contratistas.     Que el inciso segundo del artículo 2.2.1.2.3.1.9. del Decreto 1082 de 2015 prevé que la garantía de seriedad de la oferta que presenten los  proponentes en el Proceso de Contratación de un Acuerdo Marco de Precios debe ser de mil (1.000) SNIMLV, el cual resulta  proporcionalmente mayor para las Mipyme que para las grandes empresas, generando así, un obstáculo procedimental que limita el acceso  de las Mipyme al sistema de compra pública, razón por la cual, es necesario que se defina un valor diferencial en función del tamaño  empresarial, o la condición de emprendimientos o empresas de mujeres.     Que para el debido cumplimiento de la Ley 2069 de 2020, se requiere modificar el Decreto 1082 de 2015, Único Reglamentario del Sector  Administrativo de Planeación Nacional, incorporando una regulación detallada de las normas anteriormente citadas para la efectiva  aplicación de la Ley de Emprendimiento en el sistema de compras y contratación pública.     Que en virtud de lo dispuesto en el artículo 7 de la Ley 1340 de 2009, \"Por medio de la cual se dictan normas en materia de protección de la  competencia\", modificado por el artículo 146 de la Ley 1955 de 2019,  \"Por la cual se expide el Plan Nacional de Desarrollo 2018-2022 \"Pacto  por Colombia, pacto por la equidad\"' , se solicitó concepto previo sobre abogacía de la competencia a la Superintendencia de Industria y  Comercio, entidad que mediante oficio con radicado No. 21-437430-3-0 del 17 de noviembre de 2021, se pronunció sobre el proyecto de  reglamentación realizando algunas recomendaciones.     Que se acogieron gran parte de las recomendaciones de la Superintendencia de Industria y Comercio, como se hace explícito en la memoria  justificativa, donde se analizó cada una de ellas. No obstante, solo se acogió parcialmente la observación de establecer criterios objetivos  para regular la limitación de los Procesos de Contratación pública a las Mipyme, en el entendido de adicionar a los requisitos la validación de  la capacidad jurídica para ejecutar el contrato tratándose de personas jurídicas, pues los demás aspectos solo pueden verificarse en la  evaluación de las ofertas. Adicionalmente, no se acogió la sugerencia de eliminar la expresión \"condiciones más exigentes\" de los artículos  2.2.1.2.4.2.15 y 2.2.1.2.4.2.18 del presente Decreto, teniendo en cuenta que ello materializa el mandato de trato diferencial consagrado en  los artículos 31 y 32 de la Ley 2069 de 2020.     Que de conformidad con lo previsto en el artículo 8 de la Ley 1437 de 2011 y en el artículo 2.1.2.1.14 del Decreto 1081 de 2015, modificado  por el artículo 2 del Decreto 1273 de 2020, las normas de que trata el presente Decreto fueron publicadas en la página web del  Departamento Nacional de Planeación del 30 de junio al 15 de julio de 2021 y entre el 24 septiembre y el 1 de octubre de 2021, para  comentarios de la ciudadanía y grupos de interés.     Que en mérito de lo expuesto,     DECRETA \nDepartamento Administrativo de la Función Pública  Decreto 1860 de 2021   3   EVA - Gestor Normativo     ARTÍCULO    1. Objeto.  El presente Decreto tiene como propósito reglamentar los artículos  30 ,  31 ,  32 , 34  y  35  de la Ley 2069 de 2020, en  relación con: el procedimiento de mínima cuantía, incluyendo disposiciones particulares que se refieren a la contratación con Mipyme y  grandes almacenes; los criterios diferenciales para Mipyme, y la definición y los criterios diferenciales para los emprendimientos y empresas  de mujeres; las convocatorias limitadas a Mipyme; el fomento a la ejecución de contratos estatales por parte de población en pobreza  extrema, desplazados por la violencia, personas en proceso de reintegración o reincorporación y, sujetos de especial protección  constitucional; así como la acreditación de los factores de desempate previstos en la Ley de Emprendimiento.     ARTÍCULO    2. Modificación de la Subsección  5  de la Sección 1 del Capítulo 2 del Título 1 de la Parte 2 del Libro 2 del Decreto 1082 de 2015.  Modifíquese la Subsección 5 de la Sección 1 del Capítulo 2 del Título 1 de la Parte 2 del Libro 2 del Decreto 1082 de 2015, la cual quedará  de la siguiente manera:     \"SUBSECCIÓN 5     MINIMA CUANTIA     ARTÍCULO 2.2.1.2.1.5.1. Estudios previos para la contratación de mínima cuantía.  La Entidad Estatal debe elaborar unos estudios previos  que deben contener, como mínimo, lo siguiente:     1. La descripción de la necesidad que pretende satisfacer con la contratación.     2. La descripción del objeto a contratar identificado con el cuarto nivel del Clasificador de Bienes y Servicios, de ser posible, o de lo contrario  con el tercer nivel.     3. Las condiciones técnicas exigidas.     4. El valor estimado del contrato y su justificación.     5. El plazo de ejecución del contrato.     6. El certificado de disponibilidad presupuestal que respalda la contratación.     ARTÍCULO 2.2.1.2.1.5.2. Procedimiento para la contratación de mínima cuantía.  Las siguientes reglas son aplicables a la contratación cuyo  valor no excede del diez por ciento (10%) de la menor cuantía de la Entidad Estatal, independientemente de su objeto:     1. La Entidad Estatal debe señalar en la invitación a participar en procesos de mínima cuantía la información a la que se refieren los  numerales 2, 3 y 4 del artículo anterior, y la forma como el interesado debe acreditar su capacidad jurídica y la experiencia mínima, si se  exige esta última, el cumplimiento de las condiciones técnicas exigidas, incluyendo las obligaciones de las partes del futuro contrato.     2. La Entidad Estatal podrá exigir una capacidad financiera mínima cuando no hace el pago contra entrega a satisfacción de los bienes,  obras o servicios. Si la Entidad Estatal exige capacidad financiera debe indicar cómo hará la verificación correspondiente en la invitación.     3. La invitación se publicará por un término no inferior a un (1) día hábil para que los interesados se informen de su contenido y formulen  observaciones o comentarios, los cuales serán contestados por la Entidad Estatal antes del inicio del plazo para presentar ofertas. De  conformidad con el parágrafo del presente artículo, dentro del mismo término para formular observaciones se podrán presentar las  solicitudes para limitar la convocatoria a Mipyme colombianas. \nDepartamento Administrativo de la Función Pública  Decreto 1860 de 2021   4   EVA - Gestor Normativo     4. La Entidad Estatal incluirá un cronograma en la invitación que deberá tener en cuenta los términos mínimos establecidos en este artículo.  Además de lo anterior, en el cronograma se establecerá: i) el término dentro del cual la Entidad Estatal responderá las observaciones de  que trata el numeral anterior. ii) El término hasta el cual podrá expedir adendas para modificar la invitación, el cual, en todo caso, tendrá  como límite un día hábil antes a la fecha y hora prevista para la presentación de ofertas de que trata el último plazo de este numeral, sin  perjuicio que con posterioridad a este momento pueda expedir adendas para modificar el cronograma del proceso; en todo caso, las  adendas se publicarán en el horario establecido en el artículo 2.2.1.1.2.2.1. del Decreto 1082 de 2015. iii) El momento en que publicará un  aviso en el SECOP precisando si el proceso efectivamente se limitó a Mipyme o si podrá participar cualquier otro interesado. iv) Finalmente,  se dispondrá un término adicional dentro del cual los proponentes podrán presentar sus ofertas, el cual será de mínimo un (1) día hábil  luego de publicado el aviso en que se informe si el proceso se limita o no a Mipyme.     5. La Entidad Estatal debe revisar las ofertas económicas y verificar que la de menor precio cumple con las condiciones de la invitación. Si  esta no cumple, la Entidad Estatal debe verificar el cumplimento de los requisitos de la invitación de la oferta con el segundo mejor precio, y  así sucesivamente. Lo anterior sin perjuicio de la oportunidad que deberán otorgar las Entidades Estatales para subsanar las ofertas, en los  términos del artículo  5  de la Ley 1150 de 2007, para lo cual establecerán un término preclusivo en la invitación para recibir los documentos  subsanables, frente a cada uno de los requerimientos. En caso de que no se establezca este término, los proponentes podrán subsanar sus  ofertas hasta antes de que finalice el traslado del informe de evaluación.     6. La Entidad Estatal debe publicar el informe de evaluación durante mínimo un (1) día hábil, para que durante este término los oferentes  presenten las observaciones que deberán ser respondidas por la Entidad Estatal antes de realizar la aceptación de la oferta seleccionada.     7. La Entidad Estatal debe aceptar la oferta de menor precio, siempre que cumpla con las condiciones establecidas en la invitación a  participar en procesos de mínima cuantía. En la aceptación de la oferta, la Entidad Estatal debe informar al contratista el nombre del  supervisor o interventor del contrato.     8. En caso de empate, la Entidad Estatal aplicará los criterios de que trata el artículo  35  de la Ley 2069 de 2020, conforme a los medíos de  acreditación del artículo 2.2.1.2.4.2.17. del presente Decreto o las normas que los modifiquen, adicionen o sustituyan.     9. La oferta y su aceptación constituyen el contrato estatal.     PARÁGRAFO.  De conformidad con el parágrafo  1  del artículo  30  y el artículo  34  de la Ley 2069 de 2020, en estos procedimientos de  selección para Mipyme se aplicará lo prescrito en los artículos 2.2.1.2.4.2.2 a 2.2.1.2.4.2.4 de este Decreto. No obstante, de conformidad  con el numeral 3 del presente artículo, las solicitudes para limitar el proceso a Mipyme se recibirán durante el término previsto en dicho  numeral. Además, en el aviso de que trata el numeral 4 de este artículo se indicará si en el proceso aplican las limitaciones territoriales de  que trata el artículo 2.2.1.2.4.2.3 o si podrá participar cualquier Mipyme nacional.     ARTÍCULO 2.2.1.2.1.5.3. Adquisiciones en grandes almacenes cuando se trate de mínima cuantía.  Las Entidades Estatales deben aplicar las  siguientes reglas cuando decidan adquirir bienes hasta por el monto de su mínima cuantía en establecimientos que correspondan a la  definición de \"gran almacén\" señalada por la Superintendencia de Industria y Comercio:     1. La invitación debe estar dirigida a los grandes almacenes. Esta invitación deberá publicarse en el SECOP y en la página web de la  entidad, y contendrá como mínimo: a) la descripción técnica, detallada y completa del bien, identificado con el cuarto nivel del Clasificador  de Bienes y Servicios, de ser posible, o de lo contrario con el tercer nivel; b) la forma de pago; c) el lugar de entrega; d) el plazo para la  entrega de la cotización que debe ser de mínimo un (1) día hábil; e) la forma y el lugar de presentación de la cotización, y f) la  disponibilidad presupuestal.     2. La Entidad Estatal debe evaluar las cotizaciones presentadas y seleccionar a quien, con las condiciones requeridas, ofrezca el menor  precio del mercado y aceptar la mejor oferta.     3. En caso de empate, la Entidad Estatal aplicará los criterios de desempate de que trata el artículo  35  de la Ley 2069 de 2020, conforme a  los medios de acreditación del artículo 2.2.1.2.4.2.17 del presente Decreto o las normas que los modifiquen, adicionen o sustituyan. \nDepartamento Administrativo de la Función Pública  Decreto 1860 de 2021   5   EVA - Gestor Normativo     4. La oferta y su aceptación constituyen el contrato estatal.     ARTÍCULO 2.2.1.2.1.5.4. Instrumentos de agregación de demanda en la Tienda Virtual del Estado Colombiano para adquisiciones hasta el  monto de la mínima cuantía con Mipyme y con grandes almacenes.  La Agencia Nacional de Contratación Pública - Colombia Compra  Eficiente definirá en un plazo no mayor a tres (3) meses contados a partir de la publicación de este Decreto, las reglas para la creación y  utilización de los catálogos de bienes o servicios derivados de instrumentos de agregación de demanda con Mipyme, así como con grandes  almacenes, en la Tienda Virtual del Estado Colombiano, a los cuales podrán acudir las Entidades Estatales para celebrar contratos hasta por  el monto de la mínima cuantía.     PARÁGRAFO.  Las Entidades Estatales con régimen especial de contratación podrán realizar compras en los catálogos de la Tienda Virtual del  Estado Colombiano, de acuerdo con lo que establezcan en su Manual de Contratación.     ARTÍCULO 2.2.1.2.1.5.5. Garantías.  La Entidad Estatal es libre de exigir o no garantías en el proceso de selección de mínima cuantía y en la  adquisición de \"grandes almacenes\".     ARTÍCULO    3. Adición de los artículos  2.2.1.2.4.2.14 ,  2.2.1.2.4.2.15 ,  2.2.1.2.4.2.16 ,  2.2.1.2.4.2.17  y  2.2.1.2.4.2.18  a la Subsección 2 de la  Sección 4 del Capítulo 2 del Título 1 de la Parte 2 del Libro 2 del Decreto 1082 de 2015.  Adiciónense los artículos 2.2.1.2.4.2.14,  2.2.1.2.4.2.15, 2.2.1.2.4.2.16, 2.2.1.2.4.2.17 y 2.2.1.2.4.2.18 a la Subsección 2 de la Sección 4 del Capítulo 2 del Título 1 de la Parte 2 del  Libro 2 del Decreto 1082 de 2015, los cuales quedarán así:     \"ARTÍCULO 2.2.1.2.4.2.14. Definición de emprendimientos y empresas de mujeres.  Con el propósito de adoptar medidas afirmativas que  incentiven la participación de las mujeres en el sistema de compras públicas, se entenderán como emprendimientos y empresas de mujeres  aquellas que cumplan con alguna de las siguientes condiciones:     1. Cuando más del cincuenta por ciento (50%) de las acciones, partes de interés o cuotas de participación de la persona jurídica  pertenezcan a mujeres y los derechos de propiedad hayan pertenecido a estas durante al menos el último año anterior a la fecha de cierre  del Proceso de Selección. Esta circunstancia se acreditará mediante certificación expedida por el representante legal y el revisor fiscal,  cuando exista de acuerdo con los requerimientos de ley, o el contador, donde conste la distribución de los derechos en la sociedad y el  tiempo en el que las mujeres han mantenido su participación.     2. Cuando por lo menos el cincuenta por ciento (50%) de los empleos del nivel directivo de la persona jurídica sean ejercidos por mujeres y  éstas hayan estado vinculadas laboralmente a la empresa durante al menos el último año anterior a la fecha de cierre del Proceso de  Selección en el mismo cargo u otro del mismo nivel.     Se entenderá como empleos del nivel directivo aquellos cuyas funciones están relacionadas con la dirección de áreas misionales de la  empresa y la toma de decisiones a nivel estratégico. En este sentido, serán cargos de nivel directivo los que dentro de la organización de la  empresa se encuentran ubicados en un nivel de mando o los que por su jerarquía desempeñan cargos encaminados al cumplimiento de  funciones orientadas a representar al empleador.     Esta circunstancia se acreditará mediante certificación expedida por el representante legal y el revisor fiscal, cuando exista de acuerdo con  los requerimientos de ley, o el contador, donde se señale de manera detallada todas las personas que conforman los cargos de nivel  directivo del proponente, el número de mujeres y el tiempo de vinculación.     La certificación deberá relacionar el nombre completo y el número de documento de identidad de cada una de las personas que conforman  el nivel directivo del proponente. Como soporte, se anexará copia de los respectivos documentos de identidad, copia de los contratos de  trabajo o certificación laboral con las funciones, así como el certificado de aportes a seguridad social del último año en el que se  demuestren los pagos realizados por el empleador.     3. Cuando la persona natural sea una mujer y haya ejercido actividades comerciales a través de un establecimiento de comercio durante al \nDepartamento Administrativo de la Función Pública  Decreto 1860 de 2021   6   EVA - Gestor Normativo  menos el último año anterior a la fecha de cierre del proceso de selección. Esta circunstancia se acreditará mediante la copia de cédula de  ciudadanía, la cédula de extranjería o el pasaporte, así como la copia del registro mercantil.     4. Para las asociaciones y cooperativas, cuando más del cincuenta por ciento (50%) de los asociados sean mujeres y la participación haya  correspondido a estas durante al menos el último año anterior a la fecha de cierre del Proceso de Selección. Esta circunstancia se acreditará  mediante certificación expedida por el representante legal.     PARÁGRAFO.  Respecto a los incentivos contractuales para los emprendimientos y empresas de mujeres, las certificaciones de trata el  presente artículo deben expedirse bajo la gravedad de juramento con una fecha de máximo treinta (30) días calendario anteriores a la  prevista para el cierre del procedimiento de selección.     ARTÍCULO 2.2.1.2.4.2.15. Criterios diferenciales para emprendimientos y empresas de mujeres en el sistema de compras públicas.  En los  procesos de licitación pública, selección abreviada de menor cuantía y concurso de méritos, así como en los procesos competitivos que  adelanten las Entidades Estatales no sometidas al Estatuto General de Contratación de la Administración Pública, las Entidades incluirán  condiciones habilitantes para incentivar los emprendimientos y empresas de mujeres con domicilio en el territorio nacional. Para el efecto,  los Documentos del Proceso deberán incorporar requisitos habilitantes diferenciales relacionados con alguno o algunos de los siguientes  aspectos:     1. Tiempo de experiencia.     2. Número de contratos para la acreditación de la experiencia.     3. Índices de capacidad financiera.     4. Índices de capacidad organizacional.     5. Valor de la garantía de seriedad de la oferta.     Los requisitos mencionados deberán fijarse respetando las condiciones habilitantes requeridas para el cumplimiento adecuado del contrato,  teniendo en cuenta el alcance de las obligaciones. En desarrollo de lo anterior, con la finalidad de beneficiar a las empresas y  emprendimientos de mujeres, se establecerán condiciones más exigentes respecto a alguno o algunos de los criterios de participación antes  enunciados frente a los demás proponentes que concurran al procedimiento de selección que no sean empresas o emprendimientos de  mujeres.     De manera que no se ponga en riesgo el cumplimiento adecuado del objeto contractual, con excepción de los procedimientos donde el  menor precio ofrecido sea el único factor de evaluación, las Entidades también otorgarán un puntaje adicional de hasta el cero punto  veinticinco por ciento (0.25%) del valor total de los puntos establecidos en los pliegos de condiciones o documentos equivalentes, a los  proponentes que acrediten alguno de los supuestos del artículo 2.2.1.2.4.2.14 del presente Decreto.     Las Entidades incluirán estos requisitos diferenciales y puntajes adicionales de acuerdo con los resultados del análisis del sector, desde la  perspectiva del estudio de la oferta de las obras, bienes o servicios que requiere, sin perjuicio de los compromisos adquiridos por Colombia  en los Acuerdos Comerciales vigentes.     PARÁGRAFO 1.  Tratándose de proponentes plurales, los criterios diferenciales y los puntajes adicionales solo se aplicarán si por lo menos  uno de los integrantes acredita que es emprendimiento y empresa de mujeres bajo los criterios dispuestos en el artículo precedente y que  tiene una participación igual o superior al diez por ciento (10%) en el consorcio o la unión temporal.     PARÁGRAFO 2.  Los incentivos contractuales para las empresas y emprendimientos de mujeres no excluyen la aplicación de los criterios \nDepartamento Administrativo de la Función Pública  Decreto 1860 de 2021   7   EVA - Gestor Normativo  diferenciales para Mipyme en el sistema de compras públicas.     ARTÍCULO 2.2.1.2.4.2.16. Fomento a la ejecución de contratos estatales por parte de población en pobreza extrema, desplazados por la  violencia, personas en proceso de reintegración o reincorporación y sujetos de especial protección constitucional.  En los Procesos de  Contratación, las Entidades Estatales indistintamente de su régimen de contratación, los patrimonios autónomos constituidos por Entidades  Estatales y los particulares que ejecuten recursos públicos fomentarán en los pliegos de condiciones o documento equivalente que los  contratistas destinen al cumplimiento del objeto contractual la provisión de bienes o servicios por parte de población en pobreza extrema,  desplazados por la violencia, personas en proceso de reintegración o reincorporación y sujetos de especial protección constitucional,  garantizando las condiciones de calidad y sin perjuicio de los Acuerdos Comerciales vigentes.     La participación de los sujetos anteriormente mencionados en la ejecución del contrato se fomentará previo análisis de su oportunidad y  conveniencia en los Documentos del Proceso, teniendo en cuenta el objeto contractual y el alcance de las obligaciones.     Esta provisión se establecerá en un porcentaje que no será superior al diez por ciento (10%) ni inferior al cinco por ciento (5%) de los bienes  o servicios requeridos para la ejecución del contrato, de manera que no se ponga en riesgo su cumplimiento adecuado.     Previo análisis de oportunidad y conveniencia, la Entidad Estatal incorporará esta obligación en la minuta del contrato del pliego de  condiciones o documento equivalente, precisando las sanciones pecuniarias producto del incumplimiento injustificado de esta a través de  las causales de multa que estime pertinentes.     El supervisor o el interventor, según el caso, realizará el seguimiento y verificará que las personas vinculadas al inicio y durante la ejecución  del contrato pertenezcan a los grupos poblacionales enunciados anteriormente.     PARÁGRAFO 1.  Para los efectos previstos en el presente artículo, los sujetos de especial protección constitucional son aquellas personas que  debido a su particular condición física, psicológica o social merecen una acción positiva estatal para efectos de lograr una igualdad real y  efectiva. Dentro de esta categoría se encuentran, entre otros, las víctimas del conflicto armado interno, las mujeres cabeza de familia, los  adultos mayores, las personas en condición de discapacidad, así como la población de las comunidades indígena, negra, afrocolombiana,  raizal, palanquera, Rrom o gitanas.     Estas circunstancias se acreditarán en las condiciones que disponga la ley o el reglamento, aplicando en lo pertinente lo definido en el  artículo 2.2.1.2.4.2.17 del presente Decreto. En ausencia de una condición especial prevista en la normativa vigente, se acreditarán en los  términos que defina el pliego de condiciones o documento equivalente.     PARÁGRAFO 2.  Para efectos de los Procesos de Contratación regidos por documentos tipo, con sujeción a la potestad prevista en este  artículo, la Agencia Nacional de Contratación Pública - Colombia Compra Eficiente regulará el porcentaje de sujetos de especial protección  constitucional que el contratista destinará al cumplimiento de las obligaciones, las condiciones para incorporarlos a la ejecución del contrato  y las sanciones pecuniarias producto del incumplimiento injustificado de la obligación.     ARTÍCULO 2.2.1.2.4.2.17. Factores de desempate y acreditación . En caso de empate en el puntaje total de dos o más ofertas en los Procesos  de Contratación realizados con cargo a recursos públicos, en los Procesos de Contratación realizados por las Entidades Estatales  indistintamente de su régimen de contratación, así como los celebrados por los Procesos de Contratación de los patrimonios autónomos  constituidos por Entidades Estatales, el contratante deberá utilizar las siguientes reglas de forma sucesiva y excluyente para seleccionar al  oferente favorecido, respetando en todo caso las obligaciones contenidas en los Acuerdos Comerciales vigentes, especialmente en materia  de trato nacional.     1. Preferir la oferta de bienes o servicios nacionales frente a la oferta de bienes o servicios extranjeros. Para acreditar este factor de  desempate se tendrán en cuenta las definiciones de que trata el artículo 2.2.1.1.1.3.1., en concordancia con el artículo 2.2.1.2.4.2.9. del  Decreto 1082 de 2015, Único Reglamentario del Sector Administrativo de Planeación Nacional, que trata del puntaje para la promoción de la  industria nacional en los Procesos de Contratación de servicios. Para estos efectos, incluso se aplicará el inciso tercero de la definición de  Servicios Nacionales establecida en el artículo 2.2.1.1.1.3.1., citado anteriormente.    \nDepartamento Administrativo de la Función Pública  Decreto 1860 de 2021   8   EVA - Gestor Normativo  En este sentido, en los procesos en los que aplique el puntaje previsto en el inciso 1 del artículo  2  de la Ley 816 de 2003, el requisito se  cumplirá en los mismos términos establecidos en los artículos indicados en el inciso anterior. Por tanto, este criterio de desempate se  acreditará con los mismos documentos que se presenten para obtener dicho puntaje.     En similares términos, en los procesos en que no aplique el referido puntaje, la Entidad Estatal deberá definir en el pliego de condiciones,  invitación o documento equivalente, las condiciones y los documentos con los que se acreditará el origen nacional del bien o servicio a  efectos aplicar este factor, los cuales, en todo caso, deberán cumplir con los elementos de la noción de Servicio Nacional establecida en el  artículo 2.2.1.1.1.3.1 del Decreto 1082 de 2015, Único Reglamentario del Sector Administrativo de Planeación Nacional y observando los  mismos lineamientos prescritos en el artículo 2.2.1.2.4.2.9, solo que el efecto de acreditar dichas circunstancias consistirá en beneficiarse  de este criterio de desempate en lugar de obtener puntaje.     2. Preferir la propuesta de la mujer cabeza de familia. Su acreditación se realizará en los términos del parágrafo del artículo  2  de la Ley 82  de 1993, modificado por el artículo  1  de la Ley 1232 de 2008, o la norma que lo modifique, aclare, adicione o sustituya. Es decir, la  condición de mujer cabeza de familia y la cesación de esta se otorgará desde el momento en que ocurra el respectivo evento y se declare  ante un notario. En la declaración que se presente para acreditar la calidad de mujer cabeza de familia deberá verificarse que la misma dé  cuenta del cumplimiento de los requisitos establecidos en el artículo  2  de la Ley 82 de 1993, modificado por el artículo  1  de la Ley 1232 de  2008.     Igualmente, se preferirá la propuesta de la mujer víctima de violencia intrafamiliar, la cual acreditará dicha condición de conformidad con el  artículo  21  de la Ley 1257 de 2008, esto es, cuando se profiera una medida de protección expedida por la autoridad competente. En virtud  del artículo  16  de la Ley 1257 de 2008, la medida de protección la debe impartir el comisario de familia del lugar donde ocurrieron los  hechos y, a falta de este, del juez civil municipal o promiscuo municipal, o la autoridad indígena en los casos de violencia intrafamiliar en las  comunidades de esta naturaleza.     En el caso de las personas jurídicas se preferirá a aquellas en las que participen mayoritariamente mujeres cabeza de familia y/o mujeres  víctimas de violencia intrafamiliar, para lo cual el representante legal o el revisor fiscal, según corresponda, presentará un certificado,  mediante el cual acredita, bajo la gravedad de juramento, que más del cincuenta por ciento (50 %) de la composición accionaria o cuota  parte de la persona jurídica está constituida por mujeres cabeza de familia y/o mujeres víctimas de violencia intrafamiliar. Además, deberá  acreditar la condición indicada de cada una de las mujeres que participen en la sociedad, aportando los documentos de cada una de ellas,  de acuerdo con los dos incisos anteriores.     Finalmente, en el caso de los proponentes plurales, se preferirá la oferta cuando cada uno de los integrantes acredite alguna de las  condiciones señaladas en los incisos anteriores de este numeral.     De acuerdo con el artículo  5  de la Ley 1581 de 2012, el titular de la información de estos datos sensibles, como es el caso de las mujeres  víctimas de violencia intrafamiliar, deberá autorizar de manera previa y expresa el tratamiento de esta información, en los términos del  literal  a ) del artículo  6  de la precitada Ley, como requisito para el otorgamiento del criterio de desempate.     3. Preferir la propuesta presentada por el proponente que acredite en las condiciones establecidas en la ley que por lo menos el diez por  ciento (10%) de su nómina está en condición de discapacidad, de acuerdo con el artículo  24  de la Ley 361 de 1997, debidamente  certificadas por la oficina del Ministerio del Trabajo de la respectiva zona, que hayan sido contratados con por lo menos un (1) año de  anterioridad a la fecha de cierre del Proceso de Contratación o desde el momento de la constitución de la persona jurídica cuando esta es  inferior a un (1) año y que manifieste adicionalmente que mantendrá dicho personal por un lapso igual al término de ejecución del contrato.     Si la oferta es presentada por un proponente plural, el integrante que acredite que el diez por ciento (10%) de su nómina está en condición  de discapacidad, en los términos del presente numeral, debe tener una participación de por lo menos el veinticinco por ciento (25%) en la  estructura plural y aportar como mínimo el veinticinco por ciento (25%) de la experiencia acreditada en la oferta.     El tiempo de vinculación en la planta referida de que trata este numeral se acreditará con el certificado de aportes a seguridad social del  último año o del tiempo de su constitución cuando su conformación es inferior a un (1) año, en el que se demuestren los pagos realizados  por el empleador.    \nDepartamento Administrativo de la Función Pública  Decreto 1860 de 2021   9   EVA - Gestor Normativo  4. Preferir la propuesta presentada por el oferente que acredite la vinculación en mayor proporción de personas mayores que no sean  beneficiarias de la pensión de vejez, familiar o de sobrevivencia y que hayan cumplido el requisito de edad de pensión establecido en la ley,  para ello, la persona natural, el representante legal de la persona jurídica o el revisor fiscal, según corresponda, entregará un certificado, en  el que se acredite, bajo la gravedad de juramento, las personas vinculadas en su nómina y el número de trabajadores que no son  beneficiarios de la pensión de vejez, familiar o de sobrevivencia y que cumplieron el requisito de edad de pensión. Solo se tendrá en cuenta  la vinculación de aquellas personas que se encuentren en las condiciones descritas y que hayan estado vinculadas con una anterioridad  igual o mayor a un (1) año contado a partir de la fecha del cierre del proceso. Para los casos de constitución inferior a un (1) año, se tendrá  en cuenta a aquellos que hayan estado vinculados desde el momento de la constitución de la persona jurídica.     El tiempo de vinculación en la planta referida, de que trata el inciso anterior, se acreditará con el certificado de aportes a seguridad social  del último año o del tiempo de constitución de la persona jurídica, cuando su conformación es inferior a un (1) año, en el que se demuestren  los pagos realizados por el empleador.     En el caso de los proponentes plurales, su representante legal acreditará el número de trabajadores vinculados que son personas mayores  no beneficiarias de la pensión de vejez, familiar o de sobrevivencia, y que cumplieron el requisito de edad de pensión establecido en la ley,  de todos los integrantes del proponente. Las personas enunciadas anteriormente podrán estar vinculadas a cualquiera de sus integrantes.     En cualquiera de los dos supuestos anteriores, para el otorgamiento del criterio de desempate, cada uno de los trabajadores que cumpla las  condiciones previstas por la ley, allegará un certificado, mediante el cual acredita, bajo la gravedad de juramento, que no es beneficiario de  pensión de vejez, familiar o sobrevivencia, y cumple la edad de pensión; además, se deberá allegar el documento de identificación del  trabajador que lo firma.     La mayor proporción se definirá en relación con el número total de trabajadores vinculados en la planta de personal, por lo que se preferirá  al oferente que acredite un porcentaje mayor. En el caso de proponentes plurales, la mayor proporción se definirá con la sumatoria de  trabajadores vinculados en la planta de personal de cada uno de sus integrantes.     5. Preferir la propuesta presentada por el oferente que acredite que por lo menos el diez por ciento (10%) de su nómina pertenece a  población indígena, negra, afrocolombiana, raizal, palanquera, Rrom o gitana, para lo cual, la persona natural, el representante legal o el  revisor fiscal, según corresponda, bajo la gravedad de juramento señalará las personas vinculadas a su nómina, y el número de  identificación y nombre de las personas que pertenecen a la población indígena, negra, afrocolombiana, raizal, palanquera, Rrom o gitana.  Solo se tendrá en cuenta la vinculación de aquellas personas que hayan estado vinculadas con una anterioridad igual o mayor a un (1) año  contado a partir de la fecha del cierre del proceso. Para los casos de constitución inferior a un (1) año, se tendrá en cuenta a aquellos que  hayan estado vinculados desde el momento de constitución de la persona jurídica.     El tiempo de vinculación en la planta referida, de que trata el inciso anterior, se acreditará con el certificado de aportes a seguridad social  del último año o del tiempo de su constitución cuando su conformación es inferior a un (1) año, en el que se demuestren los pagos  realizados por el empleador.     Además, deberá aportar la copia de la certificación expedida por el Ministerio del Interior, en la cual acredite que el trabajador pertenece a  la población indígena, negra, afrocolombiana, raizal, palenquera, Rrom o gitana, en los términos del Decreto Ley  2893  de 2011, o la norma  que lo modifique, sustituya o complemente.     En el caso de los proponentes plurales, su representante legal presentará un certificado, mediante el cual acredita que por lo menos diez  por ciento (10%) del total de la nómina de sus integrantes pertenece a población indígena, negra, afrocolombiana, raizal, palanquera, Rrom  o gitana. Este porcentaje se definirá de acuerdo con la sumatoria de la nómina de cada uno de los integrantes del proponente plural. Las  personas enunciadas anteriormente podrán estar vinculadas a cualquiera de sus integrantes. En todo caso, deberá aportar la copia de la  certificación expedida por el Ministerio del Interior, en la cual acredite que el trabajador pertenece a la población indígena, negra,  afrocolombiana, raizal, palenquera, Rrom o gitana en los términos del Decreto Ley  2893  de 2011, o la norma que lo modifique, sustituya o  complemente.     Debido a que para el otorgamiento de este criterio de desempate se entregan certificados que contienen datos sensibles, de acuerdo con el  artículo  5  de la Ley 1581 de 2012, se requiere que el titular de la información de estos, como es el caso de las personas que pertenece a la  población indígena, negra, afrocolombiana, raizal, palenquera, Rrom o gitana autoricen de manera previa y expresa el tratamiento de la \nDepartamento Administrativo de la Función Pública  Decreto 1860 de 2021   10   EVA - Gestor Normativo  información, en los términos del literal  a ) del artículo  6  de la Ley 1581 de 2012, como requisito para el otorgamiento del criterio de  desempate.     6. Preferir la propuesta de personas naturales en proceso de reintegración o reincorporación, para lo cual presentará copia de alguno de los  siguientes documentos: i) la certificación en las desmovilizaciones colectivas que expida la Oficina de Alto Comisionado para la Paz, ii) el  certificado que emita el Comité Operativo para la Dejación de las Armas respecto de las personas desmovilizadas en forma individual, iii) el  certificado que emita la Agencia para la Reincorporación y la Normalización que acredite que la persona se encuentra en proceso de  reincorporación o reintegración o iv) cualquier otro certificado que para el efecto determine la Ley. Además, se entregará copia del  documento de identificación de la persona en proceso de reintegración o reincorporación.     En el caso de las personas jurídicas, el representante legal o el revisor fiscal, si están obligados a tenerlo, entregará un certificado,  mediante el cual acredite bajo la gravedad de juramento que más del cincuenta por ciento (50 %) de la composición accionaria o cuotas  partes de la persona jurídica está constituida por personas en proceso de reintegración o reincorporación. Además, deberá aportar alguno  de los certificados del inciso anterior, junto con los documentos de identificación de cada una de las personas que está en proceso de  reincorporación o reintegración.     Tratándose de proponentes plurales, se preferirá la oferta cuando todos los integrantes sean personas en proceso de reincorporación, para  lo cual se entregará alguno de los certificados del inciso primero de este numeral, y/o personas jurídicas donde más del cincuenta por ciento  (50 %) de la composición accionaria o cuotas parte esté constituida por personas en proceso de reincorporación, para lo cual el  representante legal, o el revisor fiscal, si está obligado a tenerlo, acreditará tal situación aportando los documentos de identificación de  cada una de las personas en proceso de reincorporación.     Debido a que para el otorgamiento de este criterio de desempate se entregan certificados que contienen datos sensibles, de acuerdo con el  artículo  5  de la Ley 1581 de 2012, se requiere que el titular de la información de estos, como son las personas en proceso de  reincorporación o reintegración, autoricen a la entidad de manera previa y expresa el manejo de esta información, en los términos del literal  a ) del artículo  6  de la Ley 1581 de 2012 como requisito para el otorgamiento de este criterio de desempate.     7. Preferir la oferta presentada por un proponente plural siempre que se cumplan las condiciones de los siguientes numerales:     7. 1. Esté conformado por al menos una madre cabeza de familia y/o una persona en proceso de reincorporación o reintegración, para lo  cual se acreditarán estas condiciones de acuerdo con lo previsto en el inciso 1 del numeral 2 y/o el inciso 1 del numeral 6 del presente  artículo; o por una persona jurídica en la cual participe o participen mayoritariamente madres cabeza de familia y/o personas en proceso de  reincorporación o reintegración, para lo cual el representante legal o el revisor fiscal, si están obligados a tenerlo, presentarán un  certificado, mediante el cual acrediten, bajo la gravedad de juramento, que más del cincuenta por ciento (50 %) de la composición  accionaria o cuota parte de la persona jurídica está constituida por madres cabeza de familia y/o personas en proceso de reincorporación o  reintegración. Además, deberá acreditar la condición indicada de cada una de las personas que participen en la sociedad que sean mujeres  cabeza de familia y/o personas en proceso de reincorporación o reintegración, aportando los documentos de cada uno de ellos, de acuerdo  con lo previsto en este numeral. Este integrante debe tener una participación de por lo menos el veinticinco por ciento (25 %) en el  proponente plural.     7.2. El integrante del proponente plural de que trata el anterior numeral debe aportar mínimo el veinticinco por ciento (25%) de la  experiencia acreditada en la oferta.     7.3. En relación con el integrante del numeral 7.1. ni la madre cabeza de familia o la persona en proceso de reincorporación o reintegración,  ni la persona jurídica, ni sus accionistas, socios o representantes legales podrán ser empleados, socios o accionistas de otro de los  integrantes del proponente plural, para lo cual el integrante del que trata el numeral 7.1. lo manifestará en un certificado suscrito por la  persona natural o el representante legal de la persona jurídica.     Debido a que para el otorgamiento de este criterio de desempate se entregan certificados que contienen datos sensibles, de acuerdo el  artículo  5  de la Ley 1581 de 2012, se requiere que el titular de la información de estos, como es el caso de las personas en proceso de  reincorporación y/o reintegración autoricen de manera previa y expresa el tratamiento de esta información, en los términos del literal  a ) del  artículo  6  de la Ley 1581 de 2012, como requisito para el otorgamiento del criterio de desempate.    \nDepartamento Administrativo de la Función Pública  Decreto 1860 de 2021   11   EVA - Gestor Normativo  8. Preferir la oferta presentada por una Mipyme, lo cual se verificará en los términos del artículo 2.2.1.2.4.2.4 del presente Decreto, en  concordancia con el parágrafo del artículo  2.2.1.13.2.4  del Decreto 1074 de 2015.     Asimismo, se preferirá la oferta presentada por una cooperativa o asociaciones mutuales, para lo cual se aportará el certificado de  existencia y representación legal expedido por la Cámara de Comercio o la autoridad respectiva. En el caso específico en que el empate se  presente entre cooperativas o asociaciones mutuales que tengan el tamaño empresarial de grandes empresas junto con micro, pequeñas o  medianas, se preferirá la oferta las cooperativas o asociaciones mutuales que cumplan con los criterios de clasificación empresarial  definidos por el Decreto  1074  de 2015, que sean micro, pequeñas o medianas.     Tratándose de proponentes plurales, se preferirá la oferta cuando cada uno de los integrantes acredite alguna de las condiciones señaladas  en los incisos anteriores de este numeral. En el evento en que el empate se presente entre proponentes plurales cuyos integrantes estén  conformados únicamente por cooperativas y asociaciones mutuales que tengan la calidad de grandes empresas junto con otras en las que  los integrantes tengan la calidad de micro, pequeñas o medianas, se preferirá la oferta de aquellos proponentes plurales en los cuales al  menos uno de sus integrantes sea una cooperativa o asociación mutual que cumpla con los criterios de clasificación empresarial definidos  por el Decreto  1074  de 2015, que sean micro, pequeñas o medianas.     9. Preferir la oferta presentada por el proponente plural constituido en su totalidad por micro y/o pequeñas empresas, cooperativas o  asociaciones mutuales.     La condición de micro o pequeña empresa se verificará en los términos del artículo 2.2.1.2.4.2.4 del presente Decreto, en concordancia con  el parágrafo del artículo  2.2.1.13.2.4  del Decreto 1074 de 2015.     La condición de cooperativa o asociación mutual se acreditará con el certificado de existencia y representación legal expedido por la  Cámara de Comercio o la autoridad respectiva. En el evento en que el empate se presente entre proponentes plurales cuyos integrantes  estén conformados únicamente por cooperativas y asociaciones mutuales que tengan la calidad de grandes empresas junto con otras en las  que los integrantes tengan la calidad de micro, pequeñas o medianas, se preferirá la oferta de aquellos proponentes plurales en los cuáles  al menos uno de sus integrantes sea una cooperativa o asociación mutual que cumpla con los criterios de clasificación empresarial definidos  por el Decreto  1074  de 2015, que sean micro, pequeñas o medianas.     10. Preferir al oferente persona natural o jurídica que acredite, de acuerdo con sus estados financieros o información contable con corte al  31 de diciembre del año anterior, que por lo menos el veinticinco por ciento (25 %) del total de sus pagos fueron realizados a Mipyme,  cooperativas o asociaciones mutuales por concepto de proveeduría del oferente, efectuados durante el año anterior, para lo cual el  proponente persona natural y contador público; o el representante legal de la persona jurídica y revisor fiscal para las personas obligadas  por ley; o del representante legal de la persona jurídica y contador público, según corresponda, entregará un certificado expedido bajo la  gravedad de juramento, en el que conste que por lo menos el veinticinco por ciento (25%) del total de pagos fueron realizados a Mipyme,  cooperativas o asociaciones mutuales.     Igualmente, cuando la oferta es presentada por un proponente plural se preferirá a este siempre que:     10.1. Esté conformado por al menos una Mipyme, cooperativa o asociación mutual que tenga una participación de por lo menos el  veinticinco por ciento (25%) en el proponente plural, para lo cual se presentará el documento de conformación del proponente plural y,  además, ese integrante acredite la condición de Mipyme, cooperativa o asociación mutual en los términos del numeral 8 del presente  artículo;     10.2. La Mipyme, cooperativa o asociación mutual aporte mínimo el veinticinco por ciento (25 %) de la experiencia acreditada en la oferta; y     10.3. Ni la Mipyme, cooperativa o asociación mutual ni sus accionistas, socios o representantes legales sean empleados, socios o  accionistas de los otros integrantes del proponente plural, para lo cual el integrante respectivo lo manifestará mediante un certificado  suscrito por la persona natural o el representante legal de la persona jurídica.     En el evento en que el empate se presente entre proponentes plurales, que cumplan con los requisitos de los incisos anteriores, cuyos \nDepartamento Administrativo de la Función Pública  Decreto 1860 de 2021   12   EVA - Gestor Normativo  integrantes estén conformados únicamente por cooperativas y asociaciones mutuales que tengan la calidad de grandes empresas junto con  otras en las que los integrantes tengan la calidad de micro, pequeñas o medianas, se preferirá la oferta de aquellos proponentes plurales en  los cuales al menos uno de sus integrantes sea una cooperativa o asociación mutual que cumpla con los criterios de clasificación  empresarial definidos por el Decreto  1074  de 2015, que sean micro, pequeñas o medianas.     11. Preferir las empresas reconocidas y establecidas como Sociedad de Beneficio e Interés Colectivo o Sociedad BIC, del segmento  Mipymes, para lo cual se presentará el certificado de existencia y representación legal en el que conste el cumplimiento a los requisitos del  artículo  2  de la Ley 1901 de 2018, o la norma que la modifique o la sustituya. Asimismo, acreditará la condición de Mipyme en los términos  del numeral 8 del presente artículo.     Tratándose de proponentes plurales, se preferirá la oferta cuando cada uno de los integrantes acredite las condiciones señaladas en el  inciso anterior de este numeral.     12. Utilizar un método aleatorio para seleccionar al oferente, el cual deberá estar establecido previamente en el pliego de condiciones,  invitación o documento que haga sus veces.     PARÁGRAFO 1.  Los factores de desempate deberán aplicarse en armonía con los Acuerdos Comerciales vigentes suscritos por Colombia. De  esta manera, en el evento en que el empate se presente entre ofertas cubiertas por un Acuerdo Comercial, se aplicarán los factores de  desempate que sean compatibles con los mencionados Acuerdos.     Sin perjuicio de la obligación anterior, el Ministerio de Comercio, Industria y Turismo y la Agencia Nacional de Contratación Pública -  Colombia Compra Eficiente señalarán en un Manual o Guía no vinculante los lineamientos para la aplicación de los factores de desempate  en cumplimiento de un Acuerdo Comercial en la etapa de selección del Proceso de Contratación.     PARÁGRAFO 2.  Si el empate entre las propuestas se presenta con un proponente, bien o servicio extranjero cuyo país de origen no tiene  Acuerdo Comercial con Colombia, ni trato nacional por reciprocidad o con ocasión de la normativa comunitaria, se dará aplicación a todos  los criterios de desempate previstos en el presente numeral.     PARÁGRAFO 3.  Conforme con el artículo  18  de la Ley 1712 de 2014 y los artículos  5  y  6  de la Ley 1581 de 2012, la Entidad Estatal  garantizará el derecho a la reserva legal de toda aquella información que acredita el cumplimiento de los factores de desempate de: i) las  mujeres víctimas de violencia intrafamiliar, ii) las personas en proceso de reincorporación y/o reintegración y iii) la población indígena,  negra, afrocolombiana, raizal, palenquera, Rrom o gitana.     En armonía con lo anterior, en la plataforma del SECOP no se publicará para conocimiento de terceros la información relacionada con los  factores de desempate de personas en procesos de reincorporación o reintegración o mujeres víctimas de violencia intrafamiliar o la  población indígena, negra, afrocolombiana, raizal, palenquera, Rrom o gitana, puesto que su público conocimiento puede afectar el derecho  a la intimidad de los oferentes o de sus trabajadores o socios o accionistas.     ARTÍCULO 2.2.1.2.4.2.18. Criterios diferenciales para Mipyme en el sistema de compras públicas.  De acuerdo con el numeral  1  del artículo  12  de la Ley 590 de 2000, según los resultados del análisis del sector, las Entidades Estatales indistintamente de su régimen de  contratación, los patrimonios autónomos constituidos por Entidades Estatales y los particulares que ejecuten recursos públicos establecerán  condiciones habilitantes diferenciales que promuevan y faciliten la participación en los procedimientos de selección competitivos de las  Mipyme domiciliadas en Colombia. Para el efecto, en función de los criterios de clasificación empresarial, los Documentos del Proceso  deberán incorporar requisitos habilitantes diferenciales relacionados con alguno o algunos de los siguientes aspectos:     1. Tiempo de experiencia.     2. Número de contratos para la acreditación de la experiencia.    \nDepartamento Administrativo de la Función Pública  Decreto 1860 de 2021   13   EVA - Gestor Normativo  3. Índices de capacidad financiera.     4. Índices de capacidad organizacional.     5. Valor de la garantía de seriedad de la oferta.     Los requisitos mencionados deberán fijarse respetando las condiciones habilitantes requeridas para el cumplimiento adecuado del contrato,  teniendo en cuenta el alcance de las obligaciones. En desarrollo de lo anterior, con la finalidad de beneficiar a las Mipyme, se establecerán  condiciones más exigentes respecto a alguno o algunos de los criterios de participación antes enunciados frente a los demás proponentes  que concurran al procedimiento de selección que no sean Mipyme.     Con excepción de los procedimientos de selección abreviada por subasta inversa y de mínima cuantía, las entidades sometidas al Estatuto  General de Contratación de la Administración Pública, teniendo en cuenta los criterios de clasificación empresarial, podrán establecer  puntajes adicionales para Mipyme. En ningún caso, estos podrán superar el cero punto veinticinco por ciento (0.25%) del total de los puntos  establecidos en el pliego de condiciones.     PARÁGRAFO 1.  Para los efectos de este artículo, los criterios de clasificación empresarial son los definidos en el artículo  2.2.1.13.2.2  del  Decreto 1074 de 2015, Único Reglamentario del Sector Comercio, Industria y Turismo, o la norma que lo modifique, derogue o sustituya.     PARÁGRAFO 2.  Tratándose de proponentes plurales, los criterios diferenciales y los puntajes adicionales solo se aplicarán si por lo menos  uno de los integrantes acredita la calidad de Mipyme y tiene una participación igual o superior al diez por ciento (10%) en el consorcio o la  unión temporal.     PARÁGRAFO 3.  Lo previsto en esta norma aplica sin perjuicio de lo dispuesto en los Acuerdos Comerciales suscritos por el Estado  colombiano, pero no rige en las convocatorias limitadas que se realicen conforme a los artículos 2.2.1.2.4.2.2 y 2.2.1.2.4.2.3 de este  Decreto.\"     ARTÍCULO    4. Adición de un  parágrafo  al artículo  2.2.1.2.3.1.9 . de la Subsección 1 de la Sección 3 del Capítulo 2 del Título 1 de la Parte 2 del  Libro 2 del Decreto 1082 de 2015.  Adiciónese un parágrafo al artículo 2.2.1.2.3.1.9 de la Subsección 1 de la Sección 3 del Capítulo 2 del  Título 1 de la Parte 2 del Libro 2 del Decreto 1082 de 2015, el cual quedará así:     \"PARÁGRAFO.  Colombia Compra Eficiente podrá definir un valor de suficiencia diferencial para la garantía de seriedad de las ofertas  presentadas por los emprendimientos y las empresas de mujeres, y las Mipyme en los Acuerdos Marco de Precio.\"     ARTÍCULO    5. Modificación de la Subsección 2 de la Sección 4 del Capítulo 2 del Título 1 de la Parte 2 del Libro 2 del Decreto 1082 de 2015.  Modifíquense los artículos  2.2.1.2.4.2.2 .,  2.2.1.2.4.2.3 . y  2.2.1.2.4.2.4 . de la Subsección 2 de la Sección 4 del Capítulo 2 del Título 1 de la  Parte 2 del Libro 2 del Decreto 1082 de 2015, los cuales quedarán así:     \" ARTÍCULO 2.2.1.2.4.2.2. Convocatorias limitadas a Mípyme . Las Entidades Estatales independientemente de su régimen de contratación,  los patrimonios autónomos constituidos por Entidades Estatales y los particulares que ejecuten recursos públicos, deben limitar la  convocatoria de los Procesos de Contratación con pluralidad de oferentes a las Mipyme colombianas con mínimo un (1) año de existencia,  cuando concurran los siguientes requisitos:     1. El valor del Proceso de Contratación sea menor a ciento veinticinco mil dólares de los Estados Unidos de América (US$125.000),  liquidados con la tasa de cambio que para el efecto determina cada dos años el Ministerio de Comercio, Industria y Turismo.     2. Se hayan recibido solicitudes de por lo menos dos (2) Mipyme colombianas para limitar la convocatoria a Mipyme colombianas. Las  Entidades Estatales independientemente de su régimen de contratación, los patrimonios autónomos constituidos por Entidades Estatales y \nDepartamento Administrativo de la Función Pública  Decreto 1860 de 2021   14   EVA - Gestor Normativo  los particulares que ejecuten recursos públicos, deben recibir estas solicitudes por lo menos un (1) día hábil antes de la expedición del acto  administrativo de apertura, o el que haga sus veces de acuerdo con la normativa aplicable a cada Proceso de Contratación.     Tratándose de personas jurídicas, las solicitudes solo las podrán realizar Mipyme, cuyo objeto social les permita ejecutar el contrato  relacionado con el proceso contractual.     PARÁGRAFO.  Las cooperativas y demás entidades de economía solidaria, siempre que tengan la calidad de Mípyme, podrán solicitar y  participar en las convocatorias limitadas en las mismas condiciones dispuestas en el presente artículo.     ARTÍCULO 2.2.1.2.4.2.3. Limitaciones territoriales.  De conformidad con el parágrafo  1  del artículo  12  de la Ley 1150 de 2007, las Entidades  Estatales, independientemente de su régimen de contratación, los patrimonios autónomos constituidos por Entidades Estatales y los  particulares que ejecuten recursos públicos, pueden realizar convocatorias limitadas a Mipyme colombianas que tengan domicilio en los  departamentos o municipios en donde se va a ejecutar el contrato. Cada Mipyme deberá acreditar su domicilio con los documentos a los  que se refiere el siguiente artículo.     ARTÍCULO 2.2.1.2.4.2.4. Acreditación de requisitos para participar en convocatorias limitadas.  La Mipyme colombianas deben acreditar que  tiene el tamaño empresarial establecido por la ley de la siguiente manera:     1. Las personas naturales mediante certificación expedida por ellos y un contador público, adjuntando copia del registro mercantil.     2. Las personas jurídicas mediante certificación expedida por el representante legal y el contador o revisor fiscal, si están obligados a  tenerlo, adjuntando copia del certificado de existencia y representación legal expedido por la Cámara de Comercio o por la autoridad  competente para expedir dicha certificación.     Para la acreditación deberán observarse los rangos de clasificación empresarial establecidos de conformidad con la Ley  590  de 2000 y el  Decreto  1074  de 2015, o las normas que lo modifiquen, sustituyan o complementen.     PARÁGRAFO 1.  En todo caso, las Mipyme también podrán acreditar esta condición con la copia del certificado del Registro Único de  Proponentes, el cual deberá encontrarse vigente y en firme al momento de su presentación.     PARÁGRAFO 2 . Para efectos de la limitación a Mipyme, los proponentes aportarán la copia del registro mercantil, del certificado de  existencia y representación legal o del Registro Único de Proponentes, según corresponda conforme a las reglas precedentes, con una fecha  de máximo sesenta (60) días calendario anteriores a la prevista en el cronograma del Proceso de Contratación para el inicio del plazo para  solicitar la convocatoria limitada.     PARÁGRAFO 3.  En las convocatorias limitadas, las Entidades Estatales independientemente de su régimen de contratación, los patrimonios  autónomos constituidos por Entidades Estatales y los particulares que ejecuten recursos públicos, solo deberán aceptar las ofertas de  Mipyme o de proponentes plurales integrados únicamente por Mipyme.     PARÁGRAFO 4.  Los incentivos previstos en los artículos 2.2.1.2.4.2.2 y 2.2.1.2.4.2.3 de este Decreto no excluyen la aplicación de los  criterios diferenciales para los emprendimientos y empresas de mujeres en el sistema de compras públicas.\"     ARTÍCULO    6. Modificación del artículo  2.2.1.2.1.2.2.  de la Subsección 2 de la Sección 2 del Capítulo 2 del Título 1 de la Parte 2 del Libro 2  del Decreto 1082 de 2015.  Modifíquese el artículo 2.2.1.2.1.2.2. de la Subsección 2 de la Sección 1 del Capítulo 2 del Título 1 de la Parte 2  del Libro 2 del Decreto 1082 de 2015, el cual quedará así:     \"ARTÍCULO 2.2.1.2.1.2.2. Procedimiento para la subasta inversa.  Además de las reglas generales previstas en la ley y en el presente título,  las siguientes reglas son aplicables a la subasta inversa: \nDepartamento Administrativo de la Función Pública  Decreto 1860 de 2021   15   EVA - Gestor Normativo     1. Los pliegos de condiciones deben indicar: a) la fecha y hora de inicio de la subasta; b) la periodicidad de los Lances; y c) el Margen  Mínimo para mejorar la oferta durante la subasta inversa.     2. La oferta debe contener dos parles, la primera en la cual el interesado acredite su capacidad de participar en el Proceso de Contratación  y acredite el cumplimiento de la ficha técnica; y la segunda parle debe contener el precio inicial propuesto por el oferente.     3. La Entidad Estatal debe publicar un informe de habilitación de los oferentes, en el cual debe indicar si los bienes o servicios ofrecidos por  el interesado cumplen con la ficha técnica y si el oferente se encuentra habilitado.     4. Hay subasta inversa siempre que haya como mm1mo dos oferentes habilitados cuyos bienes o servicios cumplen con la ficha técnica.     5. Si en el Proceso de Contratación se presenta un único oferente cuyos bienes o servicios cumplen con la ficha técnica y está habilitado, la  Entidad Estatal puede adjudicarle el contrato al único oferente si el valor de la oferta es igual o inferior a la disponibilidad presupuestal para  el contrato, caso en el cual no hay lugar a la subasta inversa.     6. La subasta debe iniciar con el precio más bajo indicado por los oferentes y en consecuencia, solamente serán válidos los Lances  efectuados durante la subasta inversa en los cuales la oferta sea mejorada en por lo menos el Margen Mínimo establecido.     7. Si los oferentes no presentan Lances durante la subasta, la Entidad Estatal debe adjudicar el contrato al oferente que haya presentado el  precio inicial más bajo.     8. Al terminar la presentación de cada Lance, la Entidad Estatal debe informar el valor del Lance más bajo.     9. Si al terminar la subasta inversa hay empate, la Entidad Estatal debe aplicar los criterios del artículo  35  de la Ley 2069 de 2020 conforme  con los medios de acreditación del artículo 2.2. 1.2.4.2 17 del presente Decreto.     ARTÍCULO    7. Modificación del artículo  2.2.1.2.4.2.8 . de la Subsección 2 de la Sección 4 del Capítulo 2 del Título 1 de la Parte 2 del Libro 2  del Decreto 1082 de 2015.  Modifíquese el artículo 2.2.1.2.4.2.8. de la Subsección 2 de la Sección 4 del Capítulo 2 del Título 1 de la Parte 2  del Libro 2 del Decreto 1082 de 2015, el cual quedará de la siguiente manera:     \"ARTÍCULO 2.2.1.2.4.2.8. Sistema de preferencias.  En cumplimiento de lo previsto en los numerales  7  y  8  del artículo  13  de la Ley 1618 de  2013, si en la evaluación hay empate entre dos o más ofertas, la Entidad Estatal debe aplicar los criterios de desempate previstos en el  artículo  35  de la Ley 2069 de 2020, conforme a los medios de acreditación del artículo 2.2.1.2.4.2.17. del presente Decreto.     ARTÍCULO    8. Vigencia y derogatorias.  Las disposiciones contenidas en el presente Decreto se aplicarán a los procedimientos de selección  cuya invitación, aviso de convocatoria o documento equivalente se publique a los tres (3) meses contados a partir de su expedición. Este  Decreto modifica la Subsección  5  de la Sección 1 del Capítulo 2 del Título 1 de la Parte 2 del Libro 2, así como los artículos  2.2.1.2.4.2.2 .,  2.2.1.2.4.2.3 .,  2.2.1.2.4.2.4 .,  2.2.1.2.1.2.2 . y  2.2.1.2.4.2.8 .; adiciona los artículos  2.2.1.2.4.2.14 .,  2.2.1.2.4.2.15 .,  2.2.1.2.4.2.16 .,  2.2.1.2.4.2.17 . y  2.2.1.2.4.2.18 .; adiciona un  parágrafo  al artículo  2.2.1.2.3.1.9 ; y deroga el artículo  2.2.1.1.2.2.9 . del Decreto 1082 de 2015,  Único Reglamentario del Sector Administrativo de Planeación Nacional.     PARÁGRAFO.  Los Procesos de Contratación que se rijan por los Documento Tipo continuarán aplicando estos instrumentos y las normas  vigentes anteriores a la expedición de este Decreto. Por tanto, estos procedimientos de selección se realizarán conforme la regulación  actual contenida en los Documentos Tipo hasta que la Agencia Nacional de Contratación Pública - Colombia Compra Eficiente expida las  modificaciones a que haya lugar, conforme con las disposiciones de esta reglamentación.     La Agencia tendrá un plazo máximo de seis (6) meses contados a partir de la expedición de este Decreto para adecuar los Documentos Tipo \nDepartamento Administrativo de la Función Pública  Decreto 1860 de 2021   16   EVA - Gestor Normativo  a las disposiciones previstas en este reglamento. Sin perjuicio de lo anterior, el artículo 5 del presente Decreto regirá en los procesos  sometidos a los Documentos Tipo en las condiciones establecidas en este artículo.     PUBLÍQUESE Y CÚMPLASE     Dado en Bogotá D.C., a los 24 días del mes de diciembre de 2021     EL PRESIDENTE DE LA REPÚBLICA     (FDO.) IVÁN DUQUE MÁRQUEZ     LA MINISTRA DE COMERCIO, INDUSTRIA Y TURISMO,     MARÍA XIMENA LOMBANA VILLALBA     LA DIRECTORA DEL DEPARTAMENTO NACIONAL DE PLANEACIÓN,     ALEJANDRA CAROLINA BOTERO BARCO  Fecha y hora de creación: 2022-03-16 17:58:01 \n";

        try {
            const j = JSON.parse(s);
            if (Array.isArray(j)) return JSON.stringify(j);
            if (j && typeof j === 'object') {
                const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
                if (typeof c === 'string') return c.trim();

            }
            if (typeof j === 'string') return j;
        } catch (e) {}
        return s;
    }

    function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }
    function rgbToHex(r, g, b) {
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
        return '#' + toHex(r) + toHex(g) + toHex(b);
    }
    function mixColors(colorA, colorB, amount) {
        const a = hexToRgb(colorA);
        const b = hexToRgb(colorB);
        return rgbToHex(a.r + (b.r - a.r) * amount, a.g + (b.g - a.g) * amount, a.b + (b.b - a.b) * amount);
    }
    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);
    }

    function generatePalette() {
        const hue = Math.floor(Math.random() * 360);
        const bg = hslToHex(hue, 45 + Math.floor(Math.random() * 20), 16 + Math.floor(Math.random() * 70));
        const text = getReadableTextColor(bg);
        const isDark = getLuminance(bg) < 0.5;
        const accent = hslToHex((hue + 35 + Math.floor(Math.random() * 60)) % 360, 80, isDark ? 55 : 45);
        const card = isDark ? mixColors(bg, '#ffffff', 0.08) : mixColors(bg, '#000000', 0.05);
        const border = isDark ? mixColors(card, '#ffffff', 0.18) : mixColors(card, '#000000', 0.12);
        const input = isDark ? mixColors(card, '#ffffff', 0.07) : mixColors(card, '#000000', 0.04);
        const inputBorder = isDark ? mixColors(border, '#ffffff', 0.12) : mixColors(border, '#000000', 0.1);
        const botBg = isDark ? mixColors(bg, '#ffffff', 0.12) : mixColors(bg, '#000000', 0.06);
        return {
            bgColor: bg,
