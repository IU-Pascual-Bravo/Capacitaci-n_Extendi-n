hora, recordemos que el deseo no es bueno ni malo en sí. Realmente,  es el uso que le damos el que importa. Para derrocar a estos dictadores  requerimos, entonces, poner la fuerza de nuestro deseo en favor de metas  más benévolas.  ES POSIBLE DARLE UN GOLPE DE TIMÓN PARA  CONDUCIRLO A VALORES COMO LA AMISTAD, LA  COMPASIÓN, LA GENEROSIDAD Y LA EMPATÍA, QUE SON A  FIN DE CUENTAS QUIENES DEJAN LA MEJOR HUELLA EN  NUESTRO BIENESTAR. \nImposible dejar de quererlo!  “Sí, hemos terminado la relación varias veces, pero siempre  regresamos porque no podemos vivir sin vernos.”  “Acepto que me grita, que no me trata como yo quisiera pero sé que  tengo mucho que ver con que se ponga así.”  “Bueno, tenemos nuestros pleitos, como todas las parejas. Digamos  que son  pleitos normales .”  Hace un año conocí a Bere y Santiago, 7 años de noviazgo conflictivo  con más bajas  que altas en la relación, con  planes de matrimonio  en  menos de un año y al preguntarle a Bere si lo quiere verdaderamente o es  costumbre, me contesta en forma casi automática que no lo quiere, ¡lo  ama con todas sus fuerzas!  Y continuó:  —Hay días en que quiero dejarlo pero ¡no puedo! Me deja de hablar  después de un pleito y me juro no tomar su llamada cuando lo haga para  pedirme perdón, y espero con mucha ansiedad que me busque, lo cual por  cierto muchas veces no lo hace y tengo que buscarlo yo para perdonarlo;  sé que es porque batalla mucho para disculparse. Su papá es igual.  Un día se atrevió a decirme que no me soportaba. Que le choca la  manera como me río, la manera como me visto y hasta cómo me llevo \ncon mis amigas y amigos. “¿Si te molesta tanto mi forma de ser porque  sigues conmigo?” Y su respuesta me confirmó que en el fondo no puede  vivir sin mí, me dijo: “Ni yo sé por qué sigo aquí.”  —¿Es esa una respuesta adecuada? —pregunté, la miré y luego añadí  —. ¿Es eso amor verdadero?  “¿Así o más bruta?” Pensé, porque claro que no se lo dije así, pero  digamos que lo insinué sutilmente, de la siguiente manera:  —¡No seas bruta! ¿Cuándo te vas a untar la poca autoestima que traes  en el suelo y te valoras? ¿En qué momento puedes amar a alguien que te  quiere cambiar, que no te respeta y que no te hace crecer como persona?  Bere simplemente me dio una respuesta escueta:  —Es que no puedo dejarlo.  Platicar con ella me hizo confirmar algo que se ha escrito tanto y que  por más que se difunda, aún no se entiende ni se aplica. Gran diferencia  entre el verdadero amor y el amor codependiente.  El doctor Walter Riso, terapeuta y autor de libros relacionados con  este tema, dice que hay cuatro primicias del amor racional:  1 Si alguien duda que te ama, no te ama.  Nada de que tengo dudas,  “no  sé,  necesito  tiempo...”  Recordé  una  de  mis  frases  matonas:  “Cuando alguien te pide tiempo y espacio en una relación, una  de dos: o lo atosigas o tu amor no es para su espacio.”  2 No te merece quien te lastima intencionalmente.  Ningún tipo de  maltrato intencionado está justificado en una relación sana. ¿Para  qué seguir con alguien que te hace daño? ¿Qué te hace creer que en  el futuro las cosas cambiarán por parte de quien en el presente no te  da tu lugar ni te respeta?  3 El buen amor es recíproco.  El verdadero amor es bilateral, tiene  doble sentido, te amo y me amas. Te procuro y me procuras.  4 En el amor hay que aprender a perder.  Si no te aman, no hay que  insistir porque es imposible obligar a alguien a que te ame.  Por supuesto lo que esta pareja vive dista mucho de un amor sano y se ha  convertido  en  un  amor  codependiente  donde  siguen  juntos  sólo  por  costumbre, creyendo en una falsa interpretación del amor.  Hoy, un año después de mi encuentro con Bere, cuatro meses después  de la celebración de su matrimonio, ella está desolada por lo mal que le \nha ido. Tristemente siguió creyendo que las cosas mejorarían como por  arte de magia después de formalizar su unión ante un juez y frente al  altar.  Los problemas que existen en el noviazgo son similares a la piedra  dentro  de  un  zapato.  Piedrita  chiquita  en  el  noviazgo  se  convierte  en  peñasco en el matrimonio.  ¿Cuántas  parejas  similares  existen  en  este  momento?  ¿A  cuántas  conoces, si es que no vives tú algo semejante?  Siempre juntos  Cuenta una vieja leyenda de los indios sioux, que una  vez llegó hasta la tienda del viejo brujo de la tribu, una  pareja de enamorados. “Nos amamos”, le dijo el joven,  “y nos vamos a casar”, mencionó ella, “pero queremos  un  hechizo,  un  conjuro,  un  talismán  o  algo  que  nos  garantice que estaremos siempre juntos, hasta el día de  la muerte”.  El viejo los miró y le respondió a la mujer: “Hay  algo, pero es una tarea muy difícil y sacrificada. ¿Ves el  monte al norte de nuestra aldea? Deberás escalarlo sola  y sin más armas que una red y tus manos, tendrás que  cazar al halcón más hermoso y vigoroso del monte. Si lo  atrapas, tráelo aquí con vida, al tercer día después de la  luna  llena.  ¿Comprendiste?”  La  joven  asintió  en  silencio. El hombre le dijo al joven: “Tú deberás escalar  la  montaña  del  Trueno;  cuando  llegues  a  la  cima, \nencontrarás la más brava de todas las águilas y, sólo con  tus manos y una red, tendrás que atraparla sin heridas y  traerla ante mí, viva, el mismo día en que vendrá tu  futura esposa.”  Ellos se miraron con ternura, y después de una fugaz  sonrisa, salieron a cumplir la misión encomendada. El  día establecido estaban frente a la tienda del viejo, los  dos jóvenes con sendas bolsas de tela que contenían a  las  aves  solicitadas.  El  hechicero  les  pidió  que  con  mucho  cuidado  las  sacaran,  eran  verdaderamente  hermosos ejemplares, sin duda lo mejor de su estirpe.  El hombre enamorado preguntó: “¿Los mataremos y  beberemos el honor de su sangre?, ¿los cocinaremos y  comeremos el valor de su carne?” Y el sabio respondió:  “Tomen las aves y átenlas entre sí por las patas con  estas  tiras  de  cuero,  y  cuando  las  hayan  anudado,  suéltenlas y que vuelen libres.”  La pareja realizó lo que se les pidió, y las soltaron.  El águila y el halcón intentaron levantar vuelo, pero sólo  consiguieron  revolcarse  en  el  piso.  Unos  minutos  después,  irritadas  por  la  incapacidad,  las  aves  arremetieron a picotazos entre sí, hasta lastimarse.  Entonces  el  brujo  les  dijo  a  los  futuros  esposos:  “Jamás olviden lo que han visto; ustedes son como un  águila y un halcón; si se atan el uno al otro, aunque lo  hagan por amor, no sólo vivirán arrastrándose, además,  tarde o temprano, empezarán a lastimarse uno al otro. Si  quieren  que  el  amor  entre  ustedes  perdure,  vuelen  juntos, pero nunca atados.” \nFrente a la delicadeza del tema nos dice el doctor Riso: “¿Quién no ha  sufrido alguna vez por estar con la persona equivocada, por sentir un  descenso en el deseo o simplemente por la caricia que nunca llegó? No  hay nada más hipersensible que el amor, nada más arrebatador, nada más  vital. Renunciar a él es vivir menos o no vivir.” Por eso estoy seguro que  si muchas de las parejas leyeran la investigación siguiente, y además la  interpretaran y tomaran decisiones por su bien, no estarían dispuestos a  mantener lo insostenible.  La codependencia: una relación secuestrada  La  doctora  Judith  S.  Wallerstein,  profesora  de  la  Universidad  de  California, en Berkeley, dedicó su vida a estudiar la vida matrimonial. En  su libro  El buen matrimonio: cómo y por qué el amor dura,  destaca el  siguiente factor como uno de los principales para una relación feliz y  duradera: “Desarrollar la unión con base en una intimidad e identidad  compartida,  y  establecer  al  mismo  tiempo  límites  para  proteger  la  autonomía de cada miembro de la pareja.”  Porque la vida amorosa es truculenta. ¿Dónde están las fronteras entre  relación y persona?, ¿dónde termina el “nosotros” y empieza el “yo”?  Caer  en  el  extremo  puede  despertar  desinterés;  caer  en  el  otro  puede  provocar apego. Así, el balance entre unión e independencia se vuelve  fundamental.  La codependencia es subir la relación a un pedestal irreal y, a la vez,  diluir las necesidades e impulsos que como persona tenemos fuera de ella. \nLos expertos definen la codependencia como un patrón de conducta con  el  que  terminamos  dependiendo  de  la  aprobación  de  los  demás  para  definir lo que somos y lo que valemos.  Antes que nada, no hay que malinterpretar el asunto. Es normal y  deseable tener atenciones, incluso sacrificios para mantener la armonía en  nuestra relación. Lo delicado es cuando éstos llegan a costa de nosotros,  cuando se convierten en un deber metido con calzador a manos de la  típica creencia de “si me deja, me muero”.  La doctora de la Universidad de Boston, Ellen Hendriksen, lo resume  diciendo que la codependencia es como una transacción “donde tú ofreces  un rescate a cambio de sentirte querido y necesitado”.  Según Hendriksen esto conlleva el gran peligro de crear un círculo  vicioso entre ambas partes de la moneda. El codependiente busca como  principal  candidato  de  pareja  a  aquel  con  el  perfil  de  necesitar  sus  servicios de rescate, alguna persona vulnerable que lo haga sentir útil y de  quien pueda extraer ese reconocimiento que le es tan ansiado.  En una relación ya establecida esto no sólo implica que ambas partes  desatiendan sus respectivos problemas, sino incluso que los empeoren. En  su  afán  de  complacer,  el  codependiente  puede  terminar  por  tolerar  o  encubrir los comportamientos nocivos de su pareja. Así, se convierten en  cómplices  de  una  degeneración  que  afecta  tanto  al  par  como  a  los  individuos.  Por supuesto, el mayor de los sacrificios, aquel que casi nos convierte  en  mártires,  llega  cuando  a  cambio  de  todas  estas  consideraciones  obtenemos abusos y maltratos, aprovechando la posición de poder que  nosotros les conferimos a los demás.  La terapeuta de parejas, Darlene Lancer, propone un camino de cuatro  pasos para rehabilitarnos de este comportamiento. Se trata de las cuatro  A:  1     Abstinencia:   distanciarnos,  alejarnos  de  la  adicción  para  definirnos y comenzar a reubicar ese valor en nuestra persona. \n2   Atención:  volver a valorarnos es mirar hacia dentro y atender  esa vida interior que habíamos sacrificado.  3   Aceptación:  Evitar el juicio negativo hacia nosotros. Hablarnos  con  más  compasión.  La  autoaceptación  más  plena  sucede  cuando nos damos cuenta de que no necesitamos complacer a  los demás por miedo a no agradarles.  4     Acción:   el  trabajo  interno  debe  traducirse  en  resultados  externos: en comportamientos más sanos que solidifiquen un  verdadero cambio; esto implica tomar riesgos que nos obliguen  a salir de la zona de confort, mantener a raya al criticón que  llevamos  dentro,  realizar  actividades  que  nos  satisfagan  y  aporten significado, pero, sobre todo, impulsar la asertividad:  crear  y  respetar  esas  convicciones  firmes  sobre  las  que  necesitamos construir esa autonomía y sentido del yo.  En  resumen,  para  estar  bien  con  los  demás,  debemos  estar  bien  con  nosotros. Este dicho popular existe por algo. \nanto en la amistad como en el noviazgo hay personas que ya  dieron  lo  que  tenían  que  dar.  Hay  relaciones  que  ya  terminaron  desde  hace  tiempo  pero  ahí  estás,  ahí  sigues,  queriendo avivar brasas donde ya no hay fuego.  Tengo amigos y conocidos con relaciones que a leguas se nota que en  ese matrimonio no hay amor, sólo se soportan, se aguantan, se toleran. No  puedo  poner  el  nombre  verdadero  de  quien  a  continuación  te  digo.  Digámosle Oscar. Amigo de mi familia desde hace años, casado desde  hace 25.  Acostumbra  a  hacer  comentarios  en  son  de  broma  en  algunas  reuniones  en  las  que  hemos  coincidido,  dice,  por  ejemplo,  que  su  matrimonio ha sido como de 10 minutos, ¡pero debajo del agua! Que a la  “vieja” hay que tolerarla y seguirle la corriente.  —¿Te acuerdas, mi amor, lo felices que éramos hace 30 años?  A lo que ella contesta:  —¿Qué? ¡Hace 30 años no nos conocíamos!  —Por eso —contesta él—, éramos muy felices—y la risa se le escapa  después del comentario.  Yo sí creo que “entre broma y broma, la verdad se asoma.” \nUn día seriamente me dijo que de repente sentía que se le estaba  yendo la vida sin ser feliz. No se arrepentía de la esposa y los hijos que  tenía pero sentía que no estaba con la mujer que amaba.  —La quiero, —me dijo— pero no la amo. No me veo sin ella, pero no  soy feliz tampoco a su lado.  Constantemente busca relaciones fuera de su matrimonio que “le den  sentido a su vida” —palabras textuales.  —Es una excelente mujer, excelente madre de mis hijos, no tengo  nada que reprocharle porque siempre me ha querido y mucho, pero yo no  siento lo mismo. No me veo divorciado y mucho menos alejado de ella y  de mis hijos, además empezar de cero, ¡qué flojera a esta edad!  Viajan dos veces al año a diferentes partes del mundo, pero él procura  que esos viajes siempre sean en parejas, con amigos, para que no sea  aburrido.  Me pregunto cuántas parejas estarán viviendo la misma historia.  Prefieren vivir con alguien toda la vida por la comodidad o cierta  estabilidad, que disfrutar intensamente su vida.  Nadie dijo que el matrimonio es fácil, y el peor error en el que caemos  es no mantener la relación.  Crisis  matrimoniales  creo  que  la  mayoría  las  hemos  vivido  por  razones diversas, y esas crisis pueden ser a nuestro favor y no en nuestra  contra.  Como dijo Albert Einstein: “No pretendamos que las cosas cambien,  si siempre hacemos lo mismo. La crisis es la mejor bendición que puede  sucederle a las personas y a los países, porque la crisis trae progresos. La  creatividad nace de la angustia, como el día nace de la noche oscura. Es  en  la  crisis  que  nace  la  inventiva,  los  descubrimientos  y  las  grandes  estrategias. Quien supera la crisis, se supera sin quedar superado.”  Y en otro párrafo de este escrito de Einstein dice:  “La verdadera crisis es la crisis de la incompetencia. El inconveniente de  las personas y los países es la pereza para encontrar salidas y soluciones.  Sin crisis no hay desafíos y sin desafíos la vida es una rutina. Hablar de  crisis es promoverla, y callar en la crisis es exaltar el conformismo. En  lugar de esto, trabajemos duro. Acabemos de una vez con la única crisis  amenazadora, que es la tragedia de no querer luchar para superarla.” \n7 señales de alarma que nos dicen cuando una relación  está en crisis y es necesario actuar:  1  Cuando hay alejamiento físico.  2   Cuando  no  hay  comunicación  y  reina  la  indiferencia.  No  existe  un  diálogo  abierto  ni  constructivo.  3  Falta de ilusión a la hora de hacer planes. No me  entusiasma lo que hagas ni lo que hagamos.  4  Cuando existen más tristezas que alegrías.  5  Cuando aparece la desconfianza.  6   Cuando  se  nota  que  en  tus  prioridades  no  me  encuentro.  7   Cuando  ya  no  existen  esas  cualidades  que  me  hicieron amarte.  Por  supuesto,  cuando  existe  algún  tipo  de  violencia  entre  ambos  miembros de la pareja, es obvio que no hay futuro o el que se visualiza es  sumamente conflictivo y doloroso.  ¿Quién sigue creyendo que el amor debe ser sacrificio? ¿De dónde  sacamos esa errónea idea de que cuando se ama, se sufre?  El verdadero amor se demuestra en los hechos y con las palabras pero  siempre en forma recíproca.  ¿Por  qué  hay  quienes  prefieren  no  actuar  o  quedarse  paralizados  viviendo una vida de pareja insípida?  Hay  quienes  mantienen  una  relación  de  pareja  inestable  por  la  infelicidad que viven uno o ambos miembros sólo porque ya pasaron  mucho tiempo juntos, y lo peor es que ninguno de los dos hace nada por  mejorar la situación. Increíble pero cierto.  Esta  actitud  va  muy  acorde  a  un  estudio  publicado  en    Current  Psychology,  que afirma que en esas parejas la inversión de tiempo, dinero  y esfuerzo hace que las personas sean más propensas a quedarse en una  relación que ya no les satisface.  Las fases del amor \nEsperamos un alma gemela, un príncipe azul, la mujer perfecta... pero,  ¿qué  tanto  en  realidad  nos  estamos  buscando  a  través  de  nuestra  capacidad de amar? Si bien los objetos de nuestro amor se encuentran  fuera, dentro de nosotros sucede la verdadera acción, aquella que nos  inspira a emparejarnos con los demás.  El  amor  implica  varias  funciones  del  cuerpo  y  éstas,  a  su  vez,  se  presentan en menor o mayor medida en distintas etapas de la vida en  pareja. Para no hacerte el cuento muy largo, los científicos dividen el  proceso amoroso en tres fases:  — Deseo.  Es el flechazo. Las hormonas, como la testosterona y el  estrógeno, que regulan nuestros sistemas reproductivos, despiertan  una atracción y un deseo sexual por quien nos flechó.  —  Atracción.   Es  un  estado  de  euforia  que  solemos  llamar  “enamoramiento” o “amor pasional”. Le destinamos a esa persona  una atención focalizada y un montón de pensamientos obsesivos. En  esta fase padecemos algo muy similar a una adicción (los científicos  incluso  lo  comparan  con  el  estado  que  despierta  la  cocaína),  perdemos la noción del tiempo, se nos dificulta enfocarnos en otros  asuntos.  Todo  lo  anterior,  por  influencia  de  hormonas  como  la  norepinefrina, adrenalina y la dopamina.  — Apego.  Esta cara del amor es menos arrebatada, más apacible, y  funciona  para  afianzar  y  estabilizar  la  relación.  La  oxitocina,  la  vasopresina y las endorfinas producen una sensación de calma, paz y  complacencia al lado del ser querido.  De aquí surge la pregunta del millón: ¿El amor tiene una fase de declive?,  ¿trae consigo una etiqueta con fecha de caducidad?  El  principal  shock  viene  cuando  confundimos  el  enamoramiento  frenético de la etapa temprana con la versión más aterrizada del pasar de  los años. Creer que el amor pasional llega para quedarse es caer en un  grave  error.  Como  dice  el  dicho  budista:  “Todo  pasa,  nada  es  permanente.”  De  hecho,  algunos  investigadores  ubican  el  término  del  enamoramiento entre los 6 y los 18 meses.  Sucede lo siguiente: con el tiempo, el enamoramiento acumula tanto  kilometraje que empieza a requerir mantenimiento. Conforme se diluye el \nefecto,  lo  que  permanece  y  nos  vincula  es  el  apego.  Gracias  a  él,  decidimos quedarnos y poner de nuestra parte para prolongar la relación,  que se vuelve un acto de voluntad y decidimos amar. Digamos que es la  vacación de la vacación: luego del traqueteo del viaje, llega el momento  de arribar a casa a una etapa más estable y cotidiana.  Oxitocina: la molécula del amor  La  oxitocina  juega  aquí  un  rol  muy  importante.  Científicos  de  la  Universidad de Bonn, en Alemania, relatan que esta hormona se relaciona  con  la  atracción  y  las  conductas  que  fomentan  el  vínculo  entre  dos  personas.  Pero lo más impactante de sus estudios llegó con un experimento en el  que reclutaron a 57 hombres comprometidos en una relación monógama,  a  algunos  de  ellos  les  administraron  oxitocina  y  a  otros  no  (les  administraron, más bien, una sustancia falsa y estéril). Posteriormente,  una  mujer  atractiva  se  les  acercaba.  Los  científicos  tomaban  nota  del  interés  que  esto  les  despertaba.  Los  resultados  revelaron  que  los  que  fueron  afectados  por  oxitocina  preferían  mantener  mayor  distancia  respecto a la mujer.  Lo  que  los  investigadores  buscaban  comprobar  era  si  la  oxitocina  promovía los vínculos con nuevas personas (la mujer atractiva que se les  aproximaba  tentadoramente)  o  con  sus  parejas  (aunque  estuvieran  ausentes al momento del suministro). El estudio sugiere que lo que en  realidad provocó fue un mayor apego con sus parejas.  Por lo tanto, esto nos da a todos la pista de que aumentar la presencia  de esta hormona en nuestro organismo puede ayudarnos a estrechar los  lazos y fomentar la fidelidad con nuestras parejas.  Para la oxitocina también hay trucos  El investigador y escritor Paul J. Zak lleva doce años  estudiando  la  influencia  de  la  oxitocina  en  los  seres  humanos. Esta hormona, dice, es la base química de la \nconfianza  entre  las  personas,  aumenta  nuestra  consideración  hacia  ellas  y  nos  motiva  a  trabajar  en  conjunto hacia una meta común.  Producto de su revisión de estudios y sus pruebas de  laboratorio, el autor ha identificado excelentes formas  de  aumentar  los  niveles  de  oxitocina  en  la  sangre.  Comparto contigo algunos de sus más interesantes tips.  — Completa atención:  aparta cualquier dispositivo y  presta  toda  la  atención  de  tus  ojos  y  oídos  a  tu  interlocutor.  — Obsequios:  si le das un regalo a alguien, no sólo  recibirá  el  regalo  sino  una  agradable  descarga  de  esta hormona.  —  Comer  juntos:   disfruta  una  velada  tranquila  en  compañía de tu pareja.  — Abrazos y palabras de amor:  maneras físicas y  verbales de manifestar que alguien te importa.  — Meditación afectiva:  las técnicas meditativas que  se  enfocan  en  el  amor  o  la  compasión,  como  la  llamada  “ metta ”,  enriquecen  más  los  vínculos  sociales que otras como el método de  mindfulness.  El amor es de quien lo trabaja  “La  gente  cree  que  sus  feromonas  van  a  crear  de  alguna  forma  el  sentimiento del amor, o que su glándula pituitaria tomará el control y  secretará las hormonas correctas. Por el contrario, la gente tiene mucha  responsabilidad  en  el  amor  y  la  fidelidad  emocional  y  sexual  de  una  relación”, sentencia tajante el psicólogo y escritor John Gottman.  Así  que  dejemos  a  las  hormonas  hacer  su  trabajo  y  nosotros  aboquémonos a hacer el nuestro. Porque una cosa es clara: el amor inicial  no siempre predice el éxito de las relaciones. “El sexo, el romance y la  pasión no son magia; en realidad son muy simples”, continúa el profesor  Gottman.  En corto, la lección es que el frenesí del enamoramiento le sale fácil a  cualquiera y con cualquiera; en cambio, cultivar una relación armónica de \nlargo plazo es un arte.  Así que debemos arremangarnos, ponerle toda la actitud y fuerza de  voluntad, porque lo que sucede a nivel inconsciente requiere de una base  de esfuerzo consciente, dirigido a la meta de ser feliz en pareja.  Pongamos  una  muestra.  Una  investigación  de  la  Universidad  de  Toronto  midió  las  llamadas  “sexpectativas”  de  la  gente;  es  decir,  las  expectativas que tienen las personas sobre su vida sexual y la relación que  ésta guarda con la armonía en su pareja.  Tras entrevistarlos, el estudio separó a los 1 900 participantes en dos  grupos: los que creían en el “destino sexual” —quienes suponían que su  gozo  sexual  ya  está  predeterminado—  y  los  que  invertían  en  el  “crecimiento  sexual”  —quienes  perseguían  una  buena  vida  sexual  a  través del trabajo en pareja.  Mientras los creyentes del destino sexual medían su relación según su  vida  sexual  y  tendían  a  exportar  los  problemas  del  dormitorio  a  su  dinámica de pareja, los que preferían el crecimiento sexual trabajaban  para mejorar sus problemas en la cama y no permitían que estos afectaran  su satisfacción general como pareja.  Según la líder  de la investigación,  Jessica Maxwell, los  resultados  traen  consigo  algo  curioso:  aunque  las  mujeres  sean  las  principales  consumidoras de historias de amor de “almas gemelas” y matrimonios  que viven “felices para siempre”, los hombres parecen creerse más esos  cuentos.  Es  decir,  las  mujeres  tienden  a  creer  más  en  el  crecimiento  sexual y son más luchonas para sacar adelante la relación que los varones.  La reflexión del estudio canadiense es que la dinámica en pareja no es  diferente  al  resto  de  la  vida:  aquellos  que  se  esfuerzan  obtienen  una  mayor recompensa que quienes se quedan “papando moscas”.  Entendámoslo de una vez: no nos merecemos todo por bonitos o por  el hecho de haber nacido. Si una cualidad me gusta de la gente es su  hambre de superación o, como decimos en el norte de México, cuando  son “echados pa’ delante”. No hay hilos negros que descubrir en el amor  duradero. Entre más generosos seamos con nuestra pareja cada día, más  recibiremos de ella.  Más “te llevo en el pensamiento”  El amor también se refuerza en la realidad virtual de nuestra mente. Un \nestudio realizado por científicos ingleses descubrió que el soñar despierto  o  tener  ensoñaciones  con  personas  queridas  está  asociado  con  más  sentimientos de felicidad, amor y conexión.  Pensar en nuestra pareja, revivir escenas felices en su compañía y  visualizarnos a su lado tiene el potencial de reforzar el vínculo amoroso  con ella.  ASÍ QUE “PONER EL CUERNO” SUELE COMENZAR CON UN  ALEJAMIENTO MENTAL. SUCEDE QUE CEDEMOS A OTROS  POSTORES AQUEL LUGAR VIP QUE TENÍAMOS  ASEGURADO PARA NUESTRA PAREJA, A QUIEN POCO A  POCO DESPLAZAMOS A LAS ESQUINAS DE NUESTRA  MENTE.  Así que ¿qué tal esta idea? No desbanquemos a nuestros seres queridos. Y  es más fácil lograrlo cuando no les guardamos resentimiento en nuestro  corazón. Todos preferimos pensar en asuntos que nos traigan una sonrisa  y no un dolor de cabeza, así que atesorar los momentos felices y soltar los  desafortunados  es  la  mejor  táctica  para  tener  nuestra  relación  en  alta  estima  a  través  del  recuerdo.  Si  asociamos  nuestra  relación  con  sentimientos positivos, cuando haga su aparición, nuestra reacción mental  será de acogimiento y no de rechazo.  El hombre usa los ojos; la mujer, la memoria  Lucy Brown y Helen Fisher, investigadoras del Colegio  de Medicina Albert Einstein, en Nueva York, reclutaron  a un grupo de jóvenes recién enamorados para aprender  con exactitud qué partes de su cerebro se estimulan.  Conectados a escáneres de resonancia magnética, a  los hombres y mujeres se les mostraron imágenes de sus  amadas y amados.  Mientras  que  los  hombres  registraron  mucha  más \nactividad  en  la  región  del  cerebro  que  integra  los  estímulos  visuales,  las  mujeres  activaron  con  mayor  fuerza segmentos que administran la memoria.  La  doctora  Fisher  especula  que  esto  se  debe  a  la  misión que cada sexo tiene en la evolución de nuestra  especie: los varones recurren más a la vista para buscar  una pareja que pueda sobrellevar un embarazo y tener su  descendencia, mientras las mujeres atienden y registran  con más detalle las características que perfilan a alguien  como buen compañero y padre de familia.  Y tiene mucha lógica: los miembros de un sexo se  comportan según lo que los del otro buscan. Explica por  qué las mujeres invierten tanto en ropa, accesorios y el  cuidado  de  la  belleza  de  su  cuerpo,  y  por  qué  los  hombres  sacan  todo  su  arsenal  de  caballerosidad  y  detallismo durante el proceso de conquista.  Así que ¿pistas para mantener la llama amorosa?  No descuidar y reanimar justo esos elementos que  cada uno procuró para encenderla en el otro.  “¿No cree en la magia del amor?”, le preguntaron en entrevista a John  Gottman.  “Creo  que  es  una  mentira.  Significa  que  no  tienes  ninguna  responsabilidad de hacer que una relación funcione”, respondió.  Lo  parafraseo:  el  amor  puede  suceder  en  cualquier  momento.  El  flechazo  puede  llegar  de  pronto;  estamos  programados  para  eso.  El  verdadero reto es cómo hacer que ese amor se extienda y se ponga en  servicio de una relación prolongada y enriquecedora.  Reza el dicho: “Decidir es renunciar.” Un amor verdadero y maduro \nes tomar con firmeza una decisión: dar todo por nuestra pareja, acometer  con determinación los obstáculos para librarlos camino a nuestra meta.  También es un acto de renuncia: no caer en la tentación de otras personas  a la primera de cambios, renunciar a la flojera de creer que ya tenemos  todo asegurado en automático.  ¿Esperaremos  a  que  el  amor  nos  visite  por  aquí  y  por  allá  como  nómada o provocaremos que llegue para quedarse?  Gente asfixiante  Pero ¡qué horrible término! Sin embargo, a lo mejor tú has sido así o  convives con alguien así. O ¿por qué no? algún familiar vive una relación  de esta índole y sigue así por no poner un límite a tiempo.  Como me decía una conocida llamada Yolanda: “Si le busco y lo celo  es porque lo quiero, y mucho.”  “No puedo evitarlo, siempre quiero saber dónde está. La ansiedad me  mata, me consume cuando lo veo reír y contestar mensajes que  alguien  le  envía a su celular. No es que lo cele o dude, pero es mejor estar segura de  que soy la única persona en su vida a quien realmente ama.”  Son tantas las historias similares que quiero compartir en este libro  respecto a la gente extremadamente “asfixiante” que no se da cuenta.  ¿A  qué  me  refiero  con  parejas  asfixiantes?  Son  extremadamente  celosas, controladoras o posesivas; desean saber todo, absolutamente todo  de  quien  tanto  aman,  incluso  sus  pensamientos.  Su  inseguridad  la  manifiestan con ansiedad justificada por el intenso amor que sienten y la  poca confianza que tienen en la gente que rodea a su pareja. Buscan que  su pareja les dé la seguridad que les falta.  Y para aclarar más, te comparto las actitudes más comunes que tiene  una pareja asfixiante o inmensamente celosa:  1  Llama o envía mensajes al celular a cada momento, varios, muchos  para ver cómo estás o dónde andas, o con quién estás. Y si por  alguna  razón  esos  mensajes  no  tienen  respuesta,  se  imagina  las  escenas más intensas dignas de cualquier película erótica donde, por  supuesto,  el  protagonista  principal  eres  tú  con  otra  persona  que  obvio, no es él o ella. Para evitar tales pensamientos, es capaz de  llamar a personas que tienen que ver contigo para verificar si estás \ncon ellos o estás bien.  2   Busca  la  forma  de  revisar  tu  celular.  Investiga  las  posibles  contraseñas o con su ojo de lince intenta averiguar a distancia la  clave para desbloquear tu celular. De pasada, revisa tu cartera, los  olores de tu ropa y si le es posible, también te revisa los calzones.  3  No le agrada la idea de que salgas con amigos o amigas. Y si lo  haces, no habrá mejor compañía que la suya.  4  Más pleitos que momentos de tranquilidad. Y las dificultades son  generalmente porque no le das la atención que dice merecer.  5   Benditas  redes  sociales  que  nos  acercan  a  tantas  personas  pero  también  nos  alejan  de  los  más  cercanos.  Las  redes  sociales  son  también causa de grandes conflictos, separaciones y hasta divorcios.  A la pareja asfixiante le gusta publicar fotografías sobre lo felices  que son y desea que tú las publiques también, para que toda la gente  que te conozca vea el gran amor que se tienen. Y de pasadita, quiere  que pongas de foto en tu perfil de WhatsApp alguna donde estén  ambos abrazados o en casos extremos solamente la de tu pareja.  ¡Zas! ¿Así o más insegura?  Por supuesto, no faltará quien esté leyendo esta parte del libro y esté  justificando  que  así  es  porque  le  han  dado  motivos  suficientes  para  desconfiar o incluso, ya lo o la “pescó en la maroma” por no decir que en  “la movida”.  En esos casos nos debe quedar muy claro: la confianza se tiene o no se  tiene.  Si  deciden  luchar  por  la  relación,  el  tiempo  juega  un  papel  fundamental  para  cerrar  heridas  y  ganarse  nuevamente  esa  confianza  perdida. Se aclara lo que se tenga que aclarar y se lucha por la relación.  Meditar sobre las parejas celosas o asfixiantes me inspiró una de mis  frases  matonas,  que  espero  algún  día  sea  célebre:  “No  celar  puede  significar indiferencia o madurez; celar tantito, que te valoro mucho, celar  mucho, que no me valoro nada.”  En mi libro  El lado fácil de la gente difícil  comparto una historia real  y casi increíble, la de Arturo, hombre muy, pero muy celoso; es una  historia cargada de reproches hacia la esposa por dudas infundadas; ella  vive siempre humillada con las suposiciones más absurdas de probables  infidelidades. La última y más significativa fue querer saber todo nada \nmás y nada menos acerca de... ¡sus sueños! ¿En qué o con quién soñaba?  Era el martirio más grande de este hombre de un poco más de 50 años.  Cuando le pregunté si alguna vez ella le había dado algún motivo que  fortaleciera su duda me contestó que nunca. Pero que no se podía confiar  en una mujer, dijo, ése había sido el consejo de su padre, que en paz de  descanse.  Ya entrando en detalles y agregando razones por las cuales él tenía sus  dudas,  supe  más  cosas,  el  colmo  fue  enterarme  de  la  historia  de  sufrimiento de su madre ante la celotipia de su padre. La señora, de 72  años, enfermó de cáncer de seno, detectado tardíamente por una negativa  del marido, ¿sabes por qué? Ningún hombre o mujer debería ver los senos  de su esposa. Ella fue tratada sólo por doctoras de edad avanzada y a  regañadientes,  buscando  siempre  que  ningún  médico  varón  la  viera.  Cuando ella entró en agonía por la enfermedad (y no me refiero a toda la  agonía que vivió con ese carcamal celoso), el señor, con gran dolor o,  mejor dicho, con gran preocupación, expresó a la familia un temor más,  una incertidumbre que  lo consumía: al  morir su mujer  la gente de  la  funeraria la vería... ¡desnuda! ¡El colmo! Extraño, pero real. Con base en  esa historia de su padre, pueden entenderse, mas nunca justificarse, los  celos de aquel hombre, ¿no te parece?  Te comparto esta historia que hace algunos años me contaron:  Una madre y una hija estaban caminando por la playa. De pronto la hija le  pregunta:  —Mamá, ¿cómo se hace para mantener vivo un amor?  La madre mira con mucha ternura a su hija y le responde:  —Toma un poco de arena y cierra la mano con fuerza.  La joven así lo hizo y se dio cuenta que cuanto más fuerte apretaba la  mano, la arena se escapaba más rápido.  —Ahora —le dijo la mamá—, abre completamente la mano.  Así lo hizo su hija y vino un fuerte viento y se llevó consigo la arena  que quedaba en la mano.  La madre, siempre sonriendo le dijo finalmente:  —Ahora toma otra vez un poco de arena y mantenla con la mano  como si fuera una cuchara... lo suficientemente cerrada para protegerla y  lo suficientemente abierta para darle libertad. \nLa joven así lo hizo y vio que la arena no se le escapaba de la mano.  —Es así, como perdura el amor. \ne quedaría corto al expresar tantas historias de personas con  enfermedades graves que he conocido a lo largo de mi vida y  han decidido vivir a pesar de todos los pronósticos médicos.  Mi amiga María Alicia Urbaneja, venezolana de la cual compartí su  historia en mi libro anterior  No te enganches, Todo Pasa,  y a quien le  diagnosticaron  un  linfoma  de  células  del  manto  en  grado  avanzado,  adjudica la presencia de esta enfermedad a las emociones negativas que  vivió en su país desde el mandato de Hugo Chávez, hasta el de su sucesor  Nicolás  Maduro,  quienes,  como  sabemos,  han  llevado  al  país  a  la  inestabilidad económica y emocional de sus habitantes.  “Tanto  coraje  y  frustración  ocasionó  en  mí  una  posible  baja  de  defensas  que  se  manifestó  en  varias  enfermedades”,  incluyendo  la  anteriormente descrita.  Una enfermedad muy grave pero ella nunca se dio por vencida. Aun y  con el pesimismo de la primera doctora que la atendió, quien le expresó a  ella y a sus familiares el peor panorama, buscó una segunda opinión de un  médico que siempre mantuvo la esperanza de curarla. “¡Te vas a curar,  María Alicia!” palabras que le repitió una y otra vez. Ahora ella vive en  Santo  Domingo,  República  Dominicana,  con  mucha  salud  y  múltiples \nplanes para el futuro.  Mi padre, a quien desde hace 15 años se le diagnosticó cáncer de piel,  lo venció con quimioterapias y una dosis enorme de optimismo. Cinco  años después se le diagnosticó cáncer de próstata, al que venció también  con su fe en alto y posteriormente padeció un cáncer de páncreas. En  todas las ocasiones él dijo que se iba a curar. Siempre optimista, con una  capacidad de asombro fuera de lo normal, amante de la vida y todo lo que  conlleva, con una esposa cristiana con una fe inquebrantable que siempre  oró por su salud.  Mi  padre  falleció  el  año  pasado,  a  los  86  años,  pero  por  razones  totalmente diferentes a las del cáncer.  He coincidido en varias ocasiones con la sobrecargo del vuelo que me  lleva  a  casa,  Laura  Trejo,  con  más  de  27  años  de  servicio.  De  esas  mujeres  que  hacen  de  su  trabajo  un  arte  ya  que  brilla  por  su  profesionalismo y su eterna sonrisa. Al verme tan inspirado escribiendo  este capítulo del libro le comenté parte de su contenido. Sin dudarlo me  dijo: “Por supuesto que es una realidad la relación actitud-enfermedad.  Me consta al ver a compañeros y compañeras aprensivas o quienes hacen  de la queja una costumbre o quienes se nota que no les gusta su trabajo,  padecen más enfermedades de todo tipo.”  Podría seguir enumerando historias, pero yo sé que tú conoces alguna,  de quien contra pronósticos sombríos logró salir adelante por su actitud  positiva y su tratamiento oportuno; o alguna del segundo tipo, que con su  pésima actitud jala todas las enfermedades, tanto psicosomáticas como  reales.  Este  libro  es  para  decirnos  verdades:  ¿Son  la  salud  y  la  juventud  estados mentales?  Sí y no. Obviamente no lograremos la inmortalidad ni curarnos una  enfermedad terminal recitando un mantra. Y, sin embargo, la ciencia sí ha  podido unir ciertos puntos entre nuestras actitudes y nuestra capacidad  para enfrentar enfermedades y mejorar nuestra calidad de vida.  Para entenderlo debemos primero desmentir un mito. Muchas veces  reducimos la realidad a una serie de opuestos: que si nuestras acciones  son  triunfos  o  fracasos;  que  si  los  partidos  políticos  deben  ser  de  izquierda o derecha; que si las personas son buenas o malas.  De forma similar en nuestra cultura nos han enseñado que el cuerpo y  el alma son opuestos en pugna. En otras palabras, que la carne es una \ncárcel para el espíritu. Si esto fuese una verdad absoluta ni cómo pensar  que el alma (o el espíritu, la mente...) pudiera siquiera mover un poco los  rígidos barrotes de su celda corporal.  Pero esto no es del todo cierto. Ya lo decían en otras latitudes: en la  filosofía taoísta de China no existen los polos, más bien el yin y el yang  que simboliza que los aparentes opuestos son más bien complementos. En  algunas tradiciones surgidas en la India incluso se cree que la mente crea  la realidad en el universo, cuando acá nos enseñaron lo contrario.  La ciencia también respalda esta hipótesis. Una muestra clara de la  influencia de la mente sobre el cuerpo es el llamado “efecto placebo”, que  se da cuando un médico receta medicamentos falsos —o incluso somete a  cirugías  y  procedimientos  falsos—  a  pacientes  que,  a  pesar  de  ello,  mejoran sus cuadros de salud. Se ha comprobado que el suministro de  estas soluciones placebo puede causar importantes mejorías en síntomas  de dolor, enfermedades mentales y hasta en Síndrome de Parkinson, por  su intervención en distintos segmentos y neurotransmisores del cerebro.  En un estudio de la Harvard Medical School se comprobó que para la  depresión, el placebo (medicina falsa que indican al enfermo y cree que  puede  curar)  tiene  una  tasa  de  respuesta  de  entre  30%  y  40%.  Otro  investigador  de  la  misma  universidad,  el  doctor  Ted  Kaptchuk,  ha  descubierto algo impresionante en sus estudios del síndrome de intestino  irritable: el poder de la mente es tal que, aunque los pacientes fueron  informados de que sus medicinas eran falsas (hechas sólo con azúcar o  harina de maíz), presentaron el doble de mejoría respecto a los que no  tuvieron ningún tratamiento.  La  influencia  de  la  mente  sobre  el  cuerpo  implica  algo  muy  importante: que el bienestar no sólo es un juego de azar; es también un  juego  de  destreza  que  debemos  practicar  toda  nuestra  vida.  En  otras  palabras, estar y sentirnos bien física y emocionalmente es también una  decisión.  Así que ¿cómo logramos prevenir y sobrellevar con más eficacia las  enfermedades y nuestra vida de cara a la tercera edad?  Para responder esta pregunta, volvamos a la premisa de este libro:  actitud positiva. Y aquí hay que liberarnos de un hábito arraigado desde la  infancia, cuando nos aferrábamos con uñas y dientes a los cobertores para  faltar a la escuela: la bonita costumbre de quejarnos de todo. La queja es  nuestro deporte nacional y en este deporte el jugador estrella es siempre el \nmismo:  yo.  Un jugador además bastante caprichoso y socarrón. En vez de  tomar la vida y sus retos como vienen los ve con un filtro de negatividad  y egoísmo, desde la amargura en el diagnóstico: “¿Por qué me pasa esto a  mí?”  “¡¿Qué  hice  yo  para  merecerlo?!”,  hasta  el  fatalismo  en  el  pronóstico: “¡Y no la libro!”  Vale  la  pena  preguntarnos:  ¿alguna  vez  ha  servido  de  algo  la  preocupación?,  ¿qué  tal  si  mejor  nos  ocupáramos  en  encontrar  soluciones?  Recordemos:  estar  bien  es  una  decisión.  Para  tomarla,  necesitamos ser optimistas.  Y, de nuevo, a las pruebas me remito.  El poder de una buena actitud  Investigadoras  de  la  Universidad  de  Harvard  emprendieron  la  labor  titánica de revisar 200 estudios en los que encontraron que el optimismo y  las emociones positivas brindan protección contra las enfermedades del  corazón,  además  de  que  aparentemente  detienen  el  progreso  de  estos  males en caso de ya padecerlos.  “Las  personas  más  optimistas  registraron  aproximadamente  50%  menos riesgo de sufrir un episodio cardiovascular inicial en comparación  con las menos optimistas”, nos comparte Julia Boehm, investigadora de la  Universidad de Harvard.  Otra  publicación  de  la  misma  universidad  refiere  un  estudio  de  la  American Medical Association en el que entrevistaron a 589 personas una  vez al mes, durante 10 años para averiguar la percepción que tenían sobre  su  propio  envejecimiento.  El  resultado  fue  que  las  personas  con  una  actitud positiva hacia su camino a la tercera edad demostraron ser 44%  más propensas a recuperarse de sus enfermedades que aquellos con una  actitud negativa.  Otro estudio similar hecho por investigadores de la Universidad de  Yale reveló algo más impactante. Los científicos midieron la percepción  de los participantes sobre su envejecimiento por más de dos décadas;  descubrieron  que  quienes  lo  describían  positivamente  vivían  7.5  años  más. ¡Sí, 7.5 años! \nEl artículo revela incluso que esta inclinación por ver el lado amable  de las cosas tiene un mayor impacto en nuestra expectativa de vida que  otras medidas como cuidar el colesterol, evitar la hipertensión o dejar de  fumar. \nTiene sentido, ¿no? Entre más positiva sea nuestra visión del mundo, más  gozaremos  de  nuestra  vida  y,  entre  más  nos  agrade  ésta,  más  ganas  tendremos de librar cualquier obstáculo y permanecer en la aventura.  Actitud negativa: los villanos también tienen poderes  Ahora volteemos la tortilla: si las emociones positivas nos ayudan a sanar  y prevenir, ¿las negativas nos pueden enfermar?  La  revista    Time   hizo  un  recuento  de  estudios  científicos  con  los  siguientes resultados: la gente que con frecuencia guarda sentimientos de  negatividad y desconfianza es más propensa a ser víctima de demencia y  enfermedades del corazón; las personas hostiles y poco amistosas tienden  a sufrir más infartos que las más amables; además, aquellos que padecen  de depresión tienen mayor riesgo de tener diabetes, ataques al corazón y  distintas discapacidades.  Al respecto, la doctora Emiliana Simon-Thomas, de la Universidad de  Berkeley,  nos  da  dos  noticias:  ¿la  mala?  Nuestros  sentimientos  y  pensamientos negativos pueden afectar nuestras funciones metabólicas,  hormonales  e  inmunitarias,  además  de  que  nos  orillan  a  tomar  malas  decisiones (alcoholismo, tabaquismo, sedentarismo, etcétera); ¿la buena?  ¡El  cerebro  es  como  plastilina!  Con  nuestros  hábitos  y  pensamientos  podemos moldear literalmente la estructura de nuestras neuronas.  Esto significa que podemos recomponer el rumbo abriendo nuevas  brechas.  La actitud es un complemento  No por cobijarnos la cabeza nos vamos a destapar los  pies,  ¿verdad?  En  otras  palabras,  no  por  tener  una  actitud positiva dejaremos de adoptar buenos hábitos,  alimentarnos  sanamente,  hacer  ejercicio  y  acudir  al  médico.  Sentirnos  jóvenes  es  importante  en  tanto  que  no  ignoremos la realidad de que habitamos un cuerpo que  envejece físicamente. La ciencia tampoco ha encontrado  evidencia suficiente que nos confirme el poder de las \nemociones  sobre  enfermedades  terminales  como  el  cáncer.  Tampoco es sabio ir por el mundo evangelizando a  quienes  están  en  una  peor  posición  que  nosotros.  A  veces no es fácil minimizar los males y sentimientos de  los demás soltando un simple “no pasa nada, hombre;  todo está bien”. Cada quien vive una fase única y lleva  su proceso de forma diferente, así que no metas nada  con calzador.  Recordemos  que  todo  es  un  círculo  virtuoso  compuesto de muchos elementos, y la actitud positiva es  uno más en la ecuación. Debemos diversificar siempre  nuestro portafolio de bienestar.  Golpe de timón  Las  emociones  suelen  controlarnos  más  de  lo  que  nosotros  a  ellas.  Seguramente  has  sentido  esa  sensación  de  estar  poseído  por  fuerzas  ajenas e incontrolables, sobre todo si tienen su origen en un problema de  salud.  ¿Es posible domar estas bestias?, ¿podemos adoptarlas con gusto en  nuestro corazón para luego cambiarlas fundamentalmente?  Antes que nada, debemos empezar desde donde estamos. Mientras que  algunos parten de una perfecta salud pero con malas actitudes, habrá otros  que sufran enfermedades y sin embargo pinten siempre una sonrisa en su  rostro. Independientemente de esto, lo que importa es ser honestos a la  hora de evaluar nuestro punto de partida y luego tener la suficiente fuerza  de voluntad para dar los primeros pasos. Antes de echarnos a correr hay  que aprender a gatear.  Desde  este  diagnóstico  sincero  podemos  entonces  encontrar  y  entender la raíz de nuestros problemas afectivos. Los sentimientos a flor  de  piel  son  signos  que  delatan  nuestra  reacción  a  las  cosas  que  nos  suceden.  Sigue  el  hilo  del  que  penden  para  llegar  a  la  razón  que  los  origina.  Pregúntate: “¿Cuál es la creencia que sustenta mis miedos o enojos?”  “¿Se basa en una realidad del presente o más bien en una suposición \nproyectada al futuro?”  Quizá  descubras  un  miedo  profundo  a  la  muerte,  un  vacío  de  incertidumbre sobre tu salud futura o una rabia punzante que reclama la  injusticia de que esto te suceda a ti.  Acoge estos hallazgos con una actitud de aceptación. No reacciones a  tus emociones negativas como si fueran una camisa de fuerza de la que te  quieres liberar a toda costa.  Tampoco reprimas los sentimientos negativos ni fuerces los positivos.  ¿Es posible eliminar el olor de una pila de basura rociándole perfume  Chanel?  Lo  mismo  sucede  cuando  intentas  cubrir  tus  sentimientos  negativos  con  una  capa  de  otros  positivos.  Deshaz  los  nudos  de  los  primeros antes de empezar con los segundos.  Remítete a los hechos para facilitar ese sentimiento de aceptación: las  complicaciones de salud y las emociones son parte de la vida; la muerte  es parte del ciclo del planeta; el futuro no existe aún, no vale la pena  preocuparte por suposiciones.  Trata  de  inyectar  una  dosis  de  sentido  del  humor.  Las  situaciones  difíciles vienen acompañadas de una carga exagerada de gravedad, pero  lo  cierto  es  que  el  ser  humano  tiene  una  capacidad  extraordinaria  de  adaptación y a la larga cambia la reactividad por la aceptación. La vida no  es tan seria después de todo.  UNA VEZ QUE FIJES UNA BASE MÁS ESTABLE, AHORA SÍ  PODRÁS CULTIVAR ACTITUDES Y SENTIMIENTOS  POSITIVOS. COMO VERÁS EN TODO ESTE LIBRO: LA  GRATITUD, LA GENEROSIDAD, EL ENFOQUE EN EL AQUÍ Y  EN EL AHORA SON SÓLO ALGUNAS DE LAS  HERRAMIENTAS PARA CONSEGUIRLO.  Una mente dedicada a apreciar la vida de tiempo completo no da cabida a  lamentaciones y demás fantasmas peores.  Esto nos anima a dar un giro trascendental. La vida no es simplemente  lo que nos toca por suerte o destino; es también aquello que nosotros  provocamos con cada una de nuestras decisiones. En vez de cruzarnos de  brazos y suspirar como meros espectadores pasivos, o de plano unirnos al  lado oscuro del pesimismo, podemos tomar la decisión de estar mejor y \nser mejores con plena consciencia.  ¿Permanecerás con complacencia en el asiento trasero de tu vida o  tomarás el volante para conducirla hacia mejores parajes?  La sabiduría que dan los años  En este capítulo repasamos lo que la ciencia recomienda para ser sano y  feliz en la tercera edad, pero vale la pena también leer los consejos de  vida que los más veteranos nos regalan al resto.  El profesor Karl Pillemer de la Universidad de Cornell emprendió un  maravilloso programa llamado  The Legacy Project.  En él le preguntó a  1500 ancianos lo siguiente: “¿Cuáles son las lecciones más importantes  que has aprendido durante el transcurso de tu vida?”  Comparto contigo algunas de las mejores respuestas:  —  Un hombre de 75 años: “No eres responsable por todas las cosas  que te suceden, pero estás en completo control de tu actitud y tus  reacciones hacia ellas.”  —  Una persona de 84 años: “Adopta una política de estar alegre.”  —  Una mujer de 90 años: “Aprendí a estar agradecida por lo que tengo  y ya no lamento lo que no tengo o lo que no puedo hacer.”  —   Un  hombre  de  80  años  sobre  el  envejecimiento:  “Abrázalo  y  acéptalo. No luches contra eso. Envejecer es tanto una actitud como  un proceso.”  —  El mismo hombre aconseja a los jóvenes: “No pierdas el tiempo  preocupándote por envejecer.”  —  Una mujer de 92 años: “Creo que soy más feliz ahora que nunca en  mi vida. Las cosas que me parecían importantes ya no lo son o no lo  son tanto.”  —  Por último, alguien más comentó: “Cada década, cada edad, tiene  oportunidades que le faltaban a etapas anteriores.”  En  general,  gracias  al  proyecto,  nos  enteramos  de  que  envejecer  ha  superado por mucho las expectativas de la mayoría de los participantes.  Incluso  aquellos  con  enfermedades  crónicas  se  sienten  tranquilos  y  contentos. \ni amigo, el padre Juan José Martínez, sacerdote desde hace  muchos años me dijo una vez: “Entre más trabajo tengo, más  oración  debo  hacer.  Si  no,  ¡me  apago!,  ¡me  desmotivo!  y  caigo en una especie de rutina sin encontrar el verdadero sentido al  ministerio que realizo. No es que tenga que ir a retiros espirituales,  necesito  los  retiros  espirituales  para  seguir  con  esta  vocación  que  tanto amo.”  Una gran verdad ya que todo su trabajo tiene que ver con el servicio al  prójimo y en ayudar a los demás a encontrar el camino correcto hacia la  paz interior. Me identifico de cierta forma con él, no por el tipo de trabajo  que  tengo  sino  por  los  momentos  de  soledad,  oración,  meditación  y  ejercicio que tengo que hacer para realizar mi trabajo.  Tengo años que convertí en hábito las acciones anteriores y de entre  ellas quiero enfatizar en el ejercicio, no por ser más importante que las  otras descritas, pero cuando no lo hago mi nivel de tolerancia disminuye,  mi estrés se eleva y la carga de trabajo la siento mucho más pesada.  La actitud y el ejercicio forman un increíble círculo virtuoso. Con la  actitud hacemos acopio de la fuerza de voluntad necesaria para iniciarnos  en  el  hábito  del  ejercicio,  mientras  que  con  la  actividad  física  alimentamos nuestra actitud con una descarga de hormonas. \nEn la acera opuesta reside el círculo vicioso de la negatividad y el  sedentarismo.  La  negatividad  nos  drena  la  motivación  y  con  el  sedentarismo dejamos enlatada la gasolina con la que echamos a andar el  cambio.  La mudanza al lado virtuoso comienza con el convencimiento. En este  apartado la evidencia hablará por sí misma, y hablará muy fuerte, pues el  ejercicio  es  uno  de  los  remedios  más  universales  que  conoce  el  ser  humano.  El sedentarismo también mata, no sólo ataranta  Las sociedades con hábitos más tradicionales son más longevas y felices.  Muchas  veces  descartamos  lo  tradicional  por  confundirlo  con  lo  anticuado.  Éste  no  es  el  caso.  Sólo  significa  que  sus  costumbres  conservan maneras de vivir más apegadas a nuestra biología original y,  por lo tanto, tienden a ser más saludables.  La Historia grabó un antes y un después de la Revolución industrial.  Para bien y para mal. Sin la asistencia de maquinaria muy sofisticada en  su  día  a  día,  a  nuestros  antepasados  la  actividad  física  les  era  completamente  natural:  sus  trabajos,  sus  traslados  y  hasta  sus  pasatiempos les exigían siempre una cuota básica de movimiento.  La cuota poco a poco se dejó de cumplir. En la mayoría de nuestras  ciudades, las máquinas se adueñaron de los trabajos más demandantes,  los autos nos llevan de un lugar a otro y la tecnología nos ancla al sofá de  la sala.  Si lo piensas, a oídos de las personas de siglos antepasados sonaría  ridículo  nuestra  clásica  aspiración  de  “voy  a  hacer  ejercicio”.  Simplemente era algo que hacían naturalmente, “sin querer”. En cambio,  nuestro estilo de vida es tan ocupado pero a la vez tan pasivo que le  hemos tenido que buscar un espacio en la agenda a la actividad física.  Mientras que ellos se ejercitaban para sobrevivir, nosotros vivimos para  ejercitarnos... pero muy de vez en cuando.  Según la Unesco, el sedentarismo causa anualmente 3.2 millones de  muertes  prematuras  en  el  mundo,  lo  que  equivale  a  un  6%  de  las  defunciones totales. La organización también reveló que, en 2008, poco  más  de  1  533  millones  de  personas  no  practicaban  de  forma  regular  alguna actividad física. \nLa buena noticia es que, a pesar de las mañas de la vida moderna,  ejercitarnos aún está ahí como posibilidad de redención. Un análisis de  The Lancet  tomó 16 estudios científicos sobre el ejercicio y los efectos de  sentarse por tiempos prolongados frente al televisor. Las personas que, a  pesar de estos hábitos, tuvieran actividad física moderada constante (60  minutos al día) parecían disminuir el riesgo de muerte que se asocia con  sentarse por mucho tiempo.  En otras palabras, hay esperanza de revertir los daños aun para los  sedentarios en serie.  ¿Parálisis por análisis?  Tomar una decisión intimida, sobre todo si alrededor del tema hay una  bruma de desconocimiento e incertidumbre. Lo digo porque al ejercicio le  tenemos un miedo inmerecido.  Muchos  piensan  que  necesitamos  un  entrenador  que  nos  aconseje  rutinas  sofisticadas.  Unos  más  asumen  que  esas  actividades  son  simplemente incompatibles con su rutina. Otros tantos esgrimen la clásica  excusa del “me gustaría, pero no tengo tiempo”.  Estas ideas no son del todo ciertas.  El  ejercicio  no  tiene  por  qué  ser  cosa  del  otro  mundo.  Cualquier  movimiento  frecuente  califica  como  tal.  Nos  sobran  actividades  muy  cotidianas y terrenales con las que podemos palomear nuestra dosis diaria  de activación física: caminar, cortar el césped del jardín, hacer el aseo,  lavar el coche. No necesita ser arduo para ser beneficioso.  Tampoco nos tiene que robar tanto tiempo. Según la Organización  Mundial  de  la  Salud,  un  adulto  promedio  necesita  150  minutos  de  activación física; es decir, cinco días de la semana en los que le dedique  30 minutos. ¿De verdad no podemos invertir 1.5% de nuestro tiempo a  algo que nos retribuirá tanto en cantidad y calidad de vida?  “Para  personas  muy  sedentarias,  los  primeros  20  minutos  de  movimiento  proveen  la  mayoría  de  los  beneficios  del  ejercicio  en  su  salud:  una  vida  más  prolongada,  una  reducción  de  riesgo  a  padecer  enfermedades.”  Nos  dice  Gretchen  Reynolds,  autora  del  libro    Los  primeros 20 minutos. \nLos microejercicios que todos hacen sin saberlo  Golpeteo  de  dedos  sobre  el  escritorio,  zapateo  en  la  alfombra, asentir con la cabeza en series de diez... todas  rutinas  clásicas  de  oficina  por  las  que  nadie  se  lleva  crédito.  Las personas nerviosas y obsesivas son los “atletas  de alto rendimiento” de estas disciplinas. Un estudio de  la  Clínica  Mayo  develó  que  los  “movedores”  compulsivos queman hasta diez veces más calorías que  los más quietos.  Las investigaciones sugieren que la consistencia en  esos  pequeños  ejercicios  puede  causar  un  mayor  impacto  que  la  actividad  física  rigurosa  pero  menos  frecuente.  Por ejemplo, ocho horas de movimiento constante de  pies pueden equivaler a una sesión de gimnasio o a 30  minutos de jugar squash.  Reacción en cadena  Bastan unos cuantos minutos para empezar a hacer la diferencia. Cuando  analizan la sangre de participantes después de sus rutinas, investigadores  han encontrado que los resultados positivos comienzan inmediatamente  después o incluso durante la activación física.  Y vaya que no es cualquier cosa. Según un estudio de la Universidad  de  Sídney,  ejercitarse  desencadena  no  una  ni  diez,  ni  cien,  sino  mil  reacciones  moleculares  que  suceden  en  cascada  dentro  de  nuestros  músculos, regulando la operación de nuestro metabolismo e insulina.  Esto sucede en un cuerpo en movimiento: los músculos comienzan a  incrementar  su  demanda  de  oxígeno.  El  corazón  atiende  la  solicitud  aumentando la presión y acelerando su ritmo. El cerebro interpreta todo  esto como síntomas de estrés (estamos programados biológicamente para  asumir  que  el  ejercicio  equivale  a  pelear  o  huir  por  nuestra  supervivencia).  Para  contrarrestar  la  amenaza,  el  cuerpo  produce \nproteínas  como  el  Factor  Neurotrófico  Derivado  del  Cerebro  y  libera  químicos como endorfinas, serotonina y norepinefrina, que en conjunto  alivian el desgaste físico y mental, además de que ocasionan un estado de  euforia.  El profesor MK McGovern afirma que la liberación de estos químicos  es adictiva y el cuerpo requiere de aumentar la cantidad de ejercicio para  obtener más dosis en el futuro.  Esto implica dos cosas: 1) si nunca has hecho ejercicio, las primeras  semanas  estarás  radiante  y  extasiado  debido  a  que  no  estabas  acostumbrado a las descargas hormonales que produce; 2) ya que tengas  el hábito, tu cuerpo solito te seguirá demandando más actividad en busca  de esas sanas descargas de placer.  “¿Y yo qué gano con eso?”  En mi clavado en la literatura de investigación, encontré una infinidad de  beneficios para el cuerpo y la mente. Explicarlos todos necesitaría tantas  páginas del libro que pondría en serios aprietos a la editorial.  Por  mencionar  algunos  en  los  que  el  cuerpo  es  el  beneficiario:  optimiza  tus  ciclos  de  sueño,  inhibe  el  crecimiento  de  células  cancerígenas,  mejora  el  desempeño  de  los  espermas,  forma  nuevas  neuronas  en  tu  cerebro,  contrarresta  los  efectos  de  la  contaminación,  disminuye algunos daños provocados por el alcohol y previene la diabetes  y las enfermedades del corazón.  La  mente  tampoco  se  puede  quejar.  La  activación  física  libera  el  estrés,  ayuda  contra  la  depresión,  instala  un  sentimiento  de  calma  y  felicidad con la producción de endorfina, serotonina y dopamina. Vaya,  hasta combate varios síntomas de la esquizofrenia.  Entonces,  “¿ejercitarse  es  como  tomar  un  antidepresivo?  No  exactamente. Más bien, no ejercitarse es como tomar un depresivo.” Nos  dice el escritor Tal Ben-Shahar.  Pero ahondemos en las mejoras en nuestras habilidades mentales. El  del ejercicio es un hábito, en la medida que establece una base de sentir y  pensar  bien,  de  actitudes  y  aptitudes,  los  demás  hábitos  sanos  se  facilitarán por puro efecto dominó. Recuerda: EL EJERCICIO MEJORA  LA MEMORIA.  Un  estudio  del  Dartmouth  College,  en  New  Hampshire,  puso  en \nevidencia  la  importancia  de  los  efectos  del  ejercicio  constante  en  la  memoria y el bienestar mental de las personas.  Los investigadores mostraron una serie de objetos a los participantes,  quienes  debían  contestar  si  los  habían  visto  antes  o  no.  Luego,  los  dividieron en dos grupos: uno que sometieron a una rutina de 30 minutos  de  ejercicio  aeróbico  diario  durante  un  mes  y  otro  que  permaneció  sedentario.  Tras este periodo, ambos grupos regresaron a tomar la misma prueba.  Ocurrieron dos grandes hallazgos: aquellos que se habían ejercitado todo  el mes progresaron en sus calificaciones de memoria y bienestar afectivo,  pero  también  los  que  además  se  ejercitaron  el  mismo  día  del  nuevo  estudio (algunos no lo hicieron) obtuvieron las mejores notas en general.  En otras palabras, la constancia del pasado deja una estela positiva,  pero cumplir con la tarea en el momento nos retribuye justo en eso: en  mejorar  nuestra  memoria  y  de  inmediato:  AUMENTA  LA  PRODUCTIVIDAD.  Investigadores  de  la  Universidad  de  Bristol,  en  el  Reino  Unido,  trataron de descubrir si existe una relación entre ejercitarse en días hábiles  y el bienestar de los empleados en sus lugares de trabajo.  En los días de activación física, el humor de las personas mejoraba  significativamente. En los días sin activación, el humor se estancaba en  los niveles cotidianos, incluso empeoraba (por ejemplo, los empleados se  sentían menos calmados).  El  estudio  comprobó  que  integrar  la  rutina  del  ejercicio  a  los  empleados  los  ayuda  a  recargar  energías,  concentrarse,  resolver  problemas,  estar  tranquilos  y  ser  sociables  con  sus  compañeros:  INCENTIVA LA CREATIVIDAD.  Científicos de la Universidad de Leiden, en Holanda, diseñaron dos  exámenes:  uno  en  el  que  pedían  a  los  participantes  inventar  formas  diferentes de usar un mismo objeto (en este caso una pluma) y otro que  les requería encontrar el común denominador entre tres palabras.  Los participantes contestaron las pruebas mientras pedaleaban en una  bicicleta estacionaria. Los que tenían el hábito de ejercitarse al menos  cuatro veces a la semana fueron más creativos en sus respuestas que los  que carecían de él.  Mientras que a los sedentarios les costaba lidiar con el ejercicio y la  prueba al mismo tiempo, a los más deportistas no sólo les era fácil, sino \nque también veían mejorada su creatividad en tiempo real: ¡ENFOCA TU  ATENCIÓN!  Un estudio de la Universidad de Illinois, reveló que los niños que se  ejercitaban con regularidad demostraron tener mejor función cerebral y  desempeño cognitivo. Las mejoras ocurrieron en el control ejecutivo del  cerebro: inhibición (resistirse a las distracciones, mantener el enfoque),  memoria operativa y flexibilidad cognitiva (alternar tareas).  Otros estudios demostraron que el ejercicio mejora las notas de los  niños con déficit de atención e hiperactividad. Los beneficios son tales  que  el  profesor  de  Harvard,  John  Ratey,  califica  el  ejercicio  como  medicamento: aún con actividad física muy ligera, el desempeño mental  se ve beneficiado con una liberación de dopamina y serotonina similar a  medicinas estimulantes como el Adderall.  A mayor edad, más necesidad  El hábito cobra mayor relevancia conforme nos acercamos a la tercera  edad. El ejercicio desacelera nuestro declive físico y mental, además de  ser  un  importante  aliado  para  prevenir  y  sobrellevar  enfermedades  asociadas  con  el  envejecimiento  como  osteoporosis,  Alzheimer  e  hipertensión.  También  vale  la  pena  diversificar.  Estudios  han  demostrado  que  diferentes  ejercicios  conducen  a  distintos  resultados.  Uno  de  los  experimentos  comparó  los  efectos  en  la  memoria  de  los  ejercicios  aeróbico y de resistencia en adultos de la tercera edad. Aunque aquellos  que practicaron los dos tipos mejoraron la memoria espacial, sólo los que  practicaron ejercicio aeróbico experimentaron una diferencia positiva en  su memoria verbal. Otro estudio halló que los cerebros de las mujeres que  hicieron rutinas de pesas dos veces por semana se encogieron menos que  las que recurrieron sólo a ejercicios de estiramiento.  En un estudio en Bruselas, Bélgica, científicos tomaron una biopsia de  las  piernas  de  diez  personas  saludables;  les  ordenaron  correr  por  45  minutos en bicicletas estacionarias para luego recoger otra muestra de sus  extremidades a fin de hacer una comparación.  Hallaron  que  con  cada  rutina  de  ejercicio  moderado  la  capa  de  protección de sus telómeros se revitaliza, lo que retarda el proceso de  envejecimiento. Los telómeros son secciones de los cromosomas que se \nacortan cada vez que nuestras células se dividen. Estos con el tiempo se  desgastan, lo que atrofia la capacidad que tiene el ADN de nuestro cuerpo  para rejuvenecerse.  Para hacerte el cuento corto, el ejercicio puede extender la vida de una  persona hasta cinco años. Y no sólo extiende la vida, sino también la vida  útil porque preserva las condiciones mentales que nos permiten seguir  siendo productivos en el mundo.  El hábito  Amamos la ley del mínimo esfuerzo. Y demostramos ese amor en los  pequeños  detalles:  preferimos  estirarnos  al  máximo  para  alcanzar  el  control remoto en vez de levantarnos y dar unos pasos para recogerlo;  llegamos a una plaza comercial y rondamos como buitres los lugares de  estacionamiento más cercanos a la puerta en vez de caminar y llegar más  rápido.  ¿Cómo romper ese hábito tan enraizado de hacer lo menos posible?  Déjame compartir contigo algunas ideas.  —  Un ejercicio que te guste. Lo que haces por placer se hace más y  mejor  que  lo  hecho  por  manda.  Elige  como  si  escogieras  un  pasatiempo, no un deber.  —  Hazlo en equipo. No sólo será más divertido, también con la ayuda  de tu círculo de amigos formarás una caja de resonancia llena de  ecos positivos que reforzarán tu compromiso.  —   Propósito  a  propósito.  No  somos  buenos  para  atender  tantas  actividades a la vez. Cuando acometas tu objetivo de crear un buen  hábito de ejercicio, dedícate a consolidar eso y sólo eso al menos por  un tiempo.  —  No te quedes quieto. Sé consistente. El sedentarismo es más cruel  con los que lo consienten por largas temporadas. Además de adoptar  una rutina fija, también infiltra uno que otro ejercicio durante tus  horas pasivas en la oficina. Por lo menos, camina cinco minutos  entre hora y hora laboral.  —  Diversifica. Como vimos, diferentes acciones producen diferentes  resultados. Trata de dedicarle un tiempo a cada tipo de ejercicio:  aeróbico, de fuerza, de flexibilidad... \nPero  esto  debería  bastar  para  resolver  la  encrucijada:  Entre  tu    yo  sedentario,  ése  que  es  exasperado,  débil,  torpe,  con  las  horas  más  contadas, y tu  yo  deportista, el más delgado, joven, feliz e inteligente,  ¿quién merece recibir el triunfo?, ¿se lo darás por decisión unánime? Y  no hagas trampa postergando esta pregunta: la indecisión también es una  decisión, ¡aguas! \nEstoy de acuerdo con lo que me dices papá, pero por más que  quiero dormir más, ¡no puedo! Me quedo viendo la tercera  temporada y ya que me quiero dormir, pongo otro capítulo y  luego reviso mi Facebook antes de dormir —me dijo mi hijo.  —César, tienes que dormir diariamente más de 8 horas por tu edad.  —¿Qué?, ¡8 horas! Sólo los domingos —me dijo. Tú sabes que me  levanto ese día tarde y duermo como 10 horas y ahí me recupero.  ¿En serio se recupera? Estoy seguro que no.  He  visto  que  cuando  mi  hijo  duerme  menos  de  5  horas  está  más  irritable y desconcentrado de lo que debe estar.  No sólo lo veo en él, lo he visto en mí, pues cuando estoy desvelado  me pongo más irritable y mi nivel de tolerancia disminuye.  Durante varios años fui sumamente metódico y no importaba la hora a  la que me dormía porque siempre me levantaba a las 5:45 A.M. para irme  al gimnasio que estaba cerca de mi casa.  “Todo sea por la salud” me repetía cuando me levantaba después de  haber llegado muy tarde a mi ciudad por los típicos retrasos de vuelos y  despertaba somnoliento, cansado y con la sensación de no haber dormido  nada o como si las 4 horas de sueño hubieran sido sólo 20 minutos. \nAhora  que  pasó  el  tiempo  y  tengo  conocimiento  de  todas  las  investigaciones  que  te  compartiré,  descubrí  que  levantarme  a  hacer  ejercicio nada tenía que ver con mi salud.  En mi afán de mantenerme delgado y en forma —por no decir buenón  — descubrí que no bajaba de peso, al contrario, ¡subía de peso! Mi esposa  —nutrióloga— me decía que era porque estaba desarrollando músculo y  sinceramente al verme en el espejo no veía más de 5 kilos de músculo  adicional en mi cuerpo.  El  conocimiento  da  seguridad  y  modifica  hábitos.  Gracias  a  mi  programa de radio he podido conocer a especialistas de primer nivel en  diferentes  áreas  que  me  han  sorprendido  con  información  relevante  y  actualizada.  Ahí descubrí la razón de mi ligero sobrepeso a pesar del ejercicio  diario que realizaba.  No dormir mínimo las 7 horas recomendadas para mi edad, hace que  el cuerpo no realice todas las funciones de desintoxicación y descanso  necesario. Además, el andar cansado y somnoliento durante el día, el  cuerpo lo interpreta como falta de energía y como sabes, el cuerpo es  sabio y pide energía, generalmente comida con azúcar que se supone  necesita, cuando lo que realmente requiere son horas de sueño. ¿No te  parece lógico?  Ahora entiendo porque mi querido México es un país de desvelados y  por eso tiene el primer lugar en obesidad en el mundo.  No quiere decir que toda la gente obesa que vemos no duerma el  tiempo recomendado, pero sí puedo afirmar que la gran mayoría tendrá  relación con esto.  Don Ricardo, es un hombre apasionado de las reglas gramaticales.  Sabe cómo decir las cosas de manera correcta y utilizar el vocabulario lo  más cercano a la perfección. Ha escrito múltiples libros sobre el tema y  además es un hombre admirable por su inteligencia y su gran corazón. No  deja de sorprenderme la cantidad de libros que ha escrito en los últimos  15 años y por lo que veo hay años en los que publica hasta dos libros,  además de sus intervenciones en programas de televisión y sus múltiples  publicaciones en uno de los principales diarios de México.  Al preguntarle a qué hora lo hace, me contestó que durante la noche.  Que su cuerpo ya se acostumbró a dormir muy pocas horas, dos o tres  cuando mucho. \nEsto va en contra de muchas teorías que dicen que la capacidad de  asociación de ideas y la inteligencia son directamente proporcionales a la  capacidad de descanso.  Don Ricardo es un hombre afable, inteligente, con una plática amena  y divertida. No veo en él estragos relacionados por el mal dormir y estoy  convencido que, como en todo, puede ser un caso aislado y no por eso  quiere decir que todos podríamos ser como él.  Una de esas excepciones que asombrarían a cualquier especialista en  sueño.  Recomiendo  que  antes  de  imitar  a  este  gran  escritor,  leas  las  sorprendentes  investigaciones  que  a  continuación  he  preparado  especialmente para ti.  Te puedo asegurar que si duermes poco, harás el esfuerzo por dormir  más, ya que en un mundo en el que el tiempo es el recurso más escaso, el  sueño es el principal candidato al sacrificio. Muy mal hemos convertido  el déficit de horas en déficit de sueño y el grave problema está en los  daños  colaterales  que  sufre  nuestra  calidad  de  vida.  Como  diría  mi  abuela: “Nos puede salir más caro el caldo que las albóndigas.”  Según una encuesta de la Fundación Nacional del Sueño, en Estados  Unidos,  menos  de  la  mitad  de  los  canadienses,  estadounidenses  y  mexicanos reportan dormir bien durante todas o casi todas las noches de  los días laborales.  EL PATRÓN SE REPITE EN TODAS LAS EDADES EN  NUESTRO PAÍS. “ALREDEDOR DEL MUNDO, LOS NIÑOS  MEXICANOS SON LOS QUE MENOS DUERMEN. CONFORME  A ENCUESTAS REALIZADAS EN LA UNIVERSIDAD  AUTÓNOMA METROPOLITANA, UNIDAD IZTAPALAPA, SE  DEMOSTRÓ QUE LOS INFANTES EN MÉXICO DUERMEN  HASTA TRES HORAS MENOS EN PROMEDIO DE LO QUE  DEBERÍAN”, DECLARA YOALY ARANA LECHUGA,  MIEMBRO DEL SISTEMA NACIONAL DE INVESTIGADORES  DEL CONACYT.  ¿Cuáles son los perjuicios de hacerle el feo a la almohada? Privarse del  sueño de forma crónica, según el doctor Gary Zammit, del Hospital St. \nLuke’s Roosevelt, en Nueva York, se asocia con todo esto: déficit de  atención, concentración y memoria; afectaciones en el funcionamiento  ocupacional, mala calidad de vida, incremento en el riesgo de accidentes  o lesiones, y desórdenes psiquiátricos como depresión y ansiedad.  ¿Le seguimos? La División de Medicina del Sueño de la Universidad  de  Harvard  le  añade  leña  al  fuego:  la  falta  de  sueño  se  asocia  con  enfermedades  del  corazón,  hipertensión,  diabetes,  obesidad,  el  agravamiento de afecciones crónicas y la debilitación del sistema inmune.  Tras  revisar  múltiples  estudios  epidemiológicos  concluye  que  dormir  menos de cinco horas por noche incrementa 15% el riesgo de mortalidad  por cualquier causa.  Bien  entendidas  las  consecuencias  físicas  enfoquemos  ahora  las  baterías  sobre  las  formas  en  que  la  falta  de  sueño  impacta  nuestra  mentalidad y estado de ánimo.  Los costos psicológicos del mal dormir  En un estudio de  Gallup-Healthways  hallaron que quienes duermen ocho \nhoras reportan un mejor promedio de bienestar, con 65.7 por cada 100  encuestados. A partir de ahí, a menor cantidad de horas menor bienestar:  64.2 para quienes reportan siete horas y 59.4 para los de seis, etcétera.  Pongamos  esto  en  perspectiva.  La  famosa  escritora  Arianna  Huffington  destaca  un  estudio  del  psicólogo  Norbert  Schwarz  para  comparar  algo  aparentemente  tan  básico  como  el  sueño  con  algo  que  dotamos de tanto peso en nuestra felicidad: el dinero. “Aumentar 60 000  dólares  a  nuestro  ingreso  anual  tiene  un  menor  efecto  en  tu  felicidad  diaria que sumar una hora más de sueño cada noche”, dice Schwarz. A  veces se nos olvida que el descanso es una necesidad básica y que el  dinero extra suele destinarse a una necesidad secundaria (por no decirle  capricho a eso de irse de  shopping ).  Pero la falta de sueño no sólo destrona a la felicidad; también designa  a las emociones negativas como las herederas del trono. Investigadores de  la  Universidad  de  California,  en  Berkeley,  sometieron  a  un  grupo  de  voluntarios a quedarse sin dormir durante 35 horas seguidas; luego les  proyectaron  100  imágenes  —empezando  con  fotografías  neutrales  y  terminando  con  otras  muy  negativas—  mientras  medían  su  actividad  cerebral. Los resultados asombraron a los científicos: “Se tornaron 60%  más reactivos a los estímulos emocionales negativos. Es un incremento  inmenso. Tal parece que las partes emocionales del cerebro pierden el  control”, dice en entrevista el encargado del estudio, Matthew Walker.  En  pocas  palabras,  privarnos  del  sueño  nos  acerca  más  a  nuestra  naturaleza  animal  y  nos  aleja  de  la  esencia  que  consideramos  más  humana. Dejamos de usar la cabeza y empezamos a usar más las vísceras.  Supongo  que  no  es  en  vano  que  en  las  caricaturas  veamos  cómo  las  personas iracundas suelen tener grandes bolsas colgando de sus ojos.  El  insomnio  también  es  antisocial.  En  la  Universidad  de  Berkeley  relatan  que  privarnos  de  las  “horas  almohada”  suficientes  afecta  negativamente las hormonas y partes del cerebro que nos ayudan a captar  la información del exterior y procesar las señales emocionales y sociales  que intercambiamos en nuestras interacciones con los demás. Por lo tanto,  se ven nublados aspectos como el juicio moral, la toma de decisiones,  trabajo en equipo y en cambio tendemos a exacerbar los sentimientos  negativos y a comportarnos de forma impulsiva con el resto.  Por supuesto, esto luego afecta nuestra vida romántica. Un estudio de  la Universidad de Berkeley revela la conexión entre una noche de poco \ndescanso  y  la  armonía  en  las  relaciones  amorosas.  En  un  primer  experimento,  los  científicos  recabaron  declaraciones  de  78  jóvenes  adultos  quienes,  tras  dos  semanas  de  estudio,  anunciaron  haber  encontrado más motivos de discordia con sus parejas al discutir el día  posterior a una noche de sueño escaso. En otro, 71 parejas informaron  qué  tan  bien  durmieron  la  noche  anterior;  posteriormente,  los  participantes fueron grabados en un laboratorio mientras discutían con sus  seres queridos sobre algún asunto causal de conflicto. Tanto aquellos que  durmieron  mal,  como  sus  parejas  reportaron  haber  sentido  más  negatividad durante la discusión.  El buen sueño se consigue con hábitos  Así como existe la higiene de cuerpo, dientes y hasta de postura cervical,  también  existe  la  higiene  del  sueño.  Es  la  suma  de  los  hábitos  que  adoptamos  para  cultivar  una  base  de  descanso  que  favorezca  nuestro  funcionamiento cotidiano. En el día, nosotros debemos ser el sujeto de la  oración: somos los que habremos de aspirar a perseguir nuestros sueños  con enjundia; no que ellos nos persigan con letargos y bostezos. La buena  higiene del sueño es nuestra mejor aliada para mantener este orden. A  continuación comparto contigo algunos consejos para lograrlo.  —  Sin  caer  en  los  extremos.   Daniel  Kripke,  codirector  de  Investigación  en  la  Clínica  del  Sueño  Scripps  de  La  Jolla,  en  California,  dice  que  los  estudios  revelan  que  los  adultos  que  duermen entre 6.5 y 7.5 horas diarias suelen tener vidas más largas  que quienes lo hacen más o menos que eso. “El riesgo asociado con  dormir mucho o dormir poco es similar. La gran sorpresa es que el  sueño largo parece empezar en la hora 8. Dormir 8.5 horas podría  ser un poco peor que dormir 5 en realidad”, afirma Kripke.  — Duerme siempre donde mismo.  ¿Habías escuchado que algunos  animales, como ciertas aves y los delfines, duermen “a medias”? Es  decir, ¿que un hemisferio de su cerebro duerme mientras que el otro  se mantiene en vigilia para salir a respirar (en el caso de los delfines)  o seguir con su vuelo migratorio (en el caso de las aves)? Pues,  según un estudio de la Universidad de Brown, lo mismo ocurre con  nuestro  cerebro  cuando  dormimos  en  un  lugar  nuevo,  como  una \nhabitación  de  hotel.  Durante  la  fase  de  sueño  profundo,  los  investigadores  detectaron  actividad  de  vigilia  en  uno  de  los  hemisferios a la que le adjudican un estado de alerta al peligro que  ese nuevo entorno puede presentar. En otras palabras, aquello de  dormir con “un ojo al gato y otro al garabato” sí existe en ciertos  contextos y esto no nos permite descansar con entereza. Imagina  entonces los que viajamos mucho, ¿qué calidad de sueño tenemos?  ¿O será que nos acostumbramos?  — Tu cama es un santuario.  En la cama sólo dos cosas: dormir y...  ya sabes, pero nada de televisor u otros inoportunos interruptores de  ese  par  de  placeres  de  la  vida.  El  humano  es  un  animal  de  asociaciones: observa, relaciona y crea patrones. Si logras lo que te  digo, el puro hecho de acostarte te pondrá en el humor de realizar  ese par de actividades (por cierto, la segunda también ayuda a la  primera, así que no hay pérdida).  — Juego de luces.  Todos tenemos un mecanismo biológico que nos  ayuda a regular cuándo dormir y cuándo despertar cada día. Se llama  reloj circadiano. Según datos de la Universidad de California, en Los  Ángeles, la luz juega el papel principal en programar est
