    <style>
        :root{--primary:#007bff;--secondary:#6c757d;--light:#f8f9fa;--dark:#343a40;--success:#28a745;--danger:#dc3545;--warning:orange;--radius:8px;--font:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;--bg:var(--light);--text:var(--dark);--card:#fff;--border:#ddd;--input:#fff;--iborder:#ccc;--bot-bg:#e9ecef;--bot-text:var(--dark);--user-bg:var(--primary);--user-text:#fff;--sys-bg:#fff3cd;--sys-text:#856404;}

        @media(max-width:600px){.input-area{flex-direction:column;}#send-button{width:100%;padding:12px;}}

<script>
    const PDF_TEXT = "\n\n\nSÍGUENOS EN    @Ebooks             @megustaleermex       @megustaleermex     \n¡GRACIAS!  Una palabra pequeña pero llena de sentimiento  Gracias a ti, amiga lectora, amigo lector, por tener la inquietud de leer  este  libro,  te  prometo  que  lo  hice  pensando  en  que  fuera  una  de  las  mejores inversiones de tu tiempo.  Te presento mi octavo libro y quiero dedicarlo, como siempre, a mi  esposa: Alma, a mis hijos: César y Almita, por ser mi mayor inspiración  para  lograr  un  cambio  favorable  en  mi  vida  y  aplicar  muchas  de  las  recomendaciones que aquí te comparto.  Un gran agradecimiento a mi editorial, Penguin Random House y a  quienes hacen posible el sello Aguilar, por confiar nuevamente en mí, por  la elaboración y distribución de este libro que deseo toque millones de  vidas.  Un especial agradecimiento a tres personas que fueron claves en el  contenido: al editor y corrector, mi querido tocayito, César Ramos, quien  conoce a fondo el estilo coloquial con el que me gusta compartir los  conceptos  y  quien  participó  activamente  y  con  gran  entusiasmo  en  la  elaboración del libro que hoy tienes en tus manos.  A  mi  hermana  Gaby  Lozano,  por  siempre  estar  y  participar  activamente en la corrección de estilo de todas mis publicaciones.  A Felipe Cavazos por verificar y certificar todas y cada una de las  pruebas que te presento y darle veracidad a todas las investigaciones aquí  publicadas.  Gracias a quienes aceptaron que se publicaran sus nombres verdaderos  en las anécdotas y vivencias reales que te comparto y, también, gracias a  los  que  involuntariamente  participaron  en  este  libro,  por  conocer  sus  vidas  llenas  de  rencor,  resentimiento,  coraje,  celos,  envidias  y  demás  sentimientos que los alejan de la felicidad, la estabilidad emocional y que  por razones obvias no incluyo sus nombres verdaderos. \nctitud positiva... ¡y a las pruebas me remito!,  un título que tal  vez te incitó a adquirir el libro que tienes en tus manos. Me  considero  escéptico  en  muchas  cosas  y  siempre  busco  la  comprobación  de  por  qué  me  conviene  o  no  hacer  determinada  acción.  ¿Verdaderamente  la  gente  feliz  vive  más?  ¿Conoces  personas  con  historias de dolor o un presente adverso que pone a prueba hasta al más  fuerte, y aun así son felices? ¿Hay investigaciones que comprueben que  tener  paciencia,  sonreír,  reír  con  frecuencia,  evitar  o  disminuir  la  ira,  evitar la preocupación, o trabajar en un cambio de hábitos como lo es  comer  o  dormir  mejor  pueden  evitar  el  envejecimiento  o  la  muerte  prematura? Puede ser que por inercia contestemos sí, pero en cada página  de este libro encontrarás historias verdaderas relacionadas con la actitud  negativa  o  positiva,  acompañadas  de  estudios  realizados  por  universidades e investigadores de gran prestigio mundial.  No cabe duda, todos los días aprendo al conocer a quienes se han  convertido en grandes maestros de vida personas que me han enseñado a  decidir  por  una  actitud  positiva  no  sólo  en  tiempos  de  bonanza,  sino  también en la adversidad.  Mi esposa, con un pasado nada fácil, pues durante su infancia sufrió la \npérdida de su madre y creció en un ambiente difícil para cualquier niña,  decidió no repetir patrones de conducta que tuvieron con ella, sino ser una  madre y esposa amorosa, buscando siempre la unión familiar.  Mi padre, quien a pesar de tener una infancia difícil, siempre tuvo una  actitud positiva y una capacidad de asombro inquebrantable.  Ernesto, director de Recursos Humanos de una importante empresa de  pinturas, vive con una actitud positiva que contagia a quienes lo tratamos.  Siempre sonriente, siempre servicial, con un carisma envidiable y además  con  motivos  suficientes  para  expresar  cierto  dolor:  una  madre  con  Alzheimer desde hace años.  Mi inolvidable maestra, Liliana, a quien conocí en la maestría y quien  fue mi mentora e inspiradora para iniciar mi carrera como capacitador y  después conferencista. Siempre expresando su gran amor a sus hijos y a  Jaime,  su  marido,  quien  falleció  hace  unos  años.  Siempre  optimista,  positiva, sonriente a pesar de las múltiples enfermedades que ha sufrido  en los últimos años.  Claro que podría ponerme de ejemplo, por el título de este capítulo:  “Actitud positiva, ¿yo?” Reconozco que durante mi infancia, adolescencia  y parte de mi etapa de adulto, no fui positivo. La negatividad y la creencia  de que todo lo malo estaba destinado para mí fue parte de mi vida por  mucho tiempo. Hice de la preocupación un hábito lamentable y creí que  la actitud negativa era imposible de eliminar de una vida realista. ¿Por  qué maquillar lo que a simple vista es imposible de quitar? Por qué decir  que todo puede mejorar si prácticamente la historia me ha dicho que si  existe la mínima posibilidad de que algo salga mal, puede salir mal. Sé  que puede oírse exagerado, pero es la verdad. Yo así era y creía que así  sería para siempre. ¡Qué pena!  La oración era un refugio para mí; más que una forma para tener fe  era para disminuir los estragos en mi mente de los peores escenarios,  visualizados generalmente por mis pensamientos negativos.  Las frases que me acompañaron en mi etapa de estudiante fueron:  “De seguro, va a venir en el examen lo que menos estudié.”  “Ahora que no estudié, el maestro me preguntará a mí, ya verás.”  “Estoy  a  punto  de  terminar  todo  para  el  examen  final,  pero  estoy  seguro que se me va a olvidar lo primero que estudié.”  ¿Y qué sucedía? Por supuesto que esas nefastas profecías se cumplían  rigurosamente.  Venía  en  el  examen  exactamente  lo  que  menos  había \nestudiado; el profesor me preguntaba el día que menos me preparaba y,  para colmo, el día anterior del examen final se me borraban todos los  primeros capítulos que había estudiado. “¡No puede ser! Nada más falta  que pase ese perro que va ahí y me orine.” Y el perro pasaba muy cerca,  me imagino que con esas intenciones.  Hasta que un día plagado de presagios negativos leí una frase que  decía:  “AQUELLO QUE MÁS PIENSAS Y SIENTES, LO ATRAES  IRREMEDIABLEMENTE A TU VIDA”.  ¿Será verdad eso? ¿Será esa la razón por la cual todo lo que pienso que va  a salir mal, muchas veces sucede?  Y decidí modificar mis pensamientos.  Decidí no ser más la eterna víctima de mis propios pensamientos y  presagios. ¡Basta de imaginar lo peor! Si como quiera voy a imaginar,  ¿por qué no imaginar lo mejor?  Y empecé a poner en práctica muchas recomendaciones de autores  que desde hace mucho tiempo se ocupan de temas positivos.  “Nos convertimos en aquello que más pensamos.”  “Ten cuidado con lo que piensas porque se te puede cumplir.”  Indudablemente lo que más me ayudó a realizar ese cambio, que era  más que necesario, fue conocer lo siguiente: un pensamiento se convierte  en un sentimiento y un sentimiento se convierte en una acción, ¡ojo!  Entonces, la razón del porqué nos sentimos mal generalmente inicia  por pensamientos que dejamos que libremente entren y salgan de nuestra  mente.  Pensamientos  negativos,  derrotistas,  fatalistas  o  basados  en  suposiciones, en hechos que no han sucedido y que probablemente nunca  sucedan.  Los sentimientos, frutos de esos pensamientos, nos llevan a actuar de  manera  inesperada  y  totalmente  fuera  de  una  realidad,  y  todo  por  no  reservarnos el derecho de admisión de pensamientos.  Basta de pensar en lo que no deseas que ocurra; recuerda, atraemos  irremediablemente lo que más pensamos o lo que más sentimos.  Iniciemos un cambio de actitud desde la manera en la que pensamos o \ncomo nos expresamos:  —¿Cómo amaneciste?  —¡De lujo!  Una  respuesta  que  me  dice  frecuentemente  mi  amigo  Mauricio.  Siempre sonriente, positivo y con un profundo amor a su familia.  Mucha gente responde: “Pues amanecí y ya es ganancia.”  —¿Cómo estás?  —Pues estoy...  Cambiemos nuestra forma de expresarnos, dejemos la queja a un lado,  seamos más agradecidos y busquemos el lado amable de las cosas por  más difícil que parezca.  ¿No crees que sea momento de hacer un cambio en tu vida?  ¿Mereces atraer a tu vida todo lo que piensas negativamente?  Es momento de tomar las riendas de tu vida y si aún tienes alguna  duda, lee las pruebas que te comparto en las páginas de este libro que,  deseo de corazón, sea inolvidable para ti.  ¿La actitud negativa se contagia?  La triste historia de doña Pánfila.  ¿Tú crees que la actitud negativa se contagia? ¿Crees que la amargura de  una sola persona puede pasar de generación en generación?  Tengo  que  aclarar  que  la  historia  que  comparto  a  continuación  es  como todas las de este libro, real. Los nombres no fueron alterados en  este caso y cuento con la autorización de varios miembros de su familia  para compartirla. Por favor lee esta sorprendente historia:  A principios de siglo había una familia muy acaudalada que tenía  miles de hectáreas y miles de cabezas de ganado. Miembros de la alta  sociedad en una época acostumbrada a tener sirvientes para las tareas más  triviales.  Les  ayudaban  a  vestirse  y  los  abanicaban  mientras  tomaban  café.  Parece una situación irreal en nuestros días, pero así lo acostumbraban las  familias de abolengo en aquellos años.  En esta familia había 5 hijos, entre ellos, una jovencita de 15 años,  Panfilita,  que  ya  tenía  planeada  su  vida  la  cual  consistía  en  asistir  a  eventos sociales, conocer al que sería su rico novio con el que en un  futuro próximo se casaría y críar a sus hijos, claro está, con la ayuda de \nun ejército de sirvientes.  Todo iba viento en popa en la vida de la pequeña Panfilita hasta que  ocurrió un “pequeño incidente” llamado Revolución Mexicana, en el cual  su familia perdió todas sus tierras y todas las miles de cabezas de ganado.  Este suceso llevó al padre de Pánfila a buscar apoyo con familiares en  otras ciudades del país para que ayudaran a criar y mantener a sus hijos  ya que la Revolución los había dejado en la absoluta miseria.  Ella,  al  igual  que  sus  hermanos,  fueron  repartidos  con  diferentes  familiares.  Y así, la pequeña Panfilita se convirtió en una Cenicienta, y de vivir  con todas las riquezas inimaginables, al día siguiente tenía que ayudar a  su tíos con las labores de limpieza del hogar.  En esta casa empezó la educación con culpa para Panfilita, ya que su  abnegada tía le recordaba constantemente el GRAN sacrificio que era  para su familia mantenerla en tiempos tan difíciles. Si no fuera por el gran  corazón de su marido, ella estaría en la calle y en la vil miseria; pero no,  como ella —su tía— tenía un enorme corazón muy devoto y cristiano, la  iba a educar y esa formación empezaba con el trabajo duro y además, que  jamás olvidara los sacrificios que por ella se hacían.  Panfilita pasó a ser Pánfila y sus sueños de casarse con un rico que la  mantuviera como reina se vinieron abajo.  El  ámbito  en  el  que  se  movía  su  familia  adoptiva  no  le  permitía  conocer a hombres ricos y por lo tanto se casó con un buen joven de clase  media baja: “Ni modo —le dijo la tía—, ¡antes di que encuentras algo! y  además es lo máximo a lo que puedes aspirar.”  Pánfila  vio  en  este  muchacho,  Filomeno  (aunque  no  lo  creas,  su  nombre también es real), la perfecta oportunidad de ser el ama y señora  aunque fuera de una pequeña casa, que es lo que le podía dar su nuevo  marido.  Filomeno era un muchacho trabajador, chapado a la antigua y que no  le gustaba el conflicto, así que era el perfecto complemento para Pánfila  que estaba buscando a un marido que hiciera todo lo que ella quisiera.  Pasaron los años y Pánfila se convirtió en doña Pánfila con su propia  familia, 1 hombre y 3 mujeres, en la cual ella no iba a cometer el error  que sus padres habían cometido con ella, dándole la ilusión de que la vida  podía ser color de rosa y que existían las hadas.  Doña Pánfila les enseñó a sus hijos que en esta vida se venía a sufrir y \na ser agradecidos con sus mayores porque ellos existían gracias a todo el  dolor y pobreza que ella padeció con sus tíos. Cuidadito si ellos se fueran  a quejar de cualquier cosa porque ella no aceptaría hijos ingratos después  del calvario que sufrió de joven y ellos —sus hijos— se habían encargado  de ser los más problemáticos para todo: en el embarazo, al nacer, para  comer, para llorar, etcétera, etcétera.  Cuando los hijos osaban molestar a su papá con los problemas de  niñitos, les iba mucho peor, porque ellos tenían que saber que su papá se  mataba trabajando en estas épocas tan difíciles para que ellos todavía lo  molestaran con sus tonterías.  Filomeno, que sabía la de quejas e historias de sufrimiento que le iban  a tocar si defendía o chiflaba a sus hijos, prefería no complicársela y sólo  muy  de  vez  en  cuando  les  daba  una  muestra  de  cariño,  pero  jamás  desafiando a doña Pánfila.  Como entenderás, los hijos de doña Pánfila vivían en un ambiente  hostil en el que tenían que atender a su madre porque ella había sufrido  mucho por ellos y para darles lo poco que tenían.  ¿Qué crees que pasó con los hijos de doña Pánfila?  Evidentemente todos tuvieron aspiraciones mucho más bajas de lo que  podían alcanzar o lograr en la vida.  Juanito, el único hombre, se quedó solterón haciendo muy poco de su  vida. Dos de las tres mujeres, Guadalupe y María, se quedaron a “vestir  santos”  ya  que  ningún  hombre  era  lo  suficientemente  bueno  para  ser  aprobado por doña Pánfila y en lugar de estar saliendo a conocer jóvenes  de su edad tenían que atender a su madre como las sirvientas que siempre  quiso y jamás pudo tener después de los 15 años. Porque, “¿acaso no  había sacrificado toda su belleza y sus mejores años para tenerlas?” Así  que ellas tenían la obligación de atenderla por encima de todo.  La última hija, la más pequeña, Hipólita, logró contraer matrimonio ya  que el destino le puso en su camino a un hombre de fuerte temperamento  que conseguía lo que quería, Jesús Federico. Humilde pero determinado  en triunfar en la vida, y después de muchos años de pedir la mano de la  pequeña Hipólita, se la concedieron a regañadientes.  Doña  Pánfila  le  explicó  claramente  a  Hipólita  por  qué  le  había  permitido casarse, no sin antes decirle: “Hijita, tú no eres ni bonita, ni  buena para la escuela, ni para tejer y no eres inteligente, así que si no te  dejo casarte serás una carga para esta familia toda la vida y ya Dios me ha \npuesto suficientes pruebas para aparte tener que cargar contigo”.  Así,  con  esas  “bonitas  y  motivadoras  palabras”,  inició  la  vida  matrimonial de Hipólita, la cual pasó del dominio de su mamá al de su  marido.  Hipólita, muy bien educada por su mamá se dijo: “Mi vida ha sido  muy difícil, pero debe mejorar, porque ahora que me caso tendré con  quien descargarme de todo este sufrimiento que he pasado.”  ¿A quién creen que Hipólita le iba a pasar toda esa culpa que venía  desde que la Revolución les quito las tierras a sus bisabuelos? ¡A sus  hijos, por supuesto! Y el ciclo continúa hasta la actualidad, y continuará  hasta que aparezca alguien en la familia que detenga esa herencia maldita  de negatividad y rencor.  Así que, ¡aguas! No sólo se hereda la actitud negativa... es altamente  contagiosa.  Negatividad: ¿Ese bicho se contagia?  Pese a la nube de misterio a su alrededor, el fenómeno de las vibras es  cierto. Cualquiera que tenga emociones lo ha experimentado. Desde la  ligereza que nos transmite una persona amable y carismática, hasta la  espesa nube de luto que cae sobre nosotros en un velorio.  Somos seres sociales y esto implica sintonizar las emociones de los  demás. Nos conectamos a través de la empatía y la simpatía, pero también  nos desconectamos por medio de la discordia.  Si de verdad sentimos a los demás, ¿qué tanto nos afectan sus vibras?  ¿Cuánto  permanecen  con  nosotros?  ¿Corremos  el  riesgo  de  hacerlas  propias?  Las preguntas se tornan más urgentes si nos toca lidiar con personas  negativas a diario. Aquellas que decimos que son de “sangre pesada”,  quienes exudan amargura a cada instante y tienen por deporte ver el lado  negativo de todas las cosas.  Cambios de opinión  No tomamos decisiones  ni formamos opiniones  a solas. Estamos  más  acompañados  de  lo  que  creemos.  Y  si  a  esto  le  sumamos  que  la  negatividad tiene su buen grado de viralidad, el acto de compartir ideas  nocivas puede convertirse en una enfermedad de transmisión verbal que \ncause una epidemia.  Por ejemplo, investigadores de la Universidad de Chicago reclutaron a  participantes  para  presentarles  información  sobre  un  nuevo  producto.  Luego de mostrárselo, les solicitaron escribir una evaluación propia e  independiente acerca de él.  En  esa  primera  instancia,  las  calificaciones  eran  diversas:  algunas  positivas, algunas negativas. Pero aquí viene lo bueno (¿o lo malo?): los  científicos les revelaron luego a los participantes la opinión de los demás,  y  notaron  una  influencia  muy  poderosa  sobre  ellos.  Cuando  un  participante se enteraba de que el resto sostenía opiniones negativas sobre  el producto, cambiaba la suya en esa dirección. Es decir, abandonaba su  criterio para adoptar el ajeno.  Posteriormente, cuando les pedían interactuar con otros para tratar el  tema del producto, los consumidores con opiniones negativas endurecían  más su juicio: ¡se tornaban aún más negativos!  En resumen, en el estudio, las opiniones negativas no sólo tuvieron un  alto factor de contagio, sino que también resistieron más entre quienes las  tenían,  incluso  se  potenciaban  más  dentro  de  ellos,  ya  sea  porque  se  reforzaban con la negatividad de los demás o porque se polarizaban para  llevar la contra a la positividad del resto.  ¡Zas!  Dime con quién andas y te diré la actitud que tendrás  Esto es para bien y para mal. El psicólogo Gerald Haeffel se dio cuenta,  tras  analizar  casos  de  estudiantes  de  la  Universidad  de  Notre  Dame,  donde  él  mismo  trabaja;  eligió  algunos  alumnos  que  vivieran  bajo  el  mismo techo para ver los efectos que esto tiene en unos sobre otros.  Primero midió las actitudes y formas en que los estudiantes afrontaban  la adversidad. Identificó entre dos tipos: los que se daban por vencidos y  achacaban el fracaso a su carácter como persona con declaraciones como  “no sirvo para nada” y “soy un tonto”, y los que lo tomaban como un reto  con reacciones como “me esforzaré más a la próxima”.  Luego, por un lado, identificó a alumnos que vivieran juntos y que  tuvieran las mismas actitudes, y por otro, también consideró a los que  cohabitaran pero que tuvieran actitudes muy distintas.  El resultado fue impresionante, en tan solo tres meses, los compañeros \nde  cuarto  con  actitudes  muy  diferentes  comenzaron  a  “infectarse”  los  unos a los otros. “Los estilos de pensamiento resultaron contagiosos. Si tu  compañero de vivienda en la universidad tenía un estilo de pensamiento  muy negativo, tu propia forma de pensar se tornaba negativa”, declaró  Haeffel.  Los efectos del contagio no se detienen ahí. Tras seis meses de vivir  con una persona negativa, los optimistas comenzaron a mostrar síntomas  mentales que los ponían en riesgo de sufrir depresión.  Esto  también  explica  por  qué  en  la  sociedad  vemos  un  comportamiento que es más bien una escala de grises que un asunto de  blanco y negro.  Virus emocionales y sus vacunas  Sigal  Barsade  es  una  profesora  de  Gestión  en  la  Universidad  de  Pensilvania que estudia la influencia de las emociones en los lugares del  trabajo. En sus investigaciones ha encontrado que las personas no son  islas  emocionales;  por  el  contrario,  las  franjas  fronterizas  entre  compañero y compañero son más difusas de lo que en realidad pensamos.  Y SIEMPRE ESTAMOS EN RIESGO DE UN “CONTAGIO  EMOCIONAL”, PUES COMO ELLA LO INDICA: “LAS  EMOCIONES VIAJAN DE PERSONA A PERSONA COMO UN  VIRUS.”  La atmósfera del lugar se puede ver contaminada fácilmente incluso a  distintos niveles. Según estas investigaciones transmitimos tres tipos de  emociones: el sentimiento pasajero como la alegría o el enojo; el humor, \nque es un estado un poco más generalizado y duradero; y los rasgos de  personalidad,  que  son  tendencias  recurrentes  en  las  personas  (como  cuando decimos que alguien es muy alegre o muy negativo).  Como no existe una cámara para aislar y poner en cuarentena a las  personas infectadas de negatividad, Barsade nos dice cómo y por qué  debemos  vacunarnos  contra  su  virulencia  y  de  paso  controlar  la  negatividad que nosotros podamos transmitir en algún momento dado.  Todo  se  logra  con  inteligencia  emocional.  O  sea,  aprender  a  leer  los  sentimientos de los demás, así como administrar los tiempos y las formas  para sacar el mejor provecho del trabajo en equipo.  Por ejemplo, si tenemos una gran idea, pero sabemos que nuestro jefe  suele estar de mejor humor por las tardes, será mejor esperar a contárselo  entonces.  También,  en  vísperas  de  lidiar  con  gente  negativa  en  una  reunión,  podemos  mentalizarnos  para  no  ser  presa  emocional  de  los  comentarios  de  las  personas  destructivas  o  para  no  permitir  que  se  conviertan en el centro de atención, ¡mucho cuidado!  ¿Por  qué?  La  investigadora  descubrió  que,  más  allá  de  que  puede  caerle mejor al resto, la gente positiva tiende a desempeñarse mejor en su  trabajo por mejores razones: “La gente positiva procesa la información  más eficiente y apropiadamente. Si estás de humor negativo, una buena  parte de ese procesamiento se gasta en dicho humor. Cuando estás de  humor positivo, eres más receptivo a tomar la información y manejarla de  forma efectiva.”  Un “contreras” no sólo nos lleva la contra  Hay personas que discuten por discutir, que ven un valor en simplemente  dar la contra. Cada que pueden intervienen con polémica, siembran la  discordia, ponen peros y son incapaces de dar su brazo a torcer.  Resulta  que  entablar  relaciones  con  gente  así  puede  traer  consecuencias fatales. Tal cual: el conflicto constante es malo para la  salud.  Un estudio de investigadores de la Universidad de Copenhague, en  Dinamarca, halló que las relaciones sociales estresantes incrementan el  riesgo de mortalidad entre adultos de mediana edad. Según los resultados  de  esta  investigación,  ser  víctima  constante  de  demandas  o  preocupaciones de la pareja o de los hijos se asoció con un incremento en \nel riesgo de mortalidad entre un 50% y un 100%. Experimentar conflictos  frecuentes derivados de cualquier tipo de relación social está relacionado  con un aumento de la mortalidad de dos o hasta tres veces más respecto a  aquellos con vidas más pacíficas.  Así que, si lo piensas, nuestras relaciones con los demás pueden ser  como un karma que se nos regresa a la brava. Si te gusta pelear por pelear  o no te alejas de personas que tienen ese  hobbie,  es posible que la vida te  lo cobre caro conforme pasen los años. Frente a este escenario jugar a la  segura luce aún más tentador. La paz tiene una deliciosa cerecita en su  pastel: no sólo se siente bien, ¡nos hace bien!  DICE JIM ROHN QUE SOMOS EL PROMEDIO DE LAS CINCO  PERSONAS CON QUIENES MÁS NOS RELACIONAMOS.  DEFINITIVAMENTE, UNA MEDIDA PREVENTIVA ES SER  SELECTIVOS CON NUESTROS CÍRCULOS SOCIALES Y UNA  CORRECTIVA ES JUBILAR ALGUNAS DE ESAS AMISTADES  QUE DE AMISTOSAS NO TIENEN NADA.  Sin embargo, sabemos que rodearse sólo de personas con buena vibra es  imposible  hasta  para  una  comunidad    hippie.   Puesto  que  no  siempre  podemos decidir quién se atravesará en nuestro camino, la moraleja es,  finalmente:  debemos  comprender  que  algunos  rasgos  de  nuestra  personalidad son más flexibles de lo que pensamos.  A sabiendas de que nada en nuestro carácter está grabado en piedra y  que  más  bien  se  escribe  minuto  a  minuto  de  la  mano  de  familiares,  amigos y colegas, debemos evitar a consciencia ceder ante la toxicidad  que  desprenden  algunos  de  ellos.  Finalmente,  todo  es  una  decisión.  Depende de nosotros qué recogemos y qué no de la banqueta de nuestro  propio camino.  Así que ya sabes, ¡imprime actitud positiva a tu vida! \nrase expresada frecuentemente por mi adorada madre.  —Mamá, ¿cómo amaneciste?  —Muy mortificada, hijito.  —¿Por qué, mamá?  —Porque espero que a tu papá le den un “sí” a la nueva campaña de  publicidad que le propuso a un cliente.  Siempre me cuestioné si con preocuparse de esa manera habría más  posibilidades de que le dieran ese importante trabajo a mi papá. Como si  a costa de la preocupación y la incertidumbre que mi madre sentía se  generara cierta energía para ablandar los corazones de quienes tomaban  tan importante decisión o si el ser supremo se conmovía de tal manera  que le otorgaría tan anhelado deseo a esta hija suya que sufría tanto por  ese bien para su esposo y familia.  —Mamita, ¿cómo estás?  —Toda mortificada, hijito.  —¿Ahora por qué, mamita?  —Porque me salió un tumor raro aquí en el brazo y tengo miedo de  que vaya a ser cáncer.  —A ver. Déjame checarte... \n—¡Claro que no es cáncer, mamá! Es un piquete de mosco.  —¿En serio? ¡Qué mortificación! —replicaba mi madre.  —¿Por qué mortificación, mamita?  —¡No vaya a ser dengue!  Indudablemente la anécdota de mi juventud que más recuerdo de mi  madre,  eternamente  mortificada,  fue  cuando  mi  hermano  mayor  llegó  tardísimo sin darse cuenta ella.  —Hijito, estoy toda mortificada. ¡Tu hermano no ha llegado!  —¡Está dormido en su cuarto!  —¿Por qué no me avisó cuando llegó?  —Porque llegó ¡hasta atrás! —por no decirle que bien borracho.  —¡Qué mortificación! —replicó mi madre— ¿Por qué habrá tomado  tanto? ¿Qué problemas cargará en su interior mi pobre hijito?  La mortificación era el pan diario en la vida de mi madre.  Lo que voy a contar tiene que ver con ese sentimiento; obviamente  pedí autorización para hacerlo a quienes participaron en tan original y  penosa historia. Recuerdo un viaje en carretera que realizamos toda mi  familia en una camioneta de mi padre, desde mi querido Monterrey a la  Ciudad de México. Nos encantaban a mis seis hermanos y a mí esos  viajes,  pero  claro  que  para  mi  madre  eran  también  motivo  de  mortificación por todo lo que en una carretera podría ocurrir y que gracias  a Dios no ocurrió.  Recuerdo que para que el viaje no fuera tan pesado, pernoctábamos en  un hotel de 10 pisos ubicado en el centro de San Luis Potosí.  Mi  padre  pidió,  o  mejor  dicho,  exigió  que  no  bajáramos  maletas,  solamente  el  cambio  de  ropa  que  utilizaríamos  al  día  siguiente  y  los  cepillos de dientes.  Nos registramos y subimos a los tres cuartos, uno para mis padres,  otro para los hermanos y otro para las hermanas.  Mi padre dijo:  —Los espero en la plaza que está enfrente del hotel para ir a buscar un  restaurante para cenar —y ahí llegamos mis hermanos y yo.  Faltaban, como siempre, mis hermanas en bajar.  De pronto mi madre voltea hacia los cuartos superiores del hotel y ve  la mano de una mujer ondeando un calzón rojo por la ventana de su  habitación.  —¡Qué mortificación! No se vaya a caer esa mujer de la vida galante \nque llama a los hombres de esa forma tan vulgar y corriente.  “¿Llama a los hombres?” Me preguntaba con mi inocencia de un niño  de 10 años; bueno, no tan inocente pero habría que demostrar eso ante los  padres.  Volteo a ver a la supuesta mujer de la vida galante y mi sorpresa fue  mayúscula.  —Mamá, ¡es mi hermana Magda!  —¡¿Pero cómo?! ¡Qué mortificación!  La razón de su acción por la ventana del hotel, era que había olvidado  sacar su cambio de ropa interior y ella lo lavó y ¡lo estaba secando al  viento! y era la razón por la cual ella y mis hermanas no habían bajado.  Ya sabrás las carcajadas de todos mis hermanos y mi papá al saber  que la obsesión por la limpieza que desde siempre ha tenido mi hermana  Magda, había sido mal interpretada por su propia madre.  Total  que  para  mi  mamá,  la  mortificación  se  convirtió  en  un  lamentable  hábito  o  estilo  de  vida,  lo  cual  me  hace  recordar  que,  efectivamente, como lo dijo el doctor William Piper de la Universidad de  Chicago, existen adictos a la infelicidad.  Verla entrar a la Iglesia en año nuevo para pedir a Dios que el año que  iniciábamos fuera un año de prosperidad y salud, era para ella una razón  más de duda que de seguridad.  Mi madre entraba al templo y pedía con un fervor fuera de este mundo  que no nos faltara lo suficiente para vivir, ya que en ese tiempo mi padre  tenía problemas para tener un trabajo estable. Quiero expresarte que el  dolor  de  mi  madre  me  dolía,  su  cara  de  súplica  me  hacía  desear  fervientemente tener un trabajo para quitarle todas sus dudas y penas,  pero en ese tiempo era un estudiante de segundo semestre de medicina  que no tenía nada que ofrecer.  Salía de ese santo lugar con la misma cara de preocupación con la que  entraba, como si el tiempo y las plegarias realizadas no hubieran sido  escuchadas  y  seguía  cargando  su  preocupación  durante  los  días  posteriores.  “Sin  querer  queriendo”,  como  decía  el  célebre  personaje  de  Chespirito, El chavo del ocho, yo imité dicha conducta. Me preocupaba  antes de cada examen de tal forma que entraba en un estado de ansiedad  constante y pérdida de apetito lo cual hacía que me debilitara a tal grado  que me bloqueaba para estudiar lo que realmente necesitaba para pasar \nmis exámenes. El pensamiento que inconscientemente se había grabado  en mi interior era que entre más me preocupara más sería escuchado por  el ser supremo para solucionar mis asuntos.  Y  ni  para  qué  decirte  lo  que  llegué  a  hacer  con  tal  de  que  mis  oraciones fueran escuchadas. Ahora que pasa el tiempo entiendo que las  cosas  tienden  a  mejorar  cuando  así  lo  deseamos.  Cuando  creemos  fielmente que lo bueno y lo mejor está destinado para nosotros.  Es una triste realidad. Es más fácil preocuparnos que tener fe, porque  la fe requiere esfuerzo, la preocupación no.  Quien  decide  tener  fe,  decide  romper  los  paradigmas  que  durante  mucho tiempo nos han inculcado, de culpabilidad, miedo y preocupación,  por intentar agradar a los demás, incluyendo a Dios.  No  puede  ser  que  sigamos  creyendo  tantas  tonterías  que  fuimos  aprendiendo  de  generación  en  generación,  en  las  que  directa  o  indirectamente  se  nos  incita  a  sentirnos  poco  merecedores  de  todo  lo  bueno que está destinado para nosotros, en serio.  “Por mi culpa, por mi culpa, por mi gran culpa”, repetía en la misa  dominical, a la cual por cierto sigo asistiendo, pero por salud mental y  acuerdo personal ya no repito esa parte de la oración comunitaria, perdón.  Recuerdo también a mi abuela paterna, doña Consuelo, rezando sin  cesar, pero con una cara de preocupación tremenda al estar repitiendo una  y otra vez las mismas oraciones por el perdón de sus pecados y por la  sanación de mi abuelo.  ¿En qué momento convertimos en hábito algo tan nefasto como lo es  la preocupación?  ¿Cuándo aprendimos que a costa de preocuparnos todo el día por algo  que depende o no de nosotros podremos hacer algo para mejorarlo?  ¿Cuándo despertaremos de ese letargo evolutivo que nos impide tener  estabilidad emocional y que además nos impide disfrutar del maravilloso  regalo del presente?  Entre más dediquemos tiempo a algo, más lo fortalecemos o lo que es  lo mismo, entre más pensemos en lo que no deseamos que ocurra, más lo  estamos  atrayendo  a  nosotros.  ¿No  sería  mejor  analizar  la  situación,  verificar si está en nuestras manos cambiarla y si no es posible ningún  cambio,  no  dedicar  más  tiempo,  mente  ni  espacio  a  lo  que  tanto  nos  desmotiva y nos quita energía?  Estoy seguro de que mi madre, mi abuela y yo, no hubiéramos tenido \nuna vida llena de mortificaciones e incertidumbre si hubiéramos leído  antes estas reflexiones respecto a la preocupación.  La preocupación: volver al futuro (¡una y otra vez!)  Si fuera adivinanza diríamos: ¿Productivo por fuera, improductivo por  dentro, qué es?  ¡La preocupación!  Créeme, en este libro nos vamos a dar cuenta de que muchas cosas no  son lo que parecen.  Una mente preocupada se siente más útil que una en blanco. Nos  engaña con la ilusión de que nuestro sufrimiento sirve para algo. Digamos  que es un mecanismo que trata de ahorrarnos problemas pero que, a la  vez, se vuelve uno de ellos, ¡Zas!  Tras una serie de estudios, investigadores de la Universidad de Sussex  y  de  King’s  College,  en  el  Reino  Unido,  encontraron  evidencias  que  sugieren  que  la  preocupación  evolucionó  en  el  ser  humano  con  el  propósito de resolver retos y evitar ciertas cosas a futuro.  Entonces,  la  preocupación  es  como  viajar  al  futuro  a  través  de  pensamientos y emociones negativas. Es una reacción sentimental que  nos da la  falsa  impresión de hacer algo para resolver un problema; así  como leíste: “FALSA.”  La preocupación en realidad es un derivado de nuestra obsesión con  pensar en el futuro. Como desconocemos lo que depara nuestra vida y  tenemos sed de tener el control de ella, cuando nos preocupamos somos  presas  de  sentimientos  de  inseguridad  que,  a  su  vez,  tratamos  de  contrarrestar  sintiéndonos  ansiosos  y  rehuyendo  situaciones  de  incertidumbre.  Hay algo en lo que la preocupación sí es productiva, ¡pone en riesgo  nuestra  salud!  La  preocupación  excesiva  se  vincula  con  afecciones  cardiovasculares,  alteraciones  en  el  ritmo  cardiaco  y  aumento  en  los  niveles del cortisol, la hormona del estrés, lo que desestabiliza nuestras  defensas y nos hace más propensos a enfermarnos.  También  hay  niveles  de  preocupación.  Según  los  investigadores  británicos mencionados al inicio, lo que diferencia a los preocupones en  serie  es  que  no  le  ven  el  punto  a  dejar  de  hacerlo,  vamos,  ya  se  acostumbraron. Tienden a desarrollar una especie de perfeccionismo con \nel  que  se  obsesionan  por  analizar  cada  eventualidad  y  resolver  cada  problema.  Para revertir este hábito, es necesario saber decir: “¡Hasta aquí!” “Es  benéfico pensar en la idea de detener la preocupación cuando ya tuviste  suficiente, y no hasta cuando la preocupación haya terminado o se sienta  completa de alguna forma”, recomienda Christian Jarrett, autor y doctor  en neurociencia cognitiva.  En otras palabras, cuando nos preocupamos, el sentimiento nos agobia  tanto que ni siquiera lo cuestionamos. Simplemente nos dejamos llevar,  así de fácil.  Por lo mismo, según Jarrett, para facilitar la labor de soltar y dejar ir  podemos contemplar que la preocupación es sólo una fase, una primera  escala en la ruta hacia la felicidad en el resto de nuestro día.  COMO ESTA ANSIEDAD SE VUELCA HACIA EL FUTURO Y  NOS PARALIZA POR TEMOR A EQUIVOCARNOS, LA MEJOR  FORMA DE DETENERLA ES REUBICARLA EN EL PRESENTE.  ES NECESARIO DECIRNOS: “ESTA EMOCIÓN YA CUMPLIÓ  SU COMETIDO Y ES HORA DE SEGUIR ADELANTE.”  Un pionero en la investigación de esta emoción, el investigador de la  Universidad de Pensilvania, Thomas Borkovec, ahonda en el tema cuando  nos  dice  que  con  la  preocupación  realizamos  tres  acciones  básicas:  pensamos en exceso, tratamos de inhibir nuestras emociones y buscamos  evadir algunos efectos negativos.  Recordemos que reprimir los pensamientos sólo los hace más fuertes.  Cuando atacamos la preocupación con la estrategia equivocada, con el  deseo de acallarla a la fuerza, ella se vuelve como una hidra a la que le  cortamos una cabeza, pero le brotan dos más.  Por  lo  tanto,  siempre  debemos  respirar  profundamente,  regresar  al  presente,  aceptar  que  la  preocupación  es  una  llamada  de  atención  importante al inicio, pero redundante al final; que tiene una misión que  cumplir, pero que luego debemos darle las gracias por sus servicios y  despedirla. La clave es hacerlo con gentileza, con el convencimiento de  retomar el mando y quitarle lo “pre” a aquello de la ocupación.  Sin lugar a dudas, lo que a mí me ha funcionado más es recordar tres \ncosas:  1  Aquello en lo que más piensas más poder le das.  2  La ley de la atracción dice que entre más pienses o sientas algo, más  lo atraes a ti. ¡Imagina lo que esto significa! Entre más te preocupes  más atraes a tu vida la situación que tanto te angustia.  3   Haz  un  análisis  de  las  situaciones  que  recuerdes  que  tanto  te  preocuparon  y  te  desmotivaron,  y  analiza  cuántas  de  ésas  verdaderamente se cumplieron. Te darás cuenta de que la mayoría  nunca se cumplió y las que realmente sucedieron, no fue como lo  planeaste  mentalmente  o  tuviste  la  fuerza  suficiente  para  salir  adelante.  Así que no inviertas más tiempo en pensar en lo que no ha sucedido.  ¡Hasta aquí! No más mente ni tiempo en pensar en lo que no ha pasado y  probablemente no sucederá, porque para quienes tenemos fe, ¡lo bueno  siempre está por venir! \n¡Ánimo! \nCésar, ¿te puedo pedir un favor? Ora por mí —me dijo un  conocido—, la próxima semana me van a operar para quitar  una obstrucción que traigo en una arteria del corazón.”  Mi respuesta inmediata fue un automático y efusivo “¡Claro que sí!  Cuenta con mi oración y mis mejores deseos para que todo salga mejor de  lo planeado.”  Tengo que ser sincero, no siempre oraba con el mismo fervor con el  que deseaba porque en el fondo de mi corazón siempre existía la ligera  duda de si verdaderamente mis plegarias iban a ser escuchadas o tendrían  más peso las que formula quien las necesita.  “¿No será mejor que cada quien ore por sí mismo?” Me cuestionaba  egoístamente cuando leía mensajes en redes sociales de gente desesperada  que lo pedía por la salud de un familiar. Por cierto, no sé cuántos de los  que leen una petición como ésta en redes sociales dejan de hacer lo que  están haciendo para ponerse en oración por quien afanosamente lo pide, o  siguen viendo publicaciones y dando  like  a cuanta foto ven.  Mi madre siempre oraba por la gente que se lo pedía y a veces por  quienes ni siquiera conocía en el mundo, pero ahí la veías, rezando devota  y abnegadamente delante de su imagen favorita, un Sagrado corazón a \nquien le pedía una y otra vez por nosotros, sus hijos, por los hijos de otras  madres  y  hasta  por  quienes  veía  en  las  noticias  y  le  conmovían  sus  historias de dolor o tristeza y ella expresaba: “No podré solucionarle su  problema o quitarle su dolor, pero sé que mi oración ayudará en algo.”  Tengo el gusto de conocer a integrantes de varias órdenes religiosas,  especialmente a las hermanas adoratrices en Ciudad Victoria, Tamaulipas,  quienes dedican gran parte del día a orar por todos. En las visitas que  periódicamente les hago, la bella y dulce madre Lupita, de 96 años de  edad,  me  dijo  con  su  eterna  sonrisa  que  diariamente  ora  por  su  muchachote, oséase  por este muchacho que está escribiendo para ti, y la  duda sutilmente latente aún sigue: ¿En serio las oraciones que se hacen  por los demás pueden tener un efecto positivo para solucionar o mejorar  alguna situación?  No, créeme que con esto no quiero poner en tela de duda mi fe, pero  es una duda que por mucho tiempo me había acompañado. Creo, y lo he  vivido, que cuando oro con fe las cosas pueden mejorar, la situación que  me aflige puede disminuir o terminar de una manera esperada y hasta  inesperada.  Creo que las cosas mejoran cuando crees que así puede ser, cuando le  dedicas tiempo y adicionalmente te preparas para que suceda.  Creo que al unir la fe, la preparación y el aprovechamiento de las  oportunidades, todos hemos hecho milagros, pero realmente ¿qué tanto  influye esa oración con fe para mejorar la vida de quienes nos rodean?  ¿Qué tanto ha influido la oración constante que mi querida madre  Lupita hace por mí diariamente para que Dios se manifieste en mis giras  de trabajo?  Estoy seguro de que mi duda se habría desvanecido hace muchos años  si hubiera hecho de la oración un hábito constante, y aceptar que la fe es  creer sin haber visto. Practicar no sólo la oración que hago por mí y mi  familia,  sino  también  por  quienes  me  lo  piden  por  alguna  causa  en  especial.  Mi duda habría sido menor si hubiera leído estas dos investigaciones  impactantes:  La primera, de 1988, es el estudio más positivo de la eficacia de la  oración  publicado  en  el    Southern  Medical  Journal   por  el  cardiólogo  Randolph Byrd, MD, con enfermos de la unidad de cuidados coronarios.  Durante  un  periodo  de  10  meses,  los  pacientes  fueron  divididos \naleatoriamente en dos: 192 pacientes que recibieron oraciones por medio  de grupos de oración y 201 pacientes que no oraron por ellos.  Ni los pacientes ni sus médicos sabían quiénes estaban recibiendo la  oración. Lo más impresionante fue que el grupo que recibió oraciones  (sin  saber  que  se  oraba  por  ellos),  mostró  una  recuperación  significativamente superior en comparación con el grupo por el que no se  oraba. Ninguno de ellos requirió ventilación artificial, mientras que 12  pacientes  del  grupo  sin  oración  lo  exigían.  Además,  los  pacientes  incluidos  en  el  grupo  de  oración  de  manera  significativa  requirieron  menos  antibióticos  y  fueron  menos  propensos  a  desarrollar  complicaciones.   La  segunda,  de  años  después,  en  1996,  realizada  por  la  doctora  Elisabeth Targ Fischer, una impecable médica graduada de la Escuela de  Medicina  de  Stanford  y  profesora  asistente  de  psiquiatría  en  la  Universidad  de  California,  en  San  Francisco,  especializada  en  los  fenómenos  psíquicos  y  el  papel  de  la  espiritualidad  en  la  salud  y  la  curación.  Su estudio comenzó con 40 pacientes enfermos de SIDA, asignados al  azar a un grupo de oración, y un grupo control que no recibió la oración.  Las fotografías del grupo fueron enviadas a los voluntarios, en los que  estaban  incluidos:  rabinos,  sanadores,  videntes  y  curanderos  nativos  americanos. Cada paciente recibió una hora después de la curación de un  día a un curandero y cada semana los curanderos se cambiaban, de modo  que más de 10 semanas de estudio los pacientes recibieron la curación de  10 profesionales diferentes.  En un promedio, el grupo de enfermos tratados con oración pasó sólo  10 días en el hospital y sufrió sólo 13 enfermedades o complicaciones  asociadas  al  SIDA,  mientras  que  los  pacientes  que  no  recibieron  la  oración  en  promedio  pasaron  68  días  en  el  hospital,  recibiendo  tratamiento para 35 enfermedades o complicaciones relacionadas con el  SIDA.  Esto demostró que la oración tenía un efecto significativo sobre la  enfermedad del paciente. Además su estudio cumplió con los estándares  más exigentes de la  Western Medical Journal  y fue publicado en 1998, no  es cualquier cosa.   Es muy triste, pero la doctora Targ murió muy joven, a los 40 años de  edad, víctima de un tumor cerebral, una de las más malignas formas de \ncáncer. Con o sin tratamiento, los pacientes de este cáncer tienen una vida  corta que por lo general se mide en meses, y amargamente así fue para  ella. Aun y con la oración de miles de personas que se enteraron de su  enfermedad, curadores de la energía, psíquicos y acupunturistas, todos  estaban tratando de ayudarla. Ella sabía que la medicina no tenía nada que  ofrecer,  creía  en  la  curación  alternativa  y  estaba  dispuesta  a  intentar  cualquier cosa.  Para quienes somos creyentes practicantes o esporádicos no hay duda  de que la oración tiene poder para curar. Sería muy difícil enumerar la  enorme  cantidad  de  investigaciones  que  encontré  relacionadas  con  el  tema, incluyendo las palabras del doctor Harold G. Koenig, director del  Centro para la espiritualidad, la teología y la salud de la Universidad de  Duke, autor de varios libros autorizados sobre la fe y la curación:  “Estudios han demostrado que la oración puede evitar que la gente se  enferme,  y  cuando  ellos  se  enferman,  la  oración  puede  ayudarles  a  recuperarse más rápido.”  Un análisis exhaustivo de más de 1 500 estudios médicos de renombre  “indica que las personas que son más religiosas y oran más, tienen mejor  salud mental y física”, dice Koenig. “Y de los 125 estudios en los que se  examinó la relación entre la salud y el culto regular, 85 mostraron que los  que van regularmente a la iglesia viven más tiempo.” ¡Zas!  El  doctor  Koenig,  en  otro  estudio  sorprendente  publicado  en  el  Southern Medical Journal  el año pasado, demostró que la oración tiene  un notable efecto en los pacientes con aparatos auditivos y deficiencias  visuales.  Después  de  sesiones  de  oración  “ellos  mostraron  mejoras  significativas  sobre  la  base  de  las  pruebas  de  audio  y  visuales”,  dice  Koenig.  Me  queda  claro,  prefiero  creer  en  este  maravilloso  poder  que  no  hacerlo. Creer que cuando deseamos algo bueno o mejor para los demás  movemos fibras invisibles en cada uno de nosotros y en la persona a  quien le manifestamos esa forma desinteresada de amor.  No es mi afán entrar en una controversia con quienes creen más en la  sugestión que en el maravilloso poder de la oración, pero mi deseo es que  hagas la prueba, que desees lo bueno y lo mejor para los demás.  En meditación se dice enviar méritos a quien lo necesita. Me gusta  soñar despierto en un mundo mejor; soñar que todos dedicamos unos  minutos de nuestro tiempo para bendecir la vida de los demás. Manifestar \nesa grandeza que existe en cada uno de nosotros y ponerla al servicio de  los demás. ¿Podemos imaginar por un momento el increíble efecto que  esto podría tener en el mundo?  ¿Sirven las cadenas de oración?  En su momento también me lo cuestioné y más ahora, que son tan  solicitadas  en  redes  sociales.  Tengo  que  manifestar  que  nunca  lo  he  solicitado aun con la posibilidad de tener acceso a millones de personas  que gracias a Dios me siguen, ni en la gravedad de mi padre.  Una vez más te confieso cierta incredulidad, pero después de conocer  la historia que leerás a continuación, lo dejo a tu criterio.  Es la historia de María Elena Guerrero Campos y su hijo Rolandito,  que en el 2007 tenía apenas doce años.  Su historia es de ésas que como médico me resulta difícil de creer y  solamente es posible entender con los ojos de la fe.  A esa edad, Rolandito fue diagnosticado con un tipo de cáncer en sus  ganglios linfáticos llamado linfoma no Hodking, con un pronóstico poco  favorable  de  vida  con  tratamiento  adecuado.  Su  médico  fue  claro,  su  tratamiento es 80% actitud y 20% las quimioterapias. “Nuestras vidas  cambiaron  —me  dijo  María  Elena—,  cambiamos  las  canchas  de  entrenamiento de mis hijos por hospitales y los balones por jeringas y  dolor, mucho dolor. Mis hijos haciendo la tarea en frías salas de hospital,  mi esposo y yo sin trabajar, nuestras finanzas estropeadas por el alto costo  de la enfermedad y mi hijo con mucho sufrimiento. Ver cómo tu hijo se  va deteriorando, créelo, no es nada fácil.”  Lamentablemente, antes del año, el diagnóstico cambió; la presencia  de  una  leucemia  linfoblástica  aguda,  muy  agresiva,  dio  un  vuelco  al  pronóstico: “De 10 enfermos, mueren ocho —nos dijo el médico—, y el  costo  es  cinco  veces  mayor  aunado  a  las  pocas  posibilidades  de  sobrevivencia.”  A Rolando se le hizo un trasplante total de médula ósea a la edad de  13  años,  efectivamente,  presentó  todas  las  complicaciones  que  los  médicos advirtieron, insuficiencia renal, hepática y pulmonar. \nSu madre, puso una foto de él completamente sano frente a su cama  para que no olvidara que detrás de tanto dolor aún estaba él; que todo  pasaría y volvería a su vida normal.  En un hospital con un enfermo así no hay diferencia  entre los días y las noches, -me dijo en su carta. El piso  huele a muerte y a Dios al mismo tiempo. Así todos los  días  nos  arreglábamos,  él  me  preguntaba  “¡¿para  qué?!”... Y yo siempre contestaba: “Porque hoy, si Dios  nos dice hoy sí al milagro, tenemos que estar listos”; lo  hacía  salir  del  hospital  en  su  imaginación  y  juntos  corríamos en el parque, tomábamos helado y hacíamos  las cosas que le gustaban, era la única forma de que el  encierro del hospital no nos volviera locos.  Convertimos    las    oraciones    donde    pedíamos  desesperadamente por su salud, en gratitud. Lo hacía  repetir una y otra vez, ¡GRACIAS, SEÑOR, POR MI  SALUD PERFECTA!  Pegué  cientos  de  cartas  de  ánimo  de  sus  compañeros del colegio en las paredes del hospital, las  cuales lo hacía leer una y otra vez, varias veces al día;  palabras de ánimo que hablaban de su salud total. ¡Te  estoy reseteando! -le decía-, como tú lo haces con tu  laptop.  El miedo lo cambiamos por fe y la incertidumbre en \nesperanza,  y  así  las  oraciones  donde  pedíamos  desesperadamente  por  la  salud  de  mi  pelón,  -como  cariñosamente le decía- se convirtieron en oraciones  de gratitud, dando por hecho el favor de Dios en la  salud de mi muchachito.  Inicié  una  cadena  de  oración  con  todos  mis  contactos  vía  mail  (no  existía  el  Facebook)  donde  describía lo que estábamos viviendo en el día a día, en  el  hospital,  pues  traspasó  fronteras;  siempre  terminaba  el  correo  dando  gracias  por  la  salud  perfecta de mi hijo y en respuesta a eso, recibíamos  cientos de correos diariamente de personas que iban  siendo tocadas en su corazón por este niño que sufría  desde su cama. Empezaron a visitarnos personas que  querían conocer al niño que estaba luchando tanto por  su vida. Hicimos de esta tragedia una oportunidad para  muchas personas de ser mejores.  Rolando tuvo toda clase de complicaciones, desde un  derrame cerebral hasta, lo más grave, un bloqueo en la  circulación del hígado que lo hizo funcionar a un 10% de  su capacidad.  Mi esposo y yo nos mantuvimos al lado de su cama  cuidando  cada  detalle  de  sus  exámenes,  de  su  evolución, viendo monitores, tratando con médicos las  malas noticias que llegaban todos los días y haciendo de  su día a día lo mejor que se podía.  La Navidad de 2008 sufrió un coma y permaneció en  cuidados intensivos muchos días, yo le hablaba al oído  de noche y de día, pidiéndole esas estrategias que él  hacía con su play station para matar a los malos, le  cantaba las canciones de cuando era chiquito, platicaba  con él de lo que haríamos en cuanto saliéramos de ahí a  pesar de su inconsciencia. Una de esas noches, entre  muchas cosas que pasaron, nos anunciaron que tenía una  hemorragia pulmonar, que con solo 2 000 plaquetas no  podría ser resuelta de inmediato, como muchas otras \nveces  lo  hice,  escribí  mi  CADENA  DE  ORACIÓN.  ¡Despierten!  ¡Rolando  se  agravó  y  necesito  sus  oraciones!  La opción: poner plaquetas, pero tardan 3 horas en  pasar  y  hacer  efecto,  la  hemorragia  sigue  y  podría  tener  resultados  fatales;  lo  hicimos...  durante  esas  tres  horas,  cientos,  si  no  es  que  miles  de  personas  oraban por Rolando, cuando los médicos realizaron una  nueva radiografía no encontraron el sangrado, esto era  inexplicable para los médicos. Esa noche habló Dios.  Esa  Navidad  cuando  ya  había  librado  el  coma,  al  hacer oración, le pedí que diera gracias a DIOS y me  dijo: “Gracias de qué, mi cuerpo está lleno de úlceras,  no  puedo  caminar,  ni  comer,  no  controlo  mis  necesidades fisiológicas.” “¡Pero estás vivo!”, contesté,  “este piso de hospital está lleno de niños más graves  que tú”.  Me dediqué a sacar la valentía de mi chaparro.  Afortunadamente mi historia tiene un final feliz, un  día el sí tan esperado llegó y Rolando milagrosamente  se fue recuperando poco a poco, a pesar de que sólo  hay DOS CASOS documentados en el mundo, el de mi  hijo y el de otra persona que lamentablemente murió.  Rolando  hoy  está  totalmente  sano  y  DIOS  nos  permitió que no quedara absolutamente ninguna secuela  de las que los médicos pronosticaban. Mi hijito tuvo que  aprender a caminar de nuevo y de la parálisis facial  bilateral que sufrió se recuperó por completo, al igual  que de todos los órganos que se habían dañado.  Mi hijo regresó como un héroe de guerra, un día en  una  entrevista  que  le  hicieron,  le  preguntaron,  que  cómo le había hecho, cómo había vencido el miedo a  morir y él contestó algo que me sorprendió: “Es que mi  Fe nunca cambió, mi mamá me dijo que no moriría que  confiara en Dios”, él no escuchó todo lo que los médicos  decían frente a él. \nRealmente  estas  enfermedades  pueden  llevarse  patrimonios,  pueden  romper  matrimonios,  pueden  acabar con familias completas, pero nunca podrán con  una Fe y esperanza inquebrantables.  Quise transcribir la carta de esta valiente madre tal y como me la envió.  Hoy con orgullo te digo que de alguna manera fui tocado también por este  niño que valientemente sobrevivió a la más grande de todas las batallas,  luchó  por  su  vida  y  triunfó,  incluso  tuve  la  fortuna  de  tenerlo  en  mi  programa de radio y conocer su experiencia de viva voz.  Hoy me uno a la alegría de su familia y de todos los que fuimos  testigos de este milagro que solamente la fe y la oración comunitaria  pueden realizar. \nsí como los que se preocupan se adelantan al futuro, otros nos  quedamos en el pasado.  El  apego  al  pasado  surge  cuando  nuestras  fibras  más  sensibles se ven lastimadas y dejan una herida abierta que nos cala a cada  paso. Y aunque el pasado ya no exista, el dolor que causa sí es real. Por  eso es importante que entendamos el qué y el cómo de estas huellas que  nos condicionan y nos lastiman.  Hablando  del  qué,  un  estudio  científico  reveló  que  las  principales  anclas del pasado son nuestras relaciones con los demás. Nuestro estatus  social nos importa más que cualquier otra cosa. Como buenos animales  de manada, los seres humanos siempre tenemos un deseo de pertenecer y  agradar, por ser útiles a la sociedad y ser reconocidos en el intento.  De  ahí  surge  que  nuestros  recuerdos  más  atesorados  son  los  que  implican armonía, intimidad o conexión con otras personas —algún beso,  algunas vacaciones familiares, algún premio por nuestras obras— y los  que más daño nos provocan son los que conllevan ataques, discordia y  separación —alguna traición, alguna humillación, alguna pérdida.  Nuestra interacción con el mundo no sólo abre la herida, también le  puede echar sal. Digamos que dañaste a alguien. Herir a una persona no  sólo  causa  una  tristeza  suficiente,  además  el  dolor  emocional  redobla \nesfuerzos cuando tememos que los demás nos castiguen. Tan sólo pensar  en encontrarnos con represalias sociales dispara sentimientos de culpa y  vergüenza.  Y  entre  más  culpa  y  vergüenza,  más  tristeza  sentiremos  porque basamos nuestra autoestima en la impresión que los demás tienen  de nosotros. Es un círculo vicioso que no deja de reforzarse.  Nuestra vida es en buena parte la historia de estos nudos emocionales.  Para deshacerlos, el doctor y escritor Leon Seltzer nos sugiere la siguiente  solución: revisar el pasado, no revivirlo.  A  falta  de  criterio  (por  no  decir  que  estábamos  muy,  pero  muy  verdes), en nuestra infancia y juventud nos tomamos muy a pecho lo que  acontece alrededor. Creemos además que todo se trata de nosotros. Nos  echamos la culpa de los conflictos entre nuestros padres, del  bullying  que  padecemos, de cada una de las malas decisiones...  La ventaja de ser adultos (¡alguna habría que tener!) es que nos da la  madurez para ver los toros desde la barrera. En vez de ingresar al ruedo y  seguir exponiéndonos en vano, podemos poner en perspectiva el pasado e  identificar en el ayer los efectos que quizá sigamos sufriendo hoy.  De verdad, considera que es normal que en nuestra tierna edad seamos  inocentes,  que  ignoremos  muchas  cosas,  que  no  comprendamos  las  intenciones o las razones de los demás. Dice Seltzer que la reconciliación  con nosotros llega cuando vemos que el pasado tenía que suceder así,  dadas nuestras limitaciones. Que ciertos destinos en nuestra vida estaban  en realidad fuera de nuestras manos.  Debemos tomar esa mirada compasiva y entonces someter a juicio  esas historias y personajes que tanto nos creímos. Porque justo aquí está  la raíz de nuestros complejos y sufrimientos crónicos. Descubriremos que  muchas de nuestras creencias y sentimientos negativos están arraigados  en percepciones erróneas.  TE SUGIERO ESTO DE CORAZÓN: ENCUENTRA ESOS  PUNTOS DE QUIEBRE EN TU VIDA; CONTEMPLA CÓMO NO  SON ASUNTOS TAN SERIOS COMO LOS CREÍSTE EN SU  MOMENTO; NO TODO EL MUNDO GIRABA ALREDEDOR DE  TI. ESTO SE CONVERTIRÁ EN EPIFANÍAS Y SUAVIZARÁ LOS  NUDOS DEL PASADO. MUCHOS DE ELLOS TERMINARÁN  POR CEDER Y ES CUANDO TE DIRÁS AL COMPÁS DE UNA \nRISA LIBERADORA: “¿ESO ERA TODO?”  También cambia esos “hubiera” con los que buscas cambiar el pasado por  un “podría ser” fincado en el ahora, pero con miras a un mejor futuro.  Ante la duda siempre regresa a los hechos: no podemos deshacer lo que  hicimos en el pasado. Lo hecho, hecho está, y debemos hacer las paces  con sus resultados.  Como bien sabemos, quien no conoce la historia está condenado a  repetirla, pero aquí habría que matizar que la historia está para aprenderla,  no para sufrirla.  Viviendo en el pasado  “Quisiera  tener  un  borrador  mágico  para  quitar  de  mi  vida  específicamente el 6 de abril de 2010. Que ese día no hubiera existido por  el  dolor  que  me  causó,  por  la  decisión  que  tomé  sin  medir  las  consecuencias.”  Palabras expresadas por Marcia, asistente a una de mis conferencias y  que saludé en la firma de libros que al final se llevó a cabo.  Ella  trabajaba  en  la  gerencia  de  una  empresa  exitosa  con  gran  expansión. Reconoce que tiene un carácter fuerte, no se deja de nada ni de  nadie  y  si  llegó  a  tan  importante  gerencia  fue  por  su  capacidad  y  su  astucia en los negocios. Su fuerte eran las ventas y se jactaba de ser la  vendedora más exitosa de la empresa por varios años consecutivos.  Dicho éxito le daba cierto aire de superioridad, además de seguridad.  En un altercado con su jefe, el director general de la empresa, ella  perdió completamente el control de sus emociones, de sus palabras y dijo  que si no le gustaba su trabajo que entonces renunciaba en ese preciso  momento.  El director, un hombre sensible y paciente le pidió, casi le suplicó, que  midiera y analizara la magnitud de su decisión, a lo cual ella contestó que  no tenía nada que pensar —dicho lo anterior, con más enojo que antes,  salió de la oficina de su jefe dando un portazo.  La verdad —me dijo—, me sentía indispensable porque desde que yo  había entrado a la empresa, 13 años antes, la compañía había logrado  crecer a pasos agigantados, y sin ánimo de presumir, gracias a mis ventas  se había logrado gran parte de ese crecimiento. \nElla, siempre segura de sí, estaba plenamente convencida de que al día  siguiente  se  iba  a  reconsiderar  la  decisión  que  había  tomado,  y  se  le  insistiría para no renunciar; casi juraba que le iban a rogar, pero no fue  así.  El director le tomó la palabra y aceptó su renuncia.  Su orgullo y soberbia le impidieron hablar para ofrecer una disculpa.  Desde entonces su vida cambió por completo, aunque siempre se jactó  de que jamás se arrepentiría de nada, con esta decisión no fue así. A la  fecha no ha logrado conseguir un trabajo tan bien remunerado y en el cual  se sienta tan contenta como en el que estaba.  Después de un periodo de depresión, logró entrar —a pesar de su  edad, según sus propias palabras— a otra empresa de un giro similar a la  que estaba pero no logró los resultados que se esperaban de ella.  Duró  ahí  dos  años  y  desde  entonces  se  dedica  a  ser  consultora  independiente.  “Quisiera  borrar  ese  día  o  regresar  el  tiempo  para  controlar  mis  palabras y decisiones tomadas sin pensar.”  Con la historia de Marcia, recordé la gran verdad que dice que todos  tenemos ciertos momentos de locura durante toda nuestra vida y que son  esos momentos en los que la emoción le gana a la razón guiándonos por  el  enojo,  el  coraje,  la  frustración  y  no  conectamos  la  lengua  con  el  cerebro.  Decimos lo que muy en el fondo sentimos pero no es conveniente decir;  expresamos  lo  que  sentimos  pero  con  las  palabras  equivocadas  y  no  medimos las consecuencias de nuestros actos o expresiones.  —Desde  entonces  —agregó  Marcia,  no  dejo  de  pensar  en  todo  lo  bueno que durante 13 años logré, el dinero que gané, los compañeros y  amigos que hice, los sueños que cumplí y que ahora se han desmoronado  por un momento de torpeza y ego desmedido. Nadie es indispensable — \ndijo. Y lo aprendí con base en mucho dolor.  Historia similar vivieron Sandra y su novio Eduardo.  —¡No quiero volverte a ver nunca más en la vida!  Y siempre lo volvía a ver ya que él pacientemente la buscaba...  —¡No me vuelvas a hablar nunca más!  Y Eduardo le volvía a hablar. Ya que para él, el orgullo no era algo  que se le daba fácilmente, además la quería, y mucho.  —¡Ya me hartaste! ¿Qué no entiendes que ya no te quiero?  Y al rato lo volvía a querer, pues nunca lo dejaba de querer realmente.  Se acostumbró tanto a sus arranques y a sus reconciliaciones que ya  daba por hecho que la buscaría.  Un  día  Eduardo  le  dijo  muy  seriamente  que  no  le  gustaban  esos  arranques. Que el amor que le tenía era inmenso y que nunca dudara que  ella era la mujer que más había amado y amaría por siempre.  No obstante, sus arranques por todo y por nada seguían y cada vez con  más frecuencia.  Ante cualquier diferencia por cosas insignificantes sus arranques de  ira se hacían presentes con sus respectivas palabras hirientes y siempre  con el finiquito de la relación.  —Al cabo siempre me llama —le llegó a decir a su mejor amiga.  Pero un día, en el que el novio fiel, o mejor dicho, su ahora ex novio  fiel y abnegado como todos los hombres que están leyendo este libro, se  retrasó una hora por motivo de su trabajo, ella —como era de esperarse—  estalló en cólera vociferando una de sus trilladas y conocidas frases: “¡No  me vuelvas a llamar nunca más en tu méndiga vida!”  Y cortó la comunicación de su celular con su respectiva rabieta.  —Ya verás amiga—, le dijo a la que estaba presente como fiel testigo  de su enojo—, me llamará en 10 minutos pidiendo perdón.  10 minutos y  nada... 20 minutos  y nada... 1  hora... 2 horas...  y  nada...  —¡A ver! ¿Checa si está bien mi celular? Márcame del tuyo amiga,  por favor...  —No, el celular está bien.  —Qué  raro  —pensó  ella—,  ¡Ah!  ¡Ya  entendí!  Como  mañana  cumplimos años de novios, va a venir con serenata como cada año y  pedirá perdón. ¡Falta que lo perdone! ¡Porque a mí no me gusta que me  dejen así tanto tiempo! \nSe fue a su casa con la misma seguridad de siempre.  Las 12 de la noche, la 1 de la madrugada, las 2, las 3 y nada...  Ella  con  el  ojo  pelón  imaginaba  y  se  preguntaba  “¿qué  habrá  sucedido? ¡Siempre me llama! Yo no le voy a hablar. ¡Como que me  llamo  Sandra  Sánchez  Hernández!”  —nombre  real  presentado  con  autorización de la autora de tan lamentable historia.  “¡Por supuesto que no le llamaré! ¡Mañana estará aquí a primera hora  llorando como un niño e implorando mi perdón! Quién quita y hasta el  anillo de compromiso me da.”  El día siguiente y nada, la semana siguiente y nada, el mes siguiente y  nada. Y hasta a la fecha, nada...  Ella dice que lo que no es para ella no va a ser, y que lo más seguro es  que él no era para ella.  Lo malo es que ni él ni nadie han sido para ella. Ya pasaron 3 años del  suceso y sigue sola, extrañando a un hombre tan bueno, tan noble, tan  fiel,  de  tan  buena  familia,  dicho  sea  de  paso,  de  tan  buena  posición  económica como hay pocos.  Ella aclara que tiene un carácter fuerte e impulsivo, y que a sus 36  años ya aparecerá alguien que la quiera como es. (“Ajá... eso es tener fe.”  Nota del autor.)  Se puede vivir en el pasado por varios motivos:  1  Para borrar un evento. Algún suceso que desearíamos no haber  realizado o cambiarlo como por obra de magia, como los casos  de Marcia y Sandra.  2  Por añoranza de lo vivido. Recordando que el pasado siempre  fue mejor, reviviendo mentalmente sucesos que ya quedaron  atrás; como si pudiéramos etiquetar la película de la vida como  un  documento  histórico,  donde  todo  lo  vivido  siempre  será  mejor que el presente.  Mi querida amiga, tanatóloga, escritora y colaboradora de mi programa  de radio, Gaby Pérez, dice que el pasado es un maravilloso lugar para  visitar, pero nunca para permanecer allí. \nMucha gente vive en un pasado que por más que quiera no lo podrá  cambiar ni regresar.  Estoy seguro de que mucha gente se puede identificar con alguna de  las historias compartidas por la similitud de hechos o por las ganas de  querer modificar lo vivido con sus respectivas consecuencias.  Es bueno visitar el pasado cuando se trata de aprender de experiencias  vividas, recordar acontecimientos que nos hagan sentir bien en el presente  y  para  agradecer  lo  vivido,  pero  no  para  evocar  constantemente  sentimientos como la añoranza, la tristeza o el rencor.  Lo vivido, vivido está y para atrás ¡ni para agarrar vuelo!  Te  equivocaste,  perdiste,  hiciste,  no  hiciste,  no  te  controlaste,  te  pasaste, te arrebataron lo que era tuyo —o lo que creías que era tuyo—, te  atontaste (por no decir otra palabra), ¡YA! Aprendiste la lección por más  dolorosa que sea y no permitas que la mente te esté transportando a un  pasado que lo único que hace es hacerte revivir la pésima experiencia que  te impide disfrutar lo único que verdaderamente tienes, el presente.  No le des largas: deja el “ahorita” y abraza el ahora  Nuestra mente nos juega muchos trucos. Tiene, por ejemplo, una fijación  por serle infiel a la realidad.  Sólo  existe  el  ahora,  sin  embargo  se  aferra  a  otros  tiempos.  La  ansiedad,  el  miedo  y  la  expectativa  nos  transportan  al  futuro;  el  remordimiento, la tristeza y la vergüenza nos llevan al pasado.  Sólo existe el aquí, pero se empecina en retraerse en su propia versión  de  la  realidad.  Somos  tan  preocupones  y  aprensivos  que,  absortos  en  nuestros  propios  líos,  nos  perdemos  lo  que  ocurre  frente  a  nuestras  narices.  Pese a que estos paseos no son del todo placenteros, somos viajeros  frecuentes.  Nos  quedamos  irremediablemente  atrapados  en  nuestras  propias telarañas mentales, sin siquiera darnos cuenta.  Los  budistas  tienen  un  nombre  para  esta  dispersión:  “Mente  de  mono.” Nuestra atención es un changuito que no sabe quedarse quieto.  Brinca de liana en liana en busca de un lecho que nunca le satisface. Para  cuando se da cuenta, ya cruzó toda una selva y se pregunta: ¿Cómo llegué  hasta acá?  Sucede que vivimos en la reacción del mundo imaginario y no en la \nacción del mundo real. Las cosas no siempre suceden como esperamos y  por eso luego inducimos una bola de reclamos: “¿Por qué me pasa esto a  mí?, ¿por qué hice eso?, ¿por qué no hice aquello?”  ¿Puedes  sentir  en  ti  ese  vacío  que  separa  tus  expectativas  de  la  realidad? El sufrimiento es un monstruo que se alimenta de esa distancia.  Y no sólo eso, también le prestamos nuestra ayuda al creer torpemente  que el juicio negativo y la queja son productivos, cuando sólo echan leña  al fuego de nuestros enojos, miedos y tristezas.  La  solución  radica  en  un  cambio  total  de  perspectiva.  En  vez  de  negarla o crearle distractores, debemos tomar la realidad así como viene.  Los hechos son hechos; no cambiarán sólo por los sentimientos que nos  despierten. Ocurren independientemente de nuestro juicio. Jesús dijo “la  verdad  os  hará  libres”,  por  una  razón.  En  la  verdad  donde  todos  coincidimos, los hechos reconcilian porque no dan cabida a la diferencia;  en  esta  reconciliación  encontramos  la  armonía  y  la  paz.  Es  nuestra  responsabilidad encontrar y honrar esa verdad; esto sólo es posible en un  reconocimiento  de  cada  momento  y  de  cada  lugar  en  que  nos  encontremos.  ¿Fantasía o realidad?  “Una mente humana es una mente distraída, y una mente distraída es una  mente infeliz”, aseguran Matthew Killingsworth y Daniel Gilbert, para  luego rematar: “La habilidad de pensar en lo que no está pasando es un  logro cognitivo que viene con un costo emocional.”  Estos psicólogos de la Universidad de Harvard tuvieron un hallazgo  impresionante: nuestra mente se mantiene errática y distraída cerca de  50%  del  tiempo,  independientemente  de  la  actividad  que  estemos  realizando. Sus estudios incluso sugieren que la felicidad no tiene tanto  que ver con nuestras actividades, sino con qué tan presentes estamos al  realizarlas.  Porque ¿qué sucede cuando deseamos ser felices en un tiempo que no  es ahora y un espacio que no es aquí? En un estudio publicado en la  revista    Psychological  Science,   investigadores  descubrieron  que  las  personas que fantasean con un futuro ideal tienden a tener síntomas de  depresión cuando ese futuro llega.  Veámoslo de esta manera: las fantasías son como tratarnos un mal \ncrónico con sedantes. Sí, primero tienen un efecto terapéutico que nos  crea la ilusión de que el problema se ha marchado; sin embargo, a la  larga, la dosis sólo nos mantendrá aletargados y nos robará la energía  necesaria para encontrar un remedio que sí lo arranque de raíz.  No me tomes a mal, soy un firme creyente del poder del pensamiento  positivo;  pero  lo  soy  siempre  y  cuando  esté  afincado  en  el  esfuerzo  personal. De nada sirve crear esperanzas si, acto seguido, nos echamos a  la  hamaca  a  esperar  que  todo  se  solucione  solito.  Creo  en  los  complementos, en cómo nuestras aptitudes y actitudes deben trabajar en  equipo para conseguir su objetivo.  Michael Jordan escribió: “Algunas personas quieren que algo ocurra,  otras sueñan con que pasará, otras hacen que suceda.” En el resto del  capítulo  ahondaremos  en  provocar  intencionalmente  que  la  felicidad  llegue desde el ahora. Después de todo, sólo puede ocurrir ahora y en  cada uno de esos ahoras que conformarán nuestro futuro. Si lo piensas, la  meta  es  idéntica  a  cada  uno  de  los  pasos  que  damos  hacia  ella:  es  imposible  cumplir  el  objetivo  de  ser  feliz  sin  serlo  durante  nuestro  trayecto, ¿o qué tan lógico te suena llegar a la felicidad por medio de una  serie de corajes?  El potencial de prestar atención  Aunque  habitar  en  la  fantasía  nos  hace  infelices  y  tengamos  una  inclinación por ella, la suerte no está echada. Podemos tener voz cantante  en nuestro destino si emprendemos las acciones adecuadas. De años para  acá el  mindfulness  (“conciencia plena” o “atención plena”, en español) se  ha revelado como una herramienta muy valiosa para domesticar nuestra  mente.  Las bondades de la conciencia plena alcanzan prácticamente todas las  dimensiones  del  ser  humano,  según  un  artículo  de  la  Universidad  de  Berkeley: practicarla beneficia nuestro cuerpo, mente, cerebro, vida social  y compasión. Pero sobre todo es una vía muy efectiva para encontrar la  felicidad,  aun  para  quienes  padecen  depresión  y  trastorno  por  estrés  postraumático (muy frecuente en los veteranos de guerra).  Richard  Davidson,  de  la  Universidad  de  Wisconsin,  en  Madison,  explica que este bienestar llega más pronto de lo esperado.  Primero descubrió que cuando estamos de mal humor se activa el área \nprefrontal derecha de nuestro cerebro; en cambio, con el buen humor  ocurre lo opuesto: se estimula la sección izquierda. Aunque casi todos  experimentamos un balance entre ambos lados, en algunas personas sí  existen patrones cargados a uno o a otro: hay quienes en general activan  más  el  lado  derecho  —los  más  propensos  a  presentar  cuadros  de  depresión o ansiedad— y quienes hacen lo propio con el izquierdo —  gente que tiende a recuperarse con facilidad de sus reveses.  El experimento liderado por Davidson consistió en seleccionar a un  grupo de empleados que, por la naturaleza de su trabajo arduo tendían a  activar la parte cerebral derecha —el lado característico del mal humor.  Posteriormente, con la ayuda de un instructor calificado, les enseñaron a  practicar la técnica del  mindfulness.  El  resultado  fue  que,  luego  de  sólo  ocho  semanas  de  aplicar  este  método, las resonancias magnéticas detectaron un movimiento hacia la  sección  izquierda  de  los  participantes,  además  de  que  confesaron  de  forma espontánea haberse reencontrado con aquello que amaban de sus  empleos.  Conclusión:  el  retorno  de  la  inversión  llega  en  muy  poco  tiempo.  El poder de esta técnica queda de manifiesto. La mala inercia de toda  una vida puede contrarrestarse en cosa de meses. Consideremos que si en  nuestra inconsciencia lo hemos usado para mal, el poder de la mente es  tan grande que, atizándolo con toda nuestra actitud, podemos enderezar  nuestro rumbo hacia la felicidad de forma relativamente sencilla.  El ancla del aquí y el ahora  Más allá de algunos prejuicios que tengamos por aquello de las oídas, el  mindfulness  no es una práctica religiosa y mucho menos un superpoder.  En realidad, se trata de optimizar una función muy básica de nuestro  cerebro: la atención.  El  mindfulness  es poner atención de forma sincera y focalizada en el  presente, con todas las sensaciones, sentimientos y pensamientos que eso  implica.  Es  acudir  plenamente  a  lo  que  nos  sucede  a  cada  instante.  También es detectar el momento en que nuestra mente se descarrila y  hacer lo posible para reencarrilarla rumbo a lo que sucede aquí y ahora.  Thich Nhat Hanh, uno de los maestros budistas más influyentes de  nuestro  tiempo,  lo  ejemplifica  con  algo  tan  cotidiano  como  lavar  los \ntrastes. Nos dice que al lavarlos debemos estar sólo lavando los trastes.  Aunque esto suene tonto de entrada, permíteme lanzar un reto para  comprobarte que no lo es: lava los trastes y haz una anotación cada vez  que tu mente divaga mientras lo haces. Apuesto a que casi llenarás la  hoja. Y es que, en tareas así de mecánicas, identificarás una tendencia  muy marcada a abstraerte en tus pensamientos o a quejarte internamente  por alguna inconveniencia.  Thich Nhat Hanh abunda en el tema: “El hecho de que esté parado  lavando estos tazones es una realidad maravillosa. Soy completamente  yo, siguiendo mi respiración, consciente de mi presencia y consciente de  mis pensamientos y acciones. No hay manera de arrojarme de lado a lado  inconscientemente, como una botella que pasea de aquí para allá entre las  olas.”  Créeme: hay algo muy profundo en anclarte en el constante flujo de tu  experiencia  en  ese  segundo  a  segundo.  Es  como  estar  despierto  al  cuadrado.  Puedes  caer  en  cuenta  de  que  antes  vivías  prácticamente  soñando despierto.  Aceptar la realidad tal como viene  Pero no podemos practicar el  mindfulness  sin cumplir con un requisito  previo: la aceptación.  Definamos primero lo que NO es la aceptación. No es una resignación  pasiva  ante  la  desgracia;  no  es  bajar  los  brazos  y  ceder  el  control  a  poderes externos; tampoco es aguantar a regañadientes ni mucho menos  reprimir las emociones repitiendo, dientes para afuera, “todo está bien,  todo está bien”, mientras a nuestro alrededor todo arde en llamas.  La  aceptación  es  recibir  la  realidad  sin  juicios  ni  reacciones.  Recordemos que la mente no es muy ducha para atender dos cosas a la  vez. Si juzgamos o reaccionamos estamos ocupados justamente en eso:  juzgando o reaccionando; y es así como permanecemos ignorantes de  todo lo que ocurre en la realidad.  Para lograr distinguirla de la expresión común, Tara Brach, psicóloga  y asidua practicante de la meditación, le agrega un apellido a la palabra.  La  llama  “aceptación  radical”.  Esta  es  la  suma  de  dos  elementos:  un  reconocimiento de lo que sucede dentro de nosotros y la voluntad valiente  de vivir el momento presente. \nTomemos  dos  términos  de  Tara:  “reconocimiento”  y  “voluntad  valiente”.  Requerimos  de  valentía  para  voltear  a  reconocer  lo  que  llevamos  dentro,  nuestros  pensamientos  y  emociones.  A  veces  les  tenemos pavor; otras tantas nos provocan una enorme culpa o vergüenza.  Por eso no nos animamos a asomarnos. Creemos que estas experiencias  internas son tan poderosas que nos pueden rebasar o, peor aún, que somos  malvados por el simple hecho de que crucen por nuestra mente o nuestro  corazón.  La aceptación radical se logra con una disposición de recibir y abrir la  mente ante las cosas tal y como llegan. Nuestra atención debe ser un  manto que lo cubra todo: aunque creamos que sean malos o buenos, o a  pesar de que se sientan bien o mal, debemos observar tanto los estímulos  externos (lo que percibimos con los sentidos) como los internos (nuestros  pensamientos  y  emociones).  También  es  normal  que  estos  estímulos  disparen, a su vez, nuevas reacciones emocionales; pues sí: también debes  incluirlas en tu rango de atención.  Por ejemplo, si de pronto, por angas o por mangas, un ex del pasado  remoto  visita  nuestra  mente  y  vuelve  a  abrir  viejas  heridas.  ¿Cómo  proceder? La forma más compasiva y provechosa es darte permiso de  explorar tu pensamiento, la tristeza y el enojo que este recuerdo disparó.  Te aseguro que no hay nada que temer. Sólo no olvides que todo ocurre  en tu mente, no corres ningún peligro por experimentarlo, por palparlo,  por aceptarlo como es.  “Lo que importa al inicio es que cultives una intimidad con tu propia  experiencia”,  aconseja  Brach.  Esta  intimidad  significa  darnos  la  oportunidad  de  ser  vulnerables  y  sensibles  con  lo  que  pensamos  y  sent
