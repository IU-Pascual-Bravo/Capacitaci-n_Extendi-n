imos. Y es como en todo: primero debemos aceptar el problema y  luego conocerlo plenamente para, ahora sí, buscar una solución relevante.  La  intimidad  es  una  inmersión  en  nuestro  yo  y  todos  sus  visitantes  (sensaciones,  sentimientos,  pensamientos...),  es  dejarnos  empapar  sin  reservas en busca de la respuesta.  “Al  arribar  con  honestidad  y  apertura  a  la  experiencia  de  este  momento  creas  entonces  la  posibilidad  de  responder  con  sabiduría  y  compasión.  Por  ejemplo,  la  aceptación  radical  de  la  ansiedad  puede  incentivarte a que compartas tu experiencia con un amigo cercano, salgas  a caminar al bosque o escribas una entrada en tu diario”, concluye Tara.  Gracias  a  la  aceptación,  tomamos  decisiones  conscientes  que,  a  la \nlarga, se convierten en soluciones más acertadas a nuestros problemas y  motivos de sufrimiento.  La gracia de dar gracias  Llevo más de 15 años con el hábito de levantarme cada mañana y hacer  mi sesión de agradecimiento, la cual dura unos cuantos minutos pero  cuyos beneficios siento cada vez más. Siempre doy las gracias por todo lo  bueno  recibido  y  por  todo  lo  bueno  que  vendrá.  Sé  que  el  futuro  es  incierto, pero agradecer por anticipado me ha hecho más fuerte y, sobre  todo, más consciente de que todo es por algo y para algo.  Procuro  agradecer  antes  de  comer,  antes  y  después  de  una  intervención en radio, televisión o una conferencia, pero sobre todo y en  su momento, he llegado a agradecer hasta por lo no tan bueno que me ha  sucedido. Sé que no siempre es fácil pero con base en la repetición se ha  convertido en un hábito maravilloso.  Dar las gracias es apreciar lo que tenemos hoy y no lamentarnos por lo  que nos falta en comparación con el ayer o el mañana. Con el hábito de la  gratitud adoptamos una disposición por buscar excusas de las buenas:  razones para darle la bienvenida a la belleza, a la bondad y a todas las  bendiciones vertidas sobre el mundo.  Te preguntarás: ¿De verdad el agradecimiento puede elevar el nivel de  felicidad?  La gratitud y la felicidad van de la mano, según la clara y constante  evidencia científica. En un estudio de las universidades de California y de  Miami, reclutaron a participantes, a quienes dividieron en tres grupos: a  unos  les  indicaron  que  escribieran  las  cosas  por  las  que  se  sentían  agradecidos durante la semana, a otros les solicitaron que anotaran los  enfados o molestias de ese periodo, y a los últimos que hicieran lo propio  con las situaciones que los habían afectado (sin enfatizar si la afectación  fue positiva o negativa). Luego de 10 semanas, aquellos que escribieron  sus experiencias de gratitud fueron más optimistas, se sintieron mejor con  sus vidas, incluso tuvieron menos visitas al doctor que el resto.  En otro estudio de la Universidad de Pensilvania, se les solicitó a los  participantes enviar una carta de agradecimiento a alguna persona que lo  mereciera.  Tras  cumplir  con  el  encargo,  los  participantes  aumentaron  sustancialmente sus niveles de felicidad; aumento que, por cierto, les duró \nhasta un mes.  “Cuando agradeces, el miedo desaparece y la abundancia aparece”,  dice Tony Robbins, un convencido de que dos sentimientos no pueden  ocupar el mismo espacio: “Las dos emociones que más nos arruinan son  el  miedo  y  el  enojo,  es  imposible  agradecer  y  tener  miedo  simultáneamente; y no puedes estar enojado y agradecido a la vez.”  En un reporte, la Universidad de Harvard reconoce los beneficios de  la  gratitud  y  aconseja  cultivarla  escribiendo  notas  de  agradecimiento,  llevando  un  diario,  haciendo  un  corte  semanal  de  las  bendiciones  recibidas,  rezando  o  agradeciendo  mentalmente  a  quienes  nos  han  brindado alguna alegría.  Meditación = entrenamiento mental  Yo sé que es más fácil decirlo que hacerlo. Lo del  mindfulness  parecerá  una  gran  idea,  pero  ¿cómo  romper  hábitos  tan  arraigados  como  la  distracción y la reacción emocional?  Recordemos el experimento que comenté al inicio de este apartado. La  práctica del  mindfulness  es tan poderosa y el cerebro es tan plástico que  hay más razones para ser optimistas que pesimistas.  TODO LO QUE NECESITAMOS ES LA ACTITUD DE  PROVOCAR UN CAMBIO EN NUESTRAS VIDAS E  INICIARNOS EN ESTE CAMINO. LA MEJOR MANERA DE  HACERLO ES CON LA PRÁCTICA DE LA MEDITACIÓN, UNA  ESPECIE DE ENTRENAMIENTO QUE NOS PREPARA PARA  EXTENDER EL HÁBITO A TODO NUESTRO QUEHACER  COTIDIANO.  Meditar  es  como  prepararse  en  un  gimnasio.  En  él  tenemos  las  condiciones  controladas  para  entrenar  con  miras  a  enfrentar  una  competencia;  cuando  ésta  llega,  estamos  listos  para  afrontar  los  contratiempos que ahí se presenten. Así es también con la meditación:  nos  sentamos  a  enfocar  nuestra  mente  dentro  de  un  lugar  cómodo  y  silencioso  a  fin  de  crear  una  estela  de  habilidades  y  hábitos  que  nos  mantenga imperturbables aun en lugares ruidosos y caóticos, como la  calle o la oficina. \nAunque  originalmente  está  asociada  con  las  prácticas  budistas  e  hinduistas, la meditación ha sido recibida por la ciencia con los brazos  bien  abiertos.  Gracias  a  pruebas  de  comportamiento  y  resonancias  en  laboratorio,  la  meditación  ha  probado  ser  de  ayuda  para  sobrellevar  enfermedades,  aliviar  dolores,  mejorar  cuadros  de  depresión  e  incrementar  nuestras  capacidades  de  concentración,  creatividad  y  compasión.  Aunque hay muchas, todas las técnicas de meditación tienen algo en  común:  inclinamos  la  mente  hacia  algún  objeto  de  meditación.  Recordemos que en la de  mindfulness  el objeto de meditación es todo lo  que ocurre; es decir, todo estímulo, sensación, pensamiento o emoción  que experimentemos.  Daniel  Goleman,  un  apasionado  del  tema,  cita  un  estudio  de  dos  investigadoras de la Universidad de Emory. Utilizando escáneres para  medir la actividad cerebral mientras la gente meditaba con la técnica del  mindfulness,  las científicas encontraron cuatro procesos básicos de esta  práctica:    1)     nos  enfocamos  en  un  objeto  de  meditación  (como  la  sensación de la respiración, por ejemplo),   2)   la mente divaga,   3)   notamos  dicha distracción,   4)   regresamos nuestra atención al objeto original de  meditación.  En una sesión de meditación de  mindfulness,  te distraerás una y otra  vez, es normal. ¿Y qué te toca hacer a ti? Reubicar pacientemente tu  atención donde la tenías, una y otra vez. Con el tiempo, notarás que tu  concentración mejora y, con ello, también el control que tienes sobre tu  propia mente.  El acto de meditar no demanda gran cosa, realmente. La Universidad  de  Harvard  emite  una  pequeña  guía,  que  aquí  te  resumo:  siéntate  cómodamente en una silla o en el piso, adopta una postura de espalda  recta  y  hombros  relajados;  cierra  tus  ojos;  respira  de  forma  lenta,  profunda y amable; mantén tu mente enfocada en el objeto de meditación.  Para facilitar el proceso, puedes apartar y adecuar un espacio que sólo  asocies con la actividad de meditar. Si lo haces en tu cama, por ejemplo,  corres el riesgo de concentrarte tanto, pero tanto, que acabarás babeando  en el mundo de los sueños.  Con tan sólo meditar 15 minutos marcarás una enorme diferencia.  Cuando pintes y estabilices una sonrisa de forma permanente, agradecerás  a ese yo del pasado el hecho de que haya invertido un cachito de su \ntiempo en beneficio de esos 1425 minutos restantes de tu día.  En síntesis, es tan simple como esto: atención aquí y  ahora; pero para ser más precisos:  —  Presta atención al aquí y al ahora.  —  Acepta el aquí y el ahora.  —  Agradece el aquí y el ahora.  —  Regresa al aquí y al ahora.  —   Adiéstrate  en  todo  esto  con  la  práctica  de  la  meditación.  Es difícil pensar y actuar con claridad en medio de una tormenta. Las  desgracias  ocurren  cuando  actuamos  poseídos,  cuando  el  instinto  nos  arrebata el control. El  mindfulness  es un oasis de tranquilidad ante este  ajetreo.  Tempestad  que  llega,  tempestad  que  acogemos  sin  que  cause  mucho  desastre.  Una  vez  amainada,  con  la  satisfacción  de  haberla  sobrevivido,  es  momento  de  reflexionar  sobre  los  sentimientos  que  surgieron y las razones que la provocaron.  Qué  distinto  nuestro  juicio  cuando  estamos  bajo  la  influencia  del  miedo o del enojo, ¿no? Es como si fuésemos una persona completamente  distinta. La pregunta es: ¿Harás lo suficiente para que esa versión de ti,  tranquila y feliz, llegue para quedarse?  Así que ¡a meditar se ha dicho! \nEn serio? ¿Es mejor estar solo que mal acompañado?  ¿A qué le llamamos mal acompañado? Porque hay ocasiones  que  agarramos  parejo.  Mal  acompañado  con  quien  no  piensa  igual que yo, con quien no me gusta su forma de ser, o de hablar o de  discutir.  Prefiero estar solo a tener que adaptarme a alguien que tiene manías y  costumbres que no me agradan.  Prefiero la soledad a tener que aguantar a los sobrinos o nietos aquí en  la casa, porque son muy ruidosos.  Prefiero estar solo a tener que aguantar a gente en mi casa que me deja  un tiradero que después tengo que recoger.  Prefiero estar solo y, si es posible, trabajar desde mi casa donde no  tenga que ver a nadie y tratar lo mínimo posible con los demás.  Puede ser que sientas algo exageradas algunas de las frases anteriores,  pero son frases que he escuchado de diferentes personas.  Sí, tengo que manifestar que a mí me gustan y disfruto los momentos  de soledad, pero son sólo eso, momentos. Para nada me gustaría pasar la  mayor parte del tiempo solo como mi amigo Iván.  Con 58 añitos de edad, pero su edad aparente es de 65, pelo totalmente  blanco, arrugas muy marcadas, divorciado, con dos hijos casados. Muy \nachacoso y la respuesta a la pregunta de un “¿cómo estás?”, siempre es  muy similar: “¡Todo jodido, pero estoy!”  Trabaja diseñando páginas web desde su casa.  Literalmente odia los amontonamientos y dice que sinceramente no le  gusta la gente: “Entre más lejos estén de mí mejor. A mis nietos, los  disfruto cuando llegan y más los amo cuando se van”, me dice con una  sonora carcajada.  Odia  los  perros  y  cualquier  tipo  de  animal,  a  menos  de  que  esté  muerto y se pueda comer, su casa parece un museo para ver pero no tocar.  No le gusta que le muevan sus soldados de plomo que colecciona  desde hace más de 30 años. Su nieto mayor un día tomó tres de ellos para  jugar y el grito que dio todavía se escucha en el sepulcral silencio de su  casa.  “¿Vecinos? No los conozco ni me importa conocerlos.” “Es más —me  dijo en una ocasión—, cuando salgo y por azares del destino nos topamos  las miradas, ni el saludo les doy. Es que empiezas a llevarte con ellos y  luego  no  te  los  quitas  de  encima.  Mejor  que  ni  me  saluden.  A  mis  hermanos no los veo, sólo en la Navidad y porque no me queda de otra.  Además siempre se están quejando de todo y ya con mis propias quejas  tengo como para escuchar más. Es en serio César, amo la soledad y así  soy feliz. Tú sabes que los amigos se cuentan con una mano, y a mí me  sobran 5 dedos y no por eso te ofendas.” (Por cierto, él siempre ha dicho  que yo soy su conocido, no su amigo.)  ¿Así o más claro?  El día que murió su madre, igual de antisocial que él, analicé lo triste  que puede ser un acontecimiento de esa índole al acudir a darle el pésame  y que no haya más gente expresando sus condolencias. Sólo él y sus tres  hermanos.  Un velorio nada taquillero, o sea, nada concurrido. Es de esos lugares  donde es difícil irte rápido porque se notaría de inmediato tu ausencia.  Recordé el día que un amigo comediante me invitó al teatro a ver su  show; fuimos mi esposa y yo, y menuda sorpresa que nos llevamos al  llegar  al  lugar:  no  había  sillas,  pero  ¡ocupadas!  Un  teatro  para  500  personas con 498 lugares vacíos, sólo ocupados los dos de nosotros.  Faltando 5 minutos para el inicio llegaron 4 personas más.  Bueno, algo es algo, le dije a mi esposa, pero la ausencia de gente se  notaba cuando no me reía de algunos de los chistes. Así que a reír y \nfuerte, aunque sea sólo por terapia, porque ya se demostró que la risa,  aunque sea falsa, es muy saludable.  —No  nos  vamos  a  llevar  nada  —pensé  cuando  me  encontraba  platicando  con  mi  “conocido”  Iván—,  lo  único  que  quedará  son  los  afectos otorgados y las vidas que tocaste.  —¿Así soy y qué? —sentenció Iván—, no me importa estar solo y así  es mi vida.  —¿No te da miedo enfermarte y que no haya nadie que te pueda  ayudar en esos momentos?  —No,  siempre  he  sido  enfermizo,  porque  tengo  bajas  defensas.  Bueno, eso dijo un médico que me atendió durante dos años que me  enfermé de muchas cosas.  ¿En serio es mejor estar solo que mal acompañado? ¿No será esa la  causa de sus múltiples achaques?  La verdad, no creo que sea difícil hacer amigos. Estoy seguro que a  Iván le tiene sin cuidado lo que a continuación te comparto.  Los psicólogos y científicos de varias Universidades de gran prestigio  han descubierto que hay algunas acciones que podemos hacer para causar  un buen impacto y caer lo mejor posible a las personas que deseamos  cerca.  El efecto camaleón  Un  estudio  de  NYU  dice  que  imitar  de  forma  discreta  y  sutil  el  comportamiento,  como  los  gestos  o  movimientos  al  hablar,  de  otra  persona ayuda a que sientan una mayor empatía hacia nosotros.  Revela que tienes defectos  Todos cometemos errores, pero no todos los expresan. Hay quienes con el  afán de caer bien no aceptan o expresan sus fallas o errores para así no  dejar  al  descubierto  que  no  son  perfectos,  pues  eso  los  haría  más  vulnerables y permitiría que los demás se puedan relacionar con ellos  fácilmente. Un investigador de la Universidad de Texas descubrió este  fenómeno  durante  un  experimento  en  el  que  solicitó  a  un  grupo  de  estudiantes dar sus impresiones sobre algunas personas a las que les pidió  cometer una serie de errores durante unas pruebas, el estudio reveló que  errar hacía que quienes observaban tuvieran una reacción más favorable. \nContacto humano  Tocar a alguien, obvio, en forma sutil, no manoseo mal plan, es una de las  mejores maneras de expresar calidez y hacer que alguien se sienta más  cómodo  contigo,  esto  no  quiere  decir  que  vayamos  por  la  vida  toqueteando  o  abrazando  a  todo  el  mundo,  pero  un  estudio  de  la  Université  de  Bretagne  y  posteriormente  uno  de  la  Universidad  de  Mississippi  demostraron  que  tocar  ligeramente  a  alguien,  como  una  palmadita en la espalda, puede cambiar la manera en la que nos perciben.   Escuchemos más de lo que hablamos  Un estudio de la Universidad de Harvard reveló que cuando hablamos de  nosotros,  se  produce  una  sensación  de  satisfacción  similar  a  cuando  comemos algo que nos gusta, por lo que dejar que alguien hable un poco  de sí ayuda a que se sienta mejor también.  Enfócate en lo que tienen en común  Tener cosas en común une a las personas. Y la mejor prueba de esto es  cuando  nos  agrada  mucho  alguien  con  fines  románticos  y  utilizamos  frases como “¡yo también!”, “¡a mí tampoco me gusta la mantequilla!”,  “¡es el mismo tipo de películas que me gustan!”, etcétera.  El psicólogo Theodore  Newcomb, dice que  las personas tienden  a  tener preferencia con aquellas con quienes comparten cosas en común,  por lo que enfocarte en los puntos, opiniones y valores que comparten es  garantía de que vas a caerle bien a alguien.   Amigos y familiares: el mejor seguro contra la soledad  Chuck McCarthy es famoso por ser el primer “paseador de gente” de Los  Ángeles.  Su  servicio  es  simple:  caminar  y  convivir  con  sus  clientes,  quienes le pagan siete dólares por milla recorrida en los parques y calles  de la ciudad.  Del otro lado del Atlántico, Kitty Mansfield cobra 45 libras esterlinas  por  una  hora  de  abrazos.  Se  denomina  la  primera  “acurrucadora”  del  Reino Unido y se dedica a abrazar y apapachar a sus clientes, quienes  solo buscan una dosis de intimidad; por si algún caballero tiene interés,  tengo  que  aclarar  que  las  relaciones  sexuales  están  estrictamente  prohibidas. \nEstos oficios —impensables hace apenas unas décadas— responden a  uno de los principales problemas del mundo moderno: la soledad. En esta  sociedad en la que es más fácil conseguir relaciones sexuales que cultivar  un  sentido  de  intimidad  profunda  con  otros  seres  humanos,  el  acompañamiento y la amistad corren el riesgo de caer en desabasto.  Las razones son varias: el materialismo, el entretenimiento en casa, la  crisis del matrimonio, la desunión familiar y hasta las redes sociales con  su efecto paradójico de conectar a muchos pero de profundizar tan poco.  Ya lo dice Eric Klinenberg, sociólogo de la Universidad de Nueva York:  “Un  montón  de  investigaciones  muestran  que  es  la  calidad,  no  la  cantidad, de las interacciones sociales la que mejor predice el sentimiento  de soledad.”  Soledad: ¿Epidemia o pandemia?  La  tendencia  trasciende  fronteras.  El  mundo  entero  parece  estar  adoptando un estilo de vida más individualista, que si bien es seductor al  principio, puede ser traicionero al final. Veamos algunas muestras:  —  En México, según datos recabados en 2013 por el INEGI, en  sólo una década el número de personas mayores de 25 años que  viven solas se ha duplicado.  —   Sociólogos  de  las  universidades  de  Arizona  y  Duke,  descubrieron que mientras en 1985, 25% de los estadounidenses  aseguraba  tener  sólo  uno  o  de  plano  ningún  confidente  con  quien compartir asuntos importantes, en 2004 la cifra escaló al  45%, casi el doble.  —  En un estudio nacional que tomó la opinión de 43 000 jóvenes  universitarios de Canadá en 2016, se develó que más de 66%  reportó sentirse “muy solo” durante el año anterior.  —  En el Reino Unido, una encuesta aplicada por la BBC arrojó  que 48% de los adultos de ese país sentían distintos grados de  soledad.  —  Australia no se queda atrás, pues 60% de los ciudadanos se  siente  solo  “con  frecuencia”  y  más  de  80%  piensa  que  la  soledad  se  está  incrementando  en  la  sociedad,  según  una \nencuesta a nivel nacional.  Los números no mienten. La soledad parece ser una pandemia silenciosa,  de ésas que no alertan a las autoridades sanitarias pero sí nos pueden  enfermar poco a poco desde adentro.  La soledad duele y mata  Tendemos  a  subestimar  los  problemas  psicológicos.  Los  descartamos  como si fueran secundarios; un vil capricho o debilidad de carácter, en  comparación con las enfermedades del cuerpo.  CREEMOS QUE LA SOLEDAD NOS ROMPERÁ EL CORAZÓN  COMO SI FUERA UNA METÁFORA, SIN REPARAR EN QUE,  LITERALMENTE, EL PELIGRO ES PARA EL ÓRGANO QUE  LLEVAMOS EN EL PECHO. UN ESTUDIO RECIENTE HALLÓ  QUE EL AISLAMIENTO INCREMENTA EL RIESGO DE  PADECER ENFERMEDADES CARDIACAS EN 29% Y DE  INFARTO EN 32%. SEGÚN OTRO ANÁLISIS DE 3.4 MILLONES  DE CASOS, LAS PERSONAS SOLITARIAS TIENEN 30% MÁS  PROBABILIDAD DE MORIR EN LOS SIGUIENTES SIETE  AÑOS.  Suponemos que, como en Las Vegas, todo lo que pasa en la mente se  quedará en la mente; que el dolor psicológico de la soledad no calará en  los  huesos.  Sin  embargo,  nuevos  estudios  científicos  nos  aclaran  lo  equivocados que estábamos.  Investigadores de la Universidad de California, en Los Ángeles, y la  Universidad de Chicago, han encontrado el verdadero y profundo costo  de separarnos de nuestros seres queridos: en la gente solitaria se suprimen  ciertas  funciones  del  sistema  inmunitario  y  se  activan  genes  que  incentivan  la  inflamación  del  cuerpo,  la  cual  precipita  con  mayor  facilidad enfermedades como aterosclerosis, Alzheimer y cáncer. Nuestro  sistema inmunitario adopta un estado que nos hace propensos no sólo a  enfermar por virus o bacterias, sino por otras afecciones autoinmunes.  ¿Por qué ocurre esto? Se especula que el cuerpo percibe a la soledad \ncomo una amenaza de muerte: “Es una especie de reacción defensiva de  tu cuerpo si cree que serás herido en el futuro próximo”, dice el doctor  Steve Cole, uno de los investigadores.  Para  entenderlo,  debemos  ubicar  el  ejemplo  miles  de  años  atrás,  cuando nuestros antepasados necesitaban de sus tribus para sobrevivir a  las amenazas del entorno. Al verse solo, el cuerpo se adelanta a lo que  puede ocurrir en el futuro: se pone en guardia y ordena un influjo de  anticuerpos que se alistan para combatir el peligro. El tiro puede salir por  la culata, pues las reacciones desestabilizan y debilitan nuestro sistema a  la larga.  Al grado que “la tasa de mortalidad por contaminación del aire es de  5%. Por el sentimiento de soledad es de 25%”, nos dice John Cacioppo,  investigador de la Universidad de Chicago.  Naomi Eisenberger, otra profesora de la Universidad de California, en  Los Ángeles, abona al tema con un experimento para medir los efectos  del  rechazo  social.  Conectó  a  personas  a  escáneres  cerebrales  y  las  dispuso a interactuar en un videojuego en línea cuyo objetivo era pasar \nuna pelota entre los participantes. Se les dijo que en la dinámica tomarían  parte tres jugadores, cuando en realidad los otros dos eran computadoras  programadas para compartir la pelota con el humano en un principio, para  luego ignorarlo por completo con el paso del tiempo.  Los  participantes  que  se  mostraron  más  sensibles  a  este  rechazo  registraron  un  incremento  en  la  actividad  de  dos  áreas  cerebrales  asociadas con el dolor físico. Eisenberger cree que el apego y los vínculos  afectivos entre las personas son tan importantes que el dolor psicológico  de la soledad se coló al mismo canal del dolor físico en algún punto de  nuestra evolución. El cuerpo emite señales de alerta similares para ambos  tipos de molestia. La soledad sí duele literalmente.  Incluso “la soledad es un factor de riesgo de muerte prematura tan  importante como la obesidad y el tabaquismo”, afirma Dhruv Khullar,  médico residente del Hospital General de Massachusetts.  Ante este cúmulo de evidencias, más vale que nos empecemos a tomar  los dolores sociales y psicológicos con la misma seriedad que los físicos.  Y  esto  empieza  con  la  prevención:  nuestros  seres  queridos  son  esa  medicina  preventiva  que  debemos  administrar  siempre,  como  si  emprendiéramos una campaña de vacunación eterna.  Lazos familiares, lazos con la vida  Dado que son producto de la preferencia y no del destino, bien podríamos  pensar que los amigos son como hermanos por elección y que, por lo  tanto,  nos  pueden  acarrear  mayor  bienestar.  Pues  un  estudio  de  la  Universidad de Toronto parece haber encontrado lo contrario, al menos  en el renglón del bienestar físico.  Un grupo de sociólogos solicitó a tres mil adultos mayores hacer una  lista de sus seres queridos a los que consideraran más cercanos. Cinco  años  después  revisaron  las  listas  y  encontraron  lo  siguiente:  quienes  eligieron más familiares y amigos en su lista (sin contar esposo o esposa)  tenían la tendencia a vivir más años, quienes sólo pusieron a sus amigos  vivían menos años. Incluso en esos cinco años fallecieron más personas  que pusieron a poca gente en su lista.  JAMES IVENIUK, LÍDER DE LA INVESTIGACIÓN, ESPECULA  QUE ESTO ES PORQUE A LOS LAZOS FAMILIARES LES \nATRIBUIMOS UN SIGNIFICADO DIFERENTE. ES TAN  FUERTE Y PROFUNDO QUE NOS INCENTIVA A  MANTENERNOS CERCA Y A BRINDAR UN APOYO  INCONDICIONAL SIN COMPARACIÓN CON OTRO TIPO DE  RELACIONES.  Y vaya que estos lazos sanguíneos son más estrechos en nuestros países  latinoamericanos en los cuales los abuelos cuidan nietos por deporte, los  hijos no salen de casa hasta su casamiento y en donde es pecado comer a  solas,  sin  hacer  sobremesa  con  padres  y  hermanos.  Éstas  son  de  las  costumbres que deberíamos atesorar y resguardar frente la amenaza que  supone la vida moderna.  Nada como la familia  Un descarado podría justificarse diciendo: “¡Bah! Yo no necesito a mi  familia; cuando sea viejo, mi dinero se encargará de conseguirme el mejor  de los asilos”, incluso mi amigo Iván podría pensar eso. ¿Cuánta razón  tiene? ¿Qué tanto beneficio derivamos de las puras prestaciones logísticas  que brinda la familia?  Me gustaría que Iván leyera lo que a continuación te comparto: resulta  que el bienestar no está en el cambio de pañales o en echar la mano en  situaciones de emergencia. Va mucho más allá. Así lo refiere un estudio  de la VU University Amsterdam, el cual separó la influencia que tiene  sobre las personas mayores el apoyo instrumental —la conducta con la  que ayudamos de forma directa, como realizar un trabajo o hacer un favor  — y el apoyo emocional —desarrollo de sentimientos positivos como  empatía, confianza, consideración y amor.  Tal como otros estudios sugieren, éste confirmó que recibir apoyo  emocional  de  familiares  está  generalmente  asociado  con  un  mayor  bienestar de los adultos mayores, mientras que el instrumental tuvo nula  influencia sobre él.  Para ponerlo en perspectiva, esto significa que nuestras intenciones  positivas y amorosas cuentan mucho más que las acciones que pueden  hacerse de manera mecánica. Mientras que, en efecto, uno puede suplir a  los familiares con empleados en las necesidades físicas, esto es imposible  con las necesidades afectivas. El bienestar que transmite un familiar no lo \nlogran ni diez empleados —¡por más buenos y voluntariosos que sean!  La evolución de la amistad  Un  estudio  de  la  Universidad  de  Brooklyn  College,  monitoreó  las  relaciones  de  amistad  y  su  impacto  en  el  bienestar  de  200  personas  durante más de 30 años. Tras los análisis, los investigadores encontraron  un patrón. La felicidad en la mediana edad se asocia con dos cosas: la  cantidad de amigos cuando estamos en nuestros 20 y la calidad de las  amistades cuando transitamos los 30.  El  diagnóstico  ilustra  perfectamente  cómo  evolucionamos  con  el  tiempo. En nuestra juventud confluyen distintos factores que nos inspiran  a  emprender  la  aventura.  Nos  buscamos  a  través  de  distintos  grupos  sociales. Esta prueba y error de amistad ocurre mientras nuestra identidad,  aún tierna, trata de echar raíces más firmes.  Una vez que la moldeamos con los encuentros y desencuentros de la  vida, estamos listos para ser selectivos, porque ¿cuántas veces no nos  sucede que perdemos la afinidad con algunos amigos al paso de los años?  Quizá aquella persona tan especial en su momento prefirió recorrer un  camino radicalmente distinto, y por el trecho que ahora nos separa se  volvió irreconocible.  El estudio refrenda que esto es de esperarse, no tanto de temerse. Aquí  el  nombre  de  la  medicina  es  la  honestidad  y  su  prima  hermana:  la  aceptación.  Abracemos  la  idea  de  que  ciertas  personas  o  grupos  ya  cumplieron su propósito en nuestra vida y, si bien merecen toda nuestra  gratitud por el pasado, deben dar paso a quienes nos ayudan a cristalizar  nuestros ideales de felicidad y significado en el presente.  En la adultez el tiempo es limitado. La frase “decidir es renunciar”  siempre nos pesa en la idea, pero es liberadora en la práctica. Si hemos de  magnificar aquello que nos hace felices, entonces debemos entregarnos a  quienes han pasado mejor la prueba del tiempo. Aquellas viejas amistades  que han añejado mejor o incluso las nuevas, que traen consigo aires de  frescura.  Entre amigos, la felicidad es contagiosa  Sabemos que la risa es contagiosa. Robert R. Provine, profesor de la  Universidad de Maryland, dice que reír es benéfico para la salud, en gran \nmedida  por  su  componente  social;  es  decir,  por  la  convivencia  con  amigos y familiares que genera la risa. En sus investigaciones, Provine ha  descubierto que la gente es 30 veces más propensa a reír cuando está  acompañada que cuando se encuentra a solas.  Pero  ¿qué  hay  de  la  viralidad  de  una  emoción  más  sutil  como  la  felicidad?, ¿qué tan contagiosa es? Investigadores de las universidades de  California, en San Diego y Harvard, descubrieron que la felicidad viaja en  ondas expansivas a través de nuestros círculos sociales.  Como la gente feliz tiende a ubicarse en el centro de sus redes de  amistad, el sentimiento se extiende hasta tres grados de su círculo de  influencia  inicial:  en  otras  palabras,  cuando  somos  felices  no  sólo  contagiamos  el  júbilo  a  nuestros  amigos,  también  a  los  amigos  de  nuestros amigos y a los amigos de los amigos de nuestros amigos.  Los investigadores afirman que los resultados obtenidos comprueban  que la felicidad tiene un impacto y una función similar a los de actos más  simples como reír o sonreír en compañía de los demás. Entonces, así  como pasar un buen rato con nuestros seres queridos refuerza nuestro  vínculo con ellos, ser felices tiene el potencial de unirnos de una forma  trascendente, dado que el sentimiento se propaga al resto de la sociedad a  través de ellos.  El  estudio  advierte  que  la  alegría  no  tiene  la  exclusividad.  Los  sentimientos  y  comportamientos  negativos  llevan  consigo  el  mismo  potencial.  Por  ejemplo,  otras  investigaciones  han  revelado  que  el  tabaquismo  y  la  obesidad  proliferan  de  forma  similar  entre  nuestros  grupos sociales.  Como  especie,  gustamos  de  expresar  nuestros  sentimientos  y  nos  abrimos a los del resto a través de la empatía y la simpatía. Somos como  antenas emocionales que transmiten y reciben señales afectivas. Por tanto,  ¿qué clase de señales estamos emitiendo al mundo?, ¿con quiénes nos  relacionamos  y  qué  sintonizamos  con  ellos?,  ¿cómo  podemos  afinar  nuestras antenas para diseminar el bien entre nuestra sociedad?  La soledad es un asunto serio. Aunque ya abandonamos las cavernas,  seguimos siendo los humanos de siempre. Y sin embargo ahora se han  invertido los papeles, lo que antes eran meras guaridas para refugiarnos  de las inclemencias del medio ambiente ahora son casas que, si bien nos  protegen,  entrañan  el  riesgo  de  aislarnos  de  los  demás.  Con  esto,  el  verdadero peligro ya no está fuera, sino dentro de nosotros. \nPorque ya vimos que la felicidad es cosa de varios, no sólo de uno. Es  un proceso de dar y recibir. Si somos un factor multiplicador, se eleva  casi  a  nivel  de  responsabilidad  social  nuestra  tarea  de  aumentar  esta  resonancia.  ¿Qué  haremos  para  hacer  que  nuestra  influencia  positiva  tenga más eco fuera y dentro de nosotros?  Solo ¡y qué!  Acepto que me gusta la soledad, pero no por mucho tiempo como ya dije.  Disfruto  inmensamente  cuando  estoy  solo  para  tener  mi  sesión  de  meditación u oración, y por supuesto, todos estos momentos en los que  escribo un libro, generalmente es en soledad, pero no por eso quiere decir  que me gustaría por más tiempo.  Claro que no faltan los que defienden su soledad diciendo que así son  más felices, como el caso de Iván, y éste que te comparto a continuación:  Jorge es de esos seres ermitaños del siglo XXI. A sus 58 años de edad  vive solo, no es afín a las fiestas ni a cualquier tipo de evento social.  Mi relación con él es meramente profesional, ya que es un proveedor  importante de mi empresa, pero le he conocido lo suficiente para saber y  compartir con su consentimiento, su historia de vida.  Felizmente divorciado, según sus propias palabras, pero de feliz no  tiene  nada  ya  que  durante  su  matrimonio  la  pareja  estuvo  llena  de  múltiples muestras de agresividad verbal y humillaciones mutuas.  Adjudica su fracaso matrimonial a que “se casó muy joven y le faltó  disfrutar la vida”, (textual).  Tres hijos, dos varones y una mujer, profesionistas, su hija divorciada  también y sus dos varones continúan solteros viviendo con su mamá.  Jorge  defiende  fervientemente  su  soledad  obligada  y  por  decisión  propia. Obligada porque su ex esposa no quiere verlo, ni él a ella. La  relación terminó sumamente fracturada y sus hijos rara vez lo frecuentan,  y por decisión propia también porque él no hace absolutamente nada por  unirse a ellos.  Tiene  6  hermanos  a  quienes  por  cierto  no  soporta  y  sus  padres  murieron hace pocos años.  “¿Amigos? ¿Para qué los quiero? Todos son una bola de oportunistas  que buscan fregarte de algún modo —también textual. Mira César, en la  vida he aprendido que es mejor estar solo que mal acompañado y así no \ntienes que rendir cuentas a nadie de lo que hagas o no hagas. Ya cumplí  con traer hijos al mundo y parece que son personas de bien, aunque no me  quieran ver por todo lo que su madre les ha inculcado en contra mía, y  eso, la verdad, me tiene sin cuidado. Allá ellos y su conciencia. Sigo  trabajando, estoy ahorrando para que cuando sea más viejo no tenga que  depender de nadie. Espero en Dios tener los recursos para pagar una casa  de ancianos bien chin... (de primer nivel) y que me traten bien. A ellos,  ¿dejarles  algo?  Ni  un  peso  por  malagradecidos.  Que  les  deje  algo  su  madre, a ver si tiene...”, obvio que todo lo anterior también es textual.  Por supuesto que conozco la otra cara de la moneda, de personas que  deciden vivir solos pero que frecuentan a sus familiares y tienen múltiples  amigos.  Sin  embargo,  creo  que  Jorge  no  conoce  las  impactantes  investigaciones que ya he compartido contigo. \nn algún lugar leí un cuento que diré a continuación titulado,  “Don Fregadetes”.  Lo  compartí  por  mucho  tiempo  en  mi  conferencia    Cómo  tratar con gente difícil.  Este cuento podría ser realidad por lo fácil que es  convertirse en una persona así.  Como su nombre lo insinúa, un Don Fregadetes —o doña— puede  estar en cualquier hogar o trabajar en cualquier parte.  Persona mal encarada, enojada con todos o por todo, con una enorme  carga de amargura o dolor, y que desea esparcir su pésimo carácter por  doquier.  Estoy convencido de que a esa gente no se le quiere, se le aguanta, se  le soporta, pero difícilmente se le puede llegar a querer.  Va  su  cuento  a  continuación,  pero  tengo  que  aclarar  que  de  tanto  decirlo  le  he  ido  agregando  anécdotas,  fruto  de  mi  creatividad  e  imaginación:  Éste era un hombre entrado en años (para no herir susceptibilidades,  no digo cuántos) que siempre se quejaba, despotricaba en contra de todo y  de todos:  —¡El café está muy fríooo!  —¡El  agua  está  muy  calienteee!  (extendiendo  las  palabras, \nhaciéndolas como aborregadas).  —¿A dónde vaaaas?  —¿Con quién vaaaas?  La familia ya estaba harta del hombre; pero ese hartazgo es de los que  normalmente no se dicen pero se piensan.  La esposa, sumisa y abnegada —como muchas que están leyendo este  libro—  acataba  todas  las  manifestaciones  de  ira  de  Don  Fregadetes.  Siempre  obediente,  siempre  callada  porque  así  la  habían  educado  sus  padres.  Una  mujer  está  diseñada  para  hacer  el  aseo  y  obedecer  a  su  hombre —le decía su madre que en paz descanse.  Don Fregadetes cumplía y cumplía años, no se veía fin de esa cuenta y  para  colmo  de  males  venía  de  familia  muy  longeva;  o  séase,  los  pronósticos decían que su vida iba para largo...  Hasta  que  un  bendito  día  —para  la  familia—  se  muere  Don  Fregadetes.  Poca gente en el velorio, porque el hombre no era muy taquillero.  Dígase taquillero en los velorios o a quien tiene muchos amigos y  familiares que lo aprecian y acuden a expresar su pésame a la familia  porque les duele su partida, pero en este caso pues ¿a quién le dolía? A  nadie, digamos que una concentración infinita tenían que hacer la esposa,  —ahora viuda— y los hijos para llorar, y la escasa gente que acudió  murmuraba: “¿Por qué no se ha derramado una sola lágrima?”  Su  mujer,  para  despistar  la  situación,  cuando  le  daban  el  pésame,  inspiraba con la nariz en señal de que muchos mocos estaban ahí fruto de  haber llorado, pero las lágrimas brillaban por su ausencia.  Reitero, poca gente en el velorio, algunos de los cuales estaban ahí  porque se equivocaron de capilla o porque el café era verdaderamente  bueno, ¡y además gratis!  La viuda, toda acabada, con el rostro lleno de arrugas formadas, la  mayoría de ellas, por la convivencia diaria con un hombre sumamente  necio, mal encarado, amargado, quejumbroso a más no poder y que tenía  prácticamente harta a la gente con la que convivió, especialmente a su  abnegada  esposa  que  lo  aguantó  50  años  de  suplicio  —por  no  decir  matrimonio.  Entró el encargado de la funeraria para decir que había llegado la hora  de terminar los servicios de velación y era momento de ir al panteón.  —¡Ya nos vamos a llevar a Don Fregadetes al panteón! \n—¿Nos permite despedirnos de nuestro papá?—, dijo uno de los hijos.  Le dijeron que sí, entonces se acerca al féretro gris, el más barato que  existía en el lugar pues vieron que era un gasto superfluo o inútil invertir  en uno de finas maderas.  “Al cabo —había dicho la hija de en medio—, es un ratito y todo se  pulveriza al paso del tiempo y, además, a mi papá no le hubiera gustado  que gastáramos mucho en una caja mortuoria.”  El hijo se acerca a la caja con su debida concentración para soltar  alguna de las lágrimas muy celosamente guardadas en lo más profundo de  sus conductos lagrimales y que por más que deseaba, no salían.  Y en eso, al ver el vidrio a nivel de la cara del difunto, descubre que el  vidrio se empañaba y se desempañaba... se empañaba y se desempañaba  —como al compás de una posible respiración de quien ahí yacía.  Inmediatamente va corriendo con su hermano mayor para pedirle que  le acompañara a ser testigo de tan extraño acontecimiento. Y ahí va otro  de los hijos para confirmar que el vidrio de la caja se empañaba y se  desempañaba, y se empañaba y se desempañaba....  ¡ Amá , venga! —eran de Allende, Nuevo León y la palabra  amá  era  mucho más utilizada que la palabra mamá.  La viuda, harta de todo y todos (incluyendo del difunto) contesta.  —¡Ya, que se lo lleven!  —¡No,  amá ! ¡Venga!  Lentamente se acerca la viuda, toda encorvada y acabada porque así la  dejó el difunto por lo necio y corajudo que había sido toda su larga vida.  Al acercarse lentamente como arrastrando los pies, no por el pesar de  la muerte de su marido, sino por todos los años de friega y de aguantarlo,  reitera la frase:  —¡Ya, que se lo lleven!  — Amá , venga, acérquese, venga a ver.  Se acerca entonces con el temor correspondiente ante una petición que  no tenía una razón evidente; al asomarse a la caja, efectivamente ve que el  vidrio se empañaba y se desempañaba, se empañaba y se desempañaba.  Ante el desconcierto, se acercan los cinco hijos restantes y atónitos  escuchan al hermano mayor decir:  — Amá , a mí se me hace que papá está respirando. ¡A mí se me hace  que papá está vivo!  La señora, enderezándose como nunca en tantos años, les dice: \n—Aquel que abra esta caja, ¡se hace cargo de él!  Ya sabrás, los hijos volteándose a mirar unos a otros —o mejor dicho,  sordéandose  (no sé si exista la palabra) — , sin palabra alguna y dirigiendo  la mirada a cualquier lugar o a ninguno, menos a la madre que expresó  tan original orden.  El hijo mayor al ver tal reacción de indiferencia y negativa de tomar  tan grande responsabilidad, dijo:  —No,  amá , a mí se me hace que son puras figuraciones— ¡y cerró  súbitamente la caja mortuoria!  Abundan los Fregadetes, personas que, como dije, tienen y expresan  tanto coraje, fruto de alguna historia cargada de dolor, lo cual no debería  de ser una justificación, ya que todos conocemos a personas así que tal  vez  sufrieron  mucho  y  no  por  eso  se  convierten  en  amargados  e  iracundos.  Conozco  a  varios  así,  pero  hoy  quiero  hacer  referencia  a  uno  en  especial, una excelente muestra representativa de estos especímenes que  tanto abundan: Josué, hombre de 59 años y desde que lo conozco, hace  más de 30, ha deseado demostrar su valía con su pésimo carácter. Esposo  y padre de 3 hijos, dos varones y una hermosa hija.  Su esposa, mujer trabajadora durante muchos años en el magisterio.  Sus hijos, todos titulados, dos de ellos decidieron casarse y mudarse a  otra  ciudad,  me  imagino  que  huyendo  de  su  padre,  el  cual  para  todo  expresaba su sentir con gritos. Su monstruosa voz se escuchaba en toda la  casa, a cada momento, a todas horas, con excepción de sus espacios de  sueño.  Todo lo pedía con gritos, todo lo expresaba igual. Todos saben menos,  todos están mal, todos son unos ineptos, todos carecen de criterio; ni para  qué  discutir  con  él  ya  que  siempre  salías  perdiendo  o  enojado.  Por  motivos diversos tenía que convivir ocasionalmente con él.  Mi estrategia era, simplemente, seguirle la corriente, consejo otorgado  por mi abuela hace muchos años. “Con los locos no se discute”, decía  doña Pola cuando mi abuelo don Luis se ponía igual de iracundo.  “QUE HAYA UN LOCO Y NO DOS, PORQUE SI DISCUTES CON  ÉL YA ESTÁS IGUAL DE LOCO.” BENDITO CONSEJO QUE HE  APLICADO CON CIERTA GENTE A LA QUE NO VALE LA \nPENA NI DESGASTE OTORGAR RESPUESTAS.  Así que con Josué utilicé dicha estrategia en cada ocasión que tenía  que tratarlo.  Cuando veía a su bonita familia, no dejaba de asombrarme la actitud  de su esposa, quien solamente asentía por todo lo que decía, pero no en  señal de sumisión, sino de hartazgo escondido. Sus hijos levantaban la  mirada en señal de desprecio cada que escuchaban que les hablaba desde  otro lugar, pero nunca replicaban, nunca discutían, simplemente hacían lo  que les pedía con cierta dosis de ironía por la cruz que les tocó cargar, sin  conocer hasta el momento por qué Dios les había enviado tan original  prueba.  —Tiene un genio de la patada —solía decir su esposa—, pero no sé el  porqué, si relativamente Dios nos ha dado tanto.  Empezó a engordar con una panza que parecía que se tragaba cada  coraje que hacía o no expulsaba debidamente todo lo que el cuerpo no  necesita,  empezando  la  gran  cantidad  de  veces  que  se  tragaba  todo  aquello por lo que no estaba de acuerdo.  Recuerdo la primera y única discusión que tuve o permití tener con él,  en  la  cual  alegaba  que  la  vida  después  de  la  muerte  no  existía.  Que  cuando alguien muere simplemente se apaga y llega a un sueño eterno en  el cual la nada es lo único que hay.  —Pues yo no pienso así y respeto tu opinión —opté por decir.  —Pues tú y todos lo que creen que hay algo más están mal —replicó  como si él hubiera muerto y regresado para contar su experiencia a todos  lo ineptos que tenemos creencias diferentes.  —Es tu opinión Josué y la respeto, pero yo pienso diferente a ti.  Bien dicen que hay tres temas en los cuales no es bueno discutir:  religión, política y futbol. Pero para este hombre son esos tres temas y  todos  los  que  vengan  en  este  momento  a  tu  mente.  De  nada  que  lo  contradiga se puede hablar con él.  Ante tal contradicción, su coraje fue tal, que se levantó y manoteando  me dijo que debería de tener más cuidado en decir mis ideas erróneas de  que hay algo después de la vida, cuando él estaba 100 por ciento seguro  que no hay nada.  —¿Estuviste ahí? ¿Moriste y regresaste? ¿Alguien del más allá vino y \nte dijo que no hay vida después de la muerte? —pregunté sin medir las  consecuencias.  —¡A mí nadie me contradice! ¡Ni tú, ni nadie!—. Me gritó con un  apestoso aliento que me hizo dudar sobre si tenía razón, ya que olía a algo  muerto, a lo mejor ya lo estaba y no me había dado cuenta.  Mi respuesta lo encolerizó aún más, sus ojos le salían de las órbitas, su  cuello mostraba las venas y músculos contraídos, tensos a más no poder,  sus puños cerrados como demostrando que estaba a punto de golpearme.  AHÍ APRENDÍ QUE HAY GENTE CON LA CUAL NO VALE LA  PENA DISCUTIR NI DESGASTARSE. PERSONAS CUYO ÚNICO  OBJETIVO ES ARMAR POLÉMICA Y PELEAR PARA  AVENTAR TODA ESA BASURA QUE TRAEN DENTRO Y QUE  LOS VA A CARCOMIENDO POCO A POCO.  Está de más decirte que quienes son así sufren un deterioro físico  mayor.  Josué  a  sus  59  años  padece  gastritis,  hipertensión,  problemas  hepáticos y pancreáticos, y para colmo de males, ha sufrido un infarto, el  cuál afortunadamente no tuvo consecuencias fatales gracias a la oportuna  atención  médica.  Mejoró  de  esa  grave  crisis  de  salud,  no  sé  si  afortunadamente para su abnegada esposa, porque tengo que manifestar  que el día de su gravedad en cuidados intensivos, no mostraba signos de  tristeza, ni mortificación.  Te recuerdo que a los iracundos difícilmente se les quiere, ¡se les  aguanta!  Si te enojas sales perdiendo.  Tengo que reconocer que no siempre he sido quien hoy escribe este libro.  He estado avanzando poco a poco a pasos firmes y seguros en el  control de mis emociones. No siempre mantuve la calma cuando todos se  enojaban ni tampoco sembré paz o armonía donde se necesitaba.  No puedo decir tampoco que crecí en un hogar donde la paz siempre  reinaba y los buenos ejemplos siempre se encontraban.  Mi madre, como lo he dicho, se preocupaba mucho y mi padre no  siempre estaba de humor y estoy seguro que esto tuvo que ver con la \ncantidad de hijos que procrearon. Siete hijos no es nada fácil. Lidiar con  siete  personalidades  totalmente  diferentes,  además  de  las  crisis  económicas que se sortearon, definitivamente es para poner los pelos de  punta a cualquiera.  Desde niño siempre encontraba justificación a mi enojo.  “¡Es que él empezó!”  “¡Se tardó mucho bañándose y se acabó el agua caliente!”  “¡Es que nadie me entiende!”  “¡Es que ya estoy harto!”  “¡Es que no puedo soportar a...!”  Y etcétera y etcétera y muchos más etcéteras.  Después  viene  mi  etapa  de  casado  y  tengo  que  reconocer  que  disminuyeron mis arranques de enojo pero nunca desaparecieron.  Preferí  escudarme  con  frases  que  me  justificaran  los  escasos  pero  persistentes arranques de enojo como:  “Por la buena soy muy bueno, por la mala no me busquen”, (muy  matona esa frase, ¿no?).  O esta: “Me enojo poco, pero cuando me enojo, ¡exploto!”  O: “Difícilmente me enojo, pero cuando lo hago no me controlo.”  Esas frases se hicieron decretos poderosos que me invitaban a que  esos arranques de enojo o ira se presentaran como deben de ser.  Ya que me voy a enojar que sea ¡espectacular!  Apretar puño, saltar ojos, enrojecer la cara, llenar de sangre mis venas  del cuello y decir palabras hirientes y en tono elevado para que vean que  estoy en uno de esos episodios que tanto amenacé y que es imposible  evitar —o bueno, eso creí por mucho tiempo.  Nunca hice esos espectáculos al aire libre y procuraba que fueran muy  esporádicos para no espantar a mi esposa y mucho menos delante de mis  hijos.  Durante mi práctica de médico jamás manifesté mi poca paciencia o  mi enojo en público, pero sí en privado.  No daba lugar a que mis pacientes se dieran cuenta que el doctor  sonriente y agradable que atendía a ellos y a sus hijos pudiera enojarse  algún día y mucho menos cuando me tocaban pacientes iracundos que  manifestaban signos de enfermedad como consecuencia de sus arranques.  —Tienes que controlarte Felipe—, imagina mi voz llena de paz y  serenidad. \nCada que te enojas —añadía—, haz de cuenta que le das un trancazo a  tu hígado y a tu páncreas y luego no te quejes de venir con problemas de  diabetes o hipertensión. O ¿por qué no? A lo mejor hasta una embolia.  Y continuaba mi cátedra diciendo:  —No  vale  la  pena  enojarse  por  cosas  que  después  no  tendrán  importancia.  ¡Hasta me mordía la lengua cuando lo decía!  ¿No me daba vergüenza estar recomendando lo que no vivía? “Al fin  y al cabo —me decía— mis pacientes no tienen por qué conocer mi vida  personal.”  Después viene mi etapa como consultor, capacitador y conferencista,  donde me adentré al mundo de la autoayuda y desde hace más de 20 años  puedo asegurar que difícilmente me enojo, y cuando lo hago, jamás con  los arranques que anteriormente tenía. La duración de mi enojo es de  escasos minutos y luego lo olvido.  No  ha  sido  fácil,  no  es  una  decisión  y  ya.  Ha  requerido  años  de  práctica y sigo cayéndome ocasionalmente, pero he avanzado demasiado  y espero seguir controlando mis emociones.  En mi conferencia  Agregando inteligencia a la emoción,  hago una  encuesta al público: “Levante la mano quién es o vive con alguien que  jamás se enoja.”  Hay públicos en los cuales nadie levanta la mano, pero hay otros en  los  que  sí.  Una  o  dos  personas  lo  hacen  y  algunos  de  ellos  vienen  acompañados de ese santo varón o esa santa mujer.  Increíble pero existen.  Historias de esposas, esposos o madres o papás que sus acompañantes  me manifiestan que jamás se enojan.  Personas que llevan más de 20 años de casados y quienes están a su  lado expresan con toda seguridad que jamás se enojan.  La  verdad  no  han  sido  muchos  a  lo  largo  de  8  años  que  tengo  impartiendo esa conferencia.  “¿Cómo  le  hacen?”,  me  preguntaba  yo.  “¿Serán  mudos  o  sordos?  ¿Traerán un gen de la paciencia y prudencia en su ADN?” \n—Si te enojas siempre sales perdiendo —me dijo un día uno de esos  santos participantes a mi conferencia.  Un  hombre  de  49  años  de  edad,  23  años  de  casado  con  3  hijos  varones.  —La verdad no me enojo, porque siempre perdí cuando lo hice de  joven. Un día decidí dejar esa costumbre y pues soy más feliz.  —¿Y no dices nada cuando algo te molesta? —pregunté.  —¡Claro! Digo lo que no me gusta y ya. Pero no le pongo enojo.  —¿Y el tráfico? ¿Y la gente necia? ¿Y cuando alguien te ofende sin  razón? ¿Y los gandallas que se meten a la fila cuando tú llevas minutos u  horas formado?  —Pues no, no me enojo, porque siempre pierdo.  O sea no le pone carga emocional o pasión desbordada a las palabras.  Esa  frase  de  “el  que  se  enoja  siempre  pierde”  me  la  confirmó  recientemente Aldrey, el arquitecto que está construyendo mi casa nueva.  Otro  hombre  que  difícilmente  se  enoja  y  que  mantiene  una  ecuanimidad fuera de este mundo.  —¿Nunca te enojas arquitecto? —le pregunté un día en el que hubo  una falla de luz ocasionada en mi terreno y que afectó a toda la colonia.  —Sí, claro que sí, pero muy poquito —dicho con una voz de cura o  pastor con años en las filas de una orden religiosa—, además esto que  ocurrió no fue culpa nuestra; los cables estaban enterrados dentro de la  propiedad cuando deben estar por debajo de la calle.  —Pues sí, pero me dicen que llegó una de las vecinas a punto de  matarte.  —Sí, pero hablé con ella y le aclaré todo.  —¿Y ella siguió enojada?  —¡Ah, sí! Claro que sí. Pero pues le aclaré con mucho respeto que no  teníamos responsabilidad y que se solucionaría el problema. Pero aun así \nme mentó la madre a mí y a todos los trabajadores.  Todo dicho con una tranquilidad como si me estuviera describiendo la  última película de la vida y obra del Dalái Lama, mucho antes de ser  desterrado del Tíbet.  La gente que trabaja con él me expresa que es estricto, pero siempre  procura mantener la calma y el respeto con la gente, incluyendo clientes  necios entre los cuales obviamente no me encuentro.  Me  queda  muy  claro  que  mucho  depende  del  temperamento  o  la  personalidad que cada quien tenga.  Hay gente que literalmente les circula atole y por ende llevan un ritmo  de vida sumamente lento y así son felices. Mientras otros parece que  traemos chincuales en santa sea la parte y estamos acelerados por todo o  por nada.  Ni sabemos por qué traemos prisa, pero así somos y se supone que así  somos felices.  Te pregunto a ti, que estás leyendo este libro:  —  ¿Te enojas más de dos veces al día?  —  ¿Tu enojo es en forma explosiva?  —  ¿Tu enojo dura más de 15 minutos?  —   ¿Dices  cosas  que  generalmente  te  arrepientes  después?  —  ¿La gente que te rodea te tiene catalogado como  iracundo?  Se supone que si respondes a estas preguntas con un “sí”, más de dos  veces el nivel de tu enojo está fuera de lo normal y puede ser que en tu  casa no te quieran, ¡te soportan! Lo cual es muy diferente.  Es en serio, a los iracundos no se les quiere, se les aguanta.  Estoy seguro que si los iracundos leyeran la siguiente investigación,  empezarían a aplicar las técnicas de relajación, visualización y respiración  que recomiendo en otros de mis libros.  El enojo: cómo hacer bella a la bestia \nDecía el filósofo romano Séneca que: “La ira es como un ácido que puede  hacer más daño al recipiente en el que se almacena que a cualquier cosa  sobre la cual se vierta.”  Y es que es una amenaza latente para todos: para nosotros y para el  resto.  Al  expresarla  sin  control,  mostramos  el  peor  rostro  de  nuestra  especie:  abusos,  asesinatos,  guerras  y  hasta  genocidios;  al  reprimirla,  vertemos  el  daño  hacia  dentro  y  no  sólo  terminamos  enojados  con  nosotros también quedamos expuestos a enfermedades como hipertensión  o depresión.  Según lo explica la Asociación Americana de Psicología, esto sucede  porque eleva nuestro ritmo cardíaco, presión arterial y la secreción de  hormonas como la adrenalina y la noradrenalina.  Hulk  puede  ser  un  bebé  de  brazos  comparado  con  cualquiera  de  nosotros cuando montamos en cólera (claro, dejando de lado lo verde y lo  musculoso). Las reacciones fisiológicas que experimentamos con el enojo  o la ira nos pueden convertir en una persona completamente distinta.  Producto de nuestra imaginación  El enojo suele ser un caso de desobligación; un “eres tú, no soy yo” al  extremo. Por lo general creamos expectativas sobre el mundo y cuando la  realidad las contradice contraatacamos con alguno de nuestros arranques.  En vez de aceptar que es nuestra responsabilidad, culpamos a la persona o  cosa que sentimos que nos quedó mal.  Pero la verdad es que nos enojamos porque queremos. Somos víctimas  de  nuestra  imaginación:  con  nuestras  expectativas  le  imponemos  un  “deber  ser”  a  la  realidad;  con  nuestras  sospechas  infundadas,  nos  olvidamos de lo que pasa y nos acordamos constantemente de lo que  debería pasar.  El  escritor  e  investigador  Bernard  Golden  también  nos  dice  que,  usualmente, el enojo es una reacción a otros sentimientos incómodos —  decepción, tristeza, ansiedad o vergüenza— que se ocultan debajo de la  superficie. O sea que el estar de malas también nos hace propensos a estar  “de peores”.  Pero fíjate qué tan prolífica es nuestra mente gruñona: no sólo nos  enoja,  por  ejemplo,  que  nuestra  pareja  decida  salir  con  sus  amigos  (cuando quizá esperábamos que saliera con nosotros), sino que además le \nseguimos  agregando  a  la  cosecha  cuando  elucubramos  que  quizá  esté  coqueteando  con  alguien  más.  Esto  desencadena  más  sentimientos  negativos como ansiedad y miedo, lo que, a su vez, produce más enojo.  ¿El que se enoja siempre pierde?  Dicho lo anterior, recordemos también que las emociones son energía.  Gracias  a  ellas  hemos  llegado  hasta  aquí  como  especie.  Sin  ellas  simplemente seríamos casi tan inertes como las piedras. Así que, por más  mala que parezca, cualquier emoción tiene sus cualidades positivas. Si  bien ya dijimos que el enojo es bestia, también es bella si la tomamos  desde el ángulo correcto.  Científicos de la Universidad de Harvard estudiaron la influencia del  enojo  en  nuestro  juicio  y  nuestra  toma  de  decisiones;  proponen  que  sentimos  esta  emoción  de  diferentes  formas.  Por  ejemplo,  cuando  reflexionamos  acerca  del  origen  de  nuestro  enojo  en  el  pasado  la  sensación es desagradable; sin embargo, cuando la proyectamos al futuro  es placentera.  Afirman  que,  si  bien  puede  traer  resultados  negativos  como  agresividad y exceso de confianza, el enojo nos confiere un poder que,  bien  canalizado,  puede  traernos  efectos  sumamente  positivos  como  sacarnos de la indecisión, del miedo excesivo a tomar riesgos y de la  famosa “parálisis por análisis”.  En pocas palabras, el enojo nos puede poner en movimiento. Es una  energía que nos empuja, venga de donde venga. Piensa, por ejemplo,  cómo un emprendedor exitoso extrae esta fuerza de voluntad para callar  las bocas de los que dudaron de él.  Los científicos han probado que este uso positivo del enojo orienta a  las  personas  hacia  la  mejora  en  muchos  ámbitos  de  la  vida:  salud,  relaciones sociales y carrera profesional. Pero el hallazgo más interesante  es que el enojo colabora para lidiar consigo mismo; es decir, una persona  enojona puede tener más energía y decisión para enfrentarse a las causas  de su propio enojo. ¡Paradójico, pero cierto!  El científico Fred Luskin lo resume muy bien cuando define el “enojo  constructivo” como aquel que usamos para solucionar un problema. Pues  a usarlo sabiamente. \nBlindaje contra el enojo destructivo  Ya  comprobadas  las  cualidades  del  enojo  constructivo  ¿existe  alguna  forma de prevenir su opuesto: el enojo destructivo?  El investigador y autor Bernard Golden cree que la respuesta está en  tres prácticas:  mindfulness,  autocompasión y autoconsciencia. Aunque les  prestamos más atención en otros capítulos del libro, echemos un vistazo a  cómo  pueden  tendernos  una  mano  para  salvarnos  de  uno  que  otro  arranque de furia.  El  mindfulness  y su práctica de meditación previenen la reacción ciega  y,  como  resultado,  nos  ayudan  a  evaluar  nuestras  experiencias.  El  mindfulness   nos  anima  a  recibir  las  cosas  como  vienen,  a  dar  la  bienvenida a las emociones y pensamientos sin sentir la necesidad de  empujarlos. Esto nos estabiliza y nos abre la puerta a ver el enojo como lo  que es: un sentimiento que nos visita de entrada por salida y no como un  tirano que se apodera de nosotros.  La autocompasión es el complemento perfecto. Si con el  mindfulness  aceptamos el aquí y el ahora, con la autocompasión nos aceptamos a  nosotros.  Nos  ayuda  a  sabernos  merecedores  de  consideración,  a  comprender que somos humanos propensos al error y al arrebato, pero  también capaces de entenderlos y superarlos. Según los estudios, con esta  práctica  aumentamos  nuestra  resiliencia  y  estabilidad,  a  la  vez  que  disminuimos  el  juicio  negativo,  la  comparación  con  los  demás  y  el  ponernos a la defensiva.  La  autoconsciencia  es  la  capacidad  de  voltear  hacia  nosotros  y  detectar los cómos y los porqués de nuestro enojo. Para esto, Golden nos  recomienda llevar un diario como herramienta para ponernos en contacto  con  las  situaciones  y  sentimientos  que  detonan  nuestro  enojo.  En  la  medida que hagamos este ejercicio, entenderemos la cadena de hechos  que  suele  llevarnos  al  enfado  y,  por  lo  tanto,  identificaremos  cuando  estemos en cierto eslabón para actuar antes de que se salga de control.  “Bueno, ya me enojé, ¿ahora qué?”  Cuando somos víctimas del enojo de los malos, corremos el riesgo de  convertirnos en nuestra peor versión y perder la buena imagen que los  demás tienen de nosotros. A continuación comparto algunas maneras de  sacudirse los demonios antes de que crezcan y se multipliquen. \n— Crea un distractor.  El doctor y profesor de la Universidad del  Estado de Ohio, Brad Bushman, resume que lidiamos con el enojo  de tres formas: reprimiéndolo, expresándolo o deshaciéndonos de él.  Usemos una metáfora: la primera es aumentar la presión de la olla,  la segunda es liberarla poco a poco y la tercera es bajarle la llama al  fuego. Bushman nos dice que la última es la mejor y, para lograrla,  requerimos  desviar  nuestro  foco  de  atención  lejos  del  objeto  de  enojo con técnicas como respirar hondo, contar hasta diez o escuchar  música relajante.  —  Revisa  el  velocímetro  y  bájale  dos  rayitas.  Los investigadores  Todd Kashdan y Robert Biswas-Diener afirman que el enojo no es  tan problemático como nuestra impresión sobre la velocidad a la que  va. Cuando estamos consumidos por él, nos hacemos la ilusión de  que va en aumento, que el peligro está escalando y que el tiempo  para intervenir se nos agota. Esta sensación de prisa nos orilla a  tomar  decisiones  que  pueden  acabar  con  la  amenaza,  pero  que  pueden  acarrear  efectos  negativos  en  el  futuro.  Los  científicos  aseguran que, por ello, es útil desarrollar en nosotros una especie de  velocímetro para detectar si vamos en los niveles bajos de una ligera  agitación, en los medios de una indignación, o de plano en los altos  de  sentir  que  nos  hierve  la  sangre  con  violencia.  Este  autoconocimiento  nos  permite  navegar  entre  estos  niveles.  A  sabiendas de esto, la recomendación es ajustar y no actuar hasta que  logremos estabilizarnos.  — Sobre aviso no hay engaño.  En situaciones de enojo subestimamos  mucho el valor de la honestidad, cuando es una de las herramientas  más  valiosas  en  situaciones  críticas.  La  transparencia  tranquiliza  porque partimos del terreno de los hechos y no de las suposiciones.  Los investigadores Todd Kashdan y Robert Biswas-Diener nos dicen  que  aceptar  verbalmente  nuestro  enojo  ante  los  demás,  incluso  pedirles  perdón  anticipadamente  por  cualquier  reacción  negativa,  desarma una posible escalada de hostilidades. Los demás no sólo se  tornan  más  empáticos  ante  nuestra  cortesía,  sino  que  toman  precauciones para lidiar con el asunto con más cuidado y precisión.  —  Tómalo  con  humor.   El  doctor  Ryan  Martin,  profesor  del  departamento de Psicología de la Universidad de Wisconsin-Green  Bay, dice que el humor (mientras no sea hostil y sarcástico) merma \nel enojo por la sencilla razón de que el estado psicológico de percibir  algo como gracioso es incompatible con el del enojo. Digamos que  es  difícil  reír  y  hacer  corajes  a  la  vez.  El  humor  también  se  transmite, relaja a las personas que nos acompañan y, por lo tanto,  descarga de solemnidad y tensión al ambiente. O como decía mi  abuela cuando alguien manejaba velozmente y nos sobrepasaba con  alguna ofensa, pobre hombre “se ha de estar cagando”, situación que  generalmente nos daba risa y nos ayudaba a ser “más comprensivos”  y a mantener la calma.  — Cambia de perspectiva.  El profesor Brad Bushman nos da otro  valioso  consejo,  puesto  que  el  enojo  es  un  acto  egocentrista,  ponernos en los zapatos de la persona que nos lo causó sirve para  atemperar  los  ánimos.  Vamos  a  un  ejemplo  similar  al  del  punto  anterior, si un conductor se mete a nuestro carril a toda velocidad y  su coche pasa a centímetros del nuestro, el puro hecho de repensar la  situación con un simple “debe tener prisa por alguna emergencia”,  nos ayuda a ser más comprensivos y a mantener la calma.  Al principio afirmamos que el enojo nos puede convertir en una persona  distinta,  pero  al  final  llegamos  a  la  conclusión  de  que  “distinta”  no  necesariamente significa “mala”. Depende de cómo canalicemos nuestro  enojo el que esa persona sea motivo de orgullo o de vergüenza.  Reza el dicho popular: “Para atrás ni para tomar impulso.” El enojo  vertido al pasado sólo despierta rencor y venganza; pero echado hacia  delante libera una energía sin carga negativa y sí utilizable para las tareas  nobles que nos quedan por emprender.  Entonces, el enojo es una herramienta poderosa tanto para el cobarde  como  para  el  valiente.  El  cobarde  se  deja  quemar  sin  consciencia,  mientras  que  el  valiente  toma  la  sartén  por  el  mango.  ¿Qué  clase  de  persona moldearás con esta energía potencial? \n¿Por  qué  hacemos  lo  que  hacemos?  ¿Qué  es  exactamente  lo  que  nos  mueve? ¿Hacia dónde nos lleva?  El poeta norteamericano Walt Whitman dice en uno de sus bellos  poemas:  ¿Me contradigo acaso?  Muy bien, me contradigo.  Soy inmenso, contengo multitudes.  ada humano es una multitud de impulsos, cada una tirando  para  su  lado.  Creemos  algunas  cosas  y  podemos  terminar  haciendo  otras.  No  siempre  sabemos  lo  que  queremos  y,  cuando sí, lo buscamos, lo conseguimos y... el resultado no siempre es  lo que esperábamos. Cual péndulo, cuando estamos cargados hacia  un lado ansiamos el otro y al llegar a él extrañamos el anterior.  Veamos esta pequeña gran muestra. El economista y autor Arthur C.  Brooks  desmiente  la  idea  de  que  la  felicidad  y  la  infelicidad  sean  opuestas. En estudios con resonancias magnéticas, se ha descubierto que, \ncuando estamos felices, algunas partes de la corteza cerebral izquierda se  activan, mientras que con la infelicidad ocurre lo contrario: se estimula la  derecha.  Diferentes partes, diferentes resultados. Por lo mismo, Brooks señala  que ser más feliz que el promedio no quita la posibilidad de ser más  infeliz  que  el  promedio:  “Hice  una  prueba.  Encontré  que,  para  la  felicidad, estoy en la parte superior de la tabla entre la gente de mi edad,  sexo, ocupación y nivel educativo. Pero también tengo una calificación  muy alta en el rubro de infelicidad. Soy un melancólico alegre”. Suena  raro  pero,  así  como  lo  cortés  no  quita  lo  valiente,  lo  feliz  no  necesariamente quita lo infeliz.  ¿Cómo nos explicamos esta paradoja? Veamos las pruebas. Algunas  teorías científicas establecen dos tipos básicos de motivaciones y metas  detrás  de  nuestros  comportamientos:  las  intrínsecas  o  internas  y  las  extrínsecas o externas.  Las extrínsecas se centran en valores externos como la consecución de  posesiones,  dinero,  reconocimiento  social  y  apariencia  externa;  las  intrínsecas,  por  su  cuenta,  favorecen  valores  internos  —aquellos  que  pertenecen  a  nuestro    yo —  como  el  crecimiento  personal,  relaciones  sociales, implicación en la comunidad y salud física.  Justo  aquí  encontramos  uno  de  los  puntos  de  origen  de  nuestras  contradicciones:  es  común  que  en  un  mismo  punto  de  nuestra  vida  tengamos  un  abanico  variado  de  incentivos.  Algunas  actividades  las  hacemos porque nos nacen y para otras digamos que necesitamos una  ayudadita. Somos una multitud de motivaciones que cobran ganancias y  pérdidas. Pero ¿cuál es la diferencia a fin de cuentas?, ¡para saber a cuál  irle!  El logro no siempre tiene un final feliz  Investigadores de la Universidad de Rochester dieron seguimiento a un  grupo  de  recién  graduados  de  licenciatura,  para  examinar  las  consecuencias psicológicas que estos experimentan al seguir y lograr sus  aspiraciones.  Los  resultados  indicaron  que  cuando  daban  importancia  a  sus  aspiraciones,  sean  estas  intrínsecas  o  extrínsecas,  generalmente  las  lograban. Sin embargo, mientras cumplir con las intrínsecas tuvo relación \npositiva con la salud psicológica de los egresados, con las extrínsecas  ocurrió lo contrario.  Así  que  no  todos  los  logros  son  creados  a  semejanza;  diferentes  aspiraciones llevan a distintos resultados. Se ha demostrado que las metas  intrínsecas  se  asocian  con  bienestar  y  buena  salud,  mientras  que  las  extrínsecas  tienen  una  conexión  directa  con  problemas  de  ansiedad,  depresión, baja autoestima y malas relaciones. ¡Zas!  Esto  nos  debe  poner  a  pensar  seriamente  para  que  enderecemos  nuestras prioridades. Me viene a la mente lo común que es asociar la idea  del éxito con la fama, el dinero y el poder, como si estos fueran los  grandes  síntomas  de  un  estado  de  bienestar  integral.  A  la  pregunta:  “¿Quién se te viene a la mente con la palabra éxito?”, seguro casi nadie se  escapa de pensar en un empresario millonario, un político influyente, un  medallista olímpico o un artista reconocido.  Pero, así como el dicho bíblico de “al César lo que es del César, a  Dios  lo  que  es  de  Dios”,  también  existe  la  división  entre  las  metas  materialistas y las espirituales. Ya que vimos los resultados, las primeras  se quedan cortas para ameritar la etiqueta de éxito en toda la extensión de  la  palabra.  Digamos  que  no  cumplen  con  la  felicidad  que  prometen,  entonces esto nos debe invitar a ser menos conformistas con nuestras  metas y a elegir aquellas que sí entreguen resultados satisfactorios.  Salidas falsas  Ya vimos que una persona verdaderamente triunfadora no se descobija  los pies por taparse la cabeza. Piensa más bien en todas sus dimensiones y  organiza  su  tiempo  para  atenderlas  todas:  la  física,  la  emocional,  la  mental...  Lo digo también porque, según los estudios, muchas veces recurrimos  a las metas externas para compensar las carencias en las internas. Ante la  frustración de no encontrar la felicidad por ningún lado sentimos que de  algo tenemos que agarrarnos.  Y  entonces  es  como  parchamos  una  herida  abierta  con  pequeñas  banditas adhesivas. Banditas caen, banditas pegan, pero sin atender la  causa raíz la hemorragia sigue su curso. El problema es que buscamos  fuera  lo  que  todo  el  tiempo  estuvo  tan  cerca,  dentro  de  nosotros.  Considera lo siguiente: \n—  Si  sufrimos  un  deseo  incontrolable,  no hay posesiones que lo  sacien.  — Si nos hacemos menos,  no hay fama que nos haga más.  —  Si  nos  sentimos  inseguros,  no hay poder que nos blinde de un  enemigo  que  tenemos  en  casa:  nuestras  propias  emociones  destructivas.  En otras palabras, acumulamos sin saber que eso perjudica más de lo que  ayuda. Y no sólo hablo de dinero y posesiones. Por ejemplo, nuestro  deseo carnal nos tienta, cual conjuro, a brincotear de persona en persona  como  “burro  en  primavera”.  Envidiamos  la  suerte  de  don  Juan  y  sin  embargo, algo nos falta.  Investigadores  de  las  universidades  de  Dartmouth  y  Warwick,  tras  entrevistar a 16 000 personas, descubrieron que, tanto en hombres como  en mujeres, la evidencia apunta que el número óptimo de parejas sexuales  es ni más ni menos que uno. De hecho, la investigación arrojó que los  casados  son  los  más  afortunados:  tienen  más  relaciones  sexuales  y  obtienen más gratificación que los solteros, viudos y separados.  O  sea  que  de  plano  muchas  veces  no  le  atinamos  y  obtenemos  resultados  muy  distintos  a  los  que  esperábamos.  En  efecto,  buscar  soluciones  fuera  para  problemas  dentro  es  una  salida  falsa,  en  serio.  Implica huir por la puerta más obvia, sin sospechar que basta permanecer  explorando el interior un poco más para abrir la verdadera.  Explotar la motivación por la felicidad  Si la motivación nos mueve, la motivación intrínseca nos mueve por el  mejor de los caminos. A esa hay que apuntar todas nuestras baterías. La  teoría psicológica de la autodeterminación (TAD) estudia las formas de  estimular  este  tipo  de  motivación  y,  por  tanto,  acercarnos  más  a  la  felicidad, a través de tres puntos clave:  — Competencia .  Ejercer e incrementar nuestras capacidades y sentir  que nuestras acciones son efectivas.  —  Autonomía.   Sentirnos  dueños  de  nuestras  propias  acciones  y  conductas, sin controles externos.  — Relación.  Sentirnos conectados con los demás y lograr un estado de \nseguridad y pertenencia con la comunidad.  Para  la  TAD,  estas  son  necesidades  básicas  y  universales.  Todas  las  compartimos, sin importar sexo, cultura, edad o nacionalidad. Cuando nos  privamos de ellas caemos en la tentación de recompensarnos con premios  banales. En cambio, la versión más cercana de jugar a la segura en los  asuntos de la felicidad es colocar todos nuestros reflectores en esos tres  principios.  El primer paso para lograrlo es aceptar de corazón si descarrilamos  nuestros motivos en algún punto. Pregúntate a cada momento: “¿Qué me  mueve exactamente a hacer esto?” Con un pequeño giro de perspectiva  podemos regresar a un carril más provechoso. Vayamos una por una:  —  Para incrementar la competencia, ya es de por sí una mala señal si  te  cachas  haciendo  tu  trabajo  sólo  por  arañar  la  quincena  o  lamentando cada que puedes las órdenes de tu jefe. Qué diferente  ver  cómo  tu  tiempo  en  tal  lugar  puede  redituar  en  nuevas  habilidades, experiencias y contactos. De hecho, es gracias a este  aprendizaje que podrás migrar a mejores trabajos a futuro. Así sería  una cuestión de ganar-ganar.  —  El ejercicio y dietas no se deben medir en cuadritos abdominales.  La  verdadera  recompensa  es  sentirte  bien,  no  impresionar  a  los  demás.  Así  que,  si  lo  reorientas  al  disfrute  del  proceso  y  no  al  desenlace o al resultado, la ensalada y la vuelta al gimnasio serán  siempre más placer que sacrificio.  —   Sobre  el  aspecto  relacional,  presta  mucha  atención  a  tus  conversaciones. Reza el dicho que nacimos con dos oídos y una  boca para escuchar más de lo que hablamos. Si eres un hablador  compulsivo, ¡aguas! Podría ser señal de que tu intención verdadera  sea sobresalir. Recuerda que no se trata de estar por encima de los  demás; la verdadera conexión se encuentra en la paridad, en siempre  ver a los demás como iguales, en empatizar y aprender de ellos algo  nuevo. De otra manera, el tornillo y la tuerca no embonarían.  Motivación para niños \nJames Mandigo y Nicholas Putting, de la Universidad  de Alberta, en Canadá, escriben recomendaciones para  el coco de todos los padres y maestros: ¿Cómo motivar  a los niños a elegir el buen camino?  Los  investigadores  refieren  que  entre  más  se  incentive  la  motivación  intrínseca,  mayor  es  la  probabilidad de que gocen de una mejor experiencia y  quieran  continuar  su  participación  en  cualquier  actividad virtuosa.  Es decir, el  reto es lograr que quieran hacerlo  de  corazón, sin necesidad de babear por el dulce, recibir a  cambio el juguete o hasta la buena calificación al final.  Los investigadores nos dan estas pistas:  —  Propiciar la decisión y el control. Debemos crear  un  ambiente  apto  para  que  los  niños  sientan  que  pueden tener la facultad de decidir y estar en control  de sus acciones.  —   Minimizar  el  uso  de  factores  externos.  Las  recompensas extrínsecas que sirven para controlar el  comportamiento tienden a minar la motivación. En  caso de utilizarlas, estas deben mandar un mensaje  positivo  sobre  el  desempeño  del  niño,  no  para  controlarlo  sino  para  desarrollar  más  su  gusto  voluntario por la actividad.  —   Mejorar  la  percepción  de  las  competencias.  Se  refiere a cómo se ven en comparación con otros. Si  el niño siente que cuenta con las habilidades para  cumplir cierta actividad es más propenso a continuar  con  ella.  Es  decir,  debemos  provocar  situaciones  que se conviertan en epifanías de reconocimiento:  “¡Ah, qué bueno soy en esto!”  —   Destacar  la  importancia  de  la  mejora  personal.  Crear un clima orientado al dominio de habilidades  y  el  desarrollo.  El  éxito  debe  ser  equivalente  a \nprogresar,  esforzarse  y  apreciar  los  errores  como  oportunidades de aprendizaje.  —  Optimizar los retos. Balancear la dificultad según  el nivel de cada uno. De otra forma, si es muy alto,  pueden experimentar frustración  y ansiedad; si  es  muy bajo, corren el riesgo de aburrirse.  Las lecciones de Oriente  Hemos  repasado  la  visión  de  los  países  de  este  lado  del  mundo.  Sin  embargo, muchas tradiciones orientales ya intuían estos y otros beneficios  psicológicos similares desde hace siglos.  La siguiente historia taoísta nos viene como anillo al dedo:  Había un campesino al que, luego de haber trabajado por años, se le  escapó  uno  de  sus  caballos.  Tras  escuchar  la  noticia,  sus  vecinos  acudieron a expresar sus condolencias:  —¡Qué mala suerte!  —Quizá —respondía el campesino.  Al  día  siguiente,  su  caballo  regresó  acompañado  de  seis  caballos  salvajes. Sus vecinos volvieron y le expresaron su beneplácito:  —¡Qué maravilla!  —Quizá —volvió a contestar.  A  la  mañana  siguiente,  su  hijo  se  rompió  una  pierna  intentando  montar uno de los caballos salvajes. También esta vez los vecinos se  compadecieron del campesino:  —Una verdadera lástima.  —Quizá —se limitó a decir de nuevo.  Un  día  después,  llegaron  unos  oficiales  con  la  misión  de  reclutar  obligatoriamente jóvenes para el ejército. Al ver la pierna rota del hijo del  campesino no lo requirieron. Los vecinos se acercaron para felicitar al  campesino por la buena fortuna.  —Quizá—, les dijo.  En el taoísmo se dice que el universo es un estado de flujo y que el  sufrimiento  viene  cuando  lo  interrumpimos.  Cuando  entrometemos  nuestro ego en la corriente que es la vida creamos una resistencia y la  obstruimos. De ahí el dicho clásico “déjalo fluir”. \nEn el caso del campesino, lo que para otros hubiese sido una montaña  rusa emocional de épicas proporciones, para él fue la paz y ecuanimidad  quienes dictaron sus respuestas.  Si  la  vida  es  un  vaivén  de  acciones,  reacciones,  coincidencias,  encuentros y desencuentros, ¿cómo podemos tener felicidad y propósito  de un sitio tan inseguro? Las cosas se desbaratan. Las experiencias son  transitorias. Las personas no sólo vienen y van, también mudan la opinión  que tienen sobre nosotros. ¿A qué nos atenemos si nos aferramos a lo que  sucede allá afuera?  Un  monje  budista  llamado  Shantideva  decía  hace  siglos:  “¿Dónde  puede haber suficiente cuero para cubrir el mundo entero? Con tan sólo el  cuero de mis sandalias, es como si todo el mundo estuviese cubierto. De  igual  manera,  soy  incapaz  de  controlar  los  fenómenos  externos,  pero  puedo controlar mi propia mente. ¿Qué necesidad hay de controlar otras  cosas?”  Y así es como el budismo hace énfasis en la fugacidad de las cosas en  el universo. Todo deja de existir y está fuera de nuestro control, hasta  nuestra propia vida humana; por lo tanto, la única tablita de salvación de  la felicidad y propósito es nuestro espíritu. Es como un oasis de quietud  entre  la  tormenta;  un  refugio  de  permanencia  en  un  mundo  lleno  de  violentos cambios de dirección.  Pero no tienes que escalar las montañas del Tíbet para llevar esto a la  práctica. Ahórrate el tiempo del viaje e inviértelo ahora mismo en este  principio  básico:  no  mires  afuera;  observa  tu  reacción  dentro  de  ti.  Traduce lo que te digo en esta simple pregunta: “¿Estoy esperando algo a  cambio?”  Por ejemplo, el amor malentendido vierte expectativas al exterior; le  pide a los demás algo a cambio: que asuman el papel de proveedores de  esa felicidad que no hemos conseguido nosotros. En cambio, el amor  incondicional va de ida pero no de vuelta; el que lo siente se entrega,  antepone el bienestar del otro al propio y agradece por la fortuna de tener  la oportunidad de amar a alguien, sin lamentar su futura pérdida. Mientras  que el primer tipo de amor se presta a celos, codependencia y tristeza, el  segundo  aprecia  el  aquí  y  el  ahora  sin  depender  de  lo  que  depare  el  destino. La vida en pareja es hermosa pero frágil. Con la amenaza de un  amor controlador corremos el riesgo de arruinarla por completo.  Esperar  algo  a  cambio  es  algo  tan  humano  como  el  mismísimo \negoísmo  que  lo  origina.  Solemos  compartir  las  mismas  culpas  que  le  echamos a la gente más canija ,  sólo que se nos dificulta la autocrítica.  Hacemos esto sin anticipar que nos enriquece más lo que entregamos  desde dentro que lo que tomamos desde fuera. Suena a otra paradoja pero  es cierto: los principales beneficiarios de nuestra generosidad no son los  demás; somos nosotros, pues es una forma de descubrir esa versión de  nuestro yo que guarda la verdadera fuente de la felicidad.  La felicidad, tal como Dios, parece trabajar de formas misteriosas.  Pero, si lo pensamos una segunda vez, resulta que el secreto no es tan  impenetrable.  La fama, la lujuria, el poder y el dinero son formas descarriadas del  deseo, y en el deseo no hay saciedad; como ocurre con el agua salada:  entre  más  bebes,  más  sed  da.  Tomamos  este  camino  por  seguir  ciegamente  a  la  hormona  y  la  víscera  que,  aunque  malas  consejeras,  muchas veces rigen nuestras decisiones.  A
