e reloj. Esto  cobra más sentido si consideramos la vida de nuestros antepasados,  que dormían con la noche y despertaban con los primeros rayos del  sol. Por lo mismo, para concebir el sueño es mejor no exponerse a  radiación de luz por la noche y sí tomar un baño de sol cuando  empieza el día. De esta forma le damos más y mejor información a  nuestro reloj y nos habituamos a ciclos más estables de sueño. Por lo  mismo, presta mucha atención al siguiente punto.  —  Fuera  aparatos.  Un artículo de  The Atlantic  hace una serie de  estudios para revisar los efectos del uso de dispositivos móviles en  nuestro sueño. En resumen: los celulares y computadoras modernas  emiten todo el espectro de luz visible, incluida la azul, que inhibe la  producción de melatonina, la hormona que induce la necesidad de  dormir. También disminuyen la cantidad de sueño profundo, causan  la tentación de revisarlos constantemente y emiten alertas auditivas  que nos despiertan. La recomendación es despegarse de las pantallas  un par de horas antes de dormir. Si por alguna razón te es de vida o  muerte  quedarte  pegado  a  ellos,  te  recomiendo  descargar  aplicaciones como f.lux, que sirven para sustraer el azul del espectro \nde luz emitido por los dispositivos.  —  Inhala  lo  pacífico,  exhala  lo  estimulante.  Conforme avanza la  noche debemos empezar una transición a estados mentales plácidos  que nos lleven en brazos a la cama. Desde el Instituto Nacional de la  Salud Mental y las Neurociencias de Bangalore, en la India, nos dan  consejos para reforzar esta táctica: ya que estés en la cama, evita los  pensamientos  causantes  de  agitación  mental  o  emocional:  problemas, sucesos emocionantes, eventos por venir que provoquen  ansiedad, etcétera, pon tu atención en sonidos sutiles como el tráfico  distante o la naturaleza a tu alrededor; visualízate en un escenario  pacífico; enfócate en el aire transitando desde y hacia tus pulmones;  relaja tu cuerpo de forma progresiva, parte por parte, de los pies a la  cabeza.  — Desnuda tu mente de problemas.  La clásica “no duermas enojado  con tu pareja” ya se nos quedó corta. Le debemos una enmienda.  Según la ciencia ésta hace más justicia al descanso: “No duermas  enojado con nada ni con nadie, nunca.” En un estudio científico  publicado  en  la  prestigiosa  revista    Nature,   investigadores  descubrieron  que  dormir  luego  de  una  experiencia  adversa  reorganiza las formas en que las memorias negativas se almacenan  en nuestro cerebro, de modo que se nos complica suprimirlas en el  futuro. Provoca que se solidifiquen.  —  Para  tu  siesta,  sólo  cuenta  hasta  10.  Está comprobado que las  siestas  exprés,  en  inglés  llamadas    power  naps,   nos  ayudan  a  revitalizar los ánimos y la concentración. Tan es así que compañías  como Google, Apple y Nike disponen áreas especiales para que sus  empleados puedan recargarse de cara a la segunda mitad del día  laboral. Amber Brooks, investigadora de la Universidad de Flinders,  en Australia, se propuso determinar la medida dorada de la siesta por  medio de un experimento en el que, tras una noche de sólo 5 horas  de sueño, ordenó dormir a los distintos participantes 5, 10, 20 o 30  minutos a las 3:00 de la tarde. El desenlace: la siesta de 10 minutos  produjo  mejoras  inmediatas  en  todas  las  mediciones  (tales  como  recuperación, nivel de somnolencia, vigor y desempeño mental), y  muchas de ellas se sostuvieron por periodos de hasta 155 minutos,  ése era el ideal. \nTe comparto la siguiente tabla para que sepas cuánto es lo que se requiere  de sueño según tu edad o la de los miembros de tu familia, ¡a dormir se ha  dicho!  Dormir no es un lujo. Es uno de los pilares principales que sostienen tu  bienestar físico, mental y emocional. A los que dicen “ya habrá tiempo de  descansar en la tumba”, yo se las volteo: “Ya habrá tiempo para seguir  cansándote  en  la  vida;  el  trabajo  nunca  se  acaba.”  Nos  debemos  la  pregunta ¿a dónde vamos tan rápido que no nos damos la oportunidad de  un respiro? Un respiro que además nos permitiría volver a acelerar no  sólo más rápido, sino más seguro. \nas  piedras  preciosas  no  llegan  a  los  aparadores  por  generación  espontánea.  Además  de  los  años  que  tarda  la  naturaleza  en  producirlas,  su  belleza  logra  su  máxima  expresión  gracias  a  los  procesos  de  refinamiento:  tallado,  corte,  coloración, impregnación, irradiación, etcétera.  Sucede igual con las personas y con las ideas. Todas parten de un  punto que es diferente para cada una: hay personas inteligentes, otras son  creativas, algunas más son pasionales. ¿Pero de qué depende que lleven  su techo a la mayor altura posible?  Me salta a la mente el testimonio que alguna vez leí de una persona  superdotada. Como de niño nunca tuvo problemas para librar los escollos  de  la  escuela,  aceptaba  haberse  vuelto  “flojo”  pues  nunca  necesitó  ejercitar  el  músculo  del  esfuerzo.  Le  bastaba  andar  a  medio  gas  para  aprobar todas sus asignaturas. Esto hizo que a la larga se hundiera en la  mediocridad. Se conformó con una profesión que no era propicia para el  despliegue de todo su potencial.  Así que ¿qué es de una persona con privilegios genéticos si no los  pule?, ¿o qué es de una gran idea si se duerme en la teoría y no despierta  en la práctica? \n¿El triunfador nace o se hace?  Anthony  Tjan  Heart  escribió  para  la  editorial  de  Harvard  Business  Review el libro  Heart, Smarts, Guts, and Luck.  Como su título lo dice en  inglés, trata sobre el corazón, la inteligencia, las agallas y la suerte en el  mundo de los negocios. Una pregunta fundamental que se formula es si  un emprendedor nace o se hace; es decir, si estas características sólo  vienen precargadas o si las podemos instalar con el tiempo.  Tjan descubrió que el corazón —es decir, la pasión y el propósito— es  el rasgo más fuerte e importante entre los emprendedores entrevistados, y  aunque éste depende mucho de la genética, el acto de seguirlo es una  decisión voluntaria. En otras palabras, una cosa es lo que sentimos y otra  si somos lo suficientemente valientes para seguirlo.  Por lo tanto, las agallas son declaradas por el autor como la barrera  más común para lograr el éxito. Si bien muchos guardamos algo valioso  en el corazón, no sirve de nada si no superamos nuestros miedos y nos  atrevemos a ejecutarlo.  La  buena  noticia  es  que  podemos  cultivar  nuestras  agallas  con  el  tiempo  y  la  práctica.  El  autor  destaca  tres  factores  importantes  que  posibilitan ese desarrollo:  —  Tener experiencias en la infancia: 80% los emprendedores que se  declararon altos en “agallas” exploraron algún tipo de negocio en  edad temprana, lo que hizo más gruesa su piel.  —  Prepararse para situaciones de riesgo: la mayoría también creyó  importante estudiar y anticipar las formas de enfrentar el riesgo, lo  que ayuda a mitigarlo al enfrentar situaciones reales.  —  Conseguir el respaldo de otros colegas y compartir responsabilidad  con ellos: es más fácil aventurarse a saltar a terrenos desconocidos  sabedores de que tenemos una red de seguridad que puede evitar o  amortiguar el golpe.  Así nos ayudamos en razón de dos sabidurías: la de los libros y la de la  calle.  Con  la  primera  montamos  guardia  intelectual  y  con  la  segunda  aprendemos  el  oficio  en  el  mundo  real  y  de  paso  nos  hacemos  de  importantes aliados. \nLas lesiones son lecciones  Los  ingenuos  pensarán  que  el  éxito  es  NO  haber  fracasado;  los  moderados tratarán de corregirlos diciendo que se logra A PESAR del  fracaso, pero los más sensatos arribarán a la mejor conclusión: se llega  GRACIAS al fracaso.  Tenemos una versión romántica e idealizada del triunfador. Esto quizá  sea porque no lo acompañamos cuando derramó sangre, sudor y lágrimas  antes de llegar a su meta. El fracaso es invariablemente parte del camino.  No hay nadie que haya llegado al triunfo sin haber azotado contra el piso  en repetidas ocasiones y haberse roto una que otra expectativa.  Decía el escritor Zig Ziglar que lo que cuenta no es lo pronunciado de  la caída sino la altura del rebote. En el terreno de la acción, podemos  pensar esto como en física: entre más caiga algo, más alto rebota; entre  más escandaloso el fracaso, más en evidencia quedarán los errores que lo  produjeron, y esto, a su vez, facilitará el aprendizaje práctico.  Pero es en la dimensión de la reacción donde el verdadero fracaso  puede gestarse. Tenemos pavor a fracasar por varias razones. Por un lado,  es un golpe a nuestra autoestima sólo si nos convencemos de que este  resultado nos define, es decir que este fracaso significa que somos unos  fracasados. Por otro, también le tememos mucho a quedar en ridículo ante  los demás. Ambas reacciones dan lugar a dos terribles sentimientos que  nos pueden forzar a rendirnos: culpa —con nosotros— y vergüenza —  con los demás.  Así que la frase de Ziglar tiene dos implicaciones para el fracaso: nos  vuelve más sabios para hacerlo mejor y nos curte el corazón para seguir  intentándolo. ¡Zas!  Independientemente  de  que  nos  tomaremos  varias  cucharadas  de  medicina  amarga  por  nuestra  cuenta,  ahora  echemos  un  vistazo  para  aprender de los errores de los que ya llevan camino andado.  Investigadores  del  Tecnológico  de  Monterrey,  en  conjunto  con  el  Instituto del Fracaso, publicaron  El libro del fracaso,  para explorar las  estadísticas del fracaso y las razones que hay detrás de él.  El libro da dos noticias: ¿la buena? En México, 75% de las nuevas  empresas cierra tras sólo dos años de operación —para que veas qué  común  es  el  fracaso—;  ¿la  buena?  Entre  2009  y  2012,  por  cada  100  negocios existentes, cerca de 22 cerraron y 28 iniciaron actividades —hay  más gente intentándolo que abandonándolo, ¿ves? Viéndolo así, no hay \nnoticia mala.  Para  determinar  los  factores  mentales  detrás  de  los  fallos  de  los  empresarios en sus compañías, los investigadores también usaron en su  encuesta los rasgos de personalidad de la teoría conocida como “los cinco  grandes”  (investigadores  de  la  Universdad  de  Illinois  y  la  Escuela  de  Negocios de Melbourn, han realizado estudios basados tambien en esta  teoría, conocida además con el nombre de la teoría de los rasgos). Los  encuestados  se  identificaron  mucho  más  con  dos  rasgos.  74%  de  los  fundadores que fracasaron contestó “apertura a nuevas experiencias”, así  que  casi  tres  cuartos  de  la  muestra  buscaba  nuevas  experiencias.  La  segunda característica dominante fue “cuidadoso/concienzudo”, con un  47% de las menciones, lo que significa que, aunque presuntamente se  autocontrolaban y planeaban, no les era suficiente.  Sobre  las  razones  técnicas  que  intervinieron  en  el  cierre  de  sus  empresas, las respuestas se eligieron en este orden: ingresos insuficientes  para  subsistir  (65%),  falta  de  indicadores  (48%),  falta  de  proceso  de  análisis (44%), planeación deficiente (44%), problemas en la ejecución  (43%).  Si bien es cierto que ser de mente abierta facilita la incursión en los  negocios, eso no parece ser garantía de su permanencia. Por otro lado,  aunque  la  segunda  respuesta  con  más  menciones  en  los  rasgos  de  personalidad  haya  sido  ser  cuidadoso,  curiosamente  abundan  en  los  primeros lugares aquellas razones de negocios que aparentan desatención  al detalle como falta de indicadores, análisis y mala planeación.  Ni muy muy ni tan tan  Para triunfar en grande hay que arriesgar y para arriesgar hay que ser  optimista. Mientras que el negativo es conservador porque ni siquiera lo  cree factible, el que piensa positivo es aventurado porque siente que todo  lo puede y eso... no siempre acaba bien.  Brett Simmons, profesor de la Escuela de Negocios de la Universidad  de Nevada, cita un estudio que concluye que el optimismo es como todo:  debemos tomarlo con medida. Luego de analizar la experiencia de 207  emprendedores, los investigadores encontraron una asociación negativa  entre su optimismo y el desempeño de su nuevo negocio. Además, esta  relación  negativa  era  más  fuerte  cuando  los  empresarios  ya  habían \nfundado otras compañías.  Esto nos deja dos aprendizajes:  —  Tenemos que compensar nuestro optimismo con una dosis de  realismo  que  prevenga  que  nos  entreguemos  al  exceso  de  confianza.  —  Los triunfos del pasado no necesariamente garantizan los del  futuro. El historial de éxito personal puede exacerbar nuestro  optimismo  y  hacernos  olvidar  que  los  frutos  que  hemos  cosechado  antes  tienen  características  únicas  que  los  propiciaron.  La actitud positiva es importantísima, claro, pero no lo es todo. Es la  chispa que arranca y acelera nuestros proyectos, pero requiere de muchos  aliados para extender su expectativa de vida, ¡aguas!  ¿Se nos puede ir el tren?  Últimamente creemos que, en los negocios o en las artes, empezar tarde  es como no empezar nunca. ¿Por qué? Quizá porque asociamos la flor de  la juventud con la vitalidad y el hambre de triunfo, o porque es justo a esa  edad cuando se pueden tomar riesgos fuertes antes de sentar cabeza.  También  sucede  porque  nos  apantallan  las  grandes  empresas  de  nuestro tiempo: las tecnológicas fundadas por jóvenes brillantes como  Steve Jobs y Bill Gates que la hicieron en grande antes de los 30.  Pero  no  adelantes  conclusiones.  Vivek  Wadhwa,  profesor  de  las  universidades de Stanford y Duke, realizó en 2009 una investigación que  desmiente que el éxito sea perecedero a cierta edad.  Según su estudio, la edad promedio de un emprendedor exitoso en  industrias  de  alto  crecimiento  como  la  tecnología,  la  medicina  y  la  aeronáutica  es  de  40  años.  Además,  la  cantidad  de  empresarios  triunfadores  mayores  de  50  duplica  a  los  menores  de  25.  De  forma  similar, los de arriba de 60 son el doble que los de abajo. Por último, la  gran mayoría —75%— cargaba un bagaje de seis años de experiencia en  su industria al momento de originar su compañía. \nWadhwa concluye: “Las ideas provienen de una necesidad; entender  la necesidad viene de la experiencia; y la experiencia llega con la edad.”  Así que los empresarios también pueden añejarse bien en las barricas  del tiempo. Y vaya que también en industrias como la tecnológica porque,  así  como  existen  los  niños  prodigio  de  Microsoft  y  Apple,  también  podemos voltear a Intel: la empresa líder en procesadores fundada por  Robert Noyce cuando tenía 40.  Pero hay ejemplos más extremos tanto por la edad de sus creadores  como  por  el  tamaño  de  su  éxito:  Ray  Kroc  arrancó  el  modelo  de  franquicias de McDonald’s a los 52, John Pemberton emprendió Coca-  Cola a los 55 y el famoso coronel David Sanders consiguió despegar  Kentucky Fried Chicken a los 65.  Lo que los emprendedores exitosos comparten  Investigadores  de  las  universidades  de  Rensselaer  y  Georgia  hicieron  un  recuento  de  los  atributos  de  los  empresarios exitosos en la literatura científica. Destacan  cuatro: capacidad de hallar y reconocer oportunidades,  perseverancia, habilidades sociales y autoeficacia —la  capacidad de organizar y ejecutar acciones para producir  resultados.  La  revista    Forbes   quiso  ahondar  en  el  asunto  y  realizó  su  propio  estudio  entre  2631  fundadores  de  empresas con más de un millón de dólares de ganancias  anuales. Las menciones más populares de entre las 23  opciones de la encuesta fueron visión (elegida por 61%),  ética  de  trabajo  (45%),  resiliencia  (41%),  positividad  (35%) y pasión (34%).  ¿Muy joven? Aprovecha tu ímpetu y el “nada que perder, mucho que  ganar”. ¿Ya mayor? Dale a tu experiencia y a tu sabiduría un buen uso.  ¿Nuevo en esto? Sujétate de tu inocencia para atreverte y ver las cosas  desde “fuera de la caja” ¿Ya con varios fracasos a cuestas? Ya recorriste \nlos muchos caminos en falso y restan menos por explorar para encontrar  el verdadero.  SI BIEN TODOS PARTIMOS DE LOS PREMIOS  PARTICULARES QUE LA LOTERÍA GENÉTICA NOS DIO, EL  ÉXITO SIGUE TENIENDO UN COMPONENTE MAYOR DE  ACTITUD, DE TOMAR LA DECISIÓN, EXPLOTAR LAS  CARACTERÍSTICAS DIFERENCIADORAS QUE NOS DAN  VENTAJA FRENTE A LOS DEMÁS.  En este apartado aparecieron palabras poderosas y resonantes: agallas,  actitud, resiliencia, perseverancia, pasión, trabajo, etcétera. En efecto, el  éxito no es un facilote. Ganárselo es incitarlo con decisión y un carácter  inquebrantable.  Muchos nos quedamos aguardando toda una vida, cuando en realidad  es  ella  la  que  se  encuentra  en  espera  de  que  nosotros  tengamos  la  iniciativa para alcanzar el triunfo. Bien decía Picasso: “Cuando llegue la  inspiración, que me encuentre trabajando.” \n\nor supuesto que no se trata de redimir mis penas o aminorar  cierto tipo de arrepentimiento, pero la respuesta que doy a  quienes me cuestionan el porqué de tantos viajes o por qué  trabajo  tanto  siempre  les  digo:  “Me  encanta  mi  trabajo.  Disfruto  inmensamente  presentarme  en  tantas  ciudades  con  tanta  gente  diferente  y,  por  supuesto,  también  amo  trabajar  en  la  radio,  llevo  más de 10 años consecutivos transmitiendo un programa diario con  temas totalmente diferentes y entretenidos, lo cual no es nada fácil,  pero la emoción que siento es indescriptible para mí.”  Alguien en alguna ocasión me dijo que trabajar en la radio se puede  convertir en adictivo; una vez que inicias y le encuentras significado es  difícil dejarlo. Eso me ha sucedido. Escribir un libro es una verdadera  terapia  para  mí,  ya  que  me  permite  expresar  lo  que  siento;  hacer  recomendaciones  sobre  temas  cotidianos  que  le  impiden  a  la  gente  disfrutar el verdadero placer de vivir e investigar sobre temas que creo  que la gente necesita saber. Y ni qué decirte de mi trabajo semanal en la  televisión, compartiendo temas diversos en un canal que se transmite en  México, Estados Unidos y por medio de televisión por cable en otros  países de Sudamérica. \nEs enorme la satisfacción al encontrarme a radioescuchas, lectores o  televidentes que me comparten que un determinado tema les tocó la vida  favorablemente. No lo cambio por nada, en serio.  Sin embargo, trabajar tanto ha sido también motivo de crítica. Amigos  que tienen la gran oportunidad de estar mucho tiempo en sus casas, que  viajan sólo por motivos de placer, de repente se convierten en jueces  implacables juzgando los días que viajo para realizar mi trabajo.  Dentro de los múltiples aprendizajes que he tenido en tantos años de  carrera como escritor, conferencista y conductor, tanto de radio como de  televisión, uno muy claro es que nunca tendré contenta a toda la gente.  Así  como  hay  quienes  te  admiran  por  lo  que  realizas  hay  quienes  te  critican.  “Nadie  es  monedita  de  oro  para  caerle  bien  a  todos”,  es  prácticamente imposible agradar a todo el mundo.  La escala de valores y principios de cada uno es diferente. La misión  que cada uno tenemos y deseamos vivir es diferente, y no podemos ni  debemos compararnos con otros, ni decir qué es lo normal o conveniente  para ti o para el otro, cada quien elige su camino.  Mi manager es mi esposa y ella hace todo lo posible para balancear  los tiempos de trabajo con los de mi familia, especialmente las fechas o  acontecimientos  importantes,  incluyendo  los  dos  o  tres  periodos  vacacionales que tomamos en familia.  No se trata de dar explicaciones no pedidas, pero quienes por motivos  laborales viajan tanto podrán entender la nostalgia que se siente no estar  con los seres queridos y aceptar que es el estilo de vida que decidimos  tener.  Hay quienes adjudican a la suerte el éxito laboral y nada tiene que ver  con la felicidad, ya que hay muchísima gente que tiene éxito en su trabajo  pero no es feliz. Yo creo que es más la fe, la constancia, la dedicación y la  pasión lo que está detrás del tan anhelado éxito laboral.  Para los que creen que es más la suerte, mi amigo René Alcalá dice  constantemente que la suerte se reparte entre las 6 y las 6:30 de la mañana  y que cada quien tiene lo que quiere o lo que se merece. ¿Será?  Te cuento una historia: voy en el pasillo rumbo al avión. Atrás de mí  viene una mujer de aproximadamente 40 años, estatura mediana, pantalón  y saco sastre, con una maleta de tamaño regular. Me detengo porque  adelante va una persona mayor que batalla para caminar y quien viene  tras  de  mí  se  me  pega  como  exigiendo  que  camine  rápido.  Con  una \nmirada la freno —ya te imaginarás el tipo de mirada—, llego al avión, mi  lugar está en la fila 3 y otra vez siento muy cerca su presencia, casi casi  pegada a mi cuerpo, lo cual me hace pensar morbosamente, ¿quiere un  acercamiento de otro tipo? ¡No! Totalmente descartado al ver su cara de  acelere en el rosto. Le digo viéndola a los ojos: “¿Me permite subir mi  maleta al compartimiento superior? ¿O quiere pasar primero?” Es cierto,  le pregunté con cierta molestia. “No —me dice—, voy a un lado suyo.” Y  de inmediato pienso: “¡Me lleva...!”  Se sienta, saca de su morral dos celulares, contesta en uno mensajes  de texto y en otro se pone a hablar con sabrá Dios quién, despotricando  contra alguien más sobre el porqué no se hizo determinado trabajo, luego  corta la llamada enojada. Entra otra llamada y da más órdenes de manera  despectiva.  Cuelga,  abre  su  computadora,  escribe  algo  rápido.  La  sobrecargo le pide que apague su equipo electrónico y mi compañera de  asiento lo hace con molestia.  Al llegar a la altura debida para utilizar equipo de cómputo, abre su  laptop,  escribe,  escribe  y  escribe  con  muchos  movimientos  bruscos  y  constantes como si no aguantara la comezón en cierta parte. Al aterrizar,  lo primero que hace es encender los dos teléfonos y simultáneamente  habla y contesta mensajes de manera acelerada.  ¿Estará  ella  en  la  categoría  de  adictos  al  trabajo?  ¿Disfrutará  su  empleo? ¿Esa vida es la que deseo con los años que me quedan? Claro  que  también  tengo  mucho  trabajo,  pero  procuro  no  agobiarme  de  esa  forma.  Mi molestia disminuyó al recordar que el vuelo es de sólo una hora  con 15 minutos. Traigo desde hace días una frase que me repito cuando se  trata de aguantar infortunios: “El viaje es corto...”  La tomé de una reflexión que me gustó y desconozco al autor pero te  la comparto:  Una  joven  mujer  se  subió  a  un  autobús  y  tomó  su  asiento,  en  la  siguiente parada, una anciana fuerte y gruñona subió y se sentó junto a  ella apretándose en el asiento mientras la golpeaba con sus numerosas  bolsas.  Al ver que la joven se mantuvo en silencio y sin protestar se molestó,  le preguntó por qué no se quejó cuando la golpeó con sus bolsas.  La joven respondió con una sonrisa: “No es necesario ser grosera o  discutir sobre algo tan insignificante, el viaje juntos es tan corto. Bajaré \nen la próxima parada.”  Esta respuesta —dice el autor— merece ser escrita en letras de oro.  No es necesario discutir sobre algo tan insignificante, nuestro viaje es tan  corto.  Si  comprendiéramos  que  nuestro  tiempo  aquí  es  tan  corto,  que  oscurecerlo  con  peleas,  argumentos  inútiles,  celos,  no  perdonar  a  los  demás... no tiene sentido, entenderíamos también que el descontento y la  actitud de averiguación constante es una ridícula pérdida de tiempo y  energía.  ¿Alguien rompió tu corazón? Tranquilízate, el viaje es muy corto.  ¿Alguien  te  traicionó,  intimidó,  engañó  o  humilló?  Tranquilízate,  perdona, el viaje es muy corto.  ¿Alguien te insultó sin razón? Tranquilízate, ignora, el viaje es muy  corto.  Cualesquiera  que  sean  los  problemas  que  alguien  nos  traiga,  recordemos que nuestro viaje juntos es corto. Nadie sabe la duración de  este viaje. Nadie sabe cuándo llegará a su destino. Nuestro viaje juntos es  muy corto.  Vamos a apreciar a amigos y familiares. Seamos respetuosos, amables  y perdonémonos el uno al otro. Vivamos llenos de gratitud y alegría.  Después de todo, ¡nuestro viaje juntos es muy corto!  Gran  parte  del  estrés  que  existe  laboralmente  no  se  debe  sólo  al  trabajo en sí, sino con quién trabajas; la gente se estresa, y más cuando  viven a un ritmo diferente al tuyo o al que el mismo trabajo exige.  No  creo  estar  en  la  categoría  de    workaholics   o  adictos  al  trabajo  porque no siento ningún remordimiento en los periodos que no trabajo,  aunque sí considero que constantemente estoy buscando nuevas cosas por  hacer.  Me sometí a las investigaciones que a continuación te comparto y  llegué a mis propias conclusiones. Lo mismo te pido por si acaso crees  que el exceso de trabajo está causando estragos en tu nivel de felicidad.  El ABC de la rehabilitación para  workaholics  Los japoneses trabajan tanto que hasta han creado la palabra  karoshi,  que  significa “muerte por sobrecarga de trabajo”. En este país oriental, donde  los turnos se pueden extender a 15 horas, se estiman cifras de hasta 10 \n000 muertes al año relacionadas con este fenómeno.  También tienen en su vocabulario  inemuri,  un término que comunica  una característica muy particular de su cultura: dormir en público, incluso  en  el  trabajo,  no  es  mal  visto;  al  contrario,  transmite  un  sentido  de  cumplir con el deber, estar presente... aunque dormido.  Cuando  en  nuestra  sociedad  una  siesta  podría  derivar  en  una  amonestación  del  jefe,  el    inemuri   es  común  en  muchas  empresas  japonesas. Tampoco tienen mucha alternativa: Japón es el país que menos  duerme en noches de jornada laboral —apenas seis horas y 22 minutos en  promedio.  ¿Te parece un caso muy extremo y lejano? En realidad, los informes  de la OCDE revelan que México es el país que más horas trabaja (2246 al  año), seguido de cerca por otras naciones latinoamericanas como Costa  Rica y Chile. Según datos de la UNAM, 85% de las empresas mexicanas  premia los comportamientos relacionados con la adicción laboral y 35%  de  los  profesionales  del  país  la  padece;  65%  de  los  empleados  tiene  turnos de entre 10 y 12 horas al día.  Así que no sólo en el lejano Oriente confunden el deber con el exceso.  Vivimos de cerca el fenómeno en nuestro continente, y le puede pasar a  cualquiera, sin distinción de edad, cultura, sexo o nacionalidad.  ¿Es realmente una adicción?  Empecemos  con  una  definición  simple:  somos    workaholics   cuando  el  trabajo interfiere con nuestra vida personal. Aunque esta acepción lleva  implícitos comportamientos anormales y con mucho potencial negativo,  los expertos aún se debaten si se debe conceptualizar como una adicción.  Lo  cierto  es  que  el  “workaholismo”  genera  vaivenes  emocionales  similares a los de cualquier otra adicción que sí ha sido catalogada como  tal: una euforia hormonal que recompensa al inicio pero que a la larga  castiga con sentimientos de estrés, remordimiento y ansiedad.  La discusión se complica más porque el trabajo suele asociarse con la  virtud. Incluso, algunos se atreven a llamarla una “adicción positiva”. Por  algo el psicólogo Bryan Robinson lo define de esta manera: “La adicción  al trabajo quizá sea el problema de salud mental con mejor disfraz.” Es un  problema que pasa de largo frente a nuestros ojos y lo hace con mucho  disimulo, ¡aguas! \nPero por más que la gente pase por alto esta adicción, el hecho de que  se lleve de maravilla con otras afecciones mentales es revelador. En un  estudio de las universidades de Nottingham Trent y Yale, investigadores  compararon  a  los    workaholics   con  los  trabajadores  sin  adicción  para  averiguar qué tantos síntomas de desórdenes psiquiátricos tenía cada uno.  El  porcentaje  de  adictos  al  trabajo  que  cumplía  con  el  perfil  de  los  siguientes desórdenes era casi tres veces mayor que el de los no adictos:  —  32.7% con síntomas de déficit de atención e hiperactividad  —  25.6% con síntomas de comportamiento obsesivo-compulsivo  —  33.8% con síntomas de ansiedad  —  8.9% con síntomas de depresión  Las manifestaciones del  workaholismo  también hacen mella en todas las  facetas de nuestra vida. En lo social, se roba el tiempo que deberíamos  apartar para nuestra familia y amigos. En lo laboral, genera antagonismos  con los compañeros. En lo físico, la carga de estrés y el sedentarismo nos  perjudica y nos hace más propensos a morir de forma prematura.  Para acabar pronto, una investigación de la Universidad de Bergen en  Noruega tomó estudios sobre el tema en todo el mundo y concluyó que la  adicción se asocia con menores niveles de satisfacción laboral, bienestar  psicológico, felicidad y percepción de la salud.  Las  consecuencias  de  este  mal  hábito  no  le  piden  nada  a  las  de  cualquier adicción reconocida por las ciencias de la psicología. Si ésta no  lo es, se asemeja tanto que incluso existe el programa “Workahólicos  Anónimos”, creado en 1983 y con grupos de ayuda en todo el mundo.  Ocupación vs preocupación  Malissa Clark, de la Universidad de Georgia, condujo un estudio para  examinar el fenómeno psicológico detrás de la adicción al trabajo. Los  resultados muestran que ser  workaholic  no está relacionado con un mejor  desempeño del empleado pero sí con el estrés, el conflicto en el entorno  laboral, la mala salud física y el síndrome de  burnout.  Un pequeño paréntesis: el síndrome de  burnout  —también llamado  síndrome  de  desgaste  ocupacional  o  síndrome  del  quemado—  es  la  aparición de síntomas como agotamiento, desmotivación y frustración a \ncausa del estrés acumulado por las extensas e intensas horas de trabajo.  El punto es que en el trabajo solemos caer en el juego de las ilusiones,  cuando la realidad habla otra lengua. Nos dice que la cantidad no es  sinónimo  de  calidad.  No  por  partirnos  el  lomo  por  12  horas  al  día  haremos un mejor trabajo. Como ni el cuerpo ni el cerebro gozan recursos  infinitos, la compulsión laboral parece dar resultados al inicio pero en la  carrera  larga  nos  desgasta  y  afecta  justo  lo  que  quiere  fomentar:  la  productividad.  Es  como  si  devaluáramos  nuestro  desempeño  y  entregáramos mucho menos rendimiento por cada hora trabajada.  Además,  la  realidad  no  siempre  coincide  con  nuestro  mundo  imaginario, nuestros sentimientos, que con frecuencia nos dan informes  un tanto disparatados:  —  Fantasía:   nos  estresamos  porque  nos  importa  nuestro  trabajo,  coleccionamos  horas  de  trabajo  como  estampitas  porque  somos  productivos,  somos  obsesivos  y  perfeccionistas  para  brindar  un  servicio o producto de excelente calidad.  — Realidad:  el estrés nos consume y nos distrae, la cantidad de horas  diluye nuestro esfuerzo y nos merma, el perfeccionismo extremo nos  paraliza.  — Resultado:  sin garantías para la productividad de la empresa en el  mundo  real;  con  mucha  productividad,  pero  en  nuestro  sistema  nervioso, con un ejército de alteraciones y manías.  Aquí  debemos  tomar  una  postura  racional.  En  este  contexto,  la  racionalidad  significa  alinear  los  medios  con  los  fines.  Las  empresas  esperan  resultados  concretos  de  nosotros,  porque  éstas  operan  en  el  mundo  de  la  acción.  Si  traemos  los  sentimientos  negativos  —estrés,  ansiedad,  culpa—  a  flor  de  piel,  lo  más  probable  es  que  estemos  desperdiciando  gran  parte  de  nuestra  energía  en  nuestras  reacciones,  energía que debería canalizarse en beneficio del proyecto. ¿Qué es lo más  racional  si  queremos  ser  productivos  y  conservar  nuestro  empleo?,  ¿acción o reacción?, ¿ocupación o preocupación?  Pero eso no es todo. El  cómo  de la ocupación también importa. Una  cosa  es  identificar  que  estamos  reaccionando  negativamente  y  otra  es  tomar las acciones específicas para detener la hemorragia. Provoquemos \nel cambio reflexionando: las empresas nos necesitan productivos todo el  año,  ¿es  racional  quemarnos  el  fusible  la  primera  semana?  También  requieren  entregar  en  tiempo  y  forma  sus  productos  o  servicios,  ¿es  racional  quedarnos  en  la  parálisis  por  análisis  del  perfeccionismo  obsesivo?  EN RESUMEN, LOS SENTIMIENTOS NEGATIVOS SON  NUBARRONES PARA EL BUEN JUICIO. EN CAMBIO, BUSCAR  Y APRECIAR LA VERDAD CREA LAS CONDICIONES PARA  DESPEJAR LA MENTE.  Pero ¿por qué trabajamos en primer lugar?  Más allá de los imperativos del mundo laboral, antes que nada debemos  alinear nuestras acciones con nuestros propios objetivos y necesidades. Si  damos un paso atrás, nos daremos cuenta de que el trabajo es un medio,  no un fin. El ruido de la sobreocupación nos ensordece para escuchar la  verdad:  nuestros  deseos  más  profundos  son  los  de  alcanzar  bienestar,  propósito y felicidad. El trabajo debe estar al servicio de ellos y no al  revés.  Volvamos  al  estudio  de  la  investigadora  Malissa  Clark,  quien  descubrió  algo  que  viene  bien  al  tema:  el    workaholic   y  el  empleado  comprometido sin adicción extraen la motivación para laborar de fuentes  distintas. El diagnóstico: el adicto lo sufre y el empleado comprometido  lo goza. Mientras que al primero lo impulsa la compulsión y la culpa, el  segundo quiere hacerlo simplemente porque lo disfruta.  Si  me  permites  la  redundancia,  vamos  a  cuestionarnos:  ¿Cómo  ponemos al trabajo a trabajar por nuestra felicidad?  —   Disfrutando  lo  que  hacemos:  éste  debe  ser  el  termómetro  para  diferenciar entre compromiso y adicción. Si el estrés toma el lugar  del gusto cuando trabajas y si la culpa usurpa la tranquilidad en tu  tiempo libre, es momento de reevaluar la situación.  —   Verlo  como  un  medio  para  llegar  al  fin:  recuerda,  se  trata  de  trabajar para vivir. Hay mucha vida después del trabajo y de ella  extraemos,  de  hecho,  la  mayor  parte  de  nuestro  bienestar,  como  comprobaremos en este libro. \nLa extensión que llevamos en el bolsillo  “Henry Franceschini tomó sus primeras vacaciones en cuatro años, pero  el gerente de ventas de 48 años pronto descubrió que no había suficiente  señal de celular en Destin, Florida. Así que gastó mucho de su tiempo  manejando en busca de ella”, narra una crónica del  Wall Street Journal.  Y continúa: “En total, el señor Franceschini probablemente trabajó  cerca de cuatro horas por día. Le decía a su familia que usaba el internet  para buscar buenos restaurantes para la cena, pero en realidad contestaba  su  correo  electrónico.  Aseguraba  que  iba  al  baño,  pero  llamaba  a  su  oficina. Avisaba que iba a la tienda, pero trabajaba con su teléfono.”  Esto sucedió en 2004, cuando los Blackberry apenas tomaban vuelo.  Ahora,  en  la  época  dorada  de  los  dispositivos  móviles  y  las    apps,   la  agonía del  workaholic  se ha alargado.  A propósito, el  Harvard Business Review  hace referencia al “Project:  Time Off”, un estudio que entrevistó a trabajadores de distintas edades y  que desmintió aquella idea de que los  millennials  —los nacidos entre los  ochenta y los noventa— no trabajan mucho. Del total de la encuesta,  estos  jóvenes  conformaban  43%,  la  mayoría  de  los  participantes  que  declaraban ser mártires laborales. El martirio en este contexto significa  cumplir  con  cuatro  características:  creerse  imprescindibles,  intentar  demostrar su completa dedicación a la compañía, no querer ser percibidos  como  elementos  reemplazables  y  sentir  culpa  por  tomar  vacaciones  pagadas.  ¿Las razones? Varias, pero Katie Denis, directora del proyecto, apunta  que  una  muy  importante  es  justo  la  distinción  principal  de  esta  generación: ser nativos digitales; es decir, haber nacido y crecido junto a  internet y los dispositivos móviles. “Es la primera generación totalmente  conectada. Desde el día que entran a la fuerza laboral han tenido correo  electrónico. Nunca se han ido de un lugar físico y dicho  OK, ya tuve  suficiente por hoy. ”  Si de por sí muchos somos presos del celular, el factor trabajo puede  crear  un  puente  entre  dos  adicciones.  Esto  provoca  que  revisemos  el  correo de la empresa casi por reflejo, ya no digamos por gusto. \nComo  sociedad,  nos  debemos  momentos  de  quietud  y  silencio.  Deberíamos recuperar —pero de verdad, de verdad— la creencia de que  trabajar en el  sabbat  es pecado y enmendar las escrituras modernas para  que digan “ah, y tampoco puedes checar tu celular”. Para ser productivos  entre semana, necesitamos que el fin de semana sea nuestro receso digital;  para ser efectivos en el año, debemos respetar nuestras vacaciones a nivel  de retiro religioso y prohibir el uso de teléfonos móviles como por voto  espiritual.  ¿Cómo sé si soy adicto?  La  ciencia  también  ha  concebido  instrumentos  para  determinar de qué lado estamos de la raya que divide la  sana  productividad  y  la  adicción.  Investigadores  escandinavos crearon en 2012 la Escala de Adicción al  Trabajo  Bergen,  la  cual  dispone  de  siete  criterios  básicos para realizar la medición:  1   ¿Piensas  en  cómo  conseguir  más  tiempo  para  trabajar?  2   ¿Pasas  mucho  más  tiempo  de  lo  previsto  en  el  trabajo?  3   ¿Trabajas  a  fin  de  aliviar  sentimientos  de  culpa,  ansiedad, impotencia y depresión?  4  ¿Te han aconsejado reducir tu jornada laboral y no  has hecho caso?  5  ¿Te estresas si te prohíben trabajar?  6  ¿Das menor prioridad a pasatiempos, al ocio y al \nejercicio físico por atender tus labores?  7  ¿Tu carga de trabajo ha influido negativamente en  tu salud?  Para  cada  una  de  las  preguntas  esta  es  la  gama  de  posibles  respuestas:  (1)  nunca,  (2)  rara  vez,  (3)  ocasionalmente, (4) a menudo y (5) siempre. Según el  estudio, si respondes “a menudo” o “siempre” en cuatro  o más de las siete preguntas, es posible que padezcas  adicción al trabajo, así que ¡aguas!  Lo prometido es deuda. Esta es la versión condensada de mis consejos, el  ABC de la rehabilitación para  workaholics:  A   No trabajes por trabajar  —  Privilegia la calidad y no la cantidad: no te desvíes, concéntrate en  tus deberes. Ser productivo es entregar el producto o servicio que  demanda tu cliente o empleador, no las horas que le destines.  —   Evita  el  perfeccionismo:  obsesionarte  con  cada  detalle  sólo  retrasará tus tiempos de entrega.  —  Piensa a largo plazo: un empleo es de carrera larga; no te quemes  acelerando como si fuera la carrera de 100 metros planos.  B   Pon el trabajo al servicio de tu felicidad  —  Enfócate en disfrutar y no sufrir tu trabajo: la preocupación y el  estrés sólo entorpecen tu desempeño, pero no aportan valor.  —   Recita  este  mantra:  “El  trabajo  es  acción  positiva  (ocuparse  felizmente en ser productivos) y no reacción negativa (preocuparse y \nser infelices por temor a no serlo lo suficiente).”  —  Recuerda: el trabajo es sólo un soporte para fines más importantes  como tus seres queridos, realización espiritual y hábitos saludables.  C   Pinta la raya entre jornada laboral y tiempo libre  —  Sacraliza tus días de descanso: defiéndelos como si fuera el último  bastión de tu libertad.  —  No sientas culpa: los recesos laborales son tuyos por ley, no son  motivo de deuda.  —  Apaga los aparatos: al menos los que te tienten a reconectarte con  ese  yo  oficinista.  Contraer el mal del  workaholismo  conlleva una consecuencia dramática:  ofrecerse como voluntario a la esclavitud. Y no hablo sólo de la que  ejerce un empleador, sino de la que autoinfligimos con nuestros miedos y  ansiedades.  SI LA ESCLAVITUD YA FUE ABOLIDA EN NUESTRO MUNDO,  ¿QUÉ TE FALTA PARA LIBRARTE DE TUS PROPIOS  GRILLETES Y CADENAS? \nA todo se acostumbra uno menos a trabajar”, sentencia uno  de los obreros entrevistados en el documental  En el hoyo,  que  sigue la vida de varios trabajadores en una construcción en la  Ciudad de México.  Estoy seguro que a tí, al igual que a mí, te asombra la gente que  trabaja solamente por ganar un salario y no por gusto. ¿Te has preguntado  cuántos  trabajan  verdaderamente  por  gusto  además  de  obtener  un  ingreso?  ¿Cuántas  personas  habrá  que  expresan  que  su  trabajo  es  un  verdadero suplicio?  Alfonso es un conocido que un día me manifestó el gran repudio que  siente por su trabajo.  —En la escuela —me dijo—, nunca nos mencionan que todo lo que  aprendemos ahí casi no se aplica a la hora de trabajar en algo que a final  de cuentas ni te gusta. César, si por mi fuera, y si pudiera, trabajaría en  otra cosa que verdaderamente me agrade.  —¿Y por qué no lo haces? —pregunté.  —¿Cómo  que  por  qué?  Porque  no  puedo  dejar  la  antigüedad  que  tengo aquí. Llevo 20 años y me falta menos para jubilarme, sólo me faltan \n20 años más.  —¡20 años más! ¿20 años haciendo algo que no toleras, o que es  prácticamente insoportable? ¿No se te hace un precio muy alto?  —Pues sí, pero qué le hacemos.  Me pregunto ¿cuántos más vivirán esto? Muy típico en instituciones  públicas como el Seguro Social, el magisterio o en empresas reconocidas  con muy buenas prestaciones y que tienen la fama de que al jubilarse, te  dan  la  gran  oportunidad  de  recibir  el  salario  que  tienes  hasta  que  te  mueras.  Recordé a una prima que quiero mucho. Su madre fue maestra y en  tiempos pasados (desconozco si también actualmente) se acostumbraba  “heredar la plaza” o tener muchas más posibilidades de ser aceptada en  escuelas primarias y secundarias, si tenías un familiar directo.  Mi prima me dijo que no soporta a los niños, con excepción de los que  en un futuro tendría y por cierto, ya los tiene.  Hace  años  me  comentaba  que  entraría  a  la  escuela  normal  para  formación de profesores porque su madre le ayudaría a tener su propia  plaza. “¡Pero si no te gustan los niños!” —exclamé con gran seguridad  por la buena memoria que aún tengo, recordando sus propias palabras.  “Sí, pero ¿qué hago? Es un trabajo que no puedo rechazar.”  Han  pasado  los  años  y  mi  prima  sigue  trabajando  en  la  escuela  quejándose amargamente de su trabajo, de los “escuincles” que la tienen  harta, de las condiciones paupérrimas de la escuela “que le tocó” y que  desde hace más de 23 años no ha podido cambiarse. “Pero, ¿sabes qué?  —me dijo—, ya falta menos para jubilarme.”  El trabajo difícilmente figura en nuestro top de cosas favoritas. Según  un estudio de la firma Gallup, sólo 13% de los empleados a nivel mundial  se siente comprometido con su trabajo. En México es peor. El país figura  al  fondo  de  la  tabla  en  América  Latina,  con  un  escaso  12%  de  satisfacción, lo que contrasta con el 60% que se siente desapegado y el  28% que confesó, de plano, que repudia sus labores. O sea, en México,  88% de la gente trabaja en lo que no le gusta.  ¿Has sabido de gente que se deprime los lunes? O peor, desde el  domingo en la noche. Como un hermano, que hace varios años me dijo  muy serio: “César, ¿qué me tomo para calmar los nervios que siento todos  los  domingos  después  del  mediodía?  Me  pongo  tenso,  taquicárdico  pensando en que ya llegó el lunes.” \nProbablemente son más de los que tú y yo creemos quienes viven ese  suplicio de los domingos por la tarde o los lunes.  ¿Has escuchado a alguien exclamar gustoso: “¡Por fin es lunes!”? Me  atrevería a apostar que no. Lo cierto es que este día nos pesa tanto que  nos  apachurra  el  corazón...  literalmente.  Investigadores  holandeses  descubrieron que, de los 1828 casos de muerte súbita por causas cardiacas  que registraron en su estudio, encontraron un patrón: el riesgo de sufrir  uno de estos ataques mortales en lunes es sustancialmente mayor que en  otros días, sobre todo en pacientes no hospitalizados. En el artículo se cita  que  una  de  las  posibles  explicaciones  de  este  pico  es  el  estrés  de  comenzar una nueva semana laboral, ¡qué tal!  De antemano sabemos que la del trabajo no es una búsqueda de la  tierra  prometida.  Es  normal  que  le  pongamos  uno  que  otro  “pero”  a  cualquier empleo, pero sí podemos decidir sabiamente antes y durante  nuestra  estancia  laboral  para  bajarle  a  los  nervios  y  subirle  a  la  productividad y al gusto.  Encontrar nuestro lugar  Según  la  Organización  Mundial  de  la  Salud,  el  tipo  de  trabajo  que  produce más estrés es aquel en que las exigencias y presiones superan los  conocimientos y capacidades del trabajador.  El estrés laboral es una amenaza mayor de la que aparenta. Llega con  primos hermanos como la angustia, la irritación y la desconcentración.  Nos roba la tranquilidad hasta el punto del insomnio, las cardiopatías, los  trastornos digestivos y la alta presión arterial. Puede ser no sólo causa de  despido sino también de muerte.  Si  queremos  prevenir  una  vida  laboral  libre  de  estrés  debemos  considerar un mínimo de garantías:  —  Buscar y enviar solicitudes de empleo para vacantes que coincidan  con tu perfil y tu formación profesional.  —  Solicitar que te aclaren los objetivos y la visión de la empresa en  general y el departamento en particular.  —   Tener  presentes  las  prioridades  de  tu  puesto  y  exigir  que  se  respeten.  —  Concientizar a tus superiores sobre las horas reales de trabajo que \ntoma cada proyecto.  —  Demandar que te traten de forma justa y asignen cargas similares a  las de tus compañeros de área.  Otra variable importante para cuadrar la expectativa con la realidad es el  ambiente del lugar de trabajo. Y, para esto, no confundir el trato con  nuestros jefes, una cosa es la autoridad y otra muy distinta el abuso de  poder; entre compañeros, la competencia no tiene nada que ver con la  grilla malintencionada; además, el chascarrillo aislado e inofensivo es una  especie  distinta  al  insulto  cizañoso.  Pese  a  que  esto  parece  tema  de  sentido de común, no es raro hallarse viciado en ambientes en que estos  comportamientos se confunden y se pasan por alto.  Recordé  al  director  general  de  una  importante  empresa  de  supermercados a nivel nacional en mi querido México, que me expresaba  su enorme preocupación por la gran rotación de personal que tenía. Me  dijo: “Dales un curso de tres horas bien ¡chin...! o sea, ¡a toda madre!  para que se pongan la camiseta y no se vayan a otro lado. Se van por el  mismo salario y a veces ¡hasta por menos!”  Al preguntarle si aplicaban encuesta de salida, me dijo que sí, y que la  mayoría decían que se iban porque sus supervisores y responsables de  departamento los trataban mal. ¿Qué?  “El curso chin... lo necesitan tú y todos los encargados de área”, le  dije. Comentario que por cierto no le cayó muy en gracia y se lo pasó  por... después les digo por dónde.  Esos supermercados digamos que no se caracterizan por una eficiente  atención al cliente, sino por la presencia de empleados mal encarados,  fastidiados y sin motivación.  En cajas, al momento de pagar te preguntan en forma automatizada:  “¿Encontró  todo  lo  que  buscaba?”  Acostumbrados  a  una  respuesta  también  automatizada  por  parte  del  cliente,  que  generalmente  es  un  simple “sí”. Un día, para poner a prueba sus ganas de servir, les contesté  que no. La verdad no encontré todo lo que buscaba. La cajera —con  chicle  en  boca—  se  me  quedó  viendo  y  me  contestó  con  un  sonido  raquítico  y  sin  ganas:  “Ah...”  y  siguió  cobrando.  O  sea,  ¿para  qué  preguntan algo a lo que no darán seguimiento?  Christine  Porath,  de  la  Universidad  de  Georgetown,  ha  estudiado \ndurante 15 años el impacto que tiene la falta de civismo entre los colegas  de oficina. Además de notar un aumento de las hostilidades en los lugares  de  trabajo  en  los  últimos  años,  también  ha  comprobado  los  efectos  negativos que estas ocasionan. De aquellos trabajadores que son objeto de  maltrato,  47%  disminuye  su  tiempo  efectivo  en  el  trabajo,  66%  se  esfuerza  menos,  78%  asegura  haber  bajado  su  compromiso  con  la  organización y una inmensa mayoría, cercana a 90%, encuentra maneras  de vengarse de sus agresores y de la organización en general.  Otros experimentos realizados por Amir Erez de la Universidad de  Florida revelaron que los ambientes tóxicos producen entre los empleados  reducciones de 30% en su creatividad y 25% en su desempeño cognitivo.  Así que lo ideal es ingresar a un lugar que privilegie la cooperación y  el trabajo en equipo por encima de la competencia y el autoritarismo.  Siempre será mucho más armónico desenvolvernos en un lugar donde  todos seamos iguales y abunde la empatía y la compasión.  SI DE PLANO NO SE CUMPLEN LAS CONDICIONES MÁS  ELEMENTALES DE TRATO DIGNO Y RAZONABLE, TODO LO  QUE MENCIONEMOS A CONTINUACIÓN SERÁ INÚTIL. CON  UN AMBIENTE DENSO Y ENRARECIDO, NO EXISTE  SIQUIERA RANGO DE MANIOBRA PARA ESTAR AL MENOS  TRANQUILOS DONDE ESTAMOS Y CON LO QUE TENEMOS.  Una cosa a la vez  Otro falso súper poder que nos adjudicamos sin saber el lío psicológico  en el que nos mete es el  multitasking:  hacer varias cosas a la vez. Tener  todo en el celular muchas veces significa no tener mucho en el cerebro, o  dicho de otra manera, “el que mucho abarca, poco aprieta”.  Glenn  Wilson,  profesor  de  psicología  en  el  Gresham  College  de  Londres, bautizó al fenómeno como “infomanía” e hizo un experimento  en el que ordenó a los participantes concentrarse en una tarea mientras  sabían  que  tenían  un  correo  electrónico  no  leído  en  su  bandeja.  Pues  resulta que, en el intento, sufrieron consecuencias tan descabelladas como  disminuir  10  puntos  su  coeficiente  intelectual  y  fallas  de  memoria  similares a las producidas por fumar marihuana.  Según el autor y profesor de la Universidad de McGill en Montreal, \nDaniel  Levitin,  realizar  varias  tareas  simultáneamente  no  sólo  afecta  nuestro desempeño cognitivo, también activa hormonas como el cortisol  y  la  adrenalina  que  nos  estresan  y  sobre  estimulan,  sin  olvidar  la  dopamina, que nos recompensa por las razones equivocadas y, por tanto,  nos hace adictos a la distracción.  También  existe  el    multitasking   puramente  mental.  Todos  hemos  notado alguna vez la enfermiza tendencia de nuestro cerebro a malabarear  pendientes,  generar  caóticamente  ideas  y  tratar  de  recordarlo  todo.  Menuda tarea, ¿no?  A  principios  de  siglo,  David  Allen  atendió  este  problema  cuando  desarrolló una de las metodologías de productividad más reconocidas:  Getting things done,  titulada en español:  Organízate con eficacia.  Este  método  parte  de  la  premisa  de  que  nuestro  cerebro  es  excelente  para  resolver  problemas,  pero  pésimo  para  almacenarlos  y  recordarlos.  La  memoria es un mecanismo que demanda muchos recursos y enturbia el  resto de los procesos mentales. Así que uno de sus principios básicos es  tan simple que provoca que subestimemos su poderío: elaborar una lista  de tareas para luego cumplirlas una por una.  Las ideas de  Getting things done  cobraron tanto auge que la ciencia  comenzó a echarle  un vistazo. Tal  es el caso  de investigadores de  la  Universidad Libre de Bruselas, en Bélgica, que detallan en su estudio  cómo  esta  metodología  es  efectiva  porque  le  descarga  peso  a  nuestra  memoria y razonamiento al vaciar sus contenidos a mejores métodos de  almacenamiento  como  los  de  una  computadora  o  una  simple  hoja  de  papel.  Nuestro cerebro es como cualquier computadora. Cuando la memoria  y el procesamiento se consumen al punto de la lentitud y la inhibición,  vienen los corajes: “¡¿Por qué se atora esta mugre?!”, sin reparar que fue  nuestra  culpa  por  haberla  atiborrado  de  procesos,  con  decenas  de  programas  abiertos.  Recuerda  que  aquí,  para  hacer  más  a  la  larga,  debemos hacer menos a cada paso. \nPara todo hay un tiempo, incluido el correo  Esta  es  la  queja  eterna  del  Godínez:  mucho  que  hacer,  poco  tiempo.  Obviamente  la  culpa  debe  ser  de  alguien  más  y  entonces,  en  vez  de  exprimir  el  jugo  de  cada  minuto,  ¿qué  terminamos  haciendo?  ¡Lo  contrario, por supuesto! Con la queja buscamos colgarle el muertito a  alguien más y con la procrastinación, o sea dejar las cosas para después.  Bueno, pues lo termina cargando nuestro yo del futuro.  La  mayoría  de  las  ocasiones,  el  problema  se  resuelve  con  mera  administración del tiempo. En vez de llamar al clásico “este es problema  de otro”, debemos ser pragmáticos.  Otro gran cambio del siglo XXI es que anteriormente se veía leyendo  o platicando a los pacientes en las salas de espera de los médicos, paradas  de camión o en la fila para entrar a cierto evento. Ahora como un hábito  que se ha contagiado de manera acelerada, cuando tenemos que esperar,  lo primero que hacemos es ver el celular. Mensajes pendientes por leer,  mensajes ya leídos (para acordarme de cosas buenas que me han dicho),  Facebook, Instagram y cuanta aplicación tengamos a la mano para ver  qué novedades encuentro.  Hoy te quiero preguntar: ¿Cuántas veces al día acostumbras a revisar  el contenido de tu celular? Difícil respuesta para muchos, incluyéndome a  mí.  Recordaré a un amigo que por obvias razones omito su nombre.  Él evita que su celular vibre o emita cualquier señal al recibir un  mensaje.  Incluso  quitó  la  forma  que  existe  para  ver  con  pantalla  bloqueada los mensajes que puedes tener pendientes por leer.  Para ver si hay o no mensajes, él tiene que poner su clave o su huella  digital y abrir la aplicación. Al preguntarle ¿por qué lo hizo? Me dijo que  no le gusta que nadie vea quién le envía mensajes y mucho menos que se \nalcance a ver parte del contenido. ¡Zas!  Entonces él revisa su celular, aplicando su clave o su huella, cada 10 o  15 minutos para ver si hay algún mensaje importante. Me pregunto si eso  puede causar algún tipo de estrés y he aquí la respuesta: investigadores de  la Universidad de British Columbia, en Canadá, se propusieron medir los  efectos de revisar el correo electrónico en los niveles de productividad y  estrés de las personas.  El estudio siguió a 124 adultos de distintas edades y profesiones, a  quienes les pidieron abrir sus cuentas de email sólo tres veces por día  durante una semana. A otro grupo le solicitaron que lo hicieran la mayor  cantidad de veces posible. Siete días después, revirtieron las instrucciones  de ambos grupos y les aplicaron encuestas para sondear su estado de  ánimo.  El resultado fue una paradoja que más o menos esperaríamos: la gente  batalló para soportar las ganas de revisar sus mensajes con frecuencia, sin  embargo,  entre  menos  lo  hacían,  menor  nivel  de  estrés  reportaban.  Estudios similares han arrojado información suficiente para afirmar que  quienes  revisan  frecuentemente  su  celular  para  verificar  si  hay  o  no  mensajes, manifiestan un mayor nivel de ansiedad y estrés.  La recomendación de los científicos es designar dos o tres periodos  fijos  de  revisión  de  correos  durante  el  día,  en  vez  de  hacerlo  constantemente  sin  ningún  orden.  De  esa  manera  dedicamos  nuestra  atención a tareas mucho más importantes y no lo invertimos en comernos  las  uñas  por  la  anticipación  de  un  nuevo  mensaje  en  la  bandeja  de  entrada.  Remar a favor de la corriente  Quizá  alguna  vez  has  entrado  en  un  trance  en  el  que  el  trabajo  y  tú  parecen uno mismo. Tras horas de trabajo, te descubres absorto, mirando  el reloj y preguntándote por qué el tiempo tenía tanta prisa como para  haber corrido así tan rápido. Y la extrañeza no es por malestar; más bien  por un sentimiento plácido de sorpresa tras haber sido tan productivo sin  sufrir los daños colaterales del estrés.  A esto se le llama estado de “flujo” o  flow,  descubierto y nombrado  por el psicólogo Mihály Csíkszentmihályi. Estar en “flujo” es ponerse en  sintonía con una tarea, sentir que estamos en completo control de ella, \nrealizarla sin grandes esfuerzos y elevar nuestro desempeño al máximo de  nuestras capacidades.  El afamado psicólogo y autor Daniel Goleman tiene un interés muy  especial en el tema y en uno de sus artículos recomienda tres acciones  para ayudarnos a precipitar el estado de “flujo”: enfrentar retos acordes a  nuestras habilidades, alinear lo que nos apasiona con lo que sabemos  hacer y enfocar toda nuestra atención a la tarea que tengamos enfrente.  Esto nos debe inspirar cuestionamientos muy interesantes que además  nos  obligan  a  ser  sinceros:  ¿sabemos  a  ciencia  cierta  cuál  es  nuestra  aportación al mundo?, ¿somos buenos en lo que nos apasiona?, ¿estamos  en un empleo acorde a nuestras pasiones, habilidades y capacidades?  ¡Piénsalo!  Dilo con tu cuerpo  Paulina es una mujer que acostumbra a vestir de manera tan pero tan  casual, que puede considerarse hasta zarrapastrosa.  De complexión robusta, morena, lentes con armazón algo grande y  oscuro, nada de maquillaje, nunca he percibido aroma de perfume en su  cuerpo y para su mayor comodidad sus tenis son fundamentales para su  trabajo como productora de radio y televisión.  No es una mujer fea, porque no hay mujeres feas, digamos que hay  mujeres “graciositas”. Paulina es graciosita. La conozco desde hace más  de 20 años en mis inicios en la televisión y al verla siempre me dio la  imagen de que venía directamente de la cama al trabajo, como recién  levantada  y  con  tanto  trabajo  que  no  tiene  tiempo  de  arreglarse.  Sin  embargo  es  su  forma  de  ser,  no  le  gusta  maquillarse  ni  dejar  por  un  momento sus indispensables y desgastados jeans y sus viejos tenis.  En los tres empleos que ha tenido, expresa con su respectiva cara de  dolor lo poco valorado que es su trabajo, las múltiples horas que trabaja y  lo bien que le va a otras compañeras que no tienen ni la mitad de la  capacidad que ella tiene.  Me pregunto si su historia sería diferente si le dedicara un poco más  de tiempo a su apariencia personal. Si sus superiores la considerarían más  a la hora de una promoción de puesto o aumento de salario si su imagen  fuera distinta.  Recordé en mis tiempos de estudiante de medicina a un compañero \ncon características similares; desaliñado, descuidado, su imagen distaba  mucho  de  ser  la  persona  esperada  por  los  pacientes  que  atendíamos.  Cabello descuidado, barba mal delineada y la bata era gris, como si algún  día hubiera sido blanca y siempre arrugada. Las apariencias engañan, ya  que era uno de los estudiantes más brillantes de mi generación, en serio.  Uno de los profesores más estrictos que tuve en 5 años, insistía en la  importancia de la apariencia para el éxito profesional. Impecablemente  vestido, siempre oliendo a loción lavanda, zapatos negros boleados y de  charol, su bata blanca era tan blanca que parecía resplandeciente. Un día  puso una dinámica algo inusual, incluso discriminatoria. Le solicitó a un  grupo de pacientes que eligiera a cuál de los 17 estudiantes para médico  desearía  que  lo  atendiera,  entre  los  que  estaba  el  compañero  que  menciono. Aun siendo el más brillante no fue elegido por ninguno de los  pacientes.  Ni  así  cambió  su  apariencia  ni  su  forma  tan  original  de  vestir  y  desconozco qué ha sido de su vida.  Algunos estudios han comprobado que efectivamente la vestimenta  importa,  no  sólo  en  nuestro  estado  de  ánimo,  sino  en  la  forma  que  pensamos y en la forma como nos tratan. Por supuesto que no tratan igual  a alguien impecablemente vestido que a alguien que no invirtió en un  vestuario impecable acorde a su trabajo. ¿Cómo influye exactamente? No  tiene que ver con la discriminación, sino sobre todo con el significado que  les  atribuimos  y  las  asociaciones  de  poder  que  hemos  creado  a  su  alrededor.  Por ejemplo, en un estudio de la Universidad de Northwestern, se  halló algo muy interesante: solicitaron a algunos participantes a vestir una  bata.  Cuando  les  decían  que  la  prenda  le  pertenecía  a  un  doctor,  su  capacidad  para  prestar  atención  se  incrementaba  de  forma  importante,  pero cuando les afirmaban que era de un pintor no se producía ninguna  mejora.  Esto quiere decir que, conociendo el potencial de este simbolismo  podemos vestirnos a nuestro favor. En otras palabras,  el hábito sí puede  hacer al monje.  Porque esto también se comprobó en un ambiente más de  oficina: un estudio de la Universidad Estatal de California encontró que,  al vestir de traje, los participantes pensaban de forma más global y no tan  focalizada. Tendían a tener pensamientos más abstractos y holísticos, lo  que  facilita  una  perspectiva  más  amplia  y  completa  al  analizar  algún \ntema.  Pero dejemos de lado al sastre. Hay medidas aún más simples y que  dependen de nosotros por completo. Hablo de algo tan básico como el  lenguaje  corporal.  Seguramente  has  notado  las  diferencias  entre  las  posturas de alguien que gana y alguien que pierde. Tras anotar un gol o  cruzar la meta en primer lugar, el impulso es alzar los brazos, levantar el  mentón y saltar de júbilo; en cambio, en la derrota nos lanzamos al suelo,  nos  encogemos  y  retraemos  las  extremidades.  Estas  reacciones  tienen  relación  directa  con  nuestros  niveles  de  confianza  en  determinada  situación. A mayor seguridad y dominio del entorno, más a gusto nos  sentimos con adueñarnos del espacio.  A raíz de sus investigaciones en el tema, Amy Cuddy, investigadora  de la Escuela de Negocios de Harvard, nos pasa un gran dato: también  funciona a la inversa. Sí, la confianza, la autoestima y el éxito provocan  un cambio en la postura, pero también la postura que adoptemos puede  dictar cómo nos sentimos y comportamos.  “Cuando nuestro lenguaje corporal es seguro y abierto, otras personas \nresponden igual, lo que refuerza inconscientemente no sólo su percepción  de  nosotros,  sino  también  nuestra  percepción  de  nosotros  mismos”,  explica Cuddy.  Gracias a nuestra capacidad de empatía, las interacciones con otras  personas  suelen  tener  un  efecto  de  espejo.  Puedes  hacerlo  con  un  experimento muy básico: cuando estés en una discusión acalorada, baja  súbitamente la voz y tus aspavientos; notarás que la otra persona imitará  sin saberlo ese lenguaje corporal casi de inmediato. En este caso, calmarte  los calma y su calma te calma más a ti, ¿me explico?  Volvamos  a  las  posturas  del  triunfo  para  aplicar  la  lección.  La  investigadora  de  Harvard  nos  invita  a  que  observemos  una  sala  de  solicitantes  que  esperan  su  turno  para  una  entrevista  de  trabajo.  Estresados  por  lo  que  está  por  venir,  la  mayoría  adopta  posiciones  encorvadas,  tensas,  retraídas,  ensimismadas.  Esto  no  les  ayudará  para  nada a la hora de exponer con claridad y confianza sus habilidades.  El consejo, para este tipo de situaciones laborales —entrevistas, juntas  o  incluso  al  comienzo  de  cada  jornada—,  son  cinco  minutos  bien  invertidos en lo que te explicaré para marcar una gran diferencia: tómate  este tiempo para extender tu cuerpo lo más que puedas, como si hicieras  el ejercicio de las mariposas, y notarás un cambio en tu actitud muy, muy  útil de cara a tus retos. Durante la hora de la verdad, mantén esta postura  para prolongar el efecto.  ABRIR LOS BRAZOS SIEMPRE CONTAGIA CONFIANZA,  CALIDEZ Y APERTURA A LOS DEMÁS, Y CRUZARLOS LES  COMUNICA INSEGURIDAD, MALA ACTITUD Y CERRAZÓN.  “No te da habilidades que no tienes; te ayuda a compartir las que sí  tienes. No te hace más listo o más informado; te hace más resiliente y  abierto.  No  cambia  la  persona  que  eres;  te  permite  ser  quien  eres”,  concluye la científica.  Este  es  el  resumen:  encuentra  un  ambiente  fértil  para  tu  perfil.  Optimiza  la  forma  en  que  utilizas  tu  tiempo,  tanto  para  que  seas  productivo como para que seas feliz en el proceso. Y procura que tu  trabajo sea una manifestación de tu actitud y tu autenticidad.  Pasamos un tercio de nuestras vidas trabajando. Más nos vale poner \ntodo  de  nuestra  parte  para  hacer  de  nuestras  labores  una  experiencia  placentera. La mejor forma de lograrlo es apropiarnos de él; integrarlo  como parte fundamental de nuestra vida. Porque, a fin de cuentas, no es  algo aparte, es una oportunidad más para abonar a nuestra realización en  general. \ne preguntan frecuentemente cuánto tardo en escribir un libro  y  si  existe  un  lugar  donde  me  inspire  de  tal  forma  que  el  resultado sea mejor.  El tiempo varía, pues el proceso inicia con pensamientos relacionados  con lo que quiero o deseo expresar y sobre todo con las preguntas: ¿De  qué forma quiero tocar la vida de los lectores?, ¿qué mensaje deseo que  quede después de su lectura? Y ¿para quiénes van dirigidos los mensajes  que contiene cada libro?  Cada libro tiene su historia. Por ejemplo,  Por el placer de vivir,  el  libro más leído de todos los que he publicado, casi fue escrito dos veces  por un descuido, no tener un respaldo de todo lo que iba escribiendo y ser  víctima de la delincuencia pues me robaron la computadora donde lo  tenía. Meses de trabajo se esfumaron en unos cuantos minutos por un  cristalazo a la camioneta donde estaba guardada mi laptop con tan valioso  contenido para mí. Ni llorar es bueno y utilizando mis técnicas de  coco  wash,  me dije: “Quiere decir que me va a salir mejor.”  Salas  de  espera  de  aeropuertos,  aviones,  hoteles,  han  sido  lugares  donde escribo. Pero sin duda, donde mejor me inspiro es en una pequeña  finca campestre muy cerca de mi querido Monterrey. El olor a pasto, el \ncanto de pájaros y simplemente observar el verde de tantos árboles me  inspira, me hace más sensible para expresar tantas cosas y me ayuda a  concentrarme mucho mejor.  Desde que estudiaba medicina me daba cuenta de que no era igual  estudiar  en  el  patio  de  mi  casa  con  un  pequeño  jardín  que  en  una  biblioteca. Nunca fue igual estudiar en mi recamara a irme a estudiar a un  rancho de uno de mis compañeros de grupo que esporádicamente nos  invitaba a varios a estudiar en ese lugar rodeado de árboles y con los  sonidos naturales del campo.  Mientras escribo esto, siento el olor de tierra mojada por la lluvia leve  que acaba de caer y el canto de los pájaros, como agradeciendo por tal  bendición.  Estamos  perdiendo  el  contacto  con  la  madre  naturaleza.  Lejos  quedaron aquellos tiempos de rendirle rituales y cultos de gratitud.  Y es que parece que la naturaleza nos incomoda y hacemos lo posible  por sacarle la vuelta. En vez de salir a los parques, compramos bicicletas  estacionarias (que luego, como su nombre lo dice, estacionamos en el  cuarto  de  los  triques  pero  como  tendederos);  los  niños  cambian  la  aventura  al  natural  por  la  realidad  virtual,  y  hasta  toma  auge  un  movimiento en Estados Unidos al que le incomoda comer y consume, en  cambio, licuados que en una sola ración contienen los requerimientos  nutrimentales diarios.  Pero esta migración a lo artificial no queda impune; por el contrario,  tiene un impacto real en nuestro bienestar. Así lo documenta el psicólogo  de la Universidad de Washington, Peter Kahn, quien se ha abocado a  examinar nuestras acciones y reacciones a lo natural y a lo sintético.  Kahn  destaca  dos  experimentos.  En  uno  de  ellos,  comparó  dos  actividades entre gente que sufría estrés moderado: mirar imágenes de  paisajes en una pantalla de plasma y observar una vista idéntica pero a  través  de  una  ventana  real.  Al  finalizar  las  pruebas,  notó  que  los  participantes  superaban  su  estrés  de  forma  más  eficiente  cuando  apreciaban la imagen real en comparación con la emitida por el televisor.  En el otro estudio, el psicólogo comparó entre las experiencias de  jugar con un perro real y hacer lo mismo con uno robótico. El resultado  fue  similar:  los  niños  no  exhibían  comportamientos  tan  sociales  o  interacciones tan profundas cuando se les prestaba el perro artificial.  La ciencia comprueba cada vez más que aquellos rituales de antaño \nalimentaban  por  mucho  nuestro  espíritu,  ¡éramos  más  felices!  Como  veremos a continuación, nuestra especie tiene una conexión profunda y  ancestral con la naturaleza, al perderla sacrificamos parte de nosotros.  Importa el  qué  pero también el  dónde  Sabemos que el ejercicio nos hace felices, pero ¿qué tanto influye el lugar  donde  lo  practicamos?  Un  estudio  de  la  Universidad  de  Stanford  se  dispuso  a  buscar  la  respuesta,  utilizando  escáneres  cerebrales  y  comparando las caminatas en parques con las realizadas en calles de alta  afluencia en la ciudad de Palo Alto, California.  Los que caminaron en entornos verdes estimularon menos la sección  cerebral relacionada con los pensamientos depresivos.  Los investigadores especulan que estas escapadas a la naturaleza son  también  escapadas  de  la  mente.  Estas  actividades  parecen  succionar  nuestra  atención  en  el  buen  sentido  de  la  palabra:  la  acercan  a  sentimientos  de  conexión  con  el  medio  ambiente  y  la  alejan  de  los  sentimientos negativos.  Investigadores  de  la  Universidad  de  Bangor,  en  el  Reino  Unido,  analizaron  23  estudios  para  verificar  si  existe  algún  vínculo  entre  bienestar y naturaleza. Los científicos reportaron haber hallado evidencia  de que la exposición a ambientes naturales, a diferencia de los lugares  cerrados,  sí  producen  un  impacto  positivo.  Se  asocian  con  la  baja  de  emociones negativas como enojo, fatiga y tristeza, y el alza de otras como  la tranquilidad.  La organización británica Mind contrastó, en otra investigación, los  efectos mentales de realizar una caminata en un entorno expuesto a la  naturaleza (un parque en la ciudad de Essex) y otro en el interior de un  edificio (un centro comercial en la misma localidad). Estos fueron los  resultados para ambas:  A  Después de la caminata verde...  —  90% de los participantes vio incrementada su autoestima.  —  71% informó una disminución en sus niveles de depresión. \n—  88% notó una mejoría en su humor.  —  71% se sintió menos tenso.  B  Luego de la caminata en el centro comercial...  —  44% de los participantes notó una reducción en su autoestima.  —  22% percibió un aumento en sus sentimientos de depresión y 33%  permaneció sin cambios.  —  44.5% vio afectado negativamente su humor.  —  50% sintió más tensión.  Los  investigadores  de  esta  organización  británica  creen  que  la  gente  disfruta las actividades cerca de la naturaleza por cuatro principios:  —   Aumentan  las  conexiones  naturales  y  sociales:  acompañarse  de  amigos, familiares y gente afín; convivir con mascotas y animales  silvestres; evocar memorias agradables, estimular la imaginación y  la espiritualidad.  —   Estimulación  sensorial:  experimentar  las  vistas  y  sonidos  del  entorno;  respirar  aire  fresco  y  la  riqueza  aromática;  emocionarse  producto de actividades como deportes y excursiones.  —  Aumento de actividad: aprender alguna habilidad o trabajo manual,  disfrutar las actividades físicas y los beneficios asociados con ellas.  —   Sano  escape  de  la  cotidianidad:  huir  un  momento  de  la  vida  ajetreada, relajarse y pasar un tiempo de calidad a solas o con la  familia; recargar las baterías con los momentos de quietud.  Ejercitarse  parece  ser  una  experiencia  más  integral  que  el  simple  movimiento de nuestros músculos; apartarlo de los entornos naturales en  los que comúnmente se practica es despojarlo de su integridad.  Generosidad al natural  Los  paseos  verdes  no  sólo  crean  ondas  de  bienestar  al  interior,  sino \ntambién lo hacen al exterior. Las pruebas señalan que, más allá de la  felicidad individual, incitan un verdadero cambio en nuestro ser y actuar  para con los demás.  Una serie de  experimentos de investigadores  de la Universidad  de  California,  en  Berkeley,  expuso  a  algunos  participantes  a  imágenes  naturales antes de adentrarlos en pruebas para medir su generosidad y la  confianza.  Aquellos  que  veían  las  imágenes  más  hermosas  mostraban  comportamientos  más  benévolos  y  sociales.  Su  conclusión  fue  que  experimentar  la  belleza  de  la  naturaleza  incrementa  las  emociones  positivas, quizá por el asombro y la admiración de sentirse parte de algo  más grande que ellos, lo que a su vez genera comportamientos en pro de  la sociedad.  Esta teoría encuentra sustento también en un estudio similar de la  Universidad de California, en Irvine, en el que las personas luego de  mirar  por  unos  minutos  a  las  copas  de  árboles  de  gran  altura  se  comportaron de forma más servicial y resolvieron dilemas morales de una  forma más ética en comparación con otras que pasaron el mismo tiempo  observando edificios altos.  Otro  estudio  de  la  Universidad  de  Rochester,  en  el  Reino  Unido,  realizó  experimentos  similares  pero  con  ingredientes  extra  muy  tentadores: la fama y el dinero. Durante varias pruebas, la mitad de los  participantes apreció varias imágenes relacionadas con la naturaleza y la  otra mitad, fotografías de paisajes urbanos como avenidas y edificios.  Luego se les aplicó un cuestionario para determinar qué valoran más en la  vida:  si  la  fama  y  la  riqueza  o  la  conexión  y  la  comunión  con  otras  personas.  ¿El  resultado?  Entre  mayor  fuera  su  inmersión  en  los  ambientes  naturales  más  tendían  a  valorar  la  comunidad  y  la  cercanía  con  las  personas.  Esto  fue  comprobado  también  en  pruebas  posteriores  con  billetes.  Los  influidos  por  la  naturaleza  tendían  a  ser  más  generosos,  aunque eso significara perder algo de dinero por el bien de los demás.  Estos científicos especulan que esto se debe a que la naturaleza nos  ayuda  a  establecer  contacto  con  nuestro  yo  más  auténtico,  aquel  que  convivía en sociedades de cazadores y recolectores en medio de entornos  naturales. “La naturaleza, de alguna forma, remueve los artificios de la  sociedad que nos aíslan de los demás”, concluye Andrew Przybylski, uno  de los líderes del último estudio. \nLa monotonía ni en las plantas  Científicos de la Universidad de Sheffield, en el Reino  Unido, descubrieron que no porque sea verde significa  que todo es igual. Sus investigaciones revelaron que la  asociación  positiva  que  existe  entre  los  entornos  naturales y el bienestar de sus visitantes también se ve  influenciada  por  la  variedad  de  las  plantas  que  lo  componen.  El grado de beneficio psicológico aumenta mientras  más grande sea la riqueza y diversidad de las especies  de plantas, con una pequeña contribución de la variedad  de especies de aves.  Los investigadores concluyen que este conocimiento  es  de  utilidad  para  los  urbanistas  y  departamentos  planificadores de parques y ciudades, quienes aparte de  cumplir  con  conservar  áreas  verdes  dignas  podrían  complementar su misión ecológica y recreativa con las  personas añadiendo más complejidad a los paisajes.  En  un  mundo  donde  el  pasto  tiene  el  monopolio  sobre los parques y jardines hogareños, la investigación  es una invitación a despertar nuestra creatividad para  que en el mejor adorno de los exteriores encontremos  una paz más plena en nuestro interior.  Las bondades de un baño de sol \nMe confieso: constantemente digo que soy enemigo del sol y es por la  historia que he tenido al exponerme en exceso a los rayos del astro rey.  Recuerdo un viaje a Acapulco con mi familia, hace ya muchos años.  Tenía entonces 13.  Yo veía en las películas que era natural y hasta de alguna manera una  especie de moda estar en la playa asoleándose cual vil lagartija. Y ¿qué  hice? Lo mismo, pero con una pequeña ayudadita para tomar ese color  bronceado  que  veía  en  mucha  gente,  ofrecida  por  los  múltiples  vendedores que están en la playa. “¡Con este aceite de coco, agarras un  color padrísimo!”, me dijo uno más moreno que el café.  Me unté lo suficiente como para verme enmielado. Y me puse más o  menos 3 o 4 horas, “hasta que me arda la piel”, me dije.  Los resultados fueron obvios, quemaduras de primer y segundo grado  en toda mi espalda, acompañadas de ampollas que todavía recuerdo por  las cicatrices que me dejaron.  Desde entonces dije “nunca más” a la exposición directa al sol.  Por  supuesto  que  todo  exceso  es  malo,  pero  a  ciertas  dosis  los  expertos dicen que es necesario por la vitamina que aporta y el bienestar  que simultáneamente se produce.  En el portal  Natural News  la llaman “la vitamina más subestimada del  mundo de la nutrición”; en el  New York   Times  predijeron que “promete  ser  el  suplemento  nutricional  del  que  se  hable  y  escriba  más  en  la  década”.  En  el    Harvard  Magazine   se  preguntan  si  es  la  “píldora  maravilla” en vista de que, además de su fama de mejorar la salud de los  huesos,  ayuda  a  combatir  males  como  la  inflamación,  la  esclerosis  múltiple, la hipertensión y hasta el cáncer.  Hablamos  de  la  vitamina  D,  obtenida  por  algunos  alimentos  pero  también por un proceso desatado en nuestro cuerpo por la luz solar. Una  insuficiente exposición a los rayos solares puede crear una deficiencia de  esta vitamina, que tiene una función muy importante en nuestro bienestar  físico.  Por ejemplo, en las naciones del norte de Europa sufren mucho de ella  porque el sol se asoma por escasos periodos en algunas temporadas. Otro  ejemplo: según estudios, en los Emiratos Árabes Unidos, a pesar de que  el sol cae a plomo, mucha gente también la padece, en gran parte por sus  normas  culturales  y  por  sus  códigos  de  vestimenta  caracterizados  por  ocultar la mayoría de su cuerpo (el problema es más grave en las mujeres \nporque tienden a cubrirse más el cuerpo con el uso de la burka).  La carencia vitamínica no es exclusiva de aquellos lejanos lugares.  Los Centros para el Control y Prevención de Enfermedades, en Estados  Unidos, reportan que uno de cada cuatro habitantes de ese país la padece.  En México, según datos del Instituto Nacional de Salud Pública, la cifra  es incluso más elevada: uno de cada tres.  Aunque la relación entre este déficit y trastornos mentales como la  depresión  está  muy  bien  documentada,  el  fenómeno  también  tiene  injerencia  en  el  humor  de  cualquier  persona  en  cualquier  día.  Investigadores de la Universidad de Brigham Young, en Estado Unidos,  se  propusieron  encontrar  las  condiciones  climáticas  que  afectan  más  nuestro bienestar mental y emocional. Resulta que ninguna impacta tanto  como la falta de sol: aun esté caluroso, lluvioso y hasta nublado por una  espesa capa de contaminación, el ánimo no decae tanto como cuando el  sol no es tan generoso con sus rayos.  ¿Por qué ocurre esto? Nicholas Spitzer, profesor de neurociencia en la  Universidad de California, explica que, dado que los químicos del cerebro  reaccionan al entorno, la falta de sol del invierno nos incita a entrar en un  modo ahorrador de energía. Esto produce afectaciones en nuestro humor,  pero  también  en  nuestras  funciones  motrices  y  mentales.  Si  bien  no  alcanzamos  la  magnitud  de  los  osos  digamos  que  entramos  a  una  hibernación chiquita.  LA LECCIÓN QUE ESTO NOS DEJA ES QUE EL ENCIERRO  PUEDE ENVIAR LA SEÑAL EQUIVOCADA A NUESTRO  CEREBRO. ESTO NOS MANTIENE CON LA CAPA CAÍDA Y  LEJOS DE ESTAR AL 100 PARA AFRONTAR NUESTROS  RETOS COTIDIANOS.  Sólo recuerda: nada con exceso. Una cosa es el bienestar y otra muy  distinta el cáncer de piel.  Un pedacito también ayuda  ¿Sin oportunidad de salir? Por lo menos trasplanta algo \nverde a tus lugares.  Una investigación de científicos de la Universidad  de Queensland halló que las oficinas que utilizan plantas  como parte de su decoración producen un incremento de  15% en la productividad de los empleados.  Luego de monitorear al equipo de trabajo por dos  meses y aplicarles a sus miembros una encue
