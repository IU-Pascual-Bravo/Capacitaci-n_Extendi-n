sta al fin de  ese periodo, los investigadores notaron un aumento en la  satisfacción  con  su  empleo,  un  mayor  nivel  de  concentración y una mejor percepción de la calidad del  aire.  “La gente cree que si la naturaleza simulada con tecnología es medio  buena es suficiente. Pero no lo es. Porque con el paso de las generaciones  lo  que  ocurrirá  es  que  lo  suficiente  se  convertirá  en  lo  bueno.  Si  no  cambiamos el rumbo, esto empobrecerá nuestra especie”, sentencia Peter  Kahn, el psicólogo con quien abrimos este capítulo.  La advertencia no es para echarse en saco roto. Lo que consideramos  “normal” cambia con el tiempo y conforme pasan los años alejamos la  normalidad de la naturalidad.  Basta con ver la herencia de las últimas décadas en las que ya hemos  movido demasiado la aguja. Los convivios en el parque han cedido paso a  los  chats;  el  futbolito  en  el  barrio  ya  no  seduce  como  el  de  los  videojuegos en línea; para acabar pronto, y no te miento: en mi ciudad he  visto  pasto  artificial  en  las  “áreas  verdes”  de  los  camellones  entre  avenidas.  Ya hace tiempo perdimos algunos bastiones de naturaleza y contacto  humano. ¿Qué nos depara si seguimos cediendo? Emprendamos mejor el  regreso al origen, pero sólo a eso que nos da beneficios en la salud. \ne acuerdo, ¡no a las mentiras! ni tampoco a las piadosas. Sé  que al ver el título de este capítulo pensaste que podría estar  promoviendo  una  actividad  tan  mundana,  tan  cotidiana  y  común como la misma respiración.  No es nada fácil eliminar un hábito tan arraigado como es la mentira  piadosa.  —¿Cómo me veo?  —¡Muy bonita!  Cuando la verdad está muy lejos de tu parámetro de lo que consideras  verdadera  belleza,  sin  embargo  para  evitar  algún  tipo  de  conflicto,  contestamos lo que ella quería escuchar.  —Mi amor... ¿me veo gorda?  Otra de las preguntas más peligrosas que pueden hacerse en pareja y  cuya  respuesta  puede  derivar  en  una  inestabilidad  emocional  o  crisis  matrimonial.  ¿Por qué preguntamos lo que no queremos escuchar?  ¿Para  qué  poner  en  aprietos  a  la  gente  que  amamos  al  formular  preguntas muy difíciles y comprometedoras?  Quienes  son  inteligentes  pueden  contestar  con  una  verdad  sutil  en  lugar de una mentira piadosa: “Te ves sabrosa.” \nNo es mentira, ya que según Wikipedia, la palabra sabrosa, además de  ser  un  municipio  de  Portugal,  quiere  decir  algo  agradable,  delicado,  apetitoso, interesante y sustancioso; por lo tanto no es mentira, “¡te ves  sabrosa!” Y punto.  Quién  es  más  que  inteligente  puede  contestar  con  algo  técnico-  científico:  —Mi amor, si el 70% del cuerpo es agua, digamos que no estás gorda,  estás un poco inundada —¡y ya! no entres en más detalles.  En muchas ocasiones, por querer agradar a los demás o hacer sentir  bien a quien sufre una necesidad, buscamos la mentira como tabla de  salvación.  —No te preocupes, ¡eso se arregla fácil!  Cuando en el fondo de tu corazón no tienes ni la menor idea de cómo  se solucionará tremendo conflicto.  —¡Por favor! No es para tanto; no lo hagas más grande de lo que  realmente es.  Y la verdad, sí es para tanto, ¡pero no encuentro qué decirte!  —¿En serio te preocupas por eso? Yo en tu lugar no le dedicaría  tiempo a estar pensando en tonterías.  Y a lo mejor si tú vivieras lo que esa persona vive no dormirías y  estarías todo el día pensando una y otra vez en qué hacer.  Hoy,  si  me  permites,  quiero  compartirte  la  mentira  piadosa  más  comprometedora que he dicho y de la cual obviamente me avergüenzo  pero en el fondo de mi corazón y por incongruente que sea, al mismo  tiempo siento cierto orgullo. Reitero, no es mi afán promover la mentira  pero esto que te comparto es real y agradezco a mi amiga Nora Lozano  que  me  permita  hacer  pública  esta  anécdota  de  esperanza  y  mentira  piadosa a la vez: Maylen nació el 5 de abril del 2001. Hija de mi amiga y  colega coach, Nora.  Me alegré inmensamente cuando me enteré del embarazo de una niña  tan deseada por ella y su esposo pero nunca olvidaré la llamada que le  realicé al hospital un día después del nacimiento de su bella hijita, cuando  Nora me dio la noticia que le acababan de dar los médicos:  —César tengo sentimientos encontrados. Por un lado estoy feliz de  que tengo por fin a mi adorada hija y por otro lado estoy muy angustiada  por su futuro. Nació con Lipomielo... Lipo mielo.... no sé qué..  —Meningocele —completé yo la tan temida palabra para ella. \n—Sí ¡eso! y los médicos me dicen que mi hija probablemente no va a  caminar ni controlar sus necesidades fisiológicas nunca. Usará silla de  ruedas de por vida —ella sollozaba al expresar su incertidumbre y dolor  ante lo que a primera vista era irremediable.  —¿La van operar? —pregunté  —Sí, pero aún no sé cuándo.  —¡No te preocupes Nora! —atiné a decir. Mira, yo tengo un sobrino  que tiene lo mismo y quiero decirte que no lo detenemos. Camina, corre,  anda en bicicleta y es tremendo —eso que yo le decía era precisamente  todo lo contrario a lo que los médicos le acababan de mencionar.  “En ese momento —me contó después Nora—, volví a sonreír y tomé  como frase o decreto las siguientes palabras:  Si el sobrino de César pudo  caminar y correr mi hija también lo hará. ”  La esperanza llegó y obvio su intuición femenina le hacía dudar de la  veracidad de mis palabras, pero decía:  —Prefería quedarme con la duda para no disminuir la fe que tenía en  esos momentos.  Ella luchó incansablemente por hacer que su hija caminara. Cuanto  tratamiento de rehabilitación le indicaban lo hacía con esa gran esperanza  de que si otro niño pudo, ¡mi hija también podrá!  Después de siete cirugías la bella Maylen camina, corre, tiene control  de sus necesidades fisiológicas, es una excelente hija, amiga, estudiante  sobresaliente, miembro de varios grupos de la iglesia católica a la que  asiste y con una bella y encantadora sonrisa que invita a no perder nunca  la esperanza.  Ahora que pasa el tiempo y Nora me cuenta con detalle la mentira  piadosa  que  utilicé  para  aumentar  en  ese  momento  su  esperanza,  me  queda una sensación de satisfacción por el final feliz que tuvo esta bella  historia; pero no deja de invadirme la sensación de error al haber utilizado  una mentira de ésas, ya que gracias a Dios no tengo ningún sobrino que  tenga algo similar. Por supuesto que el fin nunca justifica los medios y no  olvidaré la vergüenza que sentí cuando, recientemente, Nora me preguntó  con la bondad que la caracteriza: “¿Verdad que no tienes ningún familiar  con  lipo-mielomeningocele?”  Y  le  contesté  que  no.  Deseo  que  esta  historia quede como testimonio de que cuando creemos —totalmente en  alguien  o  en  ti—  de  que  algo  bueno  puede  suceder,  nos  acercamos  irremediablemente a eso. \nTristemente  lo  mismo  ocurre  en  caso  contrario.  Cuando  creemos  firmemente que no hay nada que hacer, que no hay esperanza, las puertas  se cierran y los milagros no ocurren, evitando que suceda lo inesperado.  “¡QUE LA ESPERANZA SEA LO ÚLTIMO QUE MUERA!”  FRASE QUE QUIERO RECORDAR UNA Y OTRA VEZ CUANDO  SE TRATA DE ESPERAR LO IMPOSIBLE. CREO EN EL PODER  DE LA FE Y DESEO QUE TÚ TAMBIÉN CREAS EN ÉL.  Las mentiras, ¿tan malas como necesarias?  Imagina vivir en un mundo sin mentiras. En la bola de apuros que nos  meteríamos; los minutos perdidos por no ahorrarnos las explicaciones; la  cantidad  de  sensibilidades  lastimadas  al  responder  esas  preguntas  difíciles.  El  investigador  de  la  UNAM,  Rafael  Barrio,  argumenta  que  la  sociabilidad es parte importante de una de las más grandes invenciones no  sólo de los humanos, sino de los primates en general.  “Su  cerebro  puede  manejar  más  relaciones  entre  sus  pares  con  mentiras. Si uno fuera honesto todo el tiempo, sus vínculos serían menos.  Es  como  una  técnica  que  se  usa  para  manejar  más  gente  al  mismo  tiempo”, afirma Barrio.  La mentira es tan natural que nos llega prácticamente al bajar de la  cuna. Jeremy Adam Smith, de la Universidad de Berkeley, nos cuenta su  desarrollo  en  el  ser  humano:  a  los  tres  años,  los  niños  desarrollan  la  habilidad de mentir; a los cinco, casi todos lo hacen para evitar castigos o  tareas; de los siete a los once, comienzan a mentir para proteger a otras  personas o hacerlos sentir mejor (y, de paso, empiezan a considerar que  las mentiras pro sociales se justifican).  El lado amable  El investigador mexicano que te mencioné, Rafael Barrio, encabezó una  investigación  internacional  para  ver  los  efectos  de  la  mentira  en  las  comunidades y las redes sociales.  Los resultados arrojaron que las mentiras “blancas”, pro sociales o  piadosas  —en  las  que  faltar  a  la  verdad  es  en  beneficio  del  otro—  equilibran las redes sociales, unen a la sociedad y ayudan a mantener \nrelaciones sociales amplias. Por otro lado, las “negras” o antisociales —  egoístas  y  útiles  únicamente  para  el  que  miente—  fomentan  la  desconfianza y, por tanto, lastiman las relaciones sociales.  El investigador Jeremy Adam Smith cita una serie de cuatro estudios  realizados en 2015 por la Escuela de Wharton en los que tenían parte  diferentes tipos de confianza y engaño. Ahí se descubrió que, mientras las  mentiras  negativas  lastimaban  la  confianza  entre  los  participantes,  el  engaño de naturaleza altruista la fortalecía.  En pocas palabras, la evidencia actual apunta a dos cosas: la mentira  parece ser parte de nuestra condición humana y, sin embargo, no significa  que sea mala. Si la motivación que nos mueve se hermana con la empatía  y la compasión, la mentira puede tener resultados positivos. “A veces,  mentir puede revelar lo mejor de las personas”, concluye Smith.  Diferentes razones  Paul  Ekman,  investigador  de  la  Universidad  de  California,  en  San  Francisco, realizó a partir de sus muchas investigaciónes una clasificación  de las nueve razones más comunes por las que niños y adultos mentimos:  1  Evitar algún castigo.  2  Obtener una recompensa.  3  Proteger a otros de recibir algún castigo.  4  Protegernos del riesgo de recibir daño físico.  5  Ganarse la admiración de los demás.  6  Escapar de una situación social incómoda.  7  Evitar vergüenzas.  8  Mantener asuntos privados en secreto.  9  Ejercer poder sobre los demás.  Ya vimos que hay de mentiras a mentiras. Cuando se da con la buena  intención  de  proteger  a  los  demás,  mentir  puede  ser  la  elección  más  correcta  y  compasiva.  Pero  ojo:  no  nos  engañemos  con  esto  de  la  “bondad”  de  las  mentiras  blancas  para  retorcer  los  hechos,  hacerlos  embonar con nuestras malas intenciones y disfrazarlos de una falsa virtud.  Muchas  veces  nos  vendemos  cualquier  historia  para  justificar  lo  injustificable, ¡aguas! \nLo podemos ver cuando mentimos por venganza. Mentimos apretando  los dientes y diciendo hacia dentro “él se lo ganó”, cuando en el fondo  combatir fuego con fuego no era la mejor respuesta.  Así que nos debemos un ejercicio mental. Dar un paso atrás y antes de  siquiera plantearnos mentir como herramienta para procurar un bien, ser  honestos con nosotros, conocer nuestros trucos, nuestras motivaciones,  nuestras debilidades, y aumentar nuestro compromiso con la verdad.  Porque  cuando  mentimos  abrigando  intenciones  egoístas,  vanas  o  maliciosas, no sólo cargamos con el peso moral de nuestra conciencia,  también  con  el  de  la  congruencia,  ¡toda  la  gimnasia  mental  que  necesitamos para encubrir la mentira!  De la impunidad a la facilidad  Aunque sea conveniente en muchas circunstancias, la realidad es que ese  acto sigue teniendo una muy mala reputación. Así que, ¿qué otras razones  lo hacen persistir?  Una de ellas es que no siempre hay consecuencias. Mentimos porque  casi siempre nos salimos con la nuestra. Y es que como detectores de  mentiras moriríamos de hambre.  Paul Ekman nos dice que los humanos somos muy malos para notar  cuando alguien nos miente. Este resultado es muy inferior al del 85% de  éxito  que  tienen  los  sistemas  de  reconocimiento  de  conducta  desarrollados por estos científicos.  Ekman explica que somos malos en esto por la forma en que fijamos  nuestra atención al interactuar con los demás, o sea que atendemos mucho  el contenido de lo que se dice y casi nada las formas de expresión con que  se hace. Esto nos lleva a lo siguiente: somos pésimos para leer el lenguaje  corporal del mentiroso.  Según un estudio de la Universidad de London College, mentimos  también por costumbre. En el estudio pusieron a 80 personas a mentirles a  otras sobre la cantidad de monedas en un jarrón. Conforme engañaban  más y más al resto para su propio beneficio, las amígdalas —las zonas del  cerebro que regulan nuestras emociones— se activaban menos y menos.  “Si  alguien  miente  repetidamente,  ya  no  recibe  una  respuesta  emocional al hacerlo. En la ausencia de esta respuesta emocional, las  personas se sienten más cómodas y mienten más”, dice Tali Sharot, uno \nde los investigadores.  EN OTRAS PALABRAS, AL INICIO LE SOMOS FIELES A LA  VERDAD PORQUE TEMEMOS A LAS REPRIMENDAS, PERO  CON LA REITERACIÓN DE LA MENTIRA NUESTRO  CEREBRO EMOCIONAL LA NORMALIZA Y DEJA DE  PERCIBIRLA CON TANTO CUIDADO. AQUELLAS CUERDAS  MORALES QUE NOS MANTIENEN EN CINTURA SE AFLOJAN  HASTA QUE SE SUELTAN Y HACEMOS LO QUE QUEREMOS  POR COSTUMBRE.  En conclusión, como en la clásica cantaleta del “se me hizo fácil” que  utilizan los delincuentes, en efecto, mentir se nos vuelve cada vez más  fácil.  De tal palo tal mentira  Si la mentira es tan terca que pervive en todas las sociedades, en todas las  épocas,  ¿acaso  es  porque  pasamos  la  estafeta  de  generación  en  generación?  Chelsea  Hays  y  Leslie  Carver,  investigadoras  de  la  Universidad de California, en San Diego, hicieron un experimento para  medir un fenómeno que nos puede dar pistas sobre esto.  En él, adultos convivían con niños de tres a siete años mientras de un  lugar cercano se emitían sonidos conocidos de juguetes populares. Luego,  un sonido no reconocible instigaba la curiosidad de los niños por saber de  qué juguete se trataba. Justo en ese momento, los adultos salían de la  habitación con la excusa de tener que tomar una llamada pero les dejaban  a  los  niños  la  instrucción  de  que  no  se  asomaran  para  descubrir  el  misterio.  Los  niños,  fueron  grabados  mientras  estaban  a  solas,  tenían  la  posibilidad de admitir que lo vieron o bien mantenerlo en secreto, con una  mentira. Todo esto con un pequeño detalle previo: en un experimento  minutos antes, los adultos les habían mentido a algunos de esos niños  (diciéndoles que en un lugar había dulces cuando en realidad no); el resto  de ellos no había sido víctima de tal mentira.  Resulta que aquellos niños en edad de escuela primaria a los que se les  había mentido con anterioridad eran más propensos, a su vez, a cometer \nambos tipos de pecado: la desobediencia de haber buscado los juguetes y  la deshonestidad de no confesar que lo hicieron.  Los científicos comprobaron que un niño es más propenso a adoptar o  imitar un comportamiento de una persona de estatus más alto (por la  edad,  por  ejemplo).  Ahí  no  queda  la  cosa:  dado  que  no  sólo  fueron  deshonestos, sino también tramposos, los científicos especulan que no se  trata de una imitación mecánica como si fuera el reflejo de un espejo; se  trata  de  algo  mayor  en  tanto  que  los  niños  cambiaron  su  juicio  y  comportamiento moral de forma más general.  Para  Carver  y  Hays  esto  tiene  implicaciones  para  los  padres  de  familia, cuya mayoría acepta utilizar la mentira como herramienta para  lidiar con sus hijos en ciertas circunstancias y que, sin embargo, tratan de  inculcarle a sus hijos el valor de la honestidad.  “Las acciones de los padres de familia sugieren que no creen que las  mentiras que les dicen a sus niños vayan a impactar en la honestidad de  ellos. El presente estudio nos hace dudar sobre eso”, declaran.  Los humanos aprendemos por imitación, somos modelos a seguir y  tenemos la responsabilidad de predicar con el ejemplo en la medida de lo  posible.  El acto de mentir no es bueno ni malo en sí. Depende mucho del  contexto.  Muchas  personas  lo  hicieron  durante  el  régimen  nazi  para  proteger la vida de miles de judíos. El mismísimo Papa Francisco (en  aquel entonces un humilde sacerdote llamado Jorge Bergoglio) mintió  sobre la identidad y la ubicación de hombres perseguidos para salvarlos  de las garras de la dictadura.  Y, sin embargo, la mentira sigue siendo indeseable. Creo firmemente  que son las circunstancias las que nos deben orillar a utilizarla como un  recurso, pero nunca una voluntad de mentir por mentir, mucho menos de  mentir para herir. Así que lo más conveniente es:  —  Aspirar a ser un ejemplo de virtud para los que nos rodean.  —  Evitar caer en el círculo vicioso de la mentira.  —   Evaluar  nuestra  motivación  y  los  posibles  resultados,  antes  de  mentir.  —  Mentir sólo en caso de que nuestra motivación sea bienintencionada  y resulte en más bien que mal. \nLa honestidad es un bien necesario y la mentira es un mal necesario, pero  lo de necesario debe ser cuestionado siempre. Pregúntate cada vez: ¿Es  realmente necesario mentir en esta ocasión? \nNo puede ser que tenga una vida tan miserable. Me siento  sola, fea y vieja.”  Yo creo que mucha gente podría en un momento determinado  expresar tales palabras hirientes hacia su persona pero tal afirmación tiene  más peso si es expresada por una joven de tan sólo 19 años.  Y  no  estoy  exagerando  porque  este  trabajo  que  tengo  como  conferencista  en  tantos  países  me  ha  dado  la  gran  oportunidad  de  escuchar  testimonios  de  quienes  amablemente  se  acercan  a  mí  para  pedirme  la  dedicatoria  de  uno  de  mis  libros  o  simplemente  para  saludarme.  En la sala de espera de un aeropuerto sentí la mirada penetrante de una  chica de complexión robusta, con cabello negro, recogido y sin nada de  maquillaje.  Se  encontraba  sentada  exactamente  frente  a  mí.  Al  verla  agachó su cabeza para ver su celular y deslizaba con gran agilidad su  dedo índice sobre la pantalla. Los minutos pasaron y no dejaba de ver, sin  escribir nada, como buscando incesantemente algo.  Yo  seguí  leyendo    La  sombra  del  viento,   un  libro  de  uno  de  mis  autores favoritos, Carlos Ruiz Zafón.  Después de unos minutos volteé a ver a la joven y seguía con la \nmisma actitud apática deslizando de un lado a otro sus dedos sobre la  pantalla. Agrandando y disminuyendo con sus dedos fotografías que se  encontraba.  Reitero,  soy  observador,  no  “víbora”,  dos  términos  totalmente diferentes y más observador me hago cuando escribo un nuevo  libro buscando historias dignas de compartir —no chismear.  En una de esas levantadas de cabeza, me preguntó si soy el que “sale  en la tele”. Me dijo que su mamá y su abuelita son “mega fans” —así lo  dijo. Digamos que a la edad que tengo ya me acostumbré a que cuando  las mujeres jóvenes me piden fotografías obviamente no son para ellas,  son para las mamás, abuelas, bisabuelas y tías de  cierta edad  que siguen  mis pasos desde hace mucho, mucho tiempo.  Aunque me alegra expresarte que cada vez me adentro más al terreno  de los adolescentes y jóvenes deseosos de buscar información que les  ayude a sobrellevar las crisis que viven, que son más comunes de lo que  imaginamos.  Después de la foto, me dice con absoluta seriedad que ¿cómo le hace  una para dejar de sentirse fea, vieja y miserable?  —¿WHAT? ¿Qué dijiste? ¿Cómo le hace quién? ¿Estás hablando de  ti? —pregunté con asombro e incredulidad.  —Sí, ¿pues de quién más?  —Tengo tan pocas amigas —dijo—, y creo que soy la que menos  tiene de mi escuela. En mi casa, mi mamá no me entiende y quiero decirle  que hace 6 meses estuve investigando en el internet cómo quitarme la  vida sin que me doliera.  Como  el  vuelo  estaba  retrasado  una  hora,  para  variar,  tuve  la  oportunidad  de  preguntar  más  sobre  su  situación.  Su  novio  había  terminado  la  relación  que  llevaban  de  1  año  y  lo  hizo  a  través  del  WhatsApp.  —¡No  tuvo  los  pantalones  para  verme  a  los  ojos  y  decirme  sus  razones!  Yo  le  he  hablado  dos  veces  para  aclarar  nuestra  situación  y  regresar, pero no contesta mis mensajes y me deja en  visto .  Yo siempre entendí que cuando alguien dice  le he hablado  significa  entablar una conversación verbal, pero como sabrás en el nuevo lenguaje  tecnológico se refiere a mensajes escritos.  —¿Cuál  crees  que  es  la  razón  por  la  que  te  mandó  a  volar?  —  pregunté.  —Yo creo —dijo— que es porque soy  algo  celosa. No me gusta que \nle de  likes  a fotos  de mujeres que  se nota que  le avientan el  calzón.  Además, me choca que no me conteste los mensajes y no me dé la clave  de  su  celular.  Doctor,  ¿verdad  que  cuando  hay  amor  verdadero  no  tenemos por qué ocultar nada, incluyendo la clave del celular?  Y seguía hablando sin parar, antes de que pudiera contestar a sus  preguntas que me hacía repentinamente dentro de la letanía de agravios  inmerecidos que había recibido.  —Me siento fea porque cuando publico fotos no tengo tantos likes  como otras amigas.  Él publica fotos y todas las viejas le ponen un  chorro  de  likes.  Yo no  era gorda, pero desde hace 5 meses como más y todo me engorda. Mi  mamá dice que es por ansiosa. Ya estoy harta y no creo que pueda más —  dijo esto con lágrimas en sus ojos.  Es obvio que este tipo de escenas me conmueven mucho y más por  tratarse de alguien que tiene todo, salud, juventud, vida y que esa vida la  está convirtiendo en algo meramente virtual.  Durante la plática con ella, te comparto en forma resumida lo más  relevante que descubrí:  —   Checa  su  celular  muchísimas  veces  al  día.  No  supo  decirme  cuántas. Pero dijo “cuantas veces pueda”.  —  Revisa absolutamente todas las publicaciones de su novio o bueno,  mejor dicho, ex novio, y verifica a quién le da  like.  —  Revisa los perfiles de las personas que su novio le da  like  para ver  quiénes son.  —  Cuenta los  likes  que le dan a ella y los compara con las de sus  amigas y amigos.  —  Ella expresa claramente que todas sus amigas y amigos llevan una  vida mucho más feliz que la de ella, me imagino que concluye eso  porque cada quien pone lo mejor en sus redes.  Espero que mis recomendaciones no hayan sido tiradas en saco roto, al  recordarle a esa joven todo lo que tiene por agradecer. Que nada ni nadie  merece que nos quitemos la vida y mucho menos por una relación basada  en suposiciones.  Por  supuesto  le  aclaré  que  se  vale  tener  privacidad  en  las  redes \nsociales y claro que si alguno de la pareja no quiere dar sus contraseñas es  porque no quiere y punto, lo cual obvio ha sido motivo de múltiples  rupturas amorosas.  ¿Cuántos estarán viviendo esta triste realidad?  Y quiero expresar que esto no es sólo entre los jóvenes, también pasa  entre  adultos  que  cada  día  no  pueden  dominar  el  impulso  de  ver  compulsivamente sus redes sociales y las redes de los demás, sin evitar  las odiosas comparaciones.  Se dice que son más de 20 millones de divorcios los que han tenido  algo que ver con Facebook.  Es grande la incertidumbre que viven mujeres y hombres por las horas  y horas que sus parejas pasan conectadas sin saber con quién o por qué.  También  la  facilidad  con  la  que  se  puede  caer  en  la  tentación  de  entablar  conversaciones  con  extraños  por  sentir  soledad  y  una  gran  necesidad de tener más amigos.  Por  supuesto  que  amo  la  era  de  la  comunicación  que  estamos  viviendo,  pero  si  no  nos  controlamos,  sufriremos  sus  terribles  consecuencias.  Y no quiero irme tan lejos al hablar de casos de personas que conozco  o  se  han  acercado  a  mí  para  compartirme  una  y  otra  vez  historias  similares.  Te  hablo  un  poco  de  mi  familia.  Mi  esposa  y  mis  dos  hijos,  estudiantes  a  nivel  profesional.  Procuramos  comer  todos  juntos  entre  semana, pero por motivos laborales míos o las clases de ellos no siempre  es posible.  “¡Te conectas por favor!” Les digo cuando los sorprendo viendo su  celular o contestando mensajes de personas que no fueron invitados a la  mesa. Sé que se escucha contraproducente decir: ¡ te conectas ! Pero yo me  refiero a que se conecten conmigo, no con cientos de amigos y conocidos  que tienen al alcance de un  click .  Los domingos, busco la forma de que sigamos cumpliendo con una  tradición que espero sea para siempre.  Salir a comer juntos pero el celular no es invitado. Se quita de la mesa  o mínimo se pone con la pantalla hacia abajo.  Quiero  ser  sincero  contigo,  no  es  fácil;  ha  sido  causa  de  algunas  discusiones que terminan en enojo por parte de mis hijos o incluso de mi  esposa. Y por supuesto, yo también he caído en la tentación de ver los \nmensajes que me llegan y contestarlos al instante.  También he sentido la ansiedad al no encontrar mi celular, situación  que ya está codificada como uno de los signos y síntomas de adicción a la  tecnología.  ¿Qué tanto es tantito? La sobre exposición al mundo virtual  Quiero  decirte  que  no  es  mi  afán  satanizar  todos  los  grandes  descubrimientos que hemos tenido en los últimos años.  Quienes tenemos cierta edad, por no decir que no nos cocemos al  primer hervor, sabemos que en los últimos 20 años hemos avanzando en  comunicación a pasos agigantados.  Para nuestros hijos y quienes tengan nietos, es tan natural conectarse  al  instante  con  quien  se  encuentra  del  otro  lado  del  mundo,  enviar  fotografías,  videos  y  hasta  sostener  un  romance  con  quien  jamás  imaginamos,  desafortunadamente  con  los  peligros  que  conlleva,  incluyendo  la  suplantación  de  identidad,  el    bullying ,  la  pedofilia  y  el  tráfico de personas.  Independientemente de esto quiero manifestarte dos escenarios que  ejemplifican mi sentir:  Un  restaurante  en  la  Ciudad  de  México.  Comiendo  solo,  y  por  consecuencia, con la posibilidad de observar y analizar lo que ocurre a mi  alrededor, no dije “viborear”, que conste, aunque bien podría adjudicarse  ese término.  En la mesa de al lado, una niña de 5 o 6 años acompañada a cada lado  de su padre y su madre.  La cara hermosa de la pequeña, con ese brillo especial en sus ojitos  platicando primero a su mamá que su maestra le había dicho algo, no  entendí qué, pero se le veía cierto orgullo en su carita. Silencio... no hay  respuesta de la madre, quien se encontraba absorta viendo fijamente la  pantalla de su celular deslizando su dedo índice de abajo hacia arriba. Su  papá, apoyando los codos en la mesa, acto que era considerado una falta  de respeto al comer y que ahora hay que incluirlo también al estar con el  celular con personas que consideramos importantes.  El hombre ido, viendo la pantalla de su celular y de repente tecleando  algo.  La niña voltea inocentemente a ver la cara de su papá y le pregunta \nalgo. Silencio... distracción... vale madrismo.  Me  dolió  tanto  la  escena  que  volteo  y  le  aplaudo  a  la  niña  su  comentario con una amplia sonrisa en mi rostro. Por supuesto que los dos  voltearon a verme con una cara entre asombro, enojo y un “¿quién eres?”  —Disculpe que me meta pero la niña les acaba de decir algo que le  dijo su maestra y le da mucho gusto.  —¿En serio preciosa? ¿Cuándo le dijiste eso al señor?  —No  señora,  se  los  dijo  a  ustedes  en  dos  ocasiones  pero  no  la  escucharon.  Mi esposa me ha dicho en varias ocasiones que no me meta en lo que  no me importa, pero este tipo de situaciones, al igual que cuando veo que  la gente tira basura en la calle sin remordimiento, hacen que olvide todas  las  recomendaciones  que  hago  en  mis  conferencias  sobre  inteligencia  emocional.  Las redes sociales son un aparador de mentiras. Sonreímos y vestimos  nuestras  mejores  prendas  para  vender  nuestra  mejor  cara.  Los  demás  hacen lo propio y nos ofertan una fina selección de su vida.  El asunto es que las formas en que vendemos y compramos las vidas  de  propios  y  extraños  no  siempre  son  redituables  para  nuestra  salud  mental. Digamos que a veces damos cambio de más o resentimos los  precios del mercado.  Somos morbosos por naturaleza: nos encanta echar un vistazo a lo que  hacen  los  demás.  También  somos  egocéntricos  por  naturaleza:  somos  expertos en asociar todo lo que pasa en el mundo con nosotros. ¿En qué  resulta  este  combo  cuando  tenemos  herramientas  que  lo  elevan  a  la  máxima potencia?  A  continuación  daremos  un    tour   por  los  efectos  psicológicos  de  utilizar redes sociales, no para destruir nuestros celulares y volver a la  Edad de Piedra, sino para fomentar un uso más consciente y enriquecedor  de ellos. Porque la tecnología no es buena ni mala en sí; es sólo una  herramienta y ya depende de nosotros si la tomamos por el filo o por el  mango.  Del uso al abuso  No es sólo un decir aquello de que los  millennials  y los niños de las  siguientes generaciones (ya vamos en la Generación Z, por si ya perdiste \nla cuenta) son nativos digitales.  Según  datos  de  la  Unicef,  en  los  países  en  vías  de  desarrollo  el  número de jóvenes en internet supera por el doble o hasta el triple al del  resto de la población.  Empecemos  con  algo  tan  básico  como  nuestras  formas  de  convivencia. El mismo reporte de la Unicef informa que seis de cada diez  adolescentes considera importante conocer nuevas personas por internet.  Esta estadística le producirá un shock a uno que otro lector veterano,  pero antes de pegar el grito en el cielo, entendamos que, por el lado  amable,  las  comunidades  en  línea  bien  entendidas  presentan  oportunidades  sin  precedentes  para  nuestro  desarrollo  social  y  el  de  nuestros hijos, pues nos permiten entablar conversaciones con personas  con intereses muy similares a los nuestros.  Dicho esto, sí vale la pena mantenernos en vigilancia de las amenazas.  La Unicef también revela que 80% de los jóvenes encuestados a nivel  mundial  piensa  que  los  niños  y  adolescentes  corren  peligro  de  sufrir  abusos  sexuales  o  engaños  en  línea,  mientras  que  50%  cree  que  sus  amigos se comportan de manera muy riesgosa en sus interacciones en la  red.  Estos riesgos sí pueden traducirse en consecuencias. En un estudio  sobre depredadores en internet, investigadores de la Universidad de New  Hampshire descubrieron que entre más conductas de riesgo adopte un  adolescente (con gente desconocida, hablar sobre sexo con extraños o ser  hostil en foros, etcétera) más posibilidades tiene de convertirse en víctima  de un abuso.  Según estudios, si un adolescente incurre en conductas  de riesgo en internet es hasta 11 veces más propenso a  sufrir un abuso o ser acosado.  ¿Qué  podemos  hacer?  No  hay  necesidad  de  implementar  una  ley  de  prohibición  absoluta  en  casa.  Tus  hijos  no  sólo  te  guardarán  resentimiento; también terminarán por rebelarse y las utilizarán con más  atrevimiento cuando estén fuera de tu radar. \nEdúcalos desde pequeños y háblales en términos de riesgo-beneficio.  Fomenta que se cuestionen: “¿Qué ganaré haciendo esto?, ¿de verdad es  tanta la recompensa como para comportarme así?”  Independientemente  de  que  haya  más  gente  buena  que  mala  en  el  mundo, el hecho es que la anonimidad propia del internet lo convierte en  el refugio perfecto de acosadores, estafadores y gente abusiva. En otras  palabras, debemos dejar la confianza para nuestros seres queridos en el  mundo real y, en cambio, aplicar una sana dosis de desconfianza con los  desconocidos en el virtual.  Un problema de adicción  En la Universidad de California, en Los Ángeles, escanearon los cerebros  de varios adolescentes para medir los efectos del uso de redes sociales.  Encontraron que los mismos circuitos neuronales que se activan al comer  chocolate  o  ganar  la  lotería  entran  en  juego  en  el  cerebro  de  los  adolescentes cuando ven grandes cantidades de  likes  (o de “me gusta”, en  español) en sus fotografías.  Es normal, las recompensas hormonales que nos da nuestro organismo  provocan que persigamos el placer. Esta ventaja nos ha permitido llegar  hasta aquí como especie. Sin embargo, lo peligroso de su manifestación  en redes sociales es su omnipresencia y fácil acceso. Esto produce que  sintamos  esa  incesante  comezón  por  voltear  a  ver  nuestras  múltiples  pantallas.  Y  la  pesca  de    likes   no  sólo  implica  lanzar  el  anzuelo  de  una  publicación para ver si alguien pica con una que otra reacción. También  conlleva una ansiedad por lograr una buena pesca. Es por eso que cada  sonido de notificación en el celular nos pinta una sonrisa: “¡Alguien me  aprecia!”, y acto seguido nuestro cerebro descarga un coctel hormonal  que nos deja extasiados.  Pero ¿cómo rompemos el ciclo? El cerebro humano se compone de  varias secciones pero, a fin de simplificar, digamos que nuestro lado “más  animal” es el que busca el placer compulsivamente mientras otra sección,  más moderna en términos evolutivos, nos permite reflexionar y domar  hasta cierto punto al animal que llevamos dentro.  Y esa es la clave. La decisión de ponernos a dieta e ir al gimnasio se la  debemos a nuestro cerebro más racional. Podemos replicar esto mismo \ncon nuestro comportamiento en línea. Aunque nuestras manos parecen  tener vida propia para alcanzar la hamburguesa o el celular, es posible  ponernos en cintura, procurar poco a poco hábitos más sanos y cosechar  mejores resultados a corto y largo plazo.  Sólo  necesitamos  echar  mano  de  la  fuerza  de  voluntad,  esa  vieja  amiga que a veces descuidamos en el ajetreo cotidiano.  ¿Qué tan grave es la adicción?  Las revelaciones de un día sin internet  La  Universidad  de  Maryland  realizó  un  estudio  tan  curioso como interesante: hizo que mil estudiantes, en  diez países de los cinco continentes, se abstuvieran de  usar cualquier medio de comunicación durante un día.  Tras 24 horas de abstinencia, los estudiantes relataron su  experiencia.  Estos  son  algunos  de  los  principales  hallazgos:  —  Los estudiantes mostraron síntomas de síndrome  de abstinencia similares a los ocurridos con drogas y  emplearon el término “adicción” para hablar sobre  su  dependencia.  “Me  moría  de  ganas  por  usar  el  teléfono,  me  sentía  como  un  drogadicto  sin  su  droga” y “en algunos momentos me sentí como si  estuviera muerto”, afirmaron dos estudiantes.  —  La mayoría admitió haber fracasado en su intento  por mantener sus dispositivos apagados. “Después  de  esto,  ¡no  puedo  vivir  sin  los  medios  de  comunicación! Necesito tener siempre conmigo mis  redes sociales, mi celular, mi Mac, mi mp3”, declaró  una joven.  —  Informaron que sus dispositivos, en particular sus  teléfonos celulares, se han convertido literalmente  en  parte  de  sus  cuerpos  y  sus  identidades.  Un  estudiante  mexicano  comentó:  “Fue  una  sorpresa \ndesagradable darme cuenta de que vivo en un estado  de distracción constante, como si mi vida real y mi  vida virtual coexistiesen en diferentes planos, pero  en tiempo real.”  —  Relataron que conectarse las 24 horas del día no  sólo  es  un  hábito,  sino  algo  fundamental  para  la  manera  en  que  establecen  y  manejan  tanto  sus  relaciones de amistad como su vida social.  —   Para  muchos,  ese  día  de  desconexión  develó  la  cortina tras la que ocultaban su soledad. “Cuando no  pude comunicarme con mis amigos, me sentí muy  solo, como dentro de una jaula pequeña en una isla”,  reza un testimonio.  Tras los pasos de la manada  Decirle a alguien que es un “borrego” será interpretado como un horrible  insulto. A todos nos gusta ser únicos, diferentes al resto del rebaño, más  si se trata de adolescentes cuyo espíritu de competencia es rampante.  Sin embargo, ¿qué tanto seguimos a la manada en las redes sociales?  Mucho. El mismo estudio de la Universidad de California en Los Ángeles  descubrió que abunda el llamado “efecto de conformidad”, en el que los  adolescentes  son  más  propensos  a  dar    click   a  los  contenidos  si  éstos  tienen más  likes.  Por lo tanto, tienden a creer que, entre más gustada sea  una foto, mejor será.  Los  científicos  ven  en  esto  un  arma  de  dos  filos.  Si  nosotros  o  nuestros  hijos  depuramos  nuestras  redes  para  seguir  a  personas  con  influencia positiva, esto puede redundar en un círculo virtuoso. Por el  contrario, si seguimos a puro barbaján, mala leche, de esos que disfrutan  aventar odio a cuanta publicación ven, eso se volvería rápidamente un  círculo vicioso.  Esto nos deja una clara enseñanza: “Dime a quién sigues en línea y te  diré quién eres.”  Por  último,  también  podemos  educarnos  para  ser  críticos  con  la  información  que  tenemos.  En  internet  abundan  contenidos  falsos  y  malinformantes. Sabemos que la popularidad no es sinónimo de verdad, \nsobre  todo  si  caemos  en  algo  tan  serio  como  diagnosticarnos  enfermedades en vez de consultar al médico.  ¿Las redes nos deprimen?  Investigaciones  de  la  Escuela  de  Medicina  de  la  Universidad  de  Pittsburgh  descubrieron  que  entre  más  tiempo  invierten  los  jóvenes  adultos  en  sus  redes  sociales,  más  posibilidades  tienen  de  sufrir  depresión. De los casi 2000 jóvenes estadounidenses estudiados, aquellos  que revisaban con más frecuencia sus redes eran 2.7 veces más propensos  a estar deprimidos.  Otro estudio de la misma universidad develó que la cantidad también  importa: aquellos adolescentes que utilizan de siete a once plataformas  sociales demostraron tener el triple de probabilidades de sufrir depresión.  ¿Qué  tienen  las  redes  que  son  un  potencial  caldo  de  cultivo  para  algunos sentimientos negativos? Los expertos han documentado algunas  variables:  —   Caemos  en  comparaciones  y  nos  sentimos  menos.  Como  de  nosotros conocemos los dos lados de la moneda y de los demás sólo  el  más  brillante,  suponemos  que  nuestra  vida  palidece  en  comparación.  —   Tenemos  miedo  a  perdernos  de  cosas.  Conforme  aumenta  la  información sobre el mundo y nuestros amigos, gracias a las redes,  también se incrementa nuestro deseo de saber y estar en todo. Esto  provoca que nos sintamos excluidos.  —  Estamos ansiosos por contestar mensajes. Las redes sociales y los  chats traen consigo una sensación de prisa y una obsesión por estar  al día en nuestras distintas interacciones.  —  Las expectativas insatisfechas nos orillan a sentirnos solos. Cuando  no logramos cosechar los  likes  que esperábamos o el mensaje de esa  persona tan querida, corremos el riesgo de sentirnos aislados.  —   Fomentamos  nuestro  ego.  En  un  estudio  de  la  Universidad  de  Maryland algunos estudiantes que utilizaron su celular sólo unos  minutos fueron menos propensos a ofrecerse como voluntarios o a  participar en actividades caritativas. \nAnte tal hemorragia sentimental nos preguntamos si de verdad hay un  torniquete que la detenga. Te sugiero lo siguiente: repasa uno por uno los  puntos anteriores y examina los sentimientos que despiertan. Nota cómo  no son dignos de nuestro sufrimiento.  Para  entenderlo  observa  cómo  se  basan  en  meros  fantasmas  e  ilusiones. Y aquí la verdad es el mejor remedio contra el hechizo: la vida  de los demás no es perfecta; estar en todo es como no estar en nada; los  likes  no son manifestaciones profundas de amor.  La consciencia es como una luz: entre más la arrojemos para alumbrar  y develar las falsas expectativas de las redes, mayor claridad y libertad  obtendremos en su uso.  Intoxicados por exceso de información  Cualquier  usuario  de  Facebook  sabrá  que  se  expone  a  una  cascada  incesante  de  información.  Además  de  recibir  el  copioso  chorro  de  publicaciones, también somos presas de la variedad temática: con cada  avance puedes ir de la foto de un gatito a un video sobre auroras boreales  y  brincar  de  inmediato  al  chisme  más  reciente  del  vecindario.  Ya  ni  hablar de cómo saltamos del Facebook al Twitter y del Twitter al correo  electrónico.  El problema es que, a pesar de miles de años de evolución, nuestro  cerebro  sigue  siendo  más  o  menos  el  mismo  que  el  de  nuestros  antepasados. Los cavernícolas se alineaban mucho más con la naturaleza  humana original, al atender una cosa a la vez. Adelantamos el tiempo al  siglo  XXI  y  nos  encontramos  con  muchas  cabezas  pasmadas  por  el  frenesí de información.  EL FENÓMENO YA SE ESTUDIA MUCHO EN LAS  UNIVERSIDADES. INCLUSO SE HAN ACUÑADO TÉRMINOS  COMO “INFOXICACIÓN” O “SOBRECARGA DE  INFORMACIÓN” PARA CALIFICAR LOS EFECTOS DE ESTA  SOBREEXPOSICIÓN.  Investigadores de la Universidad de Humboldt, en Berlín, documentan  cómo la sobrecarga de información mina la calidad de nuestro juicio. Se  ha  probado  que  este  bombardeo  de  contenidos    tutti  frutti   induce \nconfusión,  incapacidad  para  fijar  prioridades  y  recordar  información  previa, así como estrés y ansiedad.  Las soluciones que los mismos participantes del estudio sugirieron se  resumen en una palabra: selectividad. Mi consejo es hacer una selección  más estricta de tus amistades, de las personas a las que sigues y de los  contenidos  que  publican.  Si  tienes  mil  amigos  y  a  todos  les  repartes  clicks, buena suerte, ¡porque no te alcanzará la vida!  El cuerpo: ¿la víctima silenciosa?  Ya ahondamos en los efectos psicológicos de las redes  sociales, pero ¿qué hay de los efectos físicos por el uso  de  los  dispositivos  cuando  las  revisamos?  Éstos  son  algunos de ellos:  —  Daños  en  la  columna.   Por  las  posturas  antinaturales  al  usar  el  celular  y  la  computadora,  sufrimos de daños en la espina dorsal. Incluso ya se  ha acuñado un término específico para el impacto de  estas    posturas    en    las    cervicales:    “cuello  tecnológico”.  —  Enfermedades  bacterianas.   Un  estudio  de  la  Universidad  de  Arizona  descubrió  que  un  celular  promedio  tiene  10  veces  más  bacterias  que  un  asiento de sanitario.  —  Insomnio.   La  exposición  a  rayos  de  luz  azul  y  verde interfiere con los patrones regulares de sueño.  — Afectaciones en la vista.  La continua radiación de  luz puede causar daños en la retina.  —  Molestias  en  brazos  y  manos.   El  uso  de  computadoras  y  celulares  puede  causar  dolor,  calambres e inflamación en los tendones de dedos y  muñecas, por ejemplo, túnel carpiano. \nEl decálogo del internauta  Sé  que  en  este  apartado  te  he  dado  razones  para  hundirte  en  el  más  profundo de los pesimismos.  Pero seamos realistas: privarnos a nosotros o a nuestros hijos de estos  nuevos  medios  puede  producir  que  el  tiro  salga  por  la  culata:  ser  ermitaños digitales nos pone en desventaja en un mundo hiperconectado,  y ya ni hablar de los malos actos en que puedan incurrir nuestros hijos  lejos de nuestra supervisión.  Ahora seamos optimistas: hay hábitos y formas que pueden inducir un  uso virtuoso de la tecnología. A continuación, te los sintetizo a manera de  decálogo:  1  Amarás  al  prójimo  en  línea.   Cultivarás  relaciones  positivas  y  utilizarás  los  medios  sociales  como  un  escalón  para  procurar  relaciones más íntimas y enriquecedoras en el mundo real.  2 No navegarás en vano.  Las redes sociales y el internet serán un  medio,  no  un  fin.  Procurarás  darle  sentido  a  tu  experiencia  con  objetivos  específicos  y  te  preguntarás:  “¿Qué  espero  extraer  de  esto?”  3 Buscarás la calidad.  Preferirás retomar contacto con algún amigo o  aprender algo nuevo sobre otras cosas como chismear, sembrar la  discordia o navegar inconscientemente.  4 Honrarás tu salud.  Adoptarás buenas posturas, no navegarás tanto  de noche, no revisarás tus redes como acto seguido a despertar por la  mañana, no te sentarás todo el día, tomarás recesos, etcétera.  5 No matarás tanto tiempo en redes sociales.  Limitarás tu cantidad  de horas de navegación.  6 No robarás tantas horas de tu vida real.  Huirás del sedentarismo,  el aislamiento y el exceso de tu actividad en línea, además de que no  sacrificarás  tus  relaciones  sociales,  rutinas  de  ejercicio  y  pasatiempos.  7  No  darás  tantos  testimonios.   No  compartirás  fotografías  reveladoras ni publicarás información personal en redes y foros en  línea.  8  No  codiciarás  las  vidas  y  los  bienes  ajenos.   Evitarás  comparaciones: la existencia de los demás no es tan perfecta como \naparentan sus estados de Facebook.  9 No cometerás actos impuros.  Evitarás sitios de dudosa procedencia  y no te convertirás en ese  troll  que se la pasa insultando al resto.  Recuerda, todo regresará como bumerán.  10  No  consentirás  malos  juicios.  Cuestionarás la información que  encuentres, revisarás bien tus fuentes y evitarás el pensamiento de  manada.  Las polillas se aferran y chocan incesantemente contra los candiles de  nuestras fachadas porque, por las noches, guían su viaje con la luz de la  luna. Pierden el rumbo por confundir la luna con algo tan simple como un  foco encendido y nunca reparan en el engaño que sufren buena parte de  sus vidas.  Las  redes  sociales  conllevan  un  riesgo  similar  si  no  las  usamos  con  moderación y propósito. Nos encandilan tanto que nos ciegan sin saberlo.  Se nos va la vida persiguiendo pequeños y fáciles estímulos, en vez de  trazar un plan de vuelo con destino a una felicidad más plena e integral. Y  tú, en tu vida, ¿apuntarás tan bajo como al candil o tan alto como a la  luna? \ne han ido agotando los tiempos de los hijos que le hablaban  de  “usted”  a  los  padres  y  éstos  contestaban  con  “¡Es  así  porque  lo  digo  yo!”  Las  líneas  entre  los  roles  de  los  integrantes familiares se han difuminado. Y conste que no es queja  porque el asunto tiene sus pros y sus contras.  Lo cierto es que en esta época de rápidas redefiniciones, los papás se  quedan  muchas  veces  con  la  cara  de  “¿ what ?”  Titubean  entre  ser  superiores o iguales; padres o amigos. Se preguntan qué tan gruesa es la  piel de sus hijos antes de ponerles una regañiza, en ocasiones tragándose  el enfado con el clásico conteo hasta 10, o hasta 30 o 40, 50...  Si algo alivia las dudas es el hecho de que el arte de la crianza no se  guía por fórmulas concretas. Creo firmemente en incorporar lo mejor de  todos  los  mundos  posibles.  En  este  capítulo  ahondaremos  en  las  advertencias y consejos de las voces autorizadas, a fin de lograr un mix  que se adapte a los tiempos modernos sin caer en la anarquía.  Entre soltar y apretar  “Hijos  tiranos,  padres  sometidos;  pero  hijos  también  sometidos  a  su  propia  tiranía  que  los  toma  de  rehenes”,  escribe  el  psicólogo  y  autor \nargentino Alejandro Schujman. O hijos tiranos padres obedientes, como  lo publicó acertadamente en su libro el doctor Jesús Amaya, académico e  investigador de la Universidad de Monterrey.  Y el mensaje no debe pasar inadvertido. Así como tememos la tiranía  de nuestros gobernantes en plena adultez, la de los niños es igual o peor.  Ostentar el poder no sólo los hace tomar decisiones equivocadas por su  falta de experiencia, sino que ante la ausencia de límites corren el riesgo  de inventarse estándares irreales que les imposibiliten madurar a la larga.  Estos roles invertidos se deben a un fenómeno aún más general: la  sobreprotección. Los padres no sólo renuncian a su autoridad por temor a  lastimar a sus retoños, sino que expanden esto a todas las áreas de la vida.  Empecemos con esta pregunta: ¿Cuándo fue la última vez que viste en  la calle a un grupo de niños menores de 12 años sin la compañía de un  adulto?  Estos  encuentros  se  han  vuelto  más  atípicos  que  los  de  aves  exóticas, ¿no? Y es un fenómeno que ha crecido en todo el mundo. Por  ejemplo,  un  estudio  conducido  en  vecindarios  de  todo  tipo  (urbanos,  suburbanos y rurales) en el Reino Unido reveló que, a principios de los  años 70, 80% de los niños de tercer grado caminaban solos a la escuela;  sin embargo, 20 años después, la cifra se redujo a sólo 9%. En el siglo  XXI, el número es casi nulo, por supuesto.  Y entiendo que “el horno no está para bollos”, como reza el dicho  popular. En nuestros países latinoamericanos los asuntos de inseguridad  no son menores, pero no quise dejar de mencionar el ejemplo para ilustrar  el punto mayor: el de la llamada “crianza helicóptero”.  Los padres helicóptero son aquellos que “vuelan” de forma incesante  sobre  la  vida  de  sus  hijos,  sin  perder  de  vista  sus  necesidades  y  sus  deseos. Según muchos estudios, este tipo de crianza está vinculada con  más altos índices de depresión, ansiedad y subdesarrollo cognitivo, desde  la infancia hasta la juventud. Las huellas pueden durar toda una vida  porque a la larga crea adultos dependientes y faltos de autonomía.  El  mensaje  que  recibe  un  niño  o  adolescente  cuyos  padres  lo  sobreprotegen es claro:  1  Te amo muchísimo y eres lo más importante para mí.  2  No creo que seas capaz de valerte solo y por eso hago todo o \npienso  todo  por  ti.  Por  eso  “los  niños  con  padres  sobreprotectores desarrollan menos competencias emocionales  y a la larga son más inseguros”, dice Silvia Álava, autora del  libro  Queremos hijos felices.  Mi hija es una desconsiderada  —Doctor César, ¿qué se hace cuando una hija es muy  grosera y desconsiderada con su madre? Y además su  madre lo único que ha hecho es darle amor, cuidados y  lo necesario para que nada le falte.  Preguntó una señora de aproximadamente 40 años  casi al finalizar una conferencia en Colima, México.  —¿Qué tipo de grosería señora y cuál es la edad de  la hija?  —Pues es muy grosera. Le aventó a su mamá hoy la  sopa caliente que con tanto amor le hice, perdón, —dijo  —le hizo su mamá y le ocasionó una quemadura en su  cuello y en uno de sus brazos —lo dijo señalándose su  propio cuello y su brazo enrojecido.  —¿Sabe usted qué edad tiene esa hija?  —Tiene 14 años doctor.  Toda la gente en la sala hizo un sonido de asombro y  rechazo ante lo que esta madre desesperada decía.  Al cuestionarle cuál fue la razón por la que la hija de  esa señora había reaccionado de forma tan inaceptable  contestó que fue porque no quería bajar de su recámara  a la cocina a comer y ella abnegadamente le llevó el  plato a su cuarto donde pasa horas y horas encerrada  conectada a su celular.  —Señora y ¿quién le compra ropa a esa niña?  —Pues yo, ah no, perdón, su mamá —dijo con cara  compungida.  —¿Quién le compró su celular y su computadora? \n—Su mamá, doctor.  —¿Quién le compra los calzones a esa niña grosera?  Ya mejor no contestó nada, sólo agachó su cabeza  con  la  presencia  de  algunas  canas  prematuras  —me  imagino  recientes—  por  la  mortificación  que  le  ocasionaba la hija.  Mi respuesta fue directa y sin tapujos.  —Perdón por la comparación, señora, pero cuando  alguien saca a pasear a un perro con su correa y ese  perro se pone inquieto y quiere correr hacia un punto de  riesgo, ¿qué se hace? —pregunté.  —Pues  se  le  estira  la  correa  para  que  vea  quién  manda —contestó alguien de la sala.  —Efectivamente. Se le jala la cuerda para que no  haga lo que le dé su regalada gana. Señora bonita, hay  que jalarle la cuerda a esa niña y quitarle beneficios que  no  valora.  Siempre  he  creído  que  normalmente  las  únicas obligaciones que tienen los hijos es estudiar y  respetar a su familia.  —Se debe castigar a esa niña —gritó una mujer al  fondo de la sala.  —¿Castigar? Cuando uno castiga a un hijo, el malo  de la película  es uno. La palabra más adecuada  para  substituir  la  palabra  castigo  es  “consecuencia”.  La  consecuencia de tu lamentable acción es ésta... y se dice  cuál es.  —¿Qué es lo que más valora esa hija? Su celular, su  tablet,  su  computadora.  No  se  valora  lo  que  se  tiene  hasta que no está. Se guarda el celular por unos días  para que valore tantos beneficios que obtiene sin pagar  una cuota mínima de respeto.  —¡No!, ¡no! pobrecita... No lo aguantaría —dijo la  misma mujer que, me imagino, o estoy seguro, es la  madre.  “¿No aguantaría?”, pensé, pero bien que aguanta ella  esas faltas de respeto de parte de su hija.  Hay  acciones  inaceptables  y  una  de  ellas \nindiscutiblemente es la agresividad de un hijo hacia sus  padres.  ¿Qué tipo de futuro se visualiza en esa relación?  Si a sus 14 años es capaz de aventarle un plato de  sopa caliente, ¿de qué más será capaz la susodicha?  El que calla otorga y al callar sin consecuencia una  acción de esta magnitud estás otorgando el derecho a  que  lo  siga  realizando  pero  cada  vez  con  mayor  intensidad.  Todo  inicia  con  faltas  de  respeto  sutiles.  Se  ha  confundido la palabra libertad con libertinaje.  La  psicóloga  y  autora  Madeline  Levine  define  el  problema  de  la  sobreprotección como un problema contemporáneo. Mientras que antes  los padres de familia se ocupaban de ganarse la vida, ahora han firmado  para  un  nuevo  empleo:  el  de  ser  papá  y  mamá  de  tiempo  completo.  “Vivimos  en  una  sociedad  niñocentrista”,  afirma  Levine,  enfatizando  cómo los hijos se han vuelto objetos de nuestra obsesión.  ¿Cómo  saber  si  eres  culpable?  Según  la  psicóloga  eres  un  padre  helicóptero si te involucras en hacer lo que tu hijo puede hacer o lo que  casi puede hacer, y cuando confundes sus necesidades con las tuyas, es  decir, cuando intervienes motivado por tu propio ego.  El activista Joe Frost lo resume de forma brillante: “En el mundo real,  la vida está llena de riesgos —financieros, físicos, emocionales, sociales  — y tomar riesgos razonables es esencial para el desarrollo sano de los  niños.”  Podríamos decir que los riesgos y límites son como vacunas. Pequeñas  dosis de problemas que duelen al inicio pero que protegen a la larga. La  falta de exposición a riesgos es en sí uno de los riesgos más grandes para  nuestros hijos, pues serán indiferentes a los retos y peligros que les depara  el futuro. Asimismo, la ausencia de límites es en sí una de las limitantes  más  grandes,  ya  que  no  tendrán  una  idea  correcta  sobre  los  retos  y  peligros del porvenir.  Tras leer estas líneas, podemos vernos tentados a recurrir al extremo  opuesto. Si ese ambiente esterilizado y libre de contingencias no trae \nconsigo  los  mejores  resultados,  entonces  sembremos  uno  lleno  de  dificultades y duros castigos para curtirlos desde pequeños, ¿cierto?  ¡Falso! Pongamos de ejemplo una práctica que polariza los ánimos:  las  nalgadas.  Aunque  para  algunos  padres  sea  escandaloso  y  en  mi  relación con mis hijos jamás recurrí ni recomendé esa técnica, las pruebas  nos dicen que, aun venido un poco a menos, sigue siendo un recurso  empleado por la mayoría. Según cifras de la Unicef, 60% de los niños a  nivel mundial recibe castigo físico de sus padres, y la mayoría en forma  de nalgadas.  ¿Qué  tanto  funcionan  las  nalgadas?  Investigadores  de  las  universidades  de  Texas  y  Michigan  se  dieron  a  la  tarea  de  revisar  la  evidencia científica para desentrañar la respuesta. 99% de los casi 80  estudios  que  revisaron  notó  una  asociación  entre  las  nalgadas  y  un  perjuicio para quienes las reciben. Producen en los niños efectos como  agresividad, comportamiento antisocial, problemas mentales y de salud,  merma de habilidades cognitivas y baja autoestima.  ¿Dónde nos deja esto? Para aclarar los nubarrones de esta encrucijada  recurramos a una valiosa distinción de Nancy Darling. Esta profesora de  la universidad de Oberlin College tiende puentes entre los conceptos de  disciplina y autoridad, por un lado, y de castigo y autoritarismo, por otro.  Explica que el estilo de crianza de autoridad se enfoca en enseñar y  guiar a los niños. Por el contrario, los padres que adoptan el estilo de  autoritarismo ejercen el control a través del poder y la coerción. Imponen  su  voluntad  sobre  los  niños,  sin  considerar  siquiera  la  opinión  o  capacidades de juicio de estos. Mientras que en el primero se concilia una  disciplina  con  base  en  el  diálogo,  en  el  segundo  se  considera  la  obediencia a la autoridad como un valor importante.  La investigadora concluye que curiosamente los padres de autoridad  tienden a ser más estrictos y consistentes que los autoritarios. Implantan \nun  reglamento  más  corto  pero  lo  aplican  mejor.  Y  aunque  los  hijos  criados con ambos estilos tienden a comportarse y lograr sus metas de  forma similar, los hijos de padres autoritarios tienden a desarrollar más  problemas de depresión y autoestima que los basados en la autoridad.  Todo se resume en un solo principio: ¿Soltar o apretar las riendas?  ¡He ahí el dilema del padre de familia! Yo le creo a Aristóteles cuando  dijo: “La virtud es un justo medio entre dos extremos.” Ni tiranos ellos ni  tiranos  nosotros.  Los  padres  sí  somos  autoridades,  sin  duda,  pero  esa  autoridad nos la confiere nuestra experiencia y no la pura jerarquía. No  olvidemos empuñar el amor como principio rector de nuestras decisiones.  Con todo esto en mente, sabremos con más precisión las acciones que  amerita cada caso, con la meta de criar hijos felices ahora pero también  armados de las competencias para procurarse esa felicidad en el futuro.  El éxito es un verbo, no un sustantivo  Rodolfo  y  Federico,  misma  edad,  mismo  colegio,  misma  colonia,  la  misma cantidad de hermanos pero diferente formación.  Mi  amigo  Rodolfo  Posadas  tuvo  unos  padres  de  los  que  podría  etiquetar en muchos aspectos admirables. Médicos exitosos los dos, un  matrimonio que a vista de todos podría ser nombrado como ejemplar.  La  forma  de  motivación  de  sus  padres  era  a  través  del  elogio  al  esfuerzo que hacía.  Gran diferencia existe entre felicitar el esfuerzo a felicitar por una  excelente  calificación  ante  los  resultados  de  sus  exámenes  que  generalmente oscilaban entre 95 a 100.  Fui testigo en varias ocasiones, ya que durante mi infancia y juventud  convivía  con  la  familia  de  Rodolfo  y  veía  cómo  los  padres  tenían  la  capacidad de escuchar activamente, aunque ambos trabajaban durante 8  horas diarias.  Rodolfo se caracterizó por tener las mejores calificaciones durante la  etapa escolar y posteriormente en su etapa como estudiante de medicina.  Amante del deporte, con valores y principios que hasta la fecha sigue  predicando con el ejemplo.  Hoy, al igual que sus padres, es un médico exitoso con especialidad de  neumología y trasplante de pulmón, con familia unida y amante de la  naturaleza, al igual que un servidor. \nRodolfo  es  de  esos  amigos  que  llegaron  a  mi  vida  para  tocarla  favorablemente,  con  su  paciencia  al  ayudarme  a  retomar  un  hábito  adecuado de estudio.  La  carrera  de  medicina  no  fue  nada  fácil  para  mí.  Aunque  mi  promedio final fue de 89, tengo que decir que me costó muchísimo y mi  amigo Rodolfo fue causante de gran parte de mi éxito.  Gracias amigo, por siempre estar ahí.  Por otro lado, Federico, (nombre que por razones obvias modifiqué),  sus padres eran —porque ya murieron los dos— autoritarios, agresivos y  exigentes.  En varias ocasiones veíamos algunos compañeros y yo cómo al llegar  a su casa lo esperaban con el cinto en la mano para propinarle tremenda  golpiza al enterarse que había reprobado alguna calificación. A su padre  le tenía sin cuidado que fuéramos testigos de esa escena lamentable.  Su madre tomaba el rol de sumisión a lo que su marido decía o hacía y  rara vez se involucraba en los castigos que el padre ponía para  enderezar  el camino de Federico y sus hermanos.  Los gritos neuróticos del padre se escuchaban a distancia.  “¡¿Por qué reprobaste?!”  “¡¿Para eso me parto el lomo?! ¡¿Así pagas todo lo que hago para que  tengas de tragar y estés en uno de los mejores colegios de Monterrey?!”  “¡¿Hay cerebro ahí adentro?! ¿O hay sólo caca?”  Sigo escuchando esos gritos ocasionalmente, sobre todo cuando me  toca  presenciar  ese  tipo  de  violencia  que  en  pleno  siglo  XXI  utilizan  algunos padres con sus hijos buscando  corregirlos  para que sean exitosos,  o como he escuchado, para que sean  alguien  en la vida, como si desde la  concepción no fueran nadie.  Me  duele  cuando  veo  a  madres  gritarles  a  sus  hijos  en  centros  comerciales. Apretarles o pellizcarles el brazo con su respectiva mirada  de desaprobación o furia hacia un niño indefenso que desean que piense o  actúe como adulto.  No  existe  un  manual  cien  por  ciento  efectivo  que  nos  diga  cómo  proceder  ante  diferentes  situaciones,  pero  menos  porque  cada  hijo  es  diferente y las circunstancias que se viven también.  NO PUEDO TERMINAR ESTE RELATO SIN COMPARTIR UNA \nFRASE QUE ENCIERRA TANTA SABIDURÍA: “EL  AGRADECIMIENTO ES LA MEMORIA DEL CORAZÓN.” Y  NUNCA ES TARDE PARA AGRADECER A QUIENES DEBEMOS  UN AVANCE SIGNIFICATIVO EN NUESTRAS VIDAS.  El eterno debate es si una persona exitosa nace o se hace; si la ventaja  congénita es suficiente o si en el camino se recoge de a poco el triunfo.  Una cosa es cierta: si el virtuoso por naturaleza no pule y encamina su  talento, su potencial quedará desperdiciado como diamante en bruto.  Un verbo implica acción, movimiento. Un sustantivo es fijo, inmóvil.  Cualesquiera  que  sean  las  ventajas  o  desventajas  al  comienzo  de  la  carrera de la vida, la noción de éxito merece la categoría de verbo porque  de nada sirve tener trazados los caminos si no se recorren con todo y sus  obstáculos y posibles desviaciones.  Así  parece  comprobarlo  la  ciencia.  Carol  Dweck,  profesora  de  la  Universidad de Stanford, es experta en el tema. En uno de sus estudios,  por ejemplo, aplicó pruebas de coeficiente intelectual a niños de quinto  grado. Luego de revisarlas, dividieron a los estudiantes en grupos para  darles  una  retroalimentación  variada:  a  algunos  los  felicitaron  por  el  esfuerzo  que  les  tomó  (diciéndoles  “seguro  trabajaste  muy  duro  para  lograrlo”) y a otros por su inteligencia (“seguramente eres muy listo”).  Luego,  les  aplicaron  otras  pruebas  similares  y  el  resultado  fue  sorprendente: aquellos que fueron alabados por su esfuerzo en el primer  examen mejoraron sus calificaciones cerca de 30% y quienes recibieron  felicitaciones  por  su  inteligencia  empeoraron  las  suyas  en  20%,  aproximadamente.  La  investigadora  ha  descubierto  que  el  elogio  al  talento  o  a  la  inteligencia crea hijos con menos motivación por aprender, incluso hijos  que rehúyen los retos y son menos resilientes de cara a las dificultades de  la vida.  La  clave  está  en  enfocarse  en  el  proceso:  “Cuando  los  niños  son  elogiados  por  el  proceso  en  el  que  participan  —su  trabajo  duro,  sus  estrategias,  su  enfoque,  su  persistencia—  entonces  mantienen  su  motivación  por  el  aprendizaje.  Son  más  propensos  a  tomar  retos  y  a  crecer frente a las dificultades”, declara Dweck, quien también lo resume  de  esta  manera:  plantemos  en  nuestros  hijos  una  mentalidad  de \ncrecimiento, no una mentalidad fija.  Angela Duckworth, investigadora de la Universidad de Pensilvania, es  autora del libro  Grit: el poder de la pasión y la perseverancia. Grit  es una  palabra que engloba características como determinación, coraje y agallas.  Duckworth ha investigado por años esta actitud y la destaca como uno de  los principales precursores para el éxito, por encima de otros como el  coeficiente intelectual, las calificaciones en los exámenes de admisión y  hasta la condición física. La define como la tendencia de mantener interés  y esfuerzo hacia metas de largo plazo.  Para  desarrollar  esta  determinación  se  requiere  encontrar  y  profundizar una pasión lo suficiente como para cultivar las energías que  nos permitan seguir y seguir, sin importar los obstáculos en el camino.  Esta fuerza de voluntad y de resiliencia es la gasolina que nos lleva al  éxito.  Con esto en mente, la investigadora recomienda un estilo de crianza  que  sea  tan  demandante  como  asistente;  que  exija  mucho  pero  que  respalde igual.  “Si los padres son cálidos y amorosos, los niños tienden a sentirse  amados. El respeto, o lo que la literatura de crianza llama  apoyo a la  autonomía,  también es esencial. Es cuando los padres permiten a sus hijos  tomar  sus  propias  decisiones  en  cuanto  sean  capaces  de  hacerlo”,  concluye Duckworth.  Es un caso similar al de la tortuga y la liebre. Por más genio que sea tu  hijo, si se tira a la hamaca, será rebasado por los que siguen caminando y  viendo con firmeza lo que tienen por delante. Privilegiemos el hambre de  éxito y aprendizaje.  Niños bajo (auto) control  La  inocencia  infantil  tiene  sus  pros  y  sus  contras.  El  lado  luminoso  significa para un niño ser ajeno a los vicios de la sociedad y, por tanto,  echar a andar su imaginación y su capacidad de asombro. El lado oscuro  vierte su sombra con el desconocimiento que tienen de sus emociones y  de los comportamientos en los que se transforman.  Como padres de familia podemos ayudar a que nuestros hijos echen  luz sobre esa oscuridad, por más negra que parezca (créeme, ¡lo sé de  primera  mano!).  Siguiendo  con  la  metáfora,  en  vez  de  tratar  de \nalumbrarlos una que otra vez, es mejor darles una lámpara y enseñarles el  valor de activarla a lo largo de sus vidas.  Daniel  Goleman  ha  estudiado  el  fenómeno  de  la  inteligencia  emocional y el autocontrol, por décadas. Destaca el poder de la atención  selectiva,  la  capacidad  que  tenemos  para  decidir  deliberadamente.  Mientras  ese  poder  es  la  luz  de  la  que  hablamos,  la  oscuridad  es  el  inconsciente,  esa  parte  visceral  que  nos  hace  reaccionar  y  actuar  en  automático.  El psicólogo explica que la atención selectiva regula las emociones; es  una forma de imprimir calma aun rodeado de una atmósfera de agitación.  Vemos sus maravillas en acción cuando calmamos el llanto de un niño,  desviándolo  del  dolor  y  del  miedo  por  medio  de  un  distractor.  Esa  atención vaciada sobre cualquier objeto —en esos casos, un pájaro, un  juguete, un dulce— les devuelve el control.  La idea clave por transmitirles es que centren su atención en algo que  ocurra aquí y ahora, como su respiración, algún sonido o alguna vista.  Cuando encuentren una situación que sea retadora o de plano avasallante,  este  acto  los  anclará  para  que  no  se  dejen  llevar  por  el  momento  y  cometan errores de juicio.  La  repetición  de  este  ejercicio  se  volverá  un  hábito,  y  este  hábito  dejará una huella indeleble que condicionará su comportamiento a futuro.  Es como un músculo bien entrenado. Por algo dice Goleman que cuanto  antes, mejor. Dado que el cerebro es el último órgano del cuerpo humano  en alcanzar su madurez y que tiene su mayor potencial de plasticidad en  la infancia, los primeros años de vida son trascendentales para fortalecer o  disolver las redes neuronales que definirán los pensamientos, emociones  y comportamientos en el resto de su vida.  Si sembramos la semilla en la fertilidad de sus primeros años, nuestros  hijos serán expertos en el autocontrol. Esto significa que serán menos  impulsivos y más conscientes; menos viscerales y más listos. ¡Zas!  Imagina el valor que regalarás a tu hijo si lo logras. En un mundo  seducido  por  las  distracciones  digitales,  el  consumismo  y  el  placer  inmediato,  criarás  a  una  persona  de  alta  resistencia,  que  no  se  doble  fácilmente  por  las  tentaciones,  y  mantenga  con  plena  consciencia  sus  prioridades y convicciones.  La crianza es un acto de amor y el amor puede tomar muchos rostros.  Es un sentimiento que, con la guía de la razón, debe concebirse en el \nlargo plazo, no sólo en el corto; debe apreciarse en toda su amplitud sin  cegarnos por el caso en turno. El arte de la crianza es expresar el amor en  sus  distintas  formas:  desde  el  beso  y  el  abrazo  hasta  la  firmeza  y  la  disciplina.  Si logras esto en tus hijos es gracias a tu actitud, pues “de tal palo tal  astilla”.  Si  tienes  una  actitud  adecuada  frente  a  los  hechos  tus  hijos  también la aprenderán, ya lo dice el dicho: “Hijo de tigre, pintito.”  ASÍ QUE YA SABES, CAMBIA DE ACTITUD Y LO DEMÁS  LLEGARÁ POR AÑADIDURA. \nEPÍLOGO  Ya lo sabes: ¡actitud positiva, con todo y en todo!  Sólo unas palabras para agradecerte el tiempo que dedicaste a la lectura  de este libro que hice con mucho cariño y convicción. Más que en mis  anteriores publicaciones me metí a conciencia en estudios recientes sobre  el bienestar, la felicidad y la actitud positiva porque creo que mereces una  vida sana, duradera y llena de alegría.  Consulté  muchos  estudios,  leí  muchas  investigaciones,  traté  de  acercarte las complicadas páginas de médicos y científicos de manera  sencilla, sin términos raros e impenetrables. Hoy más que nunca, a pesar  de las dificultades cotidianas y las crisis que amenazan al mundo y a  nuestra vida diaria, tenemos que responder con buena vibra y una sonrisa  a  las  dificultades,  sé  que  a  veces  no  es  fácil  y  las  pruebas  son  muy  dolorosas, sé que el costo por una vida de bienestar y comodidades a  veces es muy alto, pero qué tal si empezamos por querernos más, por  amarnos más —con todo y nuestros momentos malos donde sacamos a la  bestia  que  llevamos  dentro  a  pasear  por  la  ciudad,  pensando  ingenuamente que es la bella en su momento de esplendor—, qué tal si  empezamos por aceptar nuestros errores sin disputas ni corajes, qué tal si  a partir de hoy hacemos de la actitud positiva una característica de nuestra  personalidad, para que los demás nos vean y la sonrisa sea franca.  Siempre  será  mejor  dar  un  abrazo  para  celebrar,  que  de  pésame,  siempre será mejor mirar el cielo para saber qué tanto volaremos, en lugar  del suelo para saber dónde nos caeremos.  Lo importante es tenerlo siempre claro: si queremos que nuestra vida  sea mejor, empecemos por pequeños cambios que harán grandes cosas y,  sí, sin duda, con todo y en todo mantener una actitud positiva.  Mil gracias querida lectora, querido lector, se les quiere, y mucho. \nLA FELICIDAD ESTÁ EN TU INTERIOR  Siempre quise publicar en un solo libro las investigaciones  de las universidades de mayor prestigio en el mundo, sobre  temas relacionados con la actitud y cómo influye para bien o  para mal en los seres humanos.  Por eso, este libro contiene la información necesaria para  motivarte  a  hacer  un  cambio  urgente  de  actitud  y  sobre  los  grandes  beneficios que obtendrás al tomar esta decisión. Aquí te presento pruebas  impactantes de cómo los corajes, los celos, el resentimiento, el estrés y la  falta  de  ejercicio  te  acercan  a  la  enfermedad  o  al  envejecimiento  prematuro.  ¿De verdad la preocupación nos acerca a lo que no deseamos? ¿Es mejor  solo que mal acompañado? ¿Nos enamoramos con el cerebro o con el  corazón? ¿Existen pruebas de que cuando rezo por alguien o le deseo  bien, cambia su vida favorablemente? ¿La actitud positiva y la negativa se  contagian? ¿El sufrimiento se puede convertir en adicción? ¿Es verdad  que  la  sobreexposición  a  las  redes  sociales  afecta  nuestra  estima?  ¿Nuestros pensamientos influyen para preservar nuestra salud y nuestra  juventud?  Todas las respuestas y mucho más encontrarás en este libro basado en los  aportes  de  la  ciencia  más  avanzados.  Además  de  las  revelaciones  científicas, la experiencia médica y maravillosas anécdotas divertidas que  se convierten en lecciones de vida. \nCésar Lozano  es médico cirujano egresado de la Universidad Autónom     function getAvatarUrl(type) {
        const fallbackSvg = function(letter) {
            return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#6c757d"/><text x="50" y="68" text-anchor="middle" fill="#fff" font-size="44" font-family="system-ui,sans-serif">' + letter + '</text></svg>');

    }

    // Theme and palette
